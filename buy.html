async function getUsername(id){if(!id)return"User";id=String(id);if(usernameCache.has(id))return usernameCache.get(id);const{data}=await sb.from("profiles").select("username").eq("id",id).maybeSingle();if(data?.username)usernameCache.set(id,data.username);return data?.username||"User"}
async function loadOfferUsernames(){const ids=[...new Set(availableOffers.map(o=>o.user_id).filter(Boolean).map(String))],missing=ids.filter(id=>!usernameCache.has(id));if(!missing.length)return;const{data}=await sb.from("profiles").select("id,username").in("id",missing);(data||[]).forEach(p=>p.id&&p.username&&usernameCache.set(String(p.id),p.username))}
function status(s){return String(s||"").trim().toLowerCase()}function finished(t){return["completed","released","cancelled","expired","closed"].includes(status(t?.status))}function pair(){return $("marketPair")?.value||"USDT_ETB"}function currency(){return pair().split("_")[0]||"USDT"}
async function loadPendingTrades(ids){pendingTrades.clear();if(!ids.length)return;const{data,error}=await sb.from("p2p_trades").select("id,order_id,buyer_id,seller_id,amount,status,payment_confirmed,expires_at,created_at").in("order_id",ids);if(error){console.error(error);return}(data||[]).forEach(t=>{if(t.order_id&&!finished(t)){const k=String(t.order_id),old=pendingTrades.get(k);if(!old||Date.parse(t.created_at||"")>Date.parse(old.created_at||""))pendingTrades.set(k,t)}})}
async function loadBuyMarket(){if(!currentUser||isLoading)return;isLoading=true;$("offers").innerHTML='<div class="empty">Loading available offers...</div>';try{const{data,error}=await sb.from("p2p_orders").select("*").eq("order_type","sell").eq("pair",pair()).in("status",["active","open"]).neq("user_id",currentUser.id).order("created_at",{ascending:false});if(error)throw error;const orders=(data||[]).filter(o=>String(o.user_id)!==String(currentUser.id)&&String(o.pair||"").toUpperCase()===pair()&&["active","open"].includes(status(o.status)));await loadPendingTrades(orders.map(o=>o.id));availableOffers=orders.filter(o=>amount(o)>0||pendingTrades.has(String(o.id)));availableOffers.sort((a,b)=>{const x=Number(a.price),y=Number(b.price);return Number.isFinite(x)&&Number.isFinite(y)&&x!==y?x-y:(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0)});await loadOfferUsernames();searchAmount()}catch(e){availableOffers=[];filteredOffers=[];$("offers").innerHTML=empty("⚠️","Could not load available sell.",err(e))}finally{isLoading=false}}
function amount(o){if(!o)return 0;for(const v of[o.remaining_amount,o.available_amount,o.remaining])if(v!==null&&v!==undefined&&v!==""){const n=Number(v);if(Number.isFinite(n)&&n>=0)return n}const n=Number(o.amount);return Number.isFinite(n)&&n>=0?n:0}
function searchAmount(){const v=Number($("usdtSearch").value);filteredOffers=$("usdtSearch").value.trim()&&Number.isFinite(v)&&v>0?availableOffers.filter(o=>amount(o)>=v||pendingTrades.has(String(o.id))):[...availableOffers];offersExpanded=false;$("offerCount").textContent=filteredOffers.length;render()}
function render(){const box=$("offers");if(!filteredOffers.length){box.innerHTML=$("usdtSearch").value.trim()?empty("🔎","No sell available for this amount.","Try a smaller amount."):empty("","No available sell.","Available offers will appear here.");updateView();return}box.innerHTML="";(offersExpanded?filteredOffers:filteredOffers.slice(0,15)).forEach(o=>{if(String(o.user_id)===String(currentUser.id))return;const p=pendingTrades.get(String(o.id)),mine=p&&String(p.buyer_id)===String(currentUser.id),u=usernameCache.get(String(o.user_id))||"Seller",a=amount(o),show=a>0?a:Number(p?.amount)||0,c=document.createElement("div");c.className="offer-card";c.innerHTML=`<div class="offer-main"><button type="button" class="offer-user-button" onclick="viewUser('${js(o.user_id)}')">👤 ${html(u)}</button><div style="margin-top:10px"><div style="color:#7b8790;font-size:10px">${currency()}</div><div class="offer-amount">${html(formatAmountValue(show,o))}</div></div><div style="margin-top:8px"><div style="color:#7b8790;font-size:10px">Price</div><div class="offer-price">${money(o.price)} ETB</div></div><div class="offer-method">Payment: ${html(o.payment_method||"Bank Transfer")}</div>${p?`<div class="pending-badge">⏳ ${html(pendingText(p))}</div>`:""}${p?`<button type="button" class="offer-trade pending" onclick="${mine?`openExisting('${js(p.id)}','${js(o.user_id)}')`:"pendingNotice()"}">${mine?"Continue Trade":pendingText(p)}</button>`:`<button type="button" class="offer-trade" onclick="openTrade('${js(o.id)}')">Buy</button>`}</div>`;box.appendChild(c)});updateView()}
function pendingText(t){const s=status(t?.status);return t?.payment_confirmed||s==="paid"||s==="payment_confirmed"?"Payment Confirmed":s==="disputed"?"Trade Disputed":"Pending Payment"}
function updateView(){const b=$("offerViewButton");if(filteredOffers.length<=15){b.style.display="none";return}b.style.display="block";b.textContent=offersExpanded?"Show 15":"View All"}
function toggleOffers(){offersExpanded=!offersExpanded;render()}function pendingNotice(){toast("Pending Payment: this sell offer already has an active trade.","warning")}function viewUser(id){if(id)location.href="user_profile.html?user_id="+encodeURIComponent(id)}
async function openExisting(tradeId,sellerId){const u=await getUsername(sellerId),p=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});if(u)p.set("username",u);location.href="message.html?"+p}
async function openMessages(tradeId,offer){if(!tradeId||!offer?.user_id){toast("Trade started, but seller information is missing.","error");return}try{const seller=offer.user_id;let{data:c,error}=await sb.from("conversations").select("id").eq("user_one",currentUser.id).eq("user_two",seller).maybeSingle();if(error)throw error;if(!c){const r=await sb.from("conversations").select("id").eq("user_one",seller).eq("user_two",currentUser.id).maybeSingle();if(r.error)throw r.error;c=r.data}if(!c){const r=await sb.from("conversations").insert({user_one:currentUser.id,user_two:seller}).select("id").single();if(r.error)throw r.error;c=r.data}const{data:old,error:me}=await sb.from("messages").select("id").eq("conversation_id",c.id).eq("sender_id",currentUser.id).eq("message_type","order").eq("order_id",tradeId).maybeSingle();if(me)throw me;if(!old){const{error:e}=await sb.from("messages").insert({conversation_id:c.id,sender_id:currentUser.id,content:" P2P Buy started. Please complete the payment for this trade.",message_type:"order",order_id:tradeId});if(e)throw e}const u=await getUsername(seller),p=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});if(u)p.set("username",u);location.href="message.html?"+p}catch(e){toast("Trade started, but the P2P trade message could not be created: "+err(e),"error")}}
function openTrade(id){selectedOffer=availableOffers.find(o=>String(o.id)===String(id));if(!selectedOffer){toast("This available sell is no longer available. Refresh.","warning");return}if(String(selectedOffer.user_id)===String(currentUser.id)){toast("You cannot buy your own sell offer.","warning");return}const p=pendingTrades.get(String(selectedOffer.id));if(p){String(p.buyer_id)===String(currentUser.id)?openExisting(p.id,selectedOffer.user_id):pendingNotice();return}const a=amount(selectedOffer);if(!a){toast("This available sell has no remaining amount.","warning");return}const cur=currency(),parts=pairParts(selectedOffer.pair);$("tradeTitle").textContent="Buy "+cur+" from Seller";$("tradeCurrency").textContent=cur;$("tradeAmount").value=a.toFixed(2);$("tradeAmount").min="1";$("tradeAmount").max=a.toFixed(2);$("tradeSummary").innerHTML=`<div class="details" style="margin-bottom:12px">${detail("Seller",usernameCache.get(String(selectedOffer.user_id))||"Seller")}${detail("Pair",pairName(selectedOffer))}${detail("Selling price",money(selectedOffer.price)+" "+parts.quote)}${detail("Payment",selectedOffer.payment_method||"Bank Transfer")}${detail("Available",formatAmount(selectedOffer))}</div>`;updatePreview();openModal("tradeModal")}
function pairParts(p){p=String(p||"").trim().toUpperCase().replace("/","_").split("_");return{base:p[0]||"USDT",quote:p[1]||"ETB"}}function pairName(o){const p=String(o?.pair||"");return p.includes("_")?p.replace("_"," / "):p||"P2P"}function tradeValue(){return selectedOffer?(Number($("tradeAmount").value)||0)*(Number(selectedOffer.price)||0):0}

async function submitTrade(){if(actionLoading||!selectedOffer||!currentUser)return;const button=$("tradeSubmitButton"),a=Number($("tradeAmount").value),available=amount(selectedOffer);if(!Number.isFinite(a)||a<=0){toast("Invalid amount.","warning");return}if(a>available){toast("Amount exceeds available amount.","warning");return}if(Math.abs(a-available)>0.01){toast("You must buy the full available amount.","warning");$("tradeAmount").value=available.toFixed(2);updatePreview();return}if(!confirm("Buy the full available amount of "+currency()+" from the seller?"))return;actionLoading=true;button.disabled=true;button.textContent="Starting...";try{const{data:latest,error:oe}=await sb.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();if(oe)throw oe;if(!latest||!["active","open"].includes(status(latest.status))||amount(latest)<a)throw new Error("This available sell is no longer available.");const{data,error}=await sb.rpc("create_p2p_trade",{p_order_id:selectedOffer.id,p_amount:a});if(error)throw error;const tradeId=extract(data);if(!tradeId)throw new Error("Trade started, but the trade ID was not returned.");const offer=selectedOffer;closeModal("tradeModal");selectedOffer=null;toast("Buy trade started successfully.","success");await loadBuyMarket();await openMessages(tradeId,offer)}catch(e){toast(err(e),"error")}finally{actionLoading=false;button.disabled=false;button.textContent="Start Trade"}}
function extract(d){if(d==null)return null;if(typeof d==="string"||typeof d==="number")return d;if(typeof d==="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id}
function formatAmountValue(n,o){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:6})+" "+(String(o?.pair||"").split("_")[0]||"USDT")}function formatAmount(o){return formatAmountValue(amount(o),o)}function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00"}function detail(l,v){return`<div class="detail-row"><span>${html(l)}</span><strong>${html(v??"")}</strong></div>`}function empty(i,t,m){return`<div class="empty"><div class="empty-icon">${html(i)}</div><strong>${html(t)}</strong>${m?`<div style="margin-top:7px">${html(m)}</div>`:""}</div>`}function html(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}function err(e){return e?.message||e?.details||e?.hint||"Something went wrong."}function openModal(id){$(id)?.classList.add("show")}function closeModal(id){$(id)?.classList.remove("show")}

function setupRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("buy-market-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},loadBuyMarket).subscribe();if(tradeRealtimeChannel)sb.removeChannel(tradeRealtimeChannel);tradeRealtimeChannel=sb.channel("buy-trades-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},loadBuyMarket).subscribe()}
