<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Social Icon Generator</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f7f8;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 30px 20px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

h1 {
  margin: 0 0 8px;
  color: #172033;
}

p {
  color: #7b8491;
  font-size: 14px;
  margin-bottom: 25px;
}

button {
  width: 100%;
  border: 0;
  padding: 16px;
  margin-top: 10px;
  border-radius: 14px;
  background: #087f73;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</style></head><body><div class="container">  <h1>P2P Social</h1>  <p>Create your PNG app icons</p>  <button onclick="makePNG(192)">
    Create icon-192.png
  </button>  <button onclick="makePNG(512)">
    Create icon-512.png
  </button></div><script>

function makePNG(size) {

  const canvas = document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const s = size / 192;

  /* Background */

  const gradient = ctx.createLinearGradient(
    0,
    0,
    size,
    size
  );

  gradient.addColorStop(0, "#064e46");
  gradient.addColorStop(1, "#10a889");

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.roundRect(
    0,
    0,
    size,
    size,
    48 * s
  );

  ctx.fill();


  /* White P shapes */

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 15 * s;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";


  /* LEFT P */

  ctx.beginPath();

  ctx.moveTo(
    40 * s,
    145 * s
  );

  ctx.lineTo(
    40 * s,
    47 * s
  );

  ctx.lineTo(
    70 * s,
    47 * s
  );

  ctx.arc(
    70 * s,
    72 * s,
    25 * s,
    -Math.PI / 2,
    Math.PI / 2
  );

  ctx.lineTo(
    40 * s,
    97 * s
  );

  ctx.stroke();


  /* RIGHT P */

  ctx.beginPath();

  ctx.moveTo(
    152 * s,
    47 * s
  );

  ctx.lineTo(
    122 * s,
    47 * s
  );

  ctx.arc(
    122 * s,
    72 * s,
    25 * s,
    -Math.PI / 2,
    Math.PI / 2,
    true
  );

  ctx.lineTo(
    152 * s,
    145 * s
  );

  ctx.stroke();


  /* CENTER WHITE CIRCLE */

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.arc(
    96 * s,
    96 * s,
    24 * s,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* CENTER GREEN DOT */

  ctx.fillStyle = "#087f73";

  ctx.beginPath();

  ctx.arc(
    96 * s,
    96 * s,
    8 * s,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* DOWNLOAD */

  const link =
    document.createElement("a");

  link.download =
    "icon-" + size + ".png";

  link.href =
    canvas.toDataURL("image/png");

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}

</script></body>
</html>
