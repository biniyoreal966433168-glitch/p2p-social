<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>P2P Social PNG Icon Generator</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#f4f7f8;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.12);
}

h1{
  font-size:24px;
  color:#172033;
  margin-bottom:8px;
}

.subtitle{
  color:#7b8491;
  font-size:13px;
  margin-bottom:25px;
}

.preview{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:25px;
}

/* =========================
   LOGO PREVIEW
========================= */

.logo{
  width:180px;
  height:180px;
  border-radius:55px;

  background:
    linear-gradient(
      135deg,
      #064e46,
      #10a889
    );

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
    0 15px 35px rgba(0,0,0,.18);
}

/* LEFT P */

.p-left{
  position:absolute;

  left:34px;
  top:42px;

  width:53px;
  height:96px;

  border:14px solid white;
  border-right:0;

  border-radius:30px 0 0 30px;
}

/* RIGHT P */

.p-right{
  position:absolute;

  right:34px;
  top:42px;

  width:53px;
  height:96px;

  border:14px solid white;
  border-left:0;

  border-radius:0 30px 30px 0;
}

/* CENTER */

.center{
  width:46px;
  height:46px;

  background:white;

  border-radius:50%;

  position:absolute;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:5;
}

/* CENTER DOT */

.dot{
  width:15px;
  height:15px;

  background:#087f73;

  border-radius:50%;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

.btn192{
  background:#087f73;
  color:white;
}

.btn512{
  background:#064e46;
  color:white;
}

.info{
  margin-top:18px;
  font-size:12px;
  color:#7b8491;
  line-height:1.5;
}
</style></head><body><div class="container">  <h1>P2P Social</h1>  <div class="subtitle">
    PNG App Icon Generator
  </div>  <div class="preview"><div class="logo" id="logo">

  <div class="p-left"></div>

  <div class="p-right"></div>

  <div class="center">
    <div class="dot"></div>
  </div>

</div>

  </div>  <div class="buttons"><button
  class="btn192"
  onclick="downloadIcon(192)">
  Save 192 × 192 PNG
</button>

<button
  class="btn512"
  onclick="downloadIcon(512)">
  Save 512 × 512 PNG
</button>

  </div>  <div class="info">
    Save both files in the same folder as your
    manifest.json file.
  </div></div><script>

function roundedRect(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(x+w,y+h-r);

  ctx.quadraticCurveTo(
    x+w,y+h,
    x+w-r,y+h
  );

  ctx.lineTo(x+r,y+h);

  ctx.quadraticCurveTo(
    x,y+h,
    x,y+h-r
  );

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(
    x,y,
    x+r,y
  );

  ctx.closePath();
}


/* =========================
   CREATE PNG
========================= */

function downloadIcon(size){

  const canvas =
    document.createElement("canvas");

  canvas.width = size;
  canvas.height = size;

  const ctx =
    canvas.getContext("2d");

  const scale = size / 180;


  /* BACKGROUND */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      size,
      size
    );

  gradient.addColorStop(
    0,
    "#064e46"
  );

  gradient.addColorStop(
    1,
    "#10a889"
  );

  ctx.fillStyle = gradient;

  roundedRect(
    ctx,
    0,
    0,
    size,
    size,
    55 * scale
  );

  ctx.fill();


  /* =========================
     LEFT P
  ========================= */

  ctx.strokeStyle = "white";
  ctx.lineWidth = 14 * scale;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();

  ctx.moveTo(
    34 * scale,
    138 * scale
  );

  ctx.lineTo(
    34 * scale,
    58 * scale
  );

  ctx.lineTo(
    62 * scale,
    58 * scale
  );

  ctx.quadraticCurveTo(
    82 * scale,
    58 * scale,
    82 * scale,
    78 * scale
  );

  ctx.quadraticCurveTo(
    82 * scale,
    98 * scale,
    62 * scale,
    98 * scale
  );

  ctx.lineTo(
    34 * scale,
    98 * scale
  );

  ctx.stroke();


  /* =========================
     RIGHT P
  ========================= */

  ctx.beginPath();

  ctx.moveTo(
    146 * scale,
    58 * scale
  );

  ctx.lineTo(
    146 * scale,
    138 * scale
  );

  ctx.moveTo(
    146 * scale,
    58 * scale
  );

  ctx.lineTo(
    118 * scale,
    58 * scale
  );

  ctx.quadraticCurveTo(
    98 * scale,
    58 * scale,
    98 * scale,
    78 * scale
  );

  ctx.quadraticCurveTo(
    98 * scale,
    98 * scale,
    118 * scale,
    98 * scale
  );

  ctx.lineTo(
    146 * scale,
    98 * scale
  );

  ctx.stroke();


  /* =========================
     CENTER CIRCLE
  ========================= */

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    90 * scale,
    90 * scale,
    23 * scale,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* CENTER DOT */

  ctx.fillStyle = "#087f73";

  ctx.beginPath();

  ctx.arc(
    90 * scale,
    90 * scale,
    7.5 * scale,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* =========================
     DOWNLOAD
  ========================= */

  const link =
    document.createElement("a");

  link.download =
    "icon-" + size + ".png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();
}

</script></body>
</html>
