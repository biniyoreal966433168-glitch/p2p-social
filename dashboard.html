<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>P2P Social Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      min-height: 100vh;
      color: #111827;
    }

    nav {
      background: #111827;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav strong {
      font-size: 20px;
    }

    #logout {
      background: #ef4444;
      border: none;
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.06);
    }

    .balance-card {
      background: #2563eb;
      color: white;
    }

    .balance {
      font-size: 38px;
      font-weight: bold;
      margin-top: 8px;
    }

    .label {
      color: #6b7280;
      font-size: 14px;
    }

    .balance-card .label {
      color: white;
      opacity: .9;
    }

    .row {
      margin-top: 14px;
    }

    .value {
      font-weight: bold;
      margin-top: 4px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.action {
      border: none;
      padding: 16px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .deposit {
      background: #16a34a;
    }

    .withdraw {
      background: #dc2626;
    }

    .buy {
      background: #2563eb;
    }

    .sell {
      background: #7c3aed;
    }

    #status {
      text-align: center;
      padding: 25px;
      color: #2563eb;
    }

    #error {
      display: none;
      margin: 20px;
      padding: 18px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 10px;
      line-height: 1.5;
    }

    @media(max-width:600px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }

  </style>

</head>


<body>

  <div id="status">
    Loading account...
  </div>

  <div id="error"></div>


  <div id="app" style="display:none;">

    <nav>

      <strong>
        P2P Social
      </strong>

      <button id="logout">
        Logout
      </button>

    </nav>


    <main class="container">


      <div class="card">

        <h1>
          Welcome, <span id="username">User</span> 👋
        </h1>

        <p style="margin-top:8px;color:#6b7280;">
          Your P2P Social account
        </p>

      </div>


      <div class="card balance-card">

        <div class="label">
          Available Balance
        </div>

        <div class="balance">
          <span id="balance">0.00</span> ETB
        </div>

      </div>


      <div class="card">

        <h2>
          Account Information
        </h2>

        <div class="row">

          <div class="label">
            Username
          </div>

          <div
            class="value"
            id="profileUsername"
          >
            -
          </div>

        </div>


        <div class="row">

          <div class="label">
            Email
          </div>

          <div
            class="value"
            id="email"
          >
            -
          </div>

        </div>

      </div>


      <div class="card">

        <h2 style="margin-bottom:15px;">
          Wallet
        </h2>

        <div class="buttons">

          <button
            class="action deposit"
            id="deposit"
          >
            💰 Deposit
          </button>

          <button
            class="action withdraw"
            id="withdraw"
          >
            💸 Withdraw
          </button>

        </div>

      </div>


      <div class="card">

        <h2 style="margin-bottom:15px;">
          P2P Trading
        </h2>

        <div class="buttons">

          <button
            class="action buy"
            id="buy"
          >
            🟢 Buy USDT
          </button>

          <button
            class="action sell"
            id="sell"
          >
            🔴 Sell USDT
          </button>

        </div>

      </div>


      <div class="card">

        <h2>
          📦 Orders
        </h2>

        <p style="margin-top:8px;color:#6b7280;">
          Your P2P orders will appear here.
        </p>

      </div>


      <div class="card">

        <h2>
          💬 Live Messages
        </h2>

        <p style="margin-top:8px;color:#6b7280;">
          Real-time P2P messages will appear here.
        </p>

      </div>


    </main>

  </div>


<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const app =
  document.getElementById("app");


function showError(message) {

  statusBox.style.display = "none";

  errorBox.style.display = "block";

  errorBox.textContent =
    message;

}


async function loadDashboard() {

  try {

    // ==============================
    // GET CURRENT USER
    // ==============================

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();


    if (error) {

      throw error;

    }


    const user =
      data.user;


    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    // ==============================
    // SHOW EMAIL
    // ==============================

    document.getElementById(
      "email"
    ).textContent =
      user.email || "-";


    // ==============================
    // GET PROFILE
    // ==============================

    const {
      data: profile,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "username, balance"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


    if (profileError) {

      throw profileError;

    }


    if (!profile) {

      throw new Error(
        "Your profile does not exist yet. Register a new account after creating the profiles table."
      );

    }


    // ==============================
    // USERNAME
    // ==============================

    const name =
      profile.username ||
      user.user_metadata?.username ||
      "User";


    document.getElementById(
      "username"
    ).textContent =
      name;


    document.getElementById(
      "profileUsername"
    ).textContent =
      name;


    // ==============================
    // BALANCE
    // ==============================

    const amount =
      Number(profile.balance || 0);


    document.getElementById(
      "balance"
    ).textContent =
      amount.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );


    // ==============================
    // SHOW DASHBOARD
    // ==============================

    statusBox.style.display =
      "none";

    app.style.display =
      "block";

  }

  catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

    showError(
      "Dashboard error: " +
      error.message
    );

  }

}


// ==============================
// LOGOUT
// ==============================

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


// ==============================
// BUTTONS
// ==============================

document
  .getElementById("deposit")
  .addEventListener(
    "click",
    function() {

      alert(
        "Deposit system will be connected next."
      );

    }
  );


document
  .getElementById("withdraw")
  .addEventListener(
    "click",
    function() {

      alert(
        "Withdrawal system will be connected next."
      );

    }
  );


document
  .getElementById("buy")
  .addEventListener(
    "click",
    function() {

      alert(
        "P2P Buy will be connected next."
      );

    }
  );


document
  .getElementById("sell")
  .addEventListener(
    "click",
    function() {

      alert(
        "P2P Sell will be connected next."
      );

    }
  );


// START

loadDashboard();

</script>

</body>

</html>
