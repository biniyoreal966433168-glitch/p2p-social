<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deposit • P2P Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07090D;
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 64px;
      background: #0D1016;
      border-bottom: 1px solid #202632;
      display: flex;
      align-items: center;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back {
      background: transparent;
      border: none;
      color: white;
      font-size: 25px;
      cursor: pointer;
      margin-right: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: bold;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 20px 18px 40px;
    }

    .page-title {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .page-description {
      color: #8D96A8;
      font-size: 13px;
      margin-bottom: 22px;
    }

    /* CURRENCY */

    .currency-title {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .currency-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .currency-card {
      background: #0F1218;
      border: 2px solid #202632;
      border-radius: 16px;
      padding: 20px 12px;
      text-align: center;
      color: white;
      cursor: pointer;
    }

    .currency-card:hover {
      border-color: #2F80FF;
    }

    .currency-card.active {
      border-color: #00C2FF;
      background: #101D2C;
    }

    .currency-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    .currency-name {
      display: block;
      font-size: 18px;
      font-weight: bold;
    }

    .currency-description {
      display: block;
      color: #8D96A8;
      font-size: 12px;
      margin-top: 5px;
    }

    /* FORM */

    .form-card {
      background: #0F1218;
      border: 1px solid #202632;
      border-radius: 18px;
      padding: 18px;
    }

    .selected-title {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .form-row {
      margin-bottom: 16px;
    }

    .form-row label {
      display: block;
      color: #8D96A8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: #171B23;
      border: 1px solid #2A3140;
      border-radius: 10px;
      overflow: hidden;
    }

    .input-box input,
    .input-box select {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
    }

    .input-box select {
      appearance: auto;
    }

    .input-box select option {
      background: #171B23;
      color: white;
    }

    .currency-label {
      padding: 0 13px;
      color: #00C2FF;
      font-weight: bold;
    }

    .help {
      color: #697386;
      font-size: 11px;
      margin-top: 6px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        #2F80FF,
        #00C2FF
      );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .success {
      background: #132D20;
      color: #7CFFB2;
      border: 1px solid #245B3C;
    }

    .error {
      background: #35171C;
      color: #FF8A9B;
      border: 1px solid #69303A;
    }

    /* SECURITY */

    .security-box {
      margin-top: 18px;
      padding: 14px;
      background: #0D1016;
      border: 1px solid #202632;
      border-radius: 12px;
      color: #697386;
      font-size: 12px;
      line-height: 1.5;
    }

    .security-box strong {
      color: #00C2FF;
    }

    @media (max-width: 450px) {

      .currency-options {
        gap: 8px;
      }

      .currency-card {
        padding: 17px 8px;
      }

      .page-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <button
      class="back"
      onclick="goBack()">
      ←
    </button>

    <div class="brand">

      <img
        src="images/logo.png"
        alt="P2P Social">

      <span>P2P Social</span>

    </div>

  </header>


  <main class="container">

    <h1 class="page-title">
      Deposit
    </h1>

    <p class="page-description">
      Choose the currency you want to deposit.
    </p>


    <!-- CURRENCY -->

    <div class="currency-title">
      Deposit currency
    </div>

    <div class="currency-options">

      <button
        class="currency-card active"
        id="etbCard"
        onclick="selectCurrency('ETB')">

        <span class="currency-icon">
          🇪🇹
        </span>

        <span class="currency-name">
          ETB
        </span>

        <span class="currency-description">
          Ethiopian Birr
        </span>

      </button>


      <button
        class="currency-card"
        id="usdtCard"
        onclick="selectCurrency('USDT')">

        <span class="currency-icon">
          💵
        </span>

        <span class="currency-name">
          USDT
        </span>

        <span class="currency-description">
          Tether
        </span>

      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message">
    </div>


    <!-- FORM -->

    <section class="form-card">

      <h2
        class="selected-title"
        id="selectedTitle">
        🇪🇹 Deposit ETB
      </h2>


      <!-- AMOUNT -->

      <div class="form-row">

        <label>
          Amount
        </label>

        <div class="input-box">

          <input
            type="number"
            id="amount"
            placeholder="0.00"
            min="0.01"
            step="0.01">

          <span
            class="currency-label"
            id="currencyLabel">
            ETB
          </span>

        </div>

      </div>


      <!-- PAYMENT METHOD -->

      <div class="form-row">

        <label>
          Payment method
        </label>

        <div class="input-box">

          <select id="paymentMethod">

            <option value="Telebirr">
              Telebirr
            </option>

            <option value="Bank Transfer">
              Bank Transfer
            </option>

          </select>

        </div>

      </div>


      <!-- REFERENCE -->

      <div class="form-row">

        <label>
          Transaction reference
        </label>

        <div class="input-box">

          <input
            type="text"
            id="reference"
            placeholder="Enter transaction ID/reference">

        </div>

        <div class="help">
          Enter the reference number from your payment.
        </div>

      </div>


      <!-- SUBMIT -->

      <button
        class="submit-btn"
        id="submitBtn"
        onclick="submitDeposit()">

        Submit Deposit

      </button>

    </section>


    <!-- SECURITY -->

    <div class="security-box">

      🔒 <strong>Secure deposit</strong><br>

      Your deposit request will be reviewed before
      the wallet balance is credited. Do not submit
      a payment you have not actually made.

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* ===============================
       SUPABASE
    =============================== */

    const SUPABASE_URL =
      "https://mbsvuwrgigqfporxwpfr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    let currentSession = null;

    let selectedCurrency = "ETB";


    /* ===============================
       CHECK LOGIN
    =============================== */

    async function checkLogin() {

      const {
        data,
        error
      } =
      await supabaseClient.auth.getSession();


      if (error) {

        showMessage(
          "Unable to check your login status.",
          "error"
        );

        return;

      }


      currentSession =
        data.session;


      if (!currentSession) {

        alert(
          "Please login before making a deposit."
        );

        window.location.href =
          "login.html";

        return;

      }

    }


    /* ===============================
       SELECT CURRENCY
    =============================== */

    function selectCurrency(currency) {

      selectedCurrency =
        currency;


      const etbCard =
        document.getElementById(
          "etbCard"
        );

      const usdtCard =
        document.getElementById(
          "usdtCard"
        );

      const title =
        document.getElementById(
          "selectedTitle"
        );

      const label =
        document.getElementById(
          "currencyLabel"
        );

      const method =
        document.getElementById(
          "paymentMethod"
        );


      if (currency === "ETB") {

        etbCard.classList.add(
          "active"
        );

        usdtCard.classList.remove(
          "active"
        );

        title.textContent =
          "🇪🇹 Deposit ETB";

        label.textContent =
          "ETB";


        method.innerHTML = `

          <option value="Telebirr">
            Telebirr
          </option>

          <option value="Bank Transfer">
            Bank Transfer
          </option>

        `;

      }


      if (currency === "USDT") {

        usdtCard.classList.add(
          "active"
        );

        etbCard.classList.remove(
          "active"
        );

        title.textContent =
          "💵 Deposit USDT";

        label.textContent =
          "USDT";


        method.innerHTML = `

          <option value="USDT TRC20">
            USDT TRC20
          </option>

          <option value="USDT ERC20">
            USDT ERC20
          </option>

          <option value="USDT BEP20">
            USDT BEP20
          </option>

        `;

      }


      document.getElementById(
        "amount"
      ).value = "";

      document.getElementById(
        "reference"
      ).value = "";

      hideMessage();

    }


    /* ===============================
       SUBMIT DEPOSIT
    =============================== */

    async function submitDeposit() {

      if (!currentSession) {

        alert(
          "Please login first."
        );

        window.location.href =
          "login.html";

        return;

      }


      const amount =
        Number(
          document.getElementById(
            "amount"
          ).value
        );


      const paymentMethod =
        document.getElementById(
          "paymentMethod"
        ).value;


      const reference =
        document.getElementById(
          "reference"
        ).value.trim();


      if (!amount || amount <= 0) {

        showMessage(
          "Please enter a valid amount.",
          "error"
        );

        return;

      }


      if (!reference) {

        showMessage(
          "Please enter the transaction reference.",
          "error"
        );

        return;

      }


      const submitButton =
        document.getElementById(
          "submitBtn"
        );


      submitButton.disabled =
        true;

      submitButton.textContent =
        "Submitting...";


      try {

        const {
          error
        } =
        await supabaseClient
          .from("deposit_requests")
          .insert({

            user_id:
              currentSession.user.id,

            currency:
              selectedCurrency,

            amount:
              amount,

            method:
              paymentMethod,

            reference:
              reference,

            status:
              "pending"

          });


        if (error) {

          console.error(error);

          showMessage(
            "Deposit request failed: " +
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Deposit request submitted successfully. Status: Pending.",
          "success"
        );


        document.getElementById(
          "amount"
        ).value = "";

        document.getElementById(
          "reference"
        ).value = "";


      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Submit Deposit";

      }

    }


    /* ===============================
       MESSAGE
    =============================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent =
        text;

      message.className =
        "message " + type;

      message.style.display =
        "block";

    }


    function hideMessage() {

      document.getElementById(
        "message"
      ).style.display =
        "none";

    }


    /* ===============================
       BACK
    =============================== */

    function goBack() {

      window.location.href =
        "wallet.html";

    }


    /* ===============================
       START
    =============================== */

    checkLogin();

  </script>

</body>
</html>
