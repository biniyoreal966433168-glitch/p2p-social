<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f73"><title>Groups • P2P Social</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f4f7f8;color:#172033;padding-bottom:28px}header{background:linear-gradient(135deg,#064e46,#087f73);color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}.top{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:800}.brand span{color:#a8eee2}.back{color:#fff;text-decoration:none;font-size:13px;font-weight:bold;background:#ffffff20;padding:10px 12px;border-radius:10px}.wrap{max-width:850px;margin:20px auto;padding:0 14px}.hero{background:#fff;border:1px solid #e1e9e7;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 5px 20px #082e2810}.eyebrow{color:#087f73;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:25px;margin:8px 0}.hero p{font-size:13px;color:#687385;line-height:1.5}.create{display:grid;gap:10px;margin-top:17px}.field{width:100%;padding:13px;border:1px solid #dce5e3;border-radius:11px;background:#fbfdfd;font-size:14px;outline-color:#087f73}.btn{border:0;border-radius:11px;background:#087f73;color:#fff;font-size:13px;font-weight:800;padding:13px 16px;cursor:pointer}.btn:disabled{opacity:.55}.toggle{display:flex;align-items:center;gap:9px;color:#52616d;font-size:12px}.columns{display:grid;grid-template-columns:minmax(0, .9fr) minmax(0,1.1fr);gap:14px}.panel{background:#fff;border:1px solid #e1e9e7;border-radius:16px;overflow:hidden;min-width:0}.panel-head{padding:15px;border-bottom:1px solid #edf1f0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}.list{max-height:520px;overflow:auto}.item{padding:13px 15px;border-bottom:1px solid #eff2f2;cursor:pointer;display:flex;gap:10px;align-items:center}.item:hover,.item.active{background:#eef8f6}.item-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#e5f4f1;font-size:20px;flex-shrink:0}.item-main{flex:1;min-width:0}.item-name{font-weight:800;font-size:13px;overflow-wrap:anywhere}.item-desc{font-size:11px;color:#77828e;margin-top:4px;line-height:1.4}.small-btn{padding:7px 9px;border-radius:8px;border:1px solid #cfe5e0;background:#fff;color:#087f73;font-size:11px;font-weight:800}.chat{display:flex;flex-direction:column;height:520px}.chat-body{flex:1;overflow:auto;padding:14px;background:#f9fbfb}.bubble{background:#fff;border:1px solid #e4ecea;border-radius:13px;padding:10px 12px;margin:0 0 9px;max-width:90%;font-size:13px;line-height:1.45;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#e3f5f1;border-color:#c9e9e2}.meta{font-size:10px;color:#7a8791;margin-bottom:4px}.send{display:flex;gap:8px;padding:10px;border-top:1px solid #e7edeb}.send input{flex:1;min-width:0;border:1px solid #dce5e3;border-radius:10px;padding:12px;font-size:13px}.empty{padding:25px 15px;text-align:center;color:#8b969f;font-size:12px;line-height:1.6}.status{font-size:12px;color:#087f73;margin-top:10px;min-height:15px}.hidden{display:none!important}@media(max-width:650px){.columns{grid-template-columns:1fr}.list{max-height:260px}.chat{height:460px}.hero h1{font-size:22px}}
</style></head><body><header><div class="top"><div class="brand">P2P <span>Social</span></div><a class="back" href="message.html">← Messages</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">👥 Community</div><h1>Groups</h1><p>Create a community group for conversations around a shared interest. Your P2P Social account is used to create and join.</p><div class="create"><input id="name" class="field" maxlength="60" placeholder="Group name (2–60 characters)"><input id="description" class="field" maxlength="500" placeholder="Short description (optional)"><label class="toggle"><input id="private" type="checkbox"> Private group (creator only until membership invitations are added)</label><button id="create" class="btn">＋ Create Group</button></div><div id="status" class="status"></div></section>
<div class="columns"><section class="panel"><div class="panel-head"><span>Discover Groups</span><button id="refresh" class="small-btn">Refresh</button></div><div id="list" class="list"><div class="empty">Loading groups…</div></div></section><section class="panel"><div class="panel-head"><span id="roomTitle">Choose a group</span><span id="memberLabel" class="eyebrow"></span></div><div id="chat" class="chat"><div id="chatBody" class="chat-body"><div class="empty">Select a group to view messages.</div></div><form id="sendForm" class="send hidden"><input id="message" maxlength="4000" placeholder="Write a message…" autocomplete="off"><button class="btn" type="submit">Send</button></form></div></section></div></main>
<script>
const U="https://mbsvuwrgigqfporxwpfr.supabase.co",K="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa",sb=supabase.createClient(U,K);
const CFG={table:"social_groups",members:"social_group_members",messages:"social_group_messages",fk:"group_id",privateField:"is_private",channel:false,singular:"Group"};
let me=null,selected=null,joined=new Set();
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(t){$("status").textContent=t||""}
async function start(){const{data:{session}}=await sb.auth.getSession();me=session?.user;if(!me){location.href="login.html";return}await loadList();const id=new URLSearchParams(location.search).get("id");if(id){const item=document.querySelector('[data-id="'+CSS.escape(id)+'"]');if(item)item.click()}}
async function loadList(){const box=$("list");box.innerHTML='<div class="empty">Loading…</div>';try{const r=await sb.from(CFG.table).select("*").order("created_at",{ascending:false}).limit(100);if(r.error)throw r.error;const rows=r.data||[];const m=await sb.from(CFG.members).select(CFG.fk).eq("user_id",me.id);if(m.error)throw m.error;joined=new Set((m.data||[]).map(x=>x[CFG.fk]));box.innerHTML=rows.length?rows.map(x=>'<div class="item '+(selected?.id===x.id?"active":"")+'" data-id="'+esc(x.id)+'"><div class="item-icon">'+(CFG.channel?"📢":"👥")+'</div><div class="item-main"><div class="item-name">'+esc(x.name)+'</div><div class="item-desc">'+esc(x.description||"Community "+CFG.singular.toLowerCase())+'</div></div>'+(joined.has(x.id)?'<button class="small-btn enter">Open</button>':'<button class="small-btn join">Join</button>')+'</div>').join(""):'<div class="empty">No '+CFG.singular.toLowerCase()+'s yet. Create the first one.</div>';box.querySelectorAll(".item").forEach(el=>{const id=el.dataset.id;el.onclick=()=>openRoom(rows.find(x=>x.id===id));const join=el.querySelector(".join");if(join)join.onclick=async e=>{e.stopPropagation();await joinRoom(id)};const enter=el.querySelector(".enter");if(enter)enter.onclick=e=>{e.stopPropagation();openRoom(rows.find(x=>x.id===id))}}catch(e){box.innerHTML='<div class="empty">Could not load '+CFG.singular.toLowerCase()+'s: '+esc(e.message)+'</div>'}}
async function joinRoom(id){const payload={[CFG.fk]:id,user_id:me.id,role:"member"};const r=await sb.from(CFG.members).upsert(payload,{onConflict:CFG.fk+",user_id",ignoreDuplicates:true});if(r.error){say(r.error.message);return}say("Joined successfully.");await loadList();const el=document.querySelector('[data-id="'+CSS.escape(id)+'"]');if(el)el.click()}
async function createRoom(){const name=$("name").value.trim(),description=$("description").value.trim();if(name.length<2){say("Enter a name with at least 2 characters.");return}const payload={name,description,created_by:me.id};payload[CFG.privateField]=CFG.channel?true:$("private").checked;const b=$("create");b.disabled=true;try{const r=await sb.from(CFG.table).insert(payload).select("*").single();if(r.error)throw r.error;const join=await sb.from(CFG.members).insert({[CFG.fk]:r.data.id,user_id:me.id,role:"owner"});if(join.error)throw join.error;$("name").value="";$("description").value="";say(CFG.singular+" created.");await loadList();await openRoom(r.data)}catch(e){say("Could not create "+CFG.singular.toLowerCase()+": "+e.message)}finally{b.disabled=false}}
async function openRoom(item){if(!item)return;selected=item;$("roomTitle").textContent=item.name;$("memberLabel").textContent=joined.has(item.id)?"MEMBER":"";$("sendForm").classList.toggle("hidden",!joined.has(item.id));document.querySelectorAll(".item").forEach(el=>el.classList.toggle("active",el.dataset.id===item.id));await loadMessages()}
async function loadMessages(){const body=$("chatBody");body.innerHTML='<div class="empty">Loading messages…</div>';if(!selected)return;const r=await sb.from(CFG.messages).select("id,sender_id,content,created_at").eq(CFG.fk,selected.id).order("created_at",{ascending:true}).limit(200);if(r.error){body.innerHTML='<div class="empty">Could not load messages: '+esc(r.error.message)+'</div>';return}body.innerHTML=r.data?.length?r.data.map(m=>'<div class="bubble '+(m.sender_id===me.id?"mine":"")+'"><div class="meta">'+(m.sender_id===me.id?"You": "Member")+' · '+esc(new Date(m.created_at).toLocaleString())+'</div>'+esc(m.content)+'</div>').join(""):'<div class="empty">No messages yet. Start the conversation.</div>';body.scrollTop=body.scrollHeight}
$("create").onclick=createRoom;$("refresh").onclick=loadList;$("sendForm").onsubmit=async e=>{e.preventDefault();if(!selected||!me)return;const input=$("message"),content=input.value.trim();if(!content)return;const payload={[CFG.fk]:selected.id,sender_id:me.id,content};const r=await sb.from(CFG.messages).insert(payload);if(r.error){say("Message failed: "+r.error.message);return}input.value="";say("");await loadMessages()};start();
</script><script id="p2p-profile-initials-fallback">
(()=>{"use strict";
const marker="data-p2p-initials";
function initialsFor(img){
 let raw="";
 const selectors='[data-profile-name],.chat-name,.profile-name,.user-name,.post-author,.author-name,.search-name,.notification-text strong,.name,[class*="display-name"],[class*="user-name"]';
 let node=img;
 for(let depth=0;depth<5&&node;depth++,node=node.parentElement){
  const found=node.querySelector?.(selectors);
  if(found&&found.textContent.trim()){raw=found.textContent.trim();break}
 }
 raw=raw.replace(/^@+/,"").replace(/\s+/g," ").trim();
 if(!raw||/^(user|unknown|profile)$/i.test(raw))raw="Name User";
 const parts=raw.split(" ").filter(Boolean);
 const letters=parts.length>1?parts[0][0]+parts[parts.length-1][0]:parts[0]?.[0]||"NU";
 return {name:raw,letters:letters.toUpperCase().replace(/[^\p{L}\p{N}]/gu,"").slice(0,2)||"NU"};
}
function isAvatar(img){
 const cls=typeof img.className==="string"?img.className.toLowerCase():"";
 const id=(img.id||"").toLowerCase(),src=img.getAttribute("src")||"";
 return /avatar|profile|user-photo|post-photo|comment-photo/.test(cls+" "+id)||
  /(?:^|\/)(?:profile|avatar)(?:[-_.][^/]*)?\.(?:png|jpe?g|webp|svg)(?:[?#]|$)/i.test(src);
}
function apply(img){
 if(!(img instanceof HTMLImageElement)||img.dataset[marker]==="1"||!isAvatar(img))return;
 const src=img.getAttribute("src")||"";
 const defaultImage=/(?:^|\/)(?:profile|avatar)(?:[-_.][^/]*)?\.(?:png|jpe?g|webp|svg)(?:[?#]|$)/i.test(src);
 if(!defaultImage&&img.complete&&img.naturalWidth>0)return;
 const {letters}=initialsFor(img);
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="#087f73"/><text x="60" y="64" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#fff">'+letters+'</text></svg>';
 img.dataset[marker]="1";img.src="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function scan(root){if(root?.matches?.("img"))apply(root);root?.querySelectorAll?.("img").forEach(apply)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>scan(document),{once:true});else scan(document);
new MutationObserver(records=>records.forEach(r=>{r.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n)});if(r.type==="attributes"&&r.target instanceof HTMLImageElement){delete r.target.dataset[marker];apply(r.target)}})).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["src"]});
})();
</script>
</body></html>
