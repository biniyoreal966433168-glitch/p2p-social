/* Refined social feed */
.posts-section{padding-top:20px}.posts-feed{display:flex;flex-direction:column;gap:14px;max-width:850px;margin:0 auto}

.post-user-info{flex:1;min-width:0}.post-name{font-weight:750;font-size:14px;line-height:1.35;color:#17212b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.post-content{margin-top:14px;color:#303b4d;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.post-media{margin-top:14px;border-radius:14px;overflow:hidden;background:#f0f3f5;border:1px solid #edf0f3}.post-media img,.post-media video{width:100%;max-height:560px;object-fit:contain;display:block;margin:0}

.no-posts,.loading-posts{background:#fff;border:1px solid #e9eef2;border-radius:18px;padding:32px 18px;text-align:center;color:#7b8492;box-shadow:0 4px 16px rgba(18,35,45,.04)}.no-posts strong{display:block;color:#303b4d;margin-top:8px}.no-posts p{margin:7px 0 0;font-size:13px}.empty-post-icon{margin:auto;width:42px;height:42px;border-radius:14px;background:#e8f7f2;color:#087f73;display:grid;place-items:center;font-size:22px}

body.night-mode .post-card,body.night-mode .no-posts,body.night-mode .loading-posts{background:#1f2937;border-color:#374151;color:#e5e7eb}body.night-mode .post-name,body.night-mode .post-content,body.night-mode .no-posts strong{color:#e5e7eb}body.night-mode .post-actions,body.night-mode .comments-box{border-color:#374151}body.night-mode .comment-body{background:#111827;border-color:#374151}body.night-mode .comment-name,body.night-mode .comment-text{color:#e5e7eb}body.night-mode .comment-input{background:#111827;border-color:#374151;color:#e5e7eb}body.night-mode .post-menu{background:#374151;color:#e5e7eb}

/* Compact people search in the profile header */
.header-row{justify-content:space-between}
.profile-header-actions{margin-left:auto;display:flex;align-items:center}
.profile-search-toggle{width:38px;height:38px;border:1px solid #ffffff50;border-radius:12px;background:#ffffff1c;color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profile-search-toggle:hover{background:#ffffff30}
.profile-search-bar{display:none;position:relative;margin:13px auto 0;max-width:540px}
.profile-search-bar.open{display:block}

.profile-search-bar>button{position:absolute;right:8px;top:5px;width:32px;height:32px;border:0;border-radius:8px;background:#edf5f4;color:#087f73;font-size:23px;cursor:pointer}

.profile-search-result:hover{background:#f2f9f7}

.profile-search-result-copy{min-width:0;flex:1}
.profile-search-result-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}

function openCreatePost(){if(!requireLogin())return;editingPostId=null;document.getElementById("postEditorTitle").textContent="Create post";document.getElementById("postEditorSubtitle").textContent="Share an update with the P2P Social community.";document.getElementById("postContentInput").value="";document.getElementById("postVisibility").value="public";document.getElementById("mediaType").disabled=false;document.getElementById("mediaType").value="text";document.getElementById("publishPostBtn").textContent="Publish post";document.getElementById("postCharCount").textContent="0";document.getElementById("createPostModal").style.display="flex";updateMediaControls();document.getElementById("postContentInput").focus()}function closeCreatePost(){document.getElementById("createPostModal").style.display="none";editingPostId=null;document.getElementById("mediaType").disabled=false;const i=document.getElementById("mediaFileInput");if(i)i.value="";const p=document.getElementById("mediaPreview");if(p?.dataset.previewUrl){URL.revokeObjectURL(p.dataset.previewUrl);delete p.dataset.previewUrl}}document.getElementById("postContentInput")?.addEventListener("input",()=>{const c=document.getElementById("postCharCount");if(c)c.textContent=String(document.getElementById("postContentInput").value.length)});function updateMediaControls(){const t=document.getElementById("mediaType").value,c=document.getElementById("mediaControls"),n=document.getElementById("promotionNotice");c.innerHTML="";n.innerHTML="";if(t==="text"){n.innerHTML='<div class="info-box">Text posts are available.</div>';return}if(t==="image"){c.innerHTML='<label class="media-label">Select Picture</label><input id="mediaFileInput" class="media-input" type="file" accept="image/*" onchange="previewMedia()"><div class="media-note">Select a picture from your device. The original image is uploaded directly to Supabase Storage.</div><div id="mediaPreview" class="media-preview"></div>';n.innerHTML='<div class="info-box">Picture pos  alert("Video posts require Premium+.");let mediaUrl="",file=null;if(type==="image"){file=document.getElementById("mediaFileInput")?.files?.[0]||null;if(!file)return alert("Select a picture first.");if(!file.type.startsWith("image/"))return alert("Please select an image file.")}if(type==="video"){mediaUrl=document.getElementById("mediaUrlInput")?.value.trim()||"";if(!mediaUrl)return alert("Add a media URL first.")}const b=document.getElementById("publishPostBtn");b.disabled=true;b.textContent="Publishing...";try{if(type==="image"){const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg",path=`${currentSession.user.id}/${crypto.randomUUID()}.${ext}`,upload=await supabaseClient.storage.from(POST_IMAGE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;const{data}=supabaseClient.storage.from(POST_IMAGE_BUCKET).getPublicUrl(path);if(!data?.publicUrl)throw new Error("Could not create image URL.");mediaUrl=data.publicUrl}const payload={user_id:currentSession.user.id,content,visibility};if(type!=="text")Object.assign(payload,{media_url:mediaUrl,media_type:type});const{error}=await supabaseClient.from("posts").insert(payload);if(error)throw error;document.getElementById("postContentInput").value="";document.getElementById("postVisibility").value="public";document.getElementById("mediaType").value="text";closeCreatePost();await loadPosts()}catch(e){alert("Could not publish post: "+(e?.message||"Unknown error"))}finally{b.disabled=false;b.textContent="Publish Post"}}async function deletePost(id){if(!requireLogin())return;const{data,error}=await supabaseClient.from("posts").select("user_id").eq("id",id).maybeSingle();if(error||!data)return alert("Post not found.");if(data.user_id!==currentSession.user.id)return alert("You can only delete your own post.");if(!confirm("Delete this post?"))return;const r=await supabaseClient.from("posts").delete().eq("id",id).eq("user_id",currentSession.user.id);if(r.error)alert(r.error.message);else await loadPosts()}async function sharePost(id){if(!requireLogin())return;const url=location.origin+location.pathname+"?post="+encodeURIComponent(id);if(navigator.share){try{await navigator.share({title:"P2P Social",text:"Check out this post on P2P Social",url})}catch(e){if(e.name!=="AbortError")console.log(e)}return}try{await navigator.clipboard.writeText(url);alert("Post link copied.")}catch(e){prompt("Copy this post link:",url)}}
async function loadNotifications(){if(!currentSession)return resetNotifications();const{data,error}=await supabaseClient.from("notifications").select("id,user_id,type,title,body,link,is_read,created_at").eq("user_id",currentSession.user.id).order("created_at",{ascending:false}).limit(50);if(error)return console.log("Notifications:",error.message);renderNotifications(data||[])}function renderNotifications(list){const e=document.getElementById("notificationList"),b=document.getElementById("notificationBadge");if(!list.length){e.innerHTML='<div class="no-notifications">🔔 No notifications yet.</div>';b.style.display="none";return}const unread=list.filter(n=>!n.is_read).length;if(unread){b.textContent=unread>99?"99+":unread;b.style.display="flex"}else b.style.display="none";e.innerHTML="";list.forEach(n=>{const item=document.createElement("div");item.className="notification-item"+(n.is_read?"":" unread");item.innerHTML=`<div class="notification-icon">${notificationIcon(n.type)}</div><div class="notification-content"><div class="notification-title">${escapeHtml(n.title||"Notification")}</div><div class="notification-body">${escapeHtml(n.body||"")}</div><div class="notification-time">${escapeHtml(formatPostTime(n.created_at))}</div></div>`;item.onclick=async()=>{if(!n.is_read)await markNotificationRead(n.id);if(n.link)location.href=n.link;else openMessages()};e.appendChild(item)})}function notificationIcon(t){return{message:"💬",like:"❤️",comment:"💬",follow:"👤",wallet:"",deposit:"",withdraw:"",transfer:"",trade:"",premium:"",live:"",verification:"",security:""}[t]||"🔔"}async function markNotificationRead(id){if(!currentSession)return;const{error}=await supabaseClient.from("notifications").update({is_read:true}).eq("id",id).eq("user_id",currentSession.user.id);if(error)console.error(error);await loadNotifications()}async function markAllNotificationsRead(){if(!currentSession)return;const{error}=await supabaseClient.from("notifications").update({is_read:true}).eq("user_id",currentSession.user.id).eq("is_read",false);if(error)return alert("Could not mark notifications as read.");await loadNotifications()}function resetNotifications(){document.getElementById("notificationBadge").style.display="none";document.getElementById("notificationList").innerHTML='<div class="no-notifications">Login to see notifications.</div>'}function toggleNotificationPanel(e){e?.stopPropagation();if(!requireLogin())return;const p=document.getElementById("notificationPanel");p.classList.toggle("open");if(p.classList.contains("open"))loadNotifications()}function subscribeToNotifications(){if(!currentSession)return;if(notificationChannel)supabaseClient.removeChannel(notificationChannel);const uid=currentSession.user.id;notificationChannel=supabaseClient.channel("notifications-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+uid},()=>loadNotifications()).subscribe()}
function toggleMenu(e){e?.stopPropagation();if(!requireLogin())return;document.getElementById("menuPanel").classList.toggle("open")}function closeMenu(){document.getElementById("menuPanel")?.classList.remove("open")}function openAbout(){openInfo("About",'<div class="about-text"><strong>P2P Social</strong><br><br>P2P Social is a community-driven P2P platform where you can buy and sell USDT or TON, manage your wallet, connect with traders, and trade securely — all in one place.<br><br><strong>Trade • Connect • Grow</strong></div>')}function openInfo(title,body){document.getElementById("infoTitle").textContent=title;document.getElementById("infoBody").innerHTML=body;document.getElementById("infoModal").style.display="flex";closeMenu()}function closeInfo(){document.getElementById("infoModal").style.display="none"}function goHome(){if(requireLogin())location.href="./index.html"}function openBuy(){if(requireLogin())location.href="./🟢.html"}function openSell(){if(requireLogin())location.href="./🔴.html"}function openMessages(){if(requireLogin())location.href="./message.html"}function openProfile(){if(requireLogin())location.href="./profile.html"}function openUserProfile(identifier){if(!requireLogin())return;identifier=String(identifier||"").trim();if(!identifier)return;if(identifier.startsWith("@"))identifier=identifier.slice(1);const isUuid=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(identifier);location.href=isUuid?"./user_profile.html?user_id="+encodeURIComponent(identifier):"./user_profile.html?username="+encodeURIComponent(identifier)}async function logout(){try{const{error}=await supabaseClient.auth.signOut();if(error)return alert("Logout failed: "+error.message);currentSession=null;redirectToLogin()}catch(e){redirectToLogin()}}
function formatPostTime(date){if(!date)return"";const d=new Date(date),diff=Math.floor((Date.now()-d)/1000);if(Number.isNaN(d.getTime()))return"";if(diff<60)return"just now";if(diff<3600)return Math.floor(diff/60)+"m ago";if(diff<86400)return Math.floor(diff/3600)+"h ago";if(diff<604800)return Math.floor(diff/86400)+"d ago";return d.toLocaleDateString()}function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,"\\n").replace(/\r/g,"\\r")}
document.addEventListener("click",e=>{const np=document.getElementById("notificationPanel"),nb=document.getElementById("notificationButton"),mp=document.getElementById("menuPanel");if(np&&!np.contains(e.target)&&nb&&!nb.contains(e.target))np.classList.remove("open");if(mp&&!mp.contains(e.target)&&!e.target.closest(".menu-btn"))mp.classList.remove("open");["infoModal","createPostModal"].forEach(id=>{const m=document.getElementById(id);if(m&&e.target===m)m.style.display="none"})});document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("menuPanel")?.classList.remove("open");["infoModal","createPostModal"].forEach(id=>{const m=document.getElementById(id);if(m)m.style.display="none"})}});startApp();

let profileSearchTimer;
const profileSearchEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const profileSearchName=p=>{const username=String(p?.username||"").replace(/^@/,"").toLowerCase();for(const v of [p?.first_name,p?.display_name,p?.full_name,p?.name]){const x=String(v||"").trim();if(x&&x.replace(/^@/,"").toLowerCase()!==username)return x}return username||"User"};
document.getElementById("profileSearchToggle").onclick=()=>{const bar=document.getElementById("profileSearchBar"),open=bar.classList.toggle("open");if(open)document.getElementById("profileSearchInput").focus();else{document.getElementById("profileSearchResults").classList.remove("show");document.getElementById("profileSearchInput").value=""}};
document.getElementById("profileSearchClose").onclick=()=>{document.getElementById("profileSearchBar").classList.remove("open");document.getElementById("profileSearchResults").classList.remove("show");document.getElementById("profileSearchInput").value=""};
document.getElementById("profileSearchInput").addEventListener("input",()=>{clearTimeout(profileSearchTimer);const term=document.getElementById("profileSearchInput").value.trim(),box=document.getElementById("profileSearchResults");if(term.length<2){box.classList.remove("show");box.innerHTML="";return}box.classList.add("show");box.innerHTML='<div class="profile-search-message">Searching…</div>';profileSearchTimer=setTimeout(()=>searchProfiles(term),250)});
async function searchProfiles(term){const box=document.getElementById("profileSearchResults");try{const pattern="%"+term.replace(/[%,()]/g," ").trim()+"%";const r=await supabaseClient.from("profiles").select("id,user_id,username,first_name,last_name,display_name,avatar_url,user_number").or("username.ilike."+pattern+",first_name.ilike."+pattern+",last_name.ilike."+pattern+",display_name.ilike."+pattern).limit(12);if(r.error)throw r.error;if(!document.getElementById("profileSearchInput").value.trim())return;const rows=(r.data||[]).filter(p=>(p.id||p.user_id)!==currentSession?.user?.id);if(!rows.length){box.innerHTML='<div class="profile-search-message">No people found</div>';return}box.innerHTML=rows.map(p=>'<div class="profile-search-result" role="button" tabindex="0" data-profile-id="'+profileSearchEsc(p.id||p.user_id||"")+'" data-profile-name="'+profileSearchEsc(p.username||"")+'">'+(p.avatar_url?'<img src="'+profileSearchEsc(p.avatar_url)+'" alt="" loading="lazy">':'<div class="profile-search-result-avatar">'+profileSearchEsc(profileSearchName(p).charAt(0).toUpperCase())+'</div>')+'<div class="profile-search-result-copy"><div class="profile-search-result-name">'+profileSearchEsc(profileSearchName(p))+'</div><div class="profile-search-result-id">'+profileSearchEsc(p.username?"@"+String(p.username).replace(/^@/,""):"ID:"+String(p.user_number??"").padStart(12,"0"))+'</div></div></div>').join("");box.querySelectorAll(".profile-search-result").forEach(el=>{const go=()=>{const id=el.dataset.profileId,name=el.dataset.profileName;location.href="user_profile.html?"+(name?"username="+encodeURIComponent(name):"user_id="+encodeURIComponent(id))};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})})}catch(e){console.error("Profile search failed",e);box.innerHTML='<div class="profile-search-message">Search unavailable. Please try again.</div>'}}
</script><script src="/js/theme.js" defer></script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/service-worker.js").catch(function(e){console.warn("Theme worker registration failed",e)})})}</script>
