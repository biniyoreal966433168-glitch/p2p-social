<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:75px;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:16px;
  border-radius:0 0 22px 22px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.brand{
  font-size:20px;
  font-weight:bold;
}

.header-right{
  display:flex;
  align-items:center;
  gap:7px;
}

.logout-btn{
  border:none;
  background:#e74c3c;
  color:white;
  padding:8px 10px;
  border-radius:9px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.search-box{
  margin-top:14px;
  background:white;
  border-radius:13px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#777;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  font-size:14px;
}

/* =========================
   AUTH MESSAGE
========================= */

.auth-message{
  margin:18px;
  background:white;
  padding:25px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.auth-message h2{
  margin-bottom:8px;
}

.auth-message p{
  color:#777;
  font-size:13px;
  margin-bottom:15px;
}

.login-button{
  border:none;
  background:#087f73;
  color:white;
  padding:11px 20px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   MAIN
========================= */

.main{
  padding:18px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.page-title h2{
  font-size:20px;
}

.new-message-btn{
  border:none;
  background:#087f73;
  color:white;
  padding:9px 12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   CONVERSATIONS
========================= */

.conversations{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.conversation{
  background:white;
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.conversation:hover{
  background:#f8fbfa;
}

.conversation.active{
  background:#eaf7f4;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#dfeeea;
  color:#087f73;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.conversation-name{
  font-size:14px;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#8b94a2;
  font-size:10px;
  white-space:nowrap;
}

.last-message{
  color:#7a8492;
  font-size:12px;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.unread-count{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:20px;
  background:#087f73;
  color:white;
  font-size:10px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:white;
  border-radius:16px;
  padding:30px 18px;
  text-align:center;
  color:#7b8492;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.empty strong{
  display:block;
  color:#172033;
  margin-bottom:5px;
}

/* =========================
   CHAT
========================= */

.chat{
  display:none;
  position:fixed;
  inset:0;
  background:#f5f7fb;
  z-index:1500;
  padding-bottom:68px;
}

.chat.open{
  display:flex;
  flex-direction:column;
}

.chat-header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  min-height:65px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
}

.back-button{
  border:none;
  background:transparent;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.chat-user{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
}

.chat-user .avatar{
  width:40px;
  height:40px;
  background:white;
}

.chat-user-info{
  min-width:0;
}

.chat-name{
  font-weight:bold;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-status{
  font-size:10px;
  opacity:.8;
  margin-top:3px;
}

.profile-button{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  border-radius:9px;
  padding:8px;
  cursor:pointer;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:9px 11px;
  border-radius:14px;
  font-size:13px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.mine .message-bubble{
  background:#087f73;
  color:white;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  background:white;
  color:#172033;
  border-bottom-left-radius:4px;
}

.message-meta{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:4px;
  font-size:9px;
  opacity:.7;
}

.delete-message{
  border:none;
  background:none;
  color:#e74c3c;
  font-size:10px;
  cursor:pointer;
  margin-left:5px;
}

.no-messages{
  margin:auto;
  text-align:center;
  color:#8a93a1;
  font-size:13px;
}

/* =========================
   SEND
========================= */

.send-area{
  background:white;
  border-top:1px solid #ddd;
  padding:9px;
  display:flex;
  gap:7px;
}

.message-input{
  flex:1;
  min-width:0;
  border:1px solid #dfe4eb;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
  font-size:13px;
}

.send-button{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.send-button:disabled{
  opacity:.6;
}

/* =========================
   NEW MESSAGE MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:3000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:430px;
  max-height:80vh;
  overflow:hidden;
  background:white;
  border-radius:18px;
  padding:18px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.modal-header h3{
  font-size:18px;
}

.close{
  border:none;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.user-search{
  width:100%;
  border:1px solid #dfe4eb;
  border-radius:11px;
  padding:11px;
  outline:none;
  margin-bottom:10px;
}

.user-results{
  max-height:400px;
  overflow-y:auto;
}

.user-result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:11px;
  cursor:pointer;
}

.user-result:hover{
  background:#f3f8f6;
}

.user-result-info{
  flex:1;
  min-width:0;
}

.user-result-name{
  font-weight:bold;
  font-size:13px;
}

.user-result-handle{
  color:#7d8794;
  font-size:11px;
  margin-top:3px;
}

.loading{
  padding:20px;
  text-align:center;
  color:#888;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;

}

.nav-item span{
  display:block;

@media(max-width:450px){

  .main{
    padding:14px 12px;
  }

  .brand{
    font-size:18px;
  }

  .message-bubble{
    max-width:84%;
  }

</style>

========================= -->

<nav class="bottom-nav">

    <span>💬</span>

    <span>👤</span>
    Profile

  </div>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* ==================================================
   STATE
================================================== */

let currentSession = null;

let currentUserId = null;

let currentChatUserId = null;

let currentChatProfile = null;

let realtimeChannel = null;

let conversationData = [];


/* ==================================================
   AUTH
================================================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    showLoggedOut();

    return;

  }

  currentSession =
    data.session;

  if(!currentSession){

    showLoggedOut();

    return;

  }

  currentUserId =
    currentSession.user.id;

  showLoggedIn();

  await loadConversations();

  subscribeToMessages();

}


function showLoggedOut(){

  document.getElementById(
    "authMessage"
  ).style.display = "block";

  document.getElementById(
    "mainContent"
  ).style.display = "none";

  document.getElementById(
    "logoutBtn"
  ).style.display = "none";

}


function showLoggedIn(){

  document.getElementById(
    "authMessage"
  ).style.display = "none";

  document.getElementById(
    "mainContent"
  ).style.display = "block";

  document.getElementById(
    "logoutBtn"
  ).style.display = "block";

}


/* ==================================================
   LOAD CONVERSATIONS
================================================== */

async function loadConversations(){

  const container =
    document.getElementById(
      "conversations"
    );

  container.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;


  /*
    We get messages involving the current user.

    Expected table:
      messages

    Expected columns:
      id
      sender_id
      receiver_id
      content
      created_at
      is_read
  */

  const {
    data:messages,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(`
      id,
      sender_id,
      receiver_id,
      content,
      created_at,
      is_read
    `)
    .or(
      "sender_id.eq." +
      currentUserId +
      ",receiver_id.eq." +
      currentUserId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(500);


  if(error){

    console.error(
      "Conversation loading error:",
      error
    );

    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          ⚠️
        </div>
        <strong>
          Could not load messages
        </strong>
        <div>
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;

    return;

  }


  const rows =
    messages || [];


  if(!rows.length){

    conversationData = [];

    renderConversations([]);

    return;

  }


  /*
    Find the latest message for each
    conversation.
  */

  const map = {};


  rows.forEach(message => {

    const otherUserId =
      message.sender_id === currentUserId
      ? message.receiver_id
      : message.sender_id;


    if(!otherUserId){

      return;

    }


    if(!map[otherUserId]){

      map[otherUserId] = {
        user_id:otherUserId,
        last_message:message,
        unread:0
      };

    }


    if(
      message.receiver_id === currentUserId &&
      !message.is_read
    ){

      map[otherUserId].unread++;

    }

  });


  const otherUserIds =
    Object.keys(map);


  let profiles = [];


  if(otherUserIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          otherUserIds
        );


    if(result.error){

      console.error(
        "Profile loading error:",
        result.error
      );

    }else{

      profiles =
        result.data || [];

    }

  }


  const profileMap = {};


  profiles.forEach(profile => {

    profileMap[
      profile.id
    ] = profile;

  });


  conversationData =
    Object.values(map)
      .map(item => {

        const profile =
          profileMap[item.user_id] || {};

        return {
          ...item,
          profile:profile
        };

      })
      .sort(
        (a,b) =>
          new Date(
            b.last_message.created_at
          ) -
          new Date(
            a.last_message.created_at
          )
      );


  renderConversations(
    conversationData
  );

}


/* ==================================================
   RENDER CONVERSATIONS
================================================== */

function renderConversations(data){

  const container =
    document.getElementById(
      "conversations"
    );


  if(!data.length){

    container.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          💬
        </div>

        <strong>
          No conversations yet
        </strong>

        <div>
          Tap "New message" to start a conversation.
        </div>

      </div>
    `;

    return;

  }


  container.innerHTML = "";


  data.forEach(item => {

    const profile =
      item.profile || {};


    const username =
      profile.username ||
      "User";


    const avatar =
      profile.avatar_url ||
      "";


    const initial =
      username
        .charAt(0)
        .toUpperCase();


    const row =
      document.createElement("div");


    row.className =
      "conversation";


    if(
      currentChatUserId ===
      item.user_id
    ){

      row.classList.add("active");

    }


    row.innerHTML = `

      <div class="avatar">

        ${
          avatar
          ?
          `
          <img
            src="${escapeHtml(avatar)}"
            alt="Profile">
          `
          :
          escapeHtml(initial)
        }

      </div>

      <div class="conversation-info">

        <div class="conversation-top">

          <div class="conversation-name">
            ${escapeHtml(username)}
          </div>

          <div class="conversation-time">
            ${escapeHtml(
              formatTime(
                item.last_message.created_at
              )
            )}
          </div>

        </div>

        <div class="last-message">
          ${escapeHtml(
            item.last_message.content || ""
          )}
        </div>

      </div>

      ${
        item.unread > 0
        ?
        `
        <div class="unread-count">
          ${
            item.unread > 99
            ? "99+"
            : item.unread
          }
        </div>
        `
        :
        ""
      }

    `;


    row.addEventListener(
      "click",
      function(){

        openConversation(
          item.user_id,
          profile
        );

      }
    );


    container.appendChild(row);

  });

}


/* ==================================================
   OPEN CONVERSATION
================================================== */

async function openConversation(
  userId,
  profile = null
){

  if(!currentSession){

    openLogin();

    return;

  }


  if(
    !userId ||
    userId === currentUserId
  ){

    return;

  }


  currentChatUserId =
    userId;


  if(profile){

    currentChatProfile =
      profile;

  }else{

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url"
      )
      .eq(
        "id",
        userId
      )
      .maybeSingle();

    currentChatProfile =
      data || {};

  }


  renderChatHeader();


  document.getElementById(
    "chat"
  ).classList.add("open");


  await loadChatMessages();


  await markConversationRead(
    userId
  );


  await loadConversations();


  setTimeout(
    function(){

      document.getElementById(
        "messageInput"
      ).focus();

    },
    100
  );

}


/* ==================================================
   CHAT HEADER
================================================== */

function renderChatHeader(){

  const profile =
    currentChatProfile || {};


  const username =
    profile.username ||
    "User";


  const avatar =
    profile.avatar_url ||
    "";


  const initial =
    username
      .charAt(0)
      .toUpperCase();


  document.getElementById(
    "chatUser"
  ).innerHTML = `

    <div class="avatar">

      ${
        avatar
        ?
        `
        <img
          src="${escapeHtml(avatar)}"
          alt="Profile">
        `
        :
        escapeHtml(initial)
      }

    </div>

    <div class="chat-user-info">

      <div class="chat-name">
        ${escapeHtml(username)}
      </div>

      <div class="chat-status">
        Message
      </div>

    </div>

  `;

}


/* ==================================================
   LOAD CHAT MESSAGES
================================================== */

async function loadChatMessages(){

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML =
    `<div class="no-messages">
      Loading messages...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(`
      id,
      sender_id,
      receiver_id,
      content,
      created_at,
      is_read
    `)
    .or(
      "and(sender_id.eq." +
      currentUserId +
      ",receiver_id.eq." +
      currentChatUserId +
      "),and(sender_id.eq." +
      currentChatUserId +
      ",receiver_id.eq." +
      currentUserId +
      ")"
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "Message loading error:",
      error
    );

    container.innerHTML = `
      <div class="no-messages">
        Could not load messages.<br>
        <small>
          ${escapeHtml(error.message)}
        </small>
      </div>
    `;

    return;

  }


  renderMessages(
    data || []
  );

}


/* ==================================================
   RENDER MESSAGES
================================================== */

function renderMessages(data){

  const container =
    document.getElementById(
      "messages"
    );


  container.innerHTML = "";


  if(!data.length){

    container.innerHTML = `
      <div class="no-messages">
        💬 No messages yet.<br>
        Start the conversation.
      </div>
    `;

    return;

  }


  data.forEach(message => {

    const mine =
      message.sender_id ===
      currentUserId;


    const row =
      document.createElement("div");


    row.className =
      "message-row " +
      (
        mine
        ? "mine"
        : "theirs"
      );


    const bubble =
      document.createElement("div");


    bubble.className =
      "message-bubble";


    bubble.textContent =
      message.content || "";


    const meta =
      document.createElement("div");


    meta.className =
      "message-meta";


    meta.innerHTML =
      escapeHtml(
        formatTime(
          message.created_at
        )
      );


    if(mine){

      meta.innerHTML +=
        message.is_read
        ? " ✓✓"
        : " ✓";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-message";


      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        function(){

          deleteMessage(
            message.id
          );

        };


      meta.appendChild(
        deleteButton
      );

    }


    bubble.appendChild(
      meta
    );


    row.appendChild(
      bubble
    );


    container.appendChild(
      row
    );

  });


  container.scrollTop =
    container.scrollHeight;

}


/* ==================================================
   SEND MESSAGE
================================================== */

async function sendMessage(){

  if(!currentSession){

    openLogin();

    return;

  }


  if(!currentChatUserId){

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const button =
    document.getElementById(
      "sendButton"
    );


  const content =
    String(
      input.value || ""
    ).trim();


  if(!content){

    return;

  }


  if(content.length > 5000){

    alert(
      "Message is too long."
    );

    return;

  }


  button.disabled =
    true;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({

      sender_id:
        currentUserId,

      receiver_id:
        currentChatUserId,

      content:
        content,

      is_read:
        false

    })
    .select()
    .single();


  button.disabled =
    false;


  if(error){

    console.error(
      "Send message error:",
      error
    );

    alert(
      "Message could not be sent: " +
      error.message
    );

    return;

  }


  input.value = "";


  /*
    Realtime normally displays the
    message. We also refresh locally
    so the sender sees it immediately.
  */

  if(data){

    addMessageIfMissing(
      data
    );

  }

}


/* ==================================================
   ADD REALTIME MESSAGE
================================================== */

function addMessageIfMissing(message){

  if(
    !currentChatUserId ||
    (
      message.sender_id !== currentUserId &&
      message.sender_id !== currentChatUserId
    )
  ){

    return;

  }


  const container =
    document.getElementById(
      "messages"
    );


  /*
    Prevent duplicate realtime
    messages.
  */

  if(
    container.querySelector(
      `[data-message-id="${cssEscape(message.id)}"]`
    )
  ){

    return;

  }


  if(
    container.querySelector(
      ".no-messages"
    )
  ){

    container.innerHTML = "";

  }


  const mine =
    message.sender_id ===
    currentUserId;


  const row =
    document.createElement("div");


  row.className =
    "message-row " +
    (
      mine
      ? "mine"
      : "theirs"
    );


  row.dataset.messageId =
    message.id;


  const bubble =
    document.createElement("div");


  bubble.className =
    "message-bubble";


  const text =
    document.createElement("div");


  text.textContent =
    message.content || "";


  bubble.appendChild(
    text
  );


  const meta =
    document.createElement("div");


  meta.className =
    "message-meta";


  meta.textContent =
    formatTime(
      message.created_at
    );


  if(mine){

    meta.textContent +=
      message.is_read
      ? " ✓✓"
      : " ✓";


    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "delete-message";


    deleteButton.textContent =
      "Delete";


    deleteButton.onclick =
      function(){

        deleteMessage(
          message.id
        );

      };


    meta.appendChild(
      deleteButton
    );

  }


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  container.appendChild(
    row
  );


  container.scrollTop =
    container.scrollHeight;

}


/* ==================================================
   REALTIME
================================================== */

function subscribeToMessages(){

  if(!currentUserId){

    return;

  }


  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "messages-" +
        currentUserId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async function(payload){

          const message =
            payload.new;


          if(
            message.sender_id ===
              currentUserId ||
            message.receiver_id ===
              currentUserId
          ){

            if(
              currentChatUserId &&
              (
                (
                  message.sender_id ===
                  currentUserId &&
                  message.receiver_id ===
                  currentChatUserId
                )
                ||
                (
                  message.sender_id ===
                  currentChatUserId &&
                  message.receiver_id ===
                  currentUserId
                )
              )
            ){

              addMessageIfMissing(
                message
              );


              if(
                message.receiver_id ===
                currentUserId
              ){

                await markMessageRead(
                  message.id
                );

              }

            }


            await loadConversations();

          }

        }
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"messages"
        },
        async function(){

          await loadConversations();

          if(currentChatUserId){

            await loadChatMessages();

          }

        }
      )
      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"messages"
        },
        async function(){

          await loadConversations();

          if(currentChatUserId){

            await loadChatMessages();

          }

        }
      )
      .subscribe();

}


/* ==================================================
   READ / UNREAD
================================================== */

async function markConversationRead(
  otherUserId
){

  if(!currentUserId){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      is_read:true
    })
    .eq(
      "sender_id",
      otherUserId
    )
    .eq(
      "receiver_id",
      currentUserId
    )
    .eq(
      "is_read",
      false
    );


  if(error){

    console.error(
      "Read status error:",
      error
    );

  }

}


async function markMessageRead(
  messageId
){

  if(!currentUserId){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      is_read:true
    })
    .eq(
      "id",
      messageId
    )
    .eq(
      "receiver_id",
      currentUserId
    );


  if(error){

    console.error(
      "Message read error:",
      error
    );

  }

}


/* ==================================================
   DELETE MESSAGE
================================================== */

async function deleteMessage(
  messageId
){

  if(!currentUserId){

    return;

  }


  const confirmed =
    confirm(
      "Delete this message?"
    );


  if(!confirmed){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .delete()
    .eq(
      "id",
      messageId
    )
    .eq(
      "sender_id",
      currentUserId
    );


  if(error){

    console.error(
      "Delete message error:",
      error
    );

    alert(
      "Could not delete message: " +
      error.message
    );

    return;

  }


  await loadChatMessages();

  await loadConversations();

}

/* ==================================================
   USER SEARCH
================================================== */

let searchTimer = null;


document
  .getElementById("userSearch")
  .addEventListener(
    "input",
    function(){

      clearTimeout(
        searchTimer
      );


      const query =
        this.value
          .trim();


      if(!query){

        document.getElementById(
          "userResults"
        ).innerHTML = `
          <div class="loading">
            Search for a user.
          </div>
        `;

        return;

      }


      searchTimer =
        setTimeout(
          function(){

            searchUsers(
              query
            );

          },
          350
        );

    }
  );


async function searchUsers(query){

  const container =
    document.getElementById(
      "userResults"
    );


  container.innerHTML =
    `<div class="loading">
      Searching...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .ilike(
      "username",
      "%" +
      query +
      "%"
    )
    .neq(
      "id",
      currentUserId
    )
    .limit(30);


  if(error){

    console.error(
      "User search error:",
      error
    );

    container.innerHTML = `
      <div class="loading">
        Search failed.
      </div>
    `;

    return;

  }


  const users =
    data || [];


  if(!users.length){

    container.innerHTML = `
      <div class="loading">
        No users found.
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  users.forEach(profile => {

    const username =
      profile.username ||
      "User";


    const avatar =
      profile.avatar_url ||
      "";


    const initial =
      username
        .charAt(0)
        .toUpperCase();


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "user-result";


    row.innerHTML = `

      <div class="avatar">

        ${
          avatar
          ?
          `
          <img
            src="${escapeHtml(avatar)}"
            alt="Profile">
          `
          :
          escapeHtml(initial)
        }

      </div>

      <div class="user-result-info">

        <div class="user-result-name">
          ${escapeHtml(username)}
        </div>

        <div class="user-result-handle">
          @${escapeHtml(username)}
        </div>

      </div>

    `;


    row.addEventListener(
      "click",
      function(){

        closeNewMessage();

        openConversation(
          profile.id,
          profile
        );

      }
    );


    container.appendChild(
      row
    );

  });

}


/* ==================================================
   SEARCH CONVERSATIONS
================================================== */

document
  .getElementById(
    "conversationSearch"
  )
  .addEventListener(
    "input",
    function(){

      const query =
        this.value
          .toLowerCase()
          .trim();


      if(!query){

        renderConversations(
          conversationData
        );

        return;

      }


      const filtered =
        conversationData.filter(
          item => {

            const username =
              (
                item.profile?.username ||
                "User"
              )
              .toLowerCase();


            const message =
              (
                item.last_message?.content ||
                ""
              )
              .toLowerCase();


            return (
              username.includes(query) ||
              message.includes(query)
            );

          }
        );


      renderConversations(
        filtered
      );

    }
  );

/* ==================================================
   HELPERS
================================================== */

function formatTime(dateString){

  if(!dateString){

    return "";

  }


  const date =
    new Date(dateString);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  const now =
    new Date();


  const diff =
    Math.floor(
      (now - date) / 1000
    );


  if(diff < 60){

    return "now";

  }


  const minutes =
    Math.floor(
      diff / 60
    );


  if(minutes < 60){

    return minutes + "m";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d";

  }


  return date.toLocaleDateString();

}


function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value == null
    ? ""
    : String(value);


  return div.innerHTML;

}


function cssEscape(value){

  if(
    window.CSS &&
    typeof window.CSS.escape ===
      "function"
  ){

    return window.CSS.escape(
      String(value)
    );

  }


  return String(value)
    .replace(
      /"/g,
      '\\"'
    );

}
