${own?`<button class="comment-delete" onclick="deleteComment('${escapeJs(c.id)}','${escapeJs(id)}')">Delete</button>`:""}</div></div>`});return h+`<div class="comment-input-row"><input id="comment-input-${escapeHtml(id)}" class="comment-input" maxlength="1000" placeholder="Write a comment..."><button class="comment-send" onclick="addComment('${escapeJs(id)}')">Send</button></div>`}async function addComment(id){if(!requireLogin())return;const input=document.getElementById("comment-input-"+id),text=input?.value.trim();if(!text)return;const{error}=await supabaseClient.from("post_comments").insert({post_id:id,user_id:currentSession.user.id,comment:text,content:text});if(error)return alert("Could not add comment: "+error.message);if(input)input.value="";await refreshSinglePostComments(id);await renderPosts()}async function deleteComment(id,postId){if(!requireLogin())return;const{data,error}=await supabaseClient.from("post_comments").select("user_id").eq("id",id).maybeSingle();if(error||!data)return alert("Comment not found.");if(data.user_id!==currentSession.user.id)return alert("You can only delete your own comment.");if(!confirm("Delete this comment?"))return;const r=await supabaseClient.from("post_comments").delete().eq("id",id).eq("user_id",currentSession.user.id);if(r.error)alert(r.error.message);else{await refreshSinglePostComments(postId);await renderPosts()}}
function openCreatePost(){if(!requireLogin())return;document.getElementById("createPostModal").style.display="flex";document.getElementById("postContentInput").focus();document.getElementById("mediaType").value="text";updateMediaControls()}function closeCreatePost(){document.getElementById("createPostModal").style.display="none";const i=document.getElementById("mediaFileInput");if(i)i.value="";const p=document.getElementById("mediaPreview");if(p?.dataset.previewUrl){URL.revokeObjectURL(p.dataset.previewUrl);delete p.dataset.previewUrl}}function updateMediaControls(){const t=document.getElementById("mediaType").value,c=document.getElementById("mediaControls"),n=document.getElementById("promotionNotice");c.innerHTML="";n.innerHTML="";if(t==="text"){n.innerHTML='<div class="info-box">Text posts are available.</div>';return}if(t==="image"){c.innerHTML='<label class="media-label">Select Picture</label><input id="mediaFileInput" class="media-input" type="file" accept="image/*" onchange="previewMedia()"><div class="media-note">Select a picture from your device. The original image is uploaded directly to Supabase Storage.</div><div id="mediaPreview" class="media-preview"></div>';n.innerHTML='<div class="info-box">Picture post enabled.</div>';return}if(!canPostVideo()){c.innerHTML='<div class="locked-feature"><strong>Video posts require Premium+.</strong><br><br>Your account does not currently have permission to publish video posts.</div>';return}c.innerHTML='<label class="media-label">Video URL</label><input id="mediaUrlInput" class="media-input" type="url" placeholder="https://example.com/video.mp4" oninput="previewMedia()"><div class="media-note">Use a publicly accessible video URL or connect this field to your Supabase Storage upload system.</div><div id="mediaPreview" class="media-preview"></div>';n.innerHTML='<div class="info-box">🎥 Video post enabled for your account.</div>'}function previewMedia(){const t=document.getElementById("mediaType").value,p=document.getElementById("mediaPreview");if(!p)return;if(t==="image"){const f=document.getElementById("mediaFileInput")?.files?.[0];if(!f){p.innerHTML="";return}const old=p.dataset.previewUrl;if(old)URL.revokeObjectURL(old);const u=URL.createObjectURL(f);p.dataset.previewUrl=u;p.innerHTML=`<img src="${escapeHtml(u)}" alt="Preview">`;return}const u=document.getElementById("mediaUrlInput")?.value.trim()||"";p.innerHTML=u?`<video src="${escapeHtml(u)}" controls playsinline></video>`:""}async function createPost(){if(!requireLogin())return;const content=document.getElementById("postContentInput").value.trim(),visibility=document.getElementById("postVisibility").value,type=document.getElementById("mediaType").value;if(!content)return alert("Write something first.");if(type==="video"&&!canPostVideo())return alert("Video posts require Premium+.");let mediaUrl="",file=null;if(type==="image"){file=document.getElementById("mediaFileInput")?.files?.[0]||null;if(!file)return alert("Select a picture first.");if(!file.type.startsWith("image/"))return alert("Please select an image file.")}if(type==="video"){mediaUrl=document.getElementById("mediaUrlInput")?.value.trim()||"";if(!mediaUrl)return alert("Add a media URL first.")}const b=document.getElementById("publishPostBtn");b.disabled=true;b.textContent="Publishing...";try{if(type==="image"){const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg",path=`${currentSession.user.id}/${crypto.randomUUID()}.${ext}`,upload=await supabaseClient.storage.from(POST_IMAGE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;const{data}=supabaseClient.storage.from(POST_IMAGE_BUCKET).getPublicUrl(path);if(!data?.publicUrl)throw new Error("Could not create image URL.");mediaUrl=data.publicUrl}const payload={user_id:currentSession.user.id,content,visibility};if(type!=="text")Object.assign(payload,{media_url:mediaUrl,media_type:type});const{error}=await supabaseClient.from("posts").insert(payload);if(error)throw error;document.getElementById("postContentInput").value="";document.getElementById("postVisibility").value="public";document.getElementById("mediaType").value="text";closeCreatePost();await loadPosts()}catch(e){alert("Could not publish post: "+(e?.message||"Unknown error"))}finally{b.disabled=false;b.textContent="Publish Post"}}async function deletePost(id){if(!requireLogin())return;const{data,error}=await supabaseClient.from("posts").select("user_id").eq("id",id).maybeSingle();if(error||!data)return alert("Post not found.");if(data.user_id!==currentSession.user.id)return alert("You can only delete your own post.");if(!confirm("Delete this post?"))return;const r=await supabaseClient.from("posts").delete().eq("id",id).eq("user_id",currentSession.user.id);if(r.error)alert(r.error.message);else await loadPosts()}async function sharePost(id){if(!requireLogin())return;const url=location.origin+location.pathname+"?post="+encodeURIComponent(id);if(navigator.share){try{await navigator.share({title:"P2P Social",text:"Check out this post on P2P Social",url})}catch(e){if(e.name!=="AbortError")console.log(e)}return}try{await navigator.clipboard.writeText(url);alert("Post link copied.")}catch(e){prompt("Copy this post link:",url)}}
async function loadNotifications(){if(!currentSession)return resetNotifications();const{data,error}=await supabaseClient.from("notifications").select("id,user_id,type,title,body,link,is_read,created_at").eq("user_id",currentSession.user.id).order("created_at",{ascending:false}).limit(50);if(error)return console.log("Notifications:",error.message);renderNotifications(data||[])}function renderNotifications(list){const e=document.getElementById("notificationList"),b=document.getElementById("notificationBadge");if(!list.length){e.innerHTML='<div class="no-notifications">🔔 No notifications yet.</div>';b.style.display="none";return}const unread=list.filter(n=>!n.is_read).length;if(unread){b.textContent=unread>99?"99+":unread;b.style.display="flex"}else b.style.display="none";e.innerHTML="";list.forEach(n=>{const item=document.createElement("div");item.className="notification-item"+(n.is_read?"":" unread");item.innerHTML=`<div class="notification-icon">${notificationIcon(n.type)}</div><div class="notification-content"><div class="notification-title">${escapeHtml(n.title||"Notification")}</div><div class="notification-body">${escapeHtml(n.body||"")}</div><div class="notification-time">${escapeHtml(formatPostTime(n.created_at))}</div></div>`;item.onclick=async()=>{if(!n.is_read)await markNotificationRead(n.id);if(n.link)location.href=n.link;else openMessages()};e.appendChild(item)})}function notificationIcon(t){return{message:"💬",like:"❤️",comment:"💬",follow:"👤",wallet:"",deposit:"",withdraw:"",transfer:"",trade:"",premium:"",live:"",verification:"",security:""}[t]||"🔔"}async function markNotificationRead(id){if(!currentSession)return;const{error}=await supabaseClient.from("notifications").update({is_read:true}).eq("id",id).eq("user_id",currentSession.user.id);if(error)console.error(error);await loadNotifications()}async function markAllNotificationsRead(){if(!currentSession)return;const{error}=await supabaseClient.from("notifications").update({is_read:true}).eq("user_id",currentSession.user.id).eq("is_read",false);if(error)return alert("Could not mark notifications as read.");await loadNotifications()}function resetNotifications(){document.getElementById("notificationBadge").style.display="none";document.getElementById("notificationList").innerHTML='<div class="no-notifications">Login to see notifications.</div>'}function toggleNotificationPanel(e){e?.stopPropagation();if(!requireLogin())return;const p=document.getElementById("notificationPanel");p.classList.toggle("open");if(p.classList.contains("open"))loadNotifications()}function subscribeToNotifications(){if(!currentSession)return;if(notificationChannel)supabaseClient.removeChannel(notificationChannel);const uid=currentSession.user.id;notificationChannel=supabaseClient.channel("notifications-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+uid},()=>loadNotifications()).subscribe()}
function toggleMenu(e){e?.stopPropagation();if(!requireLogin())return;document.getElementById("menuPanel").classList.toggle("open")}function closeMenu(){document.getElementById("menuPanel")?.classList.remove("open")}function openAbout(){openInfo("About",'<div class="about-text"><strong>P2P Social</strong><br><br>P2P Social is a community-driven P2P platform where you can buy and sell USDT or TON, manage your wallet, connect with traders, and trade securely — all in one place.<br><br><strong>Trade • Connect • Grow</strong></div>')}function openInfo(title,body){document.getElementById("infoTitle").textContent=title;document.getElementById("infoBody").innerHTML=body;document.getElementById("infoModal").style.display="flex";closeMenu()}function closeInfo(){document.getElementById("infoModal").style.display="none"}function goHome(){if(requireLogin())location.href="./index.html"}function openBuy(){if(requireLogin())location.href="./🟢.html"}function openSell(){if(requireLogin())location.href="./🔴.html"}function openMessages(){if(requireLogin())location.href="./message.html"}function openProfile(){if(requireLogin())location.href="./profile.html"}function openUserProfile(username){if(!requireLogin())return;username=String(username||"").replace(/^@/,"").trim();if(username)location.href="./user_profile.html?username="+encodeURIComponent(username)}async function logout(){try{const{error}=await supabaseClient.auth.signOut();if(error)return alert("Logout failed: "+error.message);currentSession=null;redirectToLogin()}catch(e){redirectToLogin()}}
function formatPostTime(date){if(!date)return"";const d=new Date(date),diff=Math.floor((Date.now()-d)/1000);if(Number.isNaN(d.getTime()))return"";if(diff<60)return"just now";if(diff<3600)return Math.floor(diff/60)+"m ago";if(diff<86400)return Math.floor(diff/3600)+"h ago";if(diff<604800)return Math.floor(diff/86400)+"d ago";return d.toLocaleDateString()}function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,"\\n").replace(/\r/g,"\\r")}
document.addEventListener("click",e=>{const np=document.getElementById("notificationPanel"),nb=document.getElementById("notificationButton"),mp=document.getElementById("menuPanel");if(np&&!np.contains(e.target)&&nb&&!nb.contains(e.target))np.classList.remove("open");if(mp&&!mp.contains(e.target)&&!e.target.closest(".menu-btn"))mp.classList.remove("open");["infoModal","createPostModal"].forEach(id=>{const m=document.getElementById(id);if(m&&e.target===m)m.style.display="none"})});document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("menuPanel")?.classList.remove("open");["infoModal","createPostModal"].forEach(id=>{const m=document.getElementById(id);if(m)m.style.display="none"})}});startApp();
