<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market • P2P Social</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7f8;

}

.header{

    padding:16px;

    align-items:center;
    gap:12px;
    position:sticky;
    top:0;

}

.back-btn{

    color:#fff;
    width:40px;
    height:40px;
    border-radius:50%;

}

.logo{

}

.container{

}

.card{

}

.verify-card{
    display:flex;
    align-items:center;
    justify-content:space-between;

}

.verify-info{

    align-items:center;
    gap:12px;
}

.verify-icon{

}

.verify-title{

}

.verify-sub{

    font-size:13px;
}

.verify-btn{
    border:none;
    background:#075e54;
    color:#fff;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:12px;
}

.market-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.refresh-btn{
    border:none;
    background:#075e54;
    color:#fff;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
}

.tabs{
    display:flex;
    gap:8px;
    margin:14px 0;
}

.tab{
    flex:1;
    border:none;
    padding:12px;
    border-radius:10px;

    background:#eee;
    color:#444;
}

.tab.buy.active{
    background:#075e54;
    color:#fff;
}

.tab.sell.active{
    background:#d93025;
    color:#fff;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.filter-group label{
    font-size:12px;
    color:#777;
    font-weight:600;
}

.filter-group input,
.filter-group select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    background:#fff;
}

.online-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    color:#555;
    margin-bottom:5px;
}

.count{
    color:#777;
    font-size:13px;
    margin-bottom:10px;
}

.ad-card{
    border:1px solid #eee;
    border-radius:13px;
    padding:14px;
    margin-bottom:11px;
    background:#fff;
}

.ad-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.advertiser{
    display:flex;
    align-items:center;

}

.avatar{

}

.username{

.status{

}

.online{

}

.verified{

}

.price{

}

.ad-info{
    display:grid;

.ad-info div{

.tags{

.tag{

}

.trade-btn{

    border:none;
    margin-top:12px;
    padding:11px;
    border-radius:9px;

}

.trade-btn.buy{

}

.trade-btn.sell{

.empty{

.leaderboard-title{
    font-size:18px;

.leader-row{

    gap:10px;

}

.leader-row:last-child{

}

.rank{

.leader-avatar{

}

.leader-name{

}

.leader-volume{

.bottom-nav{

}

.nav-item{
    background:none;
    border:none;
    color:#666;
    font-size:11px;
    cursor:pointer;
    text-align:center;
}

.nav-item span{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.nav-item.active{
    color:#075e54;
    font-weight:700;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;

.modal.show{

}

.modal-box{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:15px;

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

}

.modal-title{

}

.close-btn{
    border:none;

.form-group{

}

.form-group label{

    font-size:13px;

.form-group input,

    width:100%;

    border:1px solid #ddd;

.summary{
    background:#f5f7f8;

    padding:12px;
    margin:12px 0;
}

.summary-row{
    display:flex;
    justify-content:space-between;

    font-size:14px;
}

.summary-total{
    font-size:18px;

.continue-btn{
    width:100%;

    color:#fff;

    border-radius:10px;
    font-weight:700;

}

.continue-btn.sell{

}

.warning{
    background:#fff4e5;
    color:#8a5700;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:12px;
}

.success{
    background:#e9f7ef;
    color:#146c36;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:12px;
}

@media(max-width:600px){
    .filters{
        grid-template-columns:1fr;
    }

    .verify-card{
        align-items:flex-start;
    }

    .verify-btn{
        padding:9px 10px;

}
</style>

<script>
const SUPABASE_URL = "https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const { createClient } = supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentSession = null;
let currentProfile = null;

let currentTradeType = "buy";

let allAds = [];
let filteredAds = [];

let selectedAd = null;

let realtimeChannel = null;

/*
 * DISPLAY LIMITS
 *
 * Buy  = maximum 17 advertisers
 * Sell = maximum 20 advertisers
 */
const BUY_DISPLAY_LIMIT = 17;
const SELL_DISPLAY_LIMIT = 20;


/* =========================
   START APP
========================= */

async function startApp(){

    try{

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if(!session){

            window.location.href = "login.html";
            return;
        }

        currentSession = session;

        await loadProfile();

        await loadVerificationStatus();

        await loadAds();

        await loadLeaderboard();

        startRealtime();

    }catch(error){

        console.error("startApp error:", error);

        document.getElementById("adsList").innerHTML =
            `<div class="empty">Unable to load market.</div>`;
    }
}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentSession.user.id)
        .maybeSingle();

    if(error){

        console.error("Profile error:", error);
        return;
    }

    currentProfile = data;
}


/* =========================
   VERIFICATION
========================= */

async function loadVerificationStatus(){

    const text = document.getElementById("verificationText");
    const button = document.querySelector(".verify-btn");

    let verified = false;

    if(currentProfile){

        verified =
            currentProfile.verified === true ||
            currentProfile.is_verified === true ||
            currentProfile.identity_verified === true;
    }

    if(!verified){

        try{

            const {
                data,
                error
            } = await supabaseClient
                .from("identity_verifications")
                .select("status")
                .eq("user_id", currentSession.user.id)
                .eq("status","approved")
                .maybeSingle();

            if(!error && data){
                verified = true;
            }

        }catch(error){

            console.log("Identity verification table check skipped.");
        }
    }

    if(verified){

        text.textContent = "Your identity is verified.";
        button.textContent = "Verified";
        button.disabled = true;
        button.style.opacity = ".7";

    }else{

        text.textContent =
            "Verification helps keep P2P trading safe.";

        button.textContent = "Verify";
        button.disabled = false;
        button.style.opacity = "1";
    }
}


function openVerification(){

    document
        .getElementById("verificationModal")
        .classList.add("show");
}


function closeVerification(){

    document
        .getElementById("verificationModal")
        .classList.remove("show");
}


function goVerification(){

    window.location.href = "verification.html";
}


/* =========================
   TRADE TYPE
========================= */

function setTradeType(type){

    currentTradeType = type;

    const buyTab = document.getElementById("buyTab");
    const sellTab = document.getElementById("sellTab");

    buyTab.classList.toggle("active", type === "buy");
    sellTab.classList.toggle("active", type === "sell");

    filterAds();
}


/* =========================
   LOAD ADS
========================= */

async function loadAds(){

    const list = document.getElementById("adsList");

    list.innerHTML =
        `<div class="empty">Loading advertisers...</div>`;

    const {
        data,
        error
    } = await supabaseClient
        .from("p2p_ads")
        .select("*")
        .eq("active", true)
        .eq("asset", "USDT")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error("Ads error:", error);

        list.innerHTML =
            `<div class="empty">Unable to load advertisers.</div>`;

        return;
    }

    allAds = data || [];

    await attachAdProfiles();

    filterAds();
}


/* =========================
   ATTACH PROFILES
========================= */

async function attachAdProfiles(){

    if(!allAds.length){
        return;
    }

    const userIds = [
        ...new Set(
            allAds
                .map(ad => ad.user_id || ad.owner_id || ad.advertiser_id)
                .filter(Boolean)
        )
    ];

    if(!userIds.length){
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .in("id", userIds);

    if(error){

        console.error("Advertiser profiles error:", error);
        return;
    }

    const profileMap = {};

    (data || []).forEach(profile => {
        profileMap[profile.id] = profile;
    });

    allAds = allAds.map(ad => {

        const ownerId =
            ad.user_id ||
            ad.owner_id ||
            ad.advertiser_id;

        return {
            ...ad,
            profile: profileMap[ownerId] || null
        };
    });
}


/* =========================
   FILTER ADS
========================= */

function filterAds(){

    const amountValue =
        parseFloat(
            document.getElementById("amountFilter").value
        );

    const payment =
        document.getElementById("paymentFilter").value;

    const onlineOnly =
        document.getElementById("onlineOnly").checked;

    filteredAds = allAds.filter(ad => {

        const adType =
            String(
                ad.type ||
                ad.trade_type ||
                ad.side ||
                ""
            ).toLowerCase();

        /*
         * Accept both common representations:
         * buy / sell
         */
        if(adType && adType !== currentTradeType){
            return false;
        }

        if(payment){

            const methods = getPaymentMethods(ad);

            if(!methods.includes(
                normalizePayment(payment)
            )){
                return false;
            }
        }

        if(onlineOnly){

            const profile = ad.profile || {};

            const online =
                ad.online === true ||
                ad.is_online === true ||
                profile.online === true ||
                profile.is_online === true;

            if(!online){
                return false;
            }
        }

        if(!isNaN(amountValue)){

            const min =
                parseFloat(
                    ad.min_amount ||
                    ad.min ||
                    0
                );

            const max =
                parseFloat(
                    ad.max_amount ||
                    ad.max ||
                    ad.available ||
                    Infinity
                );

            if(amountValue < min || amountValue > max){
                return false;
            }
        }

        return true;
    });

    renderAds(filteredAds);
}


/* =========================
   MAX DISPLAY
========================= */

function getCurrentDisplayLimit(){

    return currentTradeType === "buy"
        ? BUY_DISPLAY_LIMIT
        : SELL_DISPLAY_LIMIT;
}


/* =========================
   RENDER ADS
========================= */

function renderAds(ads){

    const list = document.getElementById("adsList");

    /*
     * IMPORTANT:
     * Only the visible list is limited.
     * Refresh still reloads the latest active ads.
     */
    const displayLimit = getCurrentDisplayLimit();

    const visibleAds = ads.slice(0, displayLimit);

    document.getElementById("advertiserCount").textContent =
        `${visibleAds.length} advertiser${visibleAds.length === 1 ? "" : "s"}`;

    if(!visibleAds.length){

        list.innerHTML =
            `<div class="empty">
                No ${currentTradeType} advertisers found.
            </div>`;

        return;
    }

    list.innerHTML = visibleAds
        .map(ad => createAdCard(ad))
        .join("");
}


/* =========================
   AD CARD
========================= */

function createAdCard(ad){

    const profile = ad.profile || {};

    const username =
        profile.username ||
        profile.full_name ||
        profile.name ||
        "User";

    const avatar =
        profile.avatar_url ||
        profile.avatar ||
        "https://via.placeholder.com/80";

    const verified =
        profile.verified === true ||
        profile.is_verified === true ||
        profile.identity_verified === true ||
        ad.verified === true;

    const online =
        ad.online === true ||
        ad.is_online === true ||
        profile.online === true ||
        profile.is_online === true;

    const price =
        parseFloat(
            ad.price ||
            ad.rate ||
            ad.usdt_price ||
            0
        );

    const available =
        parseFloat(
            ad.available ||
            ad.available_amount ||
            ad.amount ||
            0
        );

    const min =
        parseFloat(
            ad.min_amount ||
            ad.min ||
            0
        );

    const max =
        parseFloat(
            ad.max_amount ||
            ad.max ||
            available
        );

    const paymentMethods =
        getPaymentMethods(ad);

    const paymentText =
        paymentMethods.length
            ? paymentMethods.map(displayPayment).join(", ")
            : "Payment method";

    const buttonText =
        currentTradeType === "buy"
            ? "🟢 Buy"
            : "🔴 Sell";

    const buttonClass =
        currentTradeType === "buy"
            ? "buy"
            : "sell";

    return `

/* =========================
   OPEN TRADE
========================= */

function openTradeModal(adId){

    selectedAd =
        allAds.find(ad =>
            String(ad.id) === String(adId)
        );

    if(!selectedAd){
        alert("Advertiser not found.");
        return;
    }

    const profile =
        selectedAd.profile || {};

    const username =
        profile.username ||
        profile.full_name ||
        profile.name ||
        "Advertiser";

    const price =
        parseFloat(
            selectedAd.price ||
            selectedAd.rate ||
            selectedAd.usdt_price ||
            0
        );

    const available =
        parseFloat(
            selectedAd.available ||
            selectedAd.available_amount ||
            selectedAd.amount ||
            0
        );

    const min =
        parseFloat(
            selectedAd.min_amount ||
            selectedAd.min ||
            0
        );

    const max =
        parseFloat(
            selectedAd.max_amount ||
            selectedAd.max ||
            available
        );

    document.getElementById("tradeTitle").textContent =
        currentTradeType === "buy"
            ? "🟢 Buy USDT"
            : "🔴 Sell USDT";

    document.getElementById("tradeSubtitle").textContent =
        `with ${username}`;

    document.getElementById("tradePrice").textContent =
        `${formatNumber(price)} ETB`;

    document.getElementById("tradeAvailable").textContent =
        `${formatNumber(available)} USDT`;

    document.getElementById("tradeLimits").textContent =
        `${formatNumber(min)} - ${formatNumber(max)} USDT`;

    document.getElementById("tradeAmount").value = "";

    document.getElementById("tradePayment").value = "";

    document.getElementById("tradeTotal").textContent =
        "0 ETB";

    const continueButton =
        document.getElementById("confirmTradeBtn");

    continueButton.className =
        `continue-btn ${currentTradeType === "sell" ? "sell" : ""}`;

    continueButton.disabled = false;
    continueButton.textContent = "Continue";

    document
        .getElementById("tradeModal")
        .classList.add("show");
}


function closeTradeModal(){

    document
        .getElementById("tradeModal")
        .classList.remove("show");

    selectedAd = null;
}


/* =========================
   TRADE SUMMARY
========================= */

function updateTradeSummary(){

    if(!selectedAd){
        return;
    }

    const amount =
        parseFloat(
            document.getElementById("tradeAmount").value
        ) || 0;

    const price =
        parseFloat(
            selectedAd.price ||
            selectedAd.rate ||
            selectedAd.usdt_price ||

        );

    const total = amount * price;

    document.getElementById("tradeTotal").textContent =

}


/* =========================
   CONFIRM TRADE
========================= */

async function confirmTrade(){

    if(!currentSession){
        alert("Please log in first.");
        return;
    }

    if(!selectedAd){
        alert("Please select an advertiser.");
        return;
    }

    const amount =
        parseFloat(
            document.getElementById("tradeAmount").value
        );

    const payment =
        document.getElementById("tradePayment").value;

    if(!amount || amount <= 0){

        alert("Enter a valid amount.");
        return;
    }

    if(!payment){

        alert("Select a payment method.");
        return;
    }

    const min =
        parseFloat(
            selectedAd.min_amount ||
            selectedAd.min ||
            0
        );

    const max =
        parseFloat(
            selectedAd.max_amount ||
            selectedAd.max ||
            selectedAd.available ||
            Infinity
        );

    if(amount < min){

        alert(
            `Minimum amount is ${formatNumber(min)} USDT.`
        );

        return;
    }

    if(amount > max){

        alert(
            `Maximum amount is ${formatNumber(max)} USDT.`
        );

        return;
    }

    const advertiserId =
        selectedAd.user_id ||
        selectedAd.owner_id ||
        selectedAd.advertiser_id;

    if(!advertiserId){

        alert("Advertiser account could not be found.");
        return;
    }

    if(String(advertiserId) === String(currentSession.user.id)){

        alert("You cannot trade with your own advertisement.");
        return;
    }

    const button =
        document.getElementById("confirmTradeBtn");

    button.disabled = true;
    button.textContent = "Creating trade...";

    try{

        /*
         * EXISTING P2P ORDER CREATION
         */
        const {
            data: orderData,
            error: orderError
        } = await supabaseClient.rpc(
            "create_p2p_order",
            {
                p_ad_id: selectedAd.id,
                p_amount: amount,
                p_payment_method: payment,
                p_type: currentTradeType
            }
        );

        if(orderError){

            console.error(
                "P2P order error:",
                orderError
            );

            throw orderError;
        }

        /*
         * The P2P order has now been successfully created.
         *
         * Next step:
         * create/find the existing conversation with
         * the advertiser and open Messages.
         */
        button.textContent = "Opening Messages...";

        const conversationId =
            await getOrCreateConversation(advertiserId);

        if(!conversationId){

            /*
             * The order was successfully created even if
             * the conversation could not be opened.
             */
            closeTradeModal();

            alert(
                "P2P order created successfully. Messages could not be opened."
            );

            return;
        }

        /*
         * Navigate to the existing Messages page.
         *
         * message.html already handles opening conversations
         * through its normal conversation workflow.
         */
        closeTradeModal();

        window.location.href =
            `message.html?conversation_id=${encodeURIComponent(conversationId)}`;

    }catch(error){

        console.error("Trade completion error:", error);

        button.disabled = false;
        button.textContent = "Continue";

        alert(
            error.message ||
            "Unable to create the P2P order."
        );
    }
}


/* =========================
   GET / CREATE CONVERSATION
========================= */

/*
 * Uses the existing P2P Social messaging schema:
 *
 * conversations
 *   user1_id
 *   user2_id
 *
 * IDs are stored in canonical lexical order,
 * matching message.html's existing workflow.
 */
async function getOrCreateConversation(otherUserId){

    if(!currentSession || !otherUserId){
        return null;
    }

    const currentUserId =
        currentSession.user.id;

    if(String(currentUserId) === String(otherUserId)){
        return null;
    }

    const ids = [
        String(currentUserId),
        String(otherUserId)
    ].sort();

    const firstUserId = ids[0];
    const secondUserId = ids[1];

    /*
     * First try to find the existing conversation.
     */
    const {
        data: existingConversation,
        error: findError
    } = await supabaseClient
        .from("conversations")
        .select("id")
        .eq("user1_id", firstUserId)
        .eq("user2_id", secondUserId)
        .maybeSingle();

    if(existingConversation){

        return existingConversation.id;
    }

    /*
     * If the lookup returned a genuine database error,
     * report it rather than silently creating bad data.
     */
    if(findError){

        console.error(
            "Conversation lookup error:",
            findError
        );

        /*
         * Continue only when it is simply a missing row.
         * Supabase normally returns null/no-row for maybeSingle.
         */
    }

    /*
     * Create the conversation.
     */
    const {
        data: newConversation,
        error: insertError
    } = await supabaseClient
        .from("conversations")
        .insert({
            user1_id: firstUserId,
            user2_id: secondUserId
        })
        .select("id")
        .single();

    if(!insertError && newConversation){

        return newConversation.id;
    }

    /*
     * Another request may have created the same conversation
     * at the same time. Retry the lookup.
     */
    const {
        data: retryConversation,
        error: retryError
    } = await supabaseClient
        .from("conversations")
        .select("id")
        .eq("user1_id", firstUserId)
        .eq("user2_id", secondUserId)
        .maybeSingle();

    if(retryConversation){

        return retryConversation.id;
    }

    console.error(
        "Conversation creation error:",
        insertError || retryError
    );

    return null;
}


/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard(){

    const container =
        document.getElementById("leaderboard");

    const {
        data,
        error
    } = await supabaseClient
        .from("p2p_leaderboard")
        .select("*")
        .order("volume", {
            ascending:false
        })
        .limit(10);

    if(error){

        console.error(
            "Leaderboard error:",
            error
        );

        container.innerHTML =
            `<div class="empty">
                Unable to load leaderboard.
            </div>`;

        return;
    }

    if(!data || !data.length){

        container.innerHTML =
            `<div class="empty">
                No leaderboard data yet.
            </div>`;

        return;
    }

    const userIds = data
        .map(row =>
            row.user_id ||
            row.profile_id ||
            row.id
        )
        .filter(Boolean);

    let profiles = [];

    if(userIds.length){

        const {
            data: profileData
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .in("id", userIds);

        profiles = profileData || [];
    }

    const profileMap = {};

    profiles.forEach(profile => {
        profileMap[profile.id] = profile;
    });

    container.innerHTML =
        data.map((row,index) => {

            const userId =
                row.user_id ||
                row.profile_id ||
                row.id;

            const profile =
                profileMap[userId] || {};

            const username =
                profile.username ||
                profile.full_name ||
                profile.name ||
                "User";

            const avatar =
                profile.avatar_url ||
                profile.avatar ||
                "https://via.placeholder.com/80";

            const volume =
                row.volume ||
                row.total_volume ||
                row.amount ||
                0;

            return `
                <div class="leader-row">

                    <div class="rank">
                        #${index + 1}
                    </div>

                    <img
                        class="leader-avatar"
                        src="${escapeHtml(avatar)}"
                        onerror="this.src='https://via.placeholder.com/80'"
                    >

                    <div class="leader-name">
                        ${escapeHtml(username)}
                    </div>

                    <div class="leader-volume">
                        ${formatNumber(volume)} USDT
                    </div>

                </div>
            `;

        }).join("");
}

/* =========================
   REALTIME
========================= */

function startRealtime(){

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }

    realtimeChannel =
        supabaseClient
            .channel("p2p-market-realtime")

            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"p2p_ads"
                },
                async () => {

                    await loadAds();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"p2p_leaderboard"
                },
                async () => {

                    await loadLeaderboard();
                }
            )

            .subscribe();
}


/* =========================
   PAYMENT HELPERS
========================= */

function getPaymentMethods(ad){

    let methods =
        ad.payment_methods ||
        ad.payment_method ||
        ad.payment ||
        [];

    if(Array.isArray(methods)){

        return methods
            .map(normalizePayment)
            .filter(Boolean);
    }

    if(typeof methods === "string"){

        return methods
            .split(",")
            .map(item =>
                normalizePayment(item)
            )
            .filter(Boolean);
    }

    return [];
}


function normalizePayment(value){

    if(!value){
        return "";
    }

    return String(value)
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"_");
}


function displayPayment(value){

    const map = {
        telebirr:"Telebirr",
        bank:"Bank",
        cbe:"CBE",
        awash:"Awash",
        dashen:"Dashen",
        abyssinia:"Abyssinia"
    };

    return map[value] ||
        String(value)
            .replace(/_/g," ")
            .replace(/\b\w/g,c => c.toUpperCase());
}

/* =========================
   UTILITY
========================= */

function formatNumber(value){

    const number =
        Number(value);

    if(!Number.isFinite(number)){
        return "0";
    }

    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );
}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
