<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live - P2P Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #111827;
      border-bottom: 1px solid #273244;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .live-status {
      color: #ff3b5c;
      font-weight: bold;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    /* VIDEO */

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(circle at center, #26334d, #080b12);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-icon {
      font-size: 60px;
      opacity: 0.6;
    }

    .live-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #ef233c;
      padding: 7px 12px;
      border-radius: 7px;
      font-weight: bold;
    }

    .viewers {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.65);
      padding: 7px 12px;
      border-radius: 7px;
    }

    /* STREAM INFO */

    .stream-info {
      padding: 18px 3px;
    }

    .stream-info h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .host {
      color: #9ca3af;
    }

    .host span {
      color: #60a5fa;
      font-weight: bold;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .actions button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      background: #1f2937;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .actions button:hover {
      background: #374151;
    }

    .gift-btn {
      background: #2563eb !important;
    }

    /* CHAT */

    .chat {
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 18px;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #273244;
      font-weight: bold;
    }

    .messages {
      height: 260px;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 13px;
      line-height: 1.4;
    }

    .username {
      color: #60a5fa;
      font-weight: bold;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #273244;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      border: none;
      outline: none;
      background: #1f2937;
      color: white;
    }

    .chat-input button {
      border: none;
      padding: 0 17px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #111827;
      border-top: 1px solid #273244;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .bottom-nav a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 13px;
      text-align: center;
    }

    .bottom-nav a.active {
      color: #60a5fa;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .page-space {
      height: 80px;
    }

    @media (min-width: 800px) {
      .chat {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="brand">
      <img
        src="images/logo.png"
        alt="P2P Social"
      >

      <span>P2P Social</span>
    </div>

    <div class="live-status">
      🔴 LIVE
    </div>

  </header>


  <main class="container">

    <!-- LIVE VIDEO -->

    <div class="video-box">

      <div class="live-badge">
        🔴 LIVE
      </div>

      <div class="viewers" id="viewerCount">
        👁 128 viewers
      </div>

      <div class="camera-icon">
        📹
      </div>

    </div>


    <!-- STREAM INFORMATION -->

    <section class="stream-info">

      <h1>
        P2P Social Live Stream
      </h1>

      <p class="host">
        Hosted by
        <span>@username</span>
      </p>

    </section>


    <!-- ACTION BUTTONS -->

    <div class="actions">

      <button onclick="followHost()">
        👤 Follow
      </button>

      <button onclick="shareLive()">
        🔗 Share
      </button>

      <button
        class="gift-btn"
        onclick="sendGift()">
        🎁 Send Gift
      </button>

    </div>


    <!-- LIVE CHAT -->

    <section class="chat">

      <div class="chat-header">
        💬 Live Chat
      </div>

      <div
        class="messages"
        id="messages">

        <div class="message">
          <span class="username">
            @alex
          </span>
          : Welcome to the live! 👋
        </div>

        <div class="message">
          <span class="username">
            @user123
          </span>
          : Nice stream 🔥
        </div>

        <div class="message">
          <span class="username">
            @crypto
          </span>
          : Hello everyone!
        </div>

      </div>


      <form
        class="chat-input"
        id="chatForm">

        <input
          type="text"
          id="chatMessage"
          placeholder="Write a message..."
          maxlength="200"
          required
        >

        <button type="submit">
          Send
        </button>

      </form>

    </section>

    <div class="page-space"></div>

  </main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <a href="index.html">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a href="live.html" class="active">
      <span class="nav-icon">🔴</span>
      Live
    </a>

    <a href="wallet.html">
      <span class="nav-icon">💰</span>
      Wallet
    </a>

    <a href="messages.html">
      <span class="nav-icon">💬</span>
      Messages
    </a>

    <a href="profile.html">
      <span class="nav-icon">👤</span>
      Profile
    </a>

  </nav>


  <script

    const chatForm =
      document.getElementById("chatForm");

    const chatMessage =
      document.getElementById("chatMessage");

    const messages =
      document.getElementById("messages");


    // SEND CHAT MESSAGE

    chatForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const text =
          chatMessage.value.trim();

        if (!text) return;


        const message =
          document.createElement("div");

        message.className = "message";

        message.innerHTML =
          `<span class="username">
            You
          </span>: ${escapeHtml(text)}`;


        messages.appendChild(message);

        messages.scrollTop =
          messages.scrollHeight;

        chatMessage.value = "";

      }
    );


    // PROTECT AGAINST HTML IN CHAT

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // FOLLOW

    function followHost() {

      alert(
        "You are now following @username!"
      );

    }


    // SHARE

    function shareLive() {

      if (
        navigator.share
      ) {

        navigator.share({
          title: "P2P Social Live",
          text: "Watch this live stream on P2P Social!",
          url: window.location.href
        });

      } else {

        alert(
          "Copy this page link to share the live stream."
        );

      }

    }


    // SEND GIFT

    function sendGift() {

      alert(
        "Gift system will connect to your P2P Social wallet."
      );

    }

  </script>

</body>
</html>
