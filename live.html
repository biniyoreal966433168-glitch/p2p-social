<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live • P2P Social</title><style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}


/* =========================
   HEADER
========================= */

header{
  background:
    linear-gradient(
      135deg,
      #075e54,
      #087f73
    );

  color:white;

  padding:16px 18px;

  border-radius:
    0 0 22px 22px;

  position:sticky;
  top:0;

  z-index:100;
}


/* =========================
   HEADER BRAND
========================= */

.header-brand{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =========================
   SAME P2P ICON
========================= */

.header-icon{
  width:45px;
  height:45px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #064e46,
      #10a889
    );

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  flex-shrink:0;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.18);
}


/* LEFT P */

.header-p-left{
  position:absolute;

  left:8px;
  top:10px;

  width:14px;
  height:25px;

  border:4px solid white;

  border-right:0;

  border-radius:
    8px 0 0 8px;
}


/* RIGHT P */

.header-p-right{
  position:absolute;

  right:8px;
  top:10px;

  width:14px;
  height:25px;

  border:4px solid white;

  border-left:0;

  border-radius:
    0 8px 8px 0;
}


/* CENTER */

.header-center{
  width:12px;
  height:12px;

  background:white;

  border-radius:50%;

  position:absolute;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:5;
}


/* DOT */

.header-dot{
  width:4px;
  height:4px;

  background:#087f73;

  border-radius:50%;
}


/* BRAND TEXT */

.header-brand-text{
  font-size:20px;
  font-weight:800;
  white-space:nowrap;
}

.header-brand-text span{
  color:#dff8f2;
}


/* LIVE STATUS */

.live-status{
  margin-left:auto;

  background:
    rgba(255,255,255,.16);

  border:
    1px solid
    rgba(255,255,255,.35);

  color:white;

  padding:8px 11px;

  border-radius:10px;

  font-size:12px;

  font-weight:bold;
}


/* HEADER ROW */

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px;
}


/* =========================
   VIDEO
========================= */

.video-box{
  width:100%;

  aspect-ratio:16/9;

  background:
    radial-gradient(
      circle at center,
      #29364f,
      #111827
    );

  border-radius:18px;

  position:relative;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.12);
}


.camera-icon{
  font-size:60px;
  opacity:.7;
}


.live-badge{
  position:absolute;

  top:14px;
  left:14px;

  background:#e74c3c;

  color:white;

  padding:7px 11px;

  border-radius:8px;

  font-size:12px;

  font-weight:bold;
}


.viewers{
  position:absolute;

  top:14px;
  right:14px;

  background:
    rgba(0,0,0,.65);

  color:white;

  padding:7px 11px;

  border-radius:8px;

  font-size:12px;
}


/* =========================
   STREAM INFO
========================= */

.stream-info{
  background:white;

  margin-top:15px;

  border-radius:16px;

  padding:17px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
}


.stream-info h1{
  font-size:21px;

  margin-bottom:8px;
}


.host{
  color:#7a8494;

  font-size:13px;
}


.host span{
  color:#087f73;

  font-weight:bold;
}


/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;

  gap:9px;

  margin:14px 0;

  flex-wrap:wrap;
}


.actions button{
  flex:1;

  min-width:100px;

  border:none;

  border-radius:10px;

  padding:11px 13px;

  background:white;

  color:#172033;

  cursor:pointer;

  font-size:13px;

  font-weight:bold;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.06);
}


.actions button:hover{
  background:#f0f7f5;
}


.follow-btn,
.share-btn{
  color:#087f73 !important;
}


.gift-btn{
  background:#087f73 !important;

  color:white !important;
}


/* =========================
   CHAT
========================= */

.chat{
  background:white;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
}


.chat-header{
  padding:15px;

  border-bottom:
    1px solid #edf0f4;

  font-weight:bold;

  color:#172033;
}


.messages{
  height:280px;

  overflow-y:auto;

  padding:15px;
}


.message{
  margin-bottom:13px;

  line-height:1.45;

  font-size:13px;

  color:#303b4d;
}


.username{
  color:#087f73;

  font-weight:bold;
}


.chat-input{
  display:flex;

  padding:12px;

  gap:8px;

  border-top:
    1px solid #edf0f4;
}


.chat-input input{
  flex:1;

  padding:11px 12px;

  border-radius:10px;

  border:
    1px solid #dfe4eb;

  outline:none;

  background:#f5f7fb;

  color:#172033;
}


.chat-input input:focus{
  border-color:#087f73;
}


.chat-input button{
  border:none;

  padding:0 17px;

  border-radius:10px;

  background:#087f73;

  color:white;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  bottom:0;

  left:0;

  right:0;

  height:68px;

  background:white;

  border-top:
    1px solid #ddd;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:1000;
}


.nav-item{
  text-align:center;

  color:#777;

  font-size:11px;

  cursor:pointer;

  text-decoration:none;
}


.nav-item span{
  display:block;

  font-size:22px;

  margin-bottom:3px;
}


.nav-item.active{
  color:#087f73;

  font-weight:bold;
}


button:active{
  transform:scale(.97);
}


.page-space{
  height:20px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px){

  header{
    padding:14px 12px;
  }

  .header-icon{
    width:43px;
    height:43px;

    border-radius:13px;
  }

  .header-p-left,
  .header-p-right{
    top:10px;

    height:23px;
  }

  .header-p-left{
    left:8px;
  }

  .header-p-right{
    right:8px;
  }

  .header-center{
    width:11px;
    height:11px;
  }

  .header-brand-text{
    font-size:18px;
  }

  .live-status{
    padding:7px 9px;

    font-size:10px;
  }

  .container{
    padding:12px;
  }

  .video-box{
    border-radius:15px;
  }

  .stream-info h1{
    font-size:19px;
  }

  .actions button{
    min-width:90px;
  }

  .messages{
    height:250px;
  }

}


/* VERY SMALL SCREENS */

@media(max-width:350px){

  .header-brand-text{
    display:none;
  }

  .live-status{
    font-size:10px;
  }

}

</style></head><body><!-- =========================

      <div class="header-dot"></div>

    </div>

  </div>


  <div class="header-brand-text">

  </div>

</div>


<div class="live-status">

</div>

  </div></header><!-- =========================

========================= --><main class="container">  <!-- LIVE VIDEO -->  <div class="video-box"><div class="live-badge">

</div>

<div
  class="viewers"
  id="viewerCount">

  👁 Coming Soon

</div>

<div class="camera-icon">
  📹
</div>

  </div>  <!-- STREAM INFORMATION -->  <section class="stream-info"><h1>

</h1>

<p class="host">

  Hosted by

  <span>

</p>

  </section>  <!-- ACTION BUTTONS -->  <div class="actions"><button
  class="follow-btn"
  onclick="followHost()">

  👤 Coming Soon

</button>


<button
  class="share-btn"
  onclick="shareLive()">

  ↗ Share

</button>


<button

  onclick="sendGift()">

  🎁 Coming Soon

</button>

  </div>  <!-- LIVE CHAT -->  <section class="chat"><div class="chat-header">

  💬 Coming Soon

</div>


<div
  class="messages"
  id="messages">

  <div class="message">

    <span class="username">
      Coming Soon
    </span>

    : Welcome to the live! 👋

  </div>


  <div class="message">

    <span class="username">
      Coming Soon
    </span>

    : Coming Soon🔥

  </div>


  <div class="message">

    <span class="username">
      Coming Soon
    </span>

    : Coming Soon !

  </div>

</div>


<form
  class="chat-input"
  id="chatForm">

  <input
    type="text"
    id="chatMessage"
    placeholder="Write a message..."
    maxlength="200"
    autocomplete="off"
    required

  <button type="submit">

  </button>

</form>

     JAVASCRIPT
========================= --><script>


/* =========================
   CHAT
========================= */

const chatForm =
  document.getElementById(
    "chatForm"
  );


const chatMessage =
  document.getElementById(
    "chatMessage"
  );


const messages =
  document.getElementById(
    "messages"
  );


chatForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();


    const text =
      chatMessage.value.trim();


    if(!text)return;


    const message =
      document.createElement(
        "div"
      );


    message.className =
      "message";


    const username =
      document.createElement(
        "span"
      );


    username.className =
      "username";


    username.textContent =
      "You";


    message.appendChild(
      username
    );


    message.appendChild(
      document.createTextNode(
        ": "+text
      )
    );


    messages.appendChild(
      message
    );


    messages.scrollTop =
      messages.scrollHeight;


    chatMessage.value="";

  }
);


/* =========================
   FOLLOW
========================= */

function followHost(){

  alert(
    "You are now following @username!"
  );

}


/* =========================
   SHARE
========================= */

async function shareLive(){

  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Live",

        text:
          "Watch this live stream on P2P Social!",

        url:
          window.location.href

      });

    }catch(error){

      console.log(error);

    }

    return;
  }


  try{

    await navigator.clipboard.writeText(
      window.location.href
    );


    alert(
      "Live link copied."
    );

  }catch(error){

    alert(
      "Copy this page link to share the live stream."
    );

  }

}


/* =========================
   SEND GIFT
========================= */

function sendGift(){

  alert(
    "Gift system will connect to your P2P Social wallet."
  );

}

</script></body>
