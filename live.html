<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,
input{
  font-family:inherit;
}

#authScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7fb;
}

.authBox{
  background:#fff;
  width:90%;
  max-width:380px;
  padding:30px 22px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.authLogo{
  font-size:42px;
  margin-bottom:12px;
}

.authTitle{
  font-size:22px;
  font-weight:800;
  margin-bottom:8px;
}

.authText{
  color:#687386;
  font-size:14px;
}

#liveApp{
  position:fixed;
  inset:0;
  display:none;
  background:#172033;
}

.liveBackground{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 30%,rgba(8,127,115,.22),transparent 42%),
    linear-gradient(180deg,#172033 0%,#111827 100%);
}

.liveVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#172033;
  display:none;
}

.livePlaceholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px;
  color:#fff;
}

.livePlaceholderIcon{
  width:100px;
  height:100px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#087f73;
  font-size:44px;
  margin-bottom:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.livePlaceholderTitle{
  font-size:25px;
  font-weight:800;
  margin-bottom:8px;
}

.livePlaceholderText{
  font-size:14px;
  opacity:.8;
  max-width:330px;
  line-height:1.5;
}

.topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
}

.liveInfo{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.liveAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#087f73;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.8);
  flex-shrink:0;
}

.liveAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.liveUserInfo{
  min-width:0;
  color:#fff;
}

.liveUsername{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.liveStatus{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  margin-top:3px;
  opacity:.9;
}

.liveDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e74c3c;
  display:inline-block;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconButton{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(23,32,51,.8);
  color:#fff;
  cursor:pointer;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
}

.iconButton:active{
  transform:scale(.95);
}

.liveBadge{
  position:absolute;
  top:72px;
  left:14px;
  z-index:20;
  padding:7px 11px;
  border-radius:9px;
  background:#e74c3c;
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.viewerBadge{
  position:absolute;
  top:72px;
  right:14px;
  z-index:20;
  padding:7px 11px;
  border-radius:9px;
  background:rgba(23,32,51,.8);
  color:#fff;
  font-size:12px;
  backdrop-filter:blur(8px);
}

.bottomArea{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);
}

.comments{
  max-height:180px;
  overflow-y:auto;
  margin-bottom:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.comments::-webkit-scrollbar{
  width:3px;
}

.comment{
  width:max-content;
  max-width:85%;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(23,32,51,.78);
  color:#fff;
  font-size:13px;
  line-height:1.35;
  backdrop-filter:blur(8px);
}

.comment strong{
  margin-right:5px;
}

.commentForm{
  display:flex;
  gap:8px;
}

.commentInput{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  padding:0 16px;
  outline:none;
  background:rgba(255,255,255,.12);
  color:#fff;
  backdrop-filter:blur(10px);
}

.commentInput::placeholder{
  color:rgba(255,255,255,.7);
}

.sendComment{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#087f73;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.reactionButtons{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
}

.reactionButton{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(23,32,51,.82);
  color:#fff;
  cursor:pointer;
  font-size:20px;
  backdrop-filter:blur(8px);
}

.reactionButton:active{
  transform:scale(.9);
}

.createPanel{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.6);
}

.createBox{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.createHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.createTitle{
  font-size:20px;
  font-weight:800;
}

.closeCreate{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f5f7fb;
  color:#172033;
  cursor:pointer;
  font-size:20px;
}

.createLabel{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.createInput{
  width:100%;
  height:44px;
  border:1px solid #dfe4ec;
  border-radius:10px;
  padding:0 12px;
  outline:none;
  margin-bottom:14px;
}

.createTextarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:1px solid #dfe4ec;
  border-radius:10px;
  padding:12px;
  outline:none;
  margin-bottom:14px;
}

.startLiveButton{
  width:100%;
  height:48px;
  border:0;
  border-radius:11px;
  background:#087f73;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.stopLiveButton{
  width:100%;
  height:48px;
  border:0;
  border-radius:11px;
  background:#e74c3c;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  display:none;
  margin-top:8px;
}

.messageBox{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  z-index:99999;
  background:#172033;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-size:13px;
  display:none;
  max-width:90%;
  text-align:center;
}

.ownerTreasury{
  position:absolute;
  right:14px;
  bottom:180px;
  z-index:25;
  display:none;
  width:185px;
  padding:12px;
  border-radius:13px;
  background:rgba(23,32,51,.9);
  color:#fff;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.ownerTreasuryTitle{
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.ownerTreasuryBalance{
  font-size:17px;
  font-weight:800;
}

.ownerTreasurySub{
  font-size:11px;
  opacity:.7;
  margin-top:3px;
}

@media(max-width:600px){
  .comments{
    max-height:145px;
  }

  .ownerTreasury{
    bottom:170px;
    width:165px;
  }
}
</style>
</head>

<body>

<div id="authScreen">
  <div class="authBox">
    <div class="authLogo">🔴</div>
    <div class="authTitle">P2P Social Live</div>
    <div class="authText" id="authText">Checking your account...</div>
  </div>
</div>

<div id="liveApp">

  <div class="liveBackground"></div>

  <video
    id="liveVideo"
    class="liveVideo"
    autoplay
    muted
    playsinline>
  </video>

  <div id="livePlaceholder" class="livePlaceholder">
    <div class="livePlaceholderIcon">🔴</div>
    <div class="livePlaceholderTitle">Live Room</div>
    <div class="livePlaceholderText">
      Welcome to P2P Social Live
    </div>
  </div>

  <div class="topBar">

    <div class="liveInfo">

      <div class="liveAvatar" id="liveAvatar">
        U
      </div>

      <div class="liveUserInfo">
        <div class="liveUsername" id="liveUsername">
          Live User
        </div>

        <div class="liveStatus">
          <span class="liveDot"></span>
          <span id="liveState">LIVE</span>
        </div>
      </div>

    </div>

    <div class="topActions">

      <button
        class="iconButton"
        onclick="shareLive()"
        title="Share">
        ↗
      </button>

      <button
        class="iconButton"
        onclick="closeLive()"
        title="Close">
        ✕
      </button>

    </div>

  </div>

  <div class="liveBadge">
    LIVE
  </div>

  <div class="viewerBadge">
    👁 <span id="viewerCount">1</span>
  </div>

  <div
    id="ownerTreasury"
    class="ownerTreasury">

    <div class="ownerTreasuryTitle">
      💎 Owner Treasury
    </div>

    <div
      id="ownerTreasuryBalance"
      class="ownerTreasuryBalance">
      0 💎
    </div>

    <div class="ownerTreasurySub">
      Diamond treasury
    </div>

  </div>

  <div class="bottomArea">

    <div
      id="comments"
      class="comments">
    </div>

    <div class="reactionButtons">

      <button
        class="reactionButton"
        onclick="sendReaction('❤️')">
        ❤️
      </button>

      <button
        class="reactionButton"
        onclick="sendReaction('🔥')">
        🔥
      </button>

      <button
        class="reactionButton"
        onclick="sendReaction('👏')">
        👏
      </button>

      <button
        class="reactionButton"
        onclick="sendReaction('💎')">
        💎
      </button>

    </div>

    <form
      id="commentForm"
      class="commentForm"
      onsubmit="sendComment(event)">

      <input
        id="commentInput"
        class="commentInput"
        maxlength="500"
        autocomplete="off"
        placeholder="Say something...">

      <button
        class="sendComment"
        type="submit">
        ➤
      </button>

    </form>

  </div>

</div>

<div
  id="createPanel"
  class="createPanel">

  <div class="createBox">

    <div class="createHeader">

      <div class="createTitle">
        🔴 Create Live
      </div>

      <button
        class="closeCreate"
        onclick="closeCreateLive()">
        ✕
      </button>

    </div>

    <label class="createLabel">
      Live title
    </label>

    <input
      id="createLiveTitle"
      class="createInput"
      maxlength="100"
      placeholder="Enter live title">

    <label class="createLabel">
      Description
    </label>

    <textarea
      id="createLiveDescription"
      class="createTextarea"
      maxlength="500"
      placeholder="Describe your live..."></textarea>

    <button
      id="startLiveButton"
      class="startLiveButton"
      onclick="startLive()">
      🔴 Start Live
    </button>

    <button
      id="stopLiveButton"
      class="stopLiveButton"
      onclick="stopLive()">
      ⛔ Stop Live
    </button>

  </div>

</div>

<div
  id="messageBox"
  class="messageBox">
</div>

<script>
const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentUser = null;
let currentProfile = null;
let currentLiveId = null;
let liveChannel = null;
let commentChannel = null;
let isHost = false;
let localStream = null;
let viewerCount = 1;

const PREMIUM_MAX_MIN_LEVEL = 3;

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showMessage(message){
  const box =
    document.getElementById("messageBox");

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(()=>{
      box.style.display = "none";
    },3000);
}

function getFirstValue(obj, keys, fallback=""){
  for(const key of keys){
    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){
      return obj[key];
    }
  }

  return fallback;
}

function getUserLevel(profile){
  const value =
    getFirstValue(
      profile,
      [
        "level",
        "user_level",
        "account_level",
        "membership_level"
      ],
      0
    );

  const number =
    parseInt(value,10);

  return Number.isFinite(number)
    ? number
    : 0;
}

function normalizePremiumTier(profile){
  return String(
    getFirstValue(
      profile,
      [
        "premium_tier",
        "premium",
        "subscription_tier",
        "plan",
        "membership"
      ],
      ""
    )
  ).toLowerCase().trim();
}

function hasPremiumMax(){
  if(!currentProfile) return false;

  const tier =
    normalizePremiumTier(currentProfile);

  return [
    "premium max",
    "premium_max",
    "premium-max",
    "max",
    "premiummax"
  ].includes(tier);
}

function canCreateLive(){
  return (
    hasPremiumMax() &&
    getUserLevel(currentProfile) >=
      PREMIUM_MAX_MIN_LEVEL
  );
}

async function requireLogin(){
  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if(error || !data.session){
    window.location.href =
      "./login.html";

    return false;
  }

  currentUser =
    data.session.user;

  return true;
}

async function loadProfile(){

  if(!currentUser) return null;

  let result =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(result.data){
    currentProfile =
      result.data;

    return currentProfile;
  }

  result =
    await supabaseClient
      .from("users")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(result.data){
    currentProfile =
      result.data;

    return currentProfile;
  }

  currentProfile = {
    id:currentUser.id,
    username:
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "User"
  };

  return currentProfile;
}

function getUsername(){

  return getFirstValue(
    currentProfile,
    [
      "username",
      "user_name",
      "name",
      "display_name"
    ],
    currentUser?.email?.split("@")[0] ||
    "User"
  );
}

function getAvatar(){

  return getFirstValue(
    currentProfile,
    [
      "avatar_url",
      "avatar",
      "profile_image",
      "photo_url",
      "image_url"
    ],
    ""
  );
}

function updateLiveUser(){

  const username =
    getUsername();

  document.getElementById(
    "liveUsername"
  ).textContent = username;

  const avatar =
    getAvatar();

  const avatarBox =
    document.getElementById(
      "liveAvatar"
    );

  if(avatar){

    avatarBox.innerHTML =
      '<img src="' +
      escapeHtml(avatar) +
      '" alt="">';

  }else{

    avatarBox.textContent =
      username
        .charAt(0)
        .toUpperCase();

  }
}

function openCreateLive(){

  if(!currentUser){
    showMessage("Please login first.");
    return;
  }

  if(!canCreateLive()){

    showMessage(
      "Premium Max and Level 3+ are required to create Live."
    );

    return;
  }

  document.getElementById(
    "createPanel"
  ).style.display = "flex";
}

function closeCreateLive(){

  document.getElementById(
    "createPanel"
  ).style.display = "none";
}

async function startLive(){

  if(!canCreateLive()){

    showMessage(
      "Premium Max and Level 3+ are required."
    );

    return;
  }

  const title =
    document.getElementById(
      "createLiveTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "createLiveDescription"
    ).value.trim();

  if(!title){

    showMessage(
      "Enter a live title."
    );

    return;
  }

  const startButton =
    document.getElementById(
      "startLiveButton"
    );

  startButton.disabled = true;
  startButton.textContent =
    "Starting...";

  try{

    const payload = {
      host_id:currentUser.id,
      title:title,
      description:description,
      status:"live",
      is_live:true
    };

    let result =
      await supabaseClient
        .from("live_rooms")
        .insert(payload)
        .select("*")
        .single();

    if(result.error){

      const fallbackPayload = {
        user_id:currentUser.id,
        title:title,
        description:description,
        status:"live",
        is_live:true
      };

      result =
        await supabaseClient
          .from("live")
          .insert(fallbackPayload)
          .select("*")
          .single();
    }

    if(result.error){

      throw result.error;
    }

    currentLiveId =
      result.data.id;

    isHost = true;

    closeCreateLive();

    document.getElementById(
      "liveState"
    ).textContent = "LIVE";

    document.getElementById(
      "startLiveButton"
    ).style.display = "none";

    document.getElementById(
      "stopLiveButton"
    ).style.display = "block";

    showMessage(
      "Your Live room is open."
    );

    await startCamera();

    await subscribeToLive();

  }catch(error){

    console.error(error);

    showMessage(
      "Unable to create Live room."
    );

  }finally{

    startButton.disabled = false;
    startButton.textContent =
      "🔴 Start Live";
  }
}

async function startCamera(){

  if(!isHost) return;

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    showMessage(
      "Camera is not available in this browser."
    );

    return;
  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
      });

    const video =
      document.getElementById(
        "liveVideo"
      );

    video.srcObject =
      localStream;

    video.style.display =
      "block";

    document.getElementById(
      "livePlaceholder"
    ).style.display =
      "none";

  }catch(error){

    console.error(error);

    showMessage(
      "Camera permission was not granted."
    );
  }
}

async function stopLive(){

  if(!isHost || !currentLiveId){

    closeLive();
    return;
  }

  try{

    let result =
      await supabaseClient
        .from("live_rooms")
        .update({
          status:"ended",
          is_live:false,
          ended_at:new Date().toISOString()
        })
        .eq("id",currentLiveId);

    if(result.error){

      await supabaseClient
        .from("live")
        .update({
          status:"ended",
          is_live:false,
          ended_at:new Date().toISOString()
        })
        .eq("id",currentLiveId);
    }

  }catch(error){

    console.error(error);

  }finally{

    stopCamera();

    showMessage(
      "Live ended."
    );

    setTimeout(()=>{
      window.location.href =
        "./index.html";
    },800);
  }
}

function stopCamera(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    localStream = null;
  }

  const video =
    document.getElementById(
      "liveVideo"
    );

  video.srcObject = null;
  video.style.display = "none";

  document.getElementById(
    "livePlaceholder"
  ).style.display = "flex";
}

async function loadLiveFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const liveId =
    params.get("id") ||
    params.get("live_id") ||
    params.get("room");

  if(!liveId){

    document.getElementById(
      "liveState"
    ).textContent =
      "READY";

    return;
  }

  currentLiveId =
    liveId;

  await loadLiveRoom(liveId);
}

async function loadLiveRoom(liveId){

  let result =
    await supabaseClient
      .from("live_rooms")
      .select("*")
      .eq("id",liveId)
      .maybeSingle();

  if(!result.data){

    result =
      await supabaseClient
        .from("live")
        .select("*")
        .eq("id",liveId)
        .maybeSingle();
  }

  if(result.error){

    console.error(result.error);
    return;
  }

  if(!result.data){

    showMessage(
      "Live room not found."
    );

    return;
  }

  const room =
    result.data;

  const hostId =
    getFirstValue(
      room,
      [
        "host_id",
        "user_id",
        "owner_id",
        "creator_id"
      ],
      ""
    );

  if(
    hostId &&
    currentUser &&
    hostId === currentUser.id
  ){
    isHost = true;
  }

  const title =
    getFirstValue(
      room,
      [
        "title",
        "name"
      ],
      "Live Room"
    );

  document.title =
    title +
    " • P2P Social";

  const description =
    getFirstValue(
      room,
      [
        "description",
        "caption"
      ],
      "Welcome to P2P Social Live"
    );

  document.querySelector(
    ".livePlaceholderTitle"
  ).textContent =
    title;

  document.querySelector(
    ".livePlaceholderText"
  ).textContent =
    description;

  if(hostId){

    await loadHostProfile(hostId);
  }

  await subscribeToLive();
  await loadComments();

  if(isHost){

    document.getElementById(
      "stopLiveButton"
    ).style.display =
      "block";

    document.getElementById(
      "startLiveButton"
    ).style.display =
      "none";

    document.getElementById(
      "ownerTreasury"
    ).style.display =
      "block";

    await loadOwnerTreasury();
  }
}

async function loadHostProfile(hostId){

  let result =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",hostId)
      .maybeSingle();

  if(!result.data){

    result =
      await supabaseClient
        .from("users")
        .select("*")
        .eq("id",hostId)
        .maybeSingle();
  }

  if(!result.data) return;

  const profile =
    result.data;

  const username =
    getFirstValue(
      profile,
      [
        "username",
        "user_name",
        "name",
        "display_name"
      ],
      "Live User"
    );

  document.getElementById(
    "liveUsername"
  ).textContent =
    username;

  const avatar =
    getFirstValue(
      profile,
      [
        "avatar_url",
        "avatar",
        "profile_image",
        "photo_url",
        "image_url"
      ],
      ""
    );

  const avatarBox =
    document.getElementById(
      "liveAvatar"
    );

  if(avatar){

    avatarBox.innerHTML =
      '<img src="' +
      escapeHtml(avatar) +
      '" alt="">';

  }else{

    avatarBox.textContent =
      username
        .charAt(0)
        .toUpperCase();
  }
}

async function subscribeToLive(){

  if(!currentLiveId) return;

  if(liveChannel){

    await supabaseClient
      .removeChannel(liveChannel);
  }

  liveChannel =
    supabaseClient
      .channel(
        "live-room-" +
        currentLiveId
      )
      .on(
        "broadcast",
        {
          event:"reaction"
        },
        payload=>{
          if(payload?.payload?.emoji){
            showReaction(
              payload.payload.emoji
            );
          }
        }
      )
      .on(
        "broadcast",
        {
          event:"viewer"
        },
        payload=>{
          if(
            payload?.payload?.count
          ){
            viewerCount =
              payload.payload.count;

            document.getElementById(
              "viewerCount"
            ).textContent =
              viewerCount;
          }
        }
      )
      .subscribe();

  commentChannel =
    liveChannel;
}

async function loadComments(){

  if(!currentLiveId) return;

  const tables = [
    "live_comments",
    "comments"
  ];

  for(const table of tables){

    const result =
      await supabaseClient
        .from(table)
        .select("*")
        .eq("live_id",currentLiveId)
        .order("created_at",{
          ascending:true
        })
        .limit(100);

    if(!result.error){

      const comments =
        result.data || [];

      comments.forEach(
        addCommentToScreen
      );

      return;
    }
  }
}

function addCommentToScreen(comment){

  const container =
    document.getElementById(
      "comments"
    );

  const username =
    getFirstValue(
      comment,
      [
        "username",
        "user_name",
        "name"
      ],
      "User"
    );

  const text =
    getFirstValue(
      comment,
      [
        "comment",
        "text",
        "body",
        "content"
      ],
      ""
    );

  if(!text) return;

  const div =
    document.createElement("div");

  div.className =
    "comment";

  div.innerHTML =
    "<strong>" +
    escapeHtml(username) +
    "</strong> " +
    escapeHtml(text);

  container.appendChild(div);

  while(
    container.children.length > 100
  ){
    container.removeChild(
      container.firstChild
    );
  }

  container.scrollTop =
    container.scrollHeight;
}

async function sendComment(event){

  event.preventDefault();

  if(!currentUser){

    showMessage(
      "Please login first."
    );

    return;
  }

  if(!currentLiveId){

    showMessage(
      "No active Live room."
    );

    return;
  }

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if(!text) return;

  input.value = "";

  const username =
    getUsername();

  let saved = false;

  const result =
    await supabaseClient
      .from("live_comments")
      .insert({
        live_id:currentLiveId,
        user_id:currentUser.id,
        username:username,
        comment:text,
        text:text
      });

  if(!result.error){

    saved = true;

  }else{

    const fallback =
      await supabaseClient
        .from("comments")
        .insert({
          live_id:currentLiveId,
          user_id:currentUser.id,
          username:username,
          text:text
        });

    if(!fallback.error){
      saved = true;
    }
  }

  if(saved){

    addCommentToScreen({
      username:username,
      text:text
    });

  }else{

    addCommentToScreen({
      username:username,
      text:text
    });
  }
}

async function sendReaction(emoji){

  showReaction(emoji);

  if(!liveChannel) return;

  try{

    await liveChannel.send({
      type:"broadcast",
      event:"reaction",
      payload:{
        emoji:emoji,
        user_id:currentUser?.id || null
      }
    });

  }catch(error){

    console.error(error);
  }
}

function showReaction(emoji){

  const reaction =
    document.createElement("div");

  reaction.textContent =
    emoji;

  reaction.style.position =
    "fixed";

  reaction.style.left =
    (20 + Math.random()*60) +
    "%";

  reaction.style.bottom =
    "120px";

  reaction.style.zIndex =
    "80";

  reaction.style.fontSize =
    "34px";

  reaction.style.pointerEvents =
    "none";

  reaction.style.transition =
    "transform 2s ease, opacity 2s ease";

  document.body.appendChild(
    reaction
  );

  requestAnimationFrame(()=>{
    reaction.style.transform =
      "translateY(-180px) scale(1.4)";

    reaction.style.opacity =
      "0";
  });

  setTimeout(()=>{
    reaction.remove();
  },2000);
}

async function updateViewerCount(){

  if(!liveChannel) return;

  viewerCount++;

  document.getElementById(
    "viewerCount"
  ).textContent =
    viewerCount;

  try{

    await liveChannel.send({
      type:"broadcast",
      event:"viewer",
      payload:{
        count:viewerCount
      }
    });

  }catch(error){
    console.error(error);
  }
}

async function loadOwnerTreasury(){

  if(!isHost) return;

  let balance = 0;

  const possibleTables = [
    "owner_treasury",
    "treasury",
    "diamond_treasury"
  ];

  for(
    const table of possibleTables
  ){

    const result =
      await supabaseClient
        .from(table)
        .select("*")
        .limit(1)
        .maybeSingle();

    if(!result.error && result.data){

      balance =
        Number(
          getFirstValue(
            result.data,
            [
              "diamond_balance",
              "diamonds",
              "balance",
              "total_diamonds"
            ],
            0
          )
        ) || 0;

      break;
    }
  }

  document.getElementById(
    "ownerTreasuryBalance"
  ).textContent =
    Number(balance).toLocaleString() +
    " 💎";
}

async function shareLive(){

  const url =
    window.location.href;

  try{

    if(
      navigator.share
    ){

      await navigator.share({
        title:
          document.title,
        text:
          "Join my P2P Social Live",
        url:url
      });

    }else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        url
      );

      showMessage(
        "Live link copied."
      );

    }else{

      showMessage(
        url
      );
    }

  }catch(error){

    console.error(error);
  }
}

function closeLive(){

  if(isHost){

    const shouldStop =
      confirm(
        "End this Live?"
      );

    if(shouldStop){

      stopLive();
    }

    return;
  }

  stopCamera();

  if(liveChannel){

    supabaseClient
      .removeChannel(
        liveChannel
      );

    liveChannel = null;
  }

  window.location.href =
    "./index.html";
}

document
  .getElementById("createPanel")
  .addEventListener(
    "click",
    event=>{
      if(
        event.target.id ===
        "createPanel"
      ){
        closeCreateLive();
      }
    }
  );

document.addEventListener(
  "keydown",
  event=>{
    if(event.key === "Escape"){
      closeCreateLive();
    }
  }
);

window.addEventListener(
  "beforeunload",
  ()=>{
    stopCamera();

    if(liveChannel){
      supabaseClient
        .removeChannel(
          liveChannel
        );
    }
  }
);

async function startApp(){

  const loggedIn =
    await requireLogin();

  if(!loggedIn) return;

  await loadProfile();

  updateLiveUser();

  document.getElementById(
    "authScreen"
  ).style.display =
    "none";

  document.getElementById(
    "liveApp"
  ).style.display =
    "block";

  await loadLiveFromUrl();

  if(!currentLiveId){

    if(canCreateLive()){

      openCreateLive();

    }else{

      showMessage(
        "Viewing Live is available. Premium Max + Level 3+ is required to create Live."
      );
    }
  }

  await updateViewerCount();
}

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event === "SIGNED_OUT" ||
      !session
    ){

      window.location.href =
        "./login.html";

    }

  }
);

startApp();
</script>
