<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Live • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,Helvetica,sans-serif;
 background:#f5f7fb;
 color:#172033;
}

button,input,textarea,select{font-family:inherit}

#authScreen{
 position:fixed;
 inset:0;
 z-index:99999;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#f5f7fb;
}

.authBox{
 background:#fff;
 width:90%;
 max-width:380px;
 padding:30px 22px;
 border-radius:18px;
 text-align:center;
 box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.authLogo{font-size:42px;margin-bottom:12px}
.authTitle{font-size:22px;font-weight:800;margin-bottom:8px}
.authText{color:#687386;font-size:14px}

#liveApp{
 position:fixed;
 inset:0;
 display:none;
 background:#172033;
}

.liveBackground{
 position:absolute;
 inset:0;
 background:
 radial-gradient(circle at 50% 30%,rgba(8,127,115,.22),transparent 42%),
 linear-gradient(180deg,#172033 0%,#111827 100%);
}

#seatGrid{
 position:absolute;
 inset:0;
 z-index:5;
 padding:86px 8px 150px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 grid-auto-rows:1fr;
 gap:6px;
 overflow:hidden;
}

.seat{
 position:relative;
 min-width:0;
 min-height:0;
 overflow:hidden;
 border-radius:10px;
 background:#111827;
 border:1px solid rgba(255,255,255,.13);
}

.seat video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 background:#172033;
}

.seatPlaceholder{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:#fff;
 padding:6px;
 background:
 linear-gradient(180deg,rgba(23,32,51,.15),rgba(23,32,51,.8));
}

.seatAvatar{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#087f73;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
 font-weight:800;
 overflow:hidden;
 margin-bottom:5px;
 border:2px solid rgba(255,255,255,.8);
}

.seatAvatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.seatName{
 max-width:95%;
 color:#fff;
 font-size:11px;
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.seatStatus{
 margin-top:3px;
 font-size:9px;
 color:rgba(255,255,255,.75);
}

.seatEmpty{
 opacity:.55;
}

.seatEmpty .seatAvatar{
 background:#172033;
 border-color:rgba(255,255,255,.2);
}

.seatLabel{
 position:absolute;
 left:5px;
 right:5px;
 bottom:5px;
 z-index:3;
 padding:4px 6px;
 border-radius:7px;
 background:rgba(23,32,51,.78);
 color:#fff;
 font-size:9px;
 backdrop-filter:blur(7px);
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.seatLive{

 top:5px;
 left:5px;

.seatMute{

.topBar{

.liveInfo{

.liveAvatar{

.liveAvatar img{

.liveUserInfo{

.liveUsername{

.liveDot{

 height:7px;

.topActions{

.iconButton{

 height:40px;
 border:0;
 border-radius:50%;

 color:#fff;
 cursor:pointer;
 font-size:18px;
 display:flex;
 align-items:center;
 justify-content:center;
 backdrop-filter:blur(8px);
}

.iconButton:active{transform:scale(.95)}

.liveBadge{

 top:62px;
 left:12px;
 z-index:50;
 padding:6px 9px;
 border-radius:8px;
 background:#e74c3c;
 color:#fff;
 font-size:11px;
 font-weight:800;
}

.viewerBadge{

 top:62px;
 right:12px;
 z-index:50;
 padding:6px 9px;

 background:rgba(23,32,51,.82);

 font-size:11px;

}

.countryBar{

.countryFlag{

.bottomArea{

.bottomButtons{

.bottomButton{

.comments{

.comment{

.commentForm{

.commentInput{

.reactionButtons{
 display:flex;

.reactionButton{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:rgba(23,32,51,.85);
 color:#fff;
 cursor:pointer;
 font-size:18px;

}

.reactionButton:active{

.panel{

 inset:0;
 z-index:1000;
 display:none;
 align-items:flex-end;
 justify-content:center;

.panelBox{

.panelHeader{

.panelTitle{

.liveList{

.liveCard{

 background:#172033;
 color:#fff;

}

.liveCardBg{
 position:absolute;
 inset:0;
 background:

.liveCardContent{
 position:absolute;
 inset:0;
 padding:11px;
 display:flex;
 flex-direction:column;
 justify-content:flex-end;
 background:linear-gradient(0deg,rgba(0,0,0,.82),transparent 65%);

.liveCardAvatar{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#087f73;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 font-weight:800;
 margin-bottom:auto;
}

.liveCardAvatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.liveCardTitle{

 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.liveCardUser{

 opacity:.8;
 margin-top:3px;
}

.liveCardMeta{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-top:6px;
 font-size:10px;
}

.cardLive{
 background:#e74c3c;
 padding:3px 6px;
 border-radius:5px;
 font-weight:800;
}

.giftGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}

.giftButton{
 border:1px solid #dfe4ec;
 background:#fff;
 border-radius:13px;
 min-height:88px;
 cursor:pointer;
 color:#172033;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

.giftButton:active{
 transform:scale(.97);
}

.giftEmoji{
 font-size:29px;
 margin-bottom:5px;
}

.giftName{
 font-size:11px;
 font-weight:800;
}

.giftCost{
 font-size:10px;
 color:#687386;
 margin-top:3px;
}

.createPanel{
 position:absolute;
 inset:0;
 z-index:1100;
 display:none;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.6);
}

.createBox{
 width:100%;
 max-width:520px;
 background:#fff;
 border-radius:20px 20px 0 0;
 padding:20px;
 max-height:90vh;
 overflow:auto;
}

.createHeader{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:18px;
}

.createTitle{
 font-size:20px;
 font-weight:800;
}

.closeCreate{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:#f5f7fb;
 color:#172033;
 cursor:pointer;
 font-size:20px;
}

.createLabel{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:7px;
}

.createInput,
.createSelect{
 width:100%;
 height:44px;
 border:1px solid #dfe4ec;
 border-radius:10px;
 padding:0 12px;
 outline:none;
 margin-bottom:14px;
 background:#fff;
 color:#172033;
}

.createTextarea{
 width:100%;
 min-height:90px;
 resize:none;
 border:1px solid #dfe4ec;
 border-radius:10px;
 padding:12px;
 outline:none;
 margin-bottom:14px;
}

.startLiveButton{
 width:100%;
 height:48px;
 border:0;
 border-radius:11px;
 background:#087f73;
 color:#fff;
 font-size:15px;
 font-weight:800;
 cursor:pointer;
}

.stopLiveButton{
 width:100%;
 height:48px;
 border:0;
 border-radius:11px;
 background:#e74c3c;
 color:#fff;
 font-size:15px;
 font-weight:800;
 cursor:pointer;
 display:none;
 margin-top:8px;
}

.ownerTreasury{
 position:absolute;
 right:12px;
 bottom:150px;
 z-index:70;
 display:none;
 width:175px;
 padding:10px;
 border-radius:12px;
 background:rgba(23,32,51,.9);
 color:#fff;
 backdrop-filter:blur(10px);
 box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.ownerTreasuryTitle{
 font-size:11px;
 font-weight:800;
 margin-bottom:5px;
}

.ownerTreasuryBalance{
 font-size:16px;
 font-weight:800;
}

.ownerTreasurySub{
 font-size:10px;
 opacity:.7;
 margin-top:3px;
}

.messageBox{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 z-index:99999;
 background:#172033;
 color:#fff;
 padding:10px 15px;

 font-size:12px;
 display:none;

 text-align:center;
}

.fullscreenHint{
 position:absolute;
 top:96px;
 left:50%;
 transform:translateX(-50%);

 padding:5px 8px;
 border-radius:7px;
 display:none;
}

@media(max-width:600px){
 #seatGrid{
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;
  padding:96px 5px 155px;
  gap:4px;
 }

 .seat{
  border-radius:7px;
 }

 .seatAvatar{
  width:34px;
  height:34px;
  font-size:14px;
 }

 .seatName{
  font-size:9px;
 }

 .seatStatus{
  font-size:7px;
 }

 .seatLabel{
  font-size:7px;

 }

 }

  height:18px;

 }

 }

  grid-template-columns:repeat(3,1fr);
 }

  bottom:150px;
  width:155px;
 }

</head>

<body>

<div id="authScreen">
 <div class="authBox">
  <div class="authLogo">🔴</div>
  <div class="authTitle">P2P Social Live</div>
  <div class="authText" id="authText">Checking your account...</div>
 </div>
</div>

<div id="liveApp">

 <div class="liveBackground"></div>

 <div id="seatGrid"></div>

 <div class="topBar">
  <div class="liveInfo">
   <div class="liveAvatar" id="liveAvatar">U</div>

   <div class="liveUserInfo">
    <div class="liveUsername" id="liveUsername">P2P Social Live</div>

    <div class="liveStatus">
     <span class="liveDot"></span>
     <span id="liveState">LIVE</span>
    </div>
   </div>
  </div>

  <div class="topActions">
   <button class="iconButton" onclick="openLiveList()" title="Live">📺</button>
   <button class="iconButton" onclick="shareLive()" title="Share">↗</button>
   <button class="iconButton" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
   <button class="iconButton" onclick="closeLive()" title="Close">✕</button>
  </div>
 </div>

 <div class="liveBadge">LIVE</div>

 <div class="viewerBadge">
  👁 <span id="viewerCount">1</span>/24
 </div>

 <div id="countryBar" class="countryBar"></div>

 <div class="fullscreenHint" id="fullscreenHint">
  24-seat Live Room
 </div>

 <div id="ownerTreasury" class="ownerTreasury">
  <div class="ownerTreasuryTitle">💎 Owner Treasury</div>
  <div id="ownerTreasuryBalance" class="ownerTreasuryBalance">0 💎</div>
  <div class="ownerTreasurySub">Diamond treasury</div>
 </div>

 <div class="bottomArea">

  <div class="bottomButtons">
   <button class="bottomButton primary" onclick="openLiveList()">👥 Join Live</button>
   <button class="bottomButton" onclick="openGiftPanel()">🎁 Send Gift</button>
   <button class="bottomButton" onclick="openCreateLive()">🔴 Create Live</button>
  </div>

  <div id="comments" class="comments"></div>

  <div class="reactionButtons">
   <button class="reactionButton" onclick="sendReaction('❤️')">❤️</button>
   <button class="reactionButton" onclick="sendReaction('🔥')">🔥</button>
   <button class="reactionButton" onclick="sendReaction('👏')">👏</button>
   <button class="reactionButton" onclick="sendReaction('💎')">💎</button>
  </div>

  <form id="commentForm" class="commentForm" onsubmit="sendComment(event)">
   <input
    id="commentInput"
    class="commentInput"
    maxlength="500"
    autocomplete="off"
    placeholder="Say something..."
   >
   <button class="sendComment" type="submit">➤</button>
  </form>

 </div>
</div>

<!-- LIVE LIST -->

<div id="liveListPanel" class="panel">

 <div class="panelBox">

  <div class="panelHeader">
   <div class="panelTitle">👥 Live to Join</div>
   <button class="closePanel" onclick="closeLiveList()">✕</button>
  </div>

  <div id="liveList" class="liveList">
   <div style="padding:20px;text-align:center;color:#687386;grid-column:1/-1">
    Loading Live rooms...
   </div>
  </div>

 </div>
</div>

<!-- GIFT PANEL -->

<div id="giftPanel" class="panel">

 <div class="panelBox">

  <div class="panelHeader">
   <div class="panelTitle">🎁 Send Gift</div>
   <button class="closePanel" onclick="closeGiftPanel()">✕</button>
  </div>

  <div class="giftGrid">

   <button class="giftButton" onclick="sendGift('❤️','Heart',1)">
    <div class="giftEmoji">❤️</div>
    <div class="giftName">Heart</div>
    <div class="giftCost">1 💎</div>
   </button>

   <button class="giftButton" onclick="sendGift('🌹','Rose',5)">
    <div class="giftEmoji">🌹</div>
    <div class="giftName">Rose</div>
    <div class="giftCost">5 💎</div>
   </button>

   <button class="giftButton" onclick="sendGift('💎','Diamond',10)">
    <div class="giftEmoji">💎</div>
    <div class="giftName">Diamond</div>
    <div class="giftCost">10 💎</div>
   </button>

   <button class="giftButton" onclick="sendGift('🎁','Gift',20)">
    <div class="giftEmoji">🎁</div>
    <div class="giftName">Gift</div>
    <div class="giftCost">20 💎</div>
   </button>

   <button class="giftButton" onclick="sendGift('👑','Crown',50)">
    <div class="giftEmoji">👑</div>
    <div class="giftName">Crown</div>
    <div class="giftCost">50 💎</div>
   </button>

   <button class="giftButton" onclick="sendGift('🚀','Rocket',100)">
    <div class="giftEmoji">🚀</div>
    <div class="giftName">Rocket</div>
    <div class="giftCost">100 💎</div>
   </button>

  </div>

 </div>
</div>

<!-- CREATE LIVE -->

<div id="createPanel" class="createPanel">

 <div class="createBox">

  <div class="createHeader">
   <div class="createTitle">🔴 Create Live</div>
   <button class="closeCreate" onclick="closeCreateLive()">✕</button>
  </div>

  <label class="createLabel">Live title</label>

  <input
   id="createLiveTitle"
   class="createInput"
   maxlength="100"
   placeholder="Enter live title"
  >

  <label class="createLabel">Country</label>

  <select id="liveCountry" class="createSelect"></select>

  <label class="createLabel">Description</label>

  <textarea
   id="createLiveDescription"
   class="createTextarea"
   maxlength="500"
   placeholder="Describe your live..."
  ></textarea>

  <button
   id="startLiveButton"
   class="startLiveButton"
   onclick="startLive()"
  >
   🔴 Start Live
  </button>

  <button
   id="stopLiveButton"
   class="stopLiveButton"
   onclick="stopLive()"
  >
   ⛔ Stop Live
  </button>

 </div>
</div>

<div id="messageBox" class="messageBox"></div>

function escapeHtml(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function showMessage(message){
 const box=document.getElementById("messageBox");
 box.textContent=message;
 box.style.display="block";

 clearTimeout(window.messageTimer);

 window.messageTimer=setTimeout(()=>{
  box.style.display="none";
 },3000);
}

function getFirstValue(obj,keys,fallback=""){
 for(const key of keys){
  if(
   obj &&
   obj[key]!==undefined &&
   obj[key]!==null &&
   obj[key]!==""
  ){
   return obj[key];
  }
 }

 return fallback;
}

function getUserLevel(profile){
 const value=getFirstValue(
  profile,
  ["level","user_level","account_level","membership_level"],
  0
 );

 const number=parseInt(value,10);

 return Number.isFinite(number)?number:0;
}

function normalizePremiumTier(profile){
 return String(
  getFirstValue(
   profile,
   ["premium_tier","premium","subscription_tier","plan","membership"],
   ""
  )
 ).toLowerCase().trim();
}

function hasPremiumMax(){
 if(!currentProfile)return false;

 const tier=normalizePremiumTier(currentProfile);

 return [
  "premium max",
  "premium_max",
  "premium-max",
  "max",
  "premiummax"
 ].includes(tier);
}

function canCreateLive(){
 return hasPremiumMax() &&
        getUserLevel(currentProfile)>=PREMIUM_MAX_MIN_LEVEL;
}

async function requireLogin(){

 const {data,error}=
 await supabaseClient.auth.getSession();

 if(error||!data.session){
  window.location.href="./login.html";
  return false;
 }

 currentUser=data.session.user;

 return true;
}

async function loadProfile(){

 if(!currentUser)return null;

 let result=
 await supabaseClient
  .from("profiles")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(result.data){
  currentProfile=result.data;
  return currentProfile;
 }

 result=
 await supabaseClient
  .from("users")
  .select("*")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(result.data){
  currentProfile=result.data;
  return currentProfile;
 }

 currentProfile={
  id:currentUser.id,
  username:
   currentUser.user_metadata?.username ||
   currentUser.email?.split("@")[0] ||
   "User"
 };

 return currentProfile;
}

function getUsername(){

 return getFirstValue(
  currentProfile,
  ["username","user_name","name","display_name"],
  currentUser?.email?.split("@")[0]||"User"
 );
}

function getAvatar(){

 return getFirstValue(
  currentProfile,
  ["avatar_url","avatar","profile_image","photo_url","image_url"],
  ""
 );
}

function updateLiveUser(){

 document.getElementById("liveUsername")
  .textContent=username;

  document.getElementById("liveAvatar");

 if(avatar){

  avatarBox.innerHTML=
   '<img src="'+escapeHtml(avatar)+'" alt="">';

 }
}

function buildCountrySelectors(){

 const bar=document.getElementById("countryBar");
 const select=document.getElementById("liveCountry");

 bar.innerHTML="";
 select.innerHTML="";

 countries.forEach((item,index)=>{

  const flag=item[0];
  const code=item[1];

  const button=document.createElement("button");

  button.className="countryFlag";

  if(code==="ET"){
   button.classList.add("active");
  }

  button.textContent=flag;

  button.title=code;

  button.onclick=()=>{
   currentCountryFlag=flag;
   currentCountryCode=code;

   document
    .querySelectorAll(".countryFlag")
    .forEach(b=>b.classList.remove("active"));

   button.classList.add("active");

   filterLiveByCountry(code);
  };

  bar.appendChild(button);

  const option=document.createElement("option");

  option.value=code;
  option.textContent=flag+" "+code;

  if(code==="ET"){
   option.selected=true;
   currentCountryFlag=flag;
   currentCountryCode=code;
  }

  select.appendChild(option);

 });

 const more=document.createElement("button");

 more.className="moreCountries";
 more.textContent="More";

 more.onclick=()=>{
  bar.style.overflowX=
   bar.style.overflowX==="auto"?"hidden":"auto";
 };

 bar.appendChild(more);

 select.onchange=()=>{
  const selected=
   countries.find(x=>x[1]===select.value);

  if(selected){
   currentCountryFlag=selected[0];
   currentCountryCode=selected[1];
  }
 };
}

function openCreateLive(){

 if(!currentUser){
  showMessage("Please login first.");
  return;
 }

 if(!canCreateLive()){
  showMessage(
   "Premium Max and Level 3+ are required to create Live."
  );
  return;
 }

 document.getElementById("createPanel")
  .style.display="flex";
}

function closeCreateLive(){
 document.getElementById("createPanel")
  .style.display="none";
}

async function startLive(){

 if(!canCreateLive()){
  showMessage(
   "Premium Max and Level 3+ are required."
  );
  return;
 }

 const title=
  document.getElementById("createLiveTitle")
  .value.trim();

 const description=
  document.getElementById("createLiveDescription")
  .value.trim();

 const country=
  document.getElementById("liveCountry").value;

 const countryData=
  countries.find(x=>x[1]===country)||["🇪🇹","ET"];

 if(!title){
  showMessage("Enter a live title.");
  return;
 }

 const startButton=
  document.getElementById("startLiveButton");

 startButton.disabled=true;
 startButton.textContent="Starting...";

 try{

  const payload={
   host_id:currentUser.id,
   title:title,
   description:description,
   status:"live",
   is_live:true,
   country_code:countryData[1],
   country_flag:countryData[0]
  };

  let result=
   await supabaseClient
    .from("live_rooms")
    .insert(payload)
    .select("*")
    .single();

  if(result.error){

   const fallbackPayload={
    user_id:currentUser.id,
    title:title,
    description:description,
    status:"live",
    is_live:true,
    country_code:countryData[1],
    country_flag:countryData[0]
   };

   result=
    await supabaseClient
     .from("live")
     .insert(fallbackPayload)
     .select("*")
     .single();
  }

  if(result.error){

   const simplePayload={
    host_id:currentUser.id,
    title:title,
    description:description,
    status:"live",
    is_live:true
   };

   result=
    await supabaseClient
     .from("live_rooms")
     .insert(simplePayload)
     .select("*")
     .single();
  }

  if(result.error)throw result.error;

  currentLiveId=result.data.id;
  isHost=true;

  currentCountryCode=
   getFirstValue(
    result.data,
    ["country_code"],
    countryData[1]
   );

  currentCountryFlag=
   getFirstValue(
    result.data,
    ["country_flag"],
    countryData[0]
   );

  closeCreateLive();

  document.getElementById("liveState")
   .textContent="LIVE";

  document.getElementById("startLiveButton")
   .style.display="none";

  document.getElementById("stopLiveButton")
   .style.display="block";

  showMessage("Your 24-seat Live room is open.");

  await startCamera();

  await enterLiveRoom();

  await loadComments();

  document.getElementById("ownerTreasury")
   .style.display="block";

  await loadOwnerTreasury();

  await forceFullscreen();

 }catch(error){

  console.error(error);

  showMessage("Unable to create Live room.");

 }finally{

  startButton.disabled=false;
  startButton.textContent="🔴 Start Live";
 }
}

async function startCamera(){

 if(!isHost)return;

 if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
 ){
  showMessage(
   "Camera is not available in this browser."
  );
  return;
 }

 try{

  localStream=
   await navigator.mediaDevices.getUserMedia({
    video:{
     facingMode:"user",
     width:{ideal:1280},
     height:{ideal:720}
    },
    audio:true
   });

  addLocalSeat();

 }catch(error){

  console.error(error);

  showMessage(
   "Camera permission was not granted."
  );
 }
}

 seat.className="seat seatEmpty";

 grid.innerHTML="";

function addLocalSeat(){

 const index=0;

 participantSlots[currentUser.id]=index;

  document.getElementById("seat-"+index);

 seat.className="seat";

 seat.innerHTML=`
  <video id="video-local"

  <div class="seatLabel">

  </div>

}

function findFreeSeat(){

 const used=
  Object.values(participantSlots);

 for(let i=0;i<MAX_SEATS;i++){

  if(!used.includes(i)){
   return i;
  }
 }

 return -1;
}

function addRemoteParticipant(participant){

 if(!participant)return;

 const userId=participant.user_id;

 if(!userId)return;

 if(userId===currentUser?.id)return;

 if(
  participantSlots[userId]===undefined
 ){
  const slot=findFreeSeat();

  if(slot<0){
   return;
  }

  participantSlots[userId]=slot;
 }

 const index=participantSlots[userId];

 const seat=
  document.getElementById("seat-"+index);

 if(!seat)return;

 const username=
  participant.username||"Live User";

 const avatar=
  participant.avatar||"";

 seat.className="seat";

 seat.innerHTML=`
  <video
   id="video-${escapeHtml(userId)}"
   autoplay
   playsinline>
  </video>

  <div class="seatLive">LIVE</div>

  <div class="seatMute">🎙</div>

  <div class="seatLabel">
   ${escapeHtml(username)}
  </div>
 `;

 if(avatar){

  const video=
   document.getElementById(
    "video-"+userId
   );

  const avatarImg=
   document.createElement("img");

  avatarImg.src=avatar;
 }
}

async function enterLiveRoom(){

 if(!currentLiveId)return;

 if(liveChannel){

  try{
   await supabaseClient.removeChannel(
    liveChannel
   );
  }catch(e){}

  liveChannel=null;
 }

 participantSlots={};
 roomParticipants={};

 initializeSeats();

 if(isHost){
  addLocalSeat();
 }

 liveChannel=
  supabaseClient
   .channel("live-24-"+currentLiveId,{
    config:{
     broadcast:{
      self:false
     },
     presence:{
      key:currentUser.id
     }
    }
   })
   .on(
    "presence",
    {event:"sync"},
    async()=>{
     await handlePresenceSync();
    }
   )
   .on(
    "presence",
    {event:"join"},
    async({key,newPresences})=>{
     await handlePresenceSync();
    }
   )
   .on(
    "presence",
    {event:"leave"},
    async({key,leftPresences})=>{
     removeParticipant(key);
     await updateViewerDisplay();
    }
   )
   .on(
    "broadcast",
    {event:"reaction"},
    payload=>{
     if(payload?.payload?.emoji){
      showReaction(
       payload.payload.emoji
      );
     }
    }
   )
   .on(
    "broadcast",
    {event:"gift"},
    payload=>{
     if(payload?.payload){
      showGiftAnimation(
       payload.payload
      );
     }
    }
   )
   .on(
    "broadcast",
    {event:"viewer"},
    payload=>{
     const count=
      Number(payload?.payload?.count);

     if(Number.isFinite(count)){
      viewerCount=
       Math.min(MAX_SEATS,count);

      document.getElementById(
       "viewerCount"
      ).textContent=viewerCount;
     }
    }
   )
   .on(
    "broadcast",
    {event:"offer"},
    async({payload})=>{
     await receiveOffer(payload);
    }
   )
   .on(
    "broadcast",
    {event:"answer"},
    async({payload})=>{
     await receiveAnswer(payload);
    }
   )
   .on(
    "broadcast",
    {event:"ice"},
    async({payload})=>{
     await receiveIce(payload);
    }
   )
   .on(
    "broadcast",
    {event:"leave-peer"},
    payload=>{
     if(payload?.payload?.user_id){
      removeParticipant(
       payload.payload.user_id
      );
     }
    }
   )
   .subscribe(async status=>{

    if(status==="SUBSCRIBED"){

     await liveChannel.track({
      user_id:currentUser.id,
      username:getUsername(),
      avatar:getAvatar(),
      country_code:currentCountryCode,
      country_flag:currentCountryFlag,
      role:isHost?"host":"viewer",
      joined_at:new Date().toISOString()
     });

     await updateViewerDisplay();
    }
   });

 commentChannel=liveChannel;
}

async function handlePresenceSync(){

 if(!liveChannel)return;

 const state=liveChannel.presenceState();

 roomParticipants={};

 Object.keys(state).forEach(key=>{

  const list=state[key]||[];

  if(list.length){

   const p=list[list.length-1];

   roomParticipants[key]=p;

   if(key!==currentUser.id){

    addRemoteParticipant(p);
   }
  }
 });

 const count=
  Object.keys(roomParticipants).length+1;

 viewerCount=
  Math.min(MAX_SEATS,count);

 document.getElementById("viewerCount")
  .textContent=viewerCount;

 await setupPeerConnections();

}

async function setupPeerConnections(){

 const ids=
  Object.keys(roomParticipants);

 for(const userId of ids){

  if(userId===currentUser.id)continue;

  if(!peerConnections[userId]){

   const pc=
    createPeerConnection(userId);

   peerConnections[userId]=pc;

   /*
    The lower user id starts negotiation.
    This prevents both sides from continuously
    creating offers.
   */

   if(String(currentUser.id)<String(userId)){

    try{

     const offer=
      await pc.createOffer();

     await pc.setLocalDescription(offer);

     await sendSignal(
      "offer",
      userId,
      {
       type:pc.localDescription.type,
       sdp:pc.localDescription.sdp
      }
     );

    }catch(error){

     console.error(
      "Offer error",
      error
     );
    }
   }
  }
 }
}

function createPeerConnection(remoteUserId){

 const pc=
  new RTCPeerConnection({
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}
   ]
  });

 if(localStream){

  localStream.getTracks().forEach(track=>{

   try{
    pc.addTrack(track,localStream);
   }catch(e){}
  });
 }

 pc.onicecandidate=async event=>{

  if(event.candidate){

   await sendSignal(
    "ice",
    remoteUserId,
    {
     candidate:event.candidate
    }
   );
  }
 };

 pc.ontrack=event=>{

  const video=
   document.getElementById(
    "video-"+remoteUserId
   );

  if(video){

   if(
    video.srcObject!==event.streams[0]
   ){

    video.srcObject=
     event.streams[0];
   }

   video.play().catch(()=>{});
  }
 };

 pc.onconnectionstatechange=()=>{

  const state=pc.connectionState;

  if(
   state==="failed" ||
   state==="closed" ||
   state==="disconnected"
  ){

   removeParticipant(remoteUserId);
  }
 };

 return pc;
}

async function sendSignal(
 event,
 targetUserId,
 data
){

 if(!liveChannel)return;

 try{

  await liveChannel.send({
   type:"broadcast",
   event:event,
   payload:{
    from:currentUser.id,
    to:targetUserId,
    ...data
   }
  });

 }catch(error){

  console.error(
   "Signal error",
   error
  );
 }
}

async function receiveOffer(payload){

 if(!payload)return;

 if(payload.to!==currentUser.id)return;

 const from=payload.from;

 if(!from)return;

 let pc=peerConnections[from];

 if(!pc){

  pc=createPeerConnection(from);

  peerConnections[from]=pc;
 }

 try{

  await pc.setRemoteDescription(
   new RTCSessionDescription({
    type:"offer",
    sdp:payload.sdp
   })
  );

  const answer=
   await pc.createAnswer();

  await pc.setLocalDescription(answer);

  await sendSignal(
   "answer",
   from,
   {
    type:pc.localDescription.type,
    sdp:pc.localDescription.sdp
   }
  );

 }catch(error){

  console.error(
   "Answer error",
   error
  );
 }
}

async function receiveAnswer(payload){

 if(!payload)return;

 if(payload.to!==currentUser.id)return;

 const from=payload.from;

 const pc=peerConnections[from];

 if(!pc)return;

 try{

  await pc.setRemoteDescription(
   new RTCSessionDescription({
    type:"answer",
    sdp:payload.sdp
   })
  );

 }catch(error){

  console.error(
   "Remote answer error",
   error
  );
 }
}

async function receiveIce(payload){

 if(!payload)return;

 if(payload.to!==currentUser.id)return;

 const from=payload.from;

 const pc=peerConnections[from];

 if(!pc)return;

 try{

  if(payload.candidate){

   await pc.addIceCandidate(
    new RTCIceCandidate(
     payload.candidate
    )
   );
  }

 }catch(error){

  console.error(
   "ICE error",
   error
  );
 }
}

function removeParticipant(userId){

 const index=
  participantSlots[userId];

 if(index!==undefined){

  const seat=
   document.getElementById(
    "seat-"+index
   );

  if(seat){

   seat.className=
    "seat seatEmpty";

   seat.innerHTML=`
    <div class="seatPlaceholder">
     <div class="seatAvatar">+</div>
     <div class="seatName">Empty Seat</div>
     <div class="seatStatus">Join</div>
    </div>
   `;
  }

  delete participantSlots[userId];
 }

 const pc=
  peerConnections[userId];

 if(pc){

  try{
   pc.close();
  }catch(e){}

  delete peerConnections[userId];
 }

 delete roomParticipants[userId];
}

async function stopLive(){

 if(
  !isHost ||
  !currentLiveId
 ){

  closeLive();
  return;
 }

 try{

  let result=
   await supabaseClient
    .from("live_rooms")
    .update({
     status:"ended",
     is_live:false,
     ended_at:new Date().toISOString()
    })
    .eq("id",currentLiveId);

  if(result.error){

   await supabaseClient
    .from("live")
    .update({
     status:"ended",
     is_live:false,
     ended_at:new Date().toISOString()
    })
    .eq("id",currentLiveId);
  }

 }catch(error){

  console.error(error);

 }finally{

  stopCamera();

  closePeerConnections();

  showMessage("Live ended.");

  setTimeout(()=>{
   window.location.href="./index.html";
  },800);
 }
}

function stopCamera(){

 if(localStream){

  localStream
   .getTracks()
   .forEach(track=>track.stop());

  localStream=null;
 }

 const localVideo=
  document.getElementById("video-local");

 if(localVideo){

  localVideo.srcObject=null;
 }
}

function closePeerConnections(){

 Object.keys(peerConnections)
  .forEach(userId=>{

   try{
    peerConnections[userId].close();
   }catch(e){}
  });

 peerConnections={};
}

async function loadLiveFromUrl(){

 const params=
  new URLSearchParams(
   window.location.search
  );

 const liveId=
  params.get("id") ||
  params.get("live_id") ||
  params.get("room");

 if(!liveId){

  document.getElementById("liveState")
   .textContent="LIVE";

  await loadLiveRooms();

  return;
 }

 currentLiveId=liveId;

 await loadLiveRoom(liveId);
}

async function loadLiveRoom(liveId){

 let result=
  await supabaseClient
   .from("live_rooms")
   .select("*")
   .eq("id",liveId)
   .maybeSingle();

 if(!result.data){

  result=
   await supabaseClient
    .from("live")
    .select("*")
    .eq("id",liveId)
    .maybeSingle();
 }

 if(result.error){

  console.error(result.error);
  showMessage("Unable to load Live room.");
  return;
 }

 if(!result.data){

  showMessage("Live room not found.");
  return;
 }

 const room=result.data;

 const hostId=
  getFirstValue(
   room,
   ["host_id","user_id","owner_id","creator_id"],
   ""
  );

 if(
  hostId &&
  currentUser &&
  hostId===currentUser.id
 ){
  isHost=true;
 }

 currentCountryCode=
  getFirstValue(
   room,
   ["country_code"],
   ""
  );

 currentCountryFlag=
  getFirstValue(
   room,
   ["country_flag"],
   ""
  );

 const title=
  getFirstValue(
   room,
   ["title","name"],
   "Live Room"
  );

 document.title=
  title+" • P2P Social";

 const description=
  getFirstValue(
   room,
   ["description","caption"],
   "Welcome to P2P Social Live"
  );

 if(hostId){

  await loadHostProfile(hostId);
 }

 document.getElementById("liveState")
  .textContent=
  getFirstValue(
   room,
   ["status"],
   "LIVE"
  ).toUpperCase();

 if(isHost){

  document.getElementById(
   "stopLiveButton"
  ).style.display="block";

  document.getElementById(
   "startLiveButton"
  ).style.display="none";

  document.getElementById(
   "ownerTreasury"
  ).style.display="block";

  await loadOwnerTreasury();

  if(!localStream){
   await startCamera();
  }
 }

 await enterLiveRoom();

 await loadComments();

 await forceFullscreen();
}

  );

   profile,

async function loadComments(){

 if(!currentLiveId)return;

 const tables=[
  "live_comments",
  "comments"
 ];

 for(const table of tables){

  const result=
   await supabaseClient
    .from(table)
    .select("*")
    .eq("live_id",currentLiveId)
    .order("created_at",{ascending:true})
    .limit(100);

  if(!result.error){

   const comments=
    result.data||[];

   comments.forEach(
    addCommentToScreen
   );

   return;
  }
 }
}

function addCommentToScreen(comment){

 const container=
  document.getElementById(
   "comments"
  );

 const username=
  getFirstValue(
   comment,
   ["username","user_name","name"],
   "User"
  );

 const text=
  getFirstValue(
   comment,
   ["comment","text","body","content"],
   ""
  );

 if(!text)return;

 const div=
  document.createElement("div");

 div.className="comment";

 div.innerHTML=
  "<strong>"+
  escapeHtml(username)+
  "</strong> "+
  escapeHtml(text);

 container.appendChild(div);

 while(
  container.children.length>100
 ){

  container.removeChild(
   container.firstChild
  );
 }

 container.scrollTop=
  container.scrollHeight;
}

async function sendComment(event){

 event.preventDefault();

 if(!currentUser){

  showMessage(
   "Please login first."
  );

  return;
 }

 if(!currentLiveId){

  showMessage(
   "No active Live room."
  );

  return;
 }

 const input=
  document.getElementById(
   "commentInput"
  );

 const text=
  input.value.trim();

 if(!text)return;

 input.value="";

 const username=
  getUsername();

 let saved=false;

 const result=
  await supabaseClient
   .from("live_comments")
   .insert({
    live_id:currentLiveId,
    user_id:currentUser.id,
    username:username,
    comment:text,
    text:text
   });

 if(!result.error){

  saved=true;

 }else{

  const fallback=
   await supabaseClient
    .from("comments")
    .insert({
     live_id:currentLiveId,
     user_id:currentUser.id,
     username:username,
     text:text
    });

  if(!fallback.error){
   saved=true;
  }
 }

 addCommentToScreen({
  username:username,
  text:text
 });

 if(liveChannel){

  try{

   await liveChannel.send({
    type:"broadcast",
    event:"comment",
    payload:{
     username:username,
     text:text
    }
   });

  }catch(e){}
 }
}

async function sendGift(
 emoji,
 giftName,

){

   "Please login first."
  );

  return;
 }

 if(!currentLiveId){

  showMessage(
   "Join a Live first."
  );

  return;
 }

 const giftPayload={
  live_id:currentLiveId,
  user_id:currentUser.id,
  username:getUsername(),
  gift:emoji,
  gift_name:giftName,
  diamonds:Number(diamonds),
  created_at:new Date().toISOString()
 };

 let saved=false;

 try{

  const result=
   await supabaseClient
    .from("live_gifts")
    .insert(giftPayload);

  if(!result.error){
   saved=true;
  }

 }catch(error){

  console.error(error);
 }

 if(liveChannel){

  try{

   await liveChannel.send({
    type:"broadcast",
    event:"gift",
    payload:{
     emoji:emoji,
     gift_name:giftName,
     diamonds:Number(diamonds),
     username:getUsername()
    }
   });

   console.error(error);

 showGiftAnimation({
  emoji:emoji,
  gift_name:giftName,
  diamonds:Number(diamonds),
  username:getUsername()
 });

 closeGiftPanel();

 showMessage(
  "Sent "+giftName+" "+emoji
 );

async function loadOwnerTreasury(){

 if(!isHost)return;

 let balance=0;

 const possibleTables=[
  "owner_treasury",
  "treasury",
  "diamond_treasury"
 ];

 for(
  const table of possibleTables
 ){

  const result=
   await supabaseClient
    .from(table)
    .select("*")
    .limit(1)
    .maybeSingle();

  if(
   !result.error &&
   result.data
  ){

   balance=
    Number(
     getFirstValue(
      result.data,
      [
       "diamond_balance",
       "diamonds",
       "balance",
       "total_diamonds"
      ],
      0
     )
    )||0;

   break;
  }
 }

 document.getElementById(
  "ownerTreasuryBalance"
 ).textContent=
  Number(balance).toLocaleString()+
  " 💎";
}

async function loadLiveRooms(){

 const container=
  document.getElementById(
   "liveList"
  );

 container.innerHTML=
  '<div style="padding:20px;text-align:center;color:#687386;grid-column:1/-1">Loading Live rooms...</div>';

 let result=
  await supabaseClient
   .from("live_rooms")
   .select("*")
   .limit(100);

 let rooms=[];

 if(!result.error){

  rooms=
   (result.data||[])
    .filter(room=>
     room.is_live===true ||
     String(room.status).toLowerCase()==="live"
    );

 }else{

  result=
   await supabaseClient
    .from("live")
    .select("*")
    .limit(100);

  if(!result.error){

   rooms=
    (result.data||[])
     .filter(room=>
      room.is_live===true ||
      String(room.status).toLowerCase()==="live"
     );
  }
 }

 liveRoomsCache=rooms;

 renderLiveRooms(rooms);
}

async function renderLiveRooms(rooms){

 const container=
  document.getElementById(
   "liveList"
  );

 container.innerHTML="";

 if(!rooms.length){

  container.innerHTML=
   '<div style="padding:25px;text-align:center;color:#687386;grid-column:1/-1">No Live rooms right now.</div>';

  return;
 }

 for(const room of rooms){

  const hostId=
   getFirstValue(
    room,
    ["host_id","user_id","owner_id","creator_id"],
    ""
   );

  let profile=null;

  if(hostId){

   let result=
    await supabaseClient
     .from("profiles")
     .select("*")
     .eq("id",hostId)
     .maybeSingle();

   if(!result.data){

    result=
     await supabaseClient
      .from("users")
      .select("*")
      .eq("id",hostId)
      .maybeSingle();
   }

   profile=result.data;
  }

  const username=
   getFirstValue(
    profile,
    ["username","user_name","name","display_name"],
    "Live User"
   );

  const avatar=
   getFirstValue(
    profile,
    ["avatar_url","avatar","profile_image","photo_url","image_url"],
    ""
   );

  const title=
   getFirstValue(
    room,
    ["title","name"],
    "Live Room"
   );

  const flag=
   getFirstValue(
    room,
    ["country_flag"],
    "🔴"
   );

  const viewers=
   getFirstValue(
    room,
    ["viewer_count","viewers"],
    0
   );

  const card=
   document.createElement("button");

  card.className="liveCard";

  card.onclick=()=>{
   joinLiveRoom(room.id);
  };

  card.innerHTML=`

   <div class="liveCardBg"></div>

   <div class="liveCardContent">

    <div class="liveCardAvatar">
     ${
      avatar
      ?
      '<img src="'+escapeHtml(avatar)+'" alt="">'
      :
      escapeHtml(
       username.charAt(0).toUpperCase()
      )
     }
    </div>

    <div class="liveCardTitle">
     ${escapeHtml(flag)} ${escapeHtml(title)}
    </div>

    <div class="liveCardUser">
     ${escapeHtml(username)}
    </div>

    <div class="liveCardMeta">
     <span class="cardLive">LIVE</span>
     <span>👁 ${escapeHtml(viewers||"0")}</span>
    </div>

   </div>
  `;

  container.appendChild(card);
 }
}

function filterLiveByCountry(code){

 if(!liveRoomsCache.length){

  loadLiveRooms();
  return;
 }

 const filtered=
  liveRoomsCache.filter(room=>
   getFirstValue(
    room,
    ["country_code"],
    ""
   )===code
  );

 if(filtered.length){

  renderLiveRooms(filtered);

 }else{

  renderLiveRooms([]);
 }
}

async function shareLive(){

 const url=
  window.location.href;

 try{

  if(navigator.share){

   await navigator.share({
    title:document.title,
    text:"Join my P2P Social Live",
    url:url
   });

  }else if(navigator.clipboard){

   await navigator.clipboard.writeText(url);

   showMessage(
    "Live link copied."
   );

  }else{

   showMessage(url);
  }

 }catch(error){

  console.error(error);
 }
}

async function forceFullscreen(){

   !document.fullscreenElement &&
   document.documentElement.requestFullscreen
  ){

   await document.documentElement
    .requestFullscreen();
  }

 }catch(error){}
}

async function toggleFullscreen(){

 try{

  if(!document.fullscreenElement){

   await document.documentElement
    .requestFullscreen();

  }else{

   await document.exitFullscreen();
  }

 }catch(error){

  showMessage(
   "Fullscreen is not available."
  );
 }
}

function closeLive(){

 if(isHost){

  const shouldStop=
   confirm("End this Live?");

  if(shouldStop){

   stopLive();
  }

  return;
 }

 if(liveChannel){

  try{

   liveChannel.send({
    type:"broadcast",
    event:"leave-peer",
    payload:{
     user_id:currentUser.id
    }
   });

  }catch(e){}
 }

 stopCamera();

 closePeerConnections();

 if(liveChannel){

  supabaseClient.removeChannel(
   liveChannel
  );

  liveChannel=null;
 }

 window.location.href="./index.html";
}

async function startApp(){

 const loggedIn=
  await requireLogin();

 if(!loggedIn)return;

 await loadProfile();

 updateLiveUser();

 buildCountrySelectors();

 initializeSeats();

 document.getElementById(
  "authScreen"
 ).style.display="none";

 document.getElementById(
  "liveApp"
 ).style.display="block";

 await loadLiveFromUrl();

 if(!currentLiveId){

  if(canCreateLive()){

   openCreateLive();

  }else{

   showMessage(
    "Choose a Live room to join."
   );
  }
 }

}

startApp();
