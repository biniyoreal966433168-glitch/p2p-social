<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buy USDT • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#f4f7f8;color:#123;min-height:100vh;padding-bottom:75px}
button,input{font:inherit}

header{
  background:#087f73;
  color:#fff;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #0002
}
.logo-wrap{display:flex;align-items:center;gap:8px;font-weight:800}
.logo{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#064e46,#10a889);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:21px;font-weight:900;
  box-shadow:inset 0 0 0 2px #ffffff22
}
.header-title{font-size:16px;font-weight:800}

.container{max-width:1100px;margin:auto;padding:12px}

.search-box{
  background:#fff;
  border:1px solid #dbe5e6;
  border-radius:12px;
  padding:8px;
  box-shadow:0 2px 8px #00000008;
  margin-bottom:12px
}
.search-box input{
  width:100%;
  border:0;
  outline:0;
  padding:10px 12px;
  font-size:14px;
  background:#f7fafb;
  border-radius:9px
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:10px 2px;
  font-size:15px;
  font-weight:800
}
.section-actions{display:flex;gap:6px}
.small-btn{
  border:1px solid #cfdcdd;
  background:#fff;
  color:#087f73;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  cursor:pointer
}

.offer-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px
}

.offer-card{
  background:#fff;
  border:1px solid #dce7e8;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000008;
  display:flex;
  flex-direction:column;
  min-width:0
}

.offer-head{
  background:#f8fbfb;
  border-bottom:1px solid #e4eeee;
  padding:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px
}

.offer-number{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#087f73;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
  flex:none
}

.seller{
  min-width:0;
  flex:1;
  font-size:12px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.buy-badge{
  background:#e7f7f4;
  color:#087f73;
  border:1px solid #bfe6df;
  padding:4px 7px;
  border-radius:6px;
  font-size:9px;
  font-weight:800;
  flex:none
}

.offer-body{
  padding:9px;
  display:flex;
  flex-direction:column;
  gap:7px;
  flex:1
}

.currency-box{
  border:1px solid #dce7e8;
  border-radius:9px;
  padding:8px;
  background:#fafcfc
}

.currency-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.currency-label{
  font-size:9px;
  color:#718083;
  font-weight:700;
  text-transform:uppercase
}

.currency-value{
  margin-top:2px;
  font-size:14px;
  font-weight:900;
  color:#123
}

.price-box{
  background:#087f73;
  color:#fff;
  border-radius:9px;
  padding:8px
}

.price-label{
  font-size:9px;
  opacity:.8;
  font-weight:700
}

.price-value{
  margin-top:2px;
  font-size:15px;
  font-weight:900
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:7px;
  padding:4px 0;
  border-bottom:1px solid #edf2f2
}

.info-row:last-child{border-bottom:0}

.info-label{
  color:#7a888a;
  font-size:9px;
  font-weight:700
}

.info-value{
  color:#203033;
  font-size:10px;
  font-weight:800;
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.offer-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:9px;
  border-top:1px solid #e7eeee
}

.action-btn{
  border:0;
  border-radius:8px;
  padding:8px 5px;
  cursor:pointer;
  font-size:10px;
  font-weight:800
}

.profile-btn{
  background:#edf5f4;
  color:#087f73
}

.buy-btn{
  background:#087f73;
  color:#fff
}

.action-btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #dce7e8;
  border-radius:12px;
  padding:25px 15px;
  text-align:center;
  color:#718083;
  font-size:13px
}

#tradeModal{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100
}

.modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 15px 40px #0004
}

.modal-head{
  background:#087f73;
  color:#fff;
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.modal-title{font-size:15px;font-weight:800}
.close{
  background:#ffffff22;
  color:#fff;
  border:0;
  width:30px;
  height:30px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px
}

.modal-body{padding:13px}

.trade-preview{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px
}

.preview-box{
  background:#f7fafb;
  border:1px solid #dce7e8;
  border-radius:9px;
  padding:9px
}

.preview-label{
  font-size:9px;
  color:#718083;
  font-weight:700
}

.preview-value{
  margin-top:3px;
  font-size:14px;
  font-weight:900
}

.start-trade-title{
  font-size:14px;
  font-weight:900;
  color:#087f73;
  margin:4px 0 9px
}

.trade-details{
  background:#f8fbfb;
  border:1px solid #dce7e8;
  border-radius:9px;
  padding:9px;
  margin-bottom:10px
}

.trade-detail{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:5px 0;
  border-bottom:1px solid #e5eeee
}

.trade-detail:last-child{border-bottom:0}

.trade-detail span:first-child{
  color:#718083;
  font-size:10px;
  font-weight:700
}

.trade-detail span:last-child{
  color:#123;
  font-size:10px;
  font-weight:800;
  text-align:right
}

.confirm-btn{
  width:100%;
  border:0;
  background:#087f73;
  color:#fff;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:800;
  font-size:12px
}

.confirm-btn:disabled{opacity:.5}

#toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#123;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-size:11px;
  z-index:200;
  display:none;
  max-width:90%;
  text-align:center
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:62px;
  background:#fff;
  border-top:1px solid #dce7e8;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  text-decoration:none;
  color:#718083;
  font-size:9px;
  font-weight:700
}

.nav-item.active{color:#087f73}
.nav-icon{font-size:18px;line-height:1}

@media(max-width:750px){
  .offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .container{padding:9px}
  .offer-head{padding:7px}
  .offer-body{padding:7px;gap:5px}
  .offer-actions{padding:7px;gap:4px}
  .currency-box,.price-box{padding:7px}
  .currency-value{font-size:12px}
  .price-value{font-size:13px}
  .info-label,.info-value{font-size:8px}
  .action-btn{font-size:9px;padding:7px 3px}
  .seller{font-size:10px}
  .buy-badge{font-size:8px;padding:3px 5px}
}

@media(max-width:500px){
  .offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .container{padding:6px}
  .offer-card{border-radius:9px}
  .offer-head{padding:5px}
  .offer-body{padding:5px;gap:4px}
  .offer-actions{padding:5px;grid-template-columns:1fr;gap:4px}
  .offer-number{width:21px;height:21px;font-size:9px}
  .seller{font-size:8px}
  .buy-badge{display:none}
  .currency-box,.price-box{padding:5px;border-radius:6px}
  .currency-label,.price-label{font-size:7px}
  .currency-value{font-size:10px}
  .price-value{font-size:11px}
  .info-row{padding:3px 0}
  .info-label,.info-value{font-size:7px}
  .action-btn{font-size:8px;padding:5px 2px;border-radius:6px}
}

@media(max-width:350px){
  .offer-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
  <div class="logo-wrap">
    <div class="logo">P</div>
    <div class="header-title">P2P Social</div>
  </div>
  <div class="header-title">🟢 Buy Market</div>
</header>

<main class="container">

  <div class="search-box">
    <input
      id="usdtSearch"
      type="number"
      min="0"
      step="any"
      placeholder="Search USDT Amount"
      oninput="searchUSDTAmount()"
    >
  </div>

  <div class="section-title">
    <div>🟢 Available Sell (<span id="offerCount">0</span>)</div>
    <div class="section-actions">
      <button class="small-btn" onclick="toggleOffers()" id="viewAllBtn">View All</button>
      <button class="small-btn" onclick="loadBuyMarket()">↻</button>
    </div>
  </div>

  <section id="offers" class="offer-list">
    <div class="empty">Loading...</div>
  </section>

</main>

<div id="tradeModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Start Trade</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

      <div class="trade-preview">
        <div class="preview-box">
          <div class="preview-label">ETB</div>
          <div class="preview-value" id="tradeEtb">0 ETB</div>
        </div>

        <div class="preview-box">
          <div class="preview-label">USDT</div>
          <div class="preview-value" id="tradeUsdt">0 USDT</div>
        </div>
      </div>

      <div class="start-trade-title">Start Trade</div>

      <div class="trade-details">
        <div class="trade-detail">
          <span>Seller</span>
          <span id="tradeSeller">—</span>
        </div>

        <div class="trade-detail">
          <span>Price</span>
          <span id="tradePrice">—</span>
        </div>

        <div class="trade-detail">
          <span>Available</span>
          <span id="tradeAvailable">—</span>
        </div>

        <div class="trade-detail">
          <span>Payment</span>
          <span id="tradePayment">—</span>
        </div>

        <div class="trade-detail">
          <span>Country</span>
          <span id="tradeCountry">—</span>
        </div>

        <div class="trade-detail">
          <span>Bank</span>
          <span id="tradeBank">—</span>
        </div>
      </div>

      <button
        id="confirmTradeBtn"
        class="confirm-btn"
        onclick="submitTrade()"
      >
        Start Trade
      </button>

    </div>
  </div>
</div>

<div id="toast"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <div class="nav-icon">⌂</div>
    <div>Home</div>
  </a>

  <a class="nav-item active" href="live.html">
    <div class="nav-icon">🟢</div>
    <div>Buy</div>
  </a>

  <a class="nav-item" href="wallet.html">
    <div class="nav-icon">💰</div>
    <div>Sell</div>
  </a>

  <a class="nav-item" href="message.html">
    <div class="nav-icon">💬</div>
    <div>Messages</div>
  </a>

  <a class="nav-item" href="profile.html">
    <div class="nav-icon">👤</div>
    <div>Profile</div>
  </a>
</nav>

<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession=null;
let currentUser=null;
let currentUsername="";
let availableOffers=[];
let filteredOffers=[];
let selectedOffer=null;
let offersExpanded=false;
let realtimeChannel=null;
let tradeRealtimeChannel=null;
let toastTimer=null;
let isLoading=false;
let actionLoading=false;
let usernameCache={};

document.addEventListener("DOMContentLoaded",startApp);

async function startApp(){
  try{
    const {data,error}=await supabaseClient.auth.getSession();

    if(error) throw error;

    currentSession=data.session;
    currentUser=currentSession?.user||null;

    await loadCurrentUsername();
    await loadBuyMarket();
    setupRealtime();

    supabaseClient.auth.onAuthStateChange(async(event,session)=>{
      currentSession=session;
      currentUser=session?.user||null;

      await loadCurrentUsername();
      await loadBuyMarket();
    });

  }catch(error){
    console.error(error);
    toast(getErrorMessage(error));
    renderEmpty("Unable to load market.");
  }
}

async function loadCurrentUsername(){
  if(!currentUser){
    currentUsername="";
    return;
  }

  try{
    const {data,error}=await supabaseClient
      .from("profiles")
      .select("username")
      .eq("user_id",currentUser.id)
      .maybeSingle();

    if(error) throw error;

    currentUsername=data?.username||"";
  }catch(error){
    console.error(error);
    currentUsername="";
  }
}

async function loadBuyMarket(){
  if(isLoading)return;

  isLoading=true;

  try{
    const {data,error}=await supabaseClient
      .from("p2p_orders")
      .select("*")
      .eq("order_type","sell")
      .in("status",["active","open"])
      .gt("remaining_amount",0)
      .order("price",{ascending:true});

    if(error)throw error;

    let offers=data||[];

    if(currentUser){
      offers=offers.filter(order=>{
        const ownerId=order.user_id||order.seller_id||order.created_by;
        return !ownerId||ownerId!==currentUser.id;
      });
    }

    availableOffers=offers;

    await loadOfferUsernames();
    searchUSDTAmount();

  }catch(error){
    console.error(error);
    availableOffers=[];
    filteredOffers=[];
    renderEmpty("Could not load available sell.");
    toast(getErrorMessage(error));
  }finally{
    isLoading=false;
  }
}

async function loadOfferUsernames(){
  const ids=[...new Set(
    availableOffers
      .map(order=>order.user_id||order.seller_id||order.created_by)
      .filter(Boolean)
  )];

  const missing=ids.filter(id=>!usernameCache[id]);

  if(!missing.length)return;

  try{
    const {data,error}=await supabaseClient
      .from("profiles")
      .select("user_id,username")
      .in("user_id",missing);

    if(error)throw error;

    (data||[]).forEach(profile=>{
      usernameCache[profile.user_id]=profile.username||"User";
    });
  }catch(error){
    console.error(error);
  }
}

function getUsername(order){
  const id=order.user_id||order.seller_id||order.created_by;

  return (
    order.username||
    order.seller_username||
    (id?usernameCache[id]:"")||
    "Seller"
  );
}

function searchUSDTAmount(){
  const input=document.getElementById("usdtSearch");
  const value=parseFloat(input?.value||"");

  if(!value||value<=0){
    filteredOffers=[...availableOffers];
  }else{
    filteredOffers=availableOffers.filter(order=>{
      const amount=getOfferAvailableAmount(order);
      return amount>=value;
    });
  }

  renderBuyMarket();
}

function renderBuyMarket(){
  const container=document.getElementById("offers");
  const count=document.getElementById("offerCount");
  const viewAll=document.getElementById("viewAllBtn");

  if(!container)return;

  count.textContent=filteredOffers.length;

  if(viewAll){
    viewAll.textContent=offersExpanded?"Hide":"View All";
  }

  if(!filteredOffers.length){
    renderEmpty(
      availableOffers.length
        ?"No sell available for this amount."
        :"No available sell."
    );
    return;
  }

  const displayOffers=offersExpanded
    ?filteredOffers
    :filteredOffers.slice(0,15);

  container.innerHTML=displayOffers.map((offer,index)=>{
    return createOfferCard(offer,index+1);
  }).join("");
}

function createOfferCard(offer,index){
  const available=getOfferAvailableAmount(offer);
  const price=parseFloat(offer.price)||0;
  const etb=available*price;

  const country=getOfferCountry(offer);
  const bank=getOfferBankName(offer);
  const payment=
    offer.payment_method||
    offer.paymentMethod||
    "Bank Transfer";

  const seller=getUsername(offer);

  const id=
    offer.id||
    offer.order_id||
    offer.p_order_id||
    "";

  return `
    <article class="offer-card">

      <div class="offer-head">
        <div class="offer-number">${index}</div>

        <div class="seller" title="${escapeHtml(seller)}">
          ${escapeHtml(seller)}
        </div>

        <div class="buy-badge">SELL</div>
      </div>

      <div class="offer-body">

        <div class="currency-box">
          <div class="currency-label">USDT</div>
          <div class="currency-value">${money(available)} USDT</div>
        </div>

        <div class="currency-box">
          <div class="currency-label">ETB</div>
          <div class="currency-value">${money(etb)} ETB</div>
        </div>

        <div class="price-box">
          <div class="price-label">PRICE</div>
          <div class="price-value">${money(price)} ETB</div>
        </div>

        <div class="info-row">
          <span class="info-label">Payment</span>
          <span class="info-value">${escapeHtml(payment)}</span>
        </div>

        <div class="info-row">
          <span class="info-label">Country</span>
          <span class="info-value">${escapeHtml(country)}</span>
        </div>

        <div class="info-row">
          <span class="info-label">Bank</span>
          <span class="info-value">${escapeHtml(bank)}</span>
        </div>

      </div>

      <div class="offer-actions">

        <button
          class="action-btn profile-btn"
          onclick='viewUser(${JSON.stringify(seller)})'
        >
          View User
        </button>

        <button
          class="action-btn buy-btn"
          data-order-id="${escapeHtml(id)}"
          onclick='openTrade(${JSON.stringify(offer).replace(/'/g,"&#39;")})'
        >
          Buy
        </button>

      </div>

    </article>
  `;
}

function toggleOffers(){
  offersExpanded=!offersExpanded;
  renderBuyMarket();
}

function viewUser(username){
  if(!username)return;

  window.location.href=
    "profile.html?username="+encodeURIComponent(username);
}

function openMessagesForTrade(trade,offer,sellerUsername){
  const tradeId=
    extractId(trade,"id")||
    extractId(trade,"trade_id");

  const orderId=
    extractId(offer,"id")||
    extractId(offer,"order_id");

  const username=sellerUsername||getUsername(offer);

  const params=new URLSearchParams();

  if(tradeId)params.set("trade_id",tradeId);
  if(orderId)params.set("order_id",orderId);
  if(username)params.set("username",username);

  window.location.href=
    "message.html?"+params.toString();
}

function getOfferAvailableAmount(offer){
  return parseFloat(
    offer.remaining_amount ??
    offer.remainingAmount ??
    offer.amount ??
    offer.usdt_amount ??
    offer.quantity ??
    0
  )||0;
}

function getMinimumTradeAmount(offer){
  return parseFloat(
    offer.minimum_amount ??
    offer.min_amount ??
    offer.min_trade_amount ??
    0
  )||0;
}

function getTradeValue(offer){
  const amount=getOfferAvailableAmount(offer);
  const price=parseFloat(offer.price)||0;
  return amount*price;
}

function openTrade(offer){
  if(!currentUser){
    toast("Please login first.");
    setTimeout(()=>{
      window.location.href="index.html";
    },700);
    return;
  }

  const sellerId=offer.user_id||offer.seller_id||offer.created_by;

  if(sellerId&&sellerId===currentUser.id){
    toast("You cannot buy your own sell.");
    return;
  }

  selectedOffer=offer;

  const available=getOfferAvailableAmount(offer);
  const price=parseFloat(offer.price)||0;
  const etb=available*price;

  document.getElementById("tradeEtb").textContent=
    money(etb)+" ETB";

  document.getElementById("tradeUsdt").textContent=
    money(available)+" USDT";

  document.getElementById("tradeSeller").textContent=
    getUsername(offer);

  document.getElementById("tradePrice").textContent=
    money(price)+" ETB";

  document.getElementById("tradeAvailable").textContent=
    money(available)+" USDT";

  document.getElementById("tradePayment").textContent=
    offer.payment_method||
    offer.paymentMethod||
    "Bank Transfer";

  document.getElementById("tradeCountry").textContent=
    getOfferCountry(offer);

  document.getElementById("tradeBank").textContent=
    getOfferBankName(offer);

  document.getElementById("confirmTradeBtn").disabled=false;

  openModal();
}

async function submitTrade(){
  if(actionLoading)return;

  if(!currentUser){
    toast("Please login first.");
    return;
  }

  if(!selectedOffer){
    toast("Sell not found.");
    return;
  }

  actionLoading=true;

  const button=document.getElementById("confirmTradeBtn");
  button.disabled=true;
  button.textContent="Starting...";

  try{
    const orderId=extractId(selectedOffer,"id");

    if(!orderId){
      throw new Error("Sell ID not found.");
    }

    const {data:freshOrder,error:freshError}=await supabaseClient
      .from("p2p_orders")
      .select("*")
      .eq("id",orderId)
      .maybeSingle();

    if(freshError)throw freshError;

    if(!freshOrder){
      throw new Error("This sell is no longer available.");
    }

    const status=normalizeStatus(freshOrder.status);

    if(!["active","open"].includes(status)){
      throw new Error("This sell is no longer active.");
    }

    const available=getOfferAvailableAmount(freshOrder);
    const minimum=getMinimumTradeAmount(freshOrder);

    if(available<=0){
      throw new Error("No USDT remaining.");
    }

    const amount=available;

    if(minimum>0&&amount<minimum){
      throw new Error(
        "Minimum trade amount is "+money(minimum)+" USDT."
      );
    }

    const sellerId=
      freshOrder.user_id||
      freshOrder.seller_id||
      freshOrder.created_by;

    if(sellerId&&sellerId===currentUser.id){
      throw new Error("You cannot buy your own sell.");
    }

    const confirmed=confirm(
      "Start Trade?\n\n"+
      "USDT: "+money(amount)+"\n"+
      "ETB: "+money(amount*(parseFloat(freshOrder.price)||0))+"\n"+
      "Seller: "+getUsername(freshOrder)
    );

    if(!confirmed)return;

    const {data,error}=await supabaseClient.rpc(
      "create_p2p_trade",
      {
        p_order_id:orderId,
        p_amount:amount
      }
    );

    if(error)throw error;

    const trade=Array.isArray(data)?data[0]:data;

    closeModal();

    toast("Trade started.");

    await loadBuyMarket();

    setTimeout(()=>{
      openMessagesForTrade(
        trade,
        freshOrder,
        getUsername(freshOrder)
      );
    },500);

  }catch(error){
    console.error(error);
    toast(getErrorMessage(error));
  }finally{
    actionLoading=false;
    button.disabled=false;
    button.textContent="Start Trade";
  }
}

function getOfferCountry(order){
  return (
    order.country_name||
    order.country||
    order.payment_country||
    order.payment_country_name||
    order.quote_country||
    "Ethiopia"
  );
}

function getOfferBankName(order){
  return (
    order.bank_name||
    order.bankName||
    order.payment_bank||
    "Bank Transfer"
  );
}

function getOfferAccountName(order){
  return (
    order.account_name||
    order.accountName||
    ""
  );
}

function getOfferAccountNumber(order){
  return (
    order.account_number||
    order.accountNumber||
    ""
  );
}

function setupRealtime(){
  if(realtimeChannel){
    try{
      supabaseClient.removeChannel(realtimeChannel);
    }catch(e){}
  }

  if(tradeRealtimeChannel){
    try{
      supabaseClient.removeChannel(tradeRealtimeChannel);
    }catch(e){}
  }

  realtimeChannel=supabaseClient
    .channel("p2p-orders-market")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"p2p_orders"
      },
      ()=>{
        loadBuyMarket();
      }
    )
    .subscribe();

  tradeRealtimeChannel=supabaseClient
    .channel("p2p-trades-market")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"p2p_trades"
      },
      ()=>{
        loadBuyMarket();
      }
    )
    .subscribe();
}

function openModal(){
  document.getElementById("tradeModal").style.display="flex";
}

function closeModal(){
  document.getElementById("tradeModal").style.display="none";
  selectedOffer=null;
}

function renderEmpty(message){
  const container=document.getElementById("offers");

  if(container){
    container.innerHTML=
      `<div class="empty">${escapeHtml(message)}</div>`;
  }

  const count=document.getElementById("offerCount");

  if(count)count.textContent="0";
}

function formatPair(value){
  if(!value)return"USDT / ETB";
  return String(value).replace("_"," / ").toUpperCase();
}

function getPairParts(order){
  const pair=
    order.pair||
    order.currency_pair||
    order.market||
    "USDT/ETB";

  const parts=String(pair).split(/[\/_-]/);

  return{
    base:(parts[0]||"USDT").toUpperCase(),
    quote:(parts[1]||"ETB").toUpperCase()
  };
}

function money(value){
  const n=Number(value)||0;

  return n.toLocaleString("en-US",{
    minimumFractionDigits:0,
    maximumFractionDigits:8
  });
}

function normalizeStatus(value){
  return String(value||"")
    .trim()
    .toLowerCase();
}

function statusClass(status){
  const s=normalizeStatus(status);

  if(s==="active"||s==="open")return"active";
  if(s==="completed")return"completed";
  if(s==="cancelled"||s==="canceled")return"cancelled";

  return"";
}

function detail(value,fallback="—"){
  return value===null||
    value===undefined||
    value===""
    ?fallback
    :String(value);
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJs(value){
  return JSON.stringify(String(value??""))
    .replace(/</g,"\\u003c")
    .replace(/>/g,"\\u003e")
    .replace(/&/g,"\\u0026");
}

function extractId(value,key){
  if(!value)return"";

  if(typeof value==="string")return value;

  return value[key]||
    value.id||
    value.order_id||
    value.trade_id||
    "";
}

function getErrorMessage(error){
  return (
    error?.message||
    error?.error_description||
    error?.details||
    "Something went wrong."
  );
}

function toast(message){
  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=message;
  el.style.display="block";

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.style.display="none";
  },3000);
}

document.getElementById("tradeModal").addEventListener("click",event=>{
  if(event.target.id==="tradeModal"){
    closeModal();
  }
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    closeModal();
  }
});

setInterval(()=>{
  if(document.visibilityState==="visible"){
    loadBuyMarket();
  }
},30000);

window.addEventListener("beforeunload",()=>{
  if(realtimeChannel){
    try{
      supabaseClient.removeChannel(realtimeChannel);
    }catch(e){}
  }

  if(tradeRealtimeChannel){
    try{
      supabaseClient.removeChannel(tradeRealtimeChannel);
    }catch(e){}
  }
});
</script>
