<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live - P2P Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* HEADER */

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #111827;
      border-bottom: 1px solid #273244;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      background: white;
    }

    .live-status {
      color: #ff3b5c;
      font-weight: bold;
      font-size: 14px;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    /* VIDEO */

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(
          circle at center,
          #26334d,
          #080b12
        );
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-icon {
      font-size: 60px;
      opacity: 0.6;
    }

    .live-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #ef233c;
      padding: 7px 12px;
      border-radius: 7px;
      font-weight: bold;
      font-size: 13px;
    }

    .viewers {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.65);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 13px;
    }

    /* STREAM INFO */

    .stream-info {
      padding: 18px 3px;
    }

    .stream-info h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .host {
      color: #9ca3af;
    }

    .host span {
      color: #60a5fa;
      font-weight: bold;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .actions button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      background: #1f2937;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .actions button:hover {
      background: #374151;
    }

    .gift-btn {
      background: #2563eb !important;
    }

    /* CHAT */

    .chat {
      background: #111827;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 18px;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #273244;
      font-weight: bold;
    }

    .messages {
      height: 260px;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .username {
      color: #60a5fa;
      font-weight: bold;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #273244;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 9px;
      border: none;
      outline: none;
      background: #1f2937;
      color: white;
      font-size: 14px;
    }

    .chat-input input::placeholder {
      color: #9ca3af;
    }

    .chat-input button {
      border: none;
      padding: 0 17px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTTOM NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .bottom-nav a {
      color: #777;
      text-decoration: none;
      font-size: 11px;
      text-align: center;
      min-width: 55px;
    }

    .bottom-nav a.active {
      color: #087f73;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    /* BUTTON PRESS */

    button:active {
      transform: scale(.97);
    }

    /* MOBILE */

    @media (max-width: 450px) {

      header {
        padding: 0 12px;
      }

      .brand {
        font-size: 18px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
      }

      .live-status {
        font-size: 12px;
      }

      .container {
        padding: 12px;
      }

      .stream-info h1 {
        font-size: 19px;
      }

      .actions button {
        padding: 10px 13px;
        font-size: 13px;
      }

      .bottom-nav {
        height: 68px;
      }

      .bottom-nav a {
        font-size: 10px;
      }

      .nav-icon {
        font-size: 21px;
      }
    }

    @media (min-width: 800px) {

      .chat {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="brand">

      <!-- Built-in P2P Social logo -->
      <svg
        class="brand-logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="P2P Social Logo">

        <circle
          cx="50"
          cy="50"
          r="48"
          fill="white"/>

        <circle
          cx="50"
          cy="50"
          r="40"
          fill="#087f73"/>

        <path
          d="M30 32
             C30 25 36 20 44 20
             H57
             C69 20 76 27 76 38
             C76 49 69 55 57 55
             H43
             V68
             H30
             Z"
          fill="white"/>

        <path
          d="M43 55
             H58
             C69 55 76 61 76 72
             C76 83 69 88 57 88
             H43
             V76
             H56
             C61 76 64 74 64 71
             C64 68 61 67 56 67
             H43
             Z"
          fill="#075e54"/>

        <circle
          cx="35"
          cy="50"
          r="5"
          fill="#16a085"/>

      </svg>

      <span>P2P Social</span>

    </div>

    <div class="live-status">
      🔴 LIVE
    </div>

  </header>


  <!-- MAIN -->

  <main class="container">

    <!-- LIVE VIDEO -->

    <div class="video-box">

      <div class="live-badge">
        🔴 LIVE
      </div>

      <div
        class="viewers"
        id="viewerCount">
        👁 128 viewers
      </div>

      <div class="camera-icon">
        📹
      </div>

    </div>


    <!-- STREAM INFORMATION -->

    <section class="stream-info">

      <h1>
        P2P Social Live Stream
      </h1>

      <p class="host">
        Hosted by
        <span>@username</span>
      </p>

    </section>


    <!-- ACTION BUTTONS -->

    <div class="actions">

      <button onclick="followHost()">
        👤 Follow
      </button>

      <button onclick="shareLive()">
        🔗 Share
      </button>

      <button
        class="gift-btn"
        onclick="sendGift()">
        🎁 Send Gift
      </button>

    </div>


    <!-- LIVE CHAT -->

    <section class="chat">

      <div class="chat-header">
        💬 Live Chat
      </div>

      <div
        class="messages"
        id="messages">

        <div class="message">
          <span class="username">
            @alex
          </span>
          : Welcome to the live! 👋
        </div>

        <div class="message">
          <span class="username">
            @user123
          </span>
          : Nice stream 🔥
        </div>

        <div class="message">
          <span class="username">
            @crypto
          </span>
          : Hello everyone!
        </div>

      </div>


      <form
        class="chat-input"
        id="chatForm">

        <input
          type="text"
          id="chatMessage"
          placeholder="Write a message..."
          maxlength="200"
          autocomplete="off"
          required
        >

        <button type="submit">
          Send
        </button>

      </form>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <a href="index.html">

      <span class="nav-icon">
        🏠
      </span>

      Home

    </a>


    <a
      href="live.html"
      class="active">

      <span class="nav-icon">
        🔴
      </span>

      Live

    </a>


    <a href="wallet.html">

      <span class="nav-icon">
        🔄
      </span>

      P2P

    </a>


    <a href="message.html">

      <span class="nav-icon">
        💬
      </span>

      Messages

    </a>


    <a href="profile.html">

      <span class="nav-icon">
        👤
      </span>

      Profile

    </a>

  </nav>


  <!-- JAVASCRIPT -->

  <script>

    const chatForm =
      document.getElementById("chatForm");

    const chatMessage =
      document.getElementById("chatMessage");

    const messages =
      document.getElementById("messages");


    /* =========================
       SEND CHAT MESSAGE
    ========================= */

    chatForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const text =
          chatMessage.value.trim();

        if (!text) {
          return;
        }


        const message =
          document.createElement("div");

        message.className =
          "message";


        const username =
          document.createElement("span");

        username.className =
          "username";

        username.textContent =
          "You";


        message.appendChild(username);

        message.appendChild(
          document.createTextNode(
            ": " + text
          )
        );


        messages.appendChild(message);


        messages.scrollTop =
          messages.scrollHeight;


        chatMessage.value = "";

      }
    );


    /* =========================
       FOLLOW
    ========================= */

    function followHost() {

      alert(
        "You are now following @username!"
      );

    }


    /* =========================
       SHARE
    ========================= */

    async function shareLive() {

      if (navigator.share) {

        try {

          await navigator.share({

            title:
              "P2P Social Live",

            text:
              "Watch this live stream on P2P Social!",

            url:
              window.location.href

          });

        } catch (error) {

          console.log(error);

        }

      } else {

        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "Live link copied."
          );

        } catch (error) {

          alert(
            "Copy this page link to share the live stream."
          );

        }

      }

    }


    /* =========================
       SEND GIFT
    ========================= */

    function sendGift() {

      alert(
        "Gift system will connect to your P2P Social wallet."
      );

    }

  </script>

</body>
</html>
