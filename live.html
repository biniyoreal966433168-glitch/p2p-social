<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buy USDT • P2P Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#f4f7f8;color:#172033;min-height:100vh;padding-bottom:90px}
button,input,select,textarea{font-family:Arial,sans-serif}button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
header{height:68px;background:#fff;border-bottom:1px solid #e2e8ea;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#064e46,#10a889);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12);flex-shrink:0}
.p-left{position:absolute;left:8px;top:10px;width:13px;height:23px;border:4px solid #fff;border-right:0;border-radius:8px 0 0 8px}.p-right{position:absolute;right:8px;top:10px;width:13px;height:23px;border:4px solid #fff;border-left:0;border-radius:0 8px 8px 0}.center-dot{width:10px;height:10px;background:#fff;border-radius:50%;position:absolute}
.brand-name{font-size:19px;font-weight:800}.brand-name span{color:#087f73}.security{color:#087f73;font-size:13px;font-weight:bold}
.container{width:100%;max-width:850px;margin:auto;padding:18px}
.search-box{background:#fff;border:1px solid #dfe7e9;border-radius:13px;padding:12px;margin-top:4px}.search-box input{width:100%;border:1px solid #dfe4eb;border-radius:10px;padding:11px;outline:none;font-size:14px}.search-box input:focus{border-color:#087f73;box-shadow:0 0 0 3px rgba(8,127,115,.08)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{font-size:20px}.section-title span{color:#087f73;font-size:13px;font-weight:bold}.section-actions{display:flex;align-items:center;gap:7px}
.view-btn,.refresh-btn{border:none;background:#edf7f5;color:#087f73;padding:7px 10px;border-radius:8px;font-weight:bold}
.offer-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.offer-card{background:#fff;border:1px solid #dfe7e9;border-radius:15px;overflow:hidden;min-width:0;display:flex;flex-direction:column}.offer-main{padding:12px;display:flex;flex-direction:column;height:100%}
.offer-user-button{width:100%;border:none;background:transparent;padding:0;margin:0;text-align:left;font-weight:bold;font-size:13px;color:#172033;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.offer-user-button:hover{color:#087f73}
.offer-price{font-size:16px;font-weight:bold;color:#087f73;text-align:left;margin-top:3px}.offer-amount{margin-top:3px;font-size:15px;font-weight:bold;color:#172033}
.offer-method{margin-top:7px;color:#596579;font-size:10px;line-height:1.25}
.pending-badge{margin-top:9px;background:#fff4db;color:#9a6500;border:1px solid #efd89c;border-radius:8px;padding:7px 6px;font-size:9px;font-weight:bold;text-align:center}
.offer-trade{width:100%;margin-top:12px;padding:9px;border:none;border-radius:9px;background:#087f73;color:#fff;font-weight:bold;font-size:11px}.offer-trade.own{background:#edf0f4;color:#596579}.offer-trade.pending{background:#fff4db;color:#9a6500}
.offer-type,.profile-btn,.status,.offer-meta,.payment-info,.country-info,.bank-info,.etb-info{display:none!important}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd8da;border-radius:15px;padding:30px 18px;text-align:center;color:#7b8790}.empty-icon{font-size:34px;margin-bottom:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:100%;max-width:430px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.modal-box h3{margin-bottom:15px}
.modal-box input,.modal-box textarea{width:100%;border:1px solid #dfe4eb;border-radius:10px;padding:11px;margin-bottom:10px;outline:none;font-size:14px}.modal-box input:focus,.modal-box textarea:focus{border-color:#087f73;box-shadow:0 0 0 3px rgba(8,127,115,.08)}.modal-box input[readonly]{background:#f7fbfa;color:#172033;font-weight:bold}.modal-box textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:5px}.modal-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold}.close-btn{background:#edf0f4;color:#172033}.confirm-btn{background:#087f73;color:#fff}
.details{padding:15px 16px;border-top:1px solid #e5ebec;background:#fafcfc}.detail-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13px}.detail-row:last-child{margin-bottom:0}.detail-row span:first-child{color:#7a8790}.detail-row strong{text-align:right;overflow-wrap:anywhere}
.trade-value-card{margin-top:4px;margin-bottom:12px;background:#f7fbfa;border:1px solid #d7ebe7;border-radius:13px;padding:14px}.trade-value-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.trade-value-badge{background:#e2f5ef;color:#087f73;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:bold}.trade-value-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:13px}.trade-value-row span:first-child{color:#71808a}.trade-value-row strong{text-align:right}.trade-value-total{border-top:1px solid #dce9e7;margin-top:5px;padding-top:10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #dfe7e9;display:flex;justify-content:space-around;align-items:center;z-index:300;box-shadow:0 -4px 15px rgba(0,0,0,.05)}.bottom-nav a{color:#7b8790;text-decoration:none;text-align:center;font-size:11px;min-width:55px}.bottom-nav a.active{color:#087f73;font-weight:bold}.nav-icon{display:block;font-size:21px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:1000;display:none;max-width:90%;text-align:center}.toast.show{display:block}.toast.success{background:#087f73}.toast.error{background:#b4233f}.toast.warning{background:#9a6500}
@media(max-width:650px){.offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.offer-main{padding:9px}.offer-user-button{font-size:11px}.offer-price{font-size:13px}.offer-amount{font-size:12px}.offer-trade{font-size:9px;padding:7px 4px}}
@media(max-width:450px){.container{padding:10px}.brand-name{font-size:17px}.security{font-size:11px}.offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.offer-card{border-radius:10px}.offer-main{padding:7px}.offer-user-button{font-size:9px}.offer-price{font-size:11px}.offer-amount{font-size:10px}.offer-method{font-size:8px}.pending-badge{font-size:8px;padding:6px 3px}.offer-trade{font-size:8px;padding:6px 2px;border-radius:7px}.bottom-nav{height:70px}.section-title h2{font-size:17px}.view-btn,.refresh-btn{padding:6px 7px;font-size:11px}}
@media(max-width:350px){.offer-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<div class="brand">
<div class="brand-logo" aria-label="P2P Social logo"><div class="p-left"></div><div class="p-right"></div><div class="center-dot"></div></div>
<div class="brand-name">P2P <span>Social</span></div>
</div>
<div class="security">🟢 Buy Market</div>
</header>

<main class="container">
<div class="search-box"><input id="usdtSearch" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Search USDT Amount" oninput="searchUSDTAmount()"></div>

<div class="section-title">
<h2>Available Sell (<span id="offerCount">0</span>)</h2>
<div class="section-actions">
<button type="button" id="offerViewButton" class="view-btn" onclick="toggleOffers()">View All</button>
<button type="button" class="refresh-btn" onclick="loadBuyMarket()">Refresh</button>
</div>
</div>

<section id="offers" class="offer-list">
<div class="empty"><div class="empty-icon">🟢</div><strong>Loading available sell...</strong></div>
</section>
</main>

<div id="tradeModal" class="modal" role="dialog" aria-modal="true">
<div class="modal-box">
<h3>Buy USDT from Seller</h3>
<div id="tradeSummary"></div>
<input id="tradeAmount" type="number" min="0" step="0.01" placeholder="Available USDT" readonly>
<div class="trade-value-card">
<div class="trade-value-title"><strong>Trade Value</strong><span class="trade-value-badge">USDT</span></div>
<div class="trade-value-row"><span>USDT amount</span><strong id="tradeAmountPreview">0.000000</strong></div>
<div class="trade-value-row"><span>Trade value</span><strong id="tradeValuePreview">0.00</strong></div>
<div class="trade-value-row trade-value-total"><span>You pay</span><strong id="tradeTotalPreview">0.00</strong></div>
</div>
<div class="modal-actions">
<button type="button" class="close-btn" onclick="closeModal('tradeModal')">Cancel</button>
<button type="button" class="confirm-btn" id="tradeSubmitButton" onclick="submitTrade()">Start Trade</button>
</div>
</div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="bottom-nav">
<a href="index.html"><span class="nav-icon">🏠</span>Home</a>
<a href="live.html" class="active"><span class="nav-icon">🟢</span>Buy</a>
<a href="wallet.html"><span class="nav-icon">🔴</span>Sell</a>
<a href="message.html"><span class="nav-icon">💬</span>Messages</a>
<a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
</nav>

<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let currentSession=null,currentUser=null,currentUsername=null;
let availableOffers=[],filteredOffers=[],selectedOffer=null,pendingTrades=new Map();
let offersExpanded=false,realtimeChannel=null,tradeRealtimeChannel=null,toastTimer=null,isLoading=false,actionLoading=false;
const usernameCache=new Map();

document.addEventListener("DOMContentLoaded",startApp);

async function startApp(){
 try{
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)throw error;
  if(!data.session){showLogin();return}
  currentSession=data.session;currentUser=data.session.user;
  await loadCurrentUsername();await loadBuyMarket();setupRealtime();
 }catch(e){console.error(e);toast(getErrorMessage(e),"error")}
}

function showLogin(){alert("Please login first.");location.href="login.html"}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 currentSession=session;currentUser=session?.user||null;
 if(!currentUser)currentUsername=null;
 if(event==="SIGNED_OUT"){
  if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
  if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
  realtimeChannel=tradeRealtimeChannel=null;location.href="login.html";
 }
});

async function loadCurrentUsername(){
 if(!currentUser)return;
 try{
  const {data,error}=await supabaseClient.from("profiles").select("username").eq("id",currentUser.id).maybeSingle();
  if(error)throw error;
  currentUsername=data?.username||currentUser.user_metadata?.username||null;
  if(currentUsername)usernameCache.set(String(currentUser.id),currentUsername);
 }catch(e){currentUsername=currentUser.user_metadata?.username||null}
}

async function getUsername(userId){
 if(!userId)return"User";
 const k=String(userId);
 if(usernameCache.has(k))return usernameCache.get(k);
 try{
  const {data}=await supabaseClient.from("profiles").select("username").eq("id",userId).maybeSingle();
  if(data?.username){usernameCache.set(k,data.username);return data.username}
 }catch(e){}
 return"User";
}

async function loadOfferUsernames(){
 const ids=[...new Set(availableOffers.map(o=>o.user_id).filter(Boolean).map(String))];
 const missing=ids.filter(id=>!usernameCache.has(id));
 if(!missing.length)return;
 try{
  const {data,error}=await supabaseClient.from("profiles").select("id,username").in("id",missing);
  if(error)throw error;
  (data||[]).forEach(p=>{if(p.id&&p.username)usernameCache.set(String(p.id),p.username)})
 }catch(e){console.error("USERNAME ERROR:",e)}
}

function isFinishedTrade(t){
 return["completed","released","cancelled","expired","closed"].includes(normalizeStatus(t?.status));
}

async function loadPendingTrades(orderIds){
 pendingTrades.clear();
 if(!orderIds.length)return;
 try{
  const {data,error}=await supabaseClient
   .from("p2p_trades")
   .select("id,order_id,buyer_id,seller_id,amount,status,payment_confirmed,expires_at,created_at")
   .in("order_id",orderIds);
  if(error)throw error;
  (data||[]).forEach(t=>{
   if(t.order_id&&!isFinishedTrade(t)){
    const key=String(t.order_id),old=pendingTrades.get(key);
    if(!old||Date.parse(t.created_at||"")>Date.parse(old.created_at||""))pendingTrades.set(key,t);
   }
  });
 }catch(e){
  console.error("PENDING TRADE ERROR:",e);
 }
}

async function loadBuyMarket(){
 if(!currentUser){showLogin();return}
 if(isLoading)return;
 isLoading=true;
 const container=document.getElementById("offers");
 if(container)container.innerHTML='<div class="empty">Loading available sell...</div>';

 try{
  const {data,error}=await supabaseClient
   .from("p2p_orders")
   .select("*")
   .eq("order_type","sell")
   .in("status",["active","open"])
   .neq("user_id",currentUser.id)
   .order("created_at",{ascending:false});
  if(error)throw error;

  const orders=(data||[]).filter(o=>
   String(o.user_id)!==String(currentUser.id)&&
   ["active","open"].includes(normalizeStatus(o.status))
  );

  await loadPendingTrades(orders.map(o=>o.id));

  availableOffers=orders.filter(o=>
   getOfferAvailableAmount(o)>0||pendingTrades.has(String(o.id))
  );

  availableOffers.sort((a,b)=>{
   const pa=Number(a.price),pb=Number(b.price);
   if(Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb)return pa-pb;
   if(Number.isFinite(pa)&&!Number.isFinite(pb))return-1;
   if(!Number.isFinite(pa)&&Number.isFinite(pb))return 1;
   return(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0);
  });

  await loadOfferUsernames();
  searchUSDTAmount();
 }catch(e){
  console.error("BUY MARKET ERROR:",e);
  availableOffers=[];filteredOffers=[];
  if(container)container.innerHTML=emptyHtml("⚠️","Could not load available sell.",getErrorMessage(e));
 }finally{isLoading=false}
}

function searchUSDTAmount(){
 const input=document.getElementById("usdtSearch"),value=Number(input?.value);
 filteredOffers=input&&input.value.trim()!==""&&Number.isFinite(value)&&value>0
  ?availableOffers.filter(o=>getOfferAvailableAmount(o)>=value||pendingTrades.has(String(o.id)))
  :[...availableOffers];
 offersExpanded=false;
 const count=document.getElementById("offerCount");
 if(count)count.textContent=filteredOffers.length;
 renderBuyMarket();
}

function getPendingTrade(offer){return pendingTrades.get(String(offer?.id))}
function pendingLabel(t){
 const s=normalizeStatus(t?.status);
 if(t?.payment_confirmed||s==="paid"||s==="payment_confirmed")return"Payment Confirmed";
 if(s==="disputed")return"Trade Disputed";
 return"Pending Payment";
}

function renderBuyMarket(){
 const container=document.getElementById("offers");
 if(!container)return;

 if(!filteredOffers.length){
  const searchValue=document.getElementById("usdtSearch")?.value.trim();
  container.innerHTML=searchValue
   ?emptyHtml("🔎","No sell available for this USDT amount.","Try a smaller USDT amount.")
   :emptyHtml("🟢","No available sell.","Active sellers will appear here.");
  updateOfferButton();return;
 }

 container.innerHTML="";
 const items=offersExpanded?filteredOffers:filteredOffers.slice(0,15);

 items.forEach(offer=>{
  if(String(offer.user_id)===String(currentUser.id))return;

  const username=usernameCache.get(String(offer.user_id))||"Seller";
  const pending=getPendingTrade(offer);
  const mine=pending&&String(pending.buyer_id)===String(currentUser.id);
  const amount=getOfferAvailableAmount(offer);
  const displayAmount=amount>0?amount:Number(pending?.amount)||0;
  const card=document.createElement("div");
  card.className="offer-card";

  card.innerHTML=`
  <div class="offer-main">
   <button type="button" class="offer-user-button" onclick="viewUser('${escapeJs(offer.user_id)}')" title="View profile">👤 ${escapeHtml(username)}</button>
   <div style="margin-top:10px"><div style="color:#7b8790;font-size:10px">USDT</div><div class="offer-amount">${escapeHtml(formatAmountValue(displayAmount,offer))}</div></div>
   <div style="margin-top:8px"><div style="color:#7b8790;font-size:10px">Price</div><div class="offer-price">${money(offer.price)}</div></div>
   <div class="offer-method">Payment: ${escapeHtml(offer.payment_method||"Bank Transfer")}</div>
   ${pending?`<div class="pending-badge">⏳ ${escapeHtml(pendingLabel(pending))}</div>`:""}
   ${
    pending
    ?`<button type="button" class="offer-trade pending" onclick="${mine?`openExistingTrade('${escapeJs(pending.id)}','${escapeJs(offer.user_id)}')`:"showPendingNotice()"}">${mine?"Continue Trade":pendingLabel(pending)}</button>`
    :`<button type="button" class="offer-trade" onclick="openTrade('${escapeJs(offer.id)}')">Buy</button>`
   }
  </div>`;
  container.appendChild(card);
 });
 updateOfferButton();
}

function formatAmountValue(amount,offer){
 const parts=getPairParts(offer?.pair||offer?.trading_pair||"");
 return Number(amount||0).toLocaleString(undefined,{maximumFractionDigits:6})+" "+(parts.base||"USDT");
}

function showPendingNotice(){
 toast("Pending Payment: this sell offer already has an active trade.","warning");
}

function openExistingTrade(tradeId,sellerId){
 if(!tradeId)return;
 const params=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});
 getUsername(sellerId).then(username=>{
  if(username)params.set("username",username);
  location.href="message.html?"+params.toString();
 });
}

function getPairSortKey(offer){
 return String(offer?.pair||offer?.trading_pair||"").trim().toUpperCase()||"USDT_ETB";
}

function viewUser(userId){
 if(userId)location.href="profile.html?user_id="+encodeURIComponent(userId);
}

async function openMessagesForTrade(tradeId,offer){
 if(!tradeId||!offer?.user_id){toast("Trade started, but seller information is missing.","error");return}
 if(!currentUser){showLogin();return}

 try{
  const sellerId=offer.user_id;
  let {data:conversation,error}=await supabaseClient.from("conversations").select("id").eq("user_one",currentUser.id).eq("user_two",sellerId).maybeSingle();
  if(error)throw error;

  if(!conversation){
   const r=await supabaseClient.from("conversations").select("id").eq("user_one",sellerId).eq("user_two",currentUser.id).maybeSingle();
   if(r.error)throw r.error;conversation=r.data;
  }

  if(!conversation){
   const r=await supabaseClient.from("conversations").insert({user_one:currentUser.id,user_two:sellerId}).select("id").single();
   if(r.error){
    const retry=await supabaseClient.from("conversations").select("id").eq("user_one",sellerId).eq("user_two",currentUser.id).maybeSingle();
    if(retry.error)throw r.error;conversation=retry.data;
   }else conversation=r.data;
  }

  if(!conversation?.id)throw new Error("Conversation could not be created.");

  const content="🟢 P2P Buy started. Please complete the payment for this trade.";
  const {data:existing,error:ee}=await supabaseClient.from("messages").select("id").eq("conversation_id",conversation.id).eq("sender_id",currentUser.id).eq("message_type","order").eq("order_id",tradeId).maybeSingle();
  if(ee)throw ee;

  if(!existing){
   const {error:me}=await supabaseClient.from("messages").insert({
    conversation_id:conversation.id,sender_id:currentUser.id,content,message_type:"order",order_id:tradeId
   });
   if(me)throw me;
  }

  const username=await getUsername(sellerId);
  const params=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});
  if(username)params.set("username",username);
  location.href="message.html?"+params.toString();
 }catch(e){
  console.error("P2P MESSAGE ERROR:",e);
  toast("Trade started, but the P2P trade message could not be created: "+getErrorMessage(e),"error");
 }
}

function updateOfferButton(){
 const b=document.getElementById("offerViewButton");
 if(!b)return;
 if(filteredOffers.length<=15){b.style.display=filteredOffers.length?"none":"block";b.textContent="View All";return}
 b.style.display="block";b.textContent=offersExpanded?"Show 15":"View All";
}

function toggleOffers(){offersExpanded=!offersExpanded;renderBuyMarket()}

function openTrade(offerId){
 selectedOffer=availableOffers.find(o=>String(o.id)===String(offerId));
 if(!selectedOffer){toast("This available sell is no longer available. Refresh.","warning");return}
 if(String(selectedOffer.user_id)===String(currentUser.id)){toast("You cannot buy your own sell offer.","warning");return}

 const pending=getPendingTrade(selectedOffer);
 if(pending){
  if(String(pending.buyer_id)===String(currentUser.id))openExistingTrade(pending.id,selectedOffer.user_id);
  else showPendingNotice();
  return;
 }

 if(!["active","open"].includes(normalizeStatus(selectedOffer.status))){toast("This available sell is no longer available. Refresh.","warning");return}
 const available=getOfferAvailableAmount(selectedOffer);
 if(available<=0){toast("This available sell has no remaining amount.","warning");return}

 const input=document.getElementById("tradeAmount");
 input.value=available.toFixed(2);input.min="1";input.max=available.toFixed(2);

 const parts=getPairParts(selectedOffer.pair||selectedOffer.trading_pair);
 const username=usernameCache.get(String(selectedOffer.user_id))||"Seller";
 document.getElementById("tradeSummary").innerHTML=`
 <div class="details" style="margin-bottom:12px">
 ${detail("Seller",username)}
 ${detail("Pair",formatPair(selectedOffer))}
 ${detail("Selling price",money(selectedOffer.price)+" "+(parts.quote||"ETB"))}
 ${detail("Payment",selectedOffer.payment_method||"Bank Transfer")}
 ${detail("Available",formatAmount(selectedOffer))}
 </div>`;
 updateTradeValuePreview();openModal("tradeModal");
}

function getOfferAvailableAmount(offer){
 if(!offer)return 0;
 for(const value of [offer.remaining_amount,offer.available_amount,offer.remaining]){
  if(value!==null&&value!==undefined&&value!==""){
   const n=Number(value);if(Number.isFinite(n)&&n>=0)return n;
  }
 }
 const n=Number(offer.amount);return Number.isFinite(n)&&n>=0?n:0;
}

function getMinimumTradeAmount(offer){
 if(!offer)return 1;
 for(const value of [offer.min_trade_amount,offer.minimum_amount,offer.min_amount]){
  const n=Number(value);if(Number.isFinite(n)&&n>0)return n;
 }
 return 1;
}

function getTradeValue(){
 if(!selectedOffer)return 0;
 return(Number(document.getElementById("tradeAmount")?.value)||0)*(Number(selectedOffer.price)||0);
}

function updateTradeValuePreview(){
 const amount=Number(document.getElementById("tradeAmount")?.value)||0,value=getTradeValue(),currency=getPairParts(selectedOffer?.pair||selectedOffer?.trading_pair).quote||"ETB";
 const a=document.getElementById("tradeAmountPreview"),v=document.getElementById("tradeValuePreview"),t=document.getElementById("tradeTotalPreview");
 if(a)a.textContent=Number.isFinite(amount)?amount.toLocaleString(undefined,{minimumFractionDigits:6,maximumFractionDigits:6}):"0.000000";
 if(v)v.textContent=money(value)+" "+currency;if(t)t.textContent=money(value)+" "+currency;
}

async function submitTrade(){
 if(actionLoading)return;
 if(!currentUser){showLogin();return}
 if(!selectedOffer){toast("Select an available sell first.","warning");return}
 if(String(selectedOffer.user_id)===String(currentUser.id)){toast("You cannot trade with your own offer.","warning");closeModal("tradeModal");return}

 try{
  const {data,error}=await supabaseClient.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();
  if(error)throw error;
  if(!data){toast("This available sell is no longer available.","warning");closeModal("tradeModal");await loadBuyMarket();return}
  selectedOffer=data;

  const existing=await getCurrentPendingTrade(selectedOffer.id);
  if(existing){
   pendingTrades.set(String(selectedOffer.id),existing);
   closeModal("tradeModal");
   if(String(existing.buyer_id)===String(currentUser.id))openExistingTrade(existing.id,selectedOffer.user_id);
   else showPendingNotice();
   await loadBuyMarket();return;
  }
 }catch(e){toast(getErrorMessage(e),"error");return}

 if(String(selectedOffer.order_type).toLowerCase()!=="sell"){toast("This is not a sell market entry.","warning");return}
 if(String(selectedOffer.user_id)===String(currentUser.id)){toast("You cannot trade with your own entry.","warning");return}

 const status=normalizeStatus(selectedOffer.status);
 if(!["active","open"].includes(status)){toast("This available sell is no longer active.","warning");closeModal("tradeModal");await loadBuyMarket();return}

 const available=getOfferAvailableAmount(selectedOffer);
 if(!Number.isFinite(available)||available<=0){toast("This available sell has no remaining amount.","warning");closeModal("tradeModal");await loadBuyMarket();return}

 const amount=Number(document.getElementById("tradeAmount").value);
 if(!Number.isFinite(amount)||amount<=0){toast("Invalid available amount.","warning");return}

 const minimumTrade=getMinimumTradeAmount(selectedOffer);
 if(amount<minimumTrade){toast("Trade amount must be at least "+minimumTrade+" USDT.","warning");return}

 const normalizedAmount=Number(available.toFixed(2));
 if(!Number.isFinite(normalizedAmount)||normalizedAmount<=0){toast("Invalid available amount.","warning");return}

 if(Math.abs(amount-normalizedAmount)>0.000001){
  toast("You must buy the full available amount.","warning");
  document.getElementById("tradeAmount").value=normalizedAmount.toFixed(2);updateTradeValuePreview();return;
 }

 if(available>0&&Math.abs(amount-available)>0.01){toast("You must buy the full available amount.","warning");return}
 if(!confirm("Buy the full available amount of USDT from the seller?"))return;

 const button=document.getElementById("tradeSubmitButton");
 actionLoading=true;button.disabled=true;button.textContent="Starting...";

 try{
  const {data,error}=await supabaseClient.rpc("create_p2p_trade",{p_order_id:selectedOffer.id,p_amount:amount});
  if(error)throw error;

  const tradeId=extractId(data);
  if(!tradeId)throw new Error("Trade started, but the trade ID was not returned.");

  const tradeOffer=selectedOffer;
  closeModal("tradeModal");toast("Buy trade started successfully.","success");selectedOffer=null;
  await loadBuyMarket();await openMessagesForTrade(tradeId,tradeOffer);
 }catch(e){toast(getErrorMessage(e),"error")}
 finally{actionLoading=false;button.disabled=false;button.textContent="Start Trade"}
}

async function getCurrentPendingTrade(orderId){
 try{
  const {data,error}=await supabaseClient.from("p2p_trades").select("id,order_id,buyer_id,seller_id,amount,status,payment_confirmed,expires_at,created_at").eq("order_id",orderId);
  if(error)throw error;
  const active=(data||[]).filter(t=>!isFinishedTrade(t)).sort((a,b)=>(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0));
  return active[0]||null;
 }catch(e){
  console.error("TRADE CHECK ERROR:",e);
  return null;
 }
}

function extractId(data){
 if(data==null)return null;
 if(typeof data==="string"||typeof data==="number")return data;
 if(typeof data==="object")return data.id||data.trade_id||data.order_id||data[0]?.id||data[0]?.trade_id||data[0]?.order_id||null;
 return null;
}

function setupRealtime(){
 if(!currentUser)return;
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel("buy-market-live-"+currentUser.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},loadBuyMarket)
 .subscribe(s=>console.log("Buy market realtime:",s));

 if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
 tradeRealtimeChannel=supabaseClient.channel("buy-trades-live-"+currentUser.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},loadBuyMarket)
 .subscribe(s=>console.log("Buy trades realtime:",s));
}

function openModal(id){const e=document.getElementById(id);if(!e)return;e.classList.add("show");setTimeout(()=>{const i=e.querySelector("input,textarea");if(i)i.focus()},50)}
function closeModal(id){const e=document.getElementById(id);if(e)e.classList.remove("show")}

function formatPair(offer){
 const pair=String(offer?.pair||offer?.trading_pair||"");
 if(pair.includes("_"))return pair.replace("_"," / ");
 if(pair.includes("/"))return pair;
 return pair||"P2P";
}

function formatAmount(offer){return formatAmountValue(getOfferAvailableAmount(offer),offer)}

function getPairParts(pair){
 const parts=String(pair||"").trim().toUpperCase().replace("/","_").split("_");
 return{base:parts[0]||"USDT",quote:parts[1]||"ETB"};
}

function money(value){
 const n=Number(value);
 return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00";
}

function normalizeStatus(status){return String(status||"").trim().toLowerCase()}

function detail(label,value){
 return`<div class="detail-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(value??""))}</strong></div>`;
}

function emptyHtml(icon,title,message){
 return`<div class="empty"><div class="empty-icon">${escapeHtml(icon||"ℹ️")}</div><strong>${escapeHtml(title||"")}</strong>${message?`<div style="margin-top:7px">${escapeHtml(message)}</div>`:""}</div>`;
}

function escapeHtml(value){
 return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function escapeJs(value){
 return String(value??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n");
}

function getErrorMessage(error){
 return error?.message||error?.details||error?.hint||"Something went wrong.";
}

function toast(message,type="normal"){
 const e=document.getElementById("toast");if(!e)return;
 clearTimeout(toastTimer);e.textContent=String(message||"");e.classList.remove("success","error","warning");
 if(["success","error","warning"].includes(type))e.classList.add(type);
 e.classList.add("show");toastTimer=setTimeout(()=>e.classList.remove("show"),3500);
}

document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(m=>m.classList.remove("show"))});

setInterval(async()=>{
 if(currentUser&&document.visibilityState==="visible"){
  try{await loadBuyMarket()}catch(e){console.error("AUTO REFRESH ERROR:",e)}
 }
},30000);

window.addEventListener("beforeunload",()=>{
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
});
</script>
</body>
</html>
