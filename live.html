<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live • P2P Social</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

/* ================================
   HEADER
================================ */

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:16px 18px;
  border-radius:0 0 22px 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

/* BUILT-IN LOGO */

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  flex-shrink:0;
}

.brand{
  font-size:21px;
  font-weight:bold;
  white-space:nowrap;
}

.live-status{
  background:#e74c3c;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold;
}

/* ================================
   MAIN
================================ */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px;
}

/* ================================
   LIVE VIDEO CARD
================================ */

.video-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.video-box{
  width:100%;
  aspect-ratio:16 / 9;
  background:
    radial-gradient(
      circle at center,
      #dff3ee,
      #b9ddd6
    );
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.camera-icon{
  font-size:65px;
  opacity:.65;
}

.live-badge{
  position:absolute;
  top:14px;
  left:14px;
  background:#e74c3c;
  color:white;
  padding:7px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.viewers{
  position:absolute;
  top:14px;
  right:14px;
  background:rgba(0,0,0,.6);
  color:white;
  padding:7px 11px;
  border-radius:8px;
  font-size:12px;
}

/* ================================
   STREAM INFO
================================ */

.stream-info{
  padding:18px;
}

.stream-info h1{
  font-size:21px;
  color:#172033;
  margin-bottom:8px;
}

.host{
  color:#777;
  font-size:13px;
}

.host span{
  color:#087f73;
  font-weight:bold;
}

/* ================================
   ACTION BUTTONS
================================ */

.actions{
  display:flex;
  gap:10px;
  padding:0 18px 18px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:100px;
  border:none;
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.follow-btn{
  background:#eaf7f4;
  color:#087f73;
}

.share-btn{
  background:#f0f2f5;
  color:#172033;
}

.gift-btn{
  background:#087f73;
  color:white;
}

.actions button:active{
  transform:scale(.97);
}

/* ================================
   LIVE CHAT
================================ */

.chat{
  background:white;
  border-radius:18px;
  overflow:hidden;
  margin-top:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.chat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 16px;
  border-bottom:1px solid #edf0f4;
  color:#172033;
  font-weight:bold;
}

.live-dot{
  color:#16a085;
  font-size:12px;
}

.messages{
  height:280px;
  overflow-y:auto;
  padding:15px;
}

.message{
  margin-bottom:13px;
  line-height:1.5;
  font-size:14px;
  word-break:break-word;
}

.username{
  color:#087f73;
  font-weight:bold;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #edf0f4;
}

.chat-input input{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid #dfe4eb;
  border-radius:10px;
  outline:none;
  background:#f8f9fb;
  color:#172033;
  font-size:14px;
}

.chat-input input:focus{
  border-color:#087f73;
}

.chat-input button{
  border:none;
  padding:0 17px;
  border-radius:10px;
  background:#087f73;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
  text-decoration:none;
  min-width:55px;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

/* ================================
   MOBILE
================================ */

@media(max-width:450px){

  header{
    padding:15px 12px;
  }

  .logo{
    width:43px;
    height:43px;
  }

  .brand{
    font-size:19px;
  }

  .live-status{
    font-size:10px;
    padding:7px 8px;
  }

  .container{
    padding:12px;
  }

  .stream-info{
    padding:15px;
  }

  .stream-info h1{
    font-size:19px;
  }

  .actions{
    padding:0 15px 15px;
  }

  .actions button{
    min-width:90px;
    padding:11px 8px;
    font-size:12px;
  }

  .messages{
    height:250px;
  }

  .bottom-nav{
    height:68px;
  }

  .nav-item{
    font-size:10px;
  }

  .nav-item span{
    font-size:21px;
  }
}

</style>
</head>

<body>


<!-- ================================
     HEADER
================================ -->

<header>

  <div class="top">

    <div class="logo-area">

      <!-- SAME P2P SOCIAL BUILT-IN LOGO -->

      <svg
        class="logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">

        <circle
          cx="50"
          cy="50"
          r="48"
          fill="white"/>

        <circle
          cx="50"
          cy="50"
          r="40"
          fill="#087f73"/>

        <path
          d="M30 32
             C30 25 36 20 44 20
             H57
             C69 20 76 27 76 38
             C76 49 69 55 57 55
             H43
             V68
             H30
             Z"
          fill="white"/>

        <path
          d="M43 55
             H58
             C69 55 76 61 76 72
             C76 83 69 88 57 88
             H43
             V76
             H56
             C61 76 64 74 64 71
             C64 68 61 67 56 67
             H43
             Z"
          fill="#075e54"/>

        <circle
          cx="35"
          cy="50"
          r="5"
          fill="#16a085"/>

      </svg>

      <div class="brand">
        P2P Social
      </div>

    </div>

    <div class="live-status">
      🔴 LIVE
    </div>

  </div>

</header>


<!-- ================================
     MAIN
================================ -->

<main class="container">


  <!-- LIVE VIDEO -->

  <div class="video-card">

    <div class="video-box">

      <div class="live-badge">
        🔴 LIVE
      </div>

      <div
        class="viewers"
        id="viewerCount">
        👁 128 viewers
      </div>

      <div class="camera-icon">
        📹
      </div>

    </div>


    <!-- STREAM INFORMATION -->

    <section class="stream-info">

      <h1>
        P2P Social Live Stream
      </h1>

      <p class="host">

        Hosted by

        <span>
          @username
        </span>

      </p>

    </section>


    <!-- ACTIONS -->

    <div class="actions">

      <button
        class="follow-btn"
        onclick="followHost()">

        👤 Follow

      </button>


      <button
        class="share-btn"
        onclick="shareLive()">

        🔗 Share

      </button>


      <button
        class="gift-btn"
        onclick="sendGift()">

        🎁 Send Gift

      </button>

    </div>

  </div>


  <!-- ================================
       LIVE CHAT
  ================================= -->

  <section class="chat">

    <div class="chat-header">

      <span>
        💬 Live Chat
      </span>

      <span class="live-dot">
        ● Online
      </span>

    </div>


    <div
      class="messages"
      id="messages">

      <div class="message">

        <span class="username">
          @alex
        </span>

        : Welcome to the live! 👋

      </div>


      <div class="message">

        <span class="username">
          @user123
        </span>

        : Nice stream 🔥

      </div>


      <div class="message">

        <span class="username">
          @crypto
        </span>

        : Hello everyone!

      </div>

    </div>


    <form
      class="chat-input"
      id="chatForm">

      <input
        type="text"
        id="chatMessage"
        placeholder="Write a message..."
        maxlength="200"
        autocomplete="off"
        required>

      <button type="submit">
        Send
      </button>

    </form>

  </section>


</main>


<!-- ================================
     BOTTOM NAVIGATION
================================ -->

<nav class="bottom-nav">


  <a
    href="index.html"
    class="nav-item">

    <span>
      🏠
    </span>

    Home

  </a>


  <a
    href="live.html"
    class="nav-item active">

    <span>
      🔴
    </span>

    Live

  </a>


  <a
    href="wallet.html"
    class="nav-item">

    <span>
      🔄
    </span>

    P2P

  </a>


  <a
    href="message.html"
    class="nav-item">

    <span>
      💬
    </span>

    Messages

  </a>


  <a
    href="profile.html"
    class="nav-item">

    <span>
      👤
    </span>

    Profile

  </a>


</nav>


<!-- ================================
     JAVASCRIPT
================================ -->

<script>


/* ================================
   CHAT
================================ */

const chatForm =
  document.getElementById("chatForm");

const chatMessage =
  document.getElementById("chatMessage");

const messages =
  document.getElementById("messages");


chatForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const text =
      chatMessage.value.trim();

    if(!text){
      return;
    }


    const message =
      document.createElement("div");

    message.className =
      "message";


    const username =
      document.createElement("span");

    username.className =
      "username";

    username.textContent =
      "You";


    message.appendChild(username);

    message.appendChild(
      document.createTextNode(
        ": " + text
      )
    );


    messages.appendChild(message);


    messages.scrollTop =
      messages.scrollHeight;


    chatMessage.value = "";

  }
);


/* ================================
   FOLLOW
================================ */

function followHost(){

  alert(
    "You are now following @username!"
  );

}


/* ================================
   SHARE
================================ */

async function shareLive(){

  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Live",

        text:
          "Watch this live stream on P2P Social!",

        url:
          window.location.href

      });

    }catch(error){

      console.log(error);

    }

    return;
  }


  try{

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "Live link copied."
    );

  }catch(error){

    alert(
      "Copy this page link to share the live stream."
    );

  }

}


/* ================================
   GIFT
================================ */

function sendGift(){

  alert(
    "Gift system will connect to your P2P Social wallet."
  );

}


/* ================================
   DEMO VIEWER COUNT
================================ */

let viewers = 128;

setInterval(function(){

  const change =
    Math.floor(Math.random()*5)-2;

  viewers += change;

  if(viewers < 1){
    viewers = 1;
  }


  document.getElementById(
    "viewerCount"
  ).textContent =
    "👁 " +
    viewers +
    " viewers";

},5000);


</script>

</body>
</html>
