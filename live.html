async function submitTrade(){if(actionLoading||!selectedOffer||!currentUser)return;if(String(selectedOffer.user_id)===String(currentUser.id))return;const b=document.getElementById("tradeSubmitButton"),a=Number(document.getElementById("tradeAmount").value),available=getOfferAvailableAmount(selectedOffer);if(!Number.isFinite(a)||a<=0){toast("Invalid amount.","warning");return}if(a>available){toast("Amount exceeds available amount.","warning");return}if(Math.abs(a-available)>0.01){toast("You must buy the full available amount.","warning");document.getElementById("tradeAmount").value=available.toFixed(2);updateTradeValuePreview();return}if(!confirm("Buy the full available amount of "+currency()+" from the seller?"))return;actionLoading=true;b.disabled=true;b.textContent="Starting...";try{const{data:latest,error:oe}=await supabaseClient.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();if(oe)throw oe;if(!latest||!["active","open"].includes(normalizeStatus(latest.status))||getOfferAvailableAmount(latest)<a)throw new Error("This sell is no longer available.");const{data,error}=await supabaseClient.rpc("create_p2p_trade",{p_order_id:selectedOffer.id,p_amount:a});if(error)throw error;const tradeId=extractId(data);if(!tradeId)throw new Error("Trade started, but the trade ID was not returned.");const offer=selectedOffer;closeModal("tradeModal");toast("Buy trade started successfully.","success");selectedOffer=null;await loadBuyMarket();await openMessagesForTrade(tradeId,offer)}catch(e){toast(getErrorMessage(e),"error")}finally{actionLoading=false;b.disabled=false;b.textContent="Start Trade"}}
function extractId(d){if(d==null)return null;if(typeof d==="string"||typeof d==="number")return d;if(typeof d==="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id||null;return null}
function formatPair(o){const p=String(o?.pair||"");return p.includes("_")?p.replace("_"," / "):p||"P2P"}function formatAmount(o){return formatAmountValue(getOfferAvailableAmount(o),o)}function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00"}function detail(l,v){return`<div class="detail-row"><span>${escapeHtml(l)}</span><strong>${escapeHtml(String(v??""))}</strong></div>`}function emptyHtml(i,t,m){return`<div class="empty"><div class="empty-icon">${escapeHtml(i)}</div><strong>${escapeHtml(t)}</strong>${m?`<div style="margin-top:7px">${escapeHtml(m)}</div>`:""}</div>`}function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}function getErrorMessage(e){return e?.message||e?.details||e?.hint||"Something went wrong."}function openModal(id){const e=document.getElementById(id);if(e)e.classList.add("show")}function closeModal(id){const e=document.getElementById(id);if(e)e.classList.remove("show")}
function toast(m,t="normal"){const e=document.getElementById("toast");if(!e)return;clearTimeout(toastTimer);e.textContent=String(m||"");e.classList.remove("success","error","warning");if(["success","error","warning"].includes(t))e.classList.add(t);e.classList.add("show");toastTimer=setTimeout(()=>e.classList.remove("show"),3500)}
function setupRealtime(){if(!currentUser)return;if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);realtimeChannel=supabaseClient.channel("buy-market-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},loadBuyMarket).subscribe();if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);tradeRealtimeChannel=supabaseClient.channel("buy-trades-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},loadBuyMarket).subscribe()}
document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(m=>m.classList.remove("show"))});setInterval(()=>{if(currentUser&&document.visibilityState==="visible")loadBuyMarket()},30000);window.addEventListener("beforeunload",()=>{if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel)});
</script></body></html>
