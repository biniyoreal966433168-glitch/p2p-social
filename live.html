<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buy USDT • P2P Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#f4f7f8;color:#172033;min-height:100vh;padding-bottom:90px}
button,input,select,textarea{font-family:Arial,sans-serif}
button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
header{height:68px;background:#fff;border-bottom:1px solid #e2e8ea;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#064e46,#10a889);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12);flex-shrink:0}
.p-left{position:absolute;left:8px;top:10px;width:13px;height:23px;border:4px solid #fff;border-right:0;border-radius:8px 0 0 8px}.p-right{position:absolute;right:8px;top:10px;width:13px;height:23px;border:4px solid #fff;border-left:0;border-radius:0 8px 8px 0}.center-dot{width:10px;height:10px;background:#fff;border-radius:50%;position:absolute}
.brand-name{font-size:19px;font-weight:800}.brand-name span{color:#087f73}.security{color:#087f73;font-size:13px;font-weight:bold}
.container{width:100%;max-width:850px;margin:auto;padding:18px}
.search-box{background:#fff;border:1px solid #dfe7e9;border-radius:13px;padding:12px;margin-top:4px}.search-box input{width:100%;border:1px solid #dfe4eb;border-radius:10px;padding:11px;outline:none;font-size:14px}.search-box input:focus{border-color:#087f73;box-shadow:0 0 0 3px rgba(8,127,115,.08)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{font-size:20px}.section-actions{display:flex;align-items:center;gap:7px}.view-btn,.refresh-btn{border:none;background:#edf7f5;color:#087f73;padding:7px 10px;border-radius:8px;font-weight:bold}
.offer-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.offer-card{background:#fff;border:1px solid #dfe7e9;border-radius:15px;overflow:hidden;min-width:0;display:flex;flex-direction:column}.offer-main{padding:12px;display:flex;flex-direction:column;height:100%}
.offer-user-button{width:100%;border:none;background:transparent;padding:0;text-align:left;font-weight:bold;font-size:13px;color:#172033;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.offer-user-button:hover{color:#087f73}
.offer-price{font-size:16px;font-weight:bold;color:#087f73;text-align:left;margin-top:3px}.offer-amount{margin-top:3px;font-size:15px;font-weight:bold;color:#172033}
.offer-trade{width:100%;margin-top:12px;padding:9px;border:none;border-radius:9px;background:#087f73;color:#fff;font-weight:bold;font-size:11px}.offer-trade.own{background:#edf0f4;color:#596579}.offer-trade.pending{background:#fff4d6;color:#9a6500}
.pending-notice{margin-top:9px;padding:8px;border-radius:8px;background:#fff4d6;color:#9a6500;font-size:10px;font-weight:bold;text-align:center}
.offer-type,.profile-btn,.status,.offer-meta,.payment-info,.country-info,.bank-info,.etb-info{display:none!important}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd8da;border-radius:15px;padding:30px 18px;text-align:center;color:#7b8790}.empty-icon{font-size:34px;margin-bottom:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:100%;max-width:430px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.modal-box h3{margin-bottom:15px}
.modal-box input,.modal-box textarea{width:100%;border:1px solid #dfe4eb;border-radius:10px;padding:11px;margin-bottom:10px;outline:none;font-size:14px}.modal-box input:focus,.modal-box textarea:focus{border-color:#087f73;box-shadow:0 0 0 3px rgba(8,127,115,.08)}.modal-box input[readonly]{background:#f7fbfa;color:#172033;font-weight:bold}.modal-box textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:5px}.modal-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold}.close-btn{background:#edf0f4;color:#172033}.confirm-btn{background:#087f73;color:#fff}
.details{padding:15px 16px;border-top:1px solid #e5ebec;background:#fafcfc}.detail-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13px}.detail-row:last-child{margin-bottom:0}.detail-row span:first-child{color:#7a8790}.detail-row strong{text-align:right;overflow-wrap:anywhere}
.trade-value-card{margin-top:4px;margin-bottom:12px;background:#f7fbfa;border:1px solid #d7ebe7;border-radius:13px;padding:14px}.trade-value-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.trade-value-badge{background:#e2f5ef;color:#087f73;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:bold}.trade-value-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:13px}.trade-value-row span:first-child{color:#71808a}.trade-value-row strong{text-align:right}.trade-value-total{border-top:1px solid #dce9e7;margin-top:5px;padding-top:10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #dfe7e9;display:flex;justify-content:space-around;align-items:center;z-index:300;box-shadow:0 -4px 15px rgba(0,0,0,.05)}.bottom-nav a{color:#7b8790;text-decoration:none;text-align:center;font-size:11px;min-width:55px}.bottom-nav a.active{color:#087f73;font-weight:bold}.nav-icon{display:block;font-size:21px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:1000;display:none;max-width:90%;text-align:center}.toast.show{display:block}.toast.success{background:#087f73}.toast.error{background:#b4233f}.toast.warning{background:#9a6500}
@media(max-width:650px){.offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.offer-main{padding:9px}.offer-user-button{font-size:11px}.offer-price{font-size:13px}.offer-amount{font-size:12px}.offer-trade{font-size:9px;padding:7px 4px}}
@media(max-width:450px){.container{padding:10px}.brand-name{font-size:17px}.security{font-size:11px}.offer-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.offer-card{border-radius:10px}.offer-main{padding:7px}.offer-user-button{font-size:9px}.offer-price{font-size:11px}.offer-amount{font-size:10px}.offer-trade{font-size:8px;padding:6px 2px;border-radius:7px}.bottom-nav{height:70px}.section-title h2{font-size:17px}.view-btn,.refresh-btn{padding:6px 7px;font-size:11px}}
@media(max-width:350px){.offer-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<div class="brand">
<div class="brand-logo" aria-label="P2P Social logo"><div class="p-left"></div><div class="p-right"></div><div class="center-dot"></div></div>
<div class="brand-name">P2P <span>Social</span></div>
</div>
<div class="security">🟢 Buy Market</div>
</header>

<main class="container">
<div class="search-box">
<input id="usdtSearch" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Search USDT Amount" oninput="searchUSDTAmount()">
</div>

<div class="section-title">
<h2>🟢 (<span id="offerCount">0</span>)</h2>
<div class="section-actions">
<button type="button" id="offerViewButton" class="view-btn" onclick="toggleOffers()">View All</button>
<button type="button" class="refresh-btn" onclick="loadBuyMarket()">Refresh</button>
</div>
</div>

<section id="offers" class="offer-list">
<div class="empty"><div class="empty-icon">🟢</div><strong>Loading available sell...</strong></div>
</section>
</main>

<div id="tradeModal" class="modal" role="dialog" aria-modal="true">
<div class="modal-box">
<h3>Buy USDT from Seller</h3>
<div id="tradeSummary"></div>
<input id="tradeAmount" type="number" min="0" step="0.01" placeholder="Available USDT" readonly>

<div class="trade-value-card">
<div class="trade-value-title"><strong>Trade Value</strong><span class="trade-value-badge">USDT</span></div>
<div class="trade-value-row"><span>USDT amount</span><strong id="tradeAmountPreview">0.000000</strong></div>
<div class="trade-value-row"><span>Trade value</span><strong id="tradeValuePreview">0.00</strong></div>
<div class="trade-value-row trade-value-total"><span>You pay</span><strong id="tradeTotalPreview">0.00</strong></div>
</div>

<div class="modal-actions">
<button type="button" class="close-btn" onclick="closeModal('tradeModal')">Cancel</button>
<button type="button" class="confirm-btn" id="tradeSubmitButton" onclick="submitTrade()">Start Trade</button>
</div>
</div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="bottom-nav">
<a href="index.html"><span class="nav-icon">🏠</span>Home</a>
<a href="live.html" class="active"><span class="nav-icon">🟢</span>Buy</a>
<a href="wallet.html"><span class="nav-icon">🔴</span>Sell</a>
<a href="message.html"><span class="nav-icon">💬</span>Messages</a>
<a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
</nav>

<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let currentSession=null,currentUser=null,currentUsername=null;
let availableOffers=[],filteredOffers=[],selectedOffer=null;
let pendingTrades=new Map(),offersExpanded=false;
let realtimeChannel=null,tradeRealtimeChannel=null,toastTimer=null;
let isLoading=false,actionLoading=false;
const usernameCache=new Map();

document.addEventListener("DOMContentLoaded",startApp);

async function startApp(){
 try{
  const {data,error}=await supabaseClient.auth.getSession();
  if(error)throw error;
  currentSession=data.session;
  if(!currentSession)return showLogin();
  currentUser=currentSession.user;
  await loadCurrentUsername();
  await loadBuyMarket();
  setupRealtime();
 }catch(e){console.error("START ERROR:",e);toast(getErrorMessage(e),"error")}
}

function showLogin(){alert("Please login first.");window.location.href="login.html"}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 currentSession=session;currentUser=session?.user||null;
 if(!currentUser)currentUsername=null;
 if(event==="SIGNED_OUT"){
  if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
  if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
  realtimeChannel=null;tradeRealtimeChannel=null;
  window.location.href="login.html";
 }
});

async function loadCurrentUsername(){
 if(!currentUser)return;
 try{
  const {data,error}=await supabaseClient.from("profiles").select("username").eq("id",currentUser.id).maybeSingle();
  if(error)throw error;
  currentUsername=data?.username||currentUser.user_metadata?.username||null;
  if(currentUsername)usernameCache.set(String(currentUser.id),currentUsername);
 }catch(e){currentUsername=currentUser.user_metadata?.username||null}
}

async function getUsername(id){
 if(!id)return"User";
 const k=String(id);
 if(usernameCache.has(k))return usernameCache.get(k);
 try{
  const {data}=await supabaseClient.from("profiles").select("username").eq("id",id).maybeSingle();
  if(data?.username){usernameCache.set(k,data.username);return data.username}
 }catch(e){}
 return"User";
}

async function loadOfferUsernames(){
 const ids=[...new Set(availableOffers.map(x=>x.user_id).filter(Boolean).map(String))];
 const missing=ids.filter(x=>!usernameCache.has(x));
 if(!missing.length)return;
 try{
  const {data,error}=await supabaseClient.from("profiles").select("id,username").in("id",missing);
  if(error)throw error;
  (data||[]).forEach(x=>{if(x.id&&x.username)usernameCache.set(String(x.id),x.username)});
 }catch(e){console.error("USERNAMES ERROR:",e)}
}

async function loadPendingTrades(){
 pendingTrades=new Map();
 const ids=availableOffers.map(x=>x.id).filter(Boolean);
 if(!ids.length)return;
 try{
  const {data,error}=await supabaseClient
   .from("p2p_trades")
   .select("id,order_id,status,trade_number,buyer_id,seller_id,amount,created_at")
   .in("order_id",ids);
  if(error)throw error;
  (data||[]).forEach(t=>{
   const s=normalizeStatus(t.status);
   if(["pending","pending_payment","payment_pending"].includes(s)&&t.order_id!=null){
    pendingTrades.set(String(t.order_id),t);
   }
  });
 }catch(e){
  console.error("PENDING TRADES ERROR:",e);
 }
}

async function loadBuyMarket(){
 if(!currentUser)return showLogin();
 if(isLoading)return;
 isLoading=true;
 const container=document.getElementById("offers");
 if(container)container.innerHTML='<div class="empty">Loading available sell...</div>';

 try{
  const {data,error}=await supabaseClient
   .from("p2p_orders")
   .select("*")
   .eq("order_type","sell")
   .in("status",["active","open"])
   .gt("remaining_amount",0)
   .neq("user_id",currentUser.id)
   .order("created_at",{ascending:false});

  if(error)throw error;

  availableOffers=(data||[]).filter(o=>
   String(o.user_id)!==String(currentUser.id)&&
   ["active","open"].includes(normalizeStatus(o.status))&&
   getOfferAvailableAmount(o)>0
  );

  availableOffers.sort((a,b)=>{
   const pa=Number(a.price),pb=Number(b.price);
   if(Number.isFinite(pa)&&Number.isFinite(pb)&&pa!==pb)return pa-pb;
   if(Number.isFinite(pa)&&!Number.isFinite(pb))return-1;
   if(!Number.isFinite(pa)&&Number.isFinite(pb))return 1;
   return(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0);
  });

  await loadOfferUsernames();
  await loadPendingTrades();
  searchUSDTAmount();
 }catch(e){
  console.error("BUY MARKET ERROR:",e);
  availableOffers=[];filteredOffers=[];pendingTrades=new Map();
  if(container)container.innerHTML=emptyHtml("⚠️","Could not load available sell.",getErrorMessage(e));
 }finally{isLoading=false}
}

function searchUSDTAmount(){
 const input=document.getElementById("usdtSearch");
 const v=Number(input?.value);
 filteredOffers=input&&input.value.trim()!==""&&Number.isFinite(v)&&v>0
  ?availableOffers.filter(o=>getOfferAvailableAmount(o)>=v)
  :[...availableOffers];
 offersExpanded=false;
 const count=document.getElementById("offerCount");
 if(count)count.textContent=filteredOffers.length;
 renderBuyMarket();
}

function renderBuyMarket(){
 const container=document.getElementById("offers");
 if(!container)return;
 if(!filteredOffers.length){
  const s=document.getElementById("usdtSearch")?.value.trim();
  container.innerHTML=emptyHtml(s?"🔎":"🟢",s?"No sell available for this USDT amount.":"No available sell.",s?"Try a smaller USDT amount.":"Active sellers will appear here.");
  updateOfferButton();return;
 }

 container.innerHTML="";
 const items=offersExpanded?filteredOffers:filteredOffers.slice(0,15);

 items.forEach(o=>{
  if(String(o.user_id)===String(currentUser.id))return;
  const username=usernameCache.get(String(o.user_id))||"Seller";
  const pending=pendingTrades.has(String(o.id));
  const card=document.createElement("div");
  card.className="offer-card";

  card.innerHTML=`
   <div class="offer-main">
    <button type="button" class="offer-user-button" onclick="viewUser('${escapeJs(o.user_id)}')" title="View profile">👤 ${escapeHtml(username)}</button>

    <div style="margin-top:10px">
     <div style="color:#7b8790;font-size:10px">USDT</div>
     <div class="offer-amount">${escapeHtml(formatAmount(o))}</div>
    </div>

    <div style="margin-top:8px">
     <div style="color:#7b8790;font-size:10px">Price</div>
     <div class="offer-price">${money(o.price)}</div>
    </div>

    ${pending?`<div class="pending-notice">⏳ Pending Payment</div>`:""}

    <button type="button"
      class="offer-trade${pending?" pending":""}"
      ${pending?"disabled":""}
      onclick="${pending?"":"openTrade('"+escapeJs(o.id)+"')"}">
      ${pending?"Pending Payment":"Buy"}
    </button>
   </div>`;
  container.appendChild(card);
 });
 updateOfferButton();
}

function updateOfferButton(){
 const b=document.getElementById("offerViewButton");
 if(!b)return;
 if(filteredOffers.length<=15){
  b.style.display=filteredOffers.length?"none":"block";
  b.textContent="View All";return;
 }
 b.style.display="block";
 b.textContent=offersExpanded?"Show 15":"View All";
}

function toggleOffers(){offersExpanded=!offersExpanded;renderBuyMarket()}

function viewUser(id){
 if(id)window.location.href="profile.html?user_id="+encodeURIComponent(id);
}

async function openTrade(offerId){
 selectedOffer=availableOffers.find(o=>String(o.id)===String(offerId));
 if(!selectedOffer)return toast("This available sell is no longer available. Refresh.","warning");

 if(String(selectedOffer.user_id)===String(currentUser.id))
  return toast("You cannot buy your own sell offer.","warning");

 if(pendingTrades.has(String(selectedOffer.id)))
  return toast("This sell already has a Pending Payment trade.","warning");

 if(!["active","open"].includes(normalizeStatus(selectedOffer.status)))
  return toast("This available sell is no longer available. Refresh.","warning");

 const available=getOfferAvailableAmount(selectedOffer);
 if(available<=0)return toast("This available sell has no remaining amount.","warning");

 const input=document.getElementById("tradeAmount");
 input.value=available.toFixed(2);input.min="1";input.max=available.toFixed(2);

 const parts=getPairParts(selectedOffer.pair);
 const username=usernameCache.get(String(selectedOffer.user_id))||"Seller";

 document.getElementById("tradeSummary").innerHTML=`
  <div class="details" style="margin-bottom:12px">
   ${detail("Seller",username)}
   ${detail("Pair",formatPair(selectedOffer))}
   ${detail("Selling price",money(selectedOffer.price)+" "+(parts.quote||"ETB"))}
   ${detail("Available",formatAmount(selectedOffer))}
   ${detail("Payment method",selectedOffer.payment_method||"Bank Transfer")}
  </div>`;

 updateTradeValuePreview();
 openModal("tradeModal");
}

async function submitTrade(){
 if(actionLoading)return;
 if(!currentUser)return showLogin();
 if(!selectedOffer)return toast("Select an available sell first.","warning");

 if(pendingTrades.has(String(selectedOffer.id))){
  toast("This order already has a Pending Payment trade.","warning");
  closeModal("tradeModal");await loadBuyMarket();return;
 }

 const button=document.getElementById("tradeSubmitButton");
 actionLoading=true;button.disabled=true;button.textContent="Checking...";

 try{
  const {data:fresh,error:fetchError}=await supabaseClient
   .from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();
  if(fetchError)throw fetchError;
  if(!fresh)throw new Error("This available sell is no longer available.");

  selectedOffer=fresh;

  if(String(fresh.user_id)===String(currentUser.id))
   throw new Error("You cannot trade with your own offer.");

  if(!["active","open"].includes(normalizeStatus(fresh.status)))
   throw new Error("This available sell is no longer active.");

  const {data:pending,error:pendingError}=await supabaseClient
   .from("p2p_trades")
   .select("id,order_id,status")
   .eq("order_id",fresh.id)
   .in("status",["pending","pending_payment","payment_pending"])
   .limit(1);

  if(pendingError)throw pendingError;

  if(pending?.length){
   pendingTrades.set(String(fresh.id),pending[0]);
   renderBuyMarket();
   closeModal("tradeModal");
   throw new Error("This order already has a Pending Payment trade.");
  }

  const available=getOfferAvailableAmount(fresh);
  const amount=Number(document.getElementById("tradeAmount").value);
  if(!Number.isFinite(amount)||amount<=0)throw new Error("Invalid available amount.");

  if(Math.abs(amount-Number(available.toFixed(2)))>0.000001){
   document.getElementById("tradeAmount").value=Number(available.toFixed(2)).toFixed(2);
   updateTradeValuePreview();
   throw new Error("You must buy the full available amount.");
  }

  if(!confirm("Buy the full available amount of USDT from the seller?"))return;

  button.textContent="Starting...";

  const {data,error}=await supabaseClient.rpc("create_p2p_trade",{
   p_order_id:fresh.id,
   p_amount:amount
  });

  if(error)throw error;

  const tradeId=extractId(data);
  if(!tradeId)throw new Error("Trade started, but the trade ID was not returned.");

  const tradeOffer=selectedOffer;
  closeModal("tradeModal");
  toast("Buy trade started successfully.","success");
  selectedOffer=null;

  await loadBuyMarket();
  await openMessagesForTrade(tradeId,tradeOffer);
 }catch(e){
  console.error("TRADE ERROR:",e);
  toast(getErrorMessage(e),"error");
 }finally{
  actionLoading=false;
  button.disabled=false;
  button.textContent="Start Trade";
 }
}

async function openMessagesForTrade(tradeId,offer){
 if(!tradeId||!offer?.user_id)return toast("Trade started, but seller information is missing.","error");
 try{
  const sellerId=offer.user_id;
  let {data:conversation,error}=await supabaseClient
   .from("conversations").select("id")
   .or(`and(user_one.eq.${currentUser.id},user_two.eq.${sellerId}),and(user_one.eq.${sellerId},user_two.eq.${currentUser.id})`)
   .maybeSingle();

  if(error){
   const a=await supabaseClient.from("conversations").select("id").eq("user_one",currentUser.id).eq("user_two",sellerId).maybeSingle();
   if(a.error)throw a.error;
   conversation=a.data;
   if(!conversation){
    const b=await supabaseClient.from("conversations").select("id").eq("user_one",sellerId).eq("user_two",currentUser.id).maybeSingle();
    if(b.error)throw b.error;
    conversation=b.data;
   }
  }

  if(!conversation){
   const r=await supabaseClient.from("conversations").insert({user_one:currentUser.id,user_two:sellerId}).select("id").single();
   if(r.error){
    const retry=await supabaseClient.from("conversations").select("id").eq("user_one",sellerId).eq("user_two",currentUser.id).maybeSingle();
    if(retry.error||!retry.data)throw r.error;
    conversation=retry.data;
   }else conversation=r.data;
  }

  if(!conversation?.id)throw new Error("Conversation could not be created.");

  const {data:existing,error:existingError}=await supabaseClient
   .from("messages").select("id")
   .eq("conversation_id",conversation.id)
   .eq("sender_id",currentUser.id)
   .eq("message_type","order")
   .eq("order_id",tradeId)
   .maybeSingle();

  if(existingError)throw existingError;

  if(!existing){
   const {error}=await supabaseClient.from("messages").insert({
    conversation_id:conversation.id,
    sender_id:currentUser.id,
    content:"🟢 P2P Buy started. Please complete the payment for this trade.",
    message_type:"order",
    order_id:tradeId
   });
   if(error)throw error;
  }

  const username=await getUsername(sellerId);
  const p=new URLSearchParams();
  p.set("trade_id",String(tradeId));
  p.set("order_id",String(tradeId));
  if(username)p.set("username",username);
  window.location.href="message.html?"+p.toString();
 }catch(e){
  console.error("P2P MESSAGE ERROR:",e);
  toast("Trade started, but the P2P trade message could not be created: "+getErrorMessage(e),"error");
 }
}

function setupRealtime(){
 if(!currentUser)return;
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel("buy-market-live-"+currentUser.id)
  .on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},loadBuyMarket)
  .subscribe();

 if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
 tradeRealtimeChannel=supabaseClient.channel("buy-trades-live-"+currentUser.id)
  .on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},loadBuyMarket)
  .subscribe();
}

function getOfferAvailableAmount(o){
 if(!o)return 0;
 for(const v of [o.remaining_amount,o.available_amount,o.remaining]){
  if(v!==null&&v!==undefined&&v!==""){
   const n=Number(v);if(Number.isFinite(n)&&n>=0)return n;
  }
 }
 const n=Number(o.amount);
 return Number.isFinite(n)&&n>=0?n:0;
}

function getMinimumTradeAmount(o){
 for(const v of [o?.min_trade_amount,o?.minimum_amount,o?.min_amount]){
  const n=Number(v);if(Number.isFinite(n)&&n>0)return n;
 }
 return 1;
}

function getTradeValue(){
 return selectedOffer?(Number(document.getElementById("tradeAmount")?.value)||0)*(Number(selectedOffer.price)||0):0;
}

function updateTradeValuePreview(){
 const amount=Number(document.getElementById("tradeAmount")?.value)||0;
 const value=getTradeValue(),currency=getPairParts(selectedOffer?.pair).quote||"ETB";
 const a=document.getElementById("tradeAmountPreview"),v=document.getElementById("tradeValuePreview"),t=document.getElementById("tradeTotalPreview");
 if(a)a.textContent=amount.toLocaleString(undefined,{minimumFractionDigits:6,maximumFractionDigits:6});
 if(v)v.textContent=money(value)+" "+currency;
 if(t)t.textContent=money(value)+" "+currency;
}

function extractId(data){
 if(data==null)return null;
 if(typeof data==="string"||typeof data==="number")return data;
 if(typeof data==="object")return data.id||data.trade_id||data.order_id||data[0]?.id||data[0]?.trade_id||data[0]?.order_id||null;
 return null;
}

function openModal(id){const e=document.getElementById(id);if(!e)return;e.classList.add("show");setTimeout(()=>e.querySelector("input,textarea")?.focus(),50)}
function closeModal(id){document.getElementById(id)?.classList.remove("show")}

function formatPair(o){
 const p=String(o?.pair||o?.trading_pair||"");
 return p.includes("_")?p.replace("_"," / "):p||"USDT / ETB";
}

function formatAmount(o){
 const a=getOfferAvailableAmount(o),p=getPairParts(o?.pair);
 return a.toLocaleString(undefined,{maximumFractionDigits:6})+" "+(p.base||"USDT");
}

function getPairParts(pair){
 const p=String(pair||"").trim().toUpperCase().replace("/","_").split("_");
 return{base:p[0]||"USDT",quote:p[1]||"ETB"};
}

function money(v){
 const n=Number(v);
 return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00";
}

function normalizeStatus(s){return String(s||"").trim().toLowerCase()}

function detail(label,value){
 return`<div class="detail-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value??"")}</strong></div>`;
}

function emptyHtml(icon,title,message){
 return`<div class="empty"><div class="empty-icon">${escapeHtml(icon||"ℹ️")}</div><strong>${escapeHtml(title||"")}</strong>${message?`<div style="margin-top:7px">${escapeHtml(message)}</div>`:""}</div>`;
}

function escapeHtml(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function escapeJs(v){
 return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n");
}

function getErrorMessage(e){
 return e?.message||e?.details||e?.hint||"Something went wrong.";
}

function toast(message,type="normal"){
 const e=document.getElementById("toast");if(!e)return;
 clearTimeout(toastTimer);e.textContent=String(message||"");
 e.classList.remove("success","error","warning");
 if(["success","error","warning"].includes(type))e.classList.add(type);
 e.classList.add("show");
 toastTimer=setTimeout(()=>e.classList.remove("show"),3500);
}

document.addEventListener("click",e=>{
 if(e.target.classList.contains("modal"))e.target.classList.remove("show");
});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(x=>x.classList.remove("show"));
});

setInterval(()=>{
 if(currentUser&&document.visibilityState==="visible")loadBuyMarket().catch(e=>console.error("AUTO REFRESH ERROR:",e));
},30000);

window.addEventListener("beforeunload",()=>{
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
});
</script>
</body>
</html>
