<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - P2P Social</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #182848, #05070d 60%);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      border-radius: 22px;
      background: rgba(15, 18, 28, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      display: block;
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9da5b4;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #dfe4ec;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 12px;
      border: 1px solid #303747;
      outline: none;
      background: #10141d;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #4d8dff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .login-btn {
      background: linear-gradient(135deg, #1769ff, #6b3df5);
      color: white;
      margin-top: 3px;
    }

    .google-btn {
      background: white;
      color: #111;
      margin-top: 14px;
    }

    .mfa-btn {
      background: linear-gradient(135deg, #00a86b, #0084ff);
      color: white;
      margin-top: 5px;
    }

    .back-btn {
      background: #252b38;
      color: white;
      margin-top: 10px;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: rgba(255, 60, 60, 0.12);
      border: 1px solid rgba(255, 60, 60, 0.3);
      color: #ff7777;
    }

    .success {
      display: block;
      background: rgba(0, 200, 120, 0.12);
      border: 1px solid rgba(0, 200, 120, 0.3);
      color: #55e6a8;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #737b89;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a303c;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #8992a2;
      font-size: 14px;
    }

    .register a {
      color: #5792ff;
      text-decoration: none;
      font-weight: bold;
    }

    #mfaSection {
      display: none;
    }

    .mfa-title {
      text-align: center;
      margin-bottom: 10px;
    }

    .mfa-description {
      text-align: center;
      color: #9da5b4;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      color: #9da5b4;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN SECTION -->
    <div id="loginSection">

      <img
        src="images/logo.png"
        class="logo"
        alt="P2P Social"
        onerror="this.style.display='none'"
      >

      <h1>P2P Social</h1>

      <p class="subtitle">
        Login to your account
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login
        </button>

      </form>

      <div class="divider">
        OR
      </div>

      <button
        type="button"
        class="google-btn"
        id="googleButton"
      >
        Continue with Google
      </button>

      <div
        id="loading"
        class="loading"
      >
        Please wait...
      </div>

      <div class="register">
        Don't have an account?
        <a href="register.html">
          Register
        </a>
      </div>

    </div>


    <!-- MFA SECTION -->
    <div id="mfaSection">

      <img
        src="images/logo.png"
        class="logo"
        alt="P2P Social"
        onerror="this.style.display='none'"
      >

      <h2 class="mfa-title">
        Two-Factor Authentication
      </h2>

      <p class="mfa-description">
        Enter the 6-digit code from your authenticator app.
      </p>

      <div id="mfaMessage" class="message"></div>

      <input
        type="text"
        id="mfaCode"
        placeholder="Enter 6-digit code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
      >

      <button
        type="button"
        class="mfa-btn"
        id="verifyMfaButton"
      >
        Verify Code
      </button>

      <button
        type="button"
        class="back-btn"
        id="cancelMfaButton"
      >
        Cancel
      </button>

    </div>

  </div>


<script>
/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   CONFIGURATION
========================================================= */

const AUTHENTICATED_PAGE = "wallet.html";


/* =========================================================
   ELEMENTS
========================================================= */

const loginSection =
  document.getElementById("loginSection");

const mfaSection =
  document.getElementById("mfaSection");

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const googleButton =
  document.getElementById("googleButton");

const message =
  document.getElementById("message");

const loading =
  document.getElementById("loading");

const mfaCode =
  document.getElementById("mfaCode");

const verifyMfaButton =
  document.getElementById("verifyMfaButton");

const cancelMfaButton =
  document.getElementById("cancelMfaButton");

const mfaMessage =
  document.getElementById("mfaMessage");


/* =========================================================
   STATE
========================================================= */

let processingAuthentication = false;

let mfaFactorId = null;

let mfaChallengeId = null;


/* =========================================================
   MESSAGE HELPERS
========================================================= */

function showMessage(text, type = "error") {

  message.textContent = text;

  message.className =
    "message " + type;
}


function hideMessage() {

  message.textContent = "";

  message.className = "message";
}


function showMfaMessage(text, type = "error") {

  mfaMessage.textContent = text;

  mfaMessage.className =
    "message " + type;
}


function hideMfaMessage() {

  mfaMessage.textContent = "";

  mfaMessage.className = "message";
}


function setLoading(value) {

  loading.style.display =
    value ? "block" : "none";

  loginButton.disabled = value;

  googleButton.disabled = value;
}


/* =========================================================
   EMAIL PROVIDER CHECK
========================================================= */

function isGoogleUser(user) {

  if (!user) {
    return false;
  }

  const identities =
    user.identities || [];

  return identities.some(
    identity =>
      identity.provider === "google"
  );
}


/* =========================================================
   MFA
========================================================= */

async function prepareMFAIfRequired(session) {

  try {

    if (!session || !session.user) {
      return false;
    }

    const {
      data: factorsData,
      error: factorsError
    } = await supabaseClient.auth.mfa.listFactors();

    if (factorsError) {
      throw factorsError;
    }

    const factors =
      factorsData?.totp || [];

    const verifiedFactors =
      factors.filter(
        factor =>
          factor.status === "verified"
      );

    /*
      No MFA configured.
    */
    if (verifiedFactors.length === 0) {
      return false;
    }


    const {
      data: aalData,
      error: aalError
    } =
      await supabaseClient.auth.mfa
        .getAuthenticatorAssuranceLevel();

    if (aalError) {
      throw aalError;
    }


    /*
      Already authenticated with MFA.
    */
    if (
      aalData.currentLevel === "aal2"
    ) {
      return false;
    }


    /*
      MFA is required.
    */
    mfaFactorId =
      verifiedFactors[0].id;


    const {
      data: challengeData,
      error: challengeError
    } =
      await supabaseClient.auth.mfa
        .challenge({
          factorId: mfaFactorId
        });

    if (challengeError) {
      throw challengeError;
    }


    mfaChallengeId =
      challengeData.id;


    showMFASection();

    return true;

  } catch (error) {

    console.error(
      "MFA preparation error:",
      error
    );

    showMessage(
      "Unable to prepare two-factor authentication.",
      "error"
    );

    return false;
  }
}


/* =========================================================
   SHOW MFA
========================================================= */

function showMFASection() {

  loginSection.style.display = "none";

  mfaSection.style.display = "block";

  hideMfaMessage();

  mfaCode.value = "";

  setTimeout(() => {
    mfaCode.focus();
  }, 100);
}


/* =========================================================
   HIDE MFA
========================================================= */

function hideMFASection() {

  mfaSection.style.display = "none";

  loginSection.style.display = "block";

  mfaCode.value = "";

  mfaFactorId = null;

  mfaChallengeId = null;

  hideMfaMessage();

  processingAuthentication = false;
}


/* =========================================================
   FINISH AUTHENTICATION
========================================================= */

async function finishAuthentication(session) {

  if (!session || !session.user) {
    return;
  }

  const user =
    session.user;


  /*
    Google users do not need a separate
    email confirmation step because
    authentication is handled by Google.
  */
  const googleUser =
    isGoogleUser(user);


  /*
    Email/password users must confirm
    their email before entering the app.
  */
  if (
    !googleUser &&
    !user.email_confirmed_at
  ) {

    await supabaseClient.auth.signOut();

    processingAuthentication = false;

    setLoading(false);

    showMessage(
      "Please confirm your email before logging in.",
      "error"
    );

    return;
  }


  /*
    Check MFA.
  */
  const mfaRequired =
    await prepareMFAIfRequired(session);


  if (mfaRequired) {

    setLoading(false);

    return;
  }


  /*
    Authentication complete.
  */
  showMessage(
    "Login successful. Redirecting...",
    "success"
  );


  setTimeout(() => {

    window.location.replace(
      AUTHENTICATED_PAGE
    );

  }, 500);
}


/* =========================================================
   EMAIL / PASSWORD LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    if (processingAuthentication) {
      return;
    }

    processingAuthentication = true;

    hideMessage();

    setLoading(true);


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (error) {
        throw error;
      }


      if (!data || !data.session) {

        throw new Error(
          "Login failed. No active session was created."
        );
      }


      await finishAuthentication(
        data.session
      );


    } catch (error) {

      console.error(
        "Login error:",
        error
      );

      processingAuthentication = false;

      setLoading(false);


      let errorText =
        error?.message ||
        "Login failed.";


      if (
        errorText
          .toLowerCase()
          .includes("email not confirmed")
      ) {

        errorText =
          "Please confirm your email before logging in.";

      } else if (
        errorText
          .toLowerCase()
          .includes("invalid login credentials")
      ) {

        errorText =
          "Incorrect email or password.";

      }


      showMessage(
        errorText,
        "error"
      );
    }

  }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleButton.addEventListener(
  "click",
  async function() {

    if (processingAuthentication) {
      return;
    }

    processingAuthentication = true;

    hideMessage();

    setLoading(true);


    try {

      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                window.location.origin +
                "/login.html"

            }

          });


      if (error) {
        throw error;
      }


      /*
        Google will redirect the browser.
      */

    } catch (error) {

      console.error(
        "Google login error:",
        error
      );

      processingAuthentication = false;

      setLoading(false);

      showMessage(
        error?.message ||
        "Google login failed.",
        "error"
      );
    }

  }
);


/* =========================================================
   MFA VERIFY
========================================================= */

verifyMfaButton.addEventListener(
  "click",
  async function() {

    const code =
      mfaCode.value.trim();


    if (!/^\d{6}$/.test(code)) {

      showMfaMessage(
        "Enter a valid 6-digit code.",
        "error"
      );

      return;
    }


    if (
      !mfaFactorId ||
      !mfaChallengeId
    ) {

      showMfaMessage(
        "MFA session expired. Please log in again.",
        "error"
      );

      return;
    }


    verifyMfaButton.disabled = true;

    showMfaMessage(
      "Verifying...",
      "success"
    );


    try {

      const {
        error
      } =
        await supabaseClient.auth.mfa.verify({

          factorId:
            mfaFactorId,

          challengeId:
            mfaChallengeId,

          code:
            code

        });


      if (error) {
        throw error;
      }


      const {
        data: aalData,
        error: aalError
      } =
        await supabaseClient.auth.mfa
          .getAuthenticatorAssuranceLevel();


      if (aalError) {
        throw aalError;
      }


      if (
        aalData.currentLevel !== "aal2"
      ) {

        throw new Error(
          "Two-factor authentication was not completed."
        );
      }


      showMfaMessage(
        "Verification successful. Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.replace(
          AUTHENTICATED_PAGE
        );

      }, 500);


    } catch (error) {

      console.error(
        "MFA verification error:",
        error
      );

      showMfaMessage(
        error?.message ||
        "Invalid authentication code.",
        "error"
      );

      verifyMfaButton.disabled = false;
    }

  }
);


/* =========================================================
   CANCEL MFA
========================================================= */

cancelMfaButton.addEventListener(
  "click",
  async function() {

    verifyMfaButton.disabled = false;

    await supabaseClient.auth.signOut();

    hideMFASection();

    setLoading(false);

    showMessage(
      "Login cancelled.",
      "error"
    );
  }
);


/* =========================================================
   EXISTING SESSION
========================================================= */

async function processExistingSession() {

  if (processingAuthentication) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (error) {
      throw error;
    }


    const session =
      data?.session;


    if (!session) {
      return;
    }


    processingAuthentication = true;

    setLoading(true);

    await finishAuthentication(
      session
    );


  } catch (error) {

    console.error(
      "Existing session error:",
      error
    );

    processingAuthentication = false;

    setLoading(false);

    showMessage(
      "Unable to restore your session. Please log in again.",
      "error"
    );
  }
}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    console.log(
      "Auth event:",
      event
    );


    /*
      OAuth can finish after the page loads.
      Process the session once it becomes available.
    */
    if (
      event === "SIGNED_IN" &&
      session &&
      !processingAuthentication
    ) {

      setTimeout(() => {

        processExistingSession();

      }, 100);

    }

  }
);


/* =========================================================
   INITIAL PAGE CHECK
========================================================= */

window.addEventListener(
  "load",
  function() {

    processExistingSession();

  }
);
</script>

</body>
</html>
