  </style></head><body><div class="container">  <!-- P2P SOCIAL LOGO -->  <div class="logo-area"><img

>

<div class="brand">
  P2P Social
</div>

  </div>  <h1>Login</h1>  <p class="subtitle">
    Welcome back to P2P Social
  </p>  <form id="loginForm"><label for="email">
  Email
</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  autocomplete="email"
  required
>


<label for="password">
  Password
</label>

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  autocomplete="current-password"
  required
>


<button
  type="submit"
  id="loginButton">
  Login
</button>

  </form>  <p id="message"></p>  <div class="register-link">Don't have an account?

<a href="register.html">

class="back">
← Back to Home
</a>

</div><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function showMessage(text, color) {

  message.textContent = text;
  message.style.color = color;

}


// ===============================
// LOGIN
// ===============================

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "red"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";


    showMessage(
      "Checking your account...",
      "#2563eb"
    );


    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        throw error;

      }


      if (!data || !data.user) {

        throw new Error(
          "Login failed."
        );

      }


      showMessage(
        "Login successful!",
        "green"
      );


      setTimeout(
        function() {

          window.location.href =
            "/index.html";

        },
        700
      );


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      let errorMessage =
        "Login failed.";


      if (error.message) {

        const msg =
          error.message.toLowerCase();


        if (
          msg.includes(
            "invalid login credentials"
          )
        ) {

          errorMessage =
            "Incorrect email or password.";

        }

        else if (
          msg.includes(
            "email not confirmed"
          )
        ) {

          errorMessage =
            "Please verify your email first.";

        }

        else {

          errorMessage =
            error.message;

        }

      }


      showMessage(
        errorMessage,
        "red"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


// ===============================
// ALREADY LOGGED IN?
// ===============================

async function checkSession() {

  const {
    data,
    error
  } =
  await supabaseClient.auth
    .getSession();


  if (error) {

    console.error(error);
    return;

  }


  if (data.session) {

    window.location.href =
      "/index.html";

  }

}


checkSession();

</script></body>
</html>
