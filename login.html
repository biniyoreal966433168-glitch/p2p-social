<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - P2P Social</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:#f4f7f8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:white;
      padding:28px;
      border-radius:20px;
      box-shadow:0 8px 30px rgba(0,0,0,.10);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:22px;
    }

    .icon{
      width:68px;
      height:68px;
      border-radius:22px;
      background:linear-gradient(135deg,#064e46,#10a889);
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      box-shadow:0 10px 25px rgba(0,0,0,.16);
      flex-shrink:0;
    }

    .p-left{
      position:absolute;
      left:12px;
      top:16px;
      width:21px;
      height:36px;
      border:6px solid white;
      border-right:0;
      border-radius:13px 0 0 13px;
    }

    .p-right{
      position:absolute;
      right:12px;
      top:16px;
      width:21px;
      height:36px;
      border:6px solid white;
      border-left:0;
      border-radius:0 13px 13px 0;
    }

    .center{
      width:18px;
      height:18px;
      background:white;
      border-radius:50%;
      position:absolute;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:5;
    }

    .dot{
      width:6px;
      height:6px;
      background:#087f73;
      border-radius:50%;
    }

    .text h1{
      font-size:22px;
      font-weight:800;
      color:#172033;
    }

    .text h1 span{
      color:#087f73;
    }

    .text p{
      margin-top:4px;
      font-size:9px;
      color:#7b8491;
      letter-spacing:.6px;
    }

    .login-title{
      text-align:center;
      color:#075e54;
      margin-bottom:7px;
      font-size:25px;
    }

    .subtitle{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      font-size:14px;
      color:#172033;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      margin-bottom:16px;
      font-size:15px;
      outline:none;
      background:white;
    }

    input:focus{
      border-color:#087f73;
      box-shadow:0 0 0 2px rgba(8,127,115,.08);
    }

    #loginButton,
    #mfaButton{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      background:#087f73;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
    }

    #loginButton:hover,
    #mfaButton:hover{
      background:#075e54;
    }

    #loginButton:disabled,
    #mfaButton:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
      color:#999;
      font-size:12px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#e5e7eb;
    }

    #googleButton{
      width:100%;
      padding:13px;
      border:1px solid #d9dde3;
      border-radius:10px;
      background:white;
      color:#172033;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    #googleButton:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .google-icon{
      font-size:19px;
      font-weight:bold;
    }

    #message{
      text-align:center;
      margin-top:15px;
      min-height:20px;
      font-size:14px;
      line-height:1.4;
    }

    #mfaSection{
      display:none;
    }

    .mfa-info{
      text-align:center;
      color:#666;
      font-size:13px;
      line-height:1.5;
      margin-bottom:18px;
    }

    #mfaCode{
      text-align:center;
      letter-spacing:6px;
      font-size:22px;
      font-weight:bold;
    }

    .back-login{
      display:block;
      width:100%;
      margin-top:12px;
      padding:10px;
      border:none;
      background:transparent;
      color:#087f73;
      font-size:14px;
      cursor:pointer;
    }

    .register-link{
      text-align:center;
      margin-top:20px;
      font-size:14px;
      color:#555;
    }

    .register-link a{
      color:#087f73;
      font-weight:bold;
      text-decoration:none;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:15px;
      color:#777;
      text-decoration:none;
      font-size:13px;
    }

    @media(max-width:450px){

      body{
        padding:15px;
      }

      .container{
        padding:24px 20px;
        border-radius:18px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <div class="brand">

    <div class="icon">
      <div class="p-left"></div>
      <div class="p-right"></div>

      <div class="center">
        <div class="dot"></div>
      </div>
    </div>

    <div class="text">

      <h1>
        P2P <span>Social</span>
      </h1>

      <p>
        CONNECT • TRADE • SHARE
      </p>

    </div>

  </div>


  <h1
    class="login-title"
    id="loginTitle"
  >
    Login
  </h1>

  <p
    class="subtitle"
    id="loginSubtitle"
  >
    Welcome back to P2P Social
  </p>


  <!-- LOGIN -->

  <div id="loginSection">

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>


    <div class="divider">
      OR
    </div>


    <button
      type="button"
      id="googleButton"
    >
      <span class="google-icon">G</span>
      Continue with Google
    </button>


    <div
      class="register-link"
      id="registerArea"
    >
      Don't have an account?

      <a href="register.html">
        Register
      </a>
    </div>


    <a
      href="index.html"
      class="back"
      id="homeLink"
    >
      ← Back to Home
    </a>

  </div>


  <!-- MFA -->

  <div id="mfaSection">

    <p class="mfa-info">
      🔐 Two-factor authentication<br>
      Enter the 6-digit code from your authenticator app.
    </p>

    <form id="mfaForm">

      <label for="mfaCode">
        MFA Code
      </label>

      <input
        type="text"
        id="mfaCode"
        placeholder="000000"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        required
      >

      <button
        type="submit"
        id="mfaButton"
      >
        Verify MFA
      </button>

    </form>

    <button
      type="button"
      class="back-login"
      id="backToLogin"
    >
      ← Back to login
    </button>

  </div>


  <p id="message"></p>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
  document.getElementById("loginSection");

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const googleButton =
  document.getElementById("googleButton");

const mfaSection =
  document.getElementById("mfaSection");

const mfaForm =
  document.getElementById("mfaForm");

const mfaButton =
  document.getElementById("mfaButton");

const mfaCode =
  document.getElementById("mfaCode");

const backToLogin =
  document.getElementById("backToLogin");

const message =
  document.getElementById("message");

const loginTitle =
  document.getElementById("loginTitle");

const loginSubtitle =
  document.getElementById("loginSubtitle");

const registerArea =
  document.getElementById("registerArea");

const homeLink =
  document.getElementById("homeLink");


/* =========================================
   STATE
========================================= */

let factorId = null;

let challengeId = null;

let authProcessing = false;


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "info"
){

  message.textContent = text;

  if(type === "error"){
    message.style.color = "#dc2626";
  }

  else if(type === "success"){
    message.style.color = "#087f73";
  }

  else{
    message.style.color = "#2563eb";
  }

}


/* =========================================
   LOGIN UI
========================================= */

function showLogin(){

  loginSection.style.display = "block";

  mfaSection.style.display = "none";

  loginTitle.textContent = "Login";

  loginSubtitle.textContent =
    "Welcome back to P2P Social";

  registerArea.style.display = "block";

  homeLink.style.display = "block";

  factorId = null;

  challengeId = null;

  mfaCode.value = "";

  mfaButton.disabled = false;

  mfaButton.textContent =
    "Verify MFA";

}


/* =========================================
   MFA UI
========================================= */

function showMFA(){

  loginSection.style.display = "none";

  mfaSection.style.display = "block";

  loginTitle.textContent =
    "MFA Verification";

  loginSubtitle.textContent =
    "Secure your P2P Social account";

  showMessage(
    "Enter your 6-digit authenticator code.",
    "info"
  );

  setTimeout(function(){

    mfaCode.focus();

  },100);

}


/* =========================================
   CHECK MFA
========================================= */

async function checkMFA(){

  const {
    data: factorsData,
    error: factorsError
  } =
  await supabaseClient
    .auth
    .mfa
    .listFactors();


  if(factorsError){
    throw factorsError;
  }


  const totpFactors =
    factorsData &&
    Array.isArray(factorsData.totp)
      ? factorsData.totp
      : [];


  const verifiedFactors =
    totpFactors.filter(function(factor){

      return factor.status === "verified";

    });


  /*
    User does not have MFA.
  */

  if(verifiedFactors.length === 0){

    return false;

  }


  const {
    data: assuranceData,
    error: assuranceError
  } =
  await supabaseClient
    .auth
    .mfa
    .getAuthenticatorAssuranceLevel();


  if(assuranceError){
    throw assuranceError;
  }


  /*
    Already passed MFA.
  */

  if(
    assuranceData.currentLevel === "aal2"
  ){

    return false;

  }


  /*
    MFA required.
  */

  factorId =
    verifiedFactors[0].id;


  const {
    data: challengeData,
    error: challengeError
  } =
  await supabaseClient
    .auth
    .mfa
    .challenge({

      factorId: factorId

    });


  if(challengeError){
    throw challengeError;
  }


  challengeId =
    challengeData.id;


  showMFA();

  return true;

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(authProcessing){
      return;
    }


    authProcessing = true;


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    loginButton.disabled = true;

    googleButton.disabled = true;

    loginButton.textContent =
      "Logging in...";


    showMessage(
      "Checking your account...",
      "info"
    );


    try{

      const {
        data,
        error
      } =
      await supabaseClient
        .auth
        .signInWithPassword({

          email: email,

          password: password

        });


      if(error){
        throw error;
      }


      if(
        !data ||
        !data.session ||
        !data.user
      ){

        throw new Error(
          "No login session was created."
        );

      }


      /*
        Email confirmation.
      */

      if(!data.user.email_confirmed_at){

        await supabaseClient
          .auth
          .signOut();

        throw new Error(
          "Please verify your email before logging in."
        );

      }


      /*
        MFA.
      */

      const needsMFA =
        await checkMFA();


      if(needsMFA){

        loginButton.disabled = false;

        googleButton.disabled = false;

        loginButton.textContent =
          "Login";

        authProcessing = false;

        return;

      }


      /*
        Successful login.
      */

      showMessage(
        "Login successful. Redirecting...",
        "success"
      );


      window.location.replace(
        "index.html"
      );

    }


    catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      showMessage(
        error && error.message
          ? error.message
          : "Login failed.",
        "error"
      );


      loginButton.disabled = false;

      googleButton.disabled = false;

      loginButton.textContent =
        "Login";

      authProcessing = false;

    }

  }
);


/* =========================================
   GOOGLE LOGIN
========================================= */

googleButton.addEventListener(
  "click",
  async function(){

    if(authProcessing){
      return;
    }


    authProcessing = true;


    googleButton.disabled = true;

    loginButton.disabled = true;

    googleButton.innerHTML =
      '<span class="google-icon">G</span> Connecting...';


    showMessage(
      "Connecting to Google...",
      "info"
    );


    try{

      const {
        error
      } =
      await supabaseClient
        .auth
        .signInWithOAuth({

          provider: "google",

          options:{

            redirectTo:
              window.location.origin +
              "/login.html"

          }

        });


      if(error){
        throw error;
      }

    }


    catch(error){

      console.error(
        "GOOGLE ERROR:",
        error
      );


      showMessage(
        error && error.message
          ? error.message
          : "Google login failed.",
        "error"
      );


      googleButton.disabled = false;

      loginButton.disabled = false;

      googleButton.innerHTML =
        '<span class="google-icon">G</span> Continue with Google';

      authProcessing = false;

    }

  }
);


/* =========================================
   MFA VERIFY
========================================= */

mfaForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const code =
      mfaCode.value
        .trim()
        .replace(/\D/g,"");


    if(code.length !== 6){

      showMessage(
        "Please enter the 6-digit MFA code.",
        "error"
      );

      return;

    }


    if(!factorId || !challengeId){

      showMessage(
        "MFA challenge expired. Please login again.",
        "error"
      );

      return;

    }


    mfaButton.disabled = true;

    mfaButton.textContent =
      "Verifying...";


    showMessage(
      "Verifying MFA...",
      "info"
    );


    try{

      const {
        error
      } =
      await supabaseClient
        .auth
        .mfa
        .verify({

          factorId: factorId,

          challengeId: challengeId,

          code: code

        });


      if(error){
        throw error;
      }


      const {
        data: assuranceData,
        error: assuranceError
      } =
      await supabaseClient
        .auth
        .mfa
        .getAuthenticatorAssuranceLevel();


      if(assuranceError){
        throw assuranceError;
      }


      if(
        assuranceData.currentLevel !== "aal2"
      ){

        throw new Error(
          "MFA verification was not completed."
        );

      }


      showMessage(
        "MFA verified. Redirecting...",
        "success"
      );


      window.location.replace(
        "index.html"
      );

    }


    catch(error){

      console.error(
        "MFA ERROR:",
        error
      );


      showMessage(
        error && error.message
          ? error.message
          : "Invalid MFA code.",
        "error"
      );


      mfaButton.disabled = false;

      mfaButton.textContent =
        "Verify MFA";

      mfaCode.value = "";

      mfaCode.focus();

    }

  }
);


/* =========================================
   BACK TO LOGIN
========================================= */

backToLogin.addEventListener(
  "click",
  async function(){

    try{

      await supabaseClient
        .auth
        .signOut();

    }

    catch(error){

      console.error(
        "SIGN OUT ERROR:",
        error
      );

    }


    authProcessing = false;

    showLogin();

    showMessage(
      "Please login again.",
      "info"
    );

  }
);


/* =========================================
   EXISTING SESSION
========================================= */

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(error){
      throw error;
    }


    if(
      !data ||
      !data.session ||
      !data.session.user
    ){

      return;

    }


    /*
      Existing session already exists.
      Check MFA before entering the app.
    */

    authProcessing = true;


    const needsMFA =
      await checkMFA();


    if(needsMFA){

      authProcessing = false;

      return;

    }


    showMessage(
      "You are already logged in. Redirecting...",
      "success"
    );


    window.location.replace(
      "index.html"
    );

  }


  catch(error){

    console.error(
      "SESSION ERROR:",
      error
    );

    authProcessing = false;

  }

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    console.log(
      "AUTH EVENT:",
      event
    );

  }
);


/* =========================================
   START
========================================= */

checkExistingSession();

</script>

</body>
</html>
