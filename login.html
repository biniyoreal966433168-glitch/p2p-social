<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Login - P2P Social</title>  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:#f4f7f8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:white;
      padding:28px;
      border-radius:20px;
      box-shadow:0 8px 30px rgba(0,0,0,.10);
    }


    /* =========================
       P2P SOCIAL LOGO
    ========================= */

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:22px;
    }


    .icon{
      width:68px;
      height:68px;

      border-radius:22px;

      background:
        linear-gradient(
          135deg,
          #064e46,
          #10a889
        );

      position:relative;

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.16);

      flex-shrink:0;
    }


    /* LEFT P */

    .p-left{
      position:absolute;

      left:12px;
      top:16px;

      width:21px;
      height:36px;

      border:6px solid white;

      border-right:0;

      border-radius:
        13px 0 0 13px;
    }


    /* RIGHT P */

    .p-right{
      position:absolute;

      right:12px;
      top:16px;

      width:21px;
      height:36px;

      border:6px solid white;

      border-left:0;

      border-radius:
        0 13px 13px 0;
    }


    /* CENTER SOCIAL DOT */

    .center{
      width:18px;
      height:18px;

      background:white;

      border-radius:50%;

      position:absolute;

      display:flex;
      justify-content:center;
      align-items:center;

      z-index:5;
    }


    /* SMALL CONNECTION DOT */

    .dot{
      width:6px;
      height:6px;

      background:#087f73;

      border-radius:50%;
    }


    /* BRAND TEXT */

    .text h1{
      font-size:22px;
      font-weight:800;
      color:#172033;
    }

    .text h1 span{
      color:#087f73;
    }

    .text p{
      margin-top:4px;

      font-size:9px;

      color:#7b8491;

      letter-spacing:.6px;
    }


    /* =========================
       LOGIN TITLE
    ========================= */

    .login-title{
      text-align:center;
      color:#075e54;
      margin-bottom:7px;
      font-size:25px;
    }

    .subtitle{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }


    /* =========================
       FORM
    ========================= */

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      font-size:14px;
      color:#172033;
    }

    input{
      width:100%;
      padding:13px;

      border:1px solid #ddd;

      border-radius:10px;

      margin-bottom:16px;

      font-size:15px;

      outline:none;

      background:white;
    }

    input:focus{
      border-color:#087f73;
      box-shadow:0 0 0 2px rgba(8,127,115,.08);
    }


    #loginButton{
      width:100%;

      padding:13px;

      border:none;

      border-radius:10px;

      background:#087f73;

      color:white;

      font-size:16px;

      font-weight:bold;

      cursor:pointer;

      transition:.2s;
    }

    #loginButton:hover{
      background:#075e54;
    }

    #loginButton:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    #loginButton:active{
      transform:scale(.98);
    }


    /* =========================
       MESSAGE
    ========================= */

    #message{
      text-align:center;

      margin-top:15px;

      min-height:20px;

      font-size:14px;

      line-height:1.4;
    }


    /* =========================
       REGISTER
    ========================= */

    .register-link{
      text-align:center;

      margin-top:20px;

      font-size:14px;

      color:#555;
    }

    .register-link a{
      color:#087f73;

      font-weight:bold;

      text-decoration:none;
    }

    .register-link a:hover{
      text-decoration:underline;
    }


    /* =========================
       BACK HOME
    ========================= */

    .back{
      display:block;

      text-align:center;

      margin-top:15px;

      color:#777;

      text-decoration:none;

      font-size:13px;
    }

    .back:hover{
      color:#087f73;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:450px){

      body{
        padding:15px;
      }

      .container{
        padding:24px 20px;
        border-radius:18px;
      }

      .brand{
        gap:10px;
      }

      .icon{
        width:62px;
        height:62px;
        border-radius:20px;
      }

      .p-left,
      .p-right{
        top:14px;
        height:34px;
      }

      .p-left{
        left:11px;
      }

      .p-right{
        right:11px;
      }

      .center{
        width:17px;
        height:17px;
      }

      .dot{
        width:6px;
        height:6px;
      }

      .text h1{
        font-size:20px;
      }

      .text p{
        font-size:8px;
      }

      .login-title{
        font-size:23px;
      }

    }

  </style></head><body><div class="container">  <!-- =========================
       P2P SOCIAL LOGO
       NO IMAGE FILE REQUIRED
  ========================== -->  <div class="brand"><div class="icon">

  <div class="p-left"></div>

  <div class="p-right"></div>

  <div class="center">

    <div class="dot"></div>

  </div>

</div>


<div class="text">

  <h1>
    P2P <span>Social</span>
  </h1>

  <p>
    CONNECT • TRADE • SHARE
  </p>

</div>

  </div>  <!-- LOGIN -->  <h1 class="login-title">
    Login
  </h1>  <p class="subtitle">
    Welcome back to P2P Social
  </p>  <form id="loginForm"><label for="email">
  Email
</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  autocomplete="email"
  required
>


<label for="password">
  Password
</label>

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  autocomplete="current-password"
  required
>


<button
  type="submit"
  id="loginButton">

  Login

</button>

  </form>  <p id="message"></p>  <div class="register-link">Don't have an account?

<a href="register.html">
  Register
</a>

  </div><a
href="index.html"
class="back">

← Back to Home

  </a></div><!-- =========================
     SUPABASE
========================= --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginForm =
  document.getElementById("loginForm");


const loginButton =
  document.getElementById("loginButton");


const message =
  document.getElementById("message");


function showMessage(text,color){

  message.textContent=text;

  message.style.color=color;

}


/* ===============================
   LOGIN
================================ */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showMessage(
        "Please enter your email and password.",
        "red"
      );

      return;

    }


    loginButton.disabled=true;

    loginButton.textContent=
      "Logging in...";


    showMessage(
      "Checking your account...",
      "#2563eb"
    );


    try{

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,

          password:password

        });


      if(error){

        throw error;

      }


      if(!data || !data.user){

        throw new Error(
          "Login failed."
        );

      }


      showMessage(
        "Login successful!",
        "green"
      );


      setTimeout(
        function(){

          window.location.href =
            "index.html";

        },
        700
      );


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let errorMessage =
        "Login failed.";


      if(error.message){

        const msg =
          error.message.toLowerCase();


        if(
          msg.includes(
            "invalid login credentials"
          )
        ){

          errorMessage =
            "Incorrect email or password.";

        }

        else if(
          msg.includes(
            "email not confirmed"
          )
        ){

          errorMessage =
            "Please verify your email first.";

        }

        else{

          errorMessage =
            error.message;

        }

      }


      showMessage(
        errorMessage,
        "red"
      );


      loginButton.disabled=false;

      loginButton.textContent=
        "Login";

    }

  }
);


/* ===============================
   ALREADY LOGGED IN?
================================ */

async function checkSession(){

  const {
    data,
    error
  } =
  await supabaseClient.auth
    .getSession();


  if(error){

    console.error(error);

    return;

  }


  if(data.session){

    window.location.href =
      "index.html";

  }

}


checkSession();

</script></body>
</html>
