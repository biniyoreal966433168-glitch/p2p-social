<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - P2P Social</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;

      background: white;

      padding: 35px 25px;

      border-radius: 20px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.25);
    }

    .logo {
      width: 85px;
      height: 85px;

      object-fit: contain;

      display: block;

      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;

      color: #111827;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #6b7280;

      margin-bottom: 25px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #374151;
    }

    input {
      width: 100%;

      padding: 13px;

      margin-bottom: 18px;

      border:
        1px solid #d1d5db;

      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-btn,
    .google-btn {
      width: 100%;

      padding: 14px;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    .login-btn {
      border: none;

      background: #2563eb;

      color: white;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:disabled {
      background: #93c5fd;

      cursor: not-allowed;
    }

    .google-btn {
      display: block;

      margin-top: 15px;

      border:
        1px solid #d1d5db;

      background: white;

      color: #111827;

      text-align: center;

      text-decoration: none;
    }

    .google-btn:hover {
      background: #f3f4f6;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 20px 0;

      color: #9ca3af;

      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background: #e5e7eb;

      flex: 1;
    }

    .message {
      text-align: center;

      margin: 15px 0;

      font-size: 14px;

      min-height: 18px;
    }

    .register {
      text-align: center;

      margin-top: 20px;

      color: #6b7280;
    }

    .register a {
      color: #2563eb;

      text-decoration: none;

      font-weight: bold;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 18px;

      color: #6b7280;

      text-decoration: none;

      font-size: 14px;
    }

  </style>

</head>


<body>


  <div class="login-container">


    <img
      src="images/logo.png"
      class="logo"
      alt="P2P Social Logo"
    >


    <h1>
      Welcome Back
    </h1>


    <p class="subtitle">
      Login to P2P Social
    </p>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >


      <div
        id="message"
        class="message"
      ></div>


      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>

    </form>


    <div class="divider">
      OR
    </div>


    <button
      type="button"
      id="googleButton"
      class="google-btn"
    >
      Continue with Google
    </button>


    <div class="register">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>


  </div>


  <script>

    // =========================================
    // SUPABASE CONFIG
    // =========================================

    const SUPABASE_URL =
      "https://mbsvuwrgigqfporxwpfr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =========================================
    // ELEMENTS
    // =========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const googleButton =
      document.getElementById("googleButton");

    const message =
      document.getElementById("message");


    // =========================================
    // MESSAGE
    // =========================================

    function showMessage(text, color) {

      message.textContent = text;

      message.style.color = color;

    }


    // =========================================
    // EMAIL + PASSWORD LOGIN
    // =========================================

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        showMessage(
          "Please wait...",
          "#2563eb"
        );


        try {

          const {
            data,
            error
          } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


          if (error) {

            throw error;

          }


          console.log(
            "Logged in user:",
            data.user
          );


          showMessage(
            "Login successful!",
            "green"
          );


          setTimeout(
            function() {

              window.location.href =
                "profile.html";

            },
            500
          );


        } catch (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Login failed.",
            "red"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";

        }

      }
    );


    // =========================================
    // GOOGLE LOGIN
    // =========================================

    googleButton.addEventListener(
      "click",
      async function() {

        googleButton.disabled = true;

        googleButton.textContent =
          "Connecting to Google...";


        const {
          error
        } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                window.location.origin +
                "/profile.html"

            }

          });


        if (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Google login failed.",
            "red"
          );


          googleButton.disabled =
            false;

          googleButton.textContent =
            "Continue with Google";

        }

      }
    );


    // =========================================
    // CHECK EXISTING SESSION
    // =========================================

    async function checkSession() {

      const {
        data: {
          session
        }
      } =
      await supabaseClient.auth
        .getSession();


      if (session) {

        window.location.href =
          "profile.html";

      }

    }


    checkSession();


  </script>


</body>

</html>
