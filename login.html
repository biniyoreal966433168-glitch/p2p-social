<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const googleButton =
  document.getElementById("googleButton");

const message =
  document.getElementById("message");


function showMessage(text, color) {

  message.textContent = text;
  message.style.color = color;

}


/*
=========================================
GOOGLE LOGIN DISABLED FOR NOW
=========================================

The Google function is kept here for later.
The button is hidden until you enable Google
provider in Supabase.
*/

googleButton.style.display = "none";


/*
=========================================
EMAIL + PASSWORD LOGIN
=========================================
*/

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "red"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";


    showMessage(
      "Checking your account...",
      "#2563eb"
    );


    try {

      /*
      =====================================
      SUPABASE AUTH LOGIN
      =====================================
      */

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      if (!data.user) {

        throw new Error(
          "Login failed."
        );

      }


      /*
      =====================================
      LOGIN SUCCESS
      =====================================
      */

      showMessage(
        "Login successful!",
        "green"
      );


      /*
      =====================================
      GO TO DASHBOARD
      =====================================
      */

      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        700
      );


    } catch (error) {

      console.error(
        "Login error:",
        error
      );


      let errorMessage =
        "Login failed. Please check your email and password.";


      if (error.message) {

        const msg =
          error.message.toLowerCase();


        if (
          msg.includes("invalid login credentials")
        ) {

          errorMessage =
            "Incorrect email or password.";

        }
        else if (
          msg.includes("email not confirmed")
        ) {

          errorMessage =
            "Please verify your email before logging in.";

        }
        else {

          errorMessage =
            error.message;

        }

      }


      showMessage(
        errorMessage,
        "red"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/*
=========================================
GOOGLE OAUTH — READY FOR LATER
=========================================

Do NOT enable the button yet.

When Google authentication is configured
in Supabase, you can show the button and
use this function.
*/

async function loginWithGoogle() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .signInWithOAuth({

        provider: "google",

        options: {

          redirectTo:
            window.location.origin +
            "/dashboard.html"

        }

      });


    if (error) {

      throw error;

    }

  } catch (error) {

    console.error(
      "Google login error:",
      error
    );

  }

}


/*
=========================================
CHECK EXISTING SESSION
=========================================
*/

async function checkSession() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      return;

    }


    if (data.session) {

      window.location.href =
        "dashboard.html";

    }

  } catch (error) {

    console.error(
      "Session check failed:",
      error
    );

  }

}


checkSession();

</script>
