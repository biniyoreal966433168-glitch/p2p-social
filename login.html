<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - P2P Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00c853, #00a844);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #00b84f;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn {
      background: #00b84f;
      color: white;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-btn {
      margin-top: 12px;
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #c62828;
    }

    .success {
      display: block;
      background: #e8f8ee;
      color: #16833b;
    }

    .mfa {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .mfa input {
      text-align: center;
      letter-spacing: 8px;
      font-size: 22px;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: #00a844;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">P2P</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">Login to P2P Social</p>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
      autocomplete="email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
      autocomplete="current-password"
    >

    <button
      type="submit"
      id="loginButton"
      class="login-btn"
    >
      Login
    </button>

  </form>

  <button
    type="button"
    id="googleButton"
    class="google-btn"
  >
    Continue with Google
  </button>

  <div id="mfaSection" class="mfa">

    <h3 style="text-align:center;margin-bottom:10px;">
      Two-Factor Authentication
    </h3>

    <p style="text-align:center;color:#777;font-size:14px;margin-bottom:15px;">
      Enter the 6-digit code from your authenticator app.
    </p>

    <input
      type="text"
      id="mfaCode"
      maxlength="6"
      inputmode="numeric"
      placeholder="000000"
    >

    <button
      type="button"
      id="mfaButton"
      class="login-btn"
    >
      Verify Code
    </button>

  </div>

  <div class="links">
    Don't have an account?
    <a href="register.html">Create account</a>
  </div>

  <div class="back">
    <a href="index.html">← Back to Home</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const googleButton =
  document.getElementById("googleButton");

const message =
  document.getElementById("message");

const mfaSection =
  document.getElementById("mfaSection");

const mfaCode =
  document.getElementById("mfaCode");

const mfaButton =
  document.getElementById("mfaButton");


let currentFactor = null;
let currentChallenge = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "error") {

  message.textContent = text;

  message.className =
    "message " + type;
}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if (!email || !password) {

    showMessage(
      "Please enter your email and password."
    );

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent = "Logging in...";

  message.className = "message";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      console.error("LOGIN ERROR:", error);

      /*
        IMPORTANT:
        Do NOT redirect when login fails.
      */

      if (
        error.message
          .toLowerCase()
          .includes("invalid login credentials")
      ) {

        showMessage(
          "Incorrect email or password."
        );

      } else if (
        error.message
          .toLowerCase()
          .includes("email not confirmed")
      ) {

        showMessage(
          "Please confirm your email before logging in."
        );

      } else {

        showMessage(
          error.message
        );
      }

      loginButton.disabled = false;

      loginButton.textContent = "Login";

      return;
    }


    if (!data || !data.session || !data.user) {

      showMessage(
        "Login failed. No active session was created."
      );

      loginButton.disabled = false;

      loginButton.textContent = "Login";

      return;
    }


    /*
      Check email confirmation.
    */

    if (!data.user.email_confirmed_at) {

      await supabaseClient.auth.signOut();

      showMessage(
        "Please confirm your email before continuing."
      );

      loginButton.disabled = false;

      loginButton.textContent = "Login";

      return;
    }


    /*
      Check MFA.
    */

    await checkMFA();

  } catch (error) {

    console.error(error);

    showMessage(
      "Login error: " + error.message
    );

    loginButton.disabled = false;

    loginButton.textContent = "Login";
  }

});


/* =========================
   MFA
========================= */

async function checkMFA() {

  try {

    const { data, error } =
      await supabaseClient.auth.listFactors();

    if (error) {

      console.error(
        "MFA LIST ERROR:",
        error
      );

      redirectAfterLogin();

      return;
    }


    const verifiedFactors =
      (data.totp || []).filter(
        factor => factor.status === "verified"
      );


    /*
      No MFA
    */

    if (verifiedFactors.length === 0) {

      redirectAfterLogin();

      return;
    }


    /*
      MFA exists
    */

    currentFactor =
      verifiedFactors[0];


    const { data: challengeData, error: challengeError } =
      await supabaseClient.auth.challenge({
        factorId: currentFactor.id
      });


    if (challengeError) {

      console.error(
        "MFA CHALLENGE ERROR:",
        challengeError
      );

      showMessage(
        "Could not start MFA verification."
      );

      loginButton.disabled = false;

      loginButton.textContent = "Login";

      return;
    }


    currentChallenge =
      challengeData;


    mfaSection.style.display = "block";

    loginForm.style.display = "none";

    googleButton.style.display = "none";

    showMessage(
      "Enter your 6-digit authentication code.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      "MFA error: " + error.message
    );

  }

}


/* =========================
   VERIFY MFA
========================= */

mfaButton.addEventListener(
  "click",
  async function() {

    const code =
      mfaCode.value.trim();


    if (!/^\d{6}$/.test(code)) {

      showMessage(
        "Enter a valid 6-digit code."
      );

      return;
    }


    mfaButton.disabled = true;

    mfaButton.textContent =
      "Verifying...";


    try {

      const { error } =
        await supabaseClient.auth.verify({
          factorId: currentFactor.id,
          challengeId: currentChallenge.id,
          code: code
        });


      if (error) {

        console.error(
          "MFA VERIFY ERROR:",
          error
        );

        showMessage(
          "Incorrect authentication code."
        );

        mfaButton.disabled = false;

        mfaButton.textContent =
          "Verify Code";

        return;
      }


      showMessage(
        "Login successful!",
        "success"
      );


      setTimeout(
        redirectAfterLogin,
        500
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "MFA error: " + error.message
      );

      mfaButton.disabled = false;

      mfaButton.textContent =
        "Verify Code";
    }

  }
);


/* =========================
   GOOGLE LOGIN
========================= */

googleButton.addEventListener(
  "click",
  async function() {

    googleButton.disabled = true;

    googleButton.textContent =
      "Connecting...";


    try {

      const { error } =
        await supabaseClient.auth.signInWithOAuth({

          provider: "google",

          options: {

            redirectTo:
              window.location.origin +
              "/login.html"

          }

        });


      if (error) {

        console.error(
          "GOOGLE ERROR:",
          error
        );

        showMessage(
          "Google login error: " +
          error.message
        );

        googleButton.disabled = false;

        googleButton.textContent =
          "Continue with Google";
      }

    } catch (error) {

      console.error(error);

      showMessage(
        "Google login error: " +
        error.message
      );

      googleButton.disabled = false;

      googleButton.textContent =
        "Continue with Google";
    }

  }
);


/* =========================
   EXISTING SESSION
========================= */

async function checkExistingSession() {

  try {

    const { data, error } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

      return;
    }


    const session =
      data.session;


    /*
      No session = stay on login page.
    */

    if (!session) {

      return;
    }


    /*
      User already logged in.
      Do NOT immediately redirect here
      before OAuth/MFA processing.
    */

    const user =
      session.user;


    if (
      user &&
      user.email_confirmed_at
    ) {

      const { data: aalData } =
        await supabaseClient.auth
          .getAuthenticatorAssuranceLevel();


      /*
        If MFA is already satisfied,
        go to home.
      */

      if (
        aalData &&
        aalData.currentLevel === "aal2"
      ) {

        redirectAfterLogin();

      }

    }

  } catch (error) {

    console.error(
      "SESSION ERROR:",
      error
    );

  }

}


/* =========================
   REDIRECT
========================= */

function redirectAfterLogin() {

  /*
    IMPORTANT:
    Login should always go here.
  */

  window.location.replace(
    "index.html"
  );

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    console.log(
      "AUTH EVENT:",
      event
    );

    console.log(
      "SESSION:",
      session
    );

  }
);


/* =========================
   START
========================= */

checkExistingSession();

</script>

</body>
</html>
