/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;

let realtimeChannel = null;
let unreadChannel = null;
let notificationChannel = null;

let searchTimer = null;
let actionLock = false;

let editingMessageId = null;


/* =====================================================
   RUN ONCE
===================================================== */

function runOnce(action){

  if(actionLock) return;

  actionLock = true;

  try{

    const result = action();

    if(
      result &&
      typeof result.finally === "function"
    ){

      result.finally(() => {

        setTimeout(() => {
          actionLock = false;
        },350);

      });

      return;
    }

  }catch(error){

    console.error(error);

  }

  setTimeout(() => {
    actionLock = false;
  },350);
}


/* =====================================================
   START
===================================================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    return;
  }

  if(!data.session){

    window.location.replace(
      "login.html"
    );

    return;
  }

  currentUser =
    data.session.user;

  await updateAuthUI();
  await loadConversations();
  await updateUnreadCount();
  await loadNotifications();

  subscribeGlobalRealtime();
  subscribeNotificationRealtime();
}


/* =====================================================
   AUTH UI
===================================================== */

async function updateAuthUI(){

  document.getElementById("loginBtn")
    .style.display = "none";

  document.getElementById("registerBtn")
    .style.display = "none";

  document.getElementById("logoutBtn")
    .style.display = "block";

  document.getElementById("userInfo")
    .style.display = "block";

  let username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const {
    data:profile
  } =
  await supabaseClient
    .from("profiles")
    .select("username")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(profile?.username){
    username = profile.username;
  }

  document.getElementById(
    "usernameDisplay"
  ).textContent = username;
}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations(){

  if(!currentUser) return;

  const list =
    document.getElementById("chatList");

  const empty =
    document.getElementById("empty");

  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  empty.style.display = "none";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      {ascending:false}
    );

  if(error){

    list.innerHTML =
      `<div class="loading">
        Could not load conversations.<br>
        <small>${escapeHTML(error.message)}</small>
      </div>`;

    return;
  }

  list.innerHTML = "";

  if(!data || data.length === 0){

    empty.style.display = "block";
    return;
  }

  for(const conversation of data){

    const otherId =
      conversation.user_one === currentUser.id
        ? conversation.user_two
        : conversation.user_one;

    await createConversationItem(
      conversation,
      otherId,
      list
    );
  }
}


/* =====================================================
   CONVERSATION ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
){

  const {
    data:profile
  } =
  await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",otherId)
    .maybeSingle();

  const name =
    profile?.username || "User";

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";


  const {
    data:last
  } =
  await supabaseClient
    .from("messages")
    .select("content,created_at,sender_id")
    .eq("conversation_id",conversation.id)
    .order("created_at",{ascending:false})
    .limit(1);


  const {
    count:unreadCount
  } =
  await supabaseClient
    .from("messages")
    .select("id",{count:"exact",head:true})
    .eq("conversation_id",conversation.id)
    .neq("sender_id",currentUser.id)
    .is("read_at",null);


  const unread =
    unreadCount || 0;

  const lastMessage =
    last?.length ? last[0] : null;

  const lastText =
    lastMessage
      ? lastMessage.content
      : "Start a conversation";

  const lastTime =
    lastMessage
      ? formatTime(lastMessage.created_at)
      : "";


  const item =
    document.createElement("div");

  item.className = "chat-item";
  item.dataset.unread = String(unread);

  if(unread > 0){
    item.classList.add("has-unread");
  }

  item.innerHTML = `

    <img class="avatar"
         src="${escapeHTML(avatar)}"
         alt="Profile">

    <div class="chat-info">

      <div class="chat-top">
        <span class="chat-name">
          ${escapeHTML(name)}
        </span>
      </div>

      <div class="chat-preview">
        ${escapeHTML(lastText)}
      </div>

    </div>

    <div class="chat-right">

      <div class="chat-time">
        ${escapeHTML(lastTime)}
      </div>

      <span class="unread-badge"
        style="${
          unread > 0
            ? "display:flex;"
            : "display:none;"
        }">

        ${unread > 99 ? "99+" : unread}

      </span>

    </div>
  `;

  item.addEventListener("click",() => {

    runOnce(() =>
      openConversation(
        conversation,
        profile || {
          id:otherId,
          username:"User",
          avatar_url:"images/profile.png"
        }
      )
    );

  });

  list.appendChild(item);
}


/* =====================================================
   SEARCH USERNAME
===================================================== */

function searchUsers(){

  clearTimeout(searchTimer);

  const input =
    document.getElementById("searchInput");

  const results =
    document.getElementById("searchResults");

  const query =
    input.value.trim();

  if(!query){

    results.style.display = "none";
    results.innerHTML = "";
    return;
  }

  searchTimer =
    setTimeout(async () => {

      if(!currentUser) return;

      const {
        data,
        error
      } =
      await supabaseClient
        .from("profiles")
        .select("id,username,avatar_url")
        .ilike(
          "username",
          "%" + query + "%"
        )
        .neq("id",currentUser.id)
        .limit(10);

      results.innerHTML = "";

      if(error){

        results.innerHTML =
          `<div class="loading">
            Search failed.
          </div>`;

      }else if(!data || data.length === 0){

        results.innerHTML =
          `<div class="loading">
            No username found.
          </div>`;

      }else{

        data.forEach(profile => {

          const user =
            document.createElement("div");

          user.className = "search-user";

          user.innerHTML = `

            <img
              src="${
                escapeHTML(
                  profile.avatar_url ||
                  "images/profile.png"
                )
              }">

            <div class="search-info">

              <div class="search-name">
                ${escapeHTML(
                  profile.username || "User"
                )}
              </div>

              <div class="search-id">
                @${escapeHTML(
                  profile.username || "user"
                )}
              </div>

            </div>

          `;

          user.addEventListener("click",() => {

            runOnce(() =>
              startConversation(profile)
            );

          });

          results.appendChild(user);

        });
      }

      results.style.display = "block";

    },300);
}


/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(profile){

  if(!currentUser || !profile?.id) return;

  const otherId = profile.id;

  const userOne =
    currentUser.id < otherId
      ? currentUser.id
      : otherId;

  const userTwo =
    currentUser.id < otherId
      ? otherId
      : currentUser.id;


  const {
    data:existing,
    error:findError
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .eq("user_one",userOne)
    .eq("user_two",userTwo)
    .maybeSingle();

  if(findError){

    alert(
      "Conversation error: " +
      findError.message
    );

    return;
  }

  let conversation = existing;

  if(!conversation){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select()
      .single();

    if(error){

      alert(
        "Could not create conversation: " +
        error.message
      );

      return;
    }

    conversation = data;
  }

  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "searchResults"
  ).style.display = "none";

  await openConversation(
    conversation,
    profile
  );
}

}

async function loadMessages(){

/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  const container =
    document.getElementById(
      "messagesContainer"
    );

  const row =
    document.createElement("div");

  row.className = "message-row";

  const mine =
    message.sender_id === currentUser.id;

  if(mine){
    row.classList.add("mine");
  }

  const wrap =
    document.createElement("div");

  wrap.className =
    "message-bubble-wrap";


  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";


  const text =
    document.createElement("div");

  text.textContent =
    message.content || "";


  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    formatTime(message.created_at);


  if(message.edited_at){

    const edited =
      document.createElement("span");

    edited.className =
      "edited-label";

    edited.textContent =
      "edited";

    time.appendChild(edited);
  }


  bubble.appendChild(text);
  bubble.appendChild(time);


  const tools =
    document.createElement("div");

  tools.className =
    "message-tools";


  /* COPY */
  const copy =
    document.createElement("button");

  copy.className =
    "message-tool";

  copy.textContent =
    "📋 Copy";

  copy.onclick = () =>
    copyMessage(message.content);


  tools.appendChild(copy);


  /* EDIT OWN MESSAGE */
  if(mine){

    const edit =
      document.createElement("button");

    edit.className =
      "message-tool";

    edit.textContent =
      "✏️ Edit";

    edit.onclick = () =>
      beginEditMessage(message);

    tools.appendChild(edit);

  }


  wrap.appendChild(bubble);
  wrap.appendChild(tools);

  row.appendChild(wrap);

  container.appendChild(row);
}


/* =====================================================
   COPY / PASTE
===================================================== */

async function copyMessage(text){

  try{

    await navigator.clipboard.writeText(
      text || ""
    );

    showToast("📋 Message copied");

  }catch(error){

    const textarea =
      document.createElement("textarea");

    textarea.value =
      text || "";

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast("📋 Message copied");
  }
}

===================================================== */

function beginEditMessage(message){

  if(
    !message ||
    message.sender_id !== currentUser.id
  ){
    return;
  }

  editingMessageId =
    message.id;

  document.getElementById(
    "messageInput"
  ).value =
    message.content || "";

  document.getElementById(
    "editBar"
  ).style.display =
    "flex";

  document.getElementById(
    "messageInput"
  ).focus();

}


function cancelEdit(){

  editingMessageId = null;

  document.getElementById(
    "editBar"
  ).style.display =
    "none";

  document.getElementById(
    "messageInput"
  ).value = "";
}


/* =====================================================
   UPDATE MESSAGE
===================================================== */

async function updateMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!editingMessageId){

    await sendNewMessage(text);

    return;
  }

  if(!text){

    alert(
      "Message cannot be empty."
    );

    return;
  }

  const messageId =
    editingMessageId;

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      content:text,
      edited_at:
        new Date().toISOString()
    })
    .eq("id",messageId)
    .eq("sender_id",currentUser.id);

  if(error){

    alert(
      "Could not edit message: " +
      error.message
    );

    return;
  }

  cancelEdit();

  await loadMessages();

  showToast("✏️ Message updated");
}

/* =====================================================
   REALTIME CHAT
===================================================== */

function subscribeRealtime(){

  if(!currentConversation) return;

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );
  }

  const conversationId =
    currentConversation.id;

  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        async payload => {

          if(
            currentConversation &&
            payload?.new &&
            payload.new.conversation_id ===
            currentConversation.id
          ){

            await loadMessages();
            await markConversationAsRead();
          }

        }
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        async () => {

          await loadMessages();

        }
      )
      .subscribe();
}


/* =====================================================
   GLOBAL REALTIME
===================================================== */

function subscribeGlobalRealtime(){

  if(!currentUser) return;

  if(unreadChannel){

    supabaseClient.removeChannel(
      unreadChannel
    );
  }

  unreadChannel =
    supabaseClient
      .channel(
        "global-messages-" +
        currentUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload => {

          if(!payload?.new) return;

          const message =
            payload.new;

          if(
            message.sender_id ===
            currentUser.id
          ){
            return;
          }

          if(
            currentConversation &&
            message.conversation_id ===
            currentConversation.id
          ){

            await markConversationAsRead();
            await loadMessages();

            return;
          }

          await updateUnreadCount();
          await loadConversations();

        }
      )
      .subscribe();
}


/* =====================================================
   READ / UNREAD
===================================================== */

async function updateUnreadCount(){

  if(!currentUser) return;

  const {
    data:conversations
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    );

  if(
    !conversations ||
    conversations.length === 0
  ){

    updateUnreadUI(0);
    return;
  }

  const ids =
    conversations.map(c => c.id);

  const {
    count
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .in("conversation_id",ids)
    .neq("sender_id",currentUser.id)
    .is("read_at",null);

  updateUnreadUI(count || 0);
}


function updateUnreadUI(count){

  const value =
    Number(count) || 0;

  const text =
    value > 99
      ? "99+"
      : String(value);

  const titleBadge =
    document.getElementById(
      "titleUnread"
    );

  const navBadge =
    document.getElementById(
      "messagesNavBadge"
    );

  if(value > 0){

    titleBadge.textContent = text;
    titleBadge.style.display =
      "inline-flex";

    navBadge.textContent = text;
    navBadge.style.display =
      "inline-flex";

  }else{

    titleBadge.style.display =
      "none";

    navBadge.style.display =
      "none";
  }
}


async function markConversationAsRead(){

  if(
    !currentUser ||
    !currentConversation
  ){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      read_at:
        new Date().toISOString()
    })
    .eq(
      "conversation_id",
      currentConversation.id
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is("read_at",null);

  if(error){

    console.error(error);
    return;
  }

  await updateUnreadCount();
}

async function loadNotifications(){

  const list =
    document.getElementById(
      "notificationList"

  const {
    data,
    error
  } =
  await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id",currentUser.id)
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(50);

  if(error){

    list.innerHTML =
      `<div style="padding:30px;text-align:center">
        Could not load notifications.
      </div>`;

    return;
  }

  list.innerHTML = "";

  if(!data || data.length === 0){

    list.innerHTML =
      `<div style="padding:35px;text-align:center;color:#89919d">
        🔔<br><br>
        No notifications yet.
      </div>`;

    updateNotificationBadge([]);

    return;
  }

  for(const notification of data){

    await renderNotification(
      notification,
      list
    );
  }

  updateNotificationBadge(data);
}


async function renderNotification(
  notification,
  list
){

  let profile = null;

  if(notification.sender_id){

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url")
      .eq("id",notification.sender_id)
      .maybeSingle();

    profile = data;
  }

  const item =
    document.createElement("div");

  item.className =
    "notification-item" +
    (
      notification.is_read
        ? ""
        : " unread"
    );

  item.innerHTML = `

    <img class="notification-avatar"
      src="${
        escapeHTML(
          profile?.avatar_url ||
          "images/profile.png"
        )
      }">

    <div class="notification-content">

      <div class="notification-text">

        ${
          profile?.username
            ? "<strong>" +
              escapeHTML(profile.username) +
              "</strong> "
            : ""
        }

        ${
          notification.title
            ? "<strong>" +
              escapeHTML(notification.title) +
              "</strong><br>"
            : ""
        }

        ${escapeHTML(
          notification.message ||
          "You have a new notification."
        )}

      </div>

      <div class="notification-time">
        ${formatNotificationTime(
          notification.created_at
        )}
      </div>

    </div>

  `;

  item.addEventListener("click",async () => {

    await markNotificationRead(
      notification.id
    );

  });

  list.appendChild(item);
}


function updateNotificationBadge(
  notifications
){

  const unread =

      item =>
        item.is_read === false ||
        item.is_read === null

  const badge =
    document.getElementById(
      "notificationBadge"
    );

  if(unread > 0){

    badge.textContent =
      unread > 99
        ? "99+"
        : String(unread);

    badge.style.display = "flex";

  }else{

    badge.textContent = "";
    badge.style.display = "none";
  }
}

  )){

  if(realtimeChannel)

      realtimeChannel
    );

  if(unreadChannel)
    await supabaseClient.removeChannel(
      unreadChannel
    );

  if(notificationChannel)
    await supabaseClient.removeChannel(
      notificationChannel
    );

  const {
    error
  } =
  await supabaseClient.auth.signOut();

  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;
  }

  window.location.replace(
    "index.html"
  );
}


/* =====================================================
   ENTER TO SEND
===================================================== */

function messageKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    runOnce(() =>
      sendMessage()
    );
  }
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.createElement("div");

  toast.textContent = message;

  toast.style.position = "fixed";
  toast.style.left = "50%";
  toast.style.bottom = "85px";
  toast.style.transform =
    "translateX(-50%)";
  toast.style.background =
    "#172033";
  toast.style.color = "white";
  toast.style.padding =
    "10px 16px";
  toast.style.borderRadius =
    "20px";
  toast.style.fontSize = "12px";
  toast.style.zIndex = "20000";
  toast.style.boxShadow =
    "0 5px 20px rgba(0,0,0,.2)";

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  },1800);
}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages(){

  const container =
    document.getElementById(
      "messagesContainer"
    );

  container.scrollTop =
    container.scrollHeight;
}


function formatTime(date){

  const value =
    new Date(date);

  if(isNaN(value.getTime()))
    return "";

  return value.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function formatNotificationTime(date){

  const value =
    new Date(date);

  if(isNaN(value.getTime()))
    return "";

  return value.toLocaleString(
    [],
    {
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}
