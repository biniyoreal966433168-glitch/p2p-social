<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --brand:#087f73;
    --brand-dark:#05665d;
    --bg:#f5f7f8;
    --card:#ffffff;
    --text:#172326;
    --muted:#748084;
    --border:#e3e8e9;
    --danger:#e53935;
    --green:#16a05d;
    --blue:#1976d2;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =====================================================
   APP
===================================================== */

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    height:62px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    flex-shrink:0;
    z-index:20;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:var(--brand);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.unread-badge{
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:20px;
    background:var(--danger);
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:340px;
    background:#fff;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
}

.sidebar-top{
    padding:13px;
    border-bottom:1px solid var(--border);
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    height:43px;
    border:1px solid var(--border);
    border-radius:13px;
    padding:0 42px 0 42px;
    outline:none;
    background:#f6f8f8;
    font-size:14px;
}

.search-box input:focus{
    border-color:var(--brand);
    background:#fff;
}

.search-icon{
    position:absolute;
    left:14px;
    top:12px;
    font-size:17px;
}

.clear-search{
    position:absolute;
    right:10px;
    top:8px;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#e8eeee;
    display:none;
}

.new-message-btn{
    margin-top:10px;
    width:100%;
    height:42px;
    border-radius:12px;
    background:var(--brand);
    color:#fff;
    font-weight:700;
    font-size:14px;
}

.new-message-btn:active{
    transform:scale(.98);
}

/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-results{
    border-bottom:1px solid var(--border);
    max-height:250px;
    overflow-y:auto;
}

.search-title{
    padding:10px 14px 5px;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.user-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 13px;
    cursor:pointer;
}

.user-row:hover{
    background:#f5f8f8;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#dce9e7;
    flex-shrink:0;
}

.avatar-small{
    width:38px;
    height:38px;
}

.avatar-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:var(--brand);
    font-weight:800;
}

.user-info{
    min-width:0;
    flex:1;
}

.username{
    font-size:14px;
    font-weight:750;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.user-plan{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

/* =====================================================
   CONVERSATIONS
===================================================== */

.conversations{
    flex:1;
    min-height:0;
    overflow-y:auto;
}

.section-label{
    padding:13px 14px 7px;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.conversation{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px 13px;
    cursor:pointer;
    border-left:3px solid transparent;
}

.conversation:hover{
    background:#f6f9f9;
}

.conversation.active{
    background:#eaf5f3;
    border-left-color:var(--brand);
}

.conversation-info{
    min-width:0;
    flex:1;
}

.conversation-line{
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.last-message{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.time{
    color:#9aa5a7;
    font-size:10px;
    white-space:nowrap;
}

.unread-count{
    min-width:19px;
    height:19px;
    border-radius:50%;
    background:var(--brand);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 5px;
    font-size:10px;
    font-weight:800;
}

.empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:13px;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#f3f6f6;
}

.chat-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
}

.chat-empty-icon{
    font-size:55px;
    margin-bottom:12px;
}

.chat-header{
    height:62px;
    flex-shrink:0;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 14px;
}

.back-mobile{
    display:none;
    background:none;
    font-size:22px;
}

.chat-user{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-weight:800;
    font-size:15px;
}

.chat-user-status{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.chat-actions{
    display:flex;
    gap:6px;
}

.action-btn{
    height:34px;
    padding:0 9px;
    border-radius:9px;
    background:#eef5f4;
    color:var(--brand);
    font-weight:700;
    font-size:11px;
}

/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.date-divider{
    align-self:center;
    background:#e0e6e6;
    color:#667274;
    border-radius:20px;
    padding:5px 10px;
    font-size:10px;
    margin:8px 0;
}

.message-row{
    display:flex;
    max-width:82%;
}

.message-row.mine{
    align-self:flex-end;
    justify-content:flex-end;
}

.message-row.theirs{
    align-self:flex-start;
}

.message-bubble{
    position:relative;
    padding:9px 11px;
    border-radius:15px;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    min-width:60px;
}

.mine .message-bubble{
    background:#d9f3ed;
    border-bottom-right-radius:4px;
}

.theirs .message-bubble{
    border-bottom-left-radius:4px;
}

.message-text{
    font-size:14px;
    line-height:1.42;
    white-space:pre-wrap;
    word-break:break-word;
    user-select:text;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    margin-top:4px;
    color:#7d898b;
    font-size:9px;
}

.edited{
    font-style:italic;
}

.check{
    font-size:11px;
    color:var(--brand);
}

.message-menu{
    position:absolute;
    right:0;
    bottom:calc(100% + 4px);
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    overflow:hidden;
    z-index:50;
    min-width:125px;
}

.message-menu button{
    width:100%;
    text-align:left;
    background:#fff;
    padding:9px 12px;
    font-size:12px;
}

.message-menu button:hover{
    background:#f2f5f5;
}

/* =====================================================
   MEDIA
===================================================== */

.media-image,
.media-video{
    max-width:280px;
    width:100%;
    border-radius:10px;
    display:block;
}

.media-video{
    background:#000;
}

.voice-player{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:210px;
}

.voice-play{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--brand);
    color:#fff;
}

.voice-duration{
    font-size:12px;
    color:#647072;
}

/* =====================================================
   COMPOSER
===================================================== */

.composer{
    background:#fff;
    border-top:1px solid var(--border);
    padding:9px;
    flex-shrink:0;
}

.reply-preview{
    display:none;
    background:#f3f6f6;
    border-left:3px solid var(--brand);
    padding:7px 9px;
    margin-bottom:7px;
    border-radius:7px;
    font-size:11px;
}

.composer-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.attach-btn,
.voice-btn,
.send-btn{
    width:39px;
    height:39px;
    border-radius:11px;
    flex-shrink:0;
}

.attach-btn{
    background:#eef3f3;
    font-size:18px;
}

.voice-btn{
    background:#edf5f3;
    color:var(--brand);
    font-size:17px;
}

.voice-btn.recording{
    background:#ffe9e9;
    color:var(--danger);
}

.send-btn{
    background:var(--brand);
    color:#fff;
    font-size:17px;
}

.message-input{
    flex:1;
    min-height:39px;
    max-height:130px;
    resize:none;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    padding:10px 11px;
    font-size:14px;
    line-height:1.35;
}

.message-input:focus{
    border-color:var(--brand);
}

.recording-bar{
    display:none;
    align-items:center;
    gap:10px;
    background:#fff0f0;
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:7px;
    color:var(--danger);
    font-size:12px;
    font-weight:700;
}

.recording-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--danger);
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{opacity:.25}
}

.stop-recording{
    margin-left:auto;
    background:var(--danger);
    color:#fff;
    padding:6px 9px;
    border-radius:7px;
    font-size:11px;
}

/* =====================================================
   PLAN BADGES
===================================================== */

.plan-badge{
    display:inline-flex;
    align-items:center;
    padding:3px 6px;
    border-radius:8px;
    font-size:9px;
    font-weight:800;
    margin-left:4px;
}

.plan-free{
    background:#eef1f1;
    color:#647072;
}

.plan-premium{
    background:#e9f6eb;
    color:#168342;
}

.plan-premium-plus{
    background:#e8f0ff;
    color:#1769c2;
}

.plan-premium-max{
    background:#f1e8ff;
    color:#7434ba;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:440px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:18px;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.close-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#eef2f2;
}

.profile-center{
    text-align:center;
    padding:10px;
}

.profile-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    background:#dce9e7;
}

.profile-name{
    font-size:18px;
    font-weight:800;
    margin-top:10px;
}

.profile-username{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

/* =====================================================
   MEDIA CHOOSER
===================================================== */

.media-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.media-option{
    background:#f4f7f7;
    border-radius:12px;
    padding:15px 7px;
    text-align:center;
    font-size:12px;
    font-weight:700;
}

.media-option span{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.media-option.locked{
    opacity:.45;
}

.permission-note{
    margin-top:12px;
    padding:10px;
    background:#f5f7f7;
    border-radius:10px;
    color:#697577;
    font-size:11px;
    line-height:1.4;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:78px;
    transform:translateX(-50%) translateY(15px);
    background:#172326;
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =====================================================
   NAVIGATION
===================================================== */

.bottom-nav{
    height:63px;
    flex-shrink:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
}

.nav-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    color:#7c8789;
    text-decoration:none;
    font-size:10px;
    font-weight:700;
}

.nav-icon{
    font-size:20px;
}

.nav-item.active{
    color:var(--brand);
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;
    padding:25px;
    color:var(--muted);
    font-size:12px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:760px){

    .sidebar{
        width:100%;
    }

    .chat{
        position:fixed;
        inset:62px 0 63px 0;
        display:none;
        z-index:15;
    }

    body.mobile-chat-open .sidebar{
        display:none;
    }

    body.mobile-chat-open .chat{
        display:flex;
    }

    .back-mobile{
        display:block;
    }

    .chat-actions .action-btn{
        padding:0 7px;
        font-size:10px;
    }

    .message-row{
        max-width:90%;
    }
}

/* =====================================================
   DESKTOP NAV
===================================================== */

@media(min-width:761px){
    .bottom-nav{
        height:55px;
    }

    .nav-item{
        flex-direction:row;
        gap:6px;
        font-size:11px;
    }

    .nav-icon{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">
    <div class="logo">💬 Messages</div>

    <div class="header-right">
        <span id="globalUnreadBadge" class="unread-badge">0</span>
        <button id="profileHeaderBtn" class="action-btn">👤 Profile</button>
    </div>
</header>


<!-- ===================================================
     MAIN
=================================================== -->

<main class="main">

<!-- ===================================================
     SIDEBAR
=================================================== -->

<section class="sidebar">

    <div class="sidebar-top">

        <div class="search-box">
            <span class="search-icon">🔍</span>

            <input
                id="userSearch"
                type="text"
                autocomplete="off"
                placeholder="Search username..."
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
            >×</button>
        </div>

        <button
            id="newMessageBtn"
            class="new-message-btn"
        >
            ➕ New message
        </button>

    </div>


    <div id="searchResults" class="search-results hidden"></div>


    <div class="conversations">

        <div class="section-label">
            💬 Conversations
        </div>

        <div id="conversationList">
            <div class="loading">
                Loading conversations...
            </div>
        </div>

    </div>

</section>


<!-- ===================================================
     CHAT
=================================================== -->

<section class="chat">

    <div id="chatEmpty" class="chat-empty">

        <div>
            <div class="chat-empty-icon">💬</div>

            <strong>Select a conversation</strong>

            <p style="margin-top:7px;font-size:12px;">
                Search for a username or start a new message.
            </p>
        </div>

    </div>


    <div id="chatContent" class="hidden" style="height:100%;display:flex;flex-direction:column;">

        <!-- CHAT HEADER -->

        <div class="chat-header">

            <button
                id="backMobile"
                class="back-mobile"
                type="button"
            >‹</button>

            <img
                id="chatAvatar"
                class="avatar"
                src=""
                alt=""
            >

            <div class="chat-user">

                <div id="chatUsername" class="chat-user-name">
                    Username
                </div>

                <div id="chatStatus" class="chat-user-status">
                    Offline
                </div>

            </div>

            <div class="chat-actions">

                <button
                    id="sendActionBtn"
                    class="action-btn"
                    type="button"
                >
                    💎 Send
                </button>

                <button
                    id="buyActionBtn"
                    class="action-btn"
                    type="button"
                >
                    🟢 Buy
                </button>

                <button
                    id="tradeActionBtn"
                    class="action-btn"
                    type="button"
                >
                    🤝 Trade
                </button>

            </div>

        </div>


        <!-- MESSAGES -->

        <div id="messages" class="messages">
        </div>


        <!-- COMPOSER -->

        <div class="composer">

            <div id="recordingBar" class="recording-bar">

                <span class="recording-dot"></span>

                <span id="recordingTime">
                    Recording 00:00
                </span>

                <button
                    id="stopRecording"
                    class="stop-recording"
                    type="button"
                >
                    Stop
                </button>

            </div>


            <div id="replyPreview" class="reply-preview">
            </div>


            <div class="composer-row">

                <button
                    id="attachBtn"
                    class="attach-btn"
                    type="button"
                    title="Attach"
                >
                    📎
                </button>

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Write a message..."
                ></textarea>

                <button
                    id="voiceBtn"
                    class="voice-btn"
                    type="button"
                    title="Voice"
                >
                    🎤
                </button>

                <button
                    id="sendBtn"
                    class="send-btn"
                    type="button"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>

</section>

</main>


<!-- ===================================================
     BOTTOM NAV
=================================================== -->

<nav class="bottom-nav">

    <a class="nav-item" href="index.html">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
    </a>

    <a class="nav-item" href="live.html">
        <span class="nav-icon">🔴</span>
        <span>Live</span>
    </a>

    <a class="nav-item" href="p2p.html">
        <span class="nav-icon">🔄</span>
        <span>P2P</span>
    </a>

    <a class="nav-item active" href="message.html">
        <span class="nav-icon">💬</span>
        <span>Messages</span>
    </a>

    <a class="nav-item" href="profile.html">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
    </a>

</nav>

</div>


<!-- ===================================================
     MEDIA MODAL
=================================================== -->

<div id="mediaModal" class="modal">

    <div class="modal-card">

        <div class="modal-head">

            <div class="modal-title">
                Send media
            </div>

            <button
                class="close-btn"
                type="button"
                onclick="closeModal('mediaModal')"
            >
                ×
            </button>

        </div>


        <div class="media-options">

            <button
                id="photoOption"
                class="media-option"
                type="button"
            >

/* =====================================================
   PLAN
===================================================== */

function normalizePlan(plan){

    if(!plan)
        return "Free";

    const p =
        String(plan)
        .toLowerCase()
        .replace(/[\s_-]/g,"");


    if(
        p === "premiummax" ||
        p === "premium_max"
    )
        return "Premium Max";


    if(
        p === "premium+" ||
        p === "premiumplus" ||
        p === "premium_plus"
    )
        return "Premium+";


    if(p === "premium")
        return "Premium";


    return "Free";
}


function getPlan(){

    return normalizePlan(
        currentProfile?.plan
    );

}


function canSendPhoto(){

    const plan = getPlan();

    return (
        plan === "Premium" ||
        plan === "Premium+" ||
        plan === "Premium Max"
    );

}


function canSendVideo(){

    const plan = getPlan();

    return (
        plan === "Premium+" ||
        plan === "Premium Max"
    );

}


function canSendFile(){

    return getPlan() === "Premium Max";

}


/*
 Free:
 Text YES
 Voice YES
 Photo P2P confirmation only
 Video NO
 File NO

 Premium:
 Text YES
 Voice YES
 Photo YES
 Video NO
 File NO

 Premium+:
 Text YES

 Photo YES
 Video YES

 Premium Max:
 Text YES

*/

function updateMediaPermissions(){

    const photo =
        document.getElementById("photoOption");

    const video =
        document.getElementById("videoOption");

    const file =
        document.getElementById("fileOption");

    photo.classList.toggle(
        "locked",
        !canSendPhoto()

    video.classList.toggle(
        "locked",
        !canSendVideo()
    );

    file.classList.toggle(
        "locked",
        !canSendFile()
    );


    let note = "";


    if(getPlan() === "Free"){

        note =
            "🆓 Free: Text and voice are available. " +
            "📷 Photos are restricted to P2P transaction confirmation only. " +
            "🎥 Video and 📎 File are unavailable.";

    }
    else if(getPlan() === "Premium"){

        note =
            "🟢 Premium: Text, voice and photos are available. " +
            "🎥 Video and 📎 File are unavailable.";

    }
    else if(getPlan() === "Premium+"){

        note =
            "🔵 Premium+: Text, voice, photos and videos are available. " +
            "📎 File is unavailable.";

    }
    else{

        note =
            "🟣 Premium Max: Text, voice, photos, videos and files are available.";

    }


    document.getElementById(
        "permissionNote"
    ).textContent = note;

}

async function loadConversations(){

    conversationList.innerHTML =
        `<div class="loading">
            Loading conversations...
        </div>`;


    /*
      Expected conversations structure:

      id
      user1_id
      user2_id
      updated_at
    */


    const {
        data,
        error
    } = await supabaseClient
        .from("conversations")
        .select("*")
        .or(
            `user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`
        )
        .order(
            "updated_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        conversationList.innerHTML =
            `<div class="empty">
                No conversations yet.
            </div>`;

        return;
    }


    conversations =
        data || [];


    if(conversations.length === 0){

        conversationList.innerHTML =
            `<div class="empty">
                No conversations yet.<br><br>
                Use ➕ New message.
            </div>`;

        return;
    }


    const userIds =
        conversations.map(c =>
            c.user1_id === currentUser.id
                ? c.user2_id
                : c.user1_id
        );


    const {
        data:profiles
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .in("id",userIds);


    const profileMap = {};


    (profiles || []).forEach(
        p=>{
            profileMap[p.id] = p;
        }
    );


    const html = [];


    for(const conversation of conversations){

        const otherId =
            conversation.user1_id === currentUser.id
                ? conversation.user2_id
                : conversation.user1_id;


        const user =
            profileMap[otherId];


        if(!user)
            continue;


        const last =
            await getLastMessage(
                conversation.id
            );


        html.push(
            renderConversation(
                conversation,
                user,
                last
            )
        );

    }


    conversationList.innerHTML =
        html.join("") ||
        `<div class="empty">
            No conversations yet.
        </div>`;

}


async function getLastMessage(

){

    const {
        data
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(1)
        .maybeSingle();


    return data || null;

}

){

        last &&

        else if(last.message_type === "video")
            preview = "🎥 Video";

        else if(last.message_type === "file")
            preview = "📎 File";

        else
            preview =
                last.content ||
                "Message";

    }


    const time =
        last
            ? formatShortTime(
                last.created_at
              )
            : "";


    return `
        <div
            class="conversation ${
                selectedConversationId === conversation.id
                    ? "active"
                    : ""
            }"
            onclick='openConversationFromList(
                ${JSON.stringify(
                    sanitizeForHTML(conversation)

                        )}

                                ${unread}
                               </span>`

    const {

/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(!selectedConversationId)
        return;


    messagesBox.innerHTML =
        `<div class="loading">
            Loading messages...
        </div>`;


    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "conversation_id",
            selectedConversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        messagesBox.innerHTML =
            `<div class="empty">
                Could not load messages.
            </div>`;

        return;
    }


    messagesBox.innerHTML = "";


    let lastDate = "";


    (data || []).forEach(
        message=>{

            const date =
                formatDate(
                    message.created_at
                );


            if(date !== lastDate){

                const divider =
                    document.createElement(
                        "div"
                    );

                divider.className =
                    "date-divider";

                divider.textContent =
                    date;

                messagesBox.appendChild(
                    divider
                );

                lastDate = date;

            }


            messagesBox.insertAdjacentHTML(
                "beforeend",
                renderMessage(message)
            );

        }
    );


    scrollMessages();


    await markConversationRead();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

    const mine =
        message.sender_id ===
        currentUser.id;


    const type =
        message.message_type ||
        "text";


    let body = "";


    if(type === "text"){

        body =
            `<div class="message-text">
                ${escapeHTML(
                    message.content || ""
                )}
            </div>`;

    }


    else if(type === "photo"){

        body =
            `<img
                class="media-image"
                src="${safeUrl(
                    message.media_url
                )}"
                alt="Photo"
                loading="lazy"
            >`;


        if(message.content){

            body +=
                `<div
                    class="message-text"
                    style="margin-top:6px;"
                >
                    ${escapeHTML(
                        message.content
                    )}
                </div>`;

        }

    }


    else if(type === "video"){

        body =
            `<video
                class="media-video"
                controls
                preload="metadata"
                src="${safeUrl(
                    message.media_url
                )}"
            ></video>`;

    }


    else if(type === "voice"){

        body =
            `<div class="voice-player">

                <button
                    class="voice-play"
                    onclick="playVoice(
                        this,
                        '${escapeAttribute(
                            message.media_url
                        )}'
                    )"
                >
                    ▶
                </button>

                <span class="voice-duration">
                    🎤 Voice
                </span>

            </div>`;

    }


    else if(type === "file"){

        body =
            `<a
                href="${safeUrl(
                    message.media_url
                )}"
                target="_blank"
                rel="noopener"
                style="
                    color:var(--brand);
                    font-weight:700;
                    text-decoration:none;
                "
            >
                📎 ${
                    escapeHTML(
                        message.file_name ||
                        "Open file"
                    )
                }
            </a>`;

    }


    const edited =
        message.edited_at
            ? `<span class="edited">
                edited
               </span>`
            : "";


    const read =
        mine
            ? (
                message.read_at
                    ? `<span
                        class="check"
                        title="Read"
                       >✓✓</span>`
                    : `<span
                        class="check"
                        title="Sent"
                       >✓</span>`
              )
            : "";


    return `
        <div
            class="message-row ${
                mine
                    ? "mine"
                    : "theirs"
            }"
            id="message-${message.id}"
        >

            <div class="message-bubble">

                ${body}

                <div class="message-meta">

                    ${edited}

                    <span>
                        ${formatTime(
                            message.created_at
                        )}
                    </span>

                    ${read}

                </div>


                <button
                    onclick="toggleMessageMenu(
                        '${escapeAttribute(
                            message.id
                        )}'
                    )"
                    style="
                        position:absolute;
                        right:4px;
                        top:4px;
                        width:20px;
                        height:20px;
                        border-radius:50%;
                        background:transparent;
                        color:#849092;
                        font-size:15px;
                    "
                >
                    ⋮
                </button>


                <div
                    id="menu-${message.id}"
                    class="message-menu hidden"
                >

                    <button
                        onclick="copyMessage(
                            '${escapeAttribute(
                                message.id
                            )}'
                        )"
                    >
                        📋 Copy
                    </button>

                    ${
                        mine && type === "text"
                            ? `
                            <button
                                onclick="editMessage(
                                    '${escapeAttribute(
                                        message.id
                                    )}',
                                    ${JSON.stringify(
                                        message.content || ""
                                    )}
                                )"
                            >
                                ✏️ Edit
                            </button>
                            `
                            : ""
                    }

                    ${
                        mine
                            ? `
                            <button
                                onclick="deleteMessage(
                                    '${escapeAttribute(
                                        message.id
                                    )}'
                                )"
                            >
                                🗑️ Delete
                            </button>
                            `
                            : ""
                    }

                </div>

            </div>

        </div>
    `;

}

===================================================== */

sendBtn.addEventListener(
    "click",
    sendTextMessage
);


messageInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendTextMessage();

        }

    }
);


messageInput.addEventListener(
    "input",
    function(){

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);


async function sendTextMessage(){

    if(!selectedUser)
        return;


    const content =
        messageInput.value.trim();


    if(!content)
        return;


    if(editingMessageId){

        await updateMessage(
            editingMessageId,
            content
        );

        return;
    }


    const conversation =
        selectedConversationId;


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                conversation,

            sender_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            content:
                content,

            message_type:
                "text"

        });


    if(error){

        console.error(error);

        showToast(
            "Message could not be sent."
        );

        return;
    }


    messageInput.value = "";

    messageInput.style.height =
        "auto";


    await updateConversationTime();

}


/* =====================================================
   UPDATE MESSAGE
===================================================== */

async function updateMessage(
    messageId,
    content
){

    const {
        error
    } = await supabaseClient
        .from("messages")
        .update({

            content:
                content,

            edited_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            messageId
        )
        .eq(
            "sender_id",
            currentUser.id
        );


    if(error){

        console.error(error);

        showToast(
            "Could not edit message."
        );

        return;
    }


    editingMessageId = null;

    messageInput.value = "";

    showToast("Message edited.");

    await loadMessages();

}


/* =====================================================
   EDIT
===================================================== */

function editMessage(
    id,
    content
){

    editingMessageId = id;

    messageInput.value =
        content || "";

    messageInput.focus();

    messageInput.dispatchEvent(
        new Event("input")
    );


    showToast(
        "Editing message. Send to save."

        .from("messages")

/* =====================================================
   VOICE RECORDING
===================================================== */

voiceBtn.addEventListener(
    "click",
    async function(){

        if(mediaRecorder){

            stopVoiceRecording();

            return;
        }


        try{

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true
                    });


            audioChunks = [];


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            mediaRecorder.ondataavailable =
                event=>{

                    if(event.data.size > 0)
                        audioChunks.push(
                            event.data
                        );

                };


            mediaRecorder.onstop =
                async ()=>{

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );


                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );


                    await uploadVoice(
                        blob
                    );

                };


            mediaRecorder.start();

            recordingSeconds = 0;

            recordingBar.style.display =
                "flex";

            voiceBtn.classList.add(
                "recording"
            );

            updateRecordingTime();


            recordingInterval =
                setInterval(
                    ()=>{
                        recordingSeconds++;
                        updateRecordingTime();
                    },
                    1000
                );

        }
        catch(error){

            console.error(error);

            showToast(
                "Microphone permission is required."
            );

        }

    }
);


stopRecording.addEventListener(
    "click",
    stopVoiceRecording
);


function stopVoiceRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();

    }


    mediaRecorder = null;

    clearInterval(
        recordingInterval
    );

    recordingInterval = null;

    recordingBar.style.display =
        "none";

    voiceBtn.classList.remove(
        "recording"
    );

}


function updateRecordingTime(){

    const min =
        Math.floor(
            recordingSeconds / 60
        )
        .toString()
        .padStart(2,"0");


    const sec =
        (
            recordingSeconds % 60
        )
        .toString()
        .padStart(2,"0");


    recordingTime.textContent =
        `Recording ${min}:${sec}`;

}


/* =====================================================
   VOICE UPLOAD
===================================================== */

async function uploadVoice(blob){

    if(!selectedUser)
        return;


    const extension =
        blob.type.includes("ogg")
            ? "ogg"
            : "webm";


    const path =
        `${currentUser.id}/voice_${Date.now()}.${extension}`;


    showToast(
        "Uploading voice..."
    );


    const {
        error:uploadError
    } = await supabaseClient
        .storage
        .from("message-media")
        .upload(
            path,
            blob,
            {
                contentType:
                    blob.type ||
                    "audio/webm",
                upsert:false
            }
        );


    if(uploadError){

        console.error(uploadError);

        showToast(
            "Voice upload failed."
        );

        return;
    }


    const {
        data:urlData
    } =
        supabaseClient
        .storage
        .from("message-media")
        .getPublicUrl(path);


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                selectedConversationId,

            sender_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            message_type:
                "voice",

            media_url:
                urlData.publicUrl,

            duration:
                recordingSeconds

        });


    if(error){

        console.error(error);

        showToast(
            "Could not save voice message."
        );

        return;
    }


    showToast(
        "Voice message sent."
    );

    await updateConversationTime();

}

let activeAudio = null;


function playVoice(
    button,
    url
){

    if(activeAudio){

        activeAudio.pause();

        activeAudio = null;

    }


    const audio =
        new Audio(url);


    activeAudio = audio;

    button.textContent = "⏸";


    audio.onended =
        ()=>{
            button.textContent =
                "▶";
            activeAudio = null;
        };


    audio.play().catch(
        ()=>{
            button.textContent =
                "▶";

            showToast(
                "Could not play voice."
            );
        }
    );

}

/* =====================================================
   UPLOAD MEDIA
===================================================== */

async function uploadMedia(
    file,
    type
){

    if(!selectedUser)
        return;


    if(type === "photo" && !canSendPhoto()){

        showToast(
            "Photo messaging requires Premium."
        );

        return;
    }


    if(type === "video" && !canSendVideo()){

        showToast(
            "Video messaging requires Premium+."
        );

        return;
    }


    if(type === "file" && !canSendFile()){

        showToast(
            "File messaging requires Premium Max."
        );

        return;
    }


    const maxSize =
        type === "video"
            ? 100 * 1024 * 1024
            : type === "file"
                ? 100 * 1024 * 1024
                : 15 * 1024 * 1024;


    if(file.size > maxSize){

        showToast(
            "File is too large."
        );

        return;
    }


    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const path =
        `${currentUser.id}/${Date.now()}_${safeName}`;


    showToast(
        "Uploading..."
    );


    const {
        error:uploadError
    } = await supabaseClient
        .storage
        .from("message-media")
        .upload(
            path,
            file,
            {
                contentType:
                    file.type ||
                    "application/octet-stream",
                upsert:false
            }
        );


    if(uploadError){

        console.error(uploadError);

        showToast(
            "Upload failed."
        );

        return;
    }


    const {
        data:urlData
    } =
        supabaseClient
        .storage
        .from("message-media")
        .getPublicUrl(path);


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                selectedConversationId,

            sender_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            message_type:
                type,

            media_url:
                urlData.publicUrl,

            file_name:
                file.name

        });


    if(error){

        console.error(error);

        showToast(
            "Could not save message."
        );

        return;
    }


    showToast(
        "Message sent."
    );


    await updateConversationTime();

}


/* =====================================================

===================================================== */

async function markConversationRead(){

    if(!selectedConversationId)
        return;


    const now =
        new Date().toISOString();


    const {
        error
    } = await supabaseClient
        .from("messages")
        .update({
            read_at:now
        })
        .eq(
            "conversation_id",
            selectedConversationId
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .is(
            "read_at",
            null
        );


    if(error)
        console.error(error);


    await updateGlobalUnread();

}


/* =====================================================
   GLOBAL UNREAD
===================================================== */

async function updateGlobalUnread(){

    const {
        count,
        error
    } = await supabaseClient
        .from("messages")
        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .is(
            "read_at",
            null
        );


    if(error){

        console.error(error);

        return;
    }


    const total =
        count || 0;


    if(total > 0){

        globalUnreadBadge.style.display =
            "flex";

        globalUnreadBadge.textContent =
            total > 99
                ? "99+"
                : total;

    }
    else{

        globalUnreadBadge.style.display =
            "none";

    }

}


/* =====================================================
   REALTIME
===================================================== */

function setupRealtime(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
        supabaseClient
        .channel(
            "messages-realtime-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"messages"
            },
            async payload=>{

                const message =
                    payload.new;


                /*
                 Only process messages
                 belonging to current user.
                */

                if(
                    message.sender_id !==
                        currentUser.id &&
                    message.receiver_id !==
                        currentUser.id
                )
                    return;


                if(
                    message.conversation_id ===
                    selectedConversationId
                ){

                    await loadMessages();

                    if(
                        message.receiver_id ===
                        currentUser.id
                    ){

                        await markConversationRead();

                    }

                }


                await loadConversations();

                await updateGlobalUnread();

                /*
                 Browser notification.
                */

                if(
                    message.receiver_id ===
                    currentUser.id &&
                    Notification.permission ===
                    "granted"
                ){

                    new Notification(
                        "New message",
                        {
                            body:
                                message.message_type === "text"
                                    ? (
                                        message.content ||
                                        "New message"
                                      )
                                    : "New " +
                                      message.message_type +
                                      " message"
                        }
                    );

                }

            }
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"messages"
            },
            async payload=>{

                const message =
                    payload.new;


                if(
                    message.conversation_id ===
                    selectedConversationId
                ){

                    await loadMessages();

                }


                await loadConversations();

                await updateGlobalUnread();

            }
        )
        .on(
            "postgres_changes",
            {
                event:"DELETE",
                schema:"public",
                table:"messages"
            },
            async payload=>{

                if(
                    payload.old &&
                    payload.old.conversation_id ===
                    selectedConversationId
                ){

                    await loadMessages();

                }


                await loadConversations();

            }
        )
        .subscribe();


    /*
     Ask for browser notification permission
     when supported.
    */

    if(
        "Notification" in window &&
        Notification.permission === "default"
    ){

        Notification.requestPermission()
            .catch(()=>{});

    }

}

/* =====================================================
   FORMATTING
===================================================== */

function formatTime(date){

    if(!date)
        return "";


    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function formatShortTime(date){

    if(!date)
        return "";


    const d =
        new Date(date);

    const today =
        new Date();


    if(
        d.toDateString() ===
        today.toDateString()
    ){

        return formatTime(date);

    }


    return d.toLocaleDateString(
        [],
        {
            month:"short",
            day:"numeric"
        }
    );

}


function formatDate(date){

    const d =
        new Date(date);

    const today =
        new Date();


    if(
        d.toDateString() ===
        today.toDateString()
    )
        return "Today";


    const yesterday =
        new Date();


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    if(
        d.toDateString() ===
        yesterday.toDateString()
    )
        return "Yesterday";


    return d.toLocaleDateString(
        [],
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    );

}


/* =====================================================

===================================================== */

function safeAvatar(url){

    if(
        url &&
        /^https?:\/\//i.test(url)
    )
        return url;


    return "";

}


function avatarHTML(
    url,
    username,
    small=false
){

    if(url){

        return `
            <img
                class="avatar ${
                    small
                        ? "avatar-small"
                        : ""
                }"
                src="${safeUrl(url)}"
                alt=""
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >

            <div
                class="avatar ${
                    small
                        ? "avatar-small"
                        : ""
                } avatar-placeholder"
                style="display:none;"
            >
                ${escapeHTML(
                    (
                        username ||
                        "U"
                    )[0]
                    .toUpperCase()
                )}
            </div>
        `;

    }


    return `
        <div
            class="avatar ${
                small
                    ? "avatar-small"
                    : ""
            } avatar-placeholder"
        >
            ${escapeHTML(
                (
                    username ||
                    "U"
                )[0]
                .toUpperCase()
            )}
        </div>
    `;

}

/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


function safeUrl(url){

    if(
        !url ||
        !/^https?:\/\//i.test(url)
    )
        return "";


    return escapeAttribute(url);

}


function sanitizeForHTML(obj){

    const output = {};

    Object.keys(
        obj || {}
    ).forEach(
        key=>{
            const value =
                obj[key];

            if(
                typeof value ===
                "string"
            ){

                output[key] =
                    value
                        .replace(
                            /</g,
                            ""
                        )
                        .replace(
                            />/g,
                            ""
                        );

            }
            else{

                output[key] =
                    value;

            }

        }
    );


    return output;

}
