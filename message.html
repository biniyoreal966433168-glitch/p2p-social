<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Messages • P2P Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#172033;padding-bottom:78px}
button,input,textarea{font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#075e54,#087f73);color:white;padding:14px;border-radius:0 0 22px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo-area{display:flex;align-items:center;gap:10px;min-width:0}
.logo-icon{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,#064e46,#10a889);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 18px rgba(0,0,0,.18);flex-shrink:0}
.p-left{position:absolute;left:8px;top:10px;width:14px;height:25px;border:4px solid white;border-right:0;border-radius:9px 0 0 9px}
.p-right{position:absolute;right:8px;top:10px;width:14px;height:25px;border:4px solid white;border-left:0;border-radius:0 9px 9px 0}
.logo-center{width:13px;height:13px;background:white;border-radius:50%;position:absolute;z-index:5}
.logo-dot{width:5px;height:5px;background:#087f73;border-radius:50%;margin:4px}
.brand{font-size:19px;font-weight:800;white-space:nowrap}
.brand span{color:#a8eee2}
.top-actions{display:flex;align-items:center;gap:5px}
.auth-btn{border:none;border-radius:9px;padding:8px 9px;font-size:10px;font-weight:bold;cursor:pointer}
.login-btn{background:white;color:#087f73}.register-btn{background:#16a085;color:white;border:1px solid rgba(255,255,255,.7)}
.logout-btn{background:#e74c3c;color:white;display:none}
.notification{position:relative;font-size:21px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.notification-badge{position:absolute;top:-4px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:20px;background:#e74c3c;color:white;font-size:9px;font-weight:bold;display:none;align-items:center;justify-content:center}
.user-info{display:none;margin-top:8px;font-size:11px}
.notification-panel{display:none;position:fixed;top:65px;right:12px;width:min(360px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:white;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.2);z-index:10000;color:#172033}
.notification-panel.show{display:block}
.notification-head{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid #eee}
.mark-all{border:none;background:none;color:#087f73;font-size:12px;font-weight:bold;cursor:pointer}

.notification-item.unread{background:#edf8f6}
.notification-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.notification-content{flex:1}.notification-text{font-size:13px;line-height:1.4}

.notification-empty{text-align:center;padding:35px 15px;color:#89919d;font-size:13px}
.messages-page{max-width:850px;margin:auto;padding:18px}
.messages-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.messages-title h1{font-size:23px}
.title-unread{display:none;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:20px;background:#e74c3c;color:white;font-size:11px;align-items:center;justify-content:center}
.new-message{width:42px;height:42px;border:none;border-radius:50%;background:#087f73;color:white;font-size:24px;cursor:pointer}
.message-search{margin-bottom:15px}.message-search input{width:100%;padding:13px 15px;border:1px solid #dfe4eb;background:white;color:#172033;border-radius:12px;outline:none;font-size:14px}
.search-results{display:none;margin-bottom:15px}
.search-user{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:7px;background:white;border:1px solid #e1e5eb;border-radius:12px;cursor:pointer}
.search-user img{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#dfeeea}
.search-info{flex:1}.search-name{font-weight:bold;font-size:14px}.search-id{color:#7a8494;font-size:12px;margin-top:3px}
.filters{display:flex;gap:8px;margin-bottom:15px}.filter{border:1px solid #dfe4eb;background:white;color:#7a8494;padding:9px 15px;border-radius:20px;cursor:pointer}
.filter.active{background:#087f73;color:white;border-color:#087f73}
.chat-list{display:flex;flex-direction:column;gap:9px}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px;background:white;border:1px solid #e5e8ed;border-radius:14px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.chat-item.has-unread{border-color:#b8ddd8}
.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#dfeeea;flex-shrink:0}
.chat-info{min-width:0;flex:1}.chat-top{display:flex;justify-content:space-between}.chat-name{font-weight:bold;font-size:14px}
.chat-item.has-unread .chat-name{color:#075e54}.chat-preview{color:#7a8494;font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item.has-unread .chat-preview{color:#172033;font-weight:bold}
.chat-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.chat-time{color:#8b95a5;font-size:10px}
.unread-badge{min-width:20px;height:20px;padding:0 6px;border-radius:20px;background:#087f73;color:white;font-size:10px;font-weight:bold;display:none;align-items:center;justify-content:center}
.empty{display:none;text-align:center;padding:50px 20px;color:#7a8494}.loading{text-align:center;color:#7a8494;padding:30px;background:white;border-radius:14px}
.chat-screen{display:none;position:fixed;inset:0;background:#f5f7fb;z-index:5000}
.chat-header{height:65px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(135deg,#075e54,#087f73);color:white}
.back-btn{border:none;background:none;color:white;font-size:28px;cursor:pointer}
.chat-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:white}
.chat-header-info{flex:1;min-width:0;cursor:pointer}.chat-header-name{font-weight:bold;font-size:15px}.chat-header-status{font-size:10px;opacity:.8;margin-top:3px}
.chat-more{width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.15);color:white;font-size:20px;cursor:pointer}
.messages-container{position:absolute;top:65px;bottom:122px;left:0;right:0;overflow-y:auto;padding:15px}
.message-row{display:flex;margin-bottom:10px}.message-row.mine{justify-content:flex-end}
.message-bubble{max-width:78%;padding:10px 13px;border-radius:15px;background:white;color:#172033;box-shadow:0 2px 7px rgba(0,0,0,.06);word-break:break-word;position:relative}
.message-row.mine .message-bubble{background:#087f73;color:white}
.message-edited{font-size:9px;opacity:.6;margin-left:4px}.message-time{font-size:9px;opacity:.65;margin-top:4px;text-align:right}
.message-photo{display:block;max-width:240px;max-height:300px;border-radius:11px;object-fit:cover;cursor:pointer}
.voice-message{min-width:220px;display:flex;align-items:center;gap:8px}.voice-message audio{width:210px;height:38px}
.message-actions{display:none;position:absolute;right:5px;bottom:-34px;background:white;border:1px solid #ddd;border-radius:9px;padding:4px;box-shadow:0 4px 15px rgba(0,0,0,.15);z-index:20}
.message-row.mine .message-bubble:hover .message-actions{display:flex}
.message-action{border:none;background:white;padding:6px 8px;cursor:pointer;font-size:11px;color:#172033}
.message-action:hover{background:#f1f4f5}
.edit-bar{display:none;position:absolute;bottom:122px;left:0;right:0;background:#eaf6f4;border-top:1px solid #cfe5e1;padding:8px 12px;align-items:center;justify-content:space-between;gap:10px;z-index:15}
.edit-bar.show{display:flex}.edit-label{font-size:12px;color:#075e54;font-weight:bold}.cancel-edit{border:none;background:none;color:#e74c3c;font-weight:bold;cursor:pointer}
.media-preview{display:none;position:absolute;left:8px;right:8px;bottom:122px;background:white;border:1px solid #ddd;border-radius:14px;padding:10px;z-index:30;box-shadow:0 5px 20px rgba(0,0,0,.12)}
.media-preview.show{display:flex;align-items:center;gap:10px}.preview-image{width:55px;height:55px;border-radius:9px;object-fit:cover}.preview-info{flex:1;min-width:0}
.preview-title{font-weight:bold;font-size:12px}.preview-size{font-size:10px;color:#89919d;margin-top:3px}.remove-preview{border:none;background:#e74c3c;color:white;width:30px;height:30px;border-radius:50%;cursor:pointer}
.recording-bar{display:none;position:absolute;left:8px;right:8px;bottom:122px;background:white;border:1px solid #ddd;border-radius:14px;padding:12px;z-index:40;align-items:center;gap:10px;box-shadow:0 5px 20px rgba(0,0,0,.12)}
.recording-bar.show{display:flex}.recording-dot{width:12px;height:12px;background:#e74c3c;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.recording-time{flex:1;font-weight:bold;color:#e74c3c}.stop-recording{border:none;background:#e74c3c;color:white;padding:8px 12px;border-radius:9px;font-weight:bold;cursor:pointer}
.message-input-area{position:absolute;bottom:0;left:0;right:0;height:122px;display:flex;flex-direction:column;gap:7px;padding:8px;background:white;border-top:1px solid #ddd;z-index:10}
.input-row{display:flex;gap:7px;align-items:flex-end}.message-input{flex:1;min-height:42px;max-height:90px;border:1px solid #dfe4eb;background:#f5f7fb;color:#172033;border-radius:12px;padding:11px;outline:none;resize:none;font-size:14px}
.input-icon{width:42px;height:42px;border:none;border-radius:12px;background:#edf4f3;color:#087f73;font-size:20px;cursor:pointer;flex-shrink:0}.input-icon:disabled{opacity:.5}
.send-message{width:52px;height:42px;border:none;border-radius:12px;background:#087f73;color:white;font-size:20px;cursor:pointer;flex-shrink:0}.send-message:disabled{opacity:.5}
.input-hint{text-align:center;color:#89919d;font-size:9px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:9999}
.nav-item{flex:1;text-align:center;color:#777;font-size:11px;cursor:pointer;position:relative}.nav-item span:first-child{display:block;font-size:22px;margin-bottom:3px}
.nav-item.active{color:#087f73;font-weight:bold}.nav-badge{position:absolute;top:-2px;margin-left:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:20px;background:#e74c3c;color:white;font-size:9px;display:none;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(20px);background:#172033;color:white;padding:10px 15px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20000;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#photoInput{display:none}

.order-panel{display:none;position:absolute;left:8px;right:8px;top:73px;background:white;border:1px solid #dfe4eb;border-radius:14px;z-index:100;box-shadow:0 7px 25px rgba(0,0,0,.15);padding:12px}
.order-panel.show{display:block}
.order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.order-head strong{font-size:13px}.order-close{border:0;background:none;font-size:20px;cursor:pointer}
.order-card{border:1px solid #e2e7ec;border-radius:12px;padding:12px;margin-bottom:8px}
.order-line{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px}
.order-line:last-child{margin-bottom:0}.order-label{color:#7a8494}.order-value{font-weight:bold;text-align:right}
.order-status{display:inline-flex;padding:4px 8px;border-radius:20px;background:#edf4f3;color:#087f73;font-size:10px}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.order-action{border:0;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:bold;cursor:pointer;background:#087f73;color:white}
.order-action.red{background:#e74c3c}.order-action.gray{background:#edf0f2;color:#172033}
.order-empty{text-align:center;padding:12px;color:#89919d;font-size:12px}

@media(max-width:450px){
header{padding:12px}.brand{font-size:17px}.auth-btn{padding:7px 7px;font-size:9px}.messages-page{padding:16px 12px}
.message-bubble{max-width:85%}.message-photo{max-width:220px}.voice-message,.voice-message audio{width:200px;min-width:200px}
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo-area">
<div class="logo-icon">
<div class="p-left"></div><div class="p-right"></div>
<div class="logo-center"><div class="logo-dot"></div></div>
</div>
<div class="brand">P2P <span>Social</span></div>
</div>

<div class="top-actions">
<button id="loginBtn" class="auth-btn login-btn">Login</button>
<button id="registerBtn" class="auth-btn register-btn">Register</button>
<button id="logoutBtn" class="auth-btn logout-btn">Logout</button>
<div id="notificationButton" class="notification">🔔<span id="notificationBadge" class="notification-badge"></span></div>
</div>
</div>

<div id="userInfo" class="user-info">Logged in as: <strong id="usernameDisplay"></strong></div>
</header>

<div id="notificationPanel" class="notification-panel">
<div class="notification-head">
<strong>Notifications</strong>
<button id="markAllNotifications" class="mark-all">Mark all read</button>
</div>
<div id="notificationList"></div>
</div>

<main class="messages-page">

<div class="messages-title">
<h1>💬 Messages <span id="titleUnread" class="title-unread"></span></h1>
<button id="newMessageButton" class="new-message">+</button>
</div>

<div class="message-search">
<input id="searchInput" type="search" placeholder="🔍 Search username..." autocomplete="off">
</div>

<div id="searchResults" class="search-results"></div>

<div class="filters">
<button id="allFilter" class="filter active">All</button>
<button id="unreadFilter" class="filter">Unread</button>
</div>

<div id="chatList" class="chat-list">
<div class="loading">Loading conversations...</div>
</div>

<div id="empty" class="empty">

</div>

</main>

<div id="chatScreen" class="chat-screen">

<div class="chat-header">
<button id="backButton" class="back-btn">←</button>
<img id="chatAvatar" class="chat-avatar" src="images/profile.png" alt="Profile">
<div id="chatHeaderInfo" class="chat-header-info">
<div id="chatName" class="chat-header-name">User</div>
<div id="chatHeaderStatus" class="chat-header-status">Messages</div>
</div>
<button id="chatMore" class="chat-more">⋮</button>
</div>

<div id="orderPanel" class="order-panel">
<div class="order-head">
<strong>🛡️ P2P Trade / Order</strong>
<button id="closeOrderPanel" class="order-close">×</button>
</div>
<div id="orderContent"></div>
</div>

<div id="messagesContainer" class="messages-container"></div>

<div id="editBar" class="edit-bar">
<div class="edit-label">✏️ Editing message</div>
<button id="cancelEdit" class="cancel-edit">Cancel</button>
</div>

<div id="mediaPreview" class="media-preview">
<img id="previewImage" class="preview-image" src="" alt="Preview">
<div class="preview-info">
<div id="previewTitle" class="preview-title">Photo</div>
<div id="previewSize" class="preview-size"></div>
</div>
<button id="removePreview" class="remove-preview">×</button>
</div>

<div id="recordingBar" class="recording-bar">
<div class="recording-dot"></div>
<div id="recordingTime" class="recording-time">00:00</div>
<button id="stopRecording" class="stop-recording">Stop</button>
</div>

<div class="message-input-area">
<div class="input-row">
<button id="photoButton" class="input-icon" title="Add photo">📷</button>
<button id="voiceButton" class="input-icon" title="Record voice">🎤</button>
<textarea id="messageInput" class="message-input" rows="1" placeholder="Write a message..." autocomplete="off"></textarea>
<button id="sendMessageButton" class="send-message">➤</button>
</div>

</div>

</div>

<input id="photoInput" type="file" accept="image/*">

<nav class="bottom-nav">
<div class="nav-item" onclick="goHome()"><span>🏠</span>Home</div>
<div class="nav-item" onclick="goLive()"><span>🟢</span>Buy</div>
<div class="nav-item" onclick="goWallet()"><span>🔴</span>Sell</div>
<div class="nav-item active"><span>💬</span>Messages<span id="messagesNavBadge" class="nav-badge"></span></div>
<div class="nav-item" onclick="goProfile()"><span>👤</span>Profile</div>
</nav>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const MESSAGE_MEDIA_BUCKET="message-media";
const DEFAULT_AVATAR="images/profile.png";

let currentUser=null,currentUserProfile=null,currentConversation=null,currentOtherUser=null;
let realtimeChannel=null,unreadChannel=null,notificationChannel=null,orderChannel=null;
let searchTimer=null,actionLock=false,selectedPhoto=null,editingMessageId=null;
let mediaRecorder=null,audioChunks=[],recordingStartedAt=null,recordingTimer=null;
let currentOrder=null;

function runOnce(action){
if(actionLock)return;
actionLock=true;
try{
const result=action();
if(result&&typeof result.finally==="function"){
result.finally(()=>setTimeout(()=>actionLock=false,350));
return;
}
}catch(e){console.error(e)}
setTimeout(()=>actionLock=false,350);
}

function showToast(message){
const toast=document.getElementById("toast");
toast.textContent=message;
toast.classList.add("show");
clearTimeout(showToast.timer);
showToast.timer=setTimeout(()=>toast.classList.remove("show"),2500);
}

async function startApp(){
const {data,error}=await supabaseClient.auth.getSession();
if(error){console.error(error);return}
if(!data.session){window.location.replace("login.html");return}
currentUser=data.session.user;
await loadCurrentUserProfile();
await updateAuthUI();
await loadConversations();
await updateUnreadCount();
await loadNotifications();
subscribeGlobalRealtime();
subscribeNotificationRealtime();
openUsernameConversationFromUrl();
}

async function loadCurrentUserProfile(){
if(!currentUser)return null;
const {data,error}=await supabaseClient.from("profiles").select("id,username,avatar_url").eq("id",currentUser.id).maybeSingle();
if(error)console.error(error);
currentUserProfile=data||{
id:currentUser.id,
username:currentUser.user_metadata?.username||currentUser.email?.split("@")[0]||"User",
avatar_url:DEFAULT_AVATAR
};
return currentUserProfile;
}

async function updateAuthUI(){
document.getElementById("loginBtn").style.display="none";
document.getElementById("registerBtn").style.display="none";
document.getElementById("logoutBtn").style.display="block";
document.getElementById("userInfo").style.display="block";
document.getElementById("usernameDisplay").textContent="@"+(
currentUserProfile?.username||currentUser.email?.split("@")[0]||"User"
);
}

async function loadConversations(){
if(!currentUser)return;
const list=document.getElementById("chatList"),empty=document.getElementById("empty");
list.innerHTML='<div class="loading">Loading conversations...</div>';
empty.style.display="none";

const {data,error}=await supabaseClient.from("conversations").select("*")
.or("user_one.eq."+currentUser.id+",user_two.eq."+currentUser.id)
.order("updated_at",{ascending:false});

if(error){
list.innerHTML='<div class="loading">Could not load conversations.<br><small>'+escapeHTML(error.message)+'</small></div>';
return;
}
list.innerHTML="";
if(!data?.length){empty.style.display="block";return}
for(const conversation of data){
const otherId=conversation.user_one===currentUser.id?conversation.user_two:conversation.user_one;
await createConversationItem(conversation,otherId,list);
}
}

async function createConversationItem(conversation,otherId,list){
const {data:profile}=await supabaseClient.from("profiles").select("id,username,avatar_url").eq("id",otherId).maybeSingle();
const username=normalizeUsername(profile?.username)||"User";
const avatar=profile?.avatar_url||DEFAULT_AVATAR;

const {data:last}=await supabaseClient.from("messages").select("content,created_at,sender_id,message_type")
.eq("conversation_id",conversation.id).order("created_at",{ascending:false}).limit(1);

const {count}=await supabaseClient.from("messages").select("id",{count:"exact",head:true})
.eq("conversation_id",conversation.id).neq("sender_id",currentUser.id).is("read_at",null);

const unread=count||0,lastMessage=last?.[0];
let lastText="Start a conversation";
if(lastMessage){
if(lastMessage.message_type==="photo")lastText="📷 Photo";
else if(lastMessage.message_type==="voice")lastText="🎤 Voice message";
else if(lastMessage.message_type==="order")lastText="🛡️ P2P order";
else lastText=lastMessage.content||"Message";
}

const item=document.createElement("div");
item.className="chat-item"+(unread?" has-unread":"");
item.dataset.unread=unread;
item.dataset.username=username;
item.innerHTML=`
<img class="avatar" src="${escapeHTML(avatar)}" alt="Profile">
<div class="chat-info">
<div class="chat-top"><span class="chat-name">@${escapeHTML(username)}</span></div>
<div class="chat-preview">${escapeHTML(lastText)}</div>
</div>
<div class="chat-right">
<div class="chat-time">${lastMessage?formatTime(lastMessage.created_at):""}</div>
<span class="unread-badge" style="${unread?"display:flex":"display:none"}">${unread>99?"99+":unread}</span>

async function startConversation(profile){
if(!currentUser||!profile?.id)return;
const username=normalizeUsername(profile.username);
if(!username){showToast("This user has no username");return}

const otherId=profile.id;
const userOne=currentUser.id<otherId?currentUser.id:otherId;
const userTwo=currentUser.id<otherId?otherId:currentUser.id;

let {data:conversation,error}=await supabaseClient.from("conversations").select("*")
.eq("user_one",userOne).eq("user_two",userTwo).maybeSingle();

if(error){showToast("Conversation error");return}

if(!conversation){
const result=await supabaseClient.from("conversations").insert({user_one:userOne,user_two:userTwo}).select().single();
if(result.error){alert("Could not create conversation: "+result.error.message);return}
conversation=result.data;
}

document.getElementById("searchInput").value="";
document.getElementById("searchResults").style.display="none";
await openConversation(conversation,{id:profile.id,username,avatar_url:profile.avatar_url||DEFAULT_AVATAR});
}

}

async function loadConversationOrder(){
if(!currentConversation)return;
currentOrder=null;

let result=await supabaseClient.from("p2p_trades").select("*")
.or("conversation_id.eq."+currentConversation.id+",chat_id.eq."+currentConversation.id)
.order("created_at",{ascending:false}).limit(1);

if(!result.error&&result.data?.length){
currentOrder=result.data[0];
renderOrder(currentOrder);
return;
}

result=await supabaseClient.from("p2p_orders").select("*")
.or("conversation_id.eq."+currentConversation.id+",chat_id.eq."+currentConversation.id)
.order("created_at",{ascending:false}).limit(1);

if(!result.error&&result.data?.length){
currentOrder=result.data[0];
renderOrder(currentOrder);
return;
}

const {data:orderMessage}=await supabaseClient.from("messages").select("order_id")
.eq("conversation_id",currentConversation.id).not("order_id","is",null)
.order("created_at",{ascending:false}).limit(1);

const orderId=orderMessage?.[0]?.order_id;
if(orderId){
const trade=await supabaseClient.from("p2p_trades").select("*").eq("id",orderId).maybeSingle();
if(!trade.error&&trade.data){currentOrder=trade.data;renderOrder(currentOrder);return}
const order=await supabaseClient.from("p2p_orders").select("*").eq("id",orderId).maybeSingle();
if(!order.error&&order.data){currentOrder=order.data;renderOrder(currentOrder);return}
}

renderOrder(null);
}

function orderAmount(order){
return order?.amount??order?.usdt_amount??order?.quantity??order?.crypto_amount??"—";
}

function orderType(order){
return order?.order_type??order?.type??"P2P";
}

function orderPrice(order){
return order?.price??order?.unit_price??order?.rate??"—";
}

function orderStatus(order){
return String(order?.status??"pending");
}

function renderOrder(order){
const content=document.getElementById("orderContent");
if(!order){
content.innerHTML='<div class="order-empty">No P2P order is attached to this conversation.</div>';
return;
}

const status=orderStatus(order).toLowerCase();
const mineBuyer=String(order.buyer_id||"")===String(currentUser?.id);
const mineSeller=String(order.seller_id||"")===String(currentUser?.id);

let buttons="";

if(["open","pending","active"].includes(status)){
if(mineBuyer){
buttons+='<button class="order-action" onclick="confirmPayment()">✅ Confirm Payment</button>';
}
if(mineSeller){
buttons+='<button class="order-action" onclick="releaseOrder()">💰 Release Order</button>';
}
buttons+='<button class="order-action red" onclick="cancelOrder()">✕ Cancel</button>';
buttons+='<button class="order-action gray" onclick="disputeOrder()">⚠️ Dispute</button>';
}

if(status==="paid"&&mineSeller){
buttons+='<button class="order-action" onclick="releaseOrder()">💰 Release Order</button>';
buttons+='<button class="order-action gray" onclick="disputeOrder()">⚠️ Dispute</button>';
}

if(status==="disputed"){
buttons+='<button class="order-action gray" onclick="openDisputeInfo()">⚠️ Disputed — Admin Review</button>';
}

if(["completed","released"].includes(status)){
buttons+='<button class="order-action gray" onclick="finishOrder()">✓ Finish Order</button>';
}

content.innerHTML=`
<div class="order-card">
<div class="order-line"><span class="order-label">Type</span><span class="order-value">${escapeHTML(orderType(order))}</span></div>
<div class="order-line"><span class="order-label">Amount</span><span class="order-value">${escapeHTML(String(orderAmount(order)))} USDT</span></div>
<div class="order-line"><span class="order-label">Price</span><span class="order-value">${escapeHTML(String(orderPrice(order)))}</span></div>
<div class="order-line"><span class="order-label">Status</span><span class="order-status">${escapeHTML(status)}</span></div>
${order.payment_method?`<div class="order-line"><span class="order-label">Payment</span><span class="order-value">${escapeHTML(order.payment_method)}</span></div>`:""}
<div class="order-actions">${buttons||'<span class="order-label">No action available.</span>'}</div>
</div>`;
}

const {data,error}=await supabaseClient.rpc(name,params);
if(!error)return {data,error:null,name};
}catch(e){console.error(name,e)}
}
return {data:null,error:new Error("Secure order action is not available."),name:null};
}

async function toggleVoiceRecording(){
if(mediaRecorder?.state==="recording"){stopVoiceRecording();return}
await startVoiceRecording();
}

async function startVoiceRecording(){
if(!currentConversation){showToast("Open a conversation first");return}
if(!navigator.mediaDevices?.getUserMedia){alert("Voice recording is not supported by this browser.");return}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
let options={};
if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))options.mimeType="audio/webm;codecs=opus";
else if(MediaRecorder.isTypeSupported("audio/webm"))options.mimeType="audio/webm";

mediaRecorder=new MediaRecorder(stream,options);audioChunks=[];
mediaRecorder.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data)};
mediaRecorder.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
const duration=Math.max(1,Math.round((Date.now()-recordingStartedAt)/1000));
hideRecordingBar();
if(!blob.size){showToast("No voice recorded");return}
await sendVoiceMessage(blob,duration);
};
mediaRecorder.onerror=()=>{stream.getTracks().forEach(t=>t.stop());hideRecordingBar();showToast("Voice recording failed")};
mediaRecorder.start(200);recordingStartedAt=Date.now();showRecordingBar();startRecordingTimer();
}catch(error){console.error(error);alert("Microphone permission is required to record a voice message.")}
}

function stopVoiceRecording(){
if(mediaRecorder?.state==="recording")mediaRecorder.stop();
stopRecordingTimer();
}

);

async function sendVoiceMessage(blob,duration){
if(!currentUser||!currentConversation)return;
const button=document.getElementById("sendMessageButton");button.disabled=true;showToast("Uploading voice...");
try{
let extension=blob.type.includes("ogg")?"ogg":blob.type.includes("mp4")?"m4a":"webm";
const path=currentUser.id+"/"+currentConversation.id+"/"+Date.now()+"-"+randomString(8)+"."+extension;
const {error:uploadError}=await supabaseClient.storage.from(MESSAGE_MEDIA_BUCKET).upload(
path,blob,{cacheControl:"3600",upsert:false,contentType:blob.type||"audio/webm"});
if(uploadError)throw uploadError;
const {data:urlData}=supabaseClient.storage.from(MESSAGE_MEDIA_BUCKET).getPublicUrl(path);
const {error}=await supabaseClient.from("messages").insert({
conversation_id:currentConversation.id,sender_id:currentUser.id,content:"",
message_type:"voice",media_url:urlData?.publicUrl||"",duration
});
if(error)throw error;
await loadMessages();await updateUnreadCount();scrollMessages();showToast("Voice message sent");
}catch(error){alert("Voice message failed: "+error.message)}
finally{button.disabled=false}
}

function subscribeRealtime(){

if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
const id=currentConversation.id;
realtimeChannel=supabaseClient.channel("conversation-"+id+"-"+Date.now())
.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+id},async p=>{
if(currentConversation?.id===p?.new?.conversation_id){await loadMessages();await markConversationAsRead()}
})
.on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"conversation_id=eq."+id},loadMessages)
.on("postgres_changes",{event:"DELETE",schema:"public",table:"messages",filter:"conversation_id=eq."+id},loadMessages)
.subscribe();
}

function subscribeGlobalRealtime(){
if(!currentUser)return;
if(unreadChannel)supabaseClient.removeChannel(unreadChannel);
unreadChannel=supabaseClient.channel("global-messages-"+currentUser.id+"-"+Date.now())
.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async p=>{
if(!p?.new||p.new.sender_id===currentUser.id)return;
if(currentConversation?.id===p.new.conversation_id){
await markConversationAsRead();await loadMessages();return;
}
await updateUnreadCount();await loadConversations();
}).subscribe();
}

async function updateUnreadCount(){
if(!currentUser)return;
const {data:conversations}=await supabaseClient.from("conversations").select("id")
.or("user_one.eq."+currentUser.id+",user_two.eq."+currentUser.id);
if(!conversations?.length){updateUnreadUI(0);return}
const {count}=await supabaseClient.from("messages").select("id",{count:"exact",head:true})
.in("conversation_id",conversations.map(x=>x.id)).neq("sender_id",currentUser.id).is("read_at",null);
updateUnreadUI(count||0);
}

function updateUnreadUI(count){
const value=Number(count)||0,text=value>99?"99+":String(value);
const title=document.getElementById("titleUnread"),nav=document.getElementById("messagesNavBadge");

else{title.style.display="none";nav.style.display="none"}

.eq("conversation_id",currentConversation.id).neq("sender_id",currentUser.id).is("read_at",null);

const {data,error}=await supabaseClient.from("notifications").select("*")
.eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(50);
if(error){list.innerHTML='<div class="notification-empty">Could not load notifications.</div>';return}
list.innerHTML="";
if(!data?.length){
list.innerHTML='<div class="notification-empty">🔔<br><br>No notifications yet.</div>';updateNotificationBadge([]);return;
}
for(const n of data)await renderNotification(n,list);
updateNotificationBadge(data);
}

async function renderNotification(n,list){
let profile=null;
if(n.sender_id){
const r=await supabaseClient.from("profiles").select("id,username,avatar_url").eq("id",n.sender_id).maybeSingle();
profile=r.data;
}
const username=normalizeUsername(profile?.username);
const item=document.createElement("div");
item.className="notification-item"+(!n.is_read?" unread":"");
item.innerHTML=`
<img class="notification-avatar" src="${escapeHTML(profile?.avatar_url||DEFAULT_AVATAR)}" alt="Profile">
<div class="notification-content">
<div class="notification-text">${username?"<strong>@"+escapeHTML(username)+"</strong> ":""}${n.title?"<strong>"+escapeHTML(n.title)+"</strong><br>":""}${escapeHTML(n.message||"You have a new notification.")}</div>
<div class="notification-time">${formatNotificationTime(n.created_at)}</div>
</div>`;
item.onclick=async()=>{
await markNotificationRead(n.id);
const conversationId=n.conversation_id||getConversationIdFromLink(n.link);
if(n.type==="message"&&conversationId){
const {data:conversation}=await supabaseClient.from("conversations").select("*").eq("id",conversationId).maybeSingle();
if(conversation){
const otherId=conversation.user_one===currentUser.id?conversation.user_two:conversation.user_one;
const {data:other}=await supabaseClient.from("profiles").select("id,username,avatar_url").eq("id",otherId).maybeSingle();
closeNotificationPanel();await openConversation(conversation,other||{id:otherId,username:"User",avatar_url:DEFAULT_AVATAR});
}
}
};
list.appendChild(item);
}

function updateNotificationBadge(list){
const count=list.filter(n=>n.is_read===false||n.is_read===null).length;
const badge=document.getElementById("notificationBadge");
badge.textContent=count>99?"99+":String(count);
badge.style.display=count?"flex":"none";
}

async function markNotificationRead(id){
if(!currentUser||!id)return;
await supabaseClient.from("notifications").update({is_read:true}).eq("id",id).eq("user_id",currentUser.id);
await loadNotifications();
}

async function markAllNotificationsRead(){
if(!currentUser)return;
const {error}=await supabaseClient.from("notifications").update({is_read:true}).eq("user_id",currentUser.id)
.or("is_read.eq.false,is_read.is.null");
if(error){alert("Could not mark notifications as read: "+error.message);return}
await loadNotifications();
}

function subscribeNotificationRealtime(){
if(!currentUser)return;
if(notificationChannel)supabaseClient.removeChannel(notificationChannel);
notificationChannel=supabaseClient.channel("notifications-"+currentUser.id+"-"+Date.now())
.on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+currentUser.id},loadNotifications)
.subscribe();
}

function toggleNotificationPanel(){
if(!currentUser){openLogin();return}
const panel=document.getElementById("notificationPanel");
panel.classList.toggle("show");
if(panel.classList.contains("show"))loadNotifications();
}

function closeNotificationPanel(){document.getElementById("notificationPanel").classList.remove("show")}

function closeChat(){
if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
if(orderChannel)supabaseClient.removeChannel(orderChannel);
realtimeChannel=null;orderChannel=null;
currentConversation=null;currentOtherUser=null;currentOrder=null;
cancelEdit();clearPhoto();
if(mediaRecorder?.state==="recording")mediaRecorder.stop();
document.getElementById("chatScreen").style.display="none";
document.getElementById("messageInput").value="";
loadConversations();updateUnreadCount();
}

function setActiveFilter(button){
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
button.classList.add("active");
}

function showAll(){
setActiveFilter(document.getElementById("allFilter"));
document.querySelectorAll(".chat-item").forEach(x=>x.style.display="flex");
}

function showUnread(){
setActiveFilter(document.getElementById("unreadFilter"));
document.querySelectorAll(".chat-item").forEach(x=>x.style.display=Number(x.dataset.unread||0)>0?"flex":"none");
}

function goHome(){location.href="index.html"}
function goLive(){location.href="live.html"}
function goWallet(){location.href=currentUser?"wallet.html":"login.html"}
function goProfile(){location.href=currentUser?"profile.html":"login.html"}
function openLogin(){location.href="login.html"}
function openRegister(){location.href="register.html"}

async function logout(){
if(!confirm("Do you want to log out?"))return;
for(const c of [realtimeChannel,unreadChannel,notificationChannel,orderChannel])if(c)await supabaseClient.removeChannel(c);
const {error}=await supabaseClient.auth.signOut();
if(error){alert("Logout failed: "+error.message);return}
location.replace("index.html");
}

function messageKey(event){
if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();runOnce(sendMessage);
}
}

function scrollMessages(){
const c=document.getElementById("messagesContainer");c.scrollTop=c.scrollHeight;
}

function formatTime(date){
const value=new Date(date);if(isNaN(value.getTime()))return "";
return value.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

function formatNotificationTime(date){
const value=new Date(date);if(isNaN(value.getTime()))return "";
return value.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function formatDuration(seconds){
return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}

function formatFileSize(bytes){
if(bytes<1024)return bytes+" B";
if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";
return(bytes/(1024*1024)).toFixed(1)+" MB";
}

function getFileExtension(name){
if(!name)return "";
const parts=name.split(".");
return parts.length>1?parts.pop().toLowerCase():"";
}

function randomString(length){
const chars="abcdefghijklmnopqrstuvwxyz0123456789";let result="";
for(let i=0;i<length;i++)result+=chars[Math.floor(Math.random()*chars.length)];
return result;
}

function normalizeUsername(value){
if(value==null)return "";
return String(value).trim().replace(/^@+/,"");
}

function escapeHTML(value){
const div=document.createElement("div");div.textContent=value==null?"":String(value);return div.innerHTML;
}

function getConversationIdFromLink(link){
if(!link)return null;
try{return new URL(link,location.origin).searchParams.get("conversation")}catch{return null}
}

document.getElementById("loginBtn").onclick=()=>runOnce(openLogin);
document.getElementById("registerBtn").onclick=()=>runOnce(openRegister);
document.getElementById("logoutBtn").onclick=()=>runOnce(logout);
document.getElementById("notificationButton").onclick=e=>{e.stopPropagation();runOnce(toggleNotificationPanel)};
document.getElementById("markAllNotifications").onclick=()=>runOnce(markAllNotificationsRead);
document.getElementById("newMessageButton").onclick=()=>document.getElementById("searchInput").focus();
document.getElementById("allFilter").onclick=()=>runOnce(showAll);
document.getElementById("unreadFilter").onclick=()=>runOnce(showUnread);
document.getElementById("backButton").onclick=()=>runOnce(closeChat);
document.getElementById("chatHeaderInfo").onclick=()=>{
const username=document.getElementById("chatHeaderInfo").dataset.username;
if(username)openUserProfileByUsername(username);
};
document.getElementById("chatMore").onclick=()=>openOrderPanel();
document.getElementById("closeOrderPanel").onclick=closeOrderPanel;
document.getElementById("sendMessageButton").onclick=()=>runOnce(sendMessage);
document.getElementById("searchInput").oninput=searchUsers;
document.getElementById("messageInput").onkeydown=messageKey;
document.getElementById("photoButton").onclick=()=>runOnce(openPhotoPicker);
document.getElementById("photoInput").onchange=handlePhotoSelected;
document.getElementById("removePreview").onclick=clearPhoto;
document.getElementById("voiceButton").onclick=()=>runOnce(toggleVoiceRecording);
document.getElementById("stopRecording").onclick=stopVoiceRecording;
document.getElementById("cancelEdit").onclick=()=>{
cancelEdit();document.getElementById("messageInput").value="";
};

document.addEventListener("click",e=>{
const panel=document.getElementById("notificationPanel");
const button=document.getElementById("notificationButton");
if(panel.classList.contains("show")&&!panel.contains(e.target)&&!button.contains(e.target))closeNotificationPanel();
});

supabaseClient.auth.onAuthStateChange((event,session)=>{
if(!session){
currentUser=null;currentUserProfile=null;
location.replace("login.html");
return;
}
currentUser=session.user;
});

document.addEventListener("visibilitychange",async()=>{
if(!document.hidden&&currentUser){
await loadCurrentUserProfile();
await updateUnreadCount();
if(currentConversation)await markConversationAsRead();
}
});

startApp();
</script>
</body>
</html>
