/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;
let realtimeChannel = null;

let openingConversation = false;
let startingConversation = false;
let sendingMessage = false;
let loadingMessages = false;


/* =====================================================
   START
===================================================== */

async function startApp() {

  try {

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();

    if (error) {

      console.error("Session error:", error);

      return;

    }

    if (!data.session) {

      window.location.href =
        "login.html";

      return;

    }

    currentUser =
      data.session.user;

    await loadConversations();

  } catch (error) {

    console.error("Start error:", error);

  }

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations() {

  if (!currentUser) return;

  const list =
    document.getElementById("chatList");

  const empty =
    document.getElementById("empty");

  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  empty.style.display = "none";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      { ascending: false }
    );

  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="loading">
        Could not load conversations.
      </div>`;

    return;

  }

  list.innerHTML = "";

  if (!data || data.length === 0) {

    empty.style.display = "block";

    return;

  }

  empty.style.display = "none";

  for (const conversation of data) {

    const otherId =
      conversation.user_one === currentUser.id
        ? conversation.user_two
        : conversation.user_one;

    await createConversationItem(
      conversation,
      otherId,
      list
    );

  }

}


/* =====================================================
   CONVERSATION ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
) {

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .eq("id", otherId)
    .maybeSingle();

  const name =
    profile?.username ||
    "User";

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";

  const {
    data: last
  } =
  await supabaseClient
    .from("messages")
    .select(
      "content,created_at"
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      { ascending: false }
    )
    .limit(1);

  const item =
    document.createElement("div");

  item.className =
    "chat-item";

  item.dataset.unread = "0";

  item.innerHTML = `

    <img
      class="avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">
          ${escapeHTML(name)}
        </span>

      </div>

      <div class="chat-preview">
        ${
          last && last.length
            ? escapeHTML(last[0].content)
            : "Start a conversation"
        }
      </div>

    </div>
  `;

  /*
    IMPORTANT:
    Use addEventListener instead of inline onclick
    so repeated/double clicks cannot open multiple
    chat screens at the same time.
  */

  let clickLock = false;

  item.addEventListener("click", async function(event) {

    event.preventDefault();
    event.stopPropagation();

    if (clickLock) return;

    clickLock = true;

    try {

      await openConversation(
        conversation,
        profile || {
          id: otherId,
          username: "User",
          avatar_url: "images/profile.png"
        }
      );

    } finally {

      setTimeout(() => {
        clickLock = false;
      }, 400);

    }

  });

  list.appendChild(item);

}


/* =====================================================
   SEARCH USERS
===================================================== */

let searchTimer;

function searchUsers() {

  clearTimeout(searchTimer);

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();

  const results =
    document.getElementById(
      "searchResults"
    );

  if (!query) {

    results.style.display = "none";
    results.innerHTML = "";

    return;

  }

  searchTimer =
    setTimeout(
      async () => {

        if (!currentUser) return;

        const {
          data,
          error
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,avatar_url"
          )
          .ilike(
            "username",
            "%" + query + "%"
          )
          .neq(
            "id",
            currentUser.id
          )
          .limit(10);

        if (error) {

          console.error(error);

          results.innerHTML =
            `<div class="loading">
              Search failed.
            </div>`;

          results.style.display = "block";

          return;

        }

        results.innerHTML = "";

        if (!data || data.length === 0) {

          results.innerHTML =
            `<div class="loading">
              No users found.
            </div>`;

        } else {

          data.forEach(
            profile => {

              const user =
                document.createElement(
                  "div"
                );

              user.className =
                "search-user";

              user.innerHTML = `

                <img
                  src="${
                    escapeHTML(
                      profile.avatar_url ||
                      "images/profile.png"
                    )
                  }"
                  alt="Profile">

                <div class="search-info">

                  <div class="search-name">
                    ${
                      escapeHTML(
                        profile.username ||
                        "User"
                      )
                    }
                  </div>

                  <div class="search-id">
                    Tap to message
                  </div>

                </div>
              `;

              let searchClickLock = false;

              user.addEventListener(
                "click",
                async function(event) {

                  event.preventDefault();
                  event.stopPropagation();

                  if (searchClickLock) return;

                  searchClickLock = true;

                  try {

                    await startConversation(
                      profile
                    );

                  } finally {

                    setTimeout(() => {
                      searchClickLock = false;
                    }, 400);

                  }

                }
              );

              results.appendChild(user);

            }
          );

        }

        results.style.display = "block";

      },
      300
    );

}


/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(profile) {

  if (!currentUser) return;

  if (startingConversation) return;

  startingConversation = true;

  try {

    const otherId =
      profile.id;

    if (!otherId) {

      console.error(
        "User ID missing."
      );

      return;

    }

    const userOne =
      currentUser.id < otherId
        ? currentUser.id
        : otherId;

    const userTwo =
      currentUser.id < otherId
        ? otherId
        : currentUser.id;

    const {
      data: existing,
      error: findError
    } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user_one", userOne)
      .eq("user_two", userTwo)
      .maybeSingle();

    if (findError) {

      alert(
        "Conversation error: " +
        findError.message
      );

      return;

    }

    let conversation =
      existing;

    if (!conversation) {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("conversations")
        .insert({
          user_one: userOne,
          user_two: userTwo
        })
        .select()
        .single();

      if (error) {

        /*
          If two clicks caused a duplicate request,
          try to retrieve the conversation instead
          of breaking the page.
        */

        const {
          data: retryConversation
        } =
        await supabaseClient
          .from("conversations")
          .select("*")
          .eq("user_one", userOne)
          .eq("user_two", userTwo)
          .maybeSingle();

        if (retryConversation) {

          conversation =
            retryConversation;

        } else {

          alert(
            "Could not create conversation: " +
            error.message
          );

          return;

        }

      } else {

        conversation =
          data;

      }

    }

    document.getElementById(
      "searchInput"
    ).value = "";

    document.getElementById(
      "searchResults"
    ).style.display = "none";

    await openConversation(
      conversation,
      profile
    );

  } finally {

    setTimeout(() => {
      startingConversation = false;
    }, 400);

  }

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openConversation(
  conversation,
  profile
) {

  if (!conversation || !conversation.id) {

    console.error(
      "Invalid conversation."
    );

    return;

  }

  if (openingConversation) return;

  openingConversation = true;

  try {

    currentConversation =
      conversation;

    currentOtherUser =
      profile;

    document.getElementById(
      "chatName"
    ).textContent =
    profile?.username ||
    "User";

    document.getElementById(
      "chatAvatar"
    ).src =
    profile?.avatar_url ||
    "images/profile.png";

    document.getElementById(
      "chatScreen"
    ).style.display =
    "block";

    document.body.style.overflow =
    "hidden";

    await loadMessages();

    subscribeRealtime();

    setTimeout(() => {

      document.getElementById(
        "messageInput"
      ).focus();

    }, 100);

  } catch (error) {

    console.error(
      "Open conversation error:",
      error
    );

  } finally {

    setTimeout(() => {
      openingConversation = false;
    }, 350);

  }

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

  if (!currentConversation) return;

  if (loadingMessages) return;

  loadingMessages = true;

  const container =
    document.getElementById(
      "messagesContainer"
    );

  try {

    container.innerHTML = "";

    const {
      data,
      error
    } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        currentConversation.id
      )
      .order(
        "created_at",
        { ascending: true }
      );

    if (error) {

      container.innerHTML =
        `<div class="loading">
          ${escapeHTML(error.message)}
        </div>`;

      return;

    }

    if (!data || data.length === 0) {

      container.innerHTML =
        `<div class="loading">
          No messages yet 👋
        </div>`;

      return;

    }

    data.forEach(
      message =>
        renderMessage(message)
    );

    scrollMessages();

  } catch (error) {

    console.error(
      "Load messages error:",
      error
    );

  } finally {

    loadingMessages = false;

  }

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message) {

  const container =
    document.getElementById(
      "messagesContainer"
    );

  const row =
    document.createElement("div");

  row.className =
    "message-row" +
    (
      message.sender_id ===
      currentUser.id
        ? " mine"
        : ""
    );

  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";

  bubble.innerHTML = `

    <div>
      ${escapeHTML(message.content)}
    </div>

    <div class="message-time">
      ${formatTime(message.created_at)}
    </div>

  `;

  row.appendChild(bubble);

  container.appendChild(row);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  if (sendingMessage) return;

  if (!currentUser) return;

  if (!currentConversation) return;

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  sendingMessage = true;

  /*
    Disable repeated sending while the first
    database request is running.
  */

  const sendButton =
    document.querySelector(
      ".send-message"
    );

  if (sendButton) {

    sendButton.disabled = true;
    sendButton.style.opacity = "0.6";

  }

  try {

    const {
      error
    } =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          currentConversation.id,

        sender_id:
          currentUser.id,

        content:
          text
      });

    if (error) {

      alert(
        "Message failed: " +
        error.message
      );

      return;

    }

    input.value = "";

    await loadMessages();

  } catch (error) {

    console.error(
      "Send message error:",
      error
    );

  } finally {

    if (sendButton) {

      sendButton.disabled = false;
      sendButton.style.opacity = "1";

    }

    setTimeout(() => {
      sendingMessage = false;
    }, 300);

  }

}


/* =====================================================
   REALTIME
===================================================== */

function subscribeRealtime() {

  if (!currentConversation) return;

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;

  }

  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        currentConversation.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "conversation_id=eq." +
            currentConversation.id
        },
        async () => {

          if (!loadingMessages) {
            await loadMessages();
          }

        }
      )
      .subscribe();

}


/* =====================================================
   CLOSE CHAT
===================================================== */

function closeChat() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;

  }

  currentConversation = null;
  currentOtherUser = null;

  document.getElementById(
    "chatScreen"
  ).style.display =
  "none";

  document.body.style.overflow =
  "";

  document.getElementById(
    "messagesContainer"
  ).innerHTML = "";

  loadConversations();

}


/* =====================================================
   FILTER
===================================================== */

function showAll(button) {

  setActiveFilter(button);

  document
    .querySelectorAll(".chat-item")
    .forEach(
      item => {
        item.style.display = "flex";
      }
    );

}


function showUnread(button) {

  setActiveFilter(button);

  document
    .querySelectorAll(".chat-item")
    .forEach(
      item => {

        item.style.display =
          Number(
            item.dataset.unread || 0
          ) > 0
            ? "flex"
            : "none";

      }
    );

}


function setActiveFilter(button) {

  document
    .querySelectorAll(".filter")
    .forEach(
      b =>
        b.classList.remove("active")
    );

  button.classList.add("active");

}


/* =====================================================
   NEW MESSAGE
===================================================== */

function focusSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );

  input.focus();

  input.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =====================================================
   ENTER TO SEND
===================================================== */

function messageKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages() {

  const container =
    document.getElementById(
      "messagesContainer"
    );

  container.scrollTop =
    container.scrollHeight;

}


function formatTime(date) {

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}


/* =====================================================
   AUTH
===================================================== */

supabaseClient.auth
  .onAuthStateChange(
    (event, session) => {

      if (!session) {

        window.location.href =
          "login.html";

      }

    }
  );


/* =====================================================
   START
===================================================== */

startApp();

</script></body>
