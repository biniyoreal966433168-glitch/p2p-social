/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;

let realtimeChannel = null;
let unreadChannel = null;
let notificationChannel = null;

let searchTimer = null;
let actionLock = false;


/* =====================================================
   RUN ONCE
===================================================== */

function runOnce(action){

  if(actionLock){
    return;
  }

  actionLock = true;

  try{

    const result = action();

    if(
      result &&
      typeof result.finally === "function"
    ){

      result.finally(() => {

        setTimeout(() => {
          actionLock = false;
        },350);

      });

      return;
    }

  }catch(error){

    console.error(error);

  }

  setTimeout(() => {
    actionLock = false;
  },350);
}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(
      "Session error:",
      error
    );

    return;
  }

  if(!data.session){

    window.location.replace(
      "login.html"
    );

    return;
  }

  currentUser =
    data.session.user;

  await updateAuthUI();

  await loadConversations();

  await updateUnreadCount();

  await loadNotifications();

  subscribeGlobalRealtime();

  subscribeNotificationRealtime();
}


/* =====================================================
   AUTH UI
===================================================== */

async function updateAuthUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userInfo =
    document.getElementById("userInfo");

  const usernameDisplay =
    document.getElementById("usernameDisplay");

  loginBtn.style.display = "none";
  registerBtn.style.display = "none";
  logoutBtn.style.display = "block";
  userInfo.style.display = "block";

  let username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select("username")
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();

  if(profile?.username){
    username = profile.username;
  }

  usernameDisplay.textContent =
    username;
}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations(){

  if(!currentUser){
    return;
  }

  const list =
    document.getElementById("chatList");

  const empty =
    document.getElementById("empty");

  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  empty.style.display = "none";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    list.innerHTML =
      `<div class="loading">
        Could not load conversations.
        <br>
        <small>
        ${escapeHTML(error.message)}
        </small>
      </div>`;

    return;
  }

  list.innerHTML = "";

  if(
    !data ||
    data.length === 0
  ){

    empty.style.display = "block";
    return;
  }

  for(
    const conversation of data
  ){

    const otherId =
      conversation.user_one === currentUser.id
        ? conversation.user_two
        : conversation.user_one;

    await createConversationItem(
      conversation,
      otherId,
      list
    );
  }
}


/* =====================================================
   CREATE CONVERSATION ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
){

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .eq(
      "id",
      otherId
    )
    .maybeSingle();

  const name =
    profile?.username || "User";

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";


  const {
    data: last
  } =
  await supabaseClient
    .from("messages")
    .select(
      "content,created_at,sender_id"
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1);


  const {
    count: unreadCount
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );


  const unread =
    unreadCount || 0;

  const lastMessage =
    last?.length
      ? last[0]
      : null;

  const lastText =
    lastMessage
      ? lastMessage.content
      : "Start a conversation";

  const lastTime =
    lastMessage
      ? formatTime(
          lastMessage.created_at
        )
      : "";


  const item =
    document.createElement("div");

  item.className =
    "chat-item";

  item.dataset.unread =
    String(unread);

  if(unread > 0){
    item.classList.add("has-unread");
  }


  item.innerHTML = `

    <img
      class="avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">
          ${escapeHTML(name)}
        </span>

      </div>

      <div class="chat-preview">
        ${escapeHTML(lastText)}
      </div>

    </div>

    <div class="chat-right">

      <div class="chat-time">
        ${escapeHTML(lastTime)}
      </div>

      <span
        class="unread-badge"
        style="${
          unread > 0
            ? "display:flex;"
            : "display:none;"
        }">

        ${
          unread > 99
            ? "99+"
            : unread
        }

      </span>

    </div>
  `;


  item.addEventListener(
    "click",
    () => {

      runOnce(() => {

        return openConversation(
          conversation,
          profile || {
            id:otherId,
            username:"User",
            avatar_url:
              "images/profile.png"
          }
        );

      });

    }
  );


  list.appendChild(item);
}


/* =====================================================
   UNREAD COUNT
===================================================== */

async function updateUnreadCount(){

  if(!currentUser){
    return;
  }

  const {
    data: conversations
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    );

  if(
    !conversations ||
    conversations.length === 0
  ){

    updateUnreadUI(0);
    return;
  }


  const ids =
    conversations.map(
      c => c.id
    );


  const {
    count
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .in(
      "conversation_id",
      ids
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );


  updateUnreadUI(
    count || 0
  );
}


function updateUnreadUI(count){

  const value =
    Number(count) || 0;

  const text =
    value > 99
      ? "99+"
      : String(value);

  const titleBadge =
    document.getElementById(
      "titleUnread"
    );

  const navBadge =
    document.getElementById(
      "messagesNavBadge"
    );


  if(value > 0){

    titleBadge.textContent =
      text;

    titleBadge.style.display =
      "inline-flex";

    navBadge.textContent =
      text;

    navBadge.style.display =
      "inline-flex";

  }else{

    titleBadge.style.display =
      "none";

    navBadge.style.display =
      "none";

  }
}

/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(profile){

  if(
    !currentUser ||
    !profile?.id
  ){
    return;
  }


  const otherId =
    profile.id;


  const userOne =
    currentUser.id < otherId
      ? currentUser.id
      : otherId;

  const userTwo =
    currentUser.id < otherId
      ? otherId
      : currentUser.id;


  const {
    data: existing,
    error: findError
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .eq(
      "user_one",
      userOne
    )
    .eq(
      "user_two",
      userTwo
    )
    .maybeSingle();


  if(findError){

    alert(
      "Conversation error: " +
      findError.message
    );

    return;
  }


  let conversation =
    existing;


  if(!conversation){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select()
      .single();


    if(error){

      alert(
        "Could not create conversation: " +
        error.message
      );

      return;
    }


    conversation =
      data;
  }


  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "searchResults"
  ).style.display = "none";


  await openConversation(
    conversation,
    profile
  );
}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !currentConversation
  ){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );

  const button =
    document.getElementById(
      "sendMessageButton"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  if(button.disabled){
    return;
  }


  input.value = "";

  button.disabled = true;


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({

      conversation_id:
        currentConversation.id,

      sender_id:
        currentUser.id,

      content:
        text

    });


  button.disabled = false;


  if(error){

    input.value = text;

    alert(
      "Message failed: " +
      error.message
    );

    return;
  }


  await loadMessages();

  await updateUnreadCount();

  await loadConversations();
}


/* =====================================================
   REALTIME CHAT
===================================================== */

function subscribeRealtime(){

  if(!currentConversation){
    return;
  }


  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  const conversationId =
    currentConversation.id;


  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        async payload => {

          if(
            currentConversation &&
            payload?.new &&
            payload.new.conversation_id ===
              currentConversation.id
          ){

            await loadMessages();

            await markConversationAsRead();

          }

        }
      )
      .subscribe();
}


/* =====================================================
   GLOBAL REALTIME
===================================================== */

function subscribeGlobalRealtime(){

  if(!currentUser){
    return;
  }


  if(unreadChannel){

    supabaseClient
      .removeChannel(
        unreadChannel
      );

  }


  unreadChannel =
    supabaseClient
      .channel(
        "global-messages-" +
        currentUser.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload => {

          if(!payload?.new){
            return;
          }


          const message =
            payload.new;


          if(
            message.sender_id ===
            currentUser.id
          ){
            return;
          }


          if(
            currentConversation &&
            message.conversation_id ===
            currentConversation.id
          ){

            await markConversationAsRead();

            await loadMessages();

            return;
          }


          await updateUnreadCount();

          await loadConversations();

        }
      )
      .subscribe();
}


/* =====================================================
   MARK READ
===================================================== */

async function markConversationAsRead(){

  if(
    !currentUser ||
    !currentConversation
  ){
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      read_at:
        new Date().toISOString()
    })
    .eq(
      "conversation_id",
      currentConversation.id
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );


  if(error){

    console.error(
      "Read update error:",
      error
    );

    return;
  }


  await updateUnreadCount();
}

async function loadNotifications(){

  }


  const list =
    document.getElementById(
      "notificationList"
    );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(50);


  if(error){

    list.innerHTML =
      `<div class="notification-empty">
        Could not load notifications.
      </div>`;

    return;
  }


  list.innerHTML = "";


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      `<div class="notification-empty">
        🔔<br><br>
        No notifications yet.
      </div>`;

    updateNotificationBadge([]);

    return;
  }


  for(
    const notification of data
  ){

    await renderNotification(
      notification,
      list
    );

  }


  updateNotificationBadge(data);
}


async function renderNotification(
  notification,
  list
){

  let profile = null;


  if(notification.sender_id){

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url"
      )
      .eq(
        "id",
        notification.sender_id
      )
      .maybeSingle();

    profile = data;
  }


  const item =
    document.createElement("div");


  item.className =
    "notification-item" +
    (
      notification.is_read
        ? ""
        : " unread"
    );


  const avatar =
    profile?.avatar_url ||
    "images/profile.png";


  item.innerHTML = `

    <img
      class="notification-avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="notification-content">

      <div class="notification-text">

        ${
          profile?.username
            ? "<strong>" +
              escapeHTML(
                profile.username
              ) +
              "</strong> "
            : ""
        }

        ${
          notification.title
            ? "<strong>" +
              escapeHTML(
                notification.title
              ) +
              "</strong><br>"
            : ""
        }

        ${escapeHTML(
          notification.message ||
          "You have a new notification."
        )}

      </div>

      <div class="notification-time">

        ${
          formatNotificationTime(
            notification.created_at
          )
        }

      </div>

    </div>

  `;


  item.addEventListener(
    "click",
    async () => {

      await markNotificationRead(
        notification.id
      );


      const conversationId =
        notification.conversation_id ||
        getConversationIdFromLink(
          notification.link
        );


      if(
        notification.type === "message" &&
        conversationId
      ){

        const {
          data: conversation
        } =
        await supabaseClient
          .from("conversations")
          .select("*")
          .eq(
            "id",
            conversationId
          )
          .maybeSingle();


        if(conversation){

          const otherId =
            conversation.user_one ===
            currentUser.id
              ? conversation.user_two
              : conversation.user_one;


          const {
            data: otherProfile
          } =
          await supabaseClient
            .from("profiles")
            .select(
              "id,username,avatar_url"
            )
            .eq(
              "id",
              otherId
            )
            .maybeSingle();


          closeNotificationPanel();


          await openConversation(
            conversation,
            otherProfile || {
              id:otherId,
              username:"User",
              avatar_url:
                "images/profile.png"
            }
          );

        }

      }

    }
  );


  list.appendChild(item);
}


function getConversationIdFromLink(link){

  if(!link){
    return null;
  }


  try{

    const url =
      new URL(
        link,
        window.location.origin
      );

    return url.searchParams.get(
      "conversation"
    );

  }catch(error){

    return null;
  }
}


function updateNotificationBadge(
  notifications
){

  const unread =
    notifications.filter(
      item =>
        item.is_read === false ||
        item.is_read === null

  const badge =

    );


  if(unread > 0){

    badge.textContent =
      unread > 99
        ? "99+"
        : String(unread);

    badge.style.display =
      "flex";

  }else{

    badge.textContent =
      "";

    badge.style.display =
      "none";

  }
}

===================================================== */

function closeChat(){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;
  }


  currentConversation = null;
  currentOtherUser = null;


  document.getElementById(
    "chatScreen"
  ).style.display =
    "none";


  document.getElementById(
    "messageInput"
  ).value =
    "";


  loadConversations();

  updateUnreadCount();
}

function setActiveFilter(button){

      item =>

  button.classList.add("active");
}


function showAll(){

  setActiveFilter(

      "allFilter"

  );


  document
    .querySelectorAll(".chat-item")

          "flex"
    );
}


function showUnread(){

  setActiveFilter(
    document.getElementById(
      "unreadFilter"
    )
  );


  document
    .querySelectorAll(".chat-item")
    .forEach(
      item => {

        item.style.display =
          Number(

    );
}

/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  if(
    !confirm(
      "Do you want to log out?"
    )
  ){
    return;
  }


  if(realtimeChannel){

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  if(unreadChannel){

    await supabaseClient
      .removeChannel(
        unreadChannel
      );

  }


  if(notificationChannel){

    await supabaseClient
      .removeChannel(
        notificationChannel
      );

  }


  const {
    error
  } =
  await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;
  }


  window.location.replace(
    "index.html"
  );
}

   ENTER TO SEND
===================================================== */

function messageKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    runOnce(() => {

      return sendMessage();

    });

  }
}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages(){

  const container =
    document.getElementById(
      "messagesContainer"
    );

  container.scrollTop =
    container.scrollHeight;
}


function formatTime(date){

  const value =
    new Date(date);


  if(
    isNaN(
      value.getTime()
    )
  ){
    return "";
  }


  return value.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function formatNotificationTime(date){

  const value =
    new Date(date);


  if(
    isNaN(
      value.getTime()
    )
  ){
    return "";
  }


  return value.toLocaleString(
    [],
    {
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}
