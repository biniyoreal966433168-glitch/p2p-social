<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const MESSAGE_MEDIA_BUCKET="message-media";
const DEFAULT_AVATAR="images/profile.png";

let currentUser=null;
let currentUserProfile=null;
let currentConversation=null;
let currentOtherUser=null;
let currentOrder=null;

let realtimeChannel=null;
let unreadChannel=null;
let notificationChannel=null;
let orderChannel=null;
let searchTimer=null;
let actionLock=false;

let selectedPhoto=null;
let editingMessageId=null;

let mediaRecorder=null;
let audioChunks=[];
let recordingStartedAt=null;
let recordingTimer=null;

function runOnce(action){
  if(actionLock)return;

  actionLock=true;

  try{
    const r=action();

    if(r&&typeof r.finally==="function"){
      r.finally(()=>{
        setTimeout(()=>{
          actionLock=false;
        },350);
      });
      return;
    }
  }catch(e){
    console.error(e);
  }

  setTimeout(()=>{
    actionLock=false;
  },350);
}

function showToast(message){
  const t=document.getElementById("toast");

  t.textContent=message;
  t.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    t.classList.remove("show");
  },2500);
}

function showActionNotification(success,message){
  showToast((success?"✅ ":"❌ ")+message);
}

async function startApp(){
  const{data,error}=await supabaseClient.auth.getSession();

  if(error){
    showActionNotification(false,"Session error");
    console.error(error);
    return;
  }

  if(!data.session){
    location.replace("login.html");
    return;
  }

  currentUser=data.session.user;

  await loadCurrentUserProfile();
  await updateAuthUI();
  await loadConversations();
  await updateUnreadCount();
  await loadNotifications();

  subscribeGlobalRealtime();
  subscribeNotificationRealtime();

  openUsernameConversationFromUrl();
}

async function loadCurrentUserProfile(){
  if(!currentUser)return null;

  const{data,error}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error)console.error(error);

  currentUserProfile=data||{
    id:currentUser.id,
    username:currentUser.user_metadata?.username||currentUser.email?.split("@")[0]||"User",
    avatar_url:DEFAULT_AVATAR
  };

  return currentUserProfile;
}

async function updateAuthUI(){
  loginBtn.style.display="none";
  registerBtn.style.display="none";
  logoutBtn.style.display="block";
  userInfo.style.display="block";

  usernameDisplay.textContent="@"+(
    currentUserProfile?.username||
    currentUser.email?.split("@")[0]||
    "User"
  );
}

async function loadConversations(){
  if(!currentUser)return;

  chatList.innerHTML='<div class="loading">Loading conversations...</div>';
  empty.style.display="none";

  const{data,error}=await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq."+currentUser.id+
      ",user_two.eq."+currentUser.id
    )
    .order("updated_at",{ascending:false});

  if(error){
    chatList.innerHTML=
      '<div class="loading">Could not load conversations.<br><small>'+
      escapeHTML(error.message)+
      '</small></div>';
    return;
  }

  chatList.innerHTML="";

  if(!data?.length){
    empty.style.display="block";
    return;
  }

  for(const c of data){
    const otherId=
      c.user_one===currentUser.id?
      c.user_two:
      c.user_one;

    await createConversationItem(c,otherId,chatList);
  }
}

async function createConversationItem(c,otherId,list){
  const{data:p}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",otherId)
    .maybeSingle();

  const username=normalizeUsername(p?.username)||"User";
  const avatar=p?.avatar_url||DEFAULT_AVATAR;

  const{data:last}=await supabaseClient
    .from("messages")
    .select("content,created_at,sender_id,message_type")
    .eq("conversation_id",c.id)
    .order("created_at",{ascending:false})
    .limit(1);

  const{count}=await supabaseClient
    .from("messages")
    .select("id",{count:"exact",head:true})
    .eq("conversation_id",c.id)
    .neq("sender_id",currentUser.id)
    .is("read_at",null);

  const unread=count||0;
  const l=last?.[0];

  let lt="Start a conversation";

  if(l){
    if(l.message_type==="photo")lt="📷 Photo";
    else if(l.message_type==="voice")lt="🎤 Voice message";
    else if(l.message_type==="order")lt="🛡️ P2P order";
    else lt=l.content||"Message";
  }

  const item=document.createElement("div");

  item.className="chat-item"+(unread?" has-unread":"");
  item.dataset.unread=unread;

  item.innerHTML=
    '<img class="avatar" src="'+escapeHTML(avatar)+'" alt="Profile">'+
    '<div class="chat-info">'+
      '<div class="chat-top">'+
        '<span class="chat-name">@'+escapeHTML(username)+'</span>'+
      '</div>'+
      '<div class="chat-preview">'+escapeHTML(lt)+'</div>'+
    '</div>'+
    '<div class="chat-right">'+
      '<div class="chat-time">'+
        (l?formatTime(l.created_at):"")+
      '</div>'+
      '<span class="unread-badge" style="'+
        (unread?"display:flex":"display:none")+
      '">'+
        (unread>99?"99+":unread)+
      '</span>'+
    '</div>';

  item.onclick=()=>{
    runOnce(()=>openConversation(
      c,
      p||{
        id:otherId,
        username:"User",
        avatar_url:DEFAULT_AVATAR
      }
    ));
  };

  list.appendChild(item);
}

function searchUsers(){
  clearTimeout(searchTimer);

  const q=searchInput.value.trim();

  if(!q){
    searchResults.style.display="none";
    searchResults.innerHTML="";
    return;
  }

  searchTimer=setTimeout(async()=>{
    if(!currentUser)return;

    const clean=q.replace(/^@/,"");

    const{data,error}=await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url")
      .ilike("username","%"+clean+"%")
      .neq("id",currentUser.id)
      .limit(10);

    if(error){
      searchResults.innerHTML=
        '<div class="loading">Search failed.</div>';

      searchResults.style.display="block";

      showActionNotification(false,"User search failed");
      return;
    }

    searchResults.innerHTML="";

    if(!data?.length){
      searchResults.innerHTML=
        '<div class="loading">No users found.</div>';
    }else{
      data.forEach(p=>{
        const u=normalizeUsername(p.username)||"User";

        const x=document.createElement("div");

        x.className="search-user";

        x.innerHTML=
          '<img src="'+
          escapeHTML(p.avatar_url||DEFAULT_AVATAR)+
          '" alt="Profile">'+
          '<div class="search-info">'+
            '<div class="search-name">@'+
              escapeHTML(u)+
            '</div>'+
            '<div class="search-id">View user • Send message</div>'+
          '</div>';

        x.onclick=()=>{
          runOnce(()=>startConversation(p));
        };

        searchResults.appendChild(x);
      });
    }

    searchResults.style.display="block";
  },300);
}

async function startConversation(p){
  if(!currentUser||!p?.id)return;

  const username=normalizeUsername(p.username);

  if(!username){
    showActionNotification(false,"This user has no username");
    return;
  }

  const a=currentUser.id<p.id?
    currentUser.id:
    p.id;

  const b=currentUser.id<p.id?
    p.id:
    currentUser.id;

  let{data:c,error}=await supabaseClient
    .from("conversations")
    .select("*")
    .eq("user_one",a)
    .eq("user_two",b)
    .maybeSingle();

  if(error){
    showActionNotification(false,"Conversation error");
    return;
  }

  if(!c){
    const r=await supabaseClient
      .from("conversations")
      .insert({
        user_one:a,
        user_two:b
      })
      .select()
      .single();

    if(r.error){
      showActionNotification(false,"Could not create conversation");
      return;
    }

    c=r.data;

    showActionNotification(true,"Conversation created");
  }

  searchInput.value="";
  searchResults.style.display="none";

  await openConversation(c,{
    id:p.id,
    username,
    avatar_url:p.avatar_url||DEFAULT_AVATAR
  });
}

async function openConversation(c,p){
  if(!c)return;

  const username=normalizeUsername(p?.username)||"User";

  currentConversation=c;

  currentOtherUser={
    ...p,
    username
  };

  chatName.textContent="@"+username;
  chatAvatar.src=p?.avatar_url||DEFAULT_AVATAR;
  chatHeaderInfo.dataset.username=username;
  chatScreen.style.display="block";

  closeNotificationPanel();
  cancelEdit();
  clearPhoto();
  closeOrderPanel();

  await loadMessages();
  await markConversationAsRead();
  await loadConversationOrder();

  subscribeRealtime();
  subscribeOrderRealtime();

  setTimeout(()=>{
    messageInput.focus();
  },100);

  showActionNotification(true,"Conversation opened");
}

function openUserProfileByUsername(u){
  const c=normalizeUsername(u);

  if(c)
    location.href=
      "profile.html?username="+encodeURIComponent(c);
}

async function openUsernameConversationFromUrl(){
  if(!currentUser)return;

  const u=normalizeUsername(
    new URLSearchParams(location.search).get("username")
  );

  if(!u)return;

  const{data:p}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("username",u)
    .maybeSingle();

async function loadMessages(){
  if(!currentConversation)return;

  const{data,error}=await supabaseClient
    .from("messages")
    .select("*")
    .eq("conversation_id",currentConversation.id)
    .order("created_at",{ascending:true});

  if(error){
    messagesContainer.innerHTML=
      '<div class="loading">'+
      escapeHTML(error.message)+
      '</div>';
    return;
  }

  messagesContainer.innerHTML="";

  if(!data?.length){
    messagesContainer.innerHTML=
      '<div class="loading">No messages yet 👋</div>';
    return;
  }

  data.forEach(renderMessage);
  scrollMessages();
}

function renderMessage(m){
  const row=document.createElement("div");

  row.className=
    "message-row"+
    (m.sender_id===currentUser.id?" mine":"");

  const b=document.createElement("div");
  b.className="message-bubble";

  const type=m.message_type||"text";

  if(type==="photo"){
    const i=document.createElement("img");

    i.className="message-photo";
    i.src=m.media_url||"";
    i.alt="Photo";

    i.onclick=()=>{
      if(m.media_url)
        open(m.media_url,"_blank");
    };

    b.appendChild(i);

    if(m.content){
      const c=document.createElement("div");

      c.style.marginTop="7px";
      c.textContent=m.content;

      b.appendChild(c);
    }
  }

  else if(type==="voice"){
    const v=document.createElement("div");
    v.className="voice-message";

    const a=document.createElement("audio");

    a.controls=true;
    a.preload="metadata";
    a.src=m.media_url||"";

    v.appendChild(a);
    b.appendChild(v);
  }

  else if(type==="order"){
    const card=document.createElement("div");

    card.className="order-message-card";
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");

    const title=document.createElement("div");
    title.className="order-message-title";
    title.textContent="🛡️ P2P Order";

    const text=document.createElement("div");
    text.className="order-message-text";
    text.textContent=m.content||"Trade/order attached";

    const action=document.createElement("div");
    action.className="order-message-action";
    action.textContent="View Order";

    card.appendChild(title);
    card.appendChild(text);
    card.appendChild(action);

    const openAttached=async()=>{
      if(m.order_id){
        await loadOrderByMessageId(m.order_id);
      }else{
        await loadConversationOrder();
      }

      openOrderPanel();

      showActionNotification(true,"P2P order opened");
    };

    card.onclick=()=>{
      runOnce(openAttached);
    };

    card.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        runOnce(openAttached);
      }
    };

    b.appendChild(card);
  }

  else{
    const t=document.createElement("div");

    t.textContent=m.content||"";

    b.appendChild(t);
  }

  const tm=document.createElement("div");

  tm.className=
    type==="order"?
    "order-message-time":
    "message-time";

  tm.textContent=formatTime(m.created_at);

  if(m.edited_at){
    const e=document.createElement("span");

    e.className="message-edited";
    e.textContent="edited";

    tm.appendChild(e);
  }

  b.appendChild(tm);

  if(type!=="voice"&&type!=="order"){
    const ac=document.createElement("div");

    ac.className="message-actions";

    const cp=document.createElement("button");

    cp.className="message-action";
    cp.textContent="📋 Copy";

    cp.onclick=e=>{
      e.stopPropagation();
      copyText(m.content||"");
    };

    ac.appendChild(cp);

    if(m.sender_id===currentUser.id&&type==="text"){
      const ed=document.createElement("button");

      ed.className="message-action";
      ed.textContent="✏️ Edit";

      ed.onclick=e=>{
        e.stopPropagation();
        beginEdit(m);
      };

      ac.appendChild(ed);

      const dl=document.createElement("button");

      dl.className="message-action";
      dl.textContent="🗑️ Delete";

      dl.onclick=e=>{
        e.stopPropagation();
        deleteMessage(m.id);
      };

      ac.appendChild(dl);
    }

    b.appendChild(ac);
  }

  row.appendChild(b);
  messagesContainer.appendChild(row);
}

async function loadOrderByMessageId(orderId){
  currentOrder=null;

  const t=await supabaseClient
    .from("p2p_trades")
    .select("*")
    .eq("id",orderId)
    .maybeSingle();

  if(!t.error&&t.data){
    currentOrder={
      ...t.data,
      _order:null
    };

    if(t.data.order_id){
      const o=await supabaseClient
        .from("p2p_orders")
        .select("*")
        .eq("id",t.data.order_id)
        .maybeSingle();

      if(!o.error&&o.data){
        currentOrder={
          ...t.data,
          _order:o.data,
          order_id:o.data.id
        };
      }
    }

    renderOrder(currentOrder);
    return;
  }

  const o=await supabaseClient
    .from("p2p_orders")
    .select("*")
    .eq("id",orderId)
    .maybeSingle();

  if(!o.error&&o.data){
    currentOrder={
      ...o.data,
      _order:o.data
    };

    renderOrder(currentOrder);
    return;
  }

  renderOrder(null);
}

async function copyText(t){
  if(!t)return;

  try{
    await navigator.clipboard.writeText(t);
  }catch{
    const a=document.createElement("textarea");

    a.value=t;

    document.body.appendChild(a);

    a.select();

    document.execCommand("copy");

    a.remove();
  }

  showActionNotification(true,"Message copied");
}

function beginEdit(m){
  editingMessageId=m.id;

  messageInput.value=m.content||"";

  editBar.classList.add("show");

  messageInput.focus();

  messageInput.setSelectionRange(
    messageInput.value.length,
    messageInput.value.length
  );

  showActionNotification(true,"Editing message");
}

function cancelEdit(){
  editingMessageId=null;
  editBar.classList.remove("show");
}

async function updateMessage(){
  if(!editingMessageId||!currentUser)return false;

  const t=messageInput.value.trim();

  if(!t){
    showActionNotification(false,"Message cannot be empty");
    return false;
  }

  const{error}=await supabaseClient
    .from("messages")
    .update({
      content:t,
      edited_at:new Date().toISOString()
    })
    .eq("id",editingMessageId)
    .eq("sender_id",currentUser.id);

  if(error){
    showActionNotification(false,"Could not edit message");
    return false;
  }

  messageInput.value="";

  cancelEdit();

  await loadMessages();

  showActionNotification(true,"Message edited");

  return true;
}

async function deleteMessage(id){
  if(!currentUser||!id)return;

  if(!confirm("Delete this message?"))return;

  const{error}=await supabaseClient
    .from("messages")
    .delete()
    .eq("id",id)
    .eq("sender_id",currentUser.id);

  if(error){
    showActionNotification(false,"Could not delete message");
    return;
  }

  await loadMessages();

  showActionNotification(true,"Message deleted");
}

async function sendMessage(){
  if(!currentUser||!currentConversation)return;

  if(editingMessageId){
    await updateMessage();
    return;
  }

  if(selectedPhoto){
    await sendPhotoMessage();
    return;
  }

  const t=messageInput.value.trim();
  const btn=sendMessageButton;

  if(!t||btn.disabled)return;

  messageInput.value="";
  btn.disabled=true;

  const{error}=await supabaseClient
    .from("messages")
    .insert({
      conversation_id:currentConversation.id,
      sender_id:currentUser.id,
      content:t,
      message_type:"text"
    });

  btn.disabled=false;

  if(error){
    messageInput.value=t;
    showActionNotification(false,"Message failed");
    return;
  }

  await supabaseClient
    .from("conversations")
    .update({
      updated_at:new Date().toISOString()
    })
    .eq("id",currentConversation.id);

  await loadMessages();
  await updateUnreadCount();

  scrollMessages();

  showActionNotification(true,"Message sent");
}

async function sendTradeSystemMessage(content){
  if(!currentConversation||!currentUser||!content)
    return false;

  const{data:existing,error:checkError}=await supabaseClient
    .from("messages")
    .select("id,content,created_at")
    .eq("conversation_id",currentConversation.id)
    .eq("sender_id",currentUser.id)
    .eq("content",content)
    .order("created_at",{ascending:false})
    .limit(1);

  if(checkError){
    console.error(checkError);
  }

  if(existing?.length)
    return true;

  const{error}=await supabaseClient
    .from("messages")
    .insert({
      conversation_id:currentConversation.id,
      sender_id:currentUser.id,
      content,
      message_type:"text"
    });

  if(error){
    console.error(error);
    return false;
  }

  await supabaseClient
    .from("conversations")
    .update({
      updated_at:new Date().toISOString()
    })
    .eq("id",currentConversation.id);

  return true;
}

async function loadConversationOrder(){
  if(!currentConversation)return;

  currentOrder=null;

  const{data:om,error:messageError}=await supabaseClient
    .from("messages")
    .select("order_id")
    .eq("conversation_id",currentConversation.id)
    .not("order_id","is",null)
    .order("created_at",{ascending:false})
    .limit(1);

  if(!messageError&&om?.[0]?.order_id){
    await loadOrderByMessageId(om[0].order_id);
    return;
  }

  renderOrder(null);
}

function getLinkedOrder(o){
  return o?._order||null;
}

function orderAmount(o){
  const linked=getLinkedOrder(o);

  if(linked?.amount!=null)
    return linked.amount;

  if(o?.usdt_amount!=null)
    return o.usdt_amount;

  if(o?.order_amount!=null)
    return o.order_amount;

  if(
    o?.buyer_id&&
    o?.amount!=null&&
    o?.price!=null&&
    Number(o.price)>0
  )
    return Number(o.amount)/Number(o.price);

  return o?.amount??o?.quantity??o?.crypto_amount??"—";
}

function orderType(o){
  const linked=getLinkedOrder(o);

  return linked?.order_type??
         o?.order_type??
         o?.type??
         "P2P";
}

function orderPrice(o){
  const linked=getLinkedOrder(o);

  return linked?.price??
         o?.price??
         o?.unit_price??
         o?.rate??
         "—";
}

function orderPair(o){
  const linked=getLinkedOrder(o);

  return String(
    linked?.pair??
    o?.pair??
    ""
  ).toUpperCase();
}

function orderCurrency(o){
  const pair=orderPair(o);

  if(pair.includes("ETB"))return "ETB";
  if(pair.includes("NGN"))return "NGN";
  if(pair.includes("KES"))return "KES";
  if(pair.includes("AED"))return "AED";
  if(pair.includes("EUR"))return "EUR";
  if(pair.includes("GBP"))return "GBP";
  if(pair.includes("USD"))return "USD";
  if(pair.includes("BRL"))return "BRL";
  if(pair.includes("ARS"))return "ARS";
  if(pair.includes("MXN"))return "MXN";
  if(pair.includes("TRY"))return "TRY";
  if(pair.includes("PHP"))return "PHP";
  if(pair.includes("AUD"))return "AUD";
  if(pair.includes("CAD"))return "CAD";
  if(pair.includes("CHF"))return "CHF";
  if(pair.includes("SGD"))return "SGD";
  if(pair.includes("HKD"))return "HKD";
  if(pair.includes("JPY"))return "JPY";
  if(pair.includes("KRW"))return "KRW";
  if(pair.includes("ZAR"))return "ZAR";
  if(pair.includes("INR"))return "INR";

  return "ETB";
}

function orderStatus(o){
  return String(o?.status??"pending");
}

function orderNumber(o){
  const linked=getLinkedOrder(o);

  return linked?.id??
         o?.order_id??
         o?.id??
         "—";
}

function orderTotalCurrency(o){
  const linked=getLinkedOrder(o);

  const amount=Number(orderAmount(o));
  const price=Number(orderPrice(o));

  if(
    linked?.amount!=null&&
    linked?.price!=null&&
    Number.isFinite(amount)&&
    Number.isFinite(price)
  ){
    return amount*price;
  }

  if(
    o?.buyer_id&&
    o?.amount!=null&&
    Number.isFinite(Number(o.amount))
  ){
    return Number(o.amount);
  }

  if(
    Number.isFinite(amount)&&
    Number.isFinite(price)
  )
    return amount*price;

  return "—";
}

function orderPaymentDetail(o){
  const linked=getLinkedOrder(o);

  return linked?.payment_method??
         o?.payment_method??
         o?.bank_detail??
         o?.bank_details??
         o?.payment_details??
         "—";
}

function formatNumberValue(v,decimals=6){
  const n=Number(v);

  if(!Number.isFinite(n))
    return String(v);

  return n.toLocaleString(undefined,{
    maximumFractionDigits:decimals
  });
}

function renderOrder(o){
  const c=orderContent;

  if(!o){
    c.innerHTML=
      '<div class="order-empty">'+
      'No P2P order is attached to this conversation.'+
      '</div>';
    return;
  }

  const s=orderStatus(o).toLowerCase();

  const buyer=
    String(o.buyer_id||"")===
    String(currentUser?.id);

  const seller=
    String(o.seller_id||"")===
    String(currentUser?.id);

  let buttons="";

  if(
    [
      "pending",
      "active",
      "paid",
      "payment_sent"
    ].includes(s)&&
    buyer&&
    !o.payment_confirmed
  ){
    buttons+=
      '<button class="order-action" '+
      'onclick="confirmPayment()">'+
      '✅ I Have Paid</button>';
  }

  if(
    s==="payment_sent"&&
    seller&&
    o.payment_confirmed
  ){
    buttons+=
      '<button class="order-action" '+
      'onclick="releaseOrder()">'+
      '🔓 Release USDT</button>';
  }

  if(
    [
      "pending",
      "active",
      "paid",
      "payment_sent"
    ].includes(s)
  ){
    buttons+=
      '<button class="order-action red" '+
      'onclick="cancelOrder()">'+
      '✕ Cancel</button>'+
      '<button class="order-action gray" '+
      'onclick="disputeOrder()">'+
      '⚠️ Dispute</button>';
  }

  if(s==="disputed"){
    buttons=
      '<button class="order-action gray" '+
      'onclick="openDisputeInfo()">'+
      '⚠️ Disputed — Admin Review</button>';
  }

  if(
    ["completed","released"].includes(s)
  ){
    buttons=
      '<button class="order-action gray" '+
      'onclick="finishOrder()">'+
      '✓ Transaction Completed</button>';
  }

  const usdtAmount=orderAmount(o);
  const price=orderPrice(o);
  const totalCurrency=orderTotalCurrency(o);
  const currency=orderCurrency(o);
  const paymentDetail=orderPaymentDetail(o);
  const pair=orderPair(o);

  c.innerHTML=
    '<div class="order-card">'+

      '<div class="order-line">'+
        '<span class="order-label">Order Number</span>'+
        '<span class="order-value">#'+
          escapeHTML(String(orderNumber(o)))+
        '</span>'+
      '</div>'+

      '<div class="order-line">'+
        '<span class="order-label">USDT Amount</span>'+
        '<span class="order-value">'+
          escapeHTML(formatNumberValue(usdtAmount,6))+
          ' USDT'+
        '</span>'+
      '</div>'+

      '<div class="order-line">'+
        '<span class="order-label">Currency Price</span>'+
        '<span class="order-value">'+
          escapeHTML(formatNumberValue(price,2))+
          ' '+escapeHTML(currency)+
          '/USDT'+
        '</span>'+
      '</div>'+

      '<div class="order-line">'+
        '<span class="order-label">Total Currency</span>'+
        '<span class="order-value">'+
          escapeHTML(formatNumberValue(totalCurrency,2))+
          ' '+escapeHTML(currency)+
        '</span>'+
      '</div>'+

      '<div class="order-line">'+
        '<span class="order-label">Bank / Payment Detail</span>'+
        '<span class="order-value">'+
          escapeHTML(String(paymentDetail))+
        '</span>'+
      '</div>'+

      '<div class="order-line">'+
        '<span class="order-label">Type</span>'+
        '<span class="order-value">'+
          escapeHTML(orderType(o))+
        '</span>'+
      '</div>'+

      (pair?
        '<div class="order-line">'+
          '<span class="order-label">Pair</span>'+
          '<span class="order-value">'+
            escapeHTML(pair)+
          '</span>'+
        '</div>'
      :"")+

      '<div class="order-line">'+
        '<span class="order-label">Status</span>'+
        '<span class="order-status">'+
          escapeHTML(s)+
        '</span>'+
      '</div>'+

      '<div class="order-actions">'+
        (
          buttons||
          '<span class="order-label">No action available.</span>'
        )+
      '</div>'+

    '</div>';
}

function openOrderPanel(){
  orderPanel.classList.add("show");

  if(!currentOrder)
    loadConversationOrder();

  showActionNotification(true,"Trade status opened");
}

function closeOrderPanel(){
  orderPanel.classList.remove("show");
}

async function confirmPayment(){
  if(!currentOrder||!currentUser){
    showActionNotification(false,"No active trade");
    return;
  }

  const confirmed=confirm(
    "Confirm that you have sent the payment?"
  );

  if(!confirmed)return;

  showToast("⏳ Confirming payment...");

  const{data,error}=await supabaseClient.rpc(
    "confirm_p2p_payment",
    {
      p_trade_id:Number(currentOrder.id)
    }
  );

  if(error){
    showActionNotification(false,error.message);
    return;
  }

  const messageSent=
    await sendTradeSystemMessage("✅ Payment Sent — Awaiting Confirmation");

  if(!messageSent){
    showActionNotification(
      false,
      "Payment confirmed but message could not be sent"
    );
  }else{
    showActionNotification(
      true,
      "Payment confirmed"

async function startVoiceRecording(){
  if(!currentConversation){
    showActionNotification(
      false,
      "Open a conversation first"
    );
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    showActionNotification(
      false,
      "Voice recording is not supported"
    );
    return;
  }

  try{
    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    let o={};

    if(
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    )
      o.mimeType="audio/webm;codecs=opus";

    else if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    )
      o.mimeType="audio/webm";

    mediaRecorder=
      new MediaRecorder(stream,o);

    audioChunks=[];

    mediaRecorder.ondataavailable=e=>{
      if(e.data?.size)
        audioChunks.push(e.data);
    };

    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(
        t=>t.stop()
      );

      const blob=new Blob(
        audioChunks,
        {
          type:
            mediaRecorder.mimeType||
            "audio/webm"
        }
      );

      const duration=Math.max(
        1,
        Math.round(
          (Date.now()-recordingStartedAt)/
          1000
        )
      );

      hideRecordingBar();

      if(blob.size)
        await sendVoiceMessage(
          blob,
          duration
        );
    };

    mediaRecorder.onerror=()=>{
      stream.getTracks().forEach(
        t=>t.stop()
      );

      hideRecordingBar();

      showActionNotification(
        false,
        "Voice recording failed"
      );
    };

    mediaRecorder.start(200);

    recordingStartedAt=Date.now();

    showRecordingBar();
    startRecordingTimer();

    showActionNotification(
      true,
      "Voice recording started"
    );

  }catch(e){
    showActionNotification(
      false,
      "Microphone permission is required"
    );
  }
}

function stopVoiceRecording(){
  if(
    mediaRecorder?.state===
    "recording"
  )
    mediaRecorder.stop();

  stopRecordingTimer();
}

async function updateUnreadCount(){
  if(!currentUser)return;

  const{data:c}=await supabaseClient
    .from("conversations")
    .select("id")
    .or(
      "user_one.eq."+currentUser.id+
      ",user_two.eq."+currentUser.id
    );

  if(!c?.length){
    updateUnreadUI(0);
    return;
  }

  const{count}=await supabaseClient
    .from("messages")
    .select("id",{count:"exact",head:true})
    .in(
      "conversation_id",
      c.map(x=>x.id)
    )
    .neq("sender_id",currentUser.id)
    .is("read_at",null);

  updateUnreadUI(count||0);
}

    escapeHTML(
      p?.avatar_url||

    '<div class="notification-content">'+

        (

          escapeHTML(u)+
          "</strong> ":
          ""
        )+
        (
          n.title?
          "<strong>"+
          escapeHTML(n.title)+
          "</strong><br>":
          ""
        )+
        escapeHTML(
          n.message||
          "You have a new notification."
        )+
      '</div>'+
      '<div class="notification-time">'+
        formatNotificationTime(
          n.created_at
        )+
      '</div>'+
    '</div>';

  x.onclick=async()=>{
    await markNotificationRead(n.id);

    if(n.conversation_id){
      const{data:c}=await supabaseClient
        .from("conversations")
        .select("*")
        .eq("id",n.conversation_id)
        .maybeSingle();

      if(c){
        const oid=
          c.user_one===currentUser.id?
          c.user_two:
          c.user_one;

        const{data:o}=
          await supabaseClient
            .from("profiles")
            .select(
              "id,username,avatar_url"
            )

          c,
          o||{
            id:oid,
            username:"User",
            avatar_url:DEFAULT_AVATAR

      }
    }
  };

  list.appendChild(x);

function formatTime(d){
  const v=new Date(d);

  return isNaN(v.getTime())?
    "":
    v.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

function formatNotificationTime(d){
  const v=new Date(d);

  return isNaN(v.getTime())?
    "":
    v.toLocaleString(
      [],
      {
        month:"short",
        day:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

function formatDuration(s){
  return String(
    Math.floor(s/60)
  ).padStart(2,"0")+
  ":"+
  String(
    s%60
  ).padStart(2,"0");
}

function formatFileSize(b){
  if(b<1024)
    return b+" B";

  if(b<1048576)
    return(
      b/1024
    ).toFixed(1)+
    " KB";

  return(
    b/1048576
  ).toFixed(1)+
    " MB";
}

function getFileExtension(n){
  const p=(n||"").split(".");

  return p.length>1?
    p.pop().toLowerCase():
    "";
}

function randomString(n){
  const c=
    "abcdefghijklmnopqrstuvwxyz0123456789";

  let r="";

  for(let i=0;i<n;i++)
    r+=c[
      Math.floor(
        Math.random()*c.length
      )
    ];

  return r;
}

function normalizeUsername(v){
  return v==null?
    "":
    String(v)
      .trim()
      .replace(/^@+/,"");
}

function escapeHTML(v){
  const d=document.createElement("div");

  d.textContent=
    v==null?
    "":
    String(v);

  return d.innerHTML;
}

  (event,session)=>{
    if(!session){
      currentUser=null;
      currentUserProfile=null;
      location.replace("login.html");
      return;
    }

    currentUser=session.user;
  }
);

document.addEventListener(
  "visibilitychange",
  async()=>{
    if(
      !document.hidden&&
      currentUser

      await loadCurrentUserProfile();
      await updateUnreadCount();

      if(currentConversation)
        await markConversationAsRead();
    }
  }
);
