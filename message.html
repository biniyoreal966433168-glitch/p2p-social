<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:78px;
}

/* ================= HEADER ================= */

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.brand{
  font-size:21px;
  font-weight:bold;
  white-space:nowrap;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.auth-btn{
  border:none;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  background:white;
  color:#087f73;
}

.register-btn{
  background:#16a085;
  color:white;
  border:1px solid rgba(255,255,255,.7);
}

.logout-btn{
  background:#e74c3c;
  color:white;
  display:none;
}

.notification{
  font-size:23px;
  cursor:pointer;
}

.user-info{
  display:none;
  margin-top:12px;
  font-size:13px;
}

/* ================= PAGE ================= */

.messages-page{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.messages-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.messages-title h1{
  font-size:23px;
}

.new-message{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  font-size:24px;
  cursor:pointer;
}

/* ================= SEARCH ================= */

.message-search{
  margin-bottom:10px;
}

.message-search input{
  width:100%;
  padding:13px 15px;
  border:1px solid #dfe4eb;
  background:white;
  color:#172033;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

.search-results{
  display:none;
  margin-bottom:15px;
}

.search-user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:7px;
  background:white;
  border:1px solid #e1e5eb;
  border-radius:12px;
  cursor:pointer;
}

.search-user img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
}

.search-info{
  flex:1;
}

.search-name{
  font-weight:bold;
  font-size:14px;
}

.search-id{
  color:#7a8494;
  font-size:12px;
  margin-top:3px;
}

/* ================= FILTERS ================= */

.filters{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.filter{
  border:1px solid #dfe4eb;
  background:white;
  color:#7a8494;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}

.filter.active{
  background:#087f73;
  color:white;
  border-color:#087f73;
}

/* ================= CHAT LIST ================= */

.chat-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:white;
  border:1px solid #e5e8ed;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.chat-item:active{
  transform:scale(.99);
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  flex-shrink:0;
}

.chat-info{
  min-width:0;
  flex:1;
}

.chat-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.chat-name{
  font-weight:bold;
  font-size:14px;
}

.chat-preview{
  color:#7a8494;
  font-size:13px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  color:#8b94a3;
  font-size:10px;
  white-space:nowrap;
}

.unread-badge{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:10px;
  background:#087f73;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
}

.empty{
  display:none;
  text-align:center;
  padding:50px 20px;
  color:#7a8494;
}

.loading{
  text-align:center;
  color:#7a8494;
  padding:30px;
  background:white;
  border-radius:14px;
}

/* ================= CHAT SCREEN ================= */

.chat-screen{
  display:none;
  position:fixed;
  inset:0;
  background:#f5f7fb;
  z-index:5000;
}

.chat-header{
  height:65px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
}

.back-btn{
  border:none;
  background:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.chat-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.chat-header-info{
  flex:1;
}

.chat-header-name{
  font-weight:bold;
  font-size:15px;
}

.chat-header-username{
  font-size:11px;
  opacity:.8;
  margin-top:2px;
}

/* ================= MESSAGES ================= */

.messages-container{
  position:absolute;
  top:65px;
  bottom:72px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:15px;
}

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:15px;
  background:white;
  color:#172033;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  word-break:break-word;
}

.message-row.mine .message-bubble{
  background:#087f73;
  color:white;
}

.message-time{
  font-size:9px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.message-delete{
  display:none;
  border:none;
  background:transparent;
  color:#e74c3c;
  font-size:11px;
  cursor:pointer;
  margin-top:3px;
}

.message-row.mine:hover .message-delete{
  display:block;
}

/* ================= INPUT ================= */

.message-input-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

.message-input{
  flex:1;
  border:1px solid #dfe4eb;
  background:#f5f7fb;
  color:#172033;
  border-radius:12px;
  padding:10px;
  outline:none;
  resize:none;
  font-size:14px;
}

.send-message{
  width:55px;
  border:none;
  border-radius:12px;
  background:#087f73;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send-message:disabled{
  opacity:.5;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:9999;
}

.nav-item{
  flex:1;
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

@media(max-width:450px){

  header{
    padding:16px 12px;
  }

  .brand{
    font-size:19px;
  }

  .logo{
    width:43px;
    height:43px;
  }

  .auth-btn{
    padding:7px 8px;
    font-size:11px;
  }

  .notification{
    font-size:21px;
  }

  .messages-page{
    padding:16px 12px;
  }

  .message-bubble{
    max-width:85%;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="top">

    <div class="logo-area">

      <img
        src="images/logo.png"
        class="logo"
        alt="P2P Social Logo"
        onerror="this.src='images/profile.png'">

      <div class="brand">
        P2P Social
      </div>

    </div>

    <div class="top-actions">

      <button
        id="loginBtn"
        class="auth-btn login-btn">
        Login
      </button>

      <button
        id="registerBtn"
        class="auth-btn register-btn">

      <button

      <div

    </div>

<!-- ================= PAGE ================= -->

<main class="messages-page">

  <div class="messages-title">

<!-- ================= CHAT SCREEN ================= -->

<div
  id="chatScreen"
  class="chat-screen">

  <div class="chat-header">

    <button
      type="button"
      class="back-btn"
      id="backButton">
      ←
    </button>


    <img
      id="chatAvatar"
      class="chat-avatar"
      src="images/profile.png"
      alt="Profile"
      onerror="this.src='images/profile.png'">


    <div class="chat-header-info">

      <div
        id="chatName"

      </div>

      <div

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()">
    <span>🏠</span>
    Home
  </div>


  <div
    class="nav-item"
    onclick="goLive()">
    <span>🔴</span>
    Live
  </div>


  <div
    class="nav-item"
    onclick="goWallet()">
    <span>🔄</span>
    P2P
  </div>


  <div
    class="nav-item active"
    onclick="stayOnMessages()">
    <span>💬</span>
    Messages
  </div>


  <div
    class="nav-item"
    onclick="goProfile()">
    <span>👤</span>
    Profile
  </div>

</nav>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;

let messagesChannel = null;
let conversationsChannel = null;

let searchTimer = null;
let sending = false;


/* =====================================================
   DEFAULT IMAGE
===================================================== */

const DEFAULT_AVATAR =
"images/profile.png";


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(error){

    console.error(
      "Session error:",
      error
    );

    showPageError(
      error.message
    );

    return;

  }


  if(!data.session){

    window.location.replace(
      "login.html"
    );

    return;

  }


  currentUser =
    data.session.user;


  await ensureProfile();

  await updateAuthUI();

  await loadConversations();

  subscribeConversationsRealtime();

}


/* =====================================================
   ENSURE PROFILE
===================================================== */

async function ensureProfile(){

  if(!currentUser){
    return;
  }


  const {
    data: profile,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",currentUser.id)
    .maybeSingle();


  if(error){

    console.error(
      "Profile check error:",
      error
    );

    return;

  }


  if(profile){
    return;
  }


  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "user_" +
    currentUser.id.substring(0,8);


  const {
    error: insertError
  } =
  await supabaseClient
    .from("profiles")
    .insert({
      id:currentUser.id,
      username:username,
      avatar_url:null
    });


  if(insertError){

    console.error(
      "Profile creation error:",
      insertError
    );

  }

}


/* =====================================================
   AUTH UI
===================================================== */

async function updateAuthUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userInfo =
    document.getElementById("userInfo");

  const usernameDisplay =
    document.getElementById("usernameDisplay");


  if(!currentUser){

    loginBtn.style.display =
      "block";

    registerBtn.style.display =
      "block";

    logoutBtn.style.display =
      "none";

    userInfo.style.display =
      "none";

    return;

  }


  loginBtn.style.display =
    "none";

  registerBtn.style.display =
    "none";

  logoutBtn.style.display =
    "block";

  userInfo.style.display =
    "block";


  let username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";


  const {
    data:profile
  } =
  await supabaseClient
    .from("profiles")
    .select("username")
    .eq("id",currentUser.id)
    .maybeSingle();


  if(profile?.username){

    username =
      profile.username;

  }


  usernameDisplay.textContent =
    username;

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations(){

  if(!currentUser){
    return;
  }


  const list =
    document.getElementById("chatList");

  const empty =
    document.getElementById("empty");


  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  empty.style.display =
    "none";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "Conversation loading error:",
      error
    );


    list.innerHTML =
      `<div class="loading">
        Could not load conversations.
        <br><br>
        <small>
          ${escapeHTML(error.message)}
        </small>
      </div>`;

    return;

  }


  list.innerHTML =
    "";


  if(!data || data.length === 0){

    empty.style.display =
      "block";

    return;

  }


  for(
    const conversation of data
  ){

    const otherId =
      conversation.user_one ===
      currentUser.id

      ? conversation.user_two
      : conversation.user_one;


    await createConversationItem(
      conversation,
      otherId,
      list
    );

  }

}


/* =====================================================
   CREATE CONVERSATION ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
){

  const {
    data:profile
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .eq(
      "id",
      otherId
    )
    .maybeSingle();


  const name =
    profile?.username ||
    "User";


  const avatar =
    profile?.avatar_url ||
    DEFAULT_AVATAR;


  const {
    data:lastMessages
  } =
  await supabaseClient
    .from("messages")
    .select(
      "content,created_at"
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1);


  const last =
    lastMessages?.[0];


  const item =
    document.createElement("div");


  item.className =
    "chat-item";


  item.dataset.unread =
    "0";


  item.innerHTML = `

    <img
      class="avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile"
      onerror="this.src='${DEFAULT_AVATAR}'">


    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">
          ${escapeHTML(name)}
        </span>

        ${
          last
          ?
          `<span class="chat-time">
             ${formatTime(last.created_at)}
           </span>`
          :
          ""
        }

      </div>


      <div class="chat-preview">

        ${
          last
          ?
          escapeHTML(last.content)
          :
          "Start a conversation"
        }

      </div>

    </div>

  `;


  item.addEventListener(
    "click",
    () => {

      openConversation(
        conversation,
        profile || {
          id:otherId,
          username:"User",
          avatar_url:DEFAULT_AVATAR
        }
      );

    }
  );


  list.appendChild(item);

}


/* =====================================================
   SEARCH USERS
===================================================== */

function searchUsers(){

  clearTimeout(
    searchTimer
  );


  const input =
    document.getElementById(
      "searchInput"
    );

  const results =
    document.getElementById(
      "searchResults"
    );


  const query =
    input.value.trim();


  if(!query){

    results.style.display =
      "none";

    results.innerHTML =
      "";

    return;

  }


  searchTimer =
    setTimeout(
      async function(){

        if(!currentUser){
          return;
        }


        results.innerHTML =
          `<div class="loading">
            Searching...
          </div>`;

        results.style.display =
          "block";


        const {
          data,
          error
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,avatar_url"
          )
          .ilike(
            "username",
            "%" +
            query +
            "%"
          )
          .neq(
            "id",
            currentUser.id
          )
          .order(
            "username",
            {
              ascending:true
            }
          )
          .limit(10);


        if(error){

          console.error(
            "Search error:",
            error
          );


          results.innerHTML =
            `<div class="loading">
              Search failed.
              <br>
              <small>
                ${escapeHTML(error.message)}
              </small>
            </div>`;

          return;

        }


        results.innerHTML =
          "";


        if(!data || data.length === 0){

          results.innerHTML =
            `<div class="loading">
              No users found.
            </div>`;

          return;

        }


        data.forEach(
          profile => {

            const user =
              document.createElement("div");


            user.className =
              "search-user";


            const avatar =
              profile.avatar_url ||
              DEFAULT_AVATAR;


            user.innerHTML = `

              <img
                src="${escapeHTML(avatar)}"
                alt="Profile"
                onerror="this.src='${DEFAULT_AVATAR}'">


              <div class="search-info">

                <div class="search-name">

                  ${escapeHTML(
                    profile.username ||
                    "User"
                  )}

                </div>


                <div class="search-id">
                  Tap to message
                </div>

              </div>

            `;


            user.addEventListener(
              "click",
              () => {

                startConversation(
                  profile
                );

              }
            );


            results.appendChild(user);

          }
        );

      },
      300
    );

}


/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(
  profile
){

  if(
    !currentUser ||
    !profile?.id
  ){

    return;

  }


  if(
    profile.id ===
    currentUser.id
  ){

    return;

  }


  const otherId =
    profile.id;


  const userOne =
    currentUser.id < otherId
      ? currentUser.id
      : otherId;


  const userTwo =
    currentUser.id < otherId
      ? otherId
      : currentUser.id;


  const {
    data:existing,
    error:findError
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .eq(
      "user_one",
      userOne
    )
    .eq(
      "user_two",
      userTwo
    )
    .maybeSingle();


  if(findError){

    alert(
      "Conversation error: " +
      findError.message
    );

    return;

  }


  let conversation =
    existing;


  if(!conversation){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select()
      .single();


    if(error){

      /*
        If another request created the
        conversation at the same time,
        retrieve it instead of failing.
      */

      const {
        data:retry
      } =
      await supabaseClient
        .from("conversations")
        .select("*")
        .eq(
          "user_one",
          userOne
        )
        .eq(
          "user_two",
          userTwo
        )
        .maybeSingle();


      if(retry){

        conversation =
          retry;

      }else{

        alert(
          "Could not create conversation: " +
          error.message
        );

        return;

      }

    }else{

      conversation =
        data;

    }

  }


  document.getElementById(
    "searchInput"
  ).value =
    "";


  document.getElementById(
    "searchResults"
  ).style.display =
    "none";


  await openConversation(
    conversation,
    profile
  );


  await loadConversations();

}


/* =====================================================
   OPEN CONVERSATION
===================================================== */

async function openConversation(
  conversation,
  profile
){

  if(
    !conversation ||
    !profile
  ){

    return;

  }


  currentConversation =
    conversation;


  currentOtherUser =
    profile;


  document.getElementById(
    "chatName"
  ).textContent =
    profile.username ||
    "User";


  document.getElementById(
    "chatUsername"
  ).textContent =
    "@" +
    (
      profile.username ||
      "user"
    );


  document.getElementById(
    "chatAvatar"
  ).src =
    profile.avatar_url ||
    DEFAULT_AVATAR;


  document.getElementById(
    "chatScreen"
  ).style.display =
    "block";


  document.body.style.overflow =
    "hidden";


  await loadMessages();


  subscribeMessagesRealtime();


  setTimeout(
    () => {

      document.getElementById(
        "messageInput"
      ).focus();

    },
    100
  );

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  if(!currentConversation){
    return;
  }


  const container =
    document.getElementById(
      "messagesContainer"
    );


  container.innerHTML =
    `<div class="loading">
      Loading messages...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,conversation_id,sender_id,content,created_at"
    )
    .eq(
      "conversation_id",
      currentConversation.id
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "Messages error:",
      error
    );


    container.innerHTML =
      `<div class="loading">
        ${escapeHTML(error.message)}
      </div>`;

    return;

  }


  container.innerHTML =
    "";


  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="loading">
        No messages yet 👋
      </div>`;

    return;

  }


  data.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollMessages();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
  message
){

  const container =
    document.getElementById(
      "messagesContainer"
    );


  const row =
    document.createElement("div");


  row.className =
    "message-row";


  const mine =
    message.sender_id ===
    currentUser.id;


  if(mine){

    row.classList.add(
      "mine"
    );

  }


  const bubble =
    document.createElement("div");


  bubble.className =
    "message-bubble";


  bubble.innerHTML = `

    <div>
      ${escapeHTML(
        message.content
      )}
    </div>


    <div class="message-time">
      ${formatTime(
        message.created_at
      )}
    </div>

  `;


  if(mine){

    const deleteButton =
      document.createElement("button");


    deleteButton.className =
      "message-delete";


    deleteButton.textContent =
      "Delete";


    deleteButton.addEventListener(
      "click",
      () => {

        deleteMessage(
          message.id
        );

      }
    );


    bubble.appendChild(
      deleteButton
    );

  }


  row.appendChild(
    bubble
  );


  container.appendChild(
    row
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !currentConversation ||
    sending
  ){

    return;

  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const sendButton =
    document.getElementById(
      "sendMessageButton"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  sending =
    true;


  sendButton.disabled =
    true;


  const originalText =
    text;


  input.value =
    "";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({

      conversation_id:
        currentConversation.id,

      sender_id:
        currentUser.id,

      content:
        originalText

    })
    .select()
    .single();


  sending =
    false;


  sendButton.disabled =
    false;


  if(error){

    input.value =
      originalText;


    console.error(
      "Send message error:",
      error
    );


    alert(
      "Message failed: " +
      error.message
    );

    return;

  }


  /*
    Realtime normally renders the message.
    This local render prevents waiting for
    the Realtime connection.
  */

  if(data){

    renderMessage(
      data
    );

    scrollMessages();

  }


  input.focus();

}


/* =====================================================
   DELETE MESSAGE
===================================================== */

async function deleteMessage(
  messageId
){

  if(!messageId){
    return;
  }


  const confirmed =
    confirm(
      "Delete this message?"
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .delete()
    .eq(
      "id",
      messageId
    )
    .eq(
      "sender_id",
      currentUser.id
    );


  if(error){

    alert(
      "Could not delete message: " +
      error.message
    );

    return;

  }


  await loadMessages();

}


/* =====================================================
   REALTIME MESSAGES
===================================================== */

function subscribeMessagesRealtime(){

  if(!currentConversation){
    return;
  }


  if(messagesChannel){

    supabaseClient
      .removeChannel(
        messagesChannel
      );

    messagesChannel =
      null;

  }


  const conversationId =
    currentConversation.id;


  messagesChannel =
    supabaseClient
      .channel(
        "messages-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          if(
            !currentConversation ||
            currentConversation.id !==
            conversationId
          ){

            return;

          }


          /*
            Don't render our own message twice.
          */

          if(
            payload.new.sender_id ===
            currentUser.id
          ){

            return;

          }


          renderMessage(
            payload.new
          );


          scrollMessages();

        }
      )
      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        () => {

          if(
            currentConversation &&
            currentConversation.id ===
            conversationId
          ){

            loadMessages();

          }

        }
      )
      .subscribe(
        status => {

          console.log(
            "Messages realtime:",
            status
          );

        }
      );

}


/* =====================================================
   REALTIME CONVERSATIONS
===================================================== */

function subscribeConversationsRealtime(){

  if(conversationsChannel){

    supabaseClient
      .removeChannel(
        conversationsChannel
      );

  }


  conversationsChannel =
    supabaseClient
      .channel(
        "conversations-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"conversations"
        },
        () => {

          loadConversations();

        }
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"conversations"
        },
        () => {

          loadConversations();

        }
      )
      .subscribe();

}


/* =====================================================
   CLOSE CHAT
===================================================== */

function closeChat(){

  if(messagesChannel){

    supabaseClient
      .removeChannel(
        messagesChannel
      );

    messagesChannel =
      null;

  }


  currentConversation =
    null;


  currentOtherUser =
    null;


  document.getElementById(
    "chatScreen"
  ).style.display =
    "none";


  document.body.style.overflow =
    "";


  document.getElementById(
    "messageInput"
  ).value =
    "";


  loadConversations();

}


/* =====================================================
   FILTERS
===================================================== */

function setActiveFilter(
  button
){

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      item => {

        item.classList.remove(
          "active"
        );

      }
    );


  button.classList.add(
    "active"
  );

}


function showAll(){

  setActiveFilter(
    document.getElementById(
      "allFilter"
    )
  );


  document
    .querySelectorAll(
      ".chat-item"
    )
    .forEach(
      item => {

        item.style.display =
          "flex";

      }
    );

}


function showUnread(){

  setActiveFilter(
    document.getElementById(
      "unreadFilter"
    )
  );


  /*
    The current SQL does not yet have
    a read/unread column, so all messages
    are currently treated as read.
  */

  document
    .querySelectorAll(
      ".chat-item"
    )
    .forEach(
      item => {

        item.style.display =
          Number(
            item.dataset.unread ||
            0
          ) > 0
          ? "flex"
          : "none";

      }
    );

}

===================================================== */

async function logout(){

  const confirmed =
    confirm(
      "Do you want to log out?"
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
  await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;

  }


  window.location.replace(
    "index.html"
  );

}


/* =====================================================
   ENTER TO SEND
===================================================== */

function messageKey(
  event
){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages(){

  const container =
    document.getElementById(
      "messagesContainer"
    );


  setTimeout(
    () => {

      container.scrollTop =
        container.scrollHeight;

    },
    20
  );

}


function formatTime(
  date
){

  const value =
    new Date(date);


  if(
    isNaN(
      value.getTime()
    )
  ){

    return "";

  }


  return value.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHTML(
  value
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value == null
      ? ""
      : String(value);


  return div.innerHTML;

}


function showPageError(
  message
){

  const list =
    document.getElementById(
      "chatList"
    );


  if(list){

    list.innerHTML =
      `<div class="loading">
        Something went wrong.
        <br><br>
        <small>
          ${escapeHTML(message)}
        </small>
      </div>`;

  }

}
