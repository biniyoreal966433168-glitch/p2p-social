<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Messages • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7f7;color:#172727}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
body{overflow:hidden}

:root{
 --brand:#087f73;
 --brand2:#0a9688;
 --dark:#075d55;
 --green:#12a66a;
 --red:#e53935;
 --orange:#f59e0b;
 --border:#e1e9e8;
 --muted:#708080;
 --card:#fff;
}

.app{height:100vh;display:flex;flex-direction:column}

header{
 height:64px;background:#fff;border-bottom:1px solid var(--border);
 display:flex;align-items:center;padding:0 12px;gap:10px;
 position:relative;z-index:20;flex-shrink:0
}

.logo{
 font-weight:900;font-size:21px;color:var(--brand);
 display:flex;align-items:center;gap:6px;white-space:nowrap
}
.logoMark{
 width:32px;height:32px;border-radius:9px;background:var(--brand);
 color:#fff;display:grid;place-items:center;font-weight:900
}
.headerSpace{flex:1}

.userName{
 font-weight:700;color:#263737;max-width:120px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}

.headerBtn{
 background:#eef7f5;color:var(--brand);padding:9px 11px;border-radius:10px;
 font-weight:700
}
.headerBtn:hover{background:#dcefeb}

.logoutBtn{background:#ffeceb;color:#c62828}

.notifyBtn{
 position:relative;width:40px;height:40px;border-radius:50%;
 background:#f0f7f6;font-size:20px
}
.badge{
 position:absolute;right:-2px;top:-3px;background:#e53935;color:white;
 min-width:18px;height:18px;border-radius:10px;font-size:11px;
 display:none;align-items:center;justify-content:center;font-weight:900;
 border:2px solid white;padding:0 4px
}

main{flex:1;min-height:0;position:relative;overflow:hidden}

.messagesPage{
 height:100%;display:flex;flex-direction:column;max-width:1000px;margin:auto;
 background:#fff
}

.pageTop{
 padding:14px 14px 8px;border-bottom:1px solid var(--border);
 flex-shrink:0
}
.pageTitle{font-size:22px;font-weight:900}
.unreadTitle{color:var(--red);font-size:13px;margin-left:6px}

.searchRow{display:flex;gap:8px;margin-top:12px}
.searchBox{
 flex:1;border:1px solid #d9e3e1;border-radius:12px;
 padding:12px 13px;outline:none;background:#fafcfc
}
.searchBox:focus{border-color:var(--brand);background:#fff}
.newBtn{
 width:44px;height:44px;border-radius:12px;background:var(--brand);
 color:white;font-size:25px;font-weight:700
}

.searchResults{
 margin-top:8px;border:1px solid var(--border);border-radius:12px;
 overflow:hidden;background:white;display:none
}
.searchResult{
 display:flex;align-items:center;gap:10px;padding:10px 12px;
 border-bottom:1px solid #edf2f1;cursor:pointer
}
.searchResult:last-child{border-bottom:0}
.searchResult:hover{background:#f3faf8}

.avatar{
 width:44px;height:44px;border-radius:50%;object-fit:cover;
 background:#dcebea;flex-shrink:0
}
.avatar.small{width:38px;height:38px}
.avatar.tiny{width:32px;height:32px}

.resultName{font-weight:800}
.resultSub{font-size:12px;color:var(--muted);margin-top:2px}

.filters{
 display:flex;gap:7px;margin-top:10px
}
.filter{
 padding:8px 13px;border-radius:20px;background:#edf4f3;color:#58706e;
 font-weight:700;font-size:13px
}
.filter.active{background:var(--brand);color:white}

.conversationList{
 flex:1;min-height:0;overflow:auto
}

.conversation{
 display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid #edf1f1;
 cursor:pointer;align-items:center
}
.conversation:hover{background:#f5faf9}
.conversation.unread{background:#f0faf8}
.convInfo{min-width:0;flex:1}
.convTop{display:flex;align-items:center;gap:5px}
.convName{
 font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 flex:1
}
.convTime{font-size:11px;color:#879796;white-space:nowrap}
.convPreview{
 color:#6d7e7d;font-size:13px;margin-top:5px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.unreadDot{
 background:var(--brand);color:white;min-width:19px;height:19px;
 padding:0 5px;border-radius:10px;font-size:11px;
 display:flex;align-items:center;justify-content:center;font-weight:900
}

.empty{
 padding:45px 20px;text-align:center;color:#7c8c8b
}
.emptyIcon{font-size:45px;margin-bottom:10px}

.chat{
 position:absolute;inset:0;background:#f2f7f6;
 display:none;flex-direction:column;z-index:15
}

.chatHeader{
 height:62px;background:white;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:9px;padding:8px 10px;flex-shrink:0
}
.backBtn{
 width:40px;height:40px;background:#edf5f3;border-radius:10px;
 color:var(--brand);font-size:22px
}
.chatUser{min-width:0;flex:1}
.chatUserName{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatStatus{font-size:11px;color:#778a88;margin-top:2px}
.chatMore{
 width:38px;height:38px;border-radius:50%;background:#edf5f3;
 font-size:19px;color:#34504d
}

.chatMessages{
 flex:1;overflow:auto;padding:14px 10px 18px;
 display:flex;flex-direction:column;gap:7px
}

.dayLabel{
 align-self:center;background:#dce8e6;color:#637674;
 padding:5px 10px;border-radius:14px;font-size:11px;margin:5px 0
}

.msgRow{display:flex;max-width:88%;gap:6px}
.msgRow.mine{align-self:flex-end;flex-direction:row-reverse}
.msgRow.theirs{align-self:flex-start}

.msgAvatar{width:27px;height:27px;border-radius:50%;object-fit:cover;align-self:flex-end}

.msgBubble{
 background:white;border:1px solid #e1e8e7;padding:9px 11px;
 border-radius:14px 14px 14px 4px;box-shadow:0 1px 2px #00000008;
 min-width:45px
}
.mine .msgBubble{
 background:#087f73;color:white;border-color:#087f73;
 border-radius:14px 14px 4px 14px
}

.msgText{
 white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.4
}
.msgMeta{
 font-size:10px;opacity:.65;text-align:right;margin-top:4px
}
.msgActions{
 display:flex;gap:4px;margin-top:5px;justify-content:flex-end
}
.msgAction{
 font-size:11px;background:#eef4f3;color:#49615f;border-radius:7px;
 padding:4px 6px
}
.mine .msgAction{color:#31504c}
.edited{font-style:italic}

.photoMsg{
 max-width:230px;max-height:310px;border-radius:11px;display:block;
 object-fit:cover
}
.mediaCaption{margin-top:6px;white-space:pre-wrap}

.audioMsg{width:230px;max-width:100%}

.videoMsg{
 width:250px;max-width:100%;max-height:320px;border-radius:10px;
 background:#000
}

.fileMsg{
 display:flex;align-items:center;gap:8px;text-decoration:none;
 padding:8px;background:#f1f6f5;border-radius:9px;color:#164d48;
 max-width:250px
}
.mine .fileMsg{background:#fff;color:#164d48}

.composer{
 background:white;border-top:1px solid var(--border);padding:8px;
 flex-shrink:0
}
.editBar,.recordBar{
 display:none;align-items:center;gap:8px;background:#eef8f6;
 padding:7px 9px;border-radius:9px;margin-bottom:7px
}
.editInfo,.recordInfo{flex:1;min-width:0}
.editTitle,.recordTitle{font-size:12px;font-weight:800;color:var(--brand)}
.editPreview,.recordTimer{font-size:11px;color:#637573;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cancelSmall{background:#fff;color:#c62828;border-radius:7px;padding:6px 8px}

.preview{
 display:none;position:relative;margin-bottom:7px
}
.preview img,.preview video{
 width:90px;height:90px;object-fit:cover;border-radius:10px
}
.removePreview{
 position:absolute;left:70px;top:-6px;background:#e53935;color:#fff;
 width:22px;height:22px;border-radius:50%
}

.composeRow{display:flex;align-items:flex-end;gap:6px}
.mediaBtn{
 width:40px;height:40px;border-radius:10px;background:#edf5f3;
 color:var(--brand);font-size:18px
}
.mediaBtn.locked{opacity:.45}
.messageInput{
 flex:1;min-height:42px;max-height:120px;resize:none;
 border:1px solid #dbe5e3;border-radius:12px;padding:11px;
 outline:none
}
.messageInput:focus{border-color:var(--brand)}
.sendBtn{
 width:43px;height:42px;border-radius:11px;background:var(--brand);
 color:#fff;font-size:19px
}

.hint{
 font-size:10px;color:#849391;padding:5px 3px 0;text-align:center
}

.nav{
 height:60px;background:white;border-top:1px solid var(--border);
 display:flex;flex-shrink:0;z-index:20
}
.navItem{
 flex:1;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:2px;color:#70817f;font-size:11px;
 text-decoration:none;font-weight:700
}
.navIcon{font-size:20px;line-height:20px}
.navItem.active{color:var(--brand)}

.notificationPanel{
 position:absolute;right:10px;top:55px;width:min(390px,calc(100vw - 20px));
 max-height:500px;background:#fff;border:1px solid var(--border);
 border-radius:14px;box-shadow:0 12px 35px #0002;display:none;
 z-index:100;overflow:hidden
}
.notifHead{
 display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);
 font-weight:900
}
.notifHead span{flex:1}
.notifAll{font-size:11px;color:var(--brand);background:none;font-weight:800}
.notifList{max-height:440px;overflow:auto}
.notification{
 display:flex;gap:9px;padding:11px;border-bottom:1px solid #edf2f1
}
.notification.unread{background:#f0faf8}
.notifBody{flex:1;min-width:0}
.notifTitle{font-weight:800;font-size:13px}
.notifText{font-size:12px;color:#647674;margin-top:3px}
.notifTime{font-size:10px;color:#879391;margin-top:4px}
.notifRead{
 background:#edf5f3;color:var(--brand);border-radius:7px;padding:5px;
 font-size:10px
}

.toast{
 position:fixed;left:50%;bottom:75px;transform:translateX(-50%);
 background:#172727;color:#fff;padding:10px 15px;border-radius:10px;
 font-size:13px;z-index:9999;display:none;max-width:90%;
 text-align:center
}

.loading{padding:25px;text-align:center;color:#71817f}

@media(max-width:650px){
 header{height:58px}
 .logo{font-size:17px}
 .logoMark{width:29px;height:29px}
 .headerBtn{display:none}
 .userName{max-width:80px}
 .notificationPanel{top:50px}
 .messagesPage{width:100%}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">
    <div class="logoMark">P2P</div>
    <span>Social</span>
  </div>

  <div class="headerSpace"></div>

  <div id="headerUsername" class="userName"></div>

  <button class="notifyBtn" id="notificationBtn" onclick="toggleNotificationPanel()">
    🔔
    <span class="badge" id="notificationBadge">0</span>
  </button>

  <button class="headerBtn" id="loginBtn" onclick="location.href='login.html'">Login</button>
  <button class="headerBtn" id="registerBtn" onclick="location.href='register.html'">Register</button>
  <button class="headerBtn logoutBtn" id="logoutBtn" onclick="logout()">Logout</button>
</header>

<main>

<div class="messagesPage">

  <section class="pageTop">
    <div class="pageTitle">
      💬 Messages
      <span class="unreadTitle" id="titleUnread"></span>
    </div>

    <div class="searchRow">
      <input
        id="usernameSearch"
        class="searchBox"
        type="text"
        autocomplete="off"
        placeholder="🔍 Search username..."
        oninput="searchUsers(this.value)"
      >
      <button class="newBtn" onclick="focusUserSearch()">+</button>
    </div>

    <div id="searchResults" class="searchResults"></div>

    <div class="filters">
      <button id="allFilter" class="filter active" onclick="setFilter('all')">All</button>
      <button id="unreadFilter" class="filter" onclick="setFilter('unread')">Unread</button>
    </div>
  </section>

  <section id="conversationList" class="conversationList">
    <div class="loading">Loading conversations...</div>
  </section>

</div>

<div id="chat" class="chat">

  <div class="chatHeader">
    <button class="backBtn" onclick="closeChat()">‹</button>

    <img id="chatAvatar" class="avatar small" src="images/profile.png">

    <div class="chatUser">
      <div id="chatUsername" class="chatUserName">User</div>
      <div id="chatStatus" class="chatStatus">Messages</div>
    </div>

    <button class="chatMore" onclick="chatMore()">⋮</button>
  </div>

  <div id="chatMessages" class="chatMessages"></div>

  <div class="composer">

    <div id="editBar" class="editBar">
      <div class="editInfo">
        <div class="editTitle">✏️ Editing message</div>
        <div id="editPreview" class="editPreview"></div>
      </div>
      <button class="cancelSmall" onclick="cancelEdit()">Cancel</button>
    </div>

    <div id="recordBar" class="recordBar">
      <div class="recordInfo">
        <div class="recordTitle">🔴 Recording voice...</div>
        <div id="recordTimer" class="recordTimer">00:00</div>
      </div>
      <button class="cancelSmall" onclick="stopVoiceRecording(true)">Cancel</button>
    </div>

    <div id="mediaPreview" class="preview">
      <img id="previewImage" style="display:none">
      <video id="previewVideo" style="display:none" controls></video>
      <button class="removePreview" onclick="clearPreview()">×</button>
    </div>

    <div class="composeRow">

      <button
        id="photoBtn"
        class="mediaBtn"
        title="Photo"
        onclick="openPhotoPicker()"
      >📷</button>

      <button
        id="videoBtn"
        class="mediaBtn"
        title="Video"
        onclick="openVideoPicker()"
      >🎥</button>

      <button
        id="fileBtn"
        class="mediaBtn"
        title="File"
        onclick="openFilePicker()"
      >📎</button>

      <button
        id="voiceBtn"
        class="mediaBtn"
        title="Voice"
        onclick="toggleVoiceRecording()"

      <textarea
        id="messageInput"
        class="messageInput"
        rows="1"
        placeholder="Write a message..."

      ></textarea>

      <button class="sendBtn" onclick="sendCurrentMessage()">➤</button>

    </div>

    <div class="hint">
      📋 Copy/paste supported • ✏️ Edit your messages •
      📷 Photo • 🎥 Video • 🎤 Voice • 📎 File
    </div>

  </div>

</div>

</main>

<nav class="nav">
  <a class="navItem" href="index.html">
    <span class="navIcon">🏠</span><span>Home</span>
  </a>
  <a class="navItem" href="live.html">
    <span class="navIcon">🔴</span><span>Live</span>
  </a>
  <a class="navItem" href="wallet.html">
    <span class="navIcon">🔄</span><span>P2P</span>
  </a>
  <a class="navItem active" href="message.html">
    <span class="navIcon">💬</span><span>Messages</span>
  </a>
  <a class="navItem" href="profile.html">
    <span class="navIcon">👤</span><span>Profile</span>
  </a>
</nav>

<div id="notificationPanel" class="notificationPanel">
  <div class="notifHead">
    <span>🔔 Notifications</span>
    <button class="notifAll" onclick="markAllNotificationsRead()">Mark all read</button>
  </div>
  <div id="notificationList" class="notifList"></div>
</div>

</div>

<input id="photoPicker" type="file" accept="image/*" hidden onchange="handlePhotoSelected(event)">
<input id="videoPicker" type="file" accept="video/*" hidden onchange="handleVideoSelected(event)">
<input id="filePicker" type="file" hidden onchange="handleFileSelected(event)">

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://mbsvuwrgigqfporxwpfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const MEDIA_BUCKET = "message-media";
const DEFAULT_AVATAR = "images/profile.png";

/* =========================================================
   STATE
========================================================= */

let session = null;
let currentUser = null;
let currentProfile = null;

let currentConversation = null;
let currentOtherUser = null;

let conversations = [];
let activeFilter = "all";

let editingMessageId = null;

let selectedPhoto = null;
let selectedVideo = null;
let selectedFile = null;

let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
let recordingStarted = 0;
let recordingTimer = null;

let conversationChannel = null;
let globalMessageChannel = null;
let notificationChannel = null;

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>{
    el.style.display = "none";
  },3000);
}

function timeAgo(date){
  if(!date) return "";
  const d = new Date(date);
  const diff = Date.now() - d.getTime();

  if(diff < 60000) return "now";
  if(diff < 3600000) return Math.floor(diff/60000) + "m";
  if(diff < 86400000) return Math.floor(diff/3600000) + "h";
  if(diff < 604800000) return Math.floor(diff/86400000) + "d";

  return d.toLocaleDateString([],{
    month:"short",
    day:"numeric"
  });
}

function formatTime(date){
  return new Date(date).toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatDuration(seconds){
  seconds = Number(seconds || 0);
  const m = Math.floor(seconds/60);
  const s = Math.floor(seconds%60);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function getAvatar(url){
  return url && url.trim() ? url : DEFAULT_AVATAR;
}

/* =========================================================
   MEMBERSHIP
========================================================= */

function getMembership(profile){
  if(!profile) return "free";

  const possible = [
    profile.membership,
    profile.membership_tier,
    profile.subscription,
    profile.subscription_tier,
    profile.plan,
    profile.plan_name,
    profile.tier,
    profile.user_tier
  ];

  const value = possible.find(v => v !== null && v !== undefined && String(v).trim() !== "");

  if(!value) return "free";

  const x = String(value).toLowerCase().replace(/[\s_-]+/g,"");

  if(x.includes("max") || x.includes("premiummax")) return "premium_max";
  if(x.includes("premium+") || x.includes("premiumplus") || x.includes("premiumplus")) return "premium_plus";
  if(x === "premium" || x.includes("premium")) return "premium";

  return "free";
}

function membershipLabel(){
  const tier = getMembership(currentProfile);

  if(tier === "premium_max") return "🟣 Premium Max";
  if(tier === "premium_plus") return "🔵 Premium+";
  if(tier === "premium") return "🟢 Premium";
  return "🆓 Free";
}

function canPhoto(){
  const tier = getMembership(currentProfile);

  /*
    Free:
    Photo is restricted to P2P transaction confirmation.
    Normal user-to-user photo messaging is locked.

    Premium and above:
    Photo messaging allowed.
  */
  return tier !== "free";
}

function canVideo(){
  const tier = getMembership(currentProfile);
  return tier === "premium_plus" || tier === "premium_max";
}

function canFile(){
  return getMembership(currentProfile) === "premium_max";
}

function canVoice(){
  return true;
}

function updateMediaButtons(){
  const photo = $("photoBtn");
  const video = $("videoBtn");
  const file = $("fileBtn");

  photo.classList.toggle("locked",!canPhoto());
  video.classList.toggle("locked",!canVideo());
  file.classList.toggle("locked",!canFile());

  photo.title = canPhoto()
    ? "Send photo"
    : "Photo messaging requires Premium. Free photo is only for P2P confirmation.";

  video.title = canVideo()
    ? "Send video"
    : "Video messaging requires Premium+";

  file.title = canFile()
    ? "Send file"
    : "File messaging requires Premium Max";
}

/* =========================================================
   AUTH
========================================================= */

async function startApp(){
  try{
    const result = await db.auth.getSession();
    session = result.data.session;

    if(!session){
      location.href = "login.html";
      return;
    }

    currentUser = session.user;

    await loadCurrentProfile();

    updateAuthUI();
    updateMediaButtons();

    await loadConversations();
    await updateUnreadCount();
    await loadNotifications();

    subscribeRealtime();
    subscribeGlobalRealtime();
    subscribeNotificationRealtime();

  }catch(error){
    console.error(error);
    showToast("Unable to load messages.");
  }
}

async function loadCurrentProfile(){
  const {data,error} = await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  currentProfile = data || {
    id:currentUser.id,
    username:currentUser.email ? currentUser.email.split("@")[0] : "User",
    avatar_url:DEFAULT_AVATAR
  };

  $("headerUsername").textContent =
    currentProfile.username || "User";
}

function updateAuthUI(){
  $("loginBtn").style.display = "none";
  $("registerBtn").style.display = "none";
  $("logoutBtn").style.display = "block";
}

db.auth.onAuthStateChange((event,newSession)=>{
  if(event === "SIGNED_OUT"){
    location.href = "login.html";
  }
});

/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){
  const list = $("conversationList");
  list.innerHTML = '<div class="loading">Loading conversations...</div>';

  const {data,error} = await db
    .from("conversations")
    .select("*")
    .or(`user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`)
    .order("updated_at",{ascending:false});

  if(error){
    console.error(error);
    list.innerHTML =
      '<div class="empty"><div class="emptyIcon">💬</div>Unable to load conversations.</div>';
    return;
  }

  conversations = data || [];

  await renderConversations();
}

async function renderConversations(){
  const list = $("conversationList");

  if(!conversations.length){
    list.innerHTML =
      '<div class="empty"><div class="emptyIcon">💬</div><b>No conversations yet</b><br><small>Search a username to start messaging.</small></div>';
    return;
  }

  let html = "";
  let shown = 0;

  for(const conv of conversations){
    const otherId =
      conv.user_one === currentUser.id
        ? conv.user_two
        : conv.user_one;

    const profile = await getProfile(otherId);

    const latest = await getLatestMessage(conv.id);

    const unread = await getUnreadForConversation(conv.id);

    if(activeFilter === "unread" && unread === 0) continue;

    shown++;

    let preview = "No messages yet";

    if(latest){
      if(latest.message_type === "photo") preview = "📷 Photo";
      else if(latest.message_type === "video") preview = "🎥 Video";
      else if(latest.message_type === "voice") preview = "🎤 Voice message";
      else if(latest.message_type === "file") preview = "📎 File";
      else preview = latest.content || "";
    }

    html += `
      <div class="conversation ${unread ? "unread":""}"
           onclick="openConversation('${conv.id}','${otherId}')">

        <img
          class="avatar"
          src="${escapeHTML(getAvatar(profile?.avatar_url))}"
          onerror="this.src='${DEFAULT_AVATAR}'"
        >

        <div class="convInfo">
          <div class="convTop">
            <div class="convName">${escapeHTML(profile?.username || "User")}</div>
            <div class="convTime">${timeAgo(latest?.created_at || conv.updated_at)}</div>
          </div>

          <div class="convPreview">
            ${escapeHTML(preview)}
          </div>
        </div>

        ${unread ? `<div class="unreadDot">${unread > 99 ? "99+" : unread}</div>` : ""}
      </div>
    `;
  }

  if(!shown){
    list.innerHTML =
      '<div class="empty"><div class="emptyIcon">📖</div>No unread conversations.</div>';
  }else{
    list.innerHTML = html;
  }
}

async function getProfile(userId){

    .select("id,username,avatar_url")
    .eq("id",userId)

  return data;
}

async function getLatestMessage(conversationId){
  const {data} = await db
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:false})
    .limit(1)
    .maybeSingle();

  return data;
}

async function getUnreadForConversation(conversationId){
  const {count,error} = await db
    .from("messages")
    .select("id",{count:"exact",head:true})
    .eq("conversation_id",conversationId)
    .eq("sender_id",currentOtherUser?.id || "__none__")
    .is("read_at",null);

  if(error) return 0;
  return count || 0;
}

async function searchUsers(value){
  const box = $("searchResults");
  value = String(value || "").trim();

  if(!value){
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }

  const {data,error} = await db
    .from("profiles")
    .select("id,username,avatar_url")
    .ilike("username",`%${value}%`)
    .neq("id",currentUser.id)
    .limit(10);

  if(error){
    console.error(error);
    return;
  }

  if(!data?.length){
    box.style.display = "block";
    box.innerHTML =
      '<div class="empty" style="padding:20px">No username found.</div>';
    return;
  }

  box.style.display = "block";

  box.innerHTML = data.map(user=>`
    <div class="searchResult" onclick="startConversation('${user.id}')">
      <img
        class="avatar small"
        src="${escapeHTML(getAvatar(user.avatar_url))}"
        onerror="this.src='${DEFAULT_AVATAR}'"
      >
      <div>
        <div class="resultName">@${escapeHTML(user.username || "User")}</div>
        <div class="resultSub">Start conversation</div>
      </div>
    </div>
  `).join("");
}

async function startConversation(userId){
  $("searchResults").style.display = "none";
  $("usernameSearch").value = "";

  const existing = conversations.find(c =>
    (c.user_one === currentUser.id && c.user_two === userId) ||
    (c.user_two === currentUser.id && c.user_one === userId)
  );

  if(existing){
    await openConversation(existing.id,userId);
    return;
  }

  const a = currentUser.id;
  const b = userId;

  const {data,error} = await db
    .from("conversations")
    .insert({
      user_one:a,
      user_two:b,
      updated_at:new Date().toISOString()
    })
    .select()
    .single();

  if(error){
    /*
      Handles a possible unique/race condition by searching again.
    */
    const {data:existingAgain} = await db
      .from("conversations")
      .select("*")
      .or(
        `and(user_one.eq.${a},user_two.eq.${b}),and(user_one.eq.${b},user_two.eq.${a})`
      )
      .limit(1)
      .maybeSingle();

    if(existingAgain){
      await openConversation(existingAgain.id,userId);
      return;
    }

    console.error(error);
    showToast("Could not start conversation.");
    return;
  }

  conversations.unshift(data);
  await openConversation(data.id,userId);
}

async function loadMessages(){
  const area = $("chatMessages");

  area.innerHTML =
    '<div class="loading">Loading messages...</div>';

  const {data,error} = await db
    .from("messages")
    .select("*")
    .eq("conversation_id",currentConversation.id)
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    area.innerHTML =
      '<div class="empty">Unable to load messages.</div>';
    return;
  }

  area.innerHTML = "";

  if(!data?.length){
    area.innerHTML =
      '<div class="empty"><div class="emptyIcon">👋</div>Start the conversation.</div>';
    return;
  }

  let previousDay = "";

  for(const message of data){
    const day = new Date(message.created_at).toLocaleDateString();

    if(day !== previousDay){
      const label = document.createElement("div");
      label.className = "dayLabel";
      label.textContent = new Date(message.created_at).toLocaleDateString([],{
        weekday:"short",
        month:"short",
        day:"numeric"
      });
      area.appendChild(label);
      previousDay = day;
    }

    area.appendChild(await renderMessage(message));
  }

  scrollChat();
}

async function renderMessage(message){
  const mine = message.sender_id === currentUser.id;

  const row = document.createElement("div");
  row.className = "msgRow " + (mine ? "mine" : "theirs");
  row.dataset.messageId = message.id;

  const senderProfile = mine
    ? currentProfile
    : currentOtherUser;

  const avatar = document.createElement("img");
  avatar.className = "msgAvatar";
  avatar.src = getAvatar(senderProfile?.avatar_url);
  avatar.onerror = ()=>avatar.src=DEFAULT_AVATAR;

  const bubble = document.createElement("div");
  bubble.className = "msgBubble";

  let content = "";

  if(message.message_type === "photo"){
    content = `
      <img
        class="photoMsg"
        src="${escapeHTML(message.media_url || "")}"
        onclick="window.open('${escapeHTML(message.media_url || "")}','_blank')"
      >
      ${message.content ? `<div class="mediaCaption">${escapeHTML(message.content)}</div>` : ""}
    `;
  }
  else if(message.message_type === "video"){
    content = `
      <video class="videoMsg" controls preload="metadata"
             src="${escapeHTML(message.media_url || "")}"></video>
      ${message.content ? `<div class="mediaCaption">${escapeHTML(message.content)}</div>` : ""}
    `;
  }
  else if(message.message_type === "voice"){
    content = `
      <audio class="audioMsg" controls preload="metadata"
             src="${escapeHTML(message.media_url || "")}"></audio>
    `;
  }
  else if(message.message_type === "file"){
    const filename = message.content || "File";
    content = `
      <a class="fileMsg"
         href="${escapeHTML(message.media_url || "")}"
         target="_blank"
         rel="noopener">
        📎
        <span>${escapeHTML(filename)}</span>
      </a>
    `;
  }
  else{
    content = `<div class="msgText">${escapeHTML(message.content || "")}</div>`;
  }

  const edited = message.edited_at
    ? `<span class="edited"> • edited</span>`
    : "";

  const actions = `
    <div class="msgActions">
      ${message.content && message.message_type === "text"
        ? `<button class="msgAction" onclick="copyText('${message.id}')">Copy</button>`
        : ""}
      ${mine && message.message_type === "text"
        ? `<button class="msgAction" onclick="beginEdit('${message.id}',${JSON.stringify(message.content || "").replace(/"/g,"&quot;")})">Edit</button>`
        : ""}
      ${mine
        ? `<button class="msgAction" onclick="deleteMessage('${message.id}')">Delete</button>`
        : ""}
    </div>
  `;

  bubble.innerHTML =
    content +
    `<div class="msgMeta">${formatTime(message.created_at)}${edited}</div>` +
    actions;

  row.appendChild(avatar);
  row.appendChild(bubble);

  return row;
}

async function copyText(messageId){
  const {data,error} = await db
    .from("messages")
    .select("content")
    .eq("id",messageId)
    .single();

  if(error || !data?.content){
    showToast("Nothing to copy.");
    return;
  }

  try{
    await navigator.clipboard.writeText(data.content);
    showToast("Message copied.");
  }catch{
    const textarea = document.createElement("textarea");
    textarea.value = data.content;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
    showToast("Message copied.");
  }
}

function beginEdit(messageId,text){
  editingMessageId = messageId;

  $("messageInput").value = text || "";
  $("editPreview").textContent = text || "";
  $("editBar").style.display = "flex";

  $("messageInput").focus();
}

function cancelEdit(){
  editingMessageId = null;
  $("editBar").style.display = "none";
  $("messageInput").value = "";
}

async function updateMessage(){
  if(!editingMessageId) return;

  const text = $("messageInput").value.trim();

  if(!text){
    showToast("Message cannot be empty.");
    return;
  }

  const {error} = await db
    .from("messages")
    .update({
      content:text,
      edited_at:new Date().toISOString()
    })
    .eq("id",editingMessageId)
    .eq("sender_id",currentUser.id)
    .eq("message_type","text");

  if(error){
    console.error(error);
    showToast("Unable to edit message.");
    return;
  }

  cancelEdit();
  await loadMessages();
}

async function deleteMessage(messageId){
  if(!confirm("Delete this message?")) return;

  const {error} = await db
    .from("messages")
    .delete()
    .eq("id",messageId)
    .eq("sender_id",currentUser.id);

  if(error){
    console.error(error);
    showToast("Unable to delete message.");
    return;
  }

  await loadMessages();
}

async function sendCurrentMessage(){

    return;

  const text = $("messageInput").value.trim();

  if(!text){
    if(selectedPhoto) await sendPhotoMessage();
    else if(selectedVideo) await sendVideoMessage();
    else if(selectedFile) await sendFileMessage();
    else showToast("Write a message.");

  }

  const {error} = await db
    .from("messages")
    .insert({
      conversation_id:currentConversation.id,
      sender_id:currentUser.id,
      content:text,
      message_type:"text",
      created_at:new Date().toISOString()
    });

  if(error){
    console.error(error);
    showToast("Message could not be sent.");
    return;
  }

  $("messageInput").value = "";
  autoResize();

  await touchConversation();

async function touchConversation(){

  await db
    .from("conversations")
    .update({
      updated_at:new Date().toISOString()
    })
    .eq("id",currentConversation.id);

/* =========================================================
   VOICE
========================================================= */

function toggleVoiceRecording(){
  if(mediaRecorder && mediaRecorder.state === "recording"){
    stopVoiceRecording(false);
  }else{
    startVoiceRecording();
  }
}

async function startVoiceRecording(){
  if(!navigator.mediaDevices?.getUserMedia){
    showToast("Voice recording is not supported on this device.");
    return;
  }

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio:true
    });

    let options = {};

    if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
      options.mimeType = "audio/webm;codecs=opus";
    }else if(MediaRecorder.isTypeSupported("audio/webm")){
      options.mimeType = "audio/webm";
    }

    mediaRecorder = new MediaRecorder(mediaStream,options);
    audioChunks = [];
    recordingStarted = Date.now();

    mediaRecorder.ondataavailable = event=>{
      if(event.data.size) audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async ()=>{
      clearInterval(recordingTimer);

      if(mediaStream){
        mediaStream.getTracks().forEach(track=>track.stop());
      }

      mediaStream = null;

      const blob = new Blob(audioChunks,{
        type:mediaRecorder.mimeType || "audio/webm"
      });

      const duration = Math.round(
        (Date.now() - recordingStarted) / 1000
      );

      if(blob.size && duration >= 1){
        await sendVoiceMessage(blob,duration);
      }

      mediaRecorder = null;
      audioChunks = [];
      $("recordBar").style.display = "none";
    };

    mediaRecorder.start(250);

    $("recordBar").style.display = "flex";
    $("recordTimer").textContent = "00:00";

    recordingTimer = setInterval(()=>{
      const seconds = Math.floor(
        (Date.now() - recordingStarted) / 1000
      );
      $("recordTimer").textContent = formatDuration(seconds);
    },1000);

  }catch(error){
    console.error(error);
    showToast("Microphone permission is required.");
  }
}

function stopVoiceRecording(cancel){
  if(!mediaRecorder) return;

  if(cancel){
    audioChunks = [];

    mediaRecorder.onstop = ()=>{
      clearInterval(recordingTimer);

      if(mediaStream){
        mediaStream.getTracks().forEach(track=>track.stop());
      }

      mediaStream = null;
      mediaRecorder = null;
      audioChunks = [];

      $("recordBar").style.display = "none";
    };
  }

  if(mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
  }
}

  $("previewVideo").src = "";

  $("previewImage").style.display = "none";
  $("previewVideo").style.display = "none";
  $("mediaPreview").style.display = "none";
}

/* =========================================================
   READ / UNREAD
========================================================= */

async function markConversationAsRead(){
  if(!currentConversation?.id) return;

  await db
    .from("messages")
    .update({
      read_at:new Date().toISOString()
    })
    .eq("conversation_id",currentConversation.id)
    .neq("sender_id",currentUser.id)
    .is("read_at",null);

  await updateUnreadCount();
}

async function updateUnreadCount(){
  const {count,error} = await db
    .from("messages")
    .select("id",{count:"exact",head:true})
    .neq("sender_id",currentUser.id)
    .is("read_at",null);

  if(error){
    console.error(error);
    return;
  }

  const total = count || 0;

  $("titleUnread").textContent =
    total ? `(${total} unread)` : "";

  if(total){
    $("unreadFilter").textContent =
      `Unread (${total})`;
  }else{
    $("unreadFilter").textContent = "Unread";
  }
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeConversationRealtime(conversationId){
  if(conversationChannel){
    db.removeChannel(conversationChannel);
  }

  conversationChannel = db
    .channel("conversation-" + conversationId)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages",
        filter:`conversation_id=eq.${conversationId}`
      },
      async ()=>{
        await loadMessages();

        if(currentConversation?.id === conversationId){
          await markConversationAsRead();
        }

        await loadConversations();
      }
    )
    .subscribe();
}

function subscribeRealtime(){
  /*
    Conversation-specific realtime is created when a chat is opened.
  */
}

function subscribeGlobalRealtime(){
  if(globalMessageChannel){
    db.removeChannel(globalMessageChannel);
  }

  globalMessageChannel = db
    .channel("global-messages-" + currentUser.id)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      async payload=>{
        const msg = payload.new;

        if(msg.sender_id !== currentUser.id){
          await updateUnreadCount();
          await loadConversations();
        }
      }
    )
    .subscribe();
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications(){
  const {data,error} = await db
    .from("notifications")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    console.error(error);
    return;
  }

  renderNotifications(data || []);
}

function renderNotifications(data){
  const list = $("notificationList");

  if(!data.length){
    list.innerHTML =
      '<div class="empty" style="padding:25px">No notifications.</div>';
    updateNotificationBadge(0);
    return;
  }

  const unread = data.filter(n=>!n.is_read).length;

  updateNotificationBadge(unread);

  list.innerHTML = data.map(n=>`
    <div class="notification ${n.is_read ? "" : "unread"}">
      <div class="notifBody">
        <div class="notifTitle">${escapeHTML(n.title || "Notification")}</div>
        <div class="notifText">${escapeHTML(n.message || "")}</div>
        <div class="notifTime">${timeAgo(n.created_at)}</div>
      </div>

      ${!n.is_read
        ? `<button class="notifRead" onclick="markNotificationRead('${n.id}')">Read</button>`
        : ""}
    </div>
  `).join("");
}

async function markNotificationRead(id){
  await db
    .from("notifications")
    .update({is_read:true})
    .eq("id",id)
    .eq("user_id",currentUser.id);

  await loadNotifications();
}

async function markAllNotificationsRead(){
  await db
    .from("notifications")
    .update({is_read:true})
    .eq("user_id",currentUser.id)
    .eq("is_read",false);

  await loadNotifications();
}

function updateNotificationBadge(number){
  const badge = $("notificationBadge");

  if(number > 0){
    badge.textContent = number > 99 ? "99+" : number;
    badge.style.display = "flex";
  }else{
    badge.style.display = "none";
  }
}

function subscribeNotificationRealtime(){
  if(notificationChannel){
    db.removeChannel(notificationChannel);
  }

  notificationChannel = db
    .channel("notifications-" + currentUser.id)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"notifications",
        filter:`user_id=eq.${currentUser.id}`
      },
      async ()=>{
        await loadNotifications();
      }
    )
    .subscribe();
}

/* =========================================================
   FILTERS / NAVIGATION
========================================================= */

async function setFilter(filter){
  activeFilter = filter;

  $("allFilter").classList.toggle("active",filter === "all");
  $("unreadFilter").classList.toggle("active",filter === "unread");

  await renderConversations();
}

function focusUserSearch(){
  $("usernameSearch").focus();
}

function closeChat(){
  $("chat").style.display = "none";

  if(conversationChannel){
    db.removeChannel(conversationChannel);
    conversationChannel = null;
  }

  currentConversation = null;
  currentOtherUser = null;

  cancelEdit();
  clearPreview();

  loadConversations();
  updateUnreadCount();
}

function chatMore(){
  showToast("Chat options are available for your messages.");
}

function toggleNotificationPanel(){
  const panel = $("notificationPanel");

  panel.style.display =
    panel.style.display === "block" ? "none" : "block";
}

document.addEventListener("click",event=>{
  const panel = $("notificationPanel");
  const btn = $("notificationBtn");

  if(
    panel.style.display === "block" &&
    !panel.contains(event.target) &&
    !btn.contains(event.target)
  ){
    panel.style.display = "none";
  }
});

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){
  await db.auth.signOut();
  location.href = "login.html";
}

/* =========================================================
   TEXTAREA
========================================================= */

function autoResize(){
  const input = $("messageInput");

  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight,120) + "px";
}

$("messageInput").addEventListener("input",autoResize);

/* =========================================================
   SCROLL
========================================================= */

function scrollChat(){
  const area = $("chatMessages");

  requestAnimationFrame(()=>{
    area.scrollTop = area.scrollHeight;
  });
}

/* =========================================================
   PASTE SUPPORT
========================================================= */

$("messageInput").addEventListener("paste",event=>{
  /*
    Normal text copy/paste remains fully supported.
    If an image is pasted from the clipboard, Premium users
    can use it as a photo message.
  */

  const items = event.clipboardData?.items;

  if(!items || !canPhoto()) return;

  for(const item of items){
    if(item.type.startsWith("image/")){
      const file = item.getAsFile();

      if(file){
        selectedPhoto = file;
        selectedVideo = null;
        selectedFile = null;

        const reader = new FileReader();

        reader.onload = ()=>{
          $("previewImage").src = reader.result;
          $("previewImage").style.display = "block";
          $("previewVideo").style.display = "none";
          $("mediaPreview").style.display = "block";
        };

        reader.readAsDataURL(file);

        showToast("📷 Pasted photo ready to send.");
      }

      break;
    }
  }
});

/* =========================================================
   INITIALIZE
========================================================= */

startApp();
</script>
