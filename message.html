<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: #fff;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #f7931a;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 18px;
  margin-top: 20px;
}

.green {
  color: #00d26a;
}

.yellow {
  color: #ffd000;
}

.red {
  color: #ff3333;
}

.address {
  word-break: break-all;
  color: #aaa;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>₿ Bitcoin Address Monitor</h1>

<input
  id="btcAddress"
  type="text"
  placeholder="Paste Bitcoin address"
  autocomplete="off"
>

<button onclick="monitorAddress()">
  Monitor Address
</button>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function validBitcoinAddress(address) {

  if (!address) return false;

  /*
   Basic public-address validation.

   Legacy:
   1...
   3...

   SegWit:
   bc1...

   Testnet:
   m...
   n...
   2...
   tb1...
  */

  const pattern =
    /^(1[a-km-zA-HJ-NP-Z1-9]{25,34}|3[a-km-zA-HJ-NP-Z1-9]{25,34}|bc1[a-z0-9]{25,90}|[mn2][a-km-zA-HJ-NP-Z1-9]{25,34}|tb1[a-z0-9]{25,90})$/;

  return pattern.test(address);
}


function getAddressType(address) {

  if (address.startsWith("1"))
    return "Legacy P2PKH";

  if (address.startsWith("3"))
    return "Legacy P2SH";

  if (address.startsWith("bc1q"))
    return "Native SegWit";

  if (address.startsWith("bc1p"))
    return "Taproot";

  if (
    address.startsWith("m") ||
    address.startsWith("n")
  )
    return "Bitcoin Testnet P2PKH";

  if (address.startsWith("2"))
    return "Bitcoin Testnet P2SH";

  if (address.startsWith("tb1"))
    return "Bitcoin Testnet SegWit";

  return "Unknown";
}


async function monitorAddress() {

  const input =
    document.getElementById("btcAddress");

  const result =
    document.getElementById("result");

  const address =
    input.value.trim();

  if (!validBitcoinAddress(address)) {

    result.innerHTML = `
      <div class="card">
        <h2 class="red">❌ Invalid address</h2>
        <p>Please enter a valid public Bitcoin address.</p>
      </div>
    `;

    return;
  }

  const type =
    getAddressType(address);


  /*
    Save public address to Supabase.
  */

  const { data, error } =
    await supabaseClient
      .from("monitored_addresses")
      .insert({
        address: address,
        label: type,
        active: true
      })
      .select();

  if (error) {

    /*
      If duplicate or database is not configured,
      still show the monitoring information.
    */

    console.error(error);
  }


  result.innerHTML = `
    <div class="card">

      <h2 class="green">
        🟢 Address accepted
      </h2>

      <p class="address">
        ${escapeHTML(address)}
      </p>

      <br>

      <p>
        <strong>Type:</strong>
        ${escapeHTML(type)}
      </p>

      <p>
        <strong>Monitoring:</strong>
        🟢 Active
      </p>

      <br>

      <p class="yellow">
        ⚠️ This tool monitors public blockchain information.
      </p>

    </div>
  `;
}


function escapeHTML(value) {

  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
