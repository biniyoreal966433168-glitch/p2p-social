<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Address Validator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 25px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  min-height: 110px;
  resize: none;
  background: #000;
  color: #fff;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px;
  font-size: 15px;
  outline: none;
}

textarea:focus {
  border-color: #f7931a;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #f7931a;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.result {
  margin-top: 20px;
  padding: 18px;
  border-radius: 10px;
  background: #000;
  border: 1px solid #333;
  display: none;
}

.valid {
  border-color: #00c853;
}

.invalid {
  border-color: #ff3333;
}

.status {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.valid .status {
  color: #00c853;
}

.invalid .status {
  color: #ff3333;
}

.info {
  margin-top: 8px;
  color: #ccc;
  word-break: break-all;
}

.label {
  color: #888;
}
</style>
</head>

<body>

<div class="container">

  <h1>₿ Bitcoin Validator</h1>
  <p class="subtitle">Check Bitcoin address validity and type</p>

  <textarea
    id="address"
    placeholder="Paste Bitcoin address here..."
    autocomplete="off"
    spellcheck="false"></textarea>

  <button onclick="validateAddress()">Check Address</button>

  <div id="result" class="result">
    <div id="status" class="status"></div>

    <div class="info">
      <span class="label">Address:</span>
      <span id="checkedAddress"></span>
    </div>

    <div class="info">
      <span class="label">Network:</span>
      <span id="network"></span>
    </div>

    <div class="info">
      <span class="label">Type:</span>
      <span id="addressType"></span>
    </div>
  </div>

</div>

<script>
/*
  Bitcoin Address Validator
  Supports:
  - Legacy P2PKH: 1...
  - Legacy P2SH: 3...
  - Native SegWit: bc1q...
  - Taproot: bc1p...
  - Testnet addresses
*/

const CHARSET =
  "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

function sha256(data) {
  return crypto.subtle.digest("SHA-256", data);
}

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);

  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  }

  return bytes;
}

function base58Decode(str) {
  let num = 0n;

  for (const char of str) {
    const index = CHARSET.indexOf(char);

    if (index === -1) {
      return null;
    }

    num = num * 58n + BigInt(index);
  }

  let hex = num.toString(16);

  if (hex.length % 2) {
    hex = "0" + hex;
  }

  let bytes = hex ? hexToBytes(hex) : new Uint8Array();

  let leadingZeros = 0;

  for (const char of str) {
    if (char === "1") {
      leadingZeros++;
    } else {
      break;
    }
  }

  const result = new Uint8Array(leadingZeros + bytes.length);
  result.set(bytes, leadingZeros);

  return result;
}

function base58CheckValid(address) {
  const decoded = base58Decode(address);

  if (!decoded || decoded.length !== 25) {
    return null;
  }

  const payload = decoded.slice(0, 21);
  const checksum = decoded.slice(21);

  return crypto.subtle.digest("SHA-256", payload)
    .then(hash1 =>
      crypto.subtle.digest("SHA-256", hash1)
    )
    .then(hash2 => {
      const calculated = new Uint8Array(hash2).slice(0, 4);

      for (let i = 0; i < 4; i++) {
        if (calculated[i] !== checksum[i]) {
          return null;
        }
      }

      const version = payload[0];

      if (version === 0x00) {
        return {
          valid: true,
          network: "Bitcoin Mainnet",
          type: "Legacy P2PKH"
        };
      }

      if (version === 0x05) {
        return {
          valid: true,
          network: "Bitcoin Mainnet",
          type: "Legacy P2SH"
        };
      }

      if (version === 0x6f) {
        return {
          valid: true,
          network: "Bitcoin Testnet",
          type: "Testnet P2PKH"
        };
      }

      if (version === 0xc4) {
        return {
          valid: true,
          network: "Bitcoin Testnet",
          type: "Testnet P2SH"
        };
      }

      return {
        valid: false
      };
    });
}

/* ---------- Bech32 ---------- */

const BECH32_CHARSET =
  "qpzry9x8gf2tvdw0s3jn54khce6mua7l";

function bech32Polymod(values) {
  const generator = [
    0x3b6a57b2,
    0x26508e6d,
    0x1ea119fa,
    0x3d4233dd,
    0x2a1462b3
  ];

  let chk = 1;

  for (const value of values) {
    const top = chk >>> 25;

    chk = ((chk & 0x1ffffff) << 5) ^ value;

    for (let i = 0; i < 5; i++) {
      if ((top >> i) & 1) {
        chk ^= generator[i];
      }
    }
  }

  return chk >>> 0;
}

function bech32HrpExpand(hrp) {
  const result = [];

  for (const char of hrp) {
    result.push(char.charCodeAt(0) >> 5);
  }

  result.push(0);

  for (const char of hrp) {
    result.push(char.charCodeAt(0) & 31);
  }

  return result;
}

function verifyBech32(address) {

  if (address.length < 8 || address.length > 90) {
    return null;
  }

  const lower = address.toLowerCase();
  const upper = address.toUpperCase();

  if (address !== lower && address !== upper) {
    return null;
  }

  const normalized = lower;

  const separator = normalized.lastIndexOf("1");

  if (separator < 1 || separator + 7 > normalized.length) {
    return null;
  }

  const hrp = normalized.slice(0, separator);
  const dataPart = normalized.slice(separator + 1);

  const data = [];

  for (const char of dataPart) {
    const index = BECH32_CHARSET.indexOf(char);

    if (index === -1) {
      return null;
    }

    data.push(index);
  }

  const polymod = bech32Polymod(
    bech32HrpExpand(hrp).concat(data)
  );

  let encoding;

  if (polymod === 1) {
    encoding = "bech32";
  } else if (polymod === 0x2bc830a3) {
    encoding = "bech32m";
  } else {
    return null;
  }

  const witnessVersion = data[0];

  if (witnessVersion > 16) {
    return null;
  }

  const program = convertBits(
    data.slice(1, -6),
    5,
    8,
    false
  );

  if (!program) {
    return null;
  }

  if (program.length < 2 || program.length > 40) {
    return null;
  }

  if (witnessVersion === 0) {

    if (encoding !== "bech32") {
      return null;
    }

    if (program.length === 20) {
      return {
        valid: true,
        network: hrp === "bc"
          ? "Bitcoin Mainnet"
          : "Bitcoin Testnet",
        type: "Native SegWit P2WPKH"
      };
    }

    if (program.length === 32) {
      return {
        valid: true,
        network: hrp === "bc"
          ? "Bitcoin Mainnet"
          : "Bitcoin Testnet",
        type: "Native SegWit P2WSH"
      };
    }

    return null;
  }

  if (witnessVersion === 1 && program.length === 32) {

    if (encoding !== "bech32m") {
      return null;
    }

    return {
      valid: true,
      network: hrp === "bc"
        ? "Bitcoin Mainnet"
        : "Bitcoin Testnet",
      type: "Taproot P2TR"
    };
  }

  return {
    valid: true,
    network: hrp === "bc"
      ? "Bitcoin Mainnet"
      : "Bitcoin Testnet",
    type: "SegWit"
  };
}

function convertBits(data, fromBits, toBits, pad) {

  let acc = 0;
  let bits = 0;
  const ret = [];
  const maxv = (1 << toBits) - 1;
  const maxAcc = (1 << (fromBits + toBits - 1)) - 1;

  for (const value of data) {

    if (value < 0 || (value >> fromBits)) {
      return null;
    }

    acc = ((acc << fromBits) | value) & maxAcc;
    bits += fromBits;

    while (bits >= toBits) {
      bits -= toBits;
      ret.push((acc >> bits) & maxv);
    }
  }

  if (pad) {

    if (bits) {
      ret.push((acc << (toBits - bits)) & maxv);
    }

  } else {

    if (bits >= fromBits) {
      return null;
    }

    if (((acc << (toBits - bits)) & maxv) !== 0) {
      return null;
    }
  }

  return ret;
}

/* ---------- Main validation ---------- */

async function validateAddress() {

  const input = document
    .getElementById("address")
    .value
    .trim();

  const result = document.getElementById("result");
  const status = document.getElementById("status");
  const checkedAddress =
    document.getElementById("checkedAddress");
  const network =
    document.getElementById("network");
  const addressType =
    document.getElementById("addressType");

  result.style.display = "block";

  checkedAddress.textContent = input;
  network.textContent = "-";
  addressType.textContent = "-";

  if (!input) {
    result.className = "result invalid";
    status.textContent = "❌ Invalid";
    return;
  }

  let validation = null;

  /* Bech32 / Bech32m */

  if (
    input.toLowerCase().startsWith("bc1") ||
    input.toLowerCase().startsWith("tb1")
  ) {
    validation = verifyBech32(input);
  }

  /* Base58Check */

  else {
    validation = await base58CheckValid(input);
  }

  if (validation && validation.valid) {

    result.className = "result valid";

    status.textContent = "✅ Valid Bitcoin Address";

    network.textContent = validation.network;
    addressType.textContent = validation.type;

  } else {

    result.className = "result invalid";

    status.textContent = "❌ Invalid Bitcoin Address";
  }
}

/* Enter key */

document
  .getElementById("address")
  .addEventListener("keydown", function(event) {

    if (event.ctrlKey && event.key === "Enter") {
      validateAddress();
    }

  });
</script>

</body>
</html>
