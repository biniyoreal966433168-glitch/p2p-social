/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;
let realtimeChannel = null;
let searchTimer = null;
let actionLock = false;


/* =====================================================
   SAFE BUTTON ACTION
   Prevent accidental repeated/double taps
===================================================== */

function runOnce(action) {

  if (actionLock) return;

  actionLock = true;

  try {
    action();
  } finally {

    setTimeout(() => {
      actionLock = false;
    }, 350);

  }

}


/* =====================================================
   START
===================================================== */

async function startApp() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if (error) {

    console.error(error);
    return;

  }

  if (!data.session) {

    window.location.href =
      "login.html";

    return;

  }

  currentUser =
    data.session.user;

  await loadConversations();

}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations() {

  const list =
    document.getElementById("chatList");

  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      { ascending: false }
    );

  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="loading">
        Could not load conversations.
      </div>`;

    return;

  }

  list.innerHTML = "";

  if (!data || data.length === 0) {

    document.getElementById("empty")
      .style.display = "block";

    return;

  }

  document.getElementById("empty")
    .style.display = "none";

  for (const conversation of data) {

    const otherId =
      conversation.user_one === currentUser.id
        ? conversation.user_two
        : conversation.user_one;

    await createConversationItem(
      conversation,
      otherId,
      list
    );

  }

}


/* =====================================================
   CONVERSATION ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
) {

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .eq("id", otherId)
    .maybeSingle();

  const name =
    profile?.username ||
    "User";

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";

  const {
    data: last
  } =
  await supabaseClient
    .from("messages")
    .select(
      "content,created_at"
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      { ascending: false }
    )
    .limit(1);

  const item =
    document.createElement("div");

  item.className =
    "chat-item";

  item.dataset.unread = "0";

  item.innerHTML = `

    <img
      class="avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">
          ${escapeHTML(name)}
        </span>

      </div>

      <div class="chat-preview">
        ${
          last && last.length
            ? escapeHTML(last[0].content)
            : "Start a conversation"
        }
      </div>

    </div>
  `;

  item.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      runOnce(() => {

        openConversation(
          conversation,
          profile || {
            id: otherId,
            username: "User",
            avatar_url: "images/profile.png"
          }
        );

      });

    }
  );

  list.appendChild(item);

}


/* =====================================================
   SEARCH USERS
===================================================== */

function searchUsers() {

  clearTimeout(searchTimer);

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();

  const results =
    document.getElementById(
      "searchResults"
    );

  if (!query) {

    results.style.display = "none";
    results.innerHTML = "";

    return;

  }

  searchTimer =
    setTimeout(
      async () => {

        if (!currentUser) return;

        const {
          data,
          error
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,avatar_url"
          )
          .ilike(
            "username",
            "%" + query + "%"
          )
          .neq(
            "id",
            currentUser.id
          )
          .limit(10);

        if (error) {

          console.error(error);

          results.innerHTML =
            `<div class="loading">
              Search failed.
            </div>`;

          results.style.display = "block";

          return;

        }

        results.innerHTML = "";

        if (!data || data.length === 0) {

          results.innerHTML =
            `<div class="loading">
              No users found.
            </div>`;

        } else {

          data.forEach(
            profile => {

              const user =
                document.createElement(
                  "div"
                );

              user.className =
                "search-user";

              user.innerHTML = `

                <img
                  src="${
                    escapeHTML(
                      profile.avatar_url ||
                      "images/profile.png"
                    )
                  }">

                <div class="search-info">

                  <div class="search-name">
                    ${
                      escapeHTML(
                        profile.username ||
                        "User"
                      )
                    }
                  </div>

                  <div class="search-id">
                    Tap to message
                  </div>

                </div>
              `;

              user.addEventListener(
                "click",
                function(event) {

                  event.preventDefault();

                  runOnce(() => {

                    startConversation(
                      profile
                    );

                  });

                }
              );

              results.appendChild(user);

            }
          );

        }

        results.style.display = "block";

      },
      300
    );

}


/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(profile) {

  if (!currentUser || !profile?.id) return;

  const otherId =
    profile.id;

  const userOne =
    currentUser.id < otherId
      ? currentUser.id
      : otherId;

  const userTwo =
    currentUser.id < otherId
      ? otherId
      : currentUser.id;

  const {
    data: existing,
    error: findError
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .eq("user_one", userOne)
    .eq("user_two", userTwo)
    .maybeSingle();

  if (findError) {

    alert(
      "Conversation error: " +
      findError.message
    );

    return;

  }

  let conversation =
    existing;

  if (!conversation) {

    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one: userOne,
        user_two: userTwo
      })
      .select()
      .single();

    if (error) {

      alert(
        "Could not create conversation: " +
        error.message
      );

      return;

    }

    conversation =
      data;

  }

  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "searchResults"
  ).style.display = "none";

  await openConversation(
    conversation,
    profile
  );

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openConversation(
  conversation,
  profile
) {

  if (!conversation || !profile) return;

  currentConversation =
    conversation;

  currentOtherUser =
    profile;

  document.getElementById(
    "chatName"
  ).textContent =
    profile.username ||
    "User";

  document.getElementById(
    "chatAvatar"
  ).src =
    profile.avatar_url ||
    "images/profile.png";

  document.getElementById(
    "chatScreen"
  ).style.display =
    "block";

  await loadMessages();

  subscribeRealtime();

  setTimeout(() => {

    document.getElementById(
      "messageInput"
    ).focus();

  }, 100);

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

  if (!currentConversation) return;

  const container =
    document.getElementById(
      "messagesContainer"
    );

  container.innerHTML = "";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      currentConversation.id
    )
    .order(
      "created_at",
      { ascending: true }
    );

  if (error) {

    container.innerHTML =
      `<div class="loading">
        ${escapeHTML(error.message)}
      </div>`;

    return;

  }

  if (!data || data.length === 0) {

    container.innerHTML =
      `<div class="loading">
        No messages yet 👋
      </div>`;

    return;

  }

  data.forEach(
    message =>
      renderMessage(message)
  );

  scrollMessages();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message) {

  const container =
    document.getElementById(
      "messagesContainer"
    );

  const row =
    document.createElement("div");

  row.className =
    "message-row" +
    (
      message.sender_id ===
      currentUser.id
        ? " mine"
        : ""
    );

  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";

  bubble.innerHTML = `

    <div>
      ${escapeHTML(message.content)}
    </div>

    <div class="message-time">
      ${formatTime(message.created_at)}
    </div>

  `;

  row.appendChild(bubble);

  container.appendChild(row);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  if (!currentUser) return;

  if (!currentConversation) return;

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  /*
    Clear immediately so repeated taps
    cannot send the same text twice.
  */
  input.value = "";

  const sendButton =
    document.getElementById(
      "sendMessageButton"
    );

  sendButton.disabled = true;

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({
      conversation_id:
        currentConversation.id,

      sender_id:
        currentUser.id,

      content:
        text
    });

  sendButton.disabled = false;

  if (error) {

    input.value = text;

    alert(
      "Message failed: " +
      error.message
    );

    return;

  }

  await loadMessages();

}


/* =====================================================
   REALTIME
===================================================== */

function subscribeRealtime() {

  if (!currentConversation) return;

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;

  }

  const conversationId =
    currentConversation.id;

  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        () => {

          if (
            currentConversation &&
            currentConversation.id ===
            conversationId
          ) {

            loadMessages();

          }

        }
      )
      .subscribe();

}


/* =====================================================
   CLOSE CHAT
===================================================== */

function closeChat() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;

  }

  currentConversation = null;
  currentOtherUser = null;

  document.getElementById(
    "chatScreen"
  ).style.display =
    "none";

  document.getElementById(
    "messageInput"
  ).value = "";

  loadConversations();

}


/* =====================================================
   FILTER
===================================================== */

function showAll(button) {

  setActiveFilter(button);

  document
    .querySelectorAll(".chat-item")
    .forEach(
      item => {

        item.style.display =
          "flex";

      }
    );

}


function showUnread(button) {

  setActiveFilter(button);

  document
    .querySelectorAll(".chat-item")
    .forEach(
      item => {

        item.style.display =
          Number(
            item.dataset.unread || 0
          ) > 0
            ? "flex"
            : "none";

      }
    );

}


function setActiveFilter(button) {

  document
    .querySelectorAll(".filter")
    .forEach(
      b =>
        b.classList.remove("active")
    );

  button.classList.add("active");

}


/* =====================================================
   NEW MESSAGE
===================================================== */

function focusSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );

  input.focus();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

function messageKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    runOnce(() => {

      sendMessage();

    });

  }

}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages() {

  const container =
    document.getElementById(
      "messagesContainer"
    );

  container.scrollTop =
    container.scrollHeight;

}


function formatTime(date) {

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}
