<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f7;
  color:#172121;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
  height:62px;
  background:#087f73;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  font-weight:800;
}

.logo-mark{
  width:37px;
  height:37px;
  border-radius:50%;
  background:white;
  color:#087f73;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.logout-btn{
  border:1px solid rgba(255,255,255,.55);
  color:white;
  background:rgba(255,255,255,.08);
  border-radius:9px;
  padding:8px 11px;
  font-weight:700;
}

.logout-btn:hover{
  background:rgba(255,255,255,.16);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:14px;
  padding-bottom:86px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.page-title h1{
  margin:0;
  font-size:23px;
}

.new-message-btn{
  border:0;
  background:#087f73;
  color:#fff;
  padding:10px 13px;
  border-radius:10px;
  font-weight:800;
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:relative;
  margin-bottom:12px;
}

.search-box input{
  width:100%;
  height:46px;
  border:1px solid #d3dddd;
  background:#fff;
  border-radius:12px;
  padding:0 45px 0 15px;
  outline:none;
}

.search-box input:focus{
  border-color:#087f73;
  box-shadow:0 0 0 3px rgba(8,127,115,.09);
}

.search-icon{
  position:absolute;
  right:14px;
  top:13px;
  color:#687777;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
  background:#fff;
  border:1px solid #dde5e5;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
  display:none;
}

.user-result{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-bottom:1px solid #edf1f1;
  cursor:pointer;
}

.user-result:last-child{
  border-bottom:0;
}

.user-result:hover{
  background:#f4f9f8;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#dcebea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:900;
  flex-shrink:0;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.username{
  color:#708080;
  font-size:13px;
  margin-top:2px;
}

/* =========================
   CONVERSATIONS
========================= */

.section-title{
  font-size:15px;
  font-weight:900;
  margin:15px 2px 8px;
}

.conversations{
  background:#fff;
  border:1px solid #dfe7e7;
  border-radius:13px;
  overflow:hidden;
}

.conversation{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border-bottom:1px solid #edf1f1;
  cursor:pointer;
}

.conversation:last-child{
  border-bottom:0;
}

.conversation:hover{
  background:#f5f9f9;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-name{
  font-weight:800;
}

.conversation-time{
  color:#899595;
  font-size:11px;
}

.last-message{
  color:#697777;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:4px;
}

.unread-badge{
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:20px;
  background:#e53935;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#7a8888;
}

/* =========================
   CHAT
========================= */

.chat-panel{
  position:fixed;
  inset:0;
  background:#f4f7f7;
  z-index:100;
  display:none;
  flex-direction:column;
}

.chat-header{
  height:62px;
  background:#087f73;
  color:#fff;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 12px;
  flex-shrink:0;
}

.back-btn{
  border:0;
  background:transparent;
  color:#fff;
  font-size:27px;
  width:38px;
  height:42px;
}

.chat-user{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
}

.chat-user .avatar{
  width:38px;
  height:38px;
  background:rgba(255,255,255,.2);
  color:#fff;
}

.chat-user-info{
  min-width:0;
}

.chat-user-name{
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-username{
  font-size:11px;
  opacity:.8;
}

.chat-actions{
  display:flex;
  gap:5px;
}

.chat-action{
  border:0;
  background:rgba(255,255,255,.13);
  color:#fff;
  border-radius:8px;
  padding:7px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.date-divider{
  text-align:center;
  color:#8a9696;
  font-size:11px;
  margin:8px 0;
}

.message-row{
  display:flex;
  max-width:88%;
}

.message-row.mine{
  align-self:flex-end;
  justify-content:flex-end;
}

.message-row.theirs{
  align-self:flex-start;
}

.message-bubble{
  position:relative;
  border-radius:15px;
  padding:9px 11px;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
  min-width:55px;
}

.mine .message-bubble{
  background:#087f73;
  color:#fff;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  border-bottom-left-radius:4px;
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
  user-select:text;
  line-height:1.4;
}

.message-meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
  margin-top:4px;
  font-size:10px;
  opacity:.72;
}

.message-menu{
  position:absolute;
  right:4px;
  top:4px;
  display:none;
  background:#fff;
  color:#222;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  z-index:5;
}

.message-bubble:hover .message-menu{
  display:block;
}

.message-menu button{
  display:block;
  width:100%;
  border:0;
  background:#fff;
  padding:8px 11px;
  text-align:left;
}

.message-menu button:hover{
  background:#f2f5f5;
}

/* =========================
   MEDIA MESSAGE
========================= */

.message-image{
  max-width:230px;
  max-height:300px;
  border-radius:10px;
  display:block;
}

.message-video{
  width:250px;
  max-width:100%;
  border-radius:10px;
}

.audio-player{
  max-width:230px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  background:#fff;
  border-top:1px solid #dce4e4;
  padding:8px;
  flex-shrink:0;
}

.composer-tools{
  display:flex;
  gap:6px;
  margin-bottom:7px;
}

.tool-btn{
  width:37px;
  height:34px;
  border:1px solid #d4dddd;
  background:#f8fafa;
  border-radius:9px;
  font-size:17px;
}

.tool-btn:disabled{
  opacity:.4;
}

.composer-row{
  display:flex;
  gap:7px;
  align-items:flex-end;
}

.message-input{
  flex:1;
  min-height:43px;
  max-height:130px;
  resize:none;
  border:1px solid #d4dddd;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

.message-input:focus{
  border-color:#087f73;
}

.send-btn{
  width:45px;
  height:43px;
  border:0;
  border-radius:12px;
  background:#087f73;
  color:#fff;
  font-size:20px;
}

.editing-bar{
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:7px 9px;
  background:#eaf5f3;
  color:#087f73;
  border-radius:8px;
  margin-bottom:6px;
  font-size:12px;
  font-weight:700;
}

.cancel-edit{
  border:0;
  background:transparent;
  color:#d32f2f;
  font-weight:800;
}

/* =========================
   ACTION BAR
========================= */

.trade-bar{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.trade-btn{
  flex:1;
  border:0;
  padding:10px 7px;
  border-radius:10px;
  font-weight:900;
  background:#fff;
  border:1px solid #dce5e5;
}

.trade-send{
  color:#087f73;
}

.trade-buy{
  color:#178b43;
}

.trade-trade{
  color:#7050a8;
}

/* =========================
   PROFILE MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-card{
  background:#fff;
  width:100%;
  max-width:430px;
  border-radius:16px;
  overflow:hidden;
  max-height:90vh;
  overflow-y:auto;
}

.modal-header{
  background:#087f73;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h3{
  margin:0;
}

.close-btn{
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
}

.modal-body{
  padding:18px;
}

.profile-center{
  text-align:center;
}

.profile-center .avatar{
  width:80px;
  height:80px;
  margin:auto;
  font-size:27px;
}

.profile-center h3{
  margin:10px 0 3px;
}

.profile-center p{
  color:#778484;
  margin:0;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:17px;
}

.action-grid button{
  border:0;
  border-radius:10px;
  padding:10px 5px;
  background:#f2f7f6;
  font-weight:800;
}

/* =========================
   MEDIA LIMIT MESSAGE
========================= */

.plan-info{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  background:#f7f9f9;
  font-size:12px;
  color:#637171;
}

.plan-info strong{
  color:#087f73;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:#fff;
  border-top:1px solid #dce4e4;
  display:flex;
  z-index:70;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);
}

.nav-item{
  flex:1;
  border:0;
  background:#fff;
  color:#718080;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
  position:relative;
}

.nav-icon{
  font-size:20px;
}

.nav-item.active{
  color:#087f73;
}

.nav-badge{
  position:absolute;
  top:7px;
  right:calc(50% - 21px);
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#e53935;
  color:white;
  font-size:9px;
  display:none;
  align-items:center;
  justify-content:center;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(15px);
  background:#222;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   LOGIN
========================= */

.login-screen{
  position:fixed;
  inset:0;
  background:#f4f7f7;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 7px 30px rgba(0,0,0,.1);
}

.login-card h2{
  margin-top:0;
  color:#087f73;
}

.login-input{
  width:100%;
  height:45px;
  border:1px solid #d2dddd;
  border-radius:10px;
  padding:0 12px;
  margin-bottom:9px;
  outline:none;
}

.login-button{
  width:100%;
  height:45px;
  border:0;
  border-radius:10px;
  background:#087f73;
  color:#fff;
  font-weight:900;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .main{
    padding:11px;
    padding-bottom:80px;
  }

  .message-row{
    max-width:92%;
  }

  .trade-btn{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-mark">💬</div>
      <span>Messages</span>
    </div>

    <div class="header-right">
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <div class="page-title">
      <h1>Messages</h1>
      <button class="new-message-btn" id="newMessageBtn">
        ➕ New message
      </button>
    </div>

    <!-- USERNAME SEARCH -->
    <div class="search-box">
      <input
        id="userSearch"
        type="text"
        autocomplete="off"
        placeholder="🔍 Search username"
      >
      <span class="search-icon">🔍</span>
    </div>

    <div class="search-results" id="searchResults"></div>

    <!-- CONVERSATIONS -->
    <div class="section-title">
      💬 Conversations
    </div>

    <div class="conversations" id="conversations">
      <div class="empty">
        Loading conversations...
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="nav-item" id="homeNav">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>

    <button class="nav-item" id="liveNav">
      <span class="nav-icon">🔴</span>
      <span>Live</span>
    </button>

    <button class="nav-item" id="p2pNav">
      <span class="nav-icon">🔄</span>
      <span>P2P</span>
    </button>

    <button class="nav-item active" id="messagesNav">
      <span class="nav-icon">💬</span>
      <span>Messages</span>
      <span class="nav-badge" id="navUnreadBadge">0</span>
    </button>

    <button class="nav-item" id="profileNav">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>

  </nav>

</div>


<!-- =========================
     CHAT PANEL
========================= -->

<section class="chat-panel" id="chatPanel">

  <div class="chat-header">

    <button class="back-btn" id="backChatBtn">
      ‹
    </button>

    <div class="chat-user" id="chatUserHeader">

      <div class="avatar" id="chatAvatar">
        👤
      </div>

      <div class="chat-user-info">
        <div class="chat-user-name" id="chatUserName">
          User
        </div>

        <div class="chat-user-username" id="chatUserUsername">
          @username
        </div>
      </div>

    </div>

    <div class="chat-actions">
      <button class="chat-action" id="profileChatBtn">
        👤
      </button>
    </div>

  </div>


  <!-- TRADE ACTIONS -->

  <div style="background:#fff;padding:8px;border-bottom:1px solid #dce4e4;">

    <div class="trade-bar">

      <button
        class="trade-btn trade-send"
        id="sendActionBtn"
      >
        💎 Send
      </button>

      <button
        class="trade-btn trade-buy"
        id="buyActionBtn"
      >
        🟢 Buy
      </button>

      <button
        class="trade-btn trade-trade"
        id="tradeActionBtn"
      >
        🤝 Trade
      </button>

    </div>

  </div>


  <!-- MESSAGES -->

  <div class="messages" id="messages">
    <div class="empty">
      Loading messages...
    </div>
  </div>


  <!-- COMPOSER -->

  <div class="composer">

    <div class="editing-bar" id="editingBar">
      <span>✏️ Editing message</span>
      <button class="cancel-edit" id="cancelEditBtn">
        Cancel
      </button>
    </div>

    <div class="composer-tools">

      <button
        class="tool-btn"
        id="voiceBtn"
        title="Voice"
      >
        🎤
      </button>

      <button
        class="tool-btn"
        id="photoBtn"
        title="Photo"
      >
        📷
      </button>

      <button
        class="tool-btn"
        id="videoBtn"
        title="Video"
      >
        🎥
      </button>

      <button
        class="tool-btn"
        id="fileBtn"
        title="File"
      >
        📎
      </button>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        class="hidden"
      >

      <input
        type="file"
        id="videoInput"
        accept="video/*"
        class="hidden"
      >

      <input
        type="file"
        id="fileInput"
        class="hidden"
      >

    </div>

    <div class="composer-row">

      <textarea
        id="messageInput"
        class="message-input"
        rows="1"
        placeholder="Write a message..."
      ></textarea>

      <button
        class="send-btn"
        id="sendMessageBtn"
        title="Send"
      >
        ➤
      </button>

    </div>

    <div class="plan-info" id="planInfo">
      Plan: <strong>Free</strong>
      · 💬 Text ✅
      · 🎤 Voice ✅
      · 📷 Photo 🔒 P2P Confirmation Only
      · 🎥 Video ❌
      · 📎 File ❌
    </div>

  </div>

</section>


<!-- =========================
     PROFILE MODAL
========================= -->

<div class="modal" id="profileModal">

  <div class="modal-card">

    <div class="modal-header">
      <h3>👤 Profile</h3>

      <button class="close-btn" id="closeProfileBtn">
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="profile-center">

        <div class="avatar" id="profileAvatar">
          👤
        </div>

        <h3 id="profileName">
          User
        </h3>

        <p id="profileUsername">
          @username
        </p>

        <div class="action-grid">

          <button id="profileSendBtn">
            💎 Send
          </button>

          <button id="profileBuyBtn">
            🟢 Buy
          </button>

          <button id="profileTradeBtn">
            🤝 Trade
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div class="login-screen" id="loginScreen">

  <div class="login-card">

    <h2>💬 Messages</h2>

    <p>
      Please sign in to use messaging.
    </p>

    <input
      class="login-input"
      id="loginEmail"
      type="email"
      placeholder="Email"
    >

    <input
      class="login-input"
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="login-button"
      id="loginButton"
    >
      🔐 Sign In
    </button>

    <div
      id="loginStatus"

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

      )
      .eq(

/* =========================================================
   FIND / CREATE CONVERSATION
========================================================= */

async function getOrCreateConversation(
  otherUserId
){

  const first =
    String(currentUser.id) <
    String(otherUserId)
      ? currentUser.id
      : otherUserId;

  const second =
    String(currentUser.id) <
    String(otherUserId)
      ? otherUserId
      : currentUser.id;

  const existing =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user1_id",first)
      .eq("user2_id",second)
      .maybeSingle();

  if(
    existing.data &&
    !existing.error
  ){

    return existing.data;

  }

  const created =
    await supabaseClient
      .from("conversations")
      .insert({
        user1_id:first,
        user2_id:second
      })
      .select()
      .single();

  if(created.error){

    /*
      A duplicate created by another client
      can be recovered by checking again.
    */

    const retry =
      await supabaseClient
        .from("conversations")
        .select("*")
        .eq("user1_id",first)
        .eq("user2_id",second)
        .maybeSingle();

    if(retry.data){

      return retry.data;

    }

    throw created.error;

  }

  return created.data;

}

  messages.innerHTML = "";

      messages.appendChild(
        divider

    bubble.querySelector(
      '[data-action="delete"]'
    );

  if(deleteBtn){

    deleteBtn.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        deleteMessage(
          message.id
        );

      }
    );

  }

  return row;

}

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text || ""
    );

    showToast(
      "Message copied."
    );

  }catch(error){

    const textarea =
      document.createElement("textarea");

    textarea.value =
      text || "";

    document.body.appendChild(
      textarea

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast(
      "Message copied."
    );

  }

}

async function sendOrEditMessage(){

  if(!currentUser){
    return;
  }

  if(!activeConversationId){
    showToast("Open a conversation first.");
    return;
  }

  const content =
    messageInput.value.trim();

  if(!content){
    return;
  }

  sendMessageBtn.disabled =
    true;

  try{

    if(editingMessageId){

      const result =
        await supabaseClient
          .from("messages")
          .update({
            content,
            edited_at:
              new Date().toISOString()
          })
          .eq(
            "id",
            editingMessageId
          )
          .eq(
            "sender_id",
            currentUser.id
          );

      if(result.error){
        throw result.error;
      }

      cancelEdit();

      await loadMessages();

    }else{

      const result =
        await supabaseClient
          .from("messages")
          .insert({
            conversation_id:
              activeConversationId,

            sender_id:
              currentUser.id,

            receiver_id:
              activeChatUser.id,

            content,

            message_type:
              "text",

            is_read:
              false
          });

      if(result.error){
        throw result.error;
      }

      messageInput.value =
        "";

      autoResizeTextarea();

      await loadMessages();

      await refreshConversationList();

    }

  }catch(error){

    console.error(error);

    showToast(
      "Message could not be sent."
    );

  }finally{

    sendMessageBtn.disabled =
      false;

  }

}

function startMessageRealtime(){

    supabaseClient
      .removeChannel(
        messageChannel

      null;

  if(!activeConversationId){

  messageChannel =
    supabaseClient
      .channel(

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            activeConversationId
        },
        async(payload) => {

          if(
            payload.eventType ===
            "INSERT"
          ){

            if(
              String(
                payload.new.receiver_id
              ) ===
              String(
                currentUser.id
              )
            ){

              await markOneRead(
                payload.new.id
              );

            }

          }

          await loadMessages();

          await refreshConversationList();

        }
      )
      .subscribe();

}

/* =========================================================
   PLAN
========================================================= */

function normalizePlan(profile){

  const value =
    String(
      profile?.plan ||
      profile?.subscription ||
      profile?.membership ||
      "free"
    )
    .toLowerCase()
    .replace(/\s+/g,"");

  if(
    value.includes("premiummax") ||
    value.includes("premium_max")
  ){

    return "premium_max";

  }

  if(
    value.includes("premium+") ||
    value.includes("premiumplus") ||
    value === "premium_plus"
  ){

    return "premium_plus";

  }

  if(
    value === "premium" ||
    value.includes("premium")
  ){

    return "premium";

  }

  return "free";

}


function getCurrentPlan(){

  return normalizePlan(
    currentProfile
  );

}

  if(plan === "premium_plus"){

    return {

      voice:true,
      photo:true,
      video:true,

    };

  }

  if(plan === "premium"){

    return {
      text:true,
      voice:true,
      photo:true,
      video:false,
      file:false
    };

  }

  return {
    text:true,
    voice:true,
    photo:false,
    video:false,
    file:false
  };

}

/* =========================================================
   UPLOAD MEDIA
========================================================= */

async function uploadMedia(
  file,
  type
){

  if(
    !activeConversationId ||
    !activeChatUser
  ){

    showToast(
      "Open a conversation first."
    );

    return;

  }

  const features =
    planFeatures();

  if(
    type === "image" &&
    !features.photo
  ){

    showToast(
      "Photo is not available on your plan."
    );

    return;

  }

  if(
    type === "video" &&
    !features.video
  ){

    showToast(
      "Video is not available on your plan."
    );

    return;

  }

  if(
    type === "file" &&
    !features.file
  ){

    showToast(
      "Files are not available on your plan."
    );

    return;

  }

  showToast(
    "Uploading..."
  );

  try{

    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop()
        : "bin";

    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      cryptoRandom() +
      "." +
      extension;

    /*
      Storage bucket:
      message-media

      The bucket should be configured as
      appropriate for your project.
    */

    const upload =
      await supabaseClient
        .storage
        .from("message-media")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );

    if(upload.error){

      throw upload.error;

    }

    const publicResult =
      supabaseClient
        .storage
        .from("message-media")
        .getPublicUrl(path);

    const mediaURL =
      publicResult.data.publicUrl;

    const insert =
      await supabaseClient
        .from("messages")
        .insert({

          conversation_id:
            activeConversationId,

          sender_id:
            currentUser.id,

          receiver_id:
            activeChatUser.id,

          content:
            type === "file"
              ? file.name
              : "",

          message_type:
            type,

          media_url:
            mediaURL,

          is_read:
            false

        });

    if(insert.error){

      throw insert.error;

    }

    showToast(
      "Sent."
    );

    await loadMessages();

    await refreshConversationList();

  }catch(error){

    console.error(error);

    showToast(
      "Upload failed."
    );

  }

}


/* =========================================================
   VOICE
========================================================= */

let mediaRecorder = null;
let audioChunks = [];
let recording = false;

voiceBtn.addEventListener(
  "click",
  toggleVoiceRecording
);

async function toggleVoiceRecording(){

  if(!planFeatures().voice){

    showToast(
      "Voice messaging is unavailable."
    );

    return;

  }

  if(recording){

    mediaRecorder.stop();

    return;

  }

  if(
    !activeConversationId ||
    !activeChatUser
  ){

    showToast(
      "Open a conversation first."
    );

    return;

  }

  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    recording = true;

    voiceBtn.textContent =
      "⏹️";

    showToast(
      "Recording..."
    );

    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){

          audioChunks.push(
            event.data
          );

        }

      };

    mediaRecorder.onstop =
      async() => {

        recording = false;

        voiceBtn.textContent =
          "🎤";

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );

        await uploadVoice(
          blob
        );

      };

    mediaRecorder.start();

  }catch(error){

    console.error(error);

    showToast(
      "Microphone permission is required."
    );

  }

}

/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(date){

  if(!date){
    return "";
  }

  const d =
    new Date(date);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   RANDOM ID
========================================================= */

function cryptoRandom(){

  if(
    window.crypto &&
    crypto.getRandomValues
  ){

    const array =
      new Uint32Array(2);

    crypto.getRandomValues(
      array
    );

    return (
      array[0].toString(36) +
      array[1].toString(36)
    );

  }

  return Math.random()
    .toString(36)
    .substring(2);

}

  ){

    const title =
      "💬 New message";

    const body =
      message.content ||
      (
        message.message_type === "image"
          ? "📷 Photo"
          : message.message_type === "video"
            ? "🎥 Video"
            : message.message_type === "voice"
              ? "🎤 Voice"
              : message.message_type === "file"
                ? "📎 File"
                : "New message"
      );

    try{

      new Notification(
        title,
        {
          body,
          icon:
            getAvatarURL(
              activeChatUser
            ) || undefined
        }
      );

    }catch(error){}

  }

}


/* =========================================================
   ENHANCED GLOBAL REALTIME
========================================================= */

function startGlobalMessageNotifications(){

  if(!currentUser){
    return;
  }

  const channel =
    supabaseClient
      .channel(
        "global-message-notifications-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "receiver_id=eq." +
            currentUser.id
        },
        async(payload) => {

          showIncomingNotification(
            payload.new
          );

          await refreshConversationList();

          await updateDocumentTitle();

        }
      )
      .subscribe();

  window.globalMessageChannel =
    channel;

}

function stopGlobalMessageNotifications(){

  if(
    window.globalMessageChannel
  ){

    supabaseClient.removeChannel(
      window.globalMessageChannel
    );

    window.globalMessageChannel =
      null;

  }

}


/* Replace startApp realtime setup with
   global notification channel too. */

const originalStartApp =
  startApp;

startApp =
  async function(user){

    await originalStartApp(user);

    stopGlobalMessageNotifications();

    startGlobalMessageNotifications();

    await updateDocumentTitle();

  };


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopRealtime();

    stopGlobalMessageNotifications();

  }
);

</script>
