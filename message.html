    Profile

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentConversation = null;
let currentOtherUser = null;

let realtimeChannel = null;
let unreadChannel = null;
let notificationChannel = null;

let searchTimer = null;
let actionLock = false;


/* =====================================================
   RUN ONCE
===================================================== */

function runOnce(action){

  if(actionLock){
    return;
  }

  actionLock = true;

  try{

    const result = action();

    if(
      result &&
      typeof result.finally === "function"
    ){

      result.finally(() => {

        setTimeout(() => {
          actionLock = false;
        },350);

      });

      return;
    }

  }catch(error){

    console.error(error);

  }

  setTimeout(() => {
    actionLock = false;
  },350);
}


/* =====================================================
   START
===================================================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){
    console.error("Session error:",error);
    return;
  }

  if(!data.session){

    window.location.replace("login.html");
    return;

  }

  currentUser =
    data.session.user;

  await updateAuthUI();

  await loadConversations();

  await updateUnreadCount();

  await loadNotifications();

  subscribeGlobalRealtime();

  subscribeNotificationRealtime();

}


/* =====================================================
   AUTH UI
===================================================== */

async function updateAuthUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userInfo =
    document.getElementById("userInfo");

  const usernameDisplay =
    document.getElementById("usernameDisplay");

  if(!currentUser){

    loginBtn.style.display = "block";
    registerBtn.style.display = "block";
    logoutBtn.style.display = "none";
    userInfo.style.display = "none";

    return;
  }

  loginBtn.style.display = "none";
  registerBtn.style.display = "none";
  logoutBtn.style.display = "block";
  userInfo.style.display = "block";

  let username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select("username")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(profile?.username){
    username = profile.username;
  }

  usernameDisplay.textContent = username;
}


/* =====================================================
   LOAD CONVERSATIONS
===================================================== */

async function loadConversations(){

  if(!currentUser){
    return;
  }

  const list =
    document.getElementById("chatList");

  const empty =
    document.getElementById("empty");

  list.innerHTML =
    `<div class="loading">
      Loading conversations...
    </div>`;

  empty.style.display = "none";

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    )
    .order(
      "updated_at",
      {ascending:false}
    );

  if(error){

    console.error(
      "Conversation error:",
      error
    );

    list.innerHTML =
      `<div class="loading">
        Could not load conversations.
        <br>
        <small>
          ${escapeHTML(error.message)}
        </small>
      </div>`;

    return;
  }

  list.innerHTML = "";

  if(!data || data.length === 0){

    empty.style.display = "block";

    updateUnreadUI(0);

    return;
  }

  for(const conversation of data){

    const otherId =
      conversation.user_one === currentUser.id
      ? conversation.user_two
      : conversation.user_one;

    await createConversationItem(
      conversation,
      otherId,
      list
    );
  }

  await updateUnreadCount();
}


/* =====================================================
   CREATE CHAT ITEM
===================================================== */

async function createConversationItem(
  conversation,
  otherId,
  list
){

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",otherId)
    .maybeSingle();

  const name =
    profile?.username || "User";

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";

  const {
    data: last
  } =
  await supabaseClient
    .from("messages")
    .select("content,created_at,sender_id")
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(1);

  const {
    count: unreadCount
  } =
  await supabaseClient
    .from("messages")
    .select("id",{count:"exact",head:true})
    .eq(
      "conversation_id",
      conversation.id
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is("read_at",null);

  const unread =
    unreadCount || 0;

  const item =
    document.createElement("div");

  item.className = "chat-item";

  item.dataset.unread =
    String(unread);

  if(unread > 0){
    item.classList.add("has-unread");
  }

  const lastMessage =
    last && last.length
      ? last[0]
      : null;

  const lastText =
    lastMessage
      ? lastMessage.content
      : "Start a conversation";

  const lastTime =
    lastMessage
      ? formatTime(lastMessage.created_at)
      : "";

  item.innerHTML = `

    <img
      class="avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="chat-info">

      <div class="chat-top">

        <span class="chat-name">
          ${escapeHTML(name)}
        </span>

      </div>

      <div class="chat-preview">
        ${escapeHTML(lastText)}
      </div>

    </div>

    <div class="chat-right">

      <div class="chat-time">
        ${escapeHTML(lastTime)}
      </div>

      <span
        class="unread-badge"
        style="${
          unread > 0
          ? "display:flex;"
          : "display:none;"
        }">

        ${
          unread > 99
          ? "99+"
          : unread
        }

      </span>

    </div>
  `;

  item.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      runOnce(() => {

        return openConversation(
          conversation,
          profile || {
            id:otherId,
            username:"User",

/* =====================================================
   UNREAD COUNT
===================================================== */

async function updateUnreadCount(){

  if(!currentUser){
    return;
  }

  const {
    data: conversations,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .or(
      "user_one.eq." +
      currentUser.id +
      ",user_two.eq." +
      currentUser.id
    );

  if(error){
    console.error(error);
    return;
  }

  if(
    !conversations ||
    conversations.length === 0
  ){

    updateUnreadUI(0);
    return;
  }

  const ids =
    conversations.map(
      conversation => conversation.id
    );

  const {
    count,
    error: countError
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .in(
      "conversation_id",
      ids
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );

  if(countError){
    console.error(countError);
    return;
  }

  updateUnreadUI(count || 0);
}


/* =====================================================
   UNREAD UI
===================================================== */

function updateUnreadUI(count){

  const safeCount =
    Number(count) || 0;

  const text =
    safeCount > 99
      ? "99+"
      : String(safeCount);

  const titleBadge =
    document.getElementById("titleUnread");

  const navBadge =
    document.getElementById("messagesNavBadge");

  const notificationBadge =
    document.getElementById("notificationBadge");

  if(safeCount > 0){

    titleBadge.textContent = text;
    titleBadge.style.display = "inline-flex";

    navBadge.textContent = text;
    navBadge.style.display = "inline-flex";

    notificationBadge.textContent = text;
    notificationBadge.style.display = "flex";

  }else{

    titleBadge.style.display = "none";
    navBadge.style.display = "none";
    notificationBadge.style.display = "none";

  }
}

async function loadNotifications(){

  } =

    .from("notifications")
    .select("*")
    .eq(
      "user_id",

/* =====================================================
   RENDER NOTIFICATION
===================================================== */

async function renderNotification(
  notification,
  list
){

  let profile = null;

  if(notification.actor_id){

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url"
      )
      .eq(
        "id",
        notification.actor_id
      )
      .maybeSingle();

    profile = data;
  }

  const item =
    document.createElement("div");

  item.className =
    "notification-item" +
    (
      notification.read_at
        ? ""
        : " unread"
    );

  const avatar =
    profile?.avatar_url ||
    "images/profile.png";

  let text =
    notification.message ||
    "You have a new notification.";

  if(!notification.message){

    if(notification.type === "message"){
      text = "sent you a message.";
    }else{
      text = "You have a new notification.";
    }

  }

  item.innerHTML = `

    <img
      class="notification-avatar"
      src="${escapeHTML(avatar)}"
      alt="Profile">

    <div class="notification-content">

      <div class="notification-text">

        ${
          profile?.username
          ? "<strong>" +
            escapeHTML(profile.username) +
            "</strong> "
          : ""
        }

        ${escapeHTML(text)}

      </div>

      <div class="notification-time">
        ${formatNotificationTime(
          notification.created_at
        )}
      </div>

    </div>
  `;

  item.addEventListener(
    "click",
    async function(){

      await markNotificationRead(
        notification.id
      );

      if(
        notification.type === "message" &&
        notification.conversation_id
      ){

        const {
          data: conversation
        } =
        await supabaseClient
          .from("conversations")
          .select("*")
          .eq(
            "id",
            notification.conversation_id
          )
          .maybeSingle();

        if(conversation){

          const otherId =
            conversation.user_one ===
            currentUser.id
              ? conversation.user_two
              : conversation.user_one;

          const {
            data: otherProfile
          } =
          await supabaseClient
            .from("profiles")
            .select(
              "id,username,avatar_url"
            )
            .eq(
              "id",
              otherId
            )
            .maybeSingle();

          closeNotificationPanel();

          await openConversation(
            conversation,
            otherProfile || {
              id:otherId,
              username:"User",
              avatar_url:"images/profile.png"
            }
          );

        }

      }

    }
  );

  list.appendChild(item);
}

  clearTimeout(searchTimer);

  const input =
    document.getElementById("searchInput");

    document.getElementById("searchResults");

  const query =
    input.value.trim();

  if(!query){

    results.style.display = "none";
    results.innerHTML = "";

  }

  searchTimer =
    setTimeout(
      async () => {

        if(!currentUser){
          return;
        }

        const {
          data,
          error
        } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,avatar_url"
          )
          .ilike(
            "username",
            "%" + query + "%"
          )
          .neq(
            "id",
            currentUser.id
          )
          .limit(10);

        if(error){

          results.innerHTML =
            `<div class="loading">
              Search failed.
            </div>`;

          results.style.display = "block";

          return;
        }

        results.innerHTML = "";

        if(
          !data ||
          data.length === 0
        ){

          results.innerHTML =
            `<div class="loading">
              No users found.
            </div>`;

        }else{

          data.forEach(
            profile => {

              const user =
                document.createElement("div");

              user.className =
                "search-user";

              user.innerHTML = `

                <img
                  src="${
                    escapeHTML(
                      profile.avatar_url ||
                      "images/profile.png"
                    )
                  }"
                  alt="Profile">

                <div class="search-info">

                  <div class="search-name">
                    ${
                      escapeHTML(
                        profile.username ||
                        "User"
                      )
                    }
                  </div>

                  <div class="search-id">
                    Tap to message
                  </div>

                </div>
              `;

              user.addEventListener(
                "click",
                function(event){

                  event.preventDefault();

                  runOnce(() => {

                    return startConversation(
                      profile
                    );

                  });

                }
              );

              results.appendChild(user);

            }
          );

        }

        results.style.display = "block";

      },
      300
    );
}


/* =====================================================
   START CONVERSATION
===================================================== */

async function startConversation(profile){

  if(
    !currentUser ||
    !profile?.id
  ){
    return;
  }

  const otherId =
    profile.id;

  const userOne =
    currentUser.id < otherId
      ? currentUser.id
      : otherId;

  const userTwo =
    currentUser.id < otherId
      ? otherId
      : currentUser.id;

  const {
    data: existing,
    error: findError
  } =
  await supabaseClient
    .from("conversations")
    .select("*")
    .eq("user_one",userOne)
    .eq("user_two",userTwo)
    .maybeSingle();

  if(findError){

    alert(
      "Conversation error: " +
      findError.message
    );

    return;
  }

  let conversation =
    existing;

  if(!conversation){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select()
      .single();

    if(error){

      alert(
        "Could not create conversation: " +
        error.message
      );

      return;
    }

    conversation = data;
  }

  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "searchResults"
  ).style.display = "none";

  await openConversation(
    conversation,
    profile
  );
}

/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(
    !currentUser ||
    !currentConversation
  ){
    return;
  }

  const input =
    document.getElementById(
      "messageInput"
    );

  const sendButton =
    document.getElementById(
      "sendMessageButton"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  if(sendButton.disabled){
    return;
  }

  input.value = "";

  sendButton.disabled = true;

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({

      conversation_id:
        currentConversation.id,

      sender_id:
        currentUser.id,

      content:
        text

    });

  sendButton.disabled = false;

  if(error){

    input.value = text;

    alert(
      "Message failed: " +
      error.message
    );

    return;
  }

  await loadMessages();

  await updateUnreadCount();
}


/* =====================================================
   CHAT REALTIME
===================================================== */

function subscribeRealtime(){

  if(!currentConversation){
    return;
  }

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel = null;
  }

  const conversationId =
    currentConversation.id;

  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        async () => {

          if(
            currentConversation &&
            currentConversation.id ===
            conversationId
          ){

            await loadMessages();

            await markConversationAsRead();

          }

        }
      )
      .subscribe();
}


/* =====================================================
   GLOBAL MESSAGE REALTIME
===================================================== */

function subscribeGlobalRealtime(){

  if(!currentUser){
    return;
  }

  if(unreadChannel){

    supabaseClient
      .removeChannel(
        unreadChannel
      );

    unreadChannel = null;
  }

  unreadChannel =
    supabaseClient
      .channel(
        "global-messages-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload => {

          if(!payload?.new){
            return;
          }

          const message =
            payload.new;

          if(
            message.sender_id ===
            currentUser.id
          ){
            return;
          }

          if(
            currentConversation &&
            message.conversation_id ===
            currentConversation.id
          ){

            await markConversationAsRead();

            await loadMessages();

            return;
          }

          await updateUnreadCount();

          await loadConversations();

        }
      )
      .subscribe();
}

function formatTime(date){

  const value =
    new Date(date);

  if(
    isNaN(value.getTime())
  ){
    return "";
  }

  return value.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function formatNotificationTime(date){

  const value =
    new Date(date);

  if(
    isNaN(value.getTime())
  ){
    return "";
  }

  return value.toLocaleString(
    [],
    {
      month:"short",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}

    "click",
    function(){

      runOnce(() => {
        showUnread();
      });

    }
  );


document
  .getElementById("backButton")
  .addEventListener(
    "click",
    function(){

      runOnce(() => {
        closeChat();
      });

    }
  );


document
  .getElementById("sendMessageButton")
  .addEventListener(
    "click",
    function(){

      runOnce(() => {
        return sendMessage();
      });

    }
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    searchUsers
  );


document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    messageKey
  );


/* =====================================================
   CLOSE NOTIFICATION PANEL
===================================================== */

document.addEventListener(
  "click",
  function(event){

    const panel =
      document.getElementById(
        "notificationPanel"
      );

    const button =
      document.getElementById(
        "notificationButton"
      );

    if(
      panel.classList.contains("show") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ){

      closeNotificationPanel();

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    if(!session){

      currentUser = null;

      window.location.replace(
        "login.html"
      );

      return;
    }

    currentUser =
      session.user;

  }
);


/* =====================================================
   START
===================================================== */

startApp();

</script>
