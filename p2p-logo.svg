<svg xmlns="http://www.w3.org/2000/svg"
     width="86"
     height="86"
     viewBox="0 0 86 86">

  <defs>
    <linearGradient
      id="p2pGradient"
      x1="0"
      y1="0"
      x2="86"
      y2="86"
      gradientUnits="userSpaceOnUse">

      <stop offset="0%" stop-color="#064e46"/>
      <stop offset="100%" stop-color="#10a889"/>

    </linearGradient>
  </defs>


  <!-- =========================
       ICON BACKGROUND
       CSS:
       width:86px
       height:86px
       border-radius:28px
  ========================= -->

  <rect
    x="0"
    y="0"
    width="86"
    height="86"
    rx="28"
    fill="url(#p2pGradient)"/>


  <!-- =========================
       LEFT P
       CSS:
       left:16px
       top:20px
       width:25px
       height:46px
       border:7px solid white
       border-right:0
       border-radius:15px 0 0 15px
  ========================= -->

  <path
    d="
      M31 20
      H41
      V27
      H31

      C26.58 27 23 30.58 23 35

      V51

      C23 55.42 26.58 59 31 59

      H41
      V66
      H31

      C22.72 66 16 59.28 16 51

      V35

      C16 26.72 22.72 20 31 20

      Z
    "
    fill="#ffffff"/>


  <!-- =========================
       RIGHT P
       CSS:
       right:16px
       top:20px
       width:25px
       height:46px
       border:7px solid white
       border-left:0
       border-radius:0 15px 15px 0
  ========================= -->

  <path
    d="
      M55 20
      H45
      V27
      H55

      C59.42 27 63 30.58 63 35

      V51

      C63 55.42 59.42 59 55 59

      H45
      V66
      H55

      C63.28 66 70 59.28 70 51

      V35

      C70 26.72 63.28 20 55 20

      Z
    "
    fill="#ffffff"/>


  <!-- =========================
       CENTER
       CSS:
       width:22px
       height:22px
       background:white
       border-radius:50%
  ========================= -->

  <circle
    cx="43"
    cy="43"
    r="11"
    fill="#ffffff"/>


  <!-- =========================
       CENTER DOT
       CSS:
       width:7px
       height:7px
       background:#087f73
       border-radius:50%
  ========================= -->

  <circle
    cx="43"
    cy="43"
    r="3.5"
    fill="#087f73"/>

</svg>