<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>P2P Order • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f8;
  color:#172033;
  min-height:100vh;
  padding-bottom:90px;
}

button{
  cursor:pointer;
  font-family:Arial,sans-serif;
}

header{
  height:68px;
  background:white;
  border-bottom:1px solid #e2e8ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#064e46,#10a889);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.p-left{
  position:absolute;
  left:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid white;
  border-right:0;
  border-radius:8px 0 0 8px;
}

.p-right{
  position:absolute;
  right:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid white;
  border-left:0;
  border-radius:0 8px 8px 0;
}

.center-dot{
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  position:absolute;
}

.brand-name{
  font-size:19px;
  font-weight:800;
}

.brand-name span{
  color:#087f73;
}

.security{
  color:#087f73;
  font-size:13px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px;
}

.back{
  border:none;
  background:white;
  border:1px solid #dfe7e9;
  color:#087f73;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:15px;
}

.title{
  margin-bottom:15px;
}

.title h1{
  font-size:24px;
}

.title p{
  color:#7b8790;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:white;
  border:1px solid #dfe7e9;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.type{
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.buy{
  background:#e2f5ef;
  color:#087f73;
}

.sell{
  background:#fde8ed;
  color:#d72c50;
}

.status{
  background:#e2f5ef;
  color:#087f73;
  padding:7px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}

.order-number{
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  margin-top:5px;
}

.details{
  margin-top:15px;
  border-top:1px solid #e5ebec;
  padding-top:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  font-size:14px;
}

.row span{
  color:#7b8790;
}

.row strong{
  text-align:right;
}

.fee{
  margin-top:12px;
  background:#f7fbfa;
  border:1px solid #d7ebe7;
  border-radius:13px;
  padding:14px;
}

.fee-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.badge{
  background:#e2f5ef;
  color:#087f73;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.fee-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:13px;
}

.total{
  border-top:1px solid #dce9e7;
  margin-top:5px;
  padding-top:10px;
}

.action{
  width:100%;
  border:none;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
  font-weight:bold;
  font-size:15px;
}

.trade{
  background:linear-gradient(135deg,#064e46,#10a889);
  color:white;
}

.cancel{
  background:white;
  border:1px solid #ead9dc;
  color:#d72c50;
}

.empty{
  text-align:center;
  padding:35px 15px;
  background:white;
  border:1px dashed #ccd8da;
  border-radius:16px;
  color:#7b8790;
}

.loading{
  text-align:center;
  padding:35px;
  color:#7b8790;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:white;
  border-top:1px solid #dfe7e9;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:300;
}

.bottom-nav a{
  color:#7b8790;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  min-width:55px;
}

.bottom-nav a.active{
  color:#087f73;
  font-weight:bold;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.live-nav{
  color:#ef3155 !important;
}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  display:none;
  z-index:1000;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="brand-logo">
      <div class="p-left"></div>
      <div class="p-right"></div>
      <div class="center-dot"></div>
    </div>

    <div class="brand-name">
      P2P <span>Social</span>
    </div>

  </div>

  <div class="security">
    🔒 Secure
  </div>

</header>


<main class="container">

  <button
    class="back"
    onclick="goBack()">
    ← Back to P2P
  </button>


  <div class="title">

    <h1>
      P2P Order
    </h1>

    <p>
      Review your order and manage your P2P trade.
    </p>

  </div>


  <div id="content">

    <div class="loading">
      Loading order...
    </div>

  </div>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    Home
  </a>

  <a
    href="live.html"
    class="live-nav">
    <span class="nav-icon">🔴</span>
    Live
  </a>

  <a
    href="wallet.html"
    class="active">
    <span class="nav-icon">🔄</span>
    P2P
  </a>

  <a href="message.html">
    <span class="nav-icon">💬</span>
    Messages
  </a>

  <a href="profile.html">
    <span class="nav-icon">👤</span>
    Profile
  </a>

</nav>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDWk5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const PLATFORM_FEE_RATE = 0.01;

let currentUser = null;
let order = null;


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  start
);


async function start(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    showError(error.message);

    return;

  }

  if(!data.session){

    window.location.href =
      "login.html";

    return;

  }

  currentUser =
    data.session.user;


  const params =
    new URLSearchParams(
      window.location.search
    );

  const orderId =
    params.get("order");


  if(!orderId){

    showError(
      "No order was selected."
    );

    return;

  }


  await loadOrder(orderId);

}


/* =====================================================
   LOAD ORDER
===================================================== */

async function loadOrder(orderId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("p2p_orders")
    .select("*")
    .eq("id",orderId)
    .maybeSingle();


  if(error){

    console.error(error);

    showError(error.message);

    return;

  }


  if(!data){

    showError(
      "Order not found."
    );

    return;

  }


  order = data;

  renderOrder();

}


/* =====================================================
   RENDER
===================================================== */

function renderOrder(){

  const container =
    document.getElementById(
      "content"
    );


  const type =
    String(
      order.order_type ||
      order.type ||
      ""
    ).toLowerCase();


  const status =
    String(
      order.status ||
      "active"
    ).toLowerCase();


  const amount =
    Number(
      order.amount
    ) || 0;


  const price =
    Number(
      order.price
    ) || 0;


  const pair =
    String(
      order.pair ||
      order.trading_pair ||
      "USDT_ETB"
    );


  let tradeValue;


  if(pair === "USDT_ETB"){

    tradeValue =
      amount * price;

  }else{

    tradeValue =
      amount;

  }


  const fee =
    tradeValue *
    PLATFORM_FEE_RATE;


  const total =
    tradeValue + fee;


  const owner =
    String(order.user_id) ===
    String(currentUser.id);


  const canTrade =
    !owner &&
    [
      "active",
      "open",
      "pending"
    ].includes(status);


  const canCancel =
    owner &&
    [
      "active",
      "open",
      "pending"
    ].includes(status);


  container.innerHTML = `

    <section class="card">

      <div class="order-head">

        <div>

          <span class="type ${
            type === "buy"
              ? "buy"
              : "sell"
          }">

            ${
              type === "buy"
                ? "🟢 BUY"
                : "🔴 SELL"
            }

          </span>

          <div class="order-number">

            Order #${escapeHtml(
              String(
                order.id
              )
            )}

          </div>

        </div>


        <span class="status">

          ${escapeHtml(status)}

        </span>

      </div>


      <div class="details">

        ${row(
          "Trading pair",
          pair === "USDT_ETB"
            ? "USDT / ETB"
            : "ETB / ETB"
        )}

        ${row(
          "Amount",
          amount.toLocaleString(
            undefined,
            {
              maximumFractionDigits:6
            }
          ) +
          (
            pair === "USDT_ETB"
              ? " USDT"
              : " ETB"
          )
        )}

        ${row(
          "Price",
          money(price) +
          " ETB"
        )}

        ${row(
          "Payment method",
          order.payment_method ||
          order.payment ||
          "—"
        )}

        ${row(
          "Trade value",
          money(tradeValue) +
          " ETB"
        )}

      </div>


      <div class="fee">

        <div class="fee-title">

          <strong>
            💸 Platform Fee
          </strong>

          <span class="badge">
            1%
          </span>

        </div>


        ${feeRow(
          "Trade value",
          money(tradeValue) +
          " ETB"
        )}

        ${feeRow(
          "Platform fee",
          money(fee) +
          " ETB"
        )}


        <div class="fee-row total">

          <span>
            Total
          </span>

          <strong>
            ${money(total)} ETB
          </strong>

        </div>

      </div>


      ${
        canTrade
        ?
        `
        <button
          class="action trade"
          onclick="createTrade()">

          🤝 Create Trade

        </button>
        `
        :
        ""
      }


      ${
        canCancel
        ?
        `
        <button
          class="action cancel"
          onclick="cancelOrder()">

          ❌ Cancel Order

        </button>
        `
        :
        ""
      }


      ${
        owner
        ?
        `
        <div style="
          margin-top:12px;
          color:#7b8790;
          font-size:12px;
          text-align:center;">

          This is your order.

        </div>
        `
        :
        ""
      }

    </section>


    <section class="card">

      <strong>
        🔐 P2P Protection
      </strong>

      <p style="
        color:#71808a;
        font-size:13px;
        line-height:1.5;
        margin-top:8px;">

        Trade through P2P Social and follow
        the payment instructions shown during
        the trade. Never share your password
        or security codes.

      </p>

    </section>

  `;

}


/* =====================================================
   CREATE TRADE
===================================================== */

async function createTrade(){

  if(!order){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "create_p2p_trade",
    {
      p_order_id:
        order.id,

      p_amount:
        Number(order.amount)
    }
  );


  if(error){

    console.error(
      "CREATE TRADE:",
      error
    );

    toast(
      error.message
    );

    return;

  }


  toast(
    "✅ Trade created successfully."
  );


  setTimeout(
    function(){

      window.location.href =
        "wallet.html";

    },
    900
  );

}


/* =====================================================
   CANCEL
===================================================== */

async function cancelOrder(){

  if(
    !confirm(
      "Cancel this order?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient.rpc(
    "cancel_p2p_order",
    {
      p_order_id:
        order.id
    }
  );


  if(error){

    toast(
      error.message
    );

    return;

  }


  toast(
    "Order cancelled."
  );


  setTimeout(
    function(){

      window.location.href =
        "wallet.html";

    },
    800
  );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "wallet.html";

}


/* =====================================================
   HELPERS
===================================================== */

function row(label,value){

  return `

    <div class="row">

      <span>
        ${escapeHtml(label)}
      </span>

      <strong>
        ${escapeHtml(value)}
      </strong>

    </div>

  `;

}


function feeRow(label,value){

  return `

    <div class="fee-row">

      <span>
        ${escapeHtml(label)}
      </span>

      <strong>
        ${escapeHtml(value)}
      </strong>

    </div>

  `;

}


function money(value){

  const n =
    Number(value);

  if(!Number.isFinite(n)){

    return "0.00";

  }

  return n.toLocaleString(
    undefined,
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function showError(message){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="empty">

      <div style="
        font-size:35px;
        margin-bottom:10px;">
        ⚠️
      </div>

      <strong>
        Unable to load order
      </strong>

      <div style="
        margin-top:8px;
        font-size:12px;">
        ${escapeHtml(message)}
      </div>

      <button
        class="back"
        style="margin-top:15px;"
        onclick="goBack()">

        ← Back to P2P

      </button>

    </div>

  `;

}


function toast(message){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  setTimeout(
    function(){

      element.classList.remove(
        "show"
      );

    },
    3000
  );

}

</script>

</body>
</html>
