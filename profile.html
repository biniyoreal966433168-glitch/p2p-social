<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile - P2P Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 30px;
    }

    header {
      background: linear-gradient(135deg, #075e54, #087f73);
      color: white;
      padding: 18px;
      border-radius: 0 0 22px 22px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 22px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .profile-card {
      background: white;
      margin: 20px 16px;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #dfeeea;
      color: #087f73;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 35px;
      font-weight: bold;
    }

    .username {
      font-size: 22px;
      font-weight: bold;
    }

    .email {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    .form {
      margin-top: 25px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      outline: none;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #087f73;
    }

    .save-btn {
      width: 100%;
      margin-top: 20px;
      border: none;
      background: #087f73;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>

  <div class="top">

    <button
      class="back"
      onclick="goBack()">
      ←
    </button>

    <div class="title">
      My Profile
    </div>

  </div>

</header>


<div class="profile-card">

  <div
    class="avatar"
    id="avatar">
    U
  </div>

  <div
    class="username"
    id="displayUsername">
    User
  </div>

  <div
    class="email"
    id="displayEmail">
    Loading...
  </div>


  <div class="form">

    <label>
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="Enter username">


    <label>
      Bio
    </label>

    <textarea
      id="bio"
      placeholder="Tell people about yourself"></textarea>


    <button
      class="save-btn"
      onclick="saveProfile()">
      Save Profile
    </button>

    <div
      class="message"
      id="message">
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDWk5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;


// ===============================
// LOAD PROFILE
// ===============================

async function loadProfile() {

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if (error || !data.session) {

    alert("Please login first.");

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    data.session.user;


  document.getElementById(
    "displayEmail"
  ).textContent =
    currentUser.email || "";


  const {
    data: profile,
    error: profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("username,bio")
    .eq("id", currentUser.id)
    .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

    return;

  }


  if (profile) {

    document.getElementById(
      "username"
    ).value =
      profile.username || "";

    document.getElementById(
      "bio"
    ).value =
      profile.bio || "";


    updateDisplay(
      profile.username ||
      "User"
    );

  } else {

    updateDisplay(
      currentUser.user_metadata?.username ||
      "User"
    );

  }

}


// ===============================
// UPDATE DISPLAY
// ===============================

function updateDisplay(username) {

  document.getElementById(
    "displayUsername"
  ).textContent =
    username;


  document.getElementById(
    "avatar"
  ).textContent =
    username
      .charAt(0)
      .toUpperCase();

}


// ===============================
// SAVE PROFILE
// ===============================

async function saveProfile() {

  if (!currentUser) {

    return;

  }


  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const bio =
    document
      .getElementById("bio")
      .value
      .trim();


  if (!username) {

    showMessage(
      "Please enter a username.",
      true
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .upsert({

      id: currentUser.id,

      username: username,

      bio: bio

    });


  if (error) {

    console.error(
      error
    );

    showMessage(
      "Could not save profile: " +
      error.message,
      true
    );

    return;

  }


  updateDisplay(
    username
  );


  showMessage(
    "Profile saved successfully."
  );

}


// ===============================
// MESSAGE
// ===============================

function showMessage(
  text,
  error = false
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;

  message.style.color =
    error
      ? "#e74c3c"
      : "#087f73";

}


// ===============================
// BACK
// ===============================

function goBack() {

  window.location.href =
    "index.html";

}


// ===============================
// START
// ===============================

loadProfile();

</script>

</body>
</html>
