<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - P2P Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 25px 25px;
}

.header-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

/* PROFILE */

.profile-card{
  background:white;
  margin:18px;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.profile-photo-wrap{
  position:relative;
  width:100px;
  height:100px;
  margin:auto;
}

.profile-photo,
.profile-initial{
  width:100px;
  height:100px;
  border-radius:50%;
}

.profile-photo{
  object-fit:cover;
}

.profile-initial{
  background:#dfeeea;
  color:#087f73;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.camera-btn{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  cursor:pointer;
  font-size:17px;
}

.profile-name{
  margin-top:12px;
  font-size:21px;
  font-weight:bold;
}

.profile-handle{
  color:#7b8492;
  margin-top:4px;
  font-size:13px;
}

.profile-bio{
  margin-top:10px;
  color:#4c5668;
  font-size:14px;
  line-height:1.5;
}

.profile-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.profile-buttons button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.edit-btn{
  background:#087f73;
  color:white;
}

.settings-btn{
  background:#eef3f2;
  color:#087f73;
}

/* STATS */

.stats{
  display:flex;
  justify-content:space-around;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #edf0f4;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:#7b8492;
  font-size:12px;
}

/* WALLET */

.wallet{
  margin:18px;
  background:linear-gradient(135deg,#172033,#29364f);
  color:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.wallet-title{
  font-size:13px;
  opacity:.8;
}

.wallet-balance{
  font-size:28px;
  font-weight:bold;
  margin:8px 0;
}

.wallet-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:14px;
}

.wallet-btn{
  width:100%;
  border:none;
  background:white;
  color:#172033;
  padding:11px;
  border-radius:10px;
  margin-top:17px;
  font-weight:bold;
  cursor:pointer;
}

/* MENU */

.menu-section{
  margin:18px;
}

.menu-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.menu{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.menu-item{
  width:100%;
  border:none;
  background:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  font-size:14px;
  cursor:pointer;
  border-bottom:1px solid #edf0f4;
}

.menu-item:last-child{
  border-bottom:none;
}

.menu-icon{
  font-size:21px;
  width:28px;
}

.menu-arrow{
  margin-left:auto;
  color:#8b94a3;
}

/* CREATE POST */

.create-section{
  margin:18px;
}

.create-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.create-card{
  background:white;
  padding:16px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-input{
  width:100%;
  min-height:100px;
  resize:vertical;
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:14px;
}

.post-options{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.visibility{
  flex:1;
  border:1px solid #dfe4eb;
  background:white;
  border-radius:10px;
  padding:10px;
  cursor:pointer;
}

.create-post-btn{
  width:100%;
  margin-top:10px;
  border:none;
  background:#087f73;
  color:white;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */

.posts-section{
  margin:18px;
}

.posts-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.posts-feed{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.post-card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.post-user{
  flex:1;
}

.post-name{
  font-weight:bold;
  font-size:14px;
}

.post-handle{
  color:#7b8492;
  font-size:12px;
  margin-top:3px;
}

.post-time{
  color:#8a93a1;
  font-size:11px;
}

.post-visibility{
  font-size:11px;
  color:#087f73;
  margin-top:3px;
}

.post-content{
  margin-top:13px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:16px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
}

.post-action{
  border:none;
  background:transparent;
  color:#687386;
  cursor:pointer;
  font-size:13px;
}

.post-action.liked{
  color:#e74c3c;
  font-weight:bold;
}

.delete-post{
  margin-left:auto;
  color:#e74c3c;
}

/* COMMENTS */

.comments-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.comment-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  color:#087f73;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  flex-shrink:0;
}

.comment-body{
  background:#f5f7fb;
  border-radius:12px;
  padding:8px 10px;
  flex:1;
  position:relative;
}

.comment-name{
  font-weight:bold;
  font-size:12px;
}

.comment-text{
  font-size:13px;
  margin-top:3px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

.delete-comment{
  position:absolute;
  right:8px;
  top:7px;
  border:none;
  background:none;
  color:#e74c3c;
  cursor:pointer;
  font-size:11px;
}

.comment-input-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:9px;
  outline:none;
}

.comment-send{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:0 13px;
  cursor:pointer;
  font-weight:bold;
}

.no-posts{
  background:white;
  padding:25px;
  border-radius:16px;
  text-align:center;
  color:#7b8492;
}

/* EDIT MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:20px;
}

.modal-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:15px;
}

.modal-input,
.modal-textarea{
  width:100%;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
  outline:none;
}

.modal-textarea{
  min-height:90px;
  resize:vertical;
}

.modal-buttons{
  display:flex;
  gap:10px;
}

.modal-buttons button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.cancel-btn{
  background:#edf0f4;
}

.save-btn{
  background:#087f73;
  color:white;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}
</style>
</head>

<body>

<header>
  <div class="header-top">

    <button class="back-btn" onclick="goHome()">‹</button>

    <div class="header-title">
      My Profile
    </div>

  </div>
</header>


<!-- PROFILE -->

<div class="profile-card">

    </div>

    <button
      class="camera-btn"

<div class="posts-section">

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession = null;
let currentProfile = null;


/* =========================
   START
========================= */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    return;

  }

  currentSession =
    data.session;

  if(!currentSession){

    alert("Please login first.");

    window.location.href =
      "login.html";

    return;

  }

  await loadProfile();

  await loadMyPosts();

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  const user =
    currentSession.user;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url,bio,balance"
    )
    .eq(
      "id",
      user.id
    )
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

    return;

  }

  currentProfile =
    data || {};

  const username =
    currentProfile.username ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";

  const bio =
    currentProfile.bio ||
    "No bio yet.";

  document.getElementById(
    "profileName"
  ).textContent =
    username;

  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;

  document.getElementById(
    "profileBio"
  ).textContent =
    bio;

  updateProfilePhoto(
    currentProfile.avatar_url,
    username
  );

  const balance =
    Number(currentProfile.balance) || 0;

  document.getElementById(
    "balanceDisplay"
  ).textContent =
    balance.toLocaleString() +
    " ETB";

  document.getElementById(
    "etbDisplay"
  ).textContent =
    balance.toLocaleString(
      undefined,
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* =========================
   PROFILE PHOTO
========================= */

function updateProfilePhoto(
  avatarUrl,
  username
){

  const area =
    document.getElementById(
      "profilePhotoArea"
    );

  if(avatarUrl){

    area.outerHTML = `
      <img
        id="profilePhotoArea"
        class="profile-photo"
        src="${escapeHtml(avatarUrl)}"
        alt="Profile photo">
    `;

  }else{

    const initial =
      (username || "U")
        .charAt(0)
        .toUpperCase();

    area.outerHTML = `
      <div
        id="profilePhotoArea"
        class="profile-initial">
        ${escapeHtml(initial)}
      </div>
    `;

  }

}


function changePhoto(){

  document
    .getElementById("photoInput")
    .click();

}


async function uploadProfilePhoto(event){

  if(!currentSession){

    return;

  }

  const file =
    event.target.files[0];

  if(!file){

    return;

  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Photo must be smaller than 5MB."
    );

    return;

  }

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filePath =
    currentSession.user.id +
    "/" +
    Date.now() +
    "." +
    extension;


  const {
    error: uploadError
  } =
  await supabaseClient.storage
    .from("avatars")
    .upload(
      filePath,
      file,
      {
        upsert:true
      }
    );


  if(uploadError){

    console.error(
      uploadError
    );

    alert(
      "Photo upload failed: " +
      uploadError.message
    );

    return;

  }


  const {
    data
  } =
  supabaseClient.storage
    .from("avatars")
    .getPublicUrl(
      filePath
    );


  const avatarUrl =
    data.publicUrl;


  const {
    error: updateError
  } =
  await supabaseClient
    .from("profiles")
    .update({
      avatar_url:
        avatarUrl
    })
    .eq(
      "id",
      currentSession.user.id
    );


  if(updateError){

    console.error(
      updateError
    );

    alert(
      "Could not save profile photo: " +
      updateError.message
    );

    return;

  }


  currentProfile.avatar_url =
    avatarUrl;

  updateProfilePhoto(
    avatarUrl,
    currentProfile.username || "User"
  );

  alert(
    "Profile photo updated."
  );

}


/* =========================
   EDIT PROFILE
========================= */

function openEditProfile(){

  document.getElementById(
    "editUsername"
  ).value =
    currentProfile?.username || "";

  document.getElementById(
    "editBio"
  ).value =
    currentProfile?.bio || "";

  document.getElementById(
    "editModal"
  ).style.display =
    "flex";

}


function closeEditProfile(){

  document.getElementById(
    "editModal"
  ).style.display =
    "none";

}


async function saveProfile(){

  const username =
    document
      .getElementById("editUsername")
      .value
      .trim();

  const bio =
    document
      .getElementById("editBio")
      .value
      .trim();


  if(!username){

    alert(
      "Username is required."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({

      username:
        username,

      bio:
        bio

    })
    .eq(
      "id",
      currentSession.user.id
    );


  if(error){

    console.error(error);

    alert(
      "Could not update profile: " +
      error.message
    );

    return;

  }


  currentProfile.username =
    username;

  currentProfile.bio =
    bio;

  document.getElementById(
    "profileName"
  ).textContent =
    username;

  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;

  document.getElementById(
    "profileBio"
  ).textContent =
    bio || "No bio yet.";

  closeEditProfile();

}


/* =========================
   SETTINGS
========================= */

function openSettings(){

  window.location.href =
    "settings.html";

}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  if(!currentSession){

    alert(
      "Please login first."
    );

    return;

  }


  const input =
    document.getElementById(
      "postInput"
    );

  const content =
    input.value.trim();

  const visibility =
    document.getElementById(
      "visibility"
    ).value;


  if(!content){

    alert(
      "Write something first."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentSession.user.id,

      content:
        content,

      visibility:
        visibility

    });


  if(error){

    console.error(error);

    alert(
      "Could not create post: " +
      error.message
    );

    return;

  }


  input.value = "";

  await loadMyPosts();

}


/* =========================
   LOAD MY POSTS
========================= */

async function loadMyPosts(){

  const feed =
    document.getElementById(
      "postsFeed"
    );


  feed.innerHTML = `
    <div class="no-posts">
      Loading posts...
    </div>
  `;


  const {
    data: posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      visibility,
      created_at
    `)
    .eq(
      "user_id",
      currentSession.user.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    feed.innerHTML = `
      <div class="no-posts">
        Could not load posts.
      </div>
    `;

    return;

  }


  if(!posts || posts.length === 0){

    document.getElementById(
      "postCount"
    ).textContent =
      "0";

    feed.innerHTML = `
      <div class="no-posts">
        You haven't created any posts yet.
      </div>
    `;

    return;

  }


  document.getElementById(
    "postCount"
  ).textContent =
    posts.length;


  const postIds =
    posts.map(
      post => post.id
    );


  /* LIKES */

  let likes = [];

  if(postIds.length){

    const result =
      await supabaseClient
        .from("post_likes")
        .select(
          "post_id,user_id"
        )
        .in(
          "post_id",
          postIds
        );

    if(!result.error){

      likes =
        result.data || [];

    }

  }


  /* COMMENTS */

  let comments = [];

  if(postIds.length){

    const result =
      await supabaseClient
        .from("post_comments")
        .select(
          "id,post_id,user_id,comment,created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );

    if(!result.error){

      comments =
        result.data || [];

    }

  }


  /* USER IDS */

  const userIds =
    [
      ...new Set(
        [
          ...posts.map(
            p => p.user_id
          ),

          ...comments.map(
            c => c.user_id
          )
        ]
      )
    ];


  let profiles = [];

  if(userIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          userIds
        );

    if(!result.error){

      profiles =
        result.data || [];

    }

  }


  const profileMap = {};

  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] =
        profile;

    }
  );


  const likeCounts = {};
  const commentCounts = {};

  likes.forEach(
    like => {

      likeCounts[
        like.post_id
      ] =
      (likeCounts[
        like.post_id
      ] || 0) + 1;

    }
  );


  comments.forEach(
    comment => {

      commentCounts[
        comment.post_id
      ] =
      (commentCounts[
        comment.post_id
      ] || 0) + 1;

    }
  );


  let totalLikes = 0;
  let totalComments = comments.length;

  likes.forEach(
    () => {
      totalLikes++;
    }
  );


  document.getElementById(
    "likeCount"
  ).textContent =
    totalLikes;

  document.getElementById(
    "commentCount"
  ).textContent =
    totalComments;


  feed.innerHTML = "";


  for(const post of posts){

    const profile =
      profileMap[
        post.user_id
      ] || {};

    const username =
      profile.username ||
      "User";

    const avatar =
      profile.avatar_url ||
      "";

    const initial =
      username
        .charAt(0)
        .toUpperCase();


    const myLiked =
      likes.some(
        like =>
          String(like.post_id) ===
          String(post.id) &&
          like.user_id ===
          currentSession.user.id
      );


    const card =
      document.createElement(
        "article"
      );

    card.className =
      "post-card";


    card.innerHTML = `

      <div class="post-header">

        ${
          avatar
          ?
          `<img
            class="post-avatar"
            src="${escapeHtml(avatar)}"
            alt="Profile">`
          :
          `<div class="post-avatar">
            ${escapeHtml(initial)}
          </div>`
        }

        <div class="post-user">

          <div class="post-name">
            ${escapeHtml(username)}
          </div>

          <div class="post-handle">
            @${escapeHtml(username)}
          </div>

          <div class="post-visibility">
            ${
              post.visibility === "private"
              ? "🔒 Private"
              : "🌍 Public"
            }
          </div>

        </div>

        <div class="post-time">
          ${formatPostTime(post.created_at)}
        </div>

      </div>


      <div class="post-content">
        ${escapeHtml(post.content || "")}
      </div>


      <div class="post-actions">

        <button
          class="post-action ${myLiked ? "liked" : ""}"
          onclick="likePost('${escapeJs(post.id)}')">

          ${myLiked ? "♥ Unlike" : "♡ Like"}

          <span>
            ${likeCounts[post.id] || 0}
          </span>

        </button>


        <button
          class="post-action"
          onclick="focusComment('${escapeJs(post.id)}')">

          💬 Comments

          <span>
            ${commentCounts[post.id] || 0}
          </span>

        </button>


        <button
          class="post-action"
          onclick="sharePost('${escapeJs(post.id)}')">

          ↗ Share

        </button>


        <button
          class="post-action delete-post"
          onclick="deletePost('${escapeJs(post.id)}')">

          🗑 Delete

        </button>

      </div>


      <div
        id="comments-${escapeHtml(post.id)}"
        class="comments-box">

        ${renderComments(
          post.id,
          comments,
          profileMap
        )}

        <div class="comment-input-row">

          <input
            id="comment-input-${escapeHtml(post.id)}"
            class="comment-input"
            maxlength="500"
            placeholder="Write a comment..."
            onkeydown="
              if(event.key==='Enter'){
                sendComment('${escapeJs(post.id)}')
              }
            ">

          <button
            class="comment-send"
            onclick="
              sendComment('${escapeJs(post.id)}')
            ">
            Send
          </button>

        </div>

      </div>

    `;


    feed.appendChild(card);

  }

}


/* =========================
   RENDER COMMENTS
========================= */

function renderComments(
  postId,
  comments,
  profileMap
){

  const postComments =
    comments.filter(
      comment =>
        String(comment.post_id) ===
        String(postId)
    );


  if(!postComments.length){

    return `
      <div style="
        color:#8a93a1;
        font-size:12px;
        margin-bottom:8px;">
        No comments yet.
      </div>
    `;

  }


  let html = "";


  postComments.forEach(
    comment => {

      const profile =
        profileMap[
          comment.user_id
        ] || {};

      const username =
        profile.username ||
        "User";

      const avatar =
        profile.avatar_url ||
        "";

      const initial =
        username
          .charAt(0)
          .toUpperCase();


      const isOwner =
        currentSession &&
        comment.user_id ===
        currentSession.user.id;


      html += `

        <div class="comment">

          ${
            avatar
            ?
            `<img
              class="comment-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="comment-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="comment-body">

            <div class="comment-name">
              ${escapeHtml(username)}
            </div>

            <div class="comment-text">
              ${escapeHtml(comment.comment || "")}
            </div>

            ${
              isOwner
              ?
              `<button
                class="delete-comment"
                onclick="
                  deleteComment(
                    '${escapeJs(comment.id)}'
                  )
                ">
                Delete
              </button>`
              :
              ""
            }

          </div>

        </div>

      `;

    }
  );


  return html;

}


/* =========================
   LIKE
========================= */

async function likePost(postId){

  if(!currentSession){

    alert(
      "Please login first."
    );

    return;

  }


  const {
    data: existing,
    error: checkError
  } =
  await supabaseClient
    .from("post_likes")
    .select("post_id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentSession.user.id
    )
    .maybeSingle();


  if(checkError){

    alert(
      "Could not check like: " +
      checkError.message
    );

    return;

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentSession.user.id
      );


    if(error){

      alert(
        "Could not unlike: " +
        error.message
      );

      return;

    }

  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          currentSession.user.id

      });


    if(error){

      alert(
        "Could not like: " +
        error.message
      );

      return;

    }

  }


  await loadMyPosts();

}


/* =========================
   COMMENT
========================= */

function focusComment(postId){

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  if(input){

    input.focus();

  }

}


async function sendComment(postId){

  if(!currentSession){

    alert(
      "Please login first."
    );

    return;

  }


  const input =
    document.getElementById(
      "comment-input-" + postId
    );


  if(!input){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(text.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentSession.user.id,

      comment:
        text

    });


  if(error){

    console.error(
      "Comment error:",
      error
    );

    alert(
      "Comment failed: " +
      error.message
    );

    return;

  }


  await loadMyPosts();

}


/* =========================

    .delete()
    .eq(

    );

    );

  }

}


/* =========================

========================= */

async function deletePost(postId){

  if(!currentSession){

    return;

  }


  const confirmed =
    confirm(
      "Delete this post? This cannot be undone."
    );


  if(!confirmed){

    return;

  const {

  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentSession.user.id
    );


  if(error){

    alert(
      "Could not delete post: " +
      error.message
    );

  }

}


/* =========================
   SHARE
========================= */

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    encodeURIComponent(postId);


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Post",

        text:
          "Check out this post.",

        url:
          url

      });

    }catch(error){

      console.log(error);

    }

    return;

  }


  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    alert(
      url
    );

  }

}

/* =========================
   TIME
========================= */

function formatPostTime(dateString){

  const date =
    new Date(dateString);

  if(isNaN(date.getTime())){

    return "";

  }

  const now =
    new Date();

  const seconds =
    Math.floor(
      (now - date) / 1000
    );


  if(seconds < 60){

    return "now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes + "m";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d";

  }


  return date.toLocaleDateString();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
    ? ""
    : String(text);

  return div.innerHTML;

}


/* =========================
   ESCAPE JS
========================= */

function escapeJs(text){

  return String(
    text || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
