<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0e11;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 80px;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.header h1 {
    font-size: 22px;
}

.logout-btn {
    background: #f6465d;
    border: none;
    color: #fff;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================
   PROFILE CARD
========================= */

.profile-card {
    background: #15191e;
    border: 1px solid #252a31;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.profile-top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar-wrapper {
    position: relative;
    width: 90px;
    height: 90px;
    flex-shrink: 0;
}

.avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    background: #252a31;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
}

.avatar-upload {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #f0b90b;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
}

.avatar-upload input {
    display: none;
}

.profile-info {
    min-width: 0;
}

.username-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.username {
    font-size: 22px;
    font-weight: bold;
    word-break: break-word;
}

.badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
}

.badge-free {
    background: #30353b;
    color: #aaa;
}

.badge-premium {
    background: #3d2e00;
    color: #f0b90b;
}

.badge-plus {
    background: #15395c;
    color: #45a9ff;
}

.badge-max {
    background: #401c52;
    color: #d875ff;
}

.user-number {
    color: #9299a3;
    margin-top: 5px;
    font-size: 14px;
}

.bio {
    color: #c8ccd1;
    margin-top: 10px;
    line-height: 1.5;
    word-break: break-word;
}

/* =========================
   BALANCES
========================= */

.balance-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.balance-card {
    background: #0f1317;
    border: 1px solid #252a31;
    border-radius: 10px;
    padding: 14px;
}

.balance-title {
    color: #9299a3;
    font-size: 13px;
}

.balance-value {
    margin-top: 7px;
    font-size: 20px;
    font-weight: bold;
}

.usdt {
    color: #26a17b;
}

.diamond {
    color: #62b8ff;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 15px;
    background: #0f1317;
    border-radius: 10px;
    overflow: hidden;
}

.stat {
    text-align: center;
    padding: 14px 5px;
    border-right: 1px solid #252a31;
}

.stat:last-child {
    border-right: none;
}

.stat-value {
    font-size: 18px;
    font-weight: bold;
}

.stat-label {
    color: #9299a3;
    font-size: 11px;
    margin-top: 4px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: bold;
}

.btn-primary {
    background: #f0b90b;
    color: #000;
}

.btn-secondary {
    background: #252a31;
    color: #fff;
}

.btn-danger {
    background: #f6465d;
    color: #fff;
}

/* =========================
   SECTIONS
========================= */

.section {
    background: #15191e;
    border: 1px solid #252a31;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
}

.section-title {
    font-size: 18px;
    margin-bottom: 15px;
}

/* =========================
   EDIT PROFILE
========================= */

.edit-form {
    display: none;
}

.edit-form.active {
    display: block;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    color: #9299a3;
    margin-bottom: 6px;
    font-size: 13px;
}

.form-group input,
.form-group textarea,
.admin-select,
.admin-input {
    width: 100%;
    background: #0f1317;
    color: #fff;
    border: 1px solid #30353b;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.admin-input:focus {
    border-color: #f0b90b;
}

/* =========================
   POSTS
========================= */

.post-create textarea {
    width: 100%;
    min-height: 90px;
    background: #0f1317;
    color: #fff;
    border: 1px solid #30353b;
    border-radius: 10px;
    padding: 12px;
    resize: vertical;
    outline: none;
}

.post-create textarea:focus {
    border-color: #f0b90b;
}

.post {
    border-top: 1px solid #252a31;
    padding-top: 15px;
    margin-top: 15px;
}

.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.post-user {
    display: flex;
    align-items: center;
    gap: 9px;
}

.post-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: #252a31;
}

.post-username {
    font-weight: bold;
}

.post-time {
    color: #777f89;
    font-size: 11px;
    margin-top: 3px;
}

.post-content {
    margin-top: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.post-actions {
    display: flex;
    gap: 7px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.post-btn {
    background: #20252b;
    color: #ccc;
    border: none;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 13px;
}

.post-btn.liked {
    color: #f6465d;
}

.comments {
    margin-top: 10px;
}

.comment {
    background: #0f1317;
    padding: 8px 10px;
    border-radius: 8px;
    margin-top: 7px;
}

.comment-user {
    font-weight: bold;
    font-size: 13px;
}

.comment-text {
    color: #ccc;
    margin-top: 3px;
    font-size: 13px;
    word-break: break-word;
}

.comment-row {
    display: flex;
    gap: 7px;
    margin-top: 9px;
}

.comment-input {
    flex: 1;
    min-width: 0;
    background: #0f1317;
    color: #fff;
    border: 1px solid #30353b;
    border-radius: 7px;
    padding: 8px;
}

/* =========================
   ADMIN
========================= */

.admin-panel {
    display: none;
}

.admin-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.admin-row > * {
    flex: 1;
}

.admin-message {
    margin-top: 10px;
    font-size: 13px;
}

/* =========================
   LOADING / EMPTY
========================= */

.loading {
    text-align: center;
    padding: 25px;
    color: #9299a3;
}

.empty {
    text-align: center;
    color: #777f89;
    padding: 20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: #111418;
    border-top: 1px solid #252a31;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 1000;
}

.nav-item {
    border: none;
    background: transparent;
    color: #777f89;
    font-size: 11px;
}

.nav-item span {
    display: block;
    font-size: 21px;
    margin-bottom: 3px;
}

.nav-item.active {
    color: #f0b90b;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .profile-card,
    .section {
        border-radius: 12px;
        padding: 15px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat {
        border-bottom: 1px solid #252a31;
    }

    .stat:nth-child(2) {
        border-right: none;
    }

    .stat:nth-child(3),
    .stat:nth-child(4) {
        border-bottom: none;
    }

    .balance-grid {
        grid-template-columns: 1fr;
    }

    .admin-row {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>My Profile</h1>

        <button

    </div>


    <!-- PROFILE -->

                    ?
                </div>

                <div

                    class="bio">

                </div>

        </div>


        <!-- BALANCES -->

        <div class="balance-grid">

            <div class="stat">

                    id="followerCount"

                    0

            <div class="stat">

            </div>

        <!-- ACTIONS -->

        <div class="actions">

            </button>

    <!-- EDIT PROFILE -->

    <div

        Profile

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentSession = null;
let currentUser = null;
let currentProfile = null;

let profileMap = {};
let likedPosts = new Set();


/* =====================================================
   START APP
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    startApp
);


async function startApp() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        currentSession = data.session;

        if (!currentSession) {

            location.replace("login.html");

            return;
        }

        currentUser =
            currentSession.user;

        await loadProfile();

        await loadStats();

        await loadPosts();

        if (
            currentProfile &&
            (
                currentProfile.role === "owner" ||
                currentProfile.role === "admin"
            )
        ) {

            document
                .getElementById("adminPanel")
                .style.display = "block";

            await loadAdminUsers();

        }

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load profile: " +
            (error.message || "Unknown error")
        );

    }

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (error) {

        console.error(
            "Profile error:",
            error
        );

        throw error;

    }


    if (!data) {

        throw new Error(
            "Profile not found."
        );

    }


    currentProfile = data;


    renderProfile();

}


/* =====================================================
   RENDER PROFILE
===================================================== */

function renderProfile() {

    const username =
        currentProfile.username ||
        currentUser.email?.split("@")[0] ||
        "User";


    document
        .getElementById("username")
        .textContent = username;


    document
        .getElementById("bio")
        .textContent =
        currentProfile.bio ||
        "No bio yet.";


    document
        .getElementById("editUsername")
        .value = username;


    document
        .getElementById("editBio")
        .value =
        currentProfile.bio || "";


    const userNumber =
        currentProfile.user_number;


    document
        .getElementById("userNumber")
        .textContent =
        userNumber
            ? "User #" + userNumber
            : "User ID: " +
              currentUser.id.substring(0, 8);


    /* BALANCES */

    const usdt =
        Number(
            currentProfile.usdt_balance || 0
        );


    const diamonds =
        Number(
            currentProfile.diamond_balance || 0
        );


    document
        .getElementById("usdtBalance")
        .textContent =
        usdt.toFixed(2) +
        " USDT";


    document
        .getElementById("diamondBalance")
        .textContent =
        diamonds.toLocaleString() +
        " 💎";


    /* PREMIUM */

    renderPremium(
        currentProfile.premium_plan
    );


    /* LOCK */

    const locked =
        Boolean(
            currentProfile.profile_locked
        );


    document
        .getElementById("lockButton")
        .textContent =
        locked
            ? "Unlock Profile"
            : "Lock Profile";


    /* AVATAR */

    renderAvatar(
        currentProfile.avatar_url,
        username
    );

}


/* =====================================================
   PREMIUM
===================================================== */

function renderPremium(plan) {

    const badge =
        document.getElementById(
            "premiumBadge"
        );


    const normalized =
        String(
            plan || "free"
        )
        .toLowerCase()
        .replace(/\s+/g, "_");


    badge.className =
        "badge";


    if (
        normalized ===
        "premium_max"
    ) {

        badge.classList.add(
            "badge-max"
        );

        badge.textContent =
            "PREMIUM MAX";

    }

    else if (
        normalized ===
        "premium_plus"
    ) {

        badge.classList.add(
            "badge-plus"
        );

        badge.textContent =
            "PREMIUM PLUS";

    }

    else if (
        normalized ===
        "premium"
    ) {

        badge.classList.add(
            "badge-premium"
        );

        badge.textContent =
            "PREMIUM";

    }

    else {

        badge.classList.add(
            "badge-free"
        );

        badge.textContent =
            "FREE";

    }

}


/* =====================================================
   AVATAR
===================================================== */

function renderAvatar(url, username) {

    const container =
        document.getElementById(
            "avatarContainer"
        );


    container.innerHTML = "";


    if (url) {

        const img =
            document.createElement("img");

        img.className = "avatar";

        img.src = url;

        img.alt = "Profile photo";

        img.onerror = function() {

            renderAvatar(
                null,
                username
            );

        };

        container.appendChild(img);

    }

    else {

        const div =
            document.createElement("div");

        div.className = "avatar";

        div.textContent =
            getInitial(username);

        container.appendChild(div);

    }

}


function getInitial(name) {

    if (!name) {
        return "?";
    }

    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =====================================================
   AVATAR UPLOAD
===================================================== */

async function uploadAvatar(input) {

    const file =
        input.files?.[0];


    if (!file) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        alert(
            "Please select an image."
        );

        input.value = "";

        return;
    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        alert(
            "Image must be smaller than 5 MB."
        );

        input.value = "";

        return;
    }


    try {

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const path =
            currentUser.id +
            "/profile." +
            extension;


        const {
            error: uploadError
        } =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(
                path,
                file,
                {
                    upsert: true,
                    contentType: file.type
                }
            );


        if (uploadError) {
            throw uploadError;
        }


        const {
            data: publicData
        } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(path);


        const avatarUrl =
            publicData.publicUrl +
            "?t=" +
            Date.now();


        const {
            error: updateError
        } =
        await supabaseClient
            .from("profiles")
            .update({
                avatar_url: avatarUrl
            })
            .eq(
                "id",
                currentUser.id
            );


        if (updateError) {
            throw updateError;
        }


        currentProfile.avatar_url =
            avatarUrl;


        renderAvatar(
            avatarUrl,
            currentProfile.username
        );

/* =====================================================
   LOAD STATS
===================================================== */

async function loadStats() {

    try {

        /* POSTS */

        const postsResult =
            await supabaseClient
                .from("posts")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


        if (!postsResult.error) {

            document
                .getElementById("postCount")
                .textContent =
                postsResult.count || 0;

        }


        /* LIKES */

        const userPosts =
            await supabaseClient
                .from("posts")
                .select("id")
                .eq(
                    "user_id",
                    currentUser.id
                );


        if (
            !userPosts.error &&
            userPosts.data?.length
        ) {

            const ids =
                userPosts.data.map(
                    p => p.id
                );


            const likes =
                await supabaseClient
                    .from("post_likes")
                    .select(
                        "id",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .in(
                        "post_id",
                        ids
                    );


            if (!likes.error) {

                document
                    .getElementById("likeCount")
                    .textContent =
                    likes.count || 0;

            }

        }


        /* FOLLOWERS */

        const followers =
            await supabaseClient
                .from("followers")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "following_id",
                    currentUser.id
                );


        if (!followers.error) {

            document
                .getElementById("followerCount")
                .textContent =
                followers.count || 0;

        }


        /* FOLLOWING */

        const following =
            await supabaseClient
                .from("followers")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "follower_id",
                    currentUser.id
                );


        if (!following.error) {

            document
                .getElementById("followingCount")
                .textContent =
                following.count || 0;

        }

    }

    catch (error) {

        console.error(
            "Stats error:",
            error
        );

    }

}

async function createPost() {

    const textarea =

    if (!content) {

            });

/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts() {

    const container =
        document.getElementById(
            "postsContainer"
        );


    container.innerHTML =
        '<div class="loading">Loading posts...</div>';


    try {

        const {
            data: posts,
            error
        } =
        await supabaseClient
            .from("posts")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {
            throw error;
        }


        if (!posts?.length) {

            container.innerHTML =
                '<div class="empty">No posts yet.</div>';

            return;
        }


        await loadProfileMap(
            posts
        );


        await loadLikedPosts(
            posts
        );


        const postIds =
            posts.map(
                post => post.id
            );


        const {
            data: comments
        } =
        await supabaseClient
            .from("post_comments")
            .select("*")
            .in(
                "post_id",
                postIds
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        const commentList =
            comments || [];


        await loadCommentProfiles(
            commentList
        );


        container.innerHTML =
            posts
                .map(
                    post =>
                        renderPost(
                            post,
                            commentList.filter(
                                c =>
                                    c.post_id ===
                                    post.id
                            )
                        )
                )
                .join("");


    }

    catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Could not load posts.</div>';

    }

}


/* =====================================================
   LOAD PROFILES
===================================================== */

async function loadProfileMap(posts) {

    const ids =
        [
            ...new Set(
                posts.map(
                    p => p.user_id
                )
            )
        ];


    if (!ids.length) {
        return;
    }


    const {
        data
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,username,avatar_url,premium_plan"
        )
        .in(
            "id",
            ids
        );


    profileMap = {};


    (data || []).forEach(
        profile => {

            profileMap[
                profile.id
            ] = profile;

        }
    );

}


/* =====================================================
   LOAD LIKES
===================================================== */

async function loadLikedPosts(posts) {

    likedPosts =
        new Set();


    const ids =
        posts.map(
            p => p.id
        );


    if (!ids.length) {
        return;
    }


    const {
        data
    } =
    await supabaseClient
        .from("post_likes")
        .select("post_id")
        .eq(
            "user_id",
            currentUser.id
        )
        .in(
            "post_id",
            ids
        );


    (data || []).forEach(
        row => {

            likedPosts.add(
                String(row.post_id)
            );

        }
    );

}


/* =====================================================
   COMMENT PROFILES
===================================================== */

async function loadCommentProfiles(
    comments
) {

    const ids =
        [
            ...new Set(
                comments.map(
                    c => c.user_id
                )
            )
        ];


    if (!ids.length) {
        return;
    }


    const {
        data
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,username,avatar_url"
        )
        .in(
            "id",
            ids
        );


    (data || []).forEach(
        profile => {

            profileMap[
                profile.id
            ] = profile;

        }
    );

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(
    post,
    comments
) {

    const profile =
        profileMap[
            post.user_id
        ] || {};


    const username =
        profile.username ||
        "User";


    const avatar =
        profile.avatar_url || "";


    const liked =
        likedPosts.has(
            String(post.id)
        );


    const commentsHtml =
        comments
            .map(
                comment =>
                    renderComment(
                        comment
                    )
            )
            .join("");


    return `

        <article class="post">

            <div class="post-header">

                <div class="post-user">

                    ${
                        avatar
                        ?
                        `<img
                            class="post-avatar"
                            src="${escapeHtml(avatar)}"
                            alt=""
                        >`
                        :
                        `<div class="post-avatar"
                             style="
                               display:flex;
                               align-items:center;
                               justify-content:center;
                               font-weight:bold;
                             ">
                            ${escapeHtml(
                                getInitial(username)
                            )}
                        </div>`
                    }

                    <div>

                        <div class="post-username">
                            ${escapeHtml(username)}
                        </div>

                        <div class="post-time">
                            ${formatTime(
                                post.created_at
                            )}
                        </div>

                    </div>

                </div>


                <button
                    class="post-btn"
                    onclick="deletePost('${escapeJs(post.id)}')">
                    Delete
                </button>

            </div>


            <div class="post-content">
                ${escapeHtml(
                    post.content || ""
                )}
            </div>


            <div class="post-actions">

                <button
                    class="post-btn ${liked ? "liked" : ""}"
                    onclick="toggleLike('${escapeJs(post.id)}')">

                    ${liked ? "❤️" : "♡"} Like

                </button>


                <button
                    class="post-btn"
                    onclick="focusComment('${escapeJs(post.id)}')">

                    💬 Comment

                </button>

            </div>


            <div class="comments">

                ${commentsHtml}

            </div>


            <div class="comment-row">

                <input
                    id="comment-${escapeHtml(post.id)}"
                    class="comment-input"
                    placeholder="Write a comment..."
                    maxlength="1000"
                    onkeydown="
                        if(event.key === 'Enter'){
                            addComment('${escapeJs(post.id)}')
                        }
                    ">

                <button
                    class="post-btn"
                    onclick="addComment('${escapeJs(post.id)}')">
                    Send
                </button>

            </div>

        </article>

    `;

}


/* =====================================================
   RENDER COMMENT
===================================================== */

function renderComment(comment) {

    const profile =
        profileMap[
            comment.user_id
        ] || {};


    const username =
        profile.username ||
        "User";


    const own =
        comment.user_id ===
        currentUser.id;


    return `

        <div class="comment">

            <div class="comment-user">

                ${escapeHtml(username)}

            </div>

            <div class="comment-text">

                ${escapeHtml(
                    comment.comment || ""
                )}

            </div>


            ${
                own
                ?
                `
                <button
                    class="post-btn"
                    style="margin-top:5px;"
                    onclick="deleteComment('${escapeJs(comment.id)}')">
                    Delete
                </button>
                `
                :
                ""
            }

        </div>

    `;

}


/* =====================================================
   LIKE / UNLIKE
===================================================== */

async function toggleLike(
    postId
) {

    const alreadyLiked =
        likedPosts.has(
            String(postId)
        );


    try {

        if (alreadyLiked) {

            const {
                error
            } =
            await supabaseClient
                .from("post_likes")
                .delete()
                .eq(
                    "post_id",
                    postId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (error) {
                throw error;
            }

        }

        else {

            const {
                error
            } =
            await supabaseClient
                .from("post_likes")
                .insert({
                    post_id:
                        postId,
                    user_id:
                        currentUser.id
                });


            if (error) {
                throw error;
            }

        }


        await loadPosts();

        await loadStats();

    }

    catch (error) {

        console.error(error);

        alert(
            "Like action failed: " +
            error.message
        );

    }

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(
    postId
) {

    const input =
        document.getElementById(
            "comment-" + postId
        );


    if (!input) {
        return;
    }


    const comment =
        input.value.trim();


    if (!comment) {
        return;
    }


    try {

        const {
            error
        } =
        await supabaseClient
            .from("post_comments")
            .insert({
                post_id:
                    postId,
                user_id:
                    currentUser.id,
                comment:
                    comment
            });


        if (error) {
            throw error;
        }


        input.value = "";


        await loadPosts();

    }

    catch (error) {

        console.error(error);

        alert(
            "Comment failed: " +
            error.message
        );

    }

}


/* =====================================================
   DELETE COMMENT
===================================================== */

async function deleteComment(
    commentId
) {

    if (
        !confirm(
            "Delete this comment?"
        )
    ) {
        return;
    }


    try {

        const {
            error
        } =
        await supabaseClient
            .from("post_comments")
            .delete()
            .eq(
                "id",
                commentId
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if (error) {
            throw error;
        }


        await loadPosts();

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not delete comment: " +
            error.message
        );

    }

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(
    postId
) {

    if (
        !confirm(
            "Delete this post?"
        )
    ) {

    try {

        const {
            error

/* =====================================================

===================================================== */

function focusComment(

            "adminUser"

    const {

/* =====================================================
   ADMIN ADD DIAMONDS
===================================================== */

async function adminAddDiamonds() {

    const userId =
        document
            .getElementById(
                "adminUser"
            )
            .value;


    const amount =
        Number(
            document
                .getElementById(
                    "diamondAmount"
                )
                .value
        );


    const description =
        document
            .getElementById(
                "diamondDescription"
            )
            .value
            .trim();


    const message =
        document
            .getElementById(
                "adminMessage"
            );


    message.textContent = "";


    if (!userId) {

        message.textContent =
            "Select a user.";

        return;
    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        message.textContent =
            "Enter a valid positive amount.";

        return;
    }


    try {

        /*
         * IMPORTANT:
         *
         * The browser does NOT directly
         * modify diamond_balance.
         *
         * The secure Supabase RPC must
         * perform authorization and
         * ledger/balance updates.
         */

        const {
            error
        } =
        await supabaseClient.rpc(
            "admin_add_diamond",
            {
                p_user_id:
                    userId,

                p_amount:
                    Math.floor(amount),

                p_description:
                    description ||
                    "Admin diamond adjustment"
            }
        );


        if (error) {
            throw error;
        }


        message.textContent =
            "✅ Diamonds added successfully.";


        document
            .getElementById(
                "diamondAmount"
            )
            .value = "";


        document
            .getElementById(
                "diamondDescription"
            )
            .value = "";


        if (
            userId ===
            currentUser.id
        ) {

            await loadProfile();

        }

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "❌ " +
            (
                error.message ||
                "Diamond operation failed."
            );

    }

}

/* =====================================================
   SECURITY / HTML ESCAPING
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(value) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r?\n/g,
        "\\n"
    );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(
    timestamp
) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(timestamp);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString();

}
