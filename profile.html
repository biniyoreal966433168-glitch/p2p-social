hrink:0}.profile-info{min-width:0;flex:1}.profile-name-row{gap:6px;flex-wrap:wrap}.profile-name{font-size:20px;font-weight:700;word-break:break-word}.profile-id{margin-top:5px;color:#7a8494;font-size:12px}.profile-username{margin-top:3px;color:#087f73;font-size:12px;font-weight:700}.profile-bio{margin-top:8px;color:#596579;font-size:13px;line-height:1.5;word-break:break-word}.profile-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.badge{padding:5px 8px;border-radius:8px;background:#eef1f4;color:#7b8492;font-size:11px;font-weight:700}.badge.on.level1{background:#e8f8f3;color:#087f73}.badge.on.level2{background:#e8f0ff;color:#3564b8}.badge.on.level3{background:#f3e8ff;color:#7938b8}.badge.on.level4{background:#ffe8f0;color:#c12d68}.badge.on.level5{background:#fff0d8;color:#b76500}.badge.on.level6{background:#ffe4d6;color:#e24b00}.badge.on.level7{background:#ffe1e8;color:#e00055}.badge.on.level8{background:#eadcff;color:#711cff}.badge.on.level9{background:#d8faff;color:#007d91}.badge.on.level10{background:#fff0a8;color:#8a6200}.badge.on.basic{background:#eef1f4;color:#596579}.badge.on.verified{background:#e8f8f3;color:#087f73}.badge.on.merchant{background:#e8f0ff;color:#3564b8}.badge.on.famous{background:#fdebf4;color:#bd4779}.badge.on.rich{background:#fff3d8;color:#a86c00}.badge.on.online{background:#e8f8f3;color:#087f73}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;border-top:1px solid #edf0f4;padding-top:16px}.stat{text-align:center}.stat strong{display:block;font-size:18px}.stat span{display:block;color:#7a8494;font-size:11px;margin-top:4px}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.profile-actions button{border:0;padding:11px;border-radius:10px;font-weight:700}.follow-btn{background:#087f73;color:#fff}.follow-btn.following{background:#edf7f5;color:#087f73}.message-btn{background:#f1f4f8;color:#172033}.section{margin:16px}.section-title{justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:19px}.post-feed{display:flex;flex-direction:column;gap:9px}.post-card{padding:16px}.post-header{gap:10px}.post-avatar{width:43px;height:43px;border-radius:50%;background:#dfeeea;display:flex;align-items:center;justify-content:center;color:#087f73;font-weight:700;flex-shrink:0}.post-user{flex:1}.post-name-row{gap:4px}.post-name{font-weight:700;font-size:14px}.post-meta{color:#8a93a1;font-size:11px;margin-top:3px}.post-content{margin-top:13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.feedback-box{padding:16px}.feedback-row{padding:11px;background:#f5f7fb;border-radius:11px;margin-bottom:8px}.feedback-top{justify-content:space-between}.feedback-user{font-size:13px;font-weight:700}.feedback-stars{color:#f0a000;font-size:14px}.feedback-text{font-size:12px;color:#596579;line-height:1.5;margin-top:7px}.feedback-meta{font-size:10px;color:#8a93a1;margin-top:6px}.empty{text-align:center;padding:20px;color:#7b8492;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3000;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:20px}.modal-box h3{margin-bottom:15px}.modal-box textarea,.modal-box select{width:100%;border:1px solid #dfe4eb;border-radius:10px;padding:11px;margin-bottom:10px;outline:0}.modal-box textarea{min-height:100px}.modal-buttons{display:flex;gap:8px}.modal-buttons button{flex:1;border:0;padding:11px;border-radius:10px;font-weight:700}.cancel-btn{background:#edf0f4;color:#172033}.save-btn{background:#087f73;color:#fff}.feedback-note{background:#f5f7fb;border-radius:11px;padding:11px;margin-bottom:12px;color:#596579;font-size:12px;line-height:1.5}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:2000}.nav-item{text-align:center;color:#777;font-size:11px;min-width:55px}.nav-item span{display:block;font-size:22px;margin-bottom:3px}.nav-item.active{color:#087f73;font-weight:700}@media(max-width:450px){header{padding:12px}.profile-card,.section{margin-left:12px;margin-right:12px}.profile-name{font-size:18px}.stats{gap:3px}.stat strong{font-size:16px}.brand-icon{width:38px;height:38px}.brand-p-left,.brand-p-right{top:9px;height:20px}.brand-p-left{left:7px}.brand-p-right{right:7px}.brand-center{width:10px;height:10px}.brand-dot{width:3px;height:3px}.brand-text h1{font-size:15px}.brand-text p{font-size:6px}}</style></head><body>
<header><div class="header-row"><button class="back-btn" onclick="goBack()">‹</button><div class="brand-header"><div class="brand-icon"><div class="brand-p-left"></div><div class="brand-p-right"></div><div class="brand-center"><div class="brand-dot"></div></div></div><div class="brand-text"><h1>P2P <span>Social</span></h1><p>CONNECT • TRADE • SHARE</p></div></div></div></header>

<div class="profile-card">
<div class="profile-top">
<div id="profilePhoto" class="profile-photo">U</div>
<div class="profile-info">
<div class="profile-name-row"><div id="profileName" class="profile-name">Loading...</div></div>
<div id="profileUsername" class="profile-username">@username</div>
<div id="profileId" class="profile-id">ID:000000000000</div>
<div id="profileBadges" class="profile-badges"></div>
<div id="profileBio" class="profile-bio">No bio yet.</div>
</div>
</div>

<div class="stats">
<div class="stat"><strong id="postCount">0</strong><span>Posts</span></div>
<div class="stat"><strong id="followersCount">0</strong><span>Followers</span></div>
<div class="stat"><strong id="followingCount">0</strong><span>Following</span></div>
<div class="stat"><strong id="likeCount">0</strong><span>Likes</span></div>
</div>

<div class="profile-actions">
<button id="followButton" class="follow-btn" onclick="toggleFollow()">Follow</button>
<button class="message-btn" onclick="sendMessage()">Message</button>
</div>
</div>

<section class="section">
<div class="section-title"><h2>Posts</h2></div>
<div id="postsFeed" class="post-feed"><div class="empty">Loading posts...</div></div>
</section>

<section class="section">
<div class="section-title"><h2>Feedback</h2></div>
<div class="feedback-box">
<div id="feedbackList"><div class="empty">Loading feedback...</div></div>
</div>
</section>

<div id="feedbackModal" class="modal">
<div class="modal-box">
<h3>Trade Feedback</h3>
<div class="feedback-note">Feedback can only be submitted for a completed or canceled trade.</div>
<select id="feedbackRating">
<option value="5">★★★★★</option>
<option value="4">★★★★☆</option>
<option value="3">★★★☆☆</option>
<option value="2">★★☆☆☆</option>
<option value="1">★☆☆☆☆</option>
</select>
<textarea id="feedbackText" maxlength="500" placeholder="Write feedback"></textarea>
<div class="modal-buttons">
<button class="cancel-btn" onclick="closeFeedback()">Cancel</button>
<button id="feedbackButton" class="save-btn" onclick="submitFeedback()">Submit</button>
</div>
</div>
</div>

<nav class="bottom-nav">
<div class="nav-item" onclick="goHome()"><span>🏠</span>Home</div>
<div class="nav-item" onclick="openBuy()"><span>🟢</span></div>
<div class="nav-item" onclick="openSell()"><span>🔴</span></div>
<div class="nav-item" onclick="openMessages()"><span>💬</span>Messages</div>
<div class="nav-item active"><span>👤</span>Profile</div>
</nav>

<script>
const S="https://mbsvuwrgigqfporxwpfr.supabase.co",K="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa",supabaseClient=supabase.createClient(S,K);
let currentUser=null,currentProfile=null,targetUsername="",targetUserId="",following=false;

const $=id=>document.getElementById(id),
esc=v=>{let d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML},
goHome=()=>location.href="index.html",
openBuy=()=>location.href="live.html",
openSell=()=>location.href="wallet.html",
openMessages=()=>location.href="message.html",
goBack=()=>history.length>1?history.back():goHome();

function profileID(p){
 let n=String(p?.user_number??p?.id_number??"").replace(/\D/g,"");
 return(n||"0").slice(-12).padStart(12,"0")
}

function getName(p){
 return String(p?.name||p?.display_name||p?.full_name||"Name not set")
}

function getUsername(p){
 return String(p?.username||"").trim()
}

function verified(p){
 return!!(p&&(p.verified===true||p.is_verified===true||p.user_verified===true||p.verification_status==="verified"))
}

function getSpending(p){
 return Number(
   p?.fee_spending??
   p?.spending_fee??
   p?.fee_result??
   p?.spending??
   p?.total_spending??
   p?.spent??
   p?.spending_usdt??0
 )||0
}

function getLevel(s){
 return s<2?1:s<4?2:s<8?3:Math.floor(Math.log2(s))+1
}

function levelClass(l){
 return"level"+Math.min(10,Math.max(1,l))
}

function onlineNow(p){
 let d=p?.last_seen||p?.last_active||p?.online_at;
 return d?Date.now()-new Date(d).getTime()<=60000:false
}

function renderBadges(p){
 let followers=Number(p?.followers_count??p?.followers??0)||0,
 spending=getSpending(p),
 merchant=!!(p?.merchant===true||p?.is_merchant===true||String(p?.role||"").toLowerCase()==="merchant"),
 online=onlineNow(p),
 level=getLevel(spending),
 b=[
  ["◇ Level: "+level,1,levelClass(level)],
  ["■ Basic",1,"basic"],
  ["■ Verified",verified(p),"verified"],
  ["■ Merchant",merchant,"merchant"],
  ["♡ Famous",followers>=10,"famous"],
  ["◆ Rich",spending>=10,"rich"],
  ["● Online",online,"online"]
 ];
 $("profileBadges").innerHTML=b.map(x=>`<span class="badge ${x[1]?"on":""} ${x[2]}">${x[0]}</span>`).join("")
}

function setPhoto(url,name){
 let box=$("profilePhoto");
 if(url){
  box.innerHTML=`<img src="${esc(url)}" alt="Profile photo" style="width:100%;height:100%;object-fit:cover">`
 }else box.textContent=String(name||"U").charAt(0).toUpperCase()
}

async function loadTarget(){
 let q=new URLSearchParams(location.search),
 username=String(q.get("username")||q.get("user")||q.get("u")||"").trim(),
 id=String(q.get("id")||"").trim();

 if(!username&&!id){
  $("profileName").textContent="User not found";
  return false
 }

 let r=id
  ?await supabaseClient.from("profiles").select("*").eq("user_id",id).maybeSingle()
  :await supabaseClient.from("profiles").select("*").eq("username",username).maybeSingle();

 if((r.error||!r.data)&&id)
  r=await supabaseClient.from("profiles").select("*").eq("id",id).maybeSingle();

 if((r.error||!r.data)&&username)
  r=await supabaseClient.from("profiles").select("*").eq("username",username).maybeSingle();

 if(r.error||!r.data){
  $("profileName").textContent="User not found";
  return false
 }

 currentProfile=r.data;
 targetUserId=String(r.data.user_id||r.data.id||"");
 targetUsername=getUsername(r.data);

 $("profileName").textContent=getName(r.data);
 $("profileUsername").textContent=targetUsername?"@"+targetUsername:"Username";
 $("profileId").textContent="ID:"+profileID(r.data);
 $("profileBio").textContent=r.data.bio||"No bio yet.";
 $("followersCount").textContent=r.data.followers_count??r.data.followers??0;
 $("followingCount").textContent=r.data.following_count??r.data.following??0;
 $("likeCount").textContent=r.data.likes_count??r.data.likes??0;
 setPhoto(r.data.avatar_url||"",getName(r.data));
 renderBadges(r.data);

 if(currentUser&&targetUserId!==currentUser.id)await loadFollowState();

 return true
}

async function loadPostCount(){
 if(!targetUserId)return;
 let r=await supabaseClient.from("posts").select("id",{count:"exact",head:true}).eq("user_id",targetUserId);
 $("postCount").textContent=r.count??0
}

async function loadPosts(){
 let box=$("postsFeed");
 if(!targetUserId)return;
 let r=await supabaseClient.from("posts").select("*").eq("user_id",targetUserId).order("created_at",{ascending:false});
 if(r.error)return box.innerHTML='<div class="empty">Could not load posts.</div>';
 if(!r.data?.length)return box.innerHTML='<div class="empty">No posts yet.</div>';

 box.innerHTML=r.data.map(p=>{
  let n=p.username||targetUsername||getName(currentProfile)||"User";
  return`<article class="post-card">
   <div class="post-header">
    <div class="post-avatar">${esc(n.charAt(0).toUpperCase())}</div>
    <div class="post-user">
     <div class="post-name-row"><span class="post-name">${esc(n)}</span></div>
     <div class="post-meta">${esc(p.created_at?new Date(p.created_at).toLocaleString():"")} • ${esc(p.visibility||"public")}</div>
    </div>
   </div>
   <div class="post-content">${esc(p.content||"")}</div>
  </article>`
 }).join("")
}

async function loadFollowState(){
 if(!currentUser||!targetUserId||targetUserId===currentUser.id)return;

 let r=await supabaseClient.from("follows")
  .select("*")
  .eq("follower_id",currentUser.id)
  .eq("following_id",targetUserId)
  .maybeSingle();

 if(!r.error)following=!!r.data;
 updateFollowButton()
}

function updateFollowButton(){
 let b=$("followButton");
 if(targetUserId===currentUser?.id){
  b.textContent="Your Profile";
  b.disabled=true;
  b.className="follow-btn following";
  return
 }
 b.disabled=false;
 b.textContent=following?"Following":"Follow";
 b.className="follow-btn"+(following?" following":"")
}

async function toggleFollow(){
 if(!currentUser)return location.href="login.html";
 if(!targetUserId||targetUserId===currentUser.id)return;

 let b=$("followButton");
 b.disabled=true;

 try{
  if(following){
   let r=await supabaseClient.from("follows")
    .delete()
    .eq("follower_id",currentUser.id)
    .eq("following_id",targetUserId);
   if(r.error)throw r.error;
   following=false
  }else{
   let r=await supabaseClient.from("follows").insert({
    follower_id:currentUser.id,
    following_id:targetUserId
   });
   if(r.error)throw r.error;
   following=true
  }

  updateFollowButton();
  await refreshProfileCounts()
 }catch(e){
  alert("Could not update follow:\n\n"+e.message);
  b.disabled=false
 }
}

async function refreshProfileCounts(){
 let r=await supabaseClient.from("follows").select("id",{count:"exact",head:true}).eq("following_id",targetUserId);
 if(r.count!=null){
  $("followersCount").textContent=r.count;
  currentProfile.followers_count=r.count
 }
 renderBadges(currentProfile)
}

function sendMessage(){
 if(!targetUsername)return;
 location.href="message.html?to="+encodeURIComponent(targetUsername)
}

async function loadFeedback(){
 let box=$("feedbackList");
 if(!targetUserId)return;

 let r=await supabaseClient.from("trade_feedback")
  .select("*")
  .eq("recipient_id",targetUserId)
  .order("created_at",{ascending:false});

 if(r.error){
  box.innerHTML='<div class="empty">No feedback yet.</div>';
  return
 }

 if(!r.data?.length){
  box.innerHTML='<div class="empty">No feedback yet.</div>';
  return
 }

 box.innerHTML=r.data.map(x=>{
  let stars=Math.max(1,Math.min(5,Number(x.rating)||5));
  return`<div class="feedback-row">
   <div class="feedback-top">
    <span class="feedback-user">${esc(x.username?"@"+x.username:"User")}</span>
    <span class="feedback-stars">${"★".repeat(stars)}${"☆".repeat(5-stars)}</span>
   </div>
   <div class="feedback-text">${esc(x.feedback||x.comment||x.text||"")}</div>
   <div class="feedback-meta">${esc(x.created_at?new Date(x.created_at).toLocaleString():"")}</div>
  </div>`
 }).join("")
}

function openFeedback(){
 if(!currentUser)return location.href="login.html";
 $("feedbackText").value="";
 $("feedbackModal").classList.add("show")
}

function closeFeedback(){
 $("feedbackModal").classList.remove("show")
}

async function submitFeedback(){
 if(!currentUser||!targetUserId)return;
 let rating=Number($("feedbackRating").value),
 text=$("feedbackText").value.trim(),
 b=$("feedbackButton");

 if(!text)return alert("Write feedback.");
 b.disabled=true;

 try{
  let r=await supabaseClient.from("trade_feedback").insert({
   giver_id:currentUser.id,
   recipient_id:targetUserId,
   rating,
   feedback:text,
   visible:true
  });
  if(r.error)throw r.error;
  closeFeedback();
  await loadFeedback()
 }catch(e){
  alert("Could not submit feedback:\n\n"+e.message)
 }finally{
  b.disabled=false
 }
}

async function start(){
 let{data}=await supabaseClient.auth.getSession();
 currentUser=data?.session?.user||null;

 let ok=await loadTarget();
 if(!ok)return;

 await Promise.all([
  loadPostCount(),
  loadPosts(),
  loadFeedback()
 ]);

 if(currentUser&&targetUserId===currentUser.id){
  $("followButton").textContent="Your Profile";
  $("followButton").disabled=true
 }
}

window.addEventListener("load",start);
</script></body></html>
