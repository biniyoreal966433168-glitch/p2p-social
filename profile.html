<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - P2P Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:85px;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

/* PROFILE */

.profile-card{
  background:white;
  margin:16px;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.profile-top{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-photo-wrap{
  position:relative;
  width:82px;
  height:82px;
  flex-shrink:0;
}

.profile-photo{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-size:30px;
  font-weight:bold;
}

.photo-button{
  position:absolute;
  right:-2px;
  bottom:-2px;
  width:29px;
  height:29px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  cursor:pointer;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-name{
  font-size:20px;
  font-weight:bold;
}

.profile-id{
  margin-top:5px;
  color:#7a8494;
  font-size:12px;
}

.profile-bio{
  margin-top:5px;
  color:#596579;
  font-size:13px;
  word-break:break-word;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:20px;
  border-top:1px solid #edf0f4;
  padding-top:16px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  display:block;
  color:#7a8494;
  font-size:11px;
  margin-top:4px;
}

/* BUTTONS */

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.profile-buttons button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.edit-btn{
  background:#087f73;
  color:white;
}

.settings-btn{
  background:#edf7f5;
  color:#087f73;
}

/* SECTIONS */

.section{
  margin:16px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:19px;
}

/* WALLET */

.wallet{
  background:linear-gradient(135deg,#172033,#29364f);
  color:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.wallet-label{
  opacity:.75;
  font-size:13px;
}

.wallet-balance{
  font-size:27px;
  font-weight:bold;
  margin-top:7px;
}

.wallet-button{
  margin-top:15px;
  width:100%;
  border:none;
  background:#16a085;
  color:white;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* CREATE POST */

.create-box{
  background:white;
  border-radius:17px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.create-box textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:14px;
}

.post-options{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.post-options select{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:9px;
  padding:10px;
}

.create-post-btn{
  border:none;
  background:#087f73;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */

.posts-feed{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.post-card{
  background:white;
  border-radius:17px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.post-user{
  flex:1;
  min-width:0;
}

.post-name{
  font-weight:bold;
  font-size:14px;
}

.post-meta{
  color:#8a93a1;
  font-size:11px;
  margin-top:3px;
}

.post-menu{
  border:none;
  background:transparent;
  font-size:20px;
  cursor:pointer;
  color:#687386;
}

.post-content{
  margin-top:13px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:15px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
  flex-wrap:wrap;
}

.post-action{
  border:none;
  background:transparent;
  color:#687386;
  cursor:pointer;
  font-size:13px;
}

.post-action.liked{
  color:#e74c3c;
  font-weight:bold;
}

/* COMMENTS */

.comments-box{
  margin-top:12px;
  border-top:1px solid #edf0f4;
  padding-top:10px;
}

.comments-box.hidden{
  display:none;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.comment-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.comment-body{
  background:#f5f7fb;
  border-radius:11px;
  padding:8px 10px;
  flex:1;
  min-width:0;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.comment-name{
  font-weight:bold;
  font-size:12px;
}

.comment-delete{
  border:none;
  background:transparent;
  color:#e74c3c;
  cursor:pointer;
  font-size:11px;
}

.comment-text{
  font-size:13px;
  margin-top:3px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-input-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  min-width:0;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:9px;
  outline:none;
}

.comment-send{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:0 13px;
  cursor:pointer;
  font-weight:bold;
}

.view-comments{
  border:none;
  background:transparent;
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:16px;
  padding:25px;
  text-align:center;
  color:#7b8492;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:3000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:20px;
}

.modal-box h3{
  margin-bottom:15px;
}

.modal-box input,
.modal-box textarea{
  width:100%;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
  outline:none;
}

.modal-box textarea{
  min-height:100px;
  resize:vertical;
}

.modal-buttons{
  display:flex;
  gap:8px;
}

.modal-buttons button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.cancel-btn{
  background:#edf0f4;
  color:#172033;
}

.save-btn{
  background:#087f73;
  color:white;
}

/* SETTINGS */

.settings-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.settings-item{
  width:100%;
  border:none;
  background:#f5f7fb;
  padding:13px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
  font-weight:bold;
}

.settings-item.logout{
  color:#e74c3c;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
  min-width:55px;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

input[type=file]{
  display:none;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:450px){

  .profile-card,
  .section{
    margin-left:12px;
    margin-right:12px;
  }

  .stats{
    gap:3px;
  }

  .stat strong{
    font-size:16px;
  }

  .profile-name{
    font-size:18px;
  }

  .profile-top{
    align-items:flex-start;
  }

  .post-options{
    flex-direction:column;
    align-items:stretch;
  }

  .post-options select,
  .create-post-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-row">

    <button
      class="back-btn"
      onclick="goHome()">
      ‹
    </button>

    <div class="header-title">
      👤 Profile
    </div>

  </div>

</header>


<!-- PROFILE -->

<div class="profile-card">

  <div class="profile-top">

    <div class="profile-photo-wrap">

      <div
        id="profilePhotoBox"
        class="profile-photo">
        U
      </div>

      <label
        class="photo-button"
        for="photoInput">
        📷
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        onchange="changeProfilePhoto(event)"
      >

    </div>

    <div>

      <div
        id="profileName"
        class="profile-name">
        Loading...
      </div>

      <div
        id="profileId"
        class="profile-id">
        User ID: --
      </div>

      <div
        id="profileBio"
        class="profile-bio">
        No bio yet.
      </div>

    </div>

  </div>


  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong id="followingCount">0</strong>
      <span>Following</span>
    </div>

    <div class="stat">
      <strong id="likeCount">0</strong>
      <span>Likes</span>
    </div>

  </div>


  <div class="profile-buttons">

      class="edit-btn"
      onclick="openEditProfile()">
      ✏️ Edit Profile
    </button>

      onclick="openSettings()">
      ⚙️ Settings
    </button>

  </div>

</div>


<!-- WALLET -->

<section class="section">

  <div class="section-title">
    <h2>💰 Wallet</h2>
  </div>

  <div class="wallet">

    <div class="wallet-label">
      Total Balance
    </div>

    <div
      id="walletBalance"
      class="wallet-balance">
      0 ETB
    </div>

    <button
      class="wallet-button"
      onclick="openWallet()">
      Open Wallet
    </button>

  </div>

</section>


<!-- CREATE POST -->

<section class="section">

  <div class="section-title">
    <h2>📝 Create Post</h2>
  </div>

  <div class="create-box">

    <textarea
      id="postContent"
      maxlength="5000"
      placeholder="What's on your mind?">
    </textarea>

    <div class="post-options">

      <select id="postVisibility">

        <option value="public">
          🌍 Public
        </option>

        <option value="private">
          🔒 Private
        </option>

      </select>

      <button
        id="createPostButton"
        class="create-post-btn"
        onclick="createPost()">
        Post
      </button>

    </div>

  </div>

</section>


<!-- YOUR POSTS -->

<section class="section">

  <div class="section-title">

    <h2>📄 Your Posts</h2>

    <button
      class="view-comments"
      onclick="loadPosts()">
      Refresh
    </button>

  </div>

  <div
    id="postsFeed"
    class="posts-feed">

    <div class="empty">
      Loading posts...
    </div>

  </div>

</section>


<!-- EDIT PROFILE MODAL -->

<div
  id="editModal"
  class="modal">

  <div class="modal-box">

    <h3>✏️ Edit Profile</h3>

    <input
      id="editUsername"
      maxlength="50"
      placeholder="Username"
    >

    <textarea
      id="editBio"
      maxlength="300"
      placeholder="Bio">
    </textarea>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeEditProfile()">
        Cancel
      </button>

      <button
        id="saveProfileButton"
        class="save-btn"
        onclick="saveProfile()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- SETTINGS MODAL -->

<div
  id="settingsModal"
  class="modal">

  <div class="modal-box">

    <h3>⚙️ Settings</h3>

    <div class="settings-list">

      <button
        class="settings-item"
        onclick="openEditProfile();closeSettings();">
        ✏️ Edit Profile
      </button>

      <button
        class="settings-item"
        onclick="openWallet()">
        💰 Wallet
      </button>

      <button
        class="settings-item"
        onclick="openMessages()">
        💬 Messages
      </button>

      <button
        class="settings-item"
        onclick="openLive()">
        🔴 Live
      </button>

      <button
        class="settings-item logout"
        onclick="logout()">
        🚪 Logout
      </button>

        style="width:100%;padding:11px;border:none;border-radius:10px;"

        Close
      </button>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()">

    <span>🏠</span>
    Home

  </div>


  <div
    class="nav-item"
    onclick="openLive()">

    <span>🔴</span>
    Live

  </div>


  <div
    class="nav-item"
    onclick="openWallet()">

    <span>💰</span>
    P2P

  </div>


  <div
    class="nav-item"
    onclick="openMessages()">

    <span>💬</span>
    Messages

  </div>


  <div
    class="nav-item active">

    <span>👤</span>
    Profile

  </div>

</nav>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ===============================
   SUPABASE
=============================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let currentSession = null;
let currentProfile = null;

let allProfiles = {};
let allComments = [];


/* ===============================
   START APP
=============================== */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    showLogin();

    return;

  }

  currentSession =
    data.session;

  if(!currentSession){

    showLogin();

    return;

  }

  await loadProfile();

  await loadPosts();

}


/* ===============================
   LOGIN PROTECTION
=============================== */

function showLogin(){

  alert("Please login first.");

  window.location.href =
    "login.html";

}


/* ===============================
   LOAD PROFILE
=============================== */

async function loadProfile(){

  const user =
    currentSession.user;

  const {
    data:profile,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

  }

  currentProfile =
    profile || {};


  const username =
    currentProfile.username ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";


  const bio =
    currentProfile.bio ||
    "No bio yet.";


  document.getElementById(
    "profileName"
  ).textContent =
    username;


  document.getElementById(
    "profileBio"
  ).textContent =
    bio;


  await loadUserNumber(user.id);


  const avatar =
    currentProfile.avatar_url || "";


  setProfilePhoto(
    avatar,
    username
  );


  const balance =
    Number(
      currentProfile.balance
    ) || 0;


  document.getElementById(
    "walletBalance"
  ).textContent =
    balance.toLocaleString() +
    " ETB";


  document.getElementById(
    "editUsername"
  ).value =
    username;


  document.getElementById(
    "editBio"
  ).value =
    currentProfile.bio || "";


  await loadStats();

}


/* ===============================
   USER NUMBER
=============================== */

async function loadUserNumber(userId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("id,created_at")
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error || !data){

    document.getElementById(
      "profileId"
    ).textContent =
      "User ID: " +
      userId.substring(0,8);

    return;

  }


  const index =
    data.findIndex(
      item =>
        item.id === userId
    );


  if(index === -1){

    document.getElementById(
      "profileId"
    ).textContent =
      "User ID: " +
      userId.substring(0,8);

    return;

  }


  const number =
    String(index + 1)
      .padStart(2,"0");


  document.getElementById(
    "profileId"
  ).textContent =
    "User ID: " +
    number;

}


/* ===============================
   PROFILE PHOTO
=============================== */

function setProfilePhoto(
  avatar,
  username
){

  const oldBox =
    document.getElementById(
      "profilePhotoBox"
    );


  if(!oldBox){
    return;
  }


  if(avatar){

    const img =
      document.createElement("img");

    img.id =
      "profilePhotoBox";

    img.className =
      "profile-photo";

    img.src =
      avatar;

    img.alt =
      "Profile photo";


    oldBox.replaceWith(img);

  }else{

    oldBox.textContent =
      username
        .charAt(0)
        .toUpperCase();

    oldBox.className =
      "profile-photo";

  }

}


/* ===============================
   CHANGE PROFILE PHOTO
=============================== */

async function changeProfilePhoto(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  if(!file.type.startsWith("image/")){

    alert(
      "Please select an image."
    );

    return;

  }


  if(file.size > 5 * 1024 * 1024){

    alert(
      "Image must be smaller than 5 MB."
    );

    return;

  }


  const userId =
    currentSession.user.id;


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    userId +
    "/profile." +
    extension;


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("avatars")
    .upload(
      filePath,
      file,
      {
        upsert:true,
        contentType:file.type
      }
    );


  if(uploadError){

    console.error(
      uploadError
    );

    alert(
      "Photo upload failed.\n\n" +
      uploadError.message
    );

    return;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from("avatars")
    .getPublicUrl(
      filePath
    );


  const avatarUrl =
    data.publicUrl +
    "?t=" +
    Date.now();


  const {
    error:updateError
  } =
  await supabaseClient
    .from("profiles")
    .update({
      avatar_url:avatarUrl
    })
    .eq(
      "id",
      userId
    );


  if(updateError){

    console.error(
      updateError
    );

async function loadStats(){

    currentSession.user.id;

  const {
    count:postCount
  } =
  await supabaseClient
    .from("posts")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "user_id",
      userId
    );


  document.getElementById(
    "postCount"
  ).textContent =
    postCount || 0;


  /* LIKES RECEIVED */

  const {
    data:userPosts
  } =
  await supabaseClient
    .from("posts")
    .select("id")
    .eq(
      "user_id",
      userId
    );


  let totalLikes = 0;


  if(userPosts && userPosts.length){

    const postIds =
      userPosts.map(
        post => post.id
      );


    const {
      count
    } =
    await supabaseClient
      .from("post_likes")
      .select(
        "post_id",
        {
          count:"exact",
          head:true
        }
      )
      .in(
        "post_id",
        postIds
      );


    totalLikes =
      count || 0;

  }


  document.getElementById(
    "likeCount"
  ).textContent =
    totalLikes;


  /* FOLLOWERS */

  const {
    count:followers,
    error:followersError
  } =
  await supabaseClient
    .from("followers")
    .select(
      "follower_id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "following_id",
      userId
    );


  document.getElementById(
    "followersCount"
  ).textContent =
    followersError
    ? "0"
    : followers || 0;


  /* FOLLOWING */

  const {
    count:following,
    error:followingError
  } =
  await supabaseClient
    .from("followers")
    .select(
      "following_id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "follower_id",
      userId
    );


  document.getElementById(
    "followingCount"
  ).textContent =
    followingError
    ? "0"
    : following || 0;

/* ===============================
   LOAD POSTS
=============================== */

async function loadPosts(){

  const feed =
    document.getElementById(
      "postsFeed"
    );


  feed.innerHTML = `
    <div class="empty">
      Loading posts...
    </div>
  `;


  const {
    data:posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      visibility,
      created_at
    `)
    .eq(
      "user_id",
      currentSession.user.id
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        Could not load posts.<br><br>
        <small>
          ${escapeHtml(error.message)}
        </small>
      </div>
    `;

    return;

  }


  if(!posts || posts.length === 0){

    feed.innerHTML = `
      <div class="empty">
        You have not created any posts yet.
      </div>
    `;

    return;

  }


  const postIds =
    posts.map(
      post => post.id
    );


  await loadPostProfiles(posts);


  const likes =
    await loadLikes(postIds);


  const comments =
    await loadComments(postIds);


  allComments =
    comments;


  renderPosts(
    posts,
    likes,
    comments
  );

}


/* ===============================
   LOAD POST PROFILES
=============================== */

async function loadPostProfiles(posts){

  const ids =
    [
      ...new Set(
        posts.map(
          post => post.user_id
        )
      )
    ];


  allProfiles = {};


  if(!ids.length){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .in(
      "id",
      ids
    );


  if(error){

    console.error(error);

    return;

  }


  (data || []).forEach(
    profile => {

      allProfiles[
        profile.id
      ] =
      profile;

    }
  );

}


/* ===============================
   LOAD LIKES
=============================== */

async function loadLikes(postIds){

  if(!postIds.length){
    return [];
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_likes")
    .select(
      "post_id,user_id"
    )
    .in(
      "post_id",
      postIds
    );


  if(error){

    console.error(
      "Likes error:",
      error
    );

    return [];

  }


  return data || [];

}


/* ===============================
   LOAD COMMENTS
=============================== */

async function loadComments(postIds){

  if(!postIds.length){
    return [];
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_comments")
    .select(
      "id,post_id,user_id,comment,created_at"
    )
    .in(
      "post_id",
      postIds
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "Comments error:",
      error
    );

    return [];

  }


  const commentUserIds =
    [
      ...new Set(
        (data || []).map(
          comment =>
            comment.user_id
        )
      )
    ];


  if(commentUserIds.length){

    const {
      data:commentProfiles,
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url"
      )
      .in(
        "id",
        commentUserIds
      );


    if(!profileError){

      (commentProfiles || [])
        .forEach(
          profile => {

            allProfiles[
              profile.id
            ] =
            profile;

          }
        );

    }

  }


  return data || [];

}


/* ===============================
   RENDER POSTS
=============================== */

function renderPosts(
  posts,
  likes,
  comments
){

  const feed =
    document.getElementById(
      "postsFeed"
    );


  feed.innerHTML = "";


  posts.forEach(
    post => {

      const profile =
        allProfiles[
          post.user_id
        ] || {};


      const username =
        profile.username ||
        "User";


      const avatar =
        profile.avatar_url ||
        "";


      const initial =
        username
          .charAt(0)
          .toUpperCase();


      const postLikes =
        likes.filter(
          like =>
            String(like.post_id) ===
            String(post.id)
        );


      const liked =
        postLikes.some(
          like =>
            like.user_id ===
            currentSession.user.id
        );


      const postComments =
        comments.filter(
          comment =>
            String(comment.post_id) ===
            String(post.id)
        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "post-card";


      card.innerHTML = `

        <div class="post-header">

          ${
            avatar
            ?
            `<img
              class="post-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="post-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="post-user">

            <div class="post-name">
              ${escapeHtml(username)}
            </div>

            <div class="post-meta">

              ${
                post.visibility === "private"
                ? "🔒 Private"
                : "🌍 Public"
              }

              ·

              ${escapeHtml(
                formatTime(post.created_at)
              )}

            </div>

          </div>

          <button
            class="post-menu"
            title="Delete post"
            onclick="deletePost('${escapeJs(post.id)}')">
            ⋮
          </button>

        </div>


        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>


        <div class="post-actions">

          <button
            class="post-action ${liked ? "liked" : ""}"
            onclick="likePost('${escapeJs(post.id)}')">

            ${liked ? "❤️ Liked" : "♡ Like"}

            <span>
              ${postLikes.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="toggleComments('${escapeJs(post.id)}')">

            💬 Comments

            <span>
              ${postComments.length}
            </span>

          </button>


          <button
            class="post-action"
            onclick="sharePost('${escapeJs(post.id)}')">

            ↗️ Share

          </button>

        </div>


        <button
          id="view-comments-${escapeHtml(post.id)}"
          class="view-comments"
          onclick="toggleComments('${escapeJs(post.id)}')">

          💬 View comments

        </button>


        <div
          id="comments-${escapeHtml(post.id)}"
          class="comments-box hidden">

          ${renderComments(postComments)}

          <div class="comment-input-row">

            <input
              id="comment-input-${escapeHtml(post.id)}"
              class="comment-input"
              maxlength="500"
              placeholder="Write a comment..."
              onkeydown="
                if(event.key==='Enter'){
                  event.preventDefault();
                  sendComment('${escapeJs(post.id)}');
                }
              "
            >

            <button
              class="comment-send"
              onclick="sendComment('${escapeJs(post.id)}')">

              Send

            </button>

          </div>

        </div>

      `;


      feed.appendChild(card);

    }
  );

}


/* ===============================
   RENDER COMMENTS
=============================== */

function renderComments(comments){

  if(!comments.length){

    return `
      <div
        style="
          font-size:12px;
          color:#8a93a1;
          margin-bottom:8px;
        ">
        No comments yet.
      </div>
    `;

  }


  return comments.map(
    comment => {

      const profile =
        allProfiles[
          comment.user_id
        ] || {};


      const username =
        profile.username ||
        "User";


      const avatar =
        profile.avatar_url ||
        "";


      const initial =
        username
          .charAt(0)
          .toUpperCase();


      const isOwner =
        comment.user_id ===
        currentSession.user.id;


      return `

        <div class="comment">

          ${
            avatar
            ?
            `<img
              class="comment-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="comment-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="comment-body">

            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(username)}
              </div>

              ${
                isOwner
                ?
                `<button
                  class="comment-delete"
                  onclick="deleteComment('${escapeJs(comment.id)}')">
                  Delete
                </button>`
                :
                ""
              }

            </div>

            <div class="comment-text">
              ${escapeHtml(comment.comment || "")}
            </div>

          </div>

        </div>

      `;

    }
  ).join("");

}


/* ===============================
   MINIMIZE / MAXIMIZE COMMENTS
=============================== */

function toggleComments(postId){

  const box =
    document.getElementById(
      "comments-" + postId
    );


  const button =
    document.getElementById(
      "view-comments-" + postId
    );


  if(!box || !button){
    return;
  }


  const hidden =
    box.classList.toggle(
      "hidden"
    );


  button.textContent =
    hidden
    ? "💬 View comments"
    : "🔽 Hide comments";

}


/* ===============================
   LIKE / UNLIKE
=============================== */

async function likePost(postId){

  const userId =
    currentSession.user.id;


  const {
    data:existing,
    error:checkError
  } =
  await supabaseClient
    .from("post_likes")
    .select("post_id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();


  if(checkError){

    console.error(checkError);

    alert(
      "Could not check like:\n\n" +
      checkError.message
    );

    return;

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        userId
      );


    if(error){

      console.error(error);

      alert(
        "Could not unlike post:\n\n" +
        error.message
      );

      return;

    }

  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          userId

      });


    if(error){

      console.error(error);

      alert(
        "Could not like post:\n\n" +
        error.message
      );

      return;

    }

  }


  await loadPosts();

  await loadStats();

}


/* ===============================
   SEND COMMENT
=============================== */

async function sendComment(postId){

  const input =
    document.getElementById(
      "comment-input-" + postId
    );


  if(!input){
    return;
  }


  const comment =
    input.value.trim();


  if(!comment){
    return;
  }


  if(comment.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentSession.user.id,

      comment:
        comment

    });


  if(error){

    console.error(
      "Comment failed:",
      error
    );

    alert(
      "Comment failed:\n\n" +
      error.message
    );

    return;

  }


  input.value = "";


  await loadPosts();

}

/* ===============================
   SHARE POST
=============================== */

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    encodeURIComponent(
      postId
    );


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Post",

        text:
          "Check out this post.",

        url:
          url

      });

    }catch(error){

      console.log(error);

    }

    return;

  }


  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    alert(url);

  }

}

/* ===============================
   FORMAT TIME
=============================== */

function formatTime(dateString){

  const date =
    new Date(dateString);


  if(isNaN(
    date.getTime()
  )){

    return "";

  }


  const now =
    new Date();


  const seconds =
    Math.floor(
      (now - date) / 1000
    );


  if(seconds < 60){
    return "now";
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){
    return minutes + "m";
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){
    return hours + "h";
  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){
    return days + "d";
  }


  return date.toLocaleDateString();

}


/* ===============================
   ESCAPE HTML
=============================== */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
    ? ""
    : String(text);


  return div.innerHTML;

}


/* ===============================
   ESCAPE JS
=============================== */

function escapeJs(text){

  return String(
    text || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  );

}
