<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Social - Profile</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.menu-btn{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:22px;
  width:40px;
  height:40px;
  border-radius:10px;
  cursor:pointer;
}

/* SETTINGS MENU */

.settings-menu{
  display:none;
  position:absolute;
  right:12px;
  top:70px;
  width:210px;
  background:white;
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  z-index:2000;
  overflow:hidden;
}

.settings-menu button{
  width:100%;
  border:none;
  background:white;
  text-align:left;
  padding:14px;
  cursor:pointer;
  font-size:14px;
}

.settings-menu button:hover{
  background:#f1f5f5;
}

/* PROFILE */

.profile-card{
  background:white;
  margin:18px;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  text-align:center;
}

.avatar-wrapper{
  position:relative;
  width:100px;
  height:100px;
  margin:0 auto 12px;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  border:4px solid #087f73;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-size:36px;
  font-weight:bold;
}

.camera-btn{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  cursor:pointer;
  font-size:16px;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
}

.profile-handle{
  color:#7a8494;
  font-size:13px;
  margin-top:4px;
}

.profile-bio{
  color:#4e596b;
  font-size:14px;
  margin-top:10px;
  line-height:1.5;
}

.edit-btn{
  margin-top:15px;
  border:none;
  background:#087f73;
  color:white;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:20px;
  border-top:1px solid #edf0f4;
  padding-top:17px;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  display:block;
  color:#7a8494;
  font-size:11px;
  margin-top:4px;
}

/* WALLET */

.wallet{
  margin:18px;
  background:linear-gradient(135deg,#172033,#29364f);
  color:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.wallet-title{
  font-size:13px;
  opacity:.8;
}

.wallet-balance{
  font-size:27px;
  font-weight:bold;
  margin:7px 0;
}

.wallet-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:13px;
}

.wallet-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.wallet-buttons button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.deposit{
  background:#16a085;
  color:white;
}

.wallet-btn{
  background:white;
  color:#172033;
}

/* SECTIONS */

section{
  padding:5px 18px 18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:19px;
}

.create-btn{
  border:none;
  background:#087f73;
  color:white;
  padding:9px 12px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

/* CREATE POST */

.create-box{
  display:none;
  background:white;
  padding:16px;
  border-radius:16px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-textarea{
  width:100%;
  min-height:110px;
  resize:vertical;
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:14px;
}

.visibility{
  margin-top:10px;
  width:100%;
  border:1px solid #dfe4eb;
  padding:10px;
  border-radius:10px;
  background:white;
}

.publish-btn{
  width:100%;
  margin-top:10px;
  border:none;
  background:#087f73;
  color:white;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */

.posts-feed{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.post-card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.post-user-info{
  flex:1;
}

.post-name{
  font-size:14px;
  font-weight:bold;
}

.post-handle{
  color:#7a8494;
  font-size:12px;
  margin-top:3px;
}

.post-time{
  color:#8a93a1;
  font-size:11px;
}

.post-content{
  margin-top:13px;
  color:#303b4d;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.private-badge{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  background:#f1f3f6;
  padding:4px 7px;
  border-radius:6px;
  color:#687386;
}

.post-actions{
  display:flex;
  gap:18px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
}

.post-action{
  border:none;
  background:transparent;
  color:#687386;
  cursor:pointer;
  font-size:13px;
}

.post-action.liked{
  color:#e74c3c;
  font-weight:bold;
}

/* COMMENTS */

.comments-box{
  margin-top:14px;
  border-top:1px solid #edf0f4;
  padding-top:12px;
}

.comment{
  display:flex;
  gap:9px;
  margin-bottom:10px;
}

.comment-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.comment-body{
  background:#f5f7fb;
  border-radius:12px;
  padding:8px 11px;
  flex:1;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.comment-name{
  font-size:12px;
  font-weight:bold;
}

.delete-comment{
  border:none;
  background:transparent;
  color:#e74c3c;
  font-size:11px;
  cursor:pointer;
}

.comment-text{
  font-size:13px;
  color:#303b4d;
  margin-top:3px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-input-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:9px;
  outline:none;
}

.comment-send{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:0 13px;
  cursor:pointer;
  font-weight:bold;
}

.view-comments{
  border:none;
  background:transparent;
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  margin-top:4px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:16px;
  padding:25px;
  text-align:center;
  color:#7b8492;
}

/* BOTTOM */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

@media(max-width:450px){
  .profile-card,
  .wallet{
    margin-left:12px;
    margin-right:12px;
  }

  section{
    padding-left:12px;
    padding-right:12px;
  }

  .stats{
    gap:3px;
  }

  .stat strong{
    font-size:16px;
  }

  .stat span{
    font-size:10px;
  }

  .post-actions{
    gap:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <button class="back" onclick="goHome()">
      ←
    </button>

    <div class="header-title">
      Profile
    </div>

    <button class="menu-btn" onclick="toggleSettings()">
      ⋮
    </button>

  </div>
</header>

<!-- SETTINGS MENU -->

<div id="settingsMenu" class="settings-menu">

  <button onclick="editProfile()">
    ✏️ Edit Profile
  </button>

  <button onclick="openSettings()">
    ⚙️ Settings
  </button>

  <button onclick="openWallet()">
    💳 Wallet
  </button>

  <button onclick="logout()">
    🚪 Logout
  </button>

</div>

<!-- PROFILE -->

<div class="profile-card">

  <div class="avatar-wrapper">

    <div id="profileAvatar" class="profile-avatar">
      U
    </div>

    <button
      class="camera-btn"
      onclick="changePhoto()">
      📷
    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      style="display:none"
      onchange="uploadPhoto(event)">

  </div>

  <div id="profileName" class="profile-name">
    User
  </div>

  <div id="profileHandle" class="profile-handle">
    @user
  </div>

  <div id="profileBio" class="profile-bio">
    No bio yet.
  </div>

  <button
    class="edit-btn"
    onclick="editProfile()">
    ✏️ Edit Profile
  </button>

  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong id="followingCount">0</strong>
      <span>Following</span>
    </div>

    <div class="stat">
      <strong id="likesCount">0</strong>
      <span>Likes</span>
    </div>

  </div>

</div>

<!-- WALLET -->

<div class="wallet">

  <div class="wallet-title">
    Total Wallet Balance
  </div>

  <div
    id="balanceDisplay"
    class="wallet-balance">
    0 ETB
  </div>

  <div class="wallet-row">
    <span>🇪🇹 ETB</span>
    <strong id="etbDisplay">0.00</strong>
  </div>

  <div class="wallet-row">
    <span>💵 USDT</span>
    <strong id="usdtDisplay">0.00</strong>
  </div>

  <div class="wallet-buttons">

    <button
      class="deposit"
      onclick="openDeposit()">
      Deposit
    </button>

    <button
      class="wallet-btn"
      onclick="openWallet()">
      Wallet
    </button>

  </div>

</div>

<!-- POSTS -->

<section>

  <div class="section-title">

    <h2>
      📝 Your Posts
    </h2>

    <button
      class="create-btn"
      onclick="toggleCreatePost()">
      + Create
    </button>

  </div>

  <!-- CREATE POST -->

  <div
    id="createBox"
    class="create-box">

    <textarea
      id="postContent"
      class="post-textarea"
      maxlength="5000"
      placeholder="What's on your mind?"></textarea>

    <select
      id="postVisibility"
      class="visibility">

      <option value="public">
        🌍 Public
      </option>

      <option value="private">
        🔒 Private
      </option>

    </select>

    <button
      class="publish-btn"
      onclick="createPost()">
      Publish Post
    </button>

  </div>

  <div
    id="postsFeed"
    class="posts-feed">

    <div class="empty">
      Loading your posts...
    </div>

  </div>

</section>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()">
    <span>🏠</span>
    Home
  </div>

  <div
    class="nav-item"
    onclick="protectedAction('Live')">
    <span>🔴</span>
    Live
  </div>

  <div
    class="nav-item"
    onclick="openWallet()">
    <span>🔄</span>
    P2P
  </div>

  <div
    class="nav-item"
    onclick="protectedAction('Messages')">
    <span>💬</span>
    Messages
  </div>

  <div
    class="nav-item active"
    onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span>👤</span>
    Profile
  </div>

</nav>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession = null;
let currentProfile = null;


/* ============================
   LOGIN CHECK
============================ */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);
    return;

  }

  currentSession =
    data.session;

  if(!currentSession){

    window.location.href =
      "login.html";

    return;

  }

  await loadProfile();

  await loadWallet();

  await loadPosts();

}


/* ============================
   LOAD PROFILE
============================ */

async function loadProfile(){

  const user =
    currentSession.user;

  const {
    data: profile,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

  }

  currentProfile =
    profile || {};

  const username =
    profile?.username ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";

  const avatar =
    profile?.avatar_url ||
    "";

  const bio =
    profile?.bio ||
    "No bio yet.";

  document.getElementById(
    "profileName"
  ).textContent =
    username;

  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;

  document.getElementById(
    "profileBio"
  ).textContent =
    bio;

  const avatarBox =
    document.getElementById(
      "profileAvatar"
    );

  if(avatar){

    avatarBox.innerHTML = `
      <img
        src="${escapeHtml(avatar)}"
        style="width:100%;height:100%;border-radius:50%;object-fit:cover"
        alt="Profile">
    `;

  }else{

    avatarBox.textContent =
      username.charAt(0).toUpperCase();

  }

}


/* ============================
   WALLET
============================ */

async function loadWallet(){

  const user =
    currentSession.user;

  const {
    data: profile
  } =
  await supabaseClient
    .from("profiles")
    .select("balance")
    .eq("id",user.id)
    .maybeSingle();

  const balance =
    Number(profile?.balance) || 0;

  document.getElementById(
    "balanceDisplay"
  ).textContent =
    balance.toLocaleString() +
    " ETB";

  document.getElementById(
    "etbDisplay"
  ).textContent =
    balance.toLocaleString(
      undefined,
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* ============================
   CREATE POST
============================ */

function toggleCreatePost(){

  const box =
    document.getElementById(
      "createBox"
    );

  box.style.display =
    box.style.display === "block"
    ? "none"
    : "block";

}


/* ============================
   CREATE POST
============================ */

async function createPost(){

  if(!currentSession){

    window.location.href =
      "login.html";

    return;

  }

  const textarea =
    document.getElementById(
      "postContent"
    );

  const visibility =
    document.getElementById(
      "postVisibility"
    ).value;

  const content =
    textarea.value.trim();

  if(!content){

    alert(
      "Please write something first."
    );

    return;

  }

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentSession.user.id,

      content:
        content,

      visibility:
        visibility

    });

  if(error){

    console.error(error);

    alert(
      "Could not create post: " +
      error.message
    );

    return;

  }

  textarea.value = "";

  document.getElementById(
    "createBox"
  ).style.display = "none";

  await loadPosts();

}


/* ============================
   LOAD POSTS
============================ */

async function loadPosts(){

  const feed =
    document.getElementById(
      "postsFeed"
    );

  feed.innerHTML = `
    <div class="empty">
      Loading your posts...
    </div>
  `;

  const userId =
    currentSession.user.id;

  const {
    data: posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      created_at,
      visibility
    `)
    .eq(
      "user_id",
      userId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    feed.innerHTML = `
      <div class="empty">
        Could not load posts.<br>
        <small>
          ${escapeHtml(error.message)}
        </small>
      </div>
    `;

    return;

  }

  document.getElementById(
    "postCount"
  ).textContent =
    posts?.length || 0;

  if(!posts || posts.length === 0){

    feed.innerHTML = `
      <div class="empty">
        You have not created any posts yet.
      </div>
    `;

    document.getElementById(
      "likesCount"
    ).textContent = "0";

    return;

  }

  const postIds =
    posts.map(
      post => post.id
    );


  /* LIKES */

  let likes = [];

  const likeResult =
    await supabaseClient
      .from("post_likes")
      .select("post_id,user_id")
      .in(
        "post_id",
        postIds
      );

  if(!likeResult.error){

    likes =
      likeResult.data || [];

  }


  /* COMMENTS */

  let comments = [];

  const commentResult =
    await supabaseClient
      .from("post_comments")
      .select(`
        id,
        post_id,
        user_id,
        comment,
        created_at
      `)
      .in(
        "post_id",
        postIds
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(!commentResult.error){

    comments =
      commentResult.data || [];

  }


  /* PROFILE IDS */

  const profileIds =
    [
      ...new Set(
        [
          ...likes.map(x => x.user_id),
          ...comments.map(x => x.user_id),
          userId
        ]
      )
    ];

  let profiles = [];

  if(profileIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          profileIds
        );

    if(!result.error){

      profiles =
        result.data || [];

    }

  }


  const profileMap = {};

  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] =
      profile;

    }
  );


  const likeCount = {};
  const commentCount = {};

  likes.forEach(
    like => {

      likeCount[
        like.post_id
      ] =
      (likeCount[like.post_id] || 0) + 1;

    }
  );

  comments.forEach(
    comment => {

      commentCount[
        comment.post_id
      ] =
      (commentCount[comment.post_id] || 0) + 1;

    }
  );


  const totalLikes =
    likes.length;

  document.getElementById(
    "likesCount"
  ).textContent =
    totalLikes;


  feed.innerHTML = "";


  posts.forEach(
    post => {

      const username =
        profileMap[userId]?.username ||
        currentSession.user.email?.split("@")[0] ||
        "User";

      const avatar =
        profileMap[userId]?.avatar_url ||
        "";

      const initial =
        username.charAt(0).toUpperCase();

      const liked =
        likes.some(
          like =>
            like.post_id === post.id &&
            like.user_id === userId
        );

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "post-card";

      card.innerHTML = `

        <div class="post-header">

          ${
            avatar
            ?
            `<img
              class="post-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="post-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="post-user-info">

            <div class="post-name">
              ${escapeHtml(username)}
            </div>

            <div class="post-handle">
              @${escapeHtml(username)}
            </div>

          </div>

          <div class="post-time">
            ${escapeHtml(
              formatPostTime(
                post.created_at
              )
            )}
          </div>

        </div>

        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>

        ${
          post.visibility === "private"
          ?
          `<div class="private-badge">
            🔒 Private
          </div>`
          :
          `<div class="private-badge">
            🌍 Public
          </div>`
        }

        <div class="post-actions">

          <button
            class="post-action ${liked ? "liked" : ""}"
            onclick="likePost('${escapeJs(post.id)}')">

            ${liked ? "❤️ Unlike" : "♡ Like"}

            <span>
              ${likeCount[post.id] || 0}
            </span>

          </button>

          <button
            class="post-action"
            onclick="focusComment('${escapeJs(post.id)}')">

            💬 Comment

            <span>
              ${commentCount[post.id] || 0}
            </span>

          </button>

          <button
            class="post-action"
            onclick="sharePost('${escapeJs(post.id)}')">

            ↗ Share

          </button>

          <button
            class="post-action"
            style="color:#e74c3c"
            onclick="deletePost('${escapeJs(post.id)}')">

            🗑 Delete

          </button>

        </div>

        <div
          id="comments-${escapeHtml(post.id)}"
          class="comments-box">

          ${renderComments(
            post.id,
            comments,
            profileMap
          )}

        </div>

      `;

      feed.appendChild(card);

    }
  );

}


/* ============================
   RENDER COMMENTS
============================ */

function renderComments(
  postId,
  comments,
  profileMap
){

  const postComments =
    comments.filter(
      comment =>
        String(comment.post_id) ===
        String(postId)
    );

  let html = "";

  postComments.forEach(
    comment => {

      const profile =
        profileMap[
          comment.user_id
        ] || {};

      const username =
        profile.username ||
        "User";

      const avatar =
        profile.avatar_url ||
        "";

      const initial =
        username.charAt(0).toUpperCase();

      html += `

        <div class="comment">

          ${
            avatar
            ?
            `<img
              class="comment-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="comment-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="comment-body">

            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(username)}
              </div>

              ${
                currentSession &&
                comment.user_id ===
                currentSession.user.id
                ?
                `<button
                  class="delete-comment"
                  onclick="deleteComment('${escapeJs(comment.id)}')">
                  Delete
                </button>`
                :
                ""
              }

            </div>

            <div class="comment-text">
              ${escapeHtml(
                comment.comment || ""
              )}
            </div>

          </div>

        </div>

      `;

    }
  );


  if(postComments.length > 3){

    html += `
      <button
        class="view-comments"
        onclick="viewAllComments('${escapeJs(postId)}')">
        View all ${postComments.length} comments
      </button>
    `;

  }


  html += `

    <div class="comment-input-row">

      <input
        id="comment-input-${escapeHtml(postId)}"
        class="comment-input"
        maxlength="500"
        placeholder="Write a comment..."
        onkeydown="
          if(event.key==='Enter'){
            sendComment('${escapeJs(postId)}')
          }
        ">

      <button
        class="comment-send"
        onclick="sendComment('${escapeJs(postId)}')">
        Send
      </button>

    </div>

  `;

  return html;

}


/* ============================
   LIKE
============================ */

async function likePost(postId){

  if(!currentSession){

    window.location.href =
      "login.html";

    return;

  }

  const userId =
    currentSession.user.id;

  const {
    data: existing
  } =
  await supabaseClient
    .from("post_likes")
    .select("post_id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();

  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        userId
      );

    if(error){

      alert(
        "Could not unlike: " +
        error.message
      );

      return;

    }

  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          userId

      });

    if(error){

      alert(
        "Could not like: " +
        error.message
      );

      return;

    }

  }

  await loadPosts();

}

/* ============================
   SEND COMMENT
============================ */

async function sendComment(postId){

  if(!currentSession){

    window.location.href =
      "login.html";

    return;

  }

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  if(!input){

    return;

  }

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  if(text.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }


  /*
    IMPORTANT:
    Your database uses the column "comment",
    not "content".
  */

  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentSession.user.id,

      comment:
        text

    });


  if(error){

    console.error(
      "Comment error:",
      error
    );

    alert(
      "Comment failed:\n" +
      error.message
    );

    return;

  }

  input.value = "";

  await loadPosts();

}

async function deleteComment(commentId){

  if(!currentSession){

    return;

  }

  const confirmed =
    confirm(

  if(!confirmed){

    return;

  }

  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .delete()
    .eq(
      "id",
      commentId
    )
    .eq(
      "user_id",
      currentSession.user.id
    );

  if(error){

    alert(
      "Could not delete comment:\n" +
      error.message
    );

    return;

  }

  await loadPosts();

}


/* ============================
   DELETE POST
============================ */

async function deletePost(postId){

  if(!currentSession){

    return;

  }

  const confirmed =
    confirm(
      "Delete this post?"
    );

  if(!confirmed){

    return;

  }


  /*
    Delete comments and likes first.
    RLS must allow the owner to delete them.
  */

  await supabaseClient
    .from("post_comments")
    .delete()
    .eq(
      "post_id",
      postId
    );


  await supabaseClient
    .from("post_likes")
    .delete()
    .eq(
      "post_id",
      postId
    );


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentSession.user.id
    );


  if(error){

    alert(
      "Could not delete post:\n" +
      error.message
    );

    return;

  }

  await loadPosts();

}

/* ============================
   SHARE
============================ */

async function sharePost(postId){

  const url =
    window.location.origin +
    "/index.html?post=" +
    encodeURIComponent(postId);

  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Post",

        text:
          "Check out this post.",

        url:
          url

      });

    }catch(error){

      console.log(error);

    }

    return;

  }

  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    alert(
      "Post link:\n" +
      url
    );

  }

}

/* ============================
   UPLOAD PHOTO
============================ */

async function uploadPhoto(event){

  const file =
    event.target.files[0];

  if(!file){

    return;

  }

  if(!file.type.startsWith("image/")){

    alert(
      "Please select an image."
    );

    return;

  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Image must be smaller than 5MB."
    );

    return;

  }

  /*
    This expects a Supabase Storage bucket
    named "avatars".
  */

  const userId =
    currentSession.user.id;

  const extension =
    file.name.split(".").pop();

  const path =
    userId +
    "/avatar." +
    extension;


  const {
    error: uploadError
  } =
  await supabaseClient.storage
    .from("avatars")
    .upload(
      path,
      file,
      {
        upsert:true,
        contentType:file.type
      }
    );


  if(uploadError){

    console.error(uploadError);

    alert(
      "Photo upload failed:\n" +
      uploadError.message
    );

    return;

  }


  const {
    data
  } =
  supabaseClient.storage
    .from("avatars")
    .getPublicUrl(path);


  const avatarUrl =
    data.publicUrl;


  const {
    error: updateError
  } =
  await supabaseClient
    .from("profiles")
    .update({
      avatar_url:
        avatarUrl
    })
    .eq(
      "id",
      userId
    );


  if(updateError){

    alert(
      "Could not save profile photo:\n" +
      updateError.message
    );

    return;

  }


  await loadProfile();

  alert(
    "Profile photo updated."
  );

}

  } =

    })
    .eq(
      "id",

    );

  if(error){

    alert(
      "Could not update profile:\n" +

    );

  }

  await loadProfile();

  alert(

  );

/* ============================
   FORMAT TIME
============================ */

function formatPostTime(dateString){

  const date =
    new Date(dateString);

  if(isNaN(date.getTime())){

    return "";

  }

  const now =
    new Date();

  const seconds =
    Math.floor(
      (now - date) / 1000
    );

  if(seconds < 60){

    return "now";

  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if(minutes < 60){

    return minutes + "m";

  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if(hours < 24){

    return hours + "h";

  }

  const days =
    Math.floor(
      hours / 24
    );

  if(days < 7){

    return days + "d";

  }

  return date.toLocaleDateString();

}


/* ============================
   ESCAPE HTML
============================ */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
    ? ""
    : String(text);

  return div.innerHTML;

}


/* ============================
   ESCAPE JS
============================ */

function escapeJs(text){

  return String(
    text || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
