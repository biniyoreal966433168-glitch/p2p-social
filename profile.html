<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f73"><title>Profile • P2P Social</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f5f7fb;color:#17212b;padding-bottom:75px}.wrap{max-width:600px;margin:auto;padding:12px}.card,.section{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.profile{text-align:center}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#dfe8e6;border:3px solid #087f73}.name{font-size:20px;font-weight:700;margin-top:8px}.username{font-size:13px;color:#68747c;margin-top:3px}.id{font-size:12px;color:#68747c;margin-top:6px}.bio{font-size:14px;color:#68747c;line-height:1.45;margin-top:9px;white-space:pre-wrap}.badges{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#eef1f3;color:#9aa3a8}.badge.on.level,.badge.on.verified,.badge.on.online{background:#e8f5f2;color:#087f73}.badge.on.basic{color:#68747c}.badge.on.merchant{background:#eef5ff;color:#2764b8}.badge.on.famous{background:#fff0f5;color:#b43b70}.badge.on.rich{background:#fff5df;color:#a86a00}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat,.box{background:#f5f7fb;border-radius:12px;padding:10px;text-align:center}.stat b,.box b{display:block;font-size:18px}.stat span,.box span{font-size:11px;color:#68747c}.actions,.nav{display:flex;gap:6px;margin-top:12px}.btn,.nav a{flex:1;border:0;border-radius:11px;padding:10px 4px;text-align:center;text-decoration:none;font-size:12px;font-weight:700}.main{background:#087f73;color:#fff}.light{background:#f5f7fb;color:#087f73}.title{font-size:16px;font-weight:700;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2;font-size:13px}.row:last-child{border:0}.value{font-weight:700;color:#087f73}.input{width:100%;border:1px solid #e1e6e8;border-radius:10px;padding:11px;margin-bottom:8px;outline:0}.hide{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e8ea;padding:7px;z-index:5}.nav a{color:#68747c}.nav a.active{color:#087f73}.qr{width:150px;height:150px;margin:10px auto;display:block}.empty{text-align:center;color:#89949b;padding:18px;font-size:13px}</style></head><body><main class="wrap"><div id="loading" class="card empty">Loading...</div><div id="page" class="hide"><section class="card profile"><img id="avatar" class="avatar"><div id="name" class="name"></div><div id="username" class="username"></div><div id="uid" class="id">ID:000000000000</div><div id="badges" class="badges"></div><div id="bio" class="bio"></div><div class="stats"><div class="stat"><b id="posts">0</b><span>Posts</span></div><div class="stat"><b id="followers">0</b><span>Followers</span></div><div class="stat"><b id="following">0</b><span>Following</span></div></div></section><section class="card"><div class="title">Balance</div><div class="grid"><div class="box"><span>USDT</span><b id="usdt">0</b></div><div class="box"><span>TON</span><b id="ton">0</b></div><div class="box"><span>Locked</span><b id="locked">0</b></div></div></section><section class="card"><div class="title">Deposit</div><select id="depositNetwork" class="input"><option value="TON">TON</option><option value="USDT">USDT</option></select><div class="row"><span>Address</span><b id="depositAddress" class="value">—</b></div><img id="qr" class="qr hide"><button id="depositBtn" class="btn main">Deposit Address</button></section><section class="card"><div class="title">Withdraw</div><select id="withdrawCurrency" class="input"><option value="TON">TON</option><option value="USDT">USDT</option></select><input id="withdrawAddress" class="input" placeholder="Address"><input id="withdrawAmount" class="input" type="number" step="any" placeholder="Amount"><button id="withdrawBtn" class="btn main">Withdraw</button></section><section class="card"><div class="title">Transfer</div><select id="transferCurrency" class="input"><option value="USDT">USDT</option><option value="TON">TON</option></select><input id="transferUser" class="input" placeholder="Username"><input id="transferAmount" class="input" type="number" step="any" placeholder="Amount"><button id="transferBtn" class="btn main">Transfer</button></section><section class="card"><div class="title">History</div><div class="actions"><button class="btn light" onclick="location.href='transfer-history.html'">Transfer</button><button class="btn light" onclick="location.href='deposit-history.html'">Deposit</button><button class="btn light" onclick="location.href='withdrawal-history.html'">Withdrawal</button></div></section><section class="card"><div class="title">P2P Market</div><div class="actions"><button class="btn light" onclick="location.href='live.html'">Buy</button><button class="btn light" onclick="location.href='wallet.html'">Sell</button><button class="btn light" onclick="location.href='p2p-orders.html'">My Orders</button></div></section><section class="card"><div class="title">Referral</div><div class="row"><span>Referral Code</span><b id="referral" class="value">—</b></div><div class="row"><span>Bonus Balance</span><b id="bonus" class="value">0 USDT</b></div></section><section class="card"><div class="title">Profile</div><input id="nameInput" class="input" placeholder="Name"><button id="saveName" class="btn main">Save Name</button><div class="row"><span>Username</span><b id="fixedUsername">—</b></div></section><section class="card"><div class="title">Support</div><button class="btn light" onclick="location.href='message.html'">Support P2P_Social_Admin</button></section></div></main><nav class="nav"><a href="index.html">🏠 Home</a><a href="live.html">🟢</a><a href="wallet.html">🔴</a><a href="message.html">💬 Messages</a><a href="profile.html" class="active">👤 Profile</a></nav><script>const S="https://mbsvuwrgigqfporxwpfr.supabase.co",K="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa",sb=supabase.createClient(S,K),$=x=>document.getElementById(x);let me,profile;async function auth(){let{data,error}=await sb.auth.getUser();if(error||!data.user)return location.href="index.html";me=data.user;await load()}async function load(){let{data:p,error}=await sb.from("profiles").select("*").eq("user_id",me.id).maybeSingle();if(error||!p)return $("loading").textContent="Profile not found";profile=p;let[{data:u},{data:f},{data:fo}]=await Promise.all([sb.from("usdt_balances").select("usdt_balance").eq("user_id",me.id).maybeSingle(),sb.from("followers").select("id").eq("following_id",me.id),sb.from("followers").select("id").eq("follower_id",me.id)]);let{data:posts}=await sb.from("posts").select("id").eq("user_id",me.id);$("avatar").src=p.avatar_url||"";$("name").textContent=p.name||p.full_name||p.display_name||p.username||"User";$("username").textContent="@"+(p.username||"");$("fixedUsername").textContent="@"+(p.username||"");$("nameInput").value=p.name||p.full_name||p.display_name||"";$("uid").textContent="ID:"+String(p.user_number||"0").replace(/\D/g,"").padStart(12,"0");$("bio").textContent=p.bio||"";$("posts").textContent=(posts||[]).length;$("followers").textContent=(f||[]).length;$("following").textContent=(fo||[]).length;$("usdt").textContent=Number(u?.usdt_balance||p.available_usdt||p.usdt_balance||0).toFixed(4);$("ton").textContent="Loading...";$("locked").textContent=Number(p.locked_usdt||0).toFixed(4);$("referral").textContent=p.referral_code||"—";$("bonus").textContent=Number(p.referral_bonus||p.bonus_usdt||0).toFixed(4)+" USDT";let spending=Number(p.spending||p.total_spending||p.spent||p.fee_spending||p.spending_usdt||0),level=spending>=1?Math.floor(Math.log2(spending))+1:1,followers=(f||[]).length,verified=String(p.verification_status||"").toLowerCase()==="verified"||!!p.kyc_verified,merchant=!!p.merchant||String(p.role||"").toLowerCase()==="merchant",famous=followers>=10,rich=spending>=10,last=p.last_seen||p.last_active||p.updated_at,online=last?Date.now()-new Date(last).getTime()<60000:true;$("badges").innerHTML=`<span class="badge on level">◇ Level: ${level}</span><span class="badge on basic">■ Basic</span><span class="badge ${verified?"on":""} verified">■ Verified</span><span class="badge ${merchant?"on":""} merchant">■ Merchant</span><span class="badge ${famous?"on":""} famous">♡ Famous</span><span class="badge ${rich?"on":""} rich">◆ Rich</span><span class="badge ${online?"on":""} online">● ${online?"Online":"Offline"}</span>`;await bicycle("balance");$("loading").style.display="none";$("page").classList.remove("hide")}async function bicycle(action,extra={}){try{let{data:{session}}=await sb.auth.getSession();if(!session)return;let r=await fetch(S+"/functions/v1/bicycle-api",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({action,user_id:me.id,...extra})}),j=await r.json();if(action==="balance"){let b=j.balance??j.data?.balance??j.result?.balance;if(b!==undefined)$("ton").textContent=(Number(b)/1e9).toFixed(4)}}catch(e){if(action==="balance")$("ton").textContent="0"}}$("depositBtn").onclick=async()=>{let currency=$("depositNetwork").value;$("depositAddress").textContent="Loading...";try{let{data:{session}}=await sb.auth.getSession(),r=await fetch(S+"/functions/v1/bicycle-api",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"address",user_id:me.id,currency})}),j=await r.json(),a=j.address||j.data?.address||j.result?.address||"—";$("depositAddress").textContent=a;if(a&&a!=="—"){$("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(a);$("qr").classList.remove("hide")}}catch(e){$("depositAddress").textContent="Failed"}};$("withdrawBtn").onclick=async()=>{let currency=$("withdrawCurrency").value,address=$("withdrawAddress").value.trim(),amount=Number($("withdrawAmount").value);if(!address||!amount)return alert("Enter address and amount");try{let{data:{session}}=await sb.auth.getSession(),r=await fetch(S+"/functions/v1/bicycle-api",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"withdraw",user_id:me.id,currency,address,amount})}),j=await r.json();alert(j.error||j.message||"Withdrawal submitted")}catch(e){alert("Withdrawal failed")}};$("transferBtn").onclick=async()=>{let currency=$("transferCurrency").value,username=$("transferUser").value.trim().replace(/^@/,""),amount=Number($("transferAmount").value);if(!username||!amount)return alert("Enter username and amount");let{data:u}=await sb.from("profiles").select("user_id,username").eq("username",username).maybeSingle();if(!u)return alert("User not found");try{let{error}=await sb.rpc("transfer_usdt_by_username",{p_username:username,p_amount:amount});if(currency==="TON")error=null;if(error)throw error;alert("Transfer submitted");load()}catch(e){alert(e.message||"Transfer failed")}};$("saveName").onclick=async()=>{let name=$("nameInput").value.trim();if(!name)return;let{error}=await sb.from("profiles").update({name}).eq("user_id",me.id);if(!error){profile.name=name;$("name").textContent=name}};auth();</script></body></html>
