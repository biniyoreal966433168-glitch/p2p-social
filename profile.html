<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile - P2P Social</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:21px;
  font-weight:bold;
}

.back-btn{
  border:none;
  background:rgba(255,255,255,.18);
  color:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:7px;
}

.header-btn{
  border:none;
  border-radius:9px;
  padding:8px 10px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn{
  background:white;
  color:#087f73;
}

.logout-btn{
  background:#e74c3c;
  color:white;
  display:none;
}

/* PROFILE */

.profile-card{
  background:white;
  margin:18px;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  text-align:center;
}

.profile-photo-wrap{
  position:relative;
  width:100px;
  height:100px;
  margin:0 auto 12px;
}

.profile-photo{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  border:4px solid #087f73;
}

.photo-edit{
  position:absolute;
  right:0;
  bottom:0;
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  cursor:pointer;
  font-size:16px;
}

#photoInput{
  display:none;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
}

.profile-handle{
  color:#7a8494;
  margin-top:4px;
  font-size:13px;
}

.profile-bio{
  color:#4d5868;
  font-size:14px;
  margin:12px auto;
  max-width:500px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user-id-box{
  background:#f5f7fb;
  padding:9px;
  border-radius:10px;
  margin:12px 0;
  font-size:11px;
  color:#687386;
  word-break:break-all;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:18px;
}

.stat{
  background:#f5f7fb;
  border-radius:12px;
  padding:12px 5px;
}

.stat strong{
  display:block;
  font-size:17px;
}

.stat span{
  display:block;
  color:#7a8494;
  font-size:11px;
  margin-top:4px;
}

.profile-buttons{
  display:flex;
  gap:9px;
  margin-top:17px;
}

.profile-buttons button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:11px;
  cursor:pointer;
  font-weight:bold;
}

.edit-btn{
  background:#087f73;
  color:white;
}

.settings-btn{
  background:#edf5f3;
  color:#087f73;
}

/* WALLET */

.wallet{
  margin:18px;
  background:linear-gradient(135deg,#172033,#29364f);
  color:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.wallet-title{
  font-size:13px;
  opacity:.8;
}

.wallet-balance{
  font-size:27px;
  font-weight:bold;
  margin:8px 0;
}

.wallet-row{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  font-size:14px;
}

.wallet button{
  width:100%;
  border:none;
  border-radius:10px;
  padding:11px;
  margin-top:16px;
  cursor:pointer;
  font-weight:bold;
}

/* CREATE POST */

section{
  padding:5px 18px 18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:19px;
}

.create-card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-text{
  width:100%;
  min-height:100px;
  resize:vertical;
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:14px;
}

.create-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.visibility{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:9px;
  padding:10px;
}

.create-post-btn{
  border:none;
  background:#087f73;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* POSTS */

.posts-feed{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.post-card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.post-user-info{
  flex:1;
  min-width:0;
}

.post-name{
  font-weight:bold;
  font-size:14px;
}

.post-handle{
  color:#7a8494;
  font-size:12px;
  margin-top:3px;
}

.post-time{
  color:#8a93a1;
  font-size:11px;
}

.post-menu{
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:18px;
}

.post-content{
  margin-top:13px;
  color:#303b4d;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.private-label{

  margin-top:9px;
  background:#fff4d6;
  color:#9a6a00;

  font-size:10px;
  font-weight:bold;
}

.post-actions{

  margin-top:15px;

}

.post-action{

  background:transparent;
  color:#687386;
  cursor:pointer;
  font-size:13px;
}

.post-action.liked{
  color:#e74c3c;
  font-weight:bold;
}

/* COMMENTS */

.comments-box{
  margin-top:13px;
  border-top:1px solid #edf0f4;
  padding-top:12px;
}

.comments-hidden{
  display:none;
}

.comment{

  gap:9px;
  margin-bottom:10px;
}

.comment-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#dfeeea;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
  overflow:hidden;
}

.comment-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.comment-body{
  background:#f5f7fb;
  border-radius:12px;
  padding:8px 11px;
  flex:1;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.comment-name{
  font-size:12px;
  font-weight:bold;
}

.comment-delete{
  border:none;
  background:transparent;
  color:#e74c3c;
  font-size:11px;
  cursor:pointer;
}

.comment-text{
  font-size:13px;
  color:#303b4d;
  margin-top:3px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-input-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:9px 11px;
  outline:none;
  font-size:13px;
}

.comment-send{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:0 13px;
  cursor:pointer;
  font-weight:bold;
}

.view-comments{
  border:none;
  background:transparent;
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:8px;
}

/* SETTINGS */

.settings-panel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:2000;
}

.settings-box{
  background:white;
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.settings-box h3{
  margin-bottom:15px;
}

.setting-item{
  width:100%;
  border:none;
  background:#f5f7fb;
  padding:14px;
  margin-bottom:8px;
  border-radius:11px;
  text-align:left;
  cursor:pointer;
}

.close-settings{
  background:#e74c3c;
  color:white;
}

/* NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

.loading,
.empty{
  background:white;
  padding:25px;
  border-radius:16px;
  text-align:center;
  color:#7b8492;
}

@media(max-width:450px){

  .profile-card,
  .wallet{
    margin:14px 12px;
  }

  section{
    padding-left:12px;
    padding-right:12px;
  }

  .stats{
    gap:5px;
  }

  .stat{
    padding:10px 3px;
  }

  .stat strong{
    font-size:15px;
  }

  .stat span{
    font-size:10px;
  }

  .post-actions{
    gap:10px;
  }
}

  </div></nav><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession = null;
let currentProfile = null;


/* =========================
   START
========================= */

async function startApp(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    goLogin();

    return;
  }

  currentSession =
    data.session;

  if(!currentSession){

    goLogin();

    return;
  }

  await loadProfile();
  await loadPosts();

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  const user =
    currentSession.user;

  document.getElementById(
    "userId"
  ).textContent =
    user.id;

  let profileResult =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(profileResult.error){

    console.error(
      "Profile error:",
      profileResult.error
    );

  }

  currentProfile =
    profileResult.data || {};

  const username =
    currentProfile.username ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";

  const bio =
    currentProfile.bio ||
    user.user_metadata?.bio ||
    "";

  const avatar =
    currentProfile.avatar_url ||
    user.user_metadata?.avatar_url ||
    "";

  document.getElementById(
    "profileName"
  ).textContent =
    username;

  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;

  document.getElementById(
    "profileBio"
  ).textContent =
    bio;

  setAvatar(
    document.getElementById("profilePhoto"),
    avatar,
    username
  );

  const balance =
    Number(
      currentProfile.balance
    ) || 0;

  document.getElementById(
    "balanceDisplay"
  ).textContent =
    balance.toLocaleString() +
    " ETB";

  document.getElementById(
    "etbDisplay"
  ).textContent =
    balance.toLocaleString(
      undefined,
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  if(!currentSession){
    return;
  }

  const feed =
    document.getElementById(
      "postsFeed"
    );

  feed.innerHTML =
    `<div class="loading">
      Loading posts...
    </div>`;

  const userId =
    currentSession.user.id;

  const {
    data: posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      content,
      created_at,
      visibility
    `)
    .eq(
      "user_id",
      userId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(
      "Posts error:",
      error
    );

    feed.innerHTML =
      `<div class="empty">
        Could not load posts.<br>
        <small>${escapeHtml(error.message)}</small>
      </div>`;

    return;
  }

  if(!posts || posts.length === 0){

    feed.innerHTML =
      `<div class="empty">
        You have not created any posts yet.
      </div>`;

    updateStats(0,0);

    return;
  }

  const postIds =
    posts.map(
      post => post.id
    );

  let likes = [];
  let comments = [];

  if(postIds.length){

    const likeResult =
      await supabaseClient
        .from("post_likes")
        .select(
          "post_id,user_id"
        )
        .in(
          "post_id",
          postIds
        );

    if(!likeResult.error){
      likes =
        likeResult.data || [];
    }

    const commentResult =
      await supabaseClient
        .from("post_comments")
        .select(
          "id,post_id,user_id,comment,created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );

    if(!commentResult.error){

      comments =
        commentResult.data || [];

    }else{

      console.error(
        "Comments error:",
        commentResult.error
      );

    }

  }

  const allUserIds =
    [
      ...new Set([
        ...posts.map(
          p => p.user_id
        ),
        ...comments.map(
          c => c.user_id
        )
      ])
    ];

  let profiles = [];

  if(allUserIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          allUserIds
        );

    if(!result.error){

      profiles =
        result.data || [];

    }

  }

  const profileMap = {};

  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] =
      profile;

    }
  );

  const likeCountMap = {};

  likes.forEach(
    like => {

      likeCountMap[
        like.post_id
      ] =
      (likeCountMap[
        like.post_id
      ] || 0) + 1;

    }
  );

  const commentCountMap = {};

  comments.forEach(
    comment => {

      commentCountMap[
        comment.post_id
      ] =
      (commentCountMap[
        comment.post_id
      ] || 0) + 1;

    }
  );

  const myLikes =
    new Set(
      likes
        .filter(
          like =>
            like.user_id === userId
        )
        .map(
          like =>
            like.post_id
        )
    );

  feed.innerHTML = "";

  posts.forEach(
    post => {

      const profile =
        profileMap[
          post.user_id
        ] ||
        currentProfile ||
        {};

      const username =
        profile.username ||
        "User";

      const avatar =
        profile.avatar_url ||
        "";

      const initial =
        username
          .charAt(0)
          .toUpperCase();

      const likesNumber =
        likeCountMap[
          post.id
        ] || 0;

      const commentsNumber =
        commentCountMap[
          post.id
        ] || 0;

      const liked =
        myLikes.has(
          post.id
        );

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "post-card";

      card.innerHTML = `

        <div class="post-header">

          ${
            avatar
            ?
            `<img
              class="post-avatar"
              src="${escapeHtml(avatar)}"
              alt="Profile">`
            :
            `<div class="post-avatar">
              ${escapeHtml(initial)}
            </div>`
          }

          <div class="post-user-info">

            <div class="post-name">
              ${escapeHtml(username)}
            </div>

            <div class="post-handle">
              @${escapeHtml(username)}
            </div>

          </div>

          <div class="post-time">
            ${escapeHtml(
              formatPostTime(
                post.created_at
              )
            )}
          </div>

          <button
            class="post-menu"
            onclick="deletePost('${escapeJs(post.id)}')">
            🗑️
          </button>

        </div>

        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>

        ${
          post.visibility === "private"
          ?
          `<div class="private-label">
            🔒 Private
          </div>`
          :
          ""
        }

        <div class="post-actions">

          <button
            class="post-action ${liked ? "liked" : ""}"
            onclick="likePost('${escapeJs(post.id)}')">

            ${liked ? "❤️ Liked" : "♡ Like"}

            <span>
              ${likesNumber}
            </span>

          </button>

          <button
            class="post-action"
            onclick="toggleComments('${escapeJs(post.id)}')">

            💬 Comments

            <span>
              ${commentsNumber}
            </span>

          </button>

          <button
            class="post-action"
            onclick="sharePost('${escapeJs(post.id)}')">

            ↗️ Share

          </button>

        </div>

        <div
          id="comments-${escapeHtml(post.id)}"
          class="comments-box">

          ${renderComments(
            post.id,
            comments,
            profileMap
          )}

        </div>
      `;

      feed.appendChild(card);

    }
  );

  updateStats(
    posts.length,
    likes.length
  );

}

/* =========================
   COMMENTS
========================= */

function renderComments(
  postId,
  comments,
  profileMap
){

  const postComments =
    comments.filter(
      comment =>
        String(comment.post_id) ===
        String(postId)
    );

  if(postComments.length === 0){

    return `
      <div style="
        color:#8a93a1;
        font-size:12px;
        margin-bottom:10px;">
        No comments yet.
      </div>

      ${commentInput(postId)}
    `;

  }

  const firstComment =
    postComments[0];

  let html =
    `<button
      class="view-comments"
      onclick="toggleAllComments('${escapeJs(postId)}')">
      View all ${postComments.length} comments
    </button>

    <div id="all-comments-${escapeHtml(postId)}"
         class="comments-hidden">`;

  postComments.forEach(
    comment => {

      const profile =
        profileMap[
          comment.user_id
        ] || {};

      const username =
        profile.username ||
        "User";

      const avatar =
        profile.avatar_url ||
        "";

      const initial =
        username
          .charAt(0)
          .toUpperCase();

      const canDelete =
        currentSession &&
        comment.user_id ===
        currentSession.user.id;

      html += `

        <div class="comment">

          <div class="comment-avatar">

            ${
              avatar
              ?
              `<img
                src="${escapeHtml(avatar)}"
                alt="Profile">`
              :
              escapeHtml(initial)
            }

          </div>

          <div class="comment-body">

            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(username)}
              </div>

              ${
                canDelete
                ?
                `<button
                  class="comment-delete"
                  onclick="deleteComment('${escapeJs(comment.id)}')">
                  Delete
                </button>`
                :
                ""
              }

            </div>

            <div class="comment-text">
              ${escapeHtml(
                comment.comment || ""
              )}
            </div>

          </div>

        </div>

      `;

    }
  );

  html +=
    `</div>` +
    commentInput(postId);

  return html;

}


function commentInput(postId){

  return `

    <div class="comment-input-row">

      <input
        id="comment-input-${escapeHtml(postId)}"
        class="comment-input"
        maxlength="500"
        placeholder="Write a comment..."
        onkeydown="
          if(event.key==='Enter'){
            sendComment('${escapeJs(postId)}')
          }">

      <button
        class="comment-send"
        onclick="sendComment('${escapeJs(postId)}')">
        Send
      </button>

    </div>

  `;

}


function toggleComments(postId){

  const box =
    document.getElementById(
      "comments-" + postId
    );

  if(!box){
    return;
  }

  box.classList.toggle(
    "comments-hidden"
  );

}


function toggleAllComments(postId){

  const box =
    document.getElementById(
      "all-comments-" + postId
    );

  if(!box){
    return;
  }

  box.classList.toggle(
    "comments-hidden"
  );

}


/* =========================
   SEND COMMENT
========================= */

async function sendComment(postId){

  if(!currentSession){

    alert(
      "Please login to comment."
    );

    goLogin();

    return;

  }

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  if(!input){
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  if(text.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }

  /*
    IMPORTANT:
    Your database uses the column:
    post_comments.comment
  */

  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentSession.user.id,

      comment:
        text

    });

  if(error){

    console.error(
      "Comment error:",
      error
    );

    alert(
      "Comment failed: " +
      error.message
    );

    return;

  }

  await loadPosts();

}

/* =========================

========================= */

async function likePost(postId){

  if(!currentSession){

    goLogin();

    return;

  }

  const userId =
    currentSession.user.id;

  const {
    data: existing,
    error: checkError
  } =
  await supabaseClient
    .from("post_likes")
    .select("post_id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();

  if(checkError){

    alert(
      "Like check failed: " +
      checkError.message
    );

    return;

  }

  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        userId
      );

    if(error){

      alert(
        "Unlike failed: " +
        error.message
      );

      return;

    }

  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          userId

      });

    if(error){

      alert(
        "Like failed: " +
        error.message
      );

      return;

    }

  }

  await loadPosts();

}

========================= */

async function sharePost(
  postId
){

  const url =
    window.location.origin +
    "/index.html?post=" +
    encodeURIComponent(
      postId
    );

  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Post",

        text:
          "Check out this post.",

        url:
          url

      });

    }catch(error){

      console.log(error);

    }

    return;

  }

  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    alert(
      url
    );

  }

}

async function uploadPhoto(event){

  if(!currentSession){
    return;
  }

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){

    alert(
      "Please select an image."
    );

    return;

  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Image must be smaller than 5 MB."
    );

    return;

  }

  const userId =
    currentSession.user.id;

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const filePath =
    userId +
    "/avatar." +
    extension;

  const {
    error: uploadError
  } =
  await supabaseClient.storage
    .from("avatars")
    .upload(
      filePath,
      file,
      {
        upsert:true,
        contentType:file.type
      }
    );

  if(uploadError){

    console.error(
      uploadError
    );

    alert(
      "Photo upload failed: " +
      uploadError.message
    );

    return;

  }

  const {
    data
  } =
  supabaseClient.storage
    .from("avatars")
    .getPublicUrl(
      filePath
    );

  const avatarUrl =
    data.publicUrl +
    "?t=" +
    Date.now();

  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({
      avatar_url:
        avatarUrl
    })
    .eq(
      "id",
      userId
    );

  if(error){

    alert(
      "Could not save profile photo: " +
      error.message
    );

    return;

  }

  document.getElementById(
    "profilePhoto"
  ).src =
    avatarUrl;

  await loadPosts();

  alert(
    "Profile photo updated."
  );

}

         width="200"
         height="200">

            height="100%"

/* =========================
   TIME
========================= */

function formatPostTime(
  dateString
){

  if(!dateString){
    return "";
  }

  const date =
    new Date(dateString);

  if(isNaN(
    date.getTime()
  )){
    return "";
  }

  const seconds =
    Math.floor(
      (new Date() - date) /
      1000
    );

  if(seconds < 60){
    return "now";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if(minutes < 60){
    return minutes + "m";
  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if(hours < 24){
    return hours + "h";
  }

  const days =
    Math.floor(
      hours / 24
    );

  if(days < 7){
    return days + "d";
  }

  return date.toLocaleDateString();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
    ? ""
    : String(text);

  return div.innerHTML;

}


/* =========================
   ESCAPE JS
========================= */

function escapeJs(text){

  return String(
    text || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
