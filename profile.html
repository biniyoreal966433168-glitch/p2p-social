<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - P2P Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
  padding-bottom:80px;
}

header{
  background:linear-gradient(135deg,#075e54,#087f73);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.back-btn{
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

.brand{
  font-size:20px;
  font-weight:bold;
}

.header-spacer{
  width:70px;
}

/* PROFILE */

.profile-card{
  background:white;
  margin:18px;
  padding:22px 16px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  text-align:center;
}

.profile-photo-wrap{
  position:relative;
  width:105px;
  height:105px;
  margin:0 auto 12px;
}

.profile-photo{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  border:4px solid white;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.photo-btn{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#087f73;
  color:white;
  cursor:pointer;
  font-size:16px;
}

#photoInput{
  display:none;
}

.profile-name{
  font-size:22px;
  font-weight:bold;
}

.profile-handle{
  color:#7b8492;
  font-size:13px;
  margin-top:4px;
}

.profile-bio{
  color:#4c5666;
  font-size:14px;
  margin:12px auto;
  max-width:500px;
  line-height:1.5;
  white-space:pre-wrap;
}

.profile-id{
  color:#8a93a1;
  font-size:11px;
  word-break:break-all;
  margin-top:8px;
}

.profile-buttons{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-top:15px;
  flex-wrap:wrap;
}

.profile-buttons button{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.edit-btn{
  background:#087f73;
  color:white;
}

.settings-btn{
  background:#eef2f5;
  color:#172033;
}

.wallet-btn{
  background:#172033;
  color:white;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:20px;
  border-top:1px solid #edf0f4;
  padding-top:17px;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat span{
  color:#7b8492;
  font-size:11px;
  margin-top:4px;
  display:block;
}

/* CREATE POST */

.create-box{
  background:white;
  margin:0 18px 18px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.create-title{
  font-weight:bold;
  margin-bottom:10px;
}

textarea{
  width:100%;
  min-height:100px;
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  resize:vertical;
  outline:none;
  font-size:14px;
}

.create-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.visibility{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:10px;
  background:white;
}

.create-post-btn{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
}

/* POSTS */

.posts-section{
  padding:0 18px;
}

.posts-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.posts-title h2{
  font-size:19px;
}

.refresh{
  color:#087f73;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.post-card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#dfeeea;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
}

.post-user{
  flex:1;
}

.post-name{
  font-weight:bold;
  font-size:14px;
}

.post-handle{
  color:#7b8492;
  font-size:12px;
  margin-top:3px;
}

.post-time{
  color:#8a93a1;
  font-size:11px;
}

.visibility-label{
  color:#087f73;
  font-size:11px;
  margin-top:4px;
}

.post-content{
  margin-top:13px;
  font-size:14px;
  line-height:1.55;
  color:#303b4d;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:15px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #edf0f4;
  flex-wrap:wrap;
}

.post-action{
  border:none;
  background:transparent;
  color:#687386;
  cursor:pointer;
  font-size:13px;
}

.post-action.liked{
  color:#e74c3c;
  font-weight:bold;
}

.delete-btn{
  color:#e74c3c;
}

/* COMMENTS */

.comments-box{
  margin-top:12px;
  border-top:1px solid #edf0f4;
  padding-top:12px;
}

.comment-toggle{
  border:none;
  background:transparent;
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  padding:5px 0;
}

.comments-list{
  margin-top:8px;
}

.comment{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.comment-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#dfeeea;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#087f73;
  font-weight:bold;
  flex-shrink:0;
  overflow:hidden;
}

.comment-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.comment-body{
  background:#f5f7fb;
  border-radius:12px;
  padding:8px 10px;
  flex:1;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.comment-name{
  font-size:12px;
  font-weight:bold;
}

.comment-delete{
  border:none;
  background:transparent;
  color:#e74c3c;
  font-size:11px;
  cursor:pointer;
}

.comment-text{
  font-size:13px;
  margin-top:3px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-input-row{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.comment-input{
  flex:1;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:9px;
  outline:none;
  font-size:13px;
}

.comment-send{
  border:none;
  background:#087f73;
  color:white;
  border-radius:10px;
  padding:0 13px;
  cursor:pointer;
  font-weight:bold;
}

.view-all{
  color:#087f73;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:16px;
  padding:25px;
  text-align:center;
  color:#7b8492;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  text-align:center;
  color:#777;
  font-size:11px;
  cursor:pointer;
}

.nav-item span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087f73;
  font-weight:bold;
}

/* EDIT MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-content{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:18px;
  padding:20px;
}

.modal-content h2{
  margin-bottom:15px;
}

.modal-content label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px;
}

.modal-content input,
.modal-content textarea{
  width:100%;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:11px;
  outline:none;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-actions button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:11px;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  background:#087f73;
  color:white;
}

.cancel-btn{
  background:#eef2f5;
}

/* SETTINGS */

.settings-list{
  margin-top:10px;
}

.settings-item{
  width:100%;
  border:none;
  background:#f5f7fb;
  padding:13px;
  border-radius:10px;
  text-align:left;
  margin-bottom:8px;
  cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:450px){

  .profile-card{
    margin:15px 12px;
  }

  .create-box,
  .posts-section{
    margin-left:12px;
    margin-right:12px;
  }

  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .stat strong{
    font-size:16px;
  }

  .stat span{
    font-size:10px;
  }

  .post-actions{
    gap:10px;
  }

  .post-action{
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="top">

    <button class="back-btn" onclick="goHome()">
      ← Home
    </button>

    <div class="brand">
      Profile
    </div>

    <div class="header-spacer"></div>

  </div>
</header>


<!-- PROFILE -->
<div class="profile-card">

  <div class="profile-photo-wrap">

    <img
      id="profilePhoto"
      class="profile-photo"
      src=""
      alt="Profile photo"
    >

    <button
      class="photo-btn"
      onclick="changePhoto()">
      📷
    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      onchange="uploadProfilePhoto(event)"
    >

  </div>

  <div
    id="profileName"
    class="profile-name">
    Loading...
  </div>

  <div
    id="profileHandle"
    class="profile-handle">
    @user
  </div>

  <div
    id="profileBio"
    class="profile-bio">
  </div>

  <div
    id="profileId"
    class="profile-id">
  </div>

  <div class="profile-buttons">

    <button
      class="edit-btn"
      onclick="openEditProfile()">
      ✏️ Edit Profile
    </button>

    <button
      class="settings-btn"
      onclick="openSettings()">
      ⚙️ Settings
    </button>

    <button
      class="wallet-btn"
      onclick="openWallet()">
      💰 Wallet
    </button>

  </div>

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <strong id="postCount">0</strong>
      <span>Posts</span>
    </div>

    <div class="stat">
      <strong id="followersCount">0</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong id="followingCount">0</strong>
      <span>Following</span>
    </div>

    <div class="stat">
      <strong id="likesCount">0</strong>
      <span>Likes</span>
    </div>

  </div>

</div>


<!-- CREATE POST -->

<div class="create-box">

  <div class="create-title">
    📝 Create Post
  </div>

  <textarea
    id="postContent"
    maxlength="5000"
    placeholder="What do you want to share?">
  </textarea>

  <div class="create-row">

    <select
      id="postVisibility"
      class="visibility">

      <option value="public">
        🌎 Public
      </option>

      <option value="private">
        🔒 Private
      </option>

    </select>

    <button
      class="create-post-btn"
      onclick="createPost()">
      Post
    </button>

  </div>

</div>


<!-- POSTS -->

<section class="posts-section">

  <div class="posts-title">

    <h2>
      📝 Your Posts
    </h2>

    <span
      class="refresh"
      onclick="loadProfileData()">
      Refresh
    </span>

  </div>

  <div id="postsFeed">

    <div class="empty">
      Loading posts...
    </div>

  </div>

</section>


<!-- EDIT MODAL -->

<div
  id="editModal"
  class="modal">

  <div class="modal-content">

    <h2>
      ✏️ Edit Profile
    </h2>

    <label>
      Username
    </label>

    <input
      id="editUsername"
      maxlength="50"
      placeholder="Username"
    >

    <label>
      Bio
    </label>

    <textarea
      id="editBio"
      maxlength="300"
      placeholder="Your bio">
    </textarea>

    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeEditProfile()">
        Cancel
      </button>

      <button
        class="save-btn"
        onclick="saveProfile()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- SETTINGS MODAL -->

<div
  id="settingsModal"
  class="modal">

  <div class="modal-content">

    <h2>
      ⚙️ Settings
    </h2>

    <div class="settings-list">

      <button
        class="settings-item"
        onclick="alert('Account settings can be added here.')">
        👤 Account Settings
      </button>

      <button
        class="settings-item"
        onclick="alert('Privacy settings can be added here.')">
        🔒 Privacy
      </button>

      <button
        class="settings-item"
        onclick="logout()">
        🚪 Logout
      </button>

    </div>

    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="closeSettings()">
        Close
      </button>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div
    class="nav-item"
    onclick="goHome()">

    <span>🏠</span>
    Home

  </div>

  <div
    class="nav-item"
    onclick="protectedFeature('Live')">

    <span>🔴</span>
    Live

  </div>

  <div
    class="nav-item"
    onclick="openWallet()">

    <span>🔄</span>
    P2P

  </div>

  <div
    class="nav-item"
    onclick="protectedFeature('Messages')">

    <span>💬</span>
    Messages

  </div>

  <div
    class="nav-item active"
    onclick="window.scrollTo({top:0,behavior:'smooth'})">

    <span>👤</span>
    Profile

  </div>

</nav>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession = null;

let profileData = null;


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function defaultAvatar(username){

  const name =
    username ||
    "User";

  return (
    "https://ui-avatars.com/api/?" +
    "name=" +
    encodeURIComponent(name) +
    "&background=dfeeea&color=087f73"
  );

}


/* =====================================================
   LOGIN
===================================================== */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error){

    console.error(error);

    alert("Could not check login.");

    return false;

  }

  currentSession =
    data.session;

  if(!currentSession){

    alert("Please login first.");

    window.location.href =
      "login.html";

    return false;

  }

  return true;

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  const userId =
    currentSession.user.id;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,bio,avatar_url,balance"
    )
    .eq(
      "id",
      userId
    )
    .maybeSingle();


  if(error){

    console.error(
      "Profile error:",
      error
    );

  }


  profileData =
    data || {

      id:userId,

      username:
        currentSession.user.user_metadata?.username ||
        currentSession.user.email?.split("@")[0] ||
        "User",

      bio:"",

      avatar_url:""

    };


  renderProfile();

}


/* =====================================================
   RENDER PROFILE
===================================================== */

function renderProfile(){

  const username =
    profileData.username ||
    "User";


  document.getElementById(
    "profileName"
  ).textContent =
    username;


  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;


  document.getElementById(
    "profileBio"
  ).textContent =
    profileData.bio ||
    "No bio yet.";


  document.getElementById(
    "profileId"
  ).textContent =
    "User ID: " +
    profileData.id;


  document.getElementById(
    "editUsername"
  ).value =
    username;


  document.getElementById(
    "editBio"
  ).value =
    profileData.bio ||
    "";


  const photo =
    profileData.avatar_url ||
    defaultAvatar(username);


  document.getElementById(
    "profilePhoto"
  ).src =
    photo;

}


/* =====================================================
   LOAD PROFILE DATA
===================================================== */

async function loadProfileData(){

  if(!currentSession){

    return;

  }


  await loadProfile();

  await loadMyPosts();

  await loadStats();

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadMyPosts(){

  const feed =
    document.getElementById(
      "postsFeed"
    );


  feed.innerHTML =
    `<div class="empty">Loading posts...</div>`;


  const userId =
    currentSession.user.id;


  /*
     We try visibility first.

     If your posts table does not have a
     visibility column, the fallback loads
     the normal post columns.
  */

  let result =
    await supabaseClient
      .from("posts")
      .select(
        "id,user_id,content,created_at,visibility"
      )
      .eq(
        "user_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.warn(
      "Visibility column unavailable:",
      result.error.message
    );


    result =
      await supabaseClient
        .from("posts")
        .select(
          "id,user_id,content,created_at"
        )
        .eq(
          "user_id",
          userId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );

  }


  if(result.error){

    console.error(
      "Posts error:",
      result.error
    );


    feed.innerHTML =
      `<div class="empty">
        Could not load your posts.<br>
        <small>${escapeHtml(result.error.message)}</small>
      </div>`;

    return;

  }


  const posts =
    result.data || [];


  if(posts.length === 0){

    feed.innerHTML =
      `<div class="empty">
        You have not created any posts yet.
      </div>`;

    return;

  }


  await renderPosts(posts);

}


/* =====================================================
   LOAD POST LIKE + COMMENT DATA
===================================================== */

async function renderPosts(posts){

  const feed =
    document.getElementById(
      "postsFeed"
    );


  feed.innerHTML =
    "";


  const postIds =
    posts.map(
      post => post.id
    );


  let likes = [];
  let comments = [];


  if(postIds.length > 0){

    const likeResult =
      await supabaseClient
        .from("post_likes")
        .select(
          "post_id,user_id"
        )
        .in(
          "post_id",
          postIds
        );


    if(!likeResult.error){

      likes =
        likeResult.data || [];

    }


    const commentResult =
      await supabaseClient
        .from("post_comments")
        .select(
          "id,post_id,user_id,comment,content,created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(!commentResult.error){

      comments =
        commentResult.data || [];

    }

  }


  /*
     Get profiles for commenters.
  */

  const userIds =
    [
      ...new Set(
        comments.map(
          c => c.user_id
        )
      )
    ];


  if(currentSession){

    userIds.push(
      currentSession.user.id
    );

  }


  let profiles = [];


  if(userIds.length > 0){

    const profileResult =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          [...new Set(userIds)]
        );


    if(!profileResult.error){

      profiles =
        profileResult.data || [];

    }

  }


  const profileMap = {};


  profiles.forEach(
    profile => {

      profileMap[
        profile.id
      ] =
      profile;

    }
  );


  posts.forEach(
    post => {

      const postLikes =
        likes.filter(
          like =>
            String(like.post_id) ===
            String(post.id)
        );


      const postComments =
        comments.filter(
          comment =>
            String(comment.post_id) ===
            String(post.id)
        );


      const liked =
        currentSession
        &&
        postLikes.some(
          like =>
            like.user_id ===
            currentSession.user.id
        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "post-card";


      const username =
        profileData?.username ||
        "User";


      const avatar =
        profileData?.avatar_url ||
        defaultAvatar(username);


      const visibility =
        post.visibility ||
        "public";


      card.innerHTML = `

        <div class="post-header">

          <img
            class="post-avatar"
            src="${escapeHtml(avatar)}"
            alt="Profile">

          <div class="post-user">

            <div class="post-name">
              ${escapeHtml(username)}
            </div>

            <div class="post-handle">
              @${escapeHtml(username)}
            </div>

            <div class="visibility-label">
              ${
                visibility === "private"
                ? "🔒 Private"
                : "🌎 Public"
              }
            </div>

          </div>

          <div class="post-time">
            ${escapeHtml(
              formatPostTime(
                post.created_at
              )
            )}
          </div>

        </div>

        <div class="post-content">
          ${escapeHtml(
            post.content || ""
          )}
        </div>

        <div class="post-actions">

          <button
            class="post-action ${liked ? "liked" : ""}"
            onclick="likePost('${escapeJs(post.id)}')">

            ${liked ? "❤️ Liked" : "♡ Like"}

            <span>
              ${postLikes.length}
            </span>

          </button>

          <button
            class="post-action"
            onclick="toggleComments('${escapeJs(post.id)}')">

            💬 Comments

            <span>
              ${postComments.length}
            </span>

          </button>

          <button
            class="post-action"
            onclick="sharePost('${escapeJs(post.id)}')">

            ↗ Share

          </button>

          <button
            class="post-action delete-btn"
            onclick="deletePost('${escapeJs(post.id)}')">

            🗑️ Delete

          </button>

        </div>

        <div
          id="comments-${escapeHtml(post.id)}"
          class="comments-box">

          ${renderComments(
            post.id,
            postComments,
            profileMap
          )}

        </div>

      `;


      feed.appendChild(card);

    }

  );


  /*
     Comments start minimized.
  */

  posts.forEach(
    post => {

      const box =
        document.getElementById(
          "comments-" +
          post.id
        );

      if(box){

        box.style.display =
          "none";

      }

    }
  );

}


/* =====================================================
   COMMENTS
===================================================== */

function renderComments(
  postId,
  comments,
  profileMap
){

  const total =
    comments.length;


  let html = `

    <button
      class="comment-toggle"
      onclick="toggleComments('${escapeJs(postId)}')">

      💬 ${
        total > 0
        ? total + " comment" + (total === 1 ? "" : "s")
        : "Comments"
      }

    </button>

    <div
      class="comments-list">

  `;


  /*
     Show only latest 2 comments initially.
  */

  const visible =
    comments.slice(-2);


  visible.forEach(
    comment => {

      html +=
        renderSingleComment(
          comment,
          profileMap
        );

    }
  );


  if(total > 2){

    html += `

      <div
        class="view-all"
        onclick="showAllComments('${escapeJs(postId)}')">

        View all ${total} comments

      </div>

    `;

  }


  html += `

    </div>

    <div class="comment-input-row">

      <input
        id="comment-input-${escapeHtml(postId)}"
        class="comment-input"
        maxlength="500"
        placeholder="Write a comment..."
        onkeydown="if(event.key==='Enter'){sendComment('${escapeJs(postId)}')}">

      <button
        class="comment-send"
        onclick="sendComment('${escapeJs(postId)}')">

        Send

      </button>

    </div>

  `;


  return html;

}


/* =====================================================
   SINGLE COMMENT
===================================================== */

function renderSingleComment(
  comment,
  profileMap
){

  const profile =
    profileMap[
      comment.user_id
    ] || {};


  const username =
    profile.username ||
    "User";


  const avatar =
    profile.avatar_url ||
    defaultAvatar(username);


  /*
     Your database currently uses "comment".
     Older versions used "content".

     This supports both.
  */

  const text =
    comment.comment ??
    comment.content ??
    "";


  const own =
    currentSession &&
    comment.user_id ===
    currentSession.user.id;


  return `

    <div class="comment">

      <div class="comment-avatar">

        <img
          src="${escapeHtml(avatar)}"
          alt="Profile">

      </div>

      <div class="comment-body">

        <div class="comment-top">

          <div class="comment-name">
            ${escapeHtml(username)}
          </div>

          ${
            own
            ?
            `<button
              class="comment-delete"
              onclick="deleteComment('${escapeJs(comment.id)}')">
              Delete
            </button>`
            :
            ""
          }

        </div>

        <div class="comment-text">
          ${escapeHtml(text)}
        </div>

      </div>

    </div>

  `;

}

/* =====================================================
   VIEW ALL COMMENTS
===================================================== */

async function showAllComments(postId){

  const box =
    document.getElementById(
      "comments-" +
      postId
    );


  if(!box){

    return;

  }


  const {
    data: comments,
    error
  } =
  await supabaseClient
    .from("post_comments")
    .select(
      "id,post_id,user_id,comment,content,created_at"
    )
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    alert(
      "Could not load comments: " +
      error.message
    );

    return;

  }


  const userIds =
    [
      ...new Set(
        (comments || []).map(
          c => c.user_id
        )
      )
    ];


  let profiles = [];


  if(userIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url"
        )
        .in(
          "id",
          userIds
        );


    if(!result.error){

      profiles =
        result.data || [];

    }

  }


  const profileMap = {};


  profiles.forEach(
    p => {

      profileMap[p.id] =
        p;

    }
  );


  box.innerHTML = `

    <button
      class="comment-toggle"
      onclick="toggleComments('${escapeJs(postId)}')">

      🔼 Hide Comments

    </button>

    <div class="comments-list">

      ${
        (comments || [])
        .map(
          comment =>
            renderSingleComment(
              comment,
              profileMap
            )
        )
        .join("")
      }

    </div>

    <div class="comment-input-row">

      <input
        id="comment-input-${escapeHtml(postId)}"
        class="comment-input"
        maxlength="500"
        placeholder="Write a comment..."
        onkeydown="if(event.key==='Enter'){sendComment('${escapeJs(postId)}')}">

      <button
        class="comment-send"
        onclick="sendComment('${escapeJs(postId)}')">
        Send
      </button>

    </div>

  `;


  box.style.display =
    "block";

}


/* =====================================================
   SEND COMMENT
===================================================== */

async function sendComment(postId){

  if(!currentSession){

    alert(
      "Please login to comment."
    );

    return;

  }


  const input =
    document.getElementById(
      "comment-input-" +
      postId
    );


  if(!input){

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(text.length > 500){

    alert(
      "Comment is too long."
    );

    return;

  }


  /*
     IMPORTANT:
     Your current database has a NOT NULL
     column named "comment".

     Therefore we insert into "comment",
     not "content".
  */

  const {
    error
  } =
  await supabaseClient
    .from("post_comments")
    .insert({

      post_id:
        postId,

      user_id:
        currentSession.user.id,

      comment:
        text

    });


  if(error){

    console.error(
      "Comment error:",
      error
    );


    alert(
      "Comment failed:\n" +
      error.message
    );

    return;

  }


  input.value =
    "";


  await loadMyPosts();

}

/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

  if(!currentSession){

    alert(
      "Please login to like posts."
    );

    return;

  }


  const userId =
    currentSession.user.id;


  const {
    data: existing,
    error: checkError
  } =
  await supabaseClient
    .from("post_likes")
    .select(
      "post_id"
    )
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();


  if(checkError){

    alert(
      "Like failed:\n" +
      checkError.message
    );

    return;

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        userId
      );


    if(error){

      alert(
        "Unlike failed:\n" +
        error.message
      );

      return;

    }

  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:
          postId,

        user_id:
          userId

      });


    if(error){

      alert(
        "Like failed:\n" +
        error.message
      );

      return;

    }

  }


  await loadProfileData();

}

/* =====================================================
   PROFILE PHOTO
===================================================== */

async function uploadProfilePhoto(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  if(!file.type.startsWith("image/")){

    alert(
      "Please choose an image."
    );

    return;

  }


  if(file.size > 5 * 1024 * 1024){

    alert(
      "Image must be smaller than 5MB."
    );

    return;

  }


  const userId =
    currentSession.user.id;


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    userId +
    "/profile." +
    extension;


  /*
     This assumes you created a Supabase Storage
     bucket named "avatars".
  */

  const {
    error:uploadError
  } =
  await supabaseClient.storage
    .from("avatars")
    .upload(
      filePath,
      file,
      {
        upsert:true,
        contentType:file.type
      }
    );


  if(uploadError){

    console.error(
      "Upload error:",
      uploadError
    );


    alert(
      "Photo upload failed:\n" +
      uploadError.message +
      "\n\nMake sure the 'avatars' storage bucket exists."
    );

    return;

  }


  const {
    data
  } =
  supabaseClient.storage
    .from("avatars")
    .getPublicUrl(
      filePath
    );


  const avatarUrl =
    data.publicUrl;


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({

      avatar_url:
        avatarUrl

    })
    .eq(
      "id",
      userId
    );


  if(error){

    alert(
      "Could not save profile photo:\n" +
      error.message
    );

    return;

  }


  profileData.avatar_url =
    avatarUrl;


  renderProfile();

  await loadMyPosts();


  alert(
    "Profile photo updated."
  );

}

/* =====================================================

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    encodeURIComponent(
      postId
    );


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Post",

        text:
          "Check out this post.",

        url:
          url

      });

    }catch(error){

      console.log(error);

    }

    return;

  }


  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    alert(
      "Post link:\n" +
      url
    );

  }

}

  } =

    .select(

    )
    .eq(

    );

/* =====================================================
   FORMAT TIME
===================================================== */

function formatPostTime(dateString){

  if(!dateString){

    return "";

  }


  const date =
    new Date(dateString);


  if(isNaN(
    date.getTime()
  )){

    return "";

  }


  const seconds =
    Math.floor(
      (Date.now() - date.getTime()) /
      1000
    );


  if(seconds < 60){

    return "now";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if(minutes < 60){

    return minutes + "m";

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if(hours < 24){

    return hours + "h";

  }


  const days =
    Math.floor(
      hours / 24
    );


  if(days < 7){

    return days + "d";

  }


  return date.toLocaleDateString();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
    ? ""
    : String(text);


  return div.innerHTML;

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(text){

  return String(
    text || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
