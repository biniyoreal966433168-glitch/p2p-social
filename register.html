<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#087f73">

  <meta name="mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <title>Register - P2P Social</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      background:#f4f7f8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:white;
      padding:28px;
      border-radius:20px;
      box-shadow:0 8px 30px rgba(0,0,0,.10);
    }

    /* =========================
       P2P SOCIAL LOGO
       EXISTING LOGO PRESERVED
    ========================= */

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:22px;
    }

    .icon{
      width:68px;
      height:68px;
      border-radius:22px;

      background:
        linear-gradient(
          135deg,
          #064e46,
          #10a889
        );

      position:relative;

      display:flex;
      justify-content:center;
      align-items:center;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.16);

      flex-shrink:0;
    }

    .p-left{
      position:absolute;

      left:12px;
      top:16px;

      width:21px;
      height:36px;

      border:6px solid white;
      border-right:0;

      border-radius:
        13px 0 0 13px;
    }

    .p-right{
      position:absolute;

      right:12px;
      top:16px;

      width:21px;
      height:36px;

      border:6px solid white;
      border-left:0;

      border-radius:
        0 13px 13px 0;
    }

    .center{
      width:18px;
      height:18px;

      background:white;

      border-radius:50%;

      position:absolute;

      display:flex;
      justify-content:center;
      align-items:center;

      z-index:5;
    }

    .dot{
      width:6px;
      height:6px;

      background:#087f73;

      border-radius:50%;
    }

    .text h1{
      font-size:22px;
      font-weight:800;
      color:#172033;
    }

    .text h1 span{
      color:#087f73;
    }

    .text p{
      margin-top:4px;
      font-size:9px;
      color:#7b8491;
      letter-spacing:.6px;
    }

    /* =========================
       REGISTER TITLE
    ========================= */

    .register-title{
      text-align:center;
      color:#075e54;
      margin-bottom:7px;
      font-size:25px;
    }

    .subtitle{
      text-align:center;
      color:#777;
      margin-bottom:25px;
      font-size:14px;
    }

    /* =========================
       FORM
    ========================= */

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      font-size:14px;
      color:#172033;
    }

    input{
      width:100%;
      padding:13px;

      border:1px solid #ddd;
      border-radius:10px;

      margin-bottom:16px;

      font-size:15px;
      outline:none;
      background:white;
    }

    input:focus{
      border-color:#087f73;

      box-shadow:
        0 0 0 2px
        rgba(8,127,115,.08);
    }

    #registerButton{
      width:100%;

      padding:13px;

      border:none;
      border-radius:10px;

      font-size:16px;
      font-weight:bold;

      cursor:pointer;

      transition:.2s;

      background:#087f73;
      color:white;
    }

    #registerButton:hover{
      background:#075e54;
    }

    #registerButton:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    #registerButton:active{
      transform:scale(.98);
    }

    /* =========================
       MESSAGE
    ========================= */

    #message{
      text-align:center;

      margin-top:15px;

      min-height:20px;

      font-size:14px;

      line-height:1.4;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-link{
      text-align:center;

      margin-top:20px;

      font-size:14px;

      color:#555;
    }

    .login-link a{
      color:#087f73;

      font-weight:bold;

      text-decoration:none;
    }

    .login-link a:hover{
      text-decoration:underline;
    }

    /* =========================
       BACK HOME
    ========================= */

    .back{
      display:block;

      text-align:center;

      margin-top:15px;

      color:#777;

      text-decoration:none;

      font-size:13px;
    }

    .back:hover{
      color:#087f73;
    }

    /* =========================
       SECURITY NOTE
    ========================= */

    .security-note{
      margin-top:18px;

      text-align:center;

      color:#7b8491;

      font-size:11px;

      line-height:1.5;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:450px){

      body{
        padding:15px;
      }

      .container{
        padding:24px 20px;
        border-radius:18px;
      }

      .brand{
        gap:10px;
      }

      .icon{
        width:62px;
        height:62px;
        border-radius:20px;
      }

      .p-left,
      .p-right{
        top:14px;
        height:34px;
      }

      .p-left{
        left:11px;
      }

      .p-right{
        right:11px;
      }

      .center{
        width:17px;
        height:17px;
      }

      .dot{
        width:6px;
        height:6px;
      }

      .text h1{
        font-size:20px;
      }

      .text p{
        font-size:8px;
      }

      .register-title{
        font-size:23px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- =========================
       P2P SOCIAL LOGO
       EXISTING LOGO PRESERVED
  ========================== -->

  <div class="brand">

    <div class="icon">

      <div class="p-left"></div>

      <div class="p-right"></div>

      <div class="center">

        <div class="dot"></div>

      </div>

    </div>

    <div class="text">

      <h1>
        P2P <span>Social</span>
      </h1>

      <p>
        CONNECT • TRADE • SHARE
      </p>

    </div>

  </div>


  <!-- =========================
       REGISTER
  ========================== -->

  <h1 class="register-title">
    Create Account
  </h1>

  <p class="subtitle">
    Join P2P Social
  </p>


  <form id="registerForm">

    <!-- USERNAME -->

    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="Enter username"
      autocomplete="username"
      minlength="3"
      maxlength="30"
      required
    >


    <!-- EMAIL -->

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >


    <!-- PASSWORD -->

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Minimum 8 characters"
      autocomplete="new-password"
      minlength="8"
      required
    >


    <!-- CONFIRM PASSWORD -->

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      autocomplete="new-password"
      minlength="8"
      required
    >


    <button
      type="submit"
      id="registerButton">

      Create Account

    </button>

  </form>


  <!-- =========================
       MESSAGE
  ========================== -->

  <p id="message"></p>


  <!-- =========================
       LOGIN
  ========================== -->

  <div class="login-link">

    Already have an account?

    <a href="login.html">
      Login
    </a>

  </div>


  <!-- =========================
       BACK HOME
  ========================== -->

  <a
    href="index.html"
    class="back">

    ← Back to Home

  </a>


  <p class="security-note">
    🔒 Email confirmation is required
    before accessing your account.
  </p>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const registerForm =
  document.getElementById(
    "registerForm"
  );


const registerButton =
  document.getElementById(
    "registerButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* ===============================
   MESSAGE
================================ */

function showMessage(
  text,
  color
){

  message.textContent =
    text;

  message.style.color =
    color;

}


/* ===============================
   CHECK EXISTING SESSION
================================ */

/*
  IMPORTANT:

  An existing session is NOT enough.

  The email must also be confirmed.

  If an unconfirmed session somehow
  exists, it is immediately signed out.

  Therefore register.html can NEVER
  open wallet.html for an unconfirmed
  account.
*/

async function checkExistingSession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();


    if(error){

      console.error(
        "SESSION CHECK ERROR:",
        error
      );

      return;

    }


    if(
      data &&
      data.session &&
      data.session.user
    ){

      const user =
        data.session.user;


      /*
        Check email confirmation.
      */

      if(
        user.email_confirmed_at
      ){

        window.location.replace(
          "wallet.html"
        );

        return;

      }


      /*
        Unconfirmed account:
        remove session and stay on
        registration page.
      */

      await supabaseClient.auth.signOut();


      showMessage(
        "Please confirm your email before accessing your account.",
        "#b45309"
      );

    }

  }
  catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

  }

}


checkExistingSession();


/* ===============================
   REGISTER
================================ */

registerForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    /* =========================
       USERNAME VALIDATION
    ========================= */

    if(
      username.length < 3 ||
      username.length > 30
    ){

      showMessage(
        "Username must be 3-30 characters.",
        "red"
      );

      return;

    }


    if(
      !/^[A-Za-z0-9_]+$/.test(
        username
      )
    ){

      showMessage(
        "Username can only contain letters, numbers and underscore.",
        "red"
      );

      return;

    }


    /* =========================
       EMAIL VALIDATION
    ========================= */

    if(
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
      )
    ){

      showMessage(
        "Please enter a valid email address.",
        "red"
      );

      return;

    }


    /* =========================
       PASSWORD VALIDATION
    ========================= */

    if(
      password.length < 8
    ){

      showMessage(
        "Password must be at least 8 characters.",
        "red"
      );

      return;

    }


    if(
      password !== confirmPassword
    ){

      showMessage(
        "Passwords do not match.",
        "red"
      );

      return;

    }


    registerButton.disabled =
      true;


    registerButton.textContent =
      "Creating account...";


    showMessage(
      "Creating your account...",
      "#2563eb"
    );


    try{

      /* =========================
         SUPABASE AUTH SIGN UP
      ========================= */

      const {
        data,
        error
      } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{

          /*
            User must confirm their email.

            After confirmation, Supabase
            sends them to login.html.
          */

          emailRedirectTo:
            window.location.origin +
            "/login.html",

          data:{

            username:username

          }

        }

      });


      if(error){

        throw error;

      }


      if(
        !data ||
        !data.user
      ){

        throw new Error(
          "Account could not be created."
        );

      }


      /* =========================
         NEVER OPEN WALLET HERE
      ========================= */

      /*
        DO NOT redirect to wallet.html.

        Even if Supabase happens to return
        a session, registration is not
        considered complete until the
        email is confirmed.
      */


      /*
        If Supabase returned an unconfirmed
        session, immediately sign it out.
      */

      if(
        data.session &&
        data.user &&
        !data.user.email_confirmed_at
      ){

        await supabaseClient.auth.signOut();

      }


      /* =========================
         EMAIL CONFIRMATION MESSAGE
      ========================= */

      showMessage(
        "Account created! Check your email and click the confirmation link before logging in.",
        "green"
      );


      registerButton.textContent =
        "Check Your Email";


      /*
        Go only to login page.

        The login page must perform its own
        email-confirmation check before
        allowing access to wallet.html.
      */

      setTimeout(
        function(){

          window.location.replace(
            "login.html"
          );

        },
        4000
      );

    }
    catch(error){

      console.error(
        "REGISTER ERROR:",
        error
      );


      let errorMessage =
        "Registration failed.";


      if(
        error &&
        error.message
      ){

        const msg =
          error.message.toLowerCase();


        if(
          msg.includes(
            "user already registered"
          )
        ){

          errorMessage =
            "This email is already registered.";

        }

        else{

          errorMessage =
            error.message;

        }

      }


      showMessage(
        errorMessage,
        "red"
      );


      registerButton.disabled =
        false;


      registerButton.textContent =
        "Create Account";

    }

  }
);


/* ===============================
   AUTH STATE
================================ */

supabaseClient.auth.onAuthStateChange(
  function(event,session){

    /*
      IMPORTANT:

      No authentication event is allowed
      to automatically open wallet.html
      from this registration page.

      Email confirmation must happen first.
    */

    console.log(
      "AUTH EVENT:",
      event
    );

  }
);

</script>

</body>
</html>
