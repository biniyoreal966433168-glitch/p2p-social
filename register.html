<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Register - P2P Social</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #1d4ed8;
    }

    .register-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover,
    .login a:hover {
      text-decoration: underline;
    }
  </style></head><body>  <div class="register-container"><img
  src="images/logo.png"
  class="logo"
  alt="P2P Social Logo"
  onerror="this.style.display='none'"
>

<h1>Create Account</h1>

<p class="subtitle">
  Join P2P Social
</p>

<form id="registerForm">

  <label for="username">Username</label>

  <input
    type="text"
    id="username"
    placeholder="Choose a username"
    minlength="3"
    maxlength="30"
    autocomplete="username"
    required
  >

  <label for="email">Email</label>

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
  >

  <label for="password">Password</label>

  <input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <label for="confirmPassword">Confirm Password</label>

  <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm your password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <div id="message" class="message"></div>

  <button
    type="submit"
    class="register-btn"
    id="registerButton"
  >
    Create Account
  </button>

</form>

<div class="login">
  Already have an account?
  <a href="login.html">Login</a>
</div>

<a href="index.html" class="back">
  ← Back to Home
</a>

  </div>  <!-- Supabase JavaScript Library -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://mbsvuwrgigqfporxwpfr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";


    // Create Supabase client
    const { createClient } =
      window.supabase;

    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const registerForm =
      document.getElementById("registerForm");

    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const registerButton =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, color) {

      message.textContent = text;
      message.style.color = color;

    }


    // ==========================================
    // REGISTER USER
    // ==========================================

    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        // Get values
        const username =
          usernameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        // ========================================
        // VALIDATION
        // ========================================

        if (username.length < 3) {

          showMessage(
            "Username must be at least 3 characters.",
            "red"
          );

          return;
        }


        if (password.length < 8) {

          showMessage(
            "Password must be at least 8 characters.",
            "red"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "red"
          );

          return;
        }


        // ========================================
        // DISABLE BUTTON
        // ========================================

        registerButton.disabled = true;

        registerButton.textContent =
          "Creating account...";

        showMessage(
          "Please wait...",
          "#2563eb"
        );


        try {

          // ======================================
          // SUPABASE SIGN UP
          // ======================================

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {

                  username: username

                }

              }

            });


          // ======================================
          // CHECK ERROR
          // ======================================

          if (error) {

            throw error;

          }


          // ======================================
          // SUCCESS
          // ======================================

          if (data.user) {

            /*
             * If email confirmation is enabled
             * in Supabase, the user must verify
             * their email before logging in.
             */

            if (
              data.user.identities &&
              data.user.identities.length === 0
            ) {

              showMessage(
                "This email is already registered.",
                "red"
              );

              registerButton.disabled = false;

              registerButton.textContent =
                "Create Account";

              return;
            }


            showMessage(
              "Account created successfully!",
              "green"
            );


            // ==================================
            // EMAIL CONFIRMATION
            // ==================================

            if (!data.session) {

              showMessage(
                "Account created! Check your email to verify your account.",
                "green"
              );


              setTimeout(function() {

                window.location.href =
                  "login.html";

              }, 2500);


            } else {

              /*
               * Email confirmation is disabled.
               * User is already logged in.
               */

              showMessage(
                "Account created! Redirecting...",
                "green"
              );


              setTimeout(function() {

                window.location.href =
                  "dashboard.html";

              }, 1000);

            }

          }


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          let errorMessage =
            "Registration failed.";


          // Friendly Supabase errors

          if (
            error.message &&
            error.message.toLowerCase()
              .includes("already registered")
          ) {

            errorMessage =
              "This email is already registered.";

          } else if (
            error.message &&
            error.message.toLowerCase()
              .includes("password")
          ) {

            errorMessage =
              error.message;

          } else if (error.message) {

            errorMessage =
              error.message;

          }


          showMessage(
            errorMessage,
            "red"
          );


          // Re-enable button

          registerButton.disabled =
            false;

          registerButton.textContent =
            "Create Account";

        }

      }
    );

  </script></body>
</html>
