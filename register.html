<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const registerForm = document.getElementById("registerForm");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerButton =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");


function showMessage(text, color) {
  message.textContent = text;
  message.style.color = color;
}


registerForm.addEventListener("submit", async (event) => {

  event.preventDefault();

  const username =
    usernameInput.value.trim();

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;


  // ================================
  // VALIDATION
  // ================================

  if (username.length < 3) {
    showMessage(
      "Username must be at least 3 characters.",
      "red"
    );
    return;
  }

  if (username.length > 30) {
    showMessage(
      "Username must be 30 characters or less.",
      "red"
    );
    return;
  }

  const usernamePattern =
    /^[a-zA-Z0-9_]+$/;

  if (!usernamePattern.test(username)) {
    showMessage(
      "Username can only contain letters, numbers and underscore.",
      "red"
    );
    return;
  }


  // Normal browser email validation
  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!emailPattern.test(email)) {
    showMessage(
      "Please enter a valid email address.",
      "red"
    );
    return;
  }


  if (password.length < 8) {
    showMessage(
      "Password must be at least 8 characters.",
      "red"
    );
    return;
  }


  if (password !== confirmPassword) {
    showMessage(
      "Passwords do not match.",
      "red"
    );
    return;
  }


  registerButton.disabled = true;
  registerButton.textContent =
    "Creating account...";

  showMessage(
    "Please wait...",
    "#2563eb"
  );


  try {

    // ================================
    // CREATE SUPABASE AUTH USER
    // ================================

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            username: username
          }
        }

      });


    if (error) {
      throw error;
    }


    if (!data.user) {
      throw new Error(
        "Account could not be created."
      );
    }


    // =================================
    // IF EMAIL VERIFICATION IS REQUIRED
    // =================================

    if (!data.session) {

      showMessage(
        "Account created! Check your email and verify your account.",
        "green"
      );

      registerButton.textContent =
        "Account Created";

      setTimeout(() => {
        window.location.href =
          "login.html";
      }, 3000);

      return;
    }


    // =================================
    // CREATE PROFILE
    // BALANCE STARTS AT 0
    // =================================

    const {
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .insert({

          id: data.user.id,

          username: username,

          balance: 0

        });


    if (profileError) {

      console.error(
        "Profile creation error:",
        profileError
      );

      // Auth account exists, so don't
      // pretend registration failed.
      showMessage(
        "Account created, but profile setup needs attention.",
        "orange"
      );

      return;
    }


    // =================================
    // SUCCESS
    // =================================

    showMessage(
      "Account created successfully! Balance: 0 ETB",
      "green"
    );

    registerButton.textContent =
      "Success";


    setTimeout(() => {

      window.location.href =
        "dashboard.html";

    }, 1500);


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );


    let errorMessage =
      "Registration failed. Please try again.";


    if (error.message) {

      const msg =
        error.message.toLowerCase();


      if (
        msg.includes("already registered") ||
        msg.includes("already been registered")
      ) {

        errorMessage =
          "This email is already registered. Please login.";

      } else if (
        msg.includes("invalid email")
      ) {

        errorMessage =
          "Please enter a valid email address.";

      } else if (
        msg.includes("password")
      ) {

        errorMessage =
          error.message;

      } else {

        errorMessage =
          error.message;

      }
    }


    showMessage(
      errorMessage,
      "red"
    );


    registerButton.disabled =
      false;

    registerButton.textContent =
      "Create Account";

  }

});
</script>
