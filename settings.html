<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings • P2P Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#020914;
  color:#fff;
  min-height:100vh;
  padding-bottom:85px;
}

/* HEADER */

header{
  height:70px;
  background:#061426;
  border-bottom:1px solid #17304d;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:18px;
  position:sticky;
  top:0;
  z-index:50;
}

.back{
  border:none;
  background:none;
  color:white;
  font-size:32px;
  cursor:pointer;
  line-height:1;
}

.header-logo{
  width:38px;
  height:38px;
  object-fit:contain;
}

.header-title{
  font-size:21px;
  font-weight:bold;
  flex:1;
}

.header-settings{
  font-size:28px;
}

/* PROFILE CARD */

.profile-card{
  margin:25px 18px 30px;
  padding:20px;
  border:1px solid #14518c;
  border-radius:20px;
  background:linear-gradient(
    135deg,
    #071a31,
    #061224
  );
  display:flex;
  align-items:center;
  gap:18px;
  cursor:pointer;
}

.profile-photo{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #168cff;
  box-shadow:0 0 20px rgba(0,140,255,.25);
}

.profile-info{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:23px;
  font-weight:bold;
  margin-bottom:7px;
}

.verified{
  color:#16a5ff;
}

.profile-handle{
  color:#9bb4d4;
  font-size:15px;
  margin-bottom:7px;
}

.user-id{
  color:#00bfff;
  font-size:15px;
  font-weight:bold;
}

.profile-arrow{
  font-size:32px;
  color:#80a9d7;
}

/* SECTION */

.section-title{
  margin:0 18px 11px;
  color:#8ba9d1;
  font-size:18px;
  font-weight:bold;
}

/* MENU */

.menu-card{
  margin:0 18px 27px;
  background:#071426;
  border:1px solid #173450;
  border-radius:18px;
  overflow:hidden;
}

.menu-item{
  width:100%;
  min-height:82px;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  background:none;
  border:none;
  border-bottom:1px solid #17304a;
  color:white;
  text-align:left;
  cursor:pointer;
}

.menu-item:last-child{
  border-bottom:none;
}

.menu-item:active{
  background:#0c2039;
}

.icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  flex-shrink:0;
}

.blue{
  background:#0758a8;
}

.purple{
  background:#4920a5;
}

.green{
  background:#008b5a;
}

.gold{
  background:#a66b00;
}

.red{
  background:#b51d3b;
}

.item-content{
  flex:1;
  min-width:0;
}

.item-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.item-description{
  color:#8ca8ca;
  font-size:14px;
}

.arrow{
  color:#87a8d0;
  font-size:30px;
}

.value{
  color:#159cff;
  font-size:15px;
  font-weight:bold;
  margin-right:7px;
}

/* LOGOUT */

.logout-card{
  margin:0 18px 25px;
  border:1px solid #6d2036;
  background:#1a0a16;
  border-radius:18px;
  overflow:hidden;
}

.logout-card .menu-item{
  border:none;
}

.logout-card .item-title{
  color:#ff5473;
}

.logout-card .item-description{
  color:#b9909d;
}

.logout-card .arrow{
  color:#ff5473;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#687f9e;
  font-size:13px;
  margin:30px 0;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#06111f;
  border-top:1px solid #17304d;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.bottom-nav a{
  text-decoration:none;
  color:#7890ad;
  text-align:center;
  font-size:11px;
}

.bottom-nav a.active{
  color:#159cff;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.live-nav{
  color:#ff3158 !important;
}

.p2p-nav{
  color:#00bfff !important;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:200;
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:600px;
  background:#0a1525;
  border:1px solid #1b3b5d;
  border-radius:24px 24px 0 0;
  padding:25px 20px 30px;
}

.modal-title{
  font-size:21px;
  font-weight:bold;
  margin-bottom:18px;
}

.modal-input{
  width:100%;
  padding:14px;
  background:#050d18;
  color:white;
  border:1px solid #29445f;
  border-radius:11px;
  outline:none;
  margin-bottom:14px;
  font-size:15px;
}

.modal-button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#168cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.close-button{
  margin-top:9px;
  background:#182333;
}

/* TOGGLE */

.toggle{
  width:48px;
  height:27px;
  border-radius:20px;
  background:#34465d;
  position:relative;
}

.toggle.on{
  background:#168cff;
}

.toggle::after{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on::after{
  left:24px;
}

@media(max-width:450px){

  header{
    padding:0 14px;
  }

  .profile-card{
    margin-left:14px;
    margin-right:14px;
  }

  .menu-card,
  .logout-card{
    margin-left:14px;
    margin-right:14px;
  }

  .profile-photo{
    width:78px;
    height:78px;
  }

  .profile-name{
    font-size:20px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <button class="back" onclick="goBack()">‹</button>

  <img
    src="images/logo.png"
    class="header-logo"
    alt="P2P Social"
  >

  <div class="header-title">
    Settings
  </div>

  <div class="header-settings">
    ⚙️
  </div>

</header>


<!-- PROFILE -->

<div
  class="profile-card"
  onclick="openAccount()">

  <img
    id="profilePhoto"
    class="profile-photo"
    src="images/profile.png"
    alt="Profile"
  >

  <div class="profile-info">

    <div class="profile-name">
      <span id="profileName">
        User
      </span>
      <span class="verified">✓</span>
    </div>

    <div
      class="profile-handle"
      id="profileHandle">
      @user
    </div>

    <div
      class="user-id"
      id="userId">
      User ID: --
    </div>

  </div>

  <div class="profile-arrow">
    ›
  </div>

</div>


<!-- ACCOUNT -->

<div class="section-title">
  Account
</div>

<div class="menu-card">

  <button
    class="menu-item"
    onclick="openAccount()">

    <div class="icon blue">
      👤
    </div>

    <div class="item-content">

      <div class="item-title">
        Account
      </div>

      <div class="item-description">
        View your account information
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>


  <button
    class="menu-item"
    onclick="changeUsername()">

    <div class="icon purple">
      ✏️
    </div>

    <div class="item-content">

      <div class="item-title">
        Change Username
      </div>

      <div class="item-description">
        Update your username
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>


  <button
    class="menu-item"
    onclick="changePassword()">

    <div class="icon green">
      🔐
    </div>

    <div class="item-content">

      <div class="item-title">
        Change Password
      </div>

      <div class="item-description">
        Update your password
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>

</div>


<!-- PRIVACY -->

<div class="section-title">
  Privacy & Notifications
</div>

<div class="menu-card">

  <button
    class="menu-item"
    onclick="togglePrivacy()">

    <div class="icon gold">
      🔒
    </div>

    <div class="item-content">

      <div class="item-title">
        Profile Privacy
      </div>

      <div class="item-description">
        Control who can see your profile
      </div>

    </div>

    <div
      class="value"
      id="privacyValue">
      Public
    </div>

    <div class="arrow">
      ›
    </div>

  </button>


  <button
    class="menu-item"
    onclick="toggleNotifications()">

    <div class="icon red">
      🔔
    </div>

    <div class="item-content">

      <div class="item-title">
        Notifications
      </div>

      <div class="item-description">
        Manage your notification preferences
      </div>

    </div>

    <div
      class="value"
      id="notificationValue">
      On
    </div>

    <div class="arrow">
      ›
    </div>

  </button>

</div>


<!-- PREFERENCES -->

<div class="section-title">
  Preferences
</div>

<div class="menu-card">

  <button
    class="menu-item"
    onclick="changeLanguage()">

    <div class="icon purple">
      🌐
    </div>

    <div class="item-content">

      <div class="item-title">
        Language
      </div>

      <div class="item-description">
        Choose your preferred language
      </div>

    </div>

    <div
      class="value"
      id="languageValue">
      English
    </div>

    <div class="arrow">
      ›
    </div>

  </button>

</div>


<!-- LOGOUT -->

<div class="logout-card">

  <button
    class="menu-item"
    onclick="logout()">

    <div class="icon red">
      🚪
    </div>

    <div class="item-content">

      <div class="item-title">
        Logout
      </div>

      <div class="item-description">
        Sign out from your account
      </div>

    </div>

    <div class="arrow">
      ›
    </div>

  </button>

</div>


<div class="footer">
  P2P Social &nbsp; • &nbsp; v1.0.0
</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    href="live.html"
    class="live-nav">

    <span class="nav-icon">●</span>
    Live

  </a>

  <a
    href="wallet.html"
    class="p2p-nav">

    <span class="nav-icon">◇</span>
    P2P

  </a>

  <a href="message.html">

    <span class="nav-icon">□</span>
    Messages

  </a>

  <a
    href="profile.html"
    class="active">

    <span class="nav-icon">○</span>
    Profile

  </a>

</nav>


<!-- CHANGE USERNAME MODAL -->

<div
  class="modal"
  id="usernameModal">

  <div class="modal-box">

    <div class="modal-title">
      Change Username
    </div>

    <input
      id="newUsername"
      class="modal-input"
      type="text"
      placeholder="New username"
      maxlength="30"
    >

    <button
      class="modal-button"
      onclick="saveUsername()">
      Save Username
    </button>

    <button
      class="modal-button close-button"
      onclick="closeModal('usernameModal')">
      Cancel
    </button>

  </div>

</div>


<!-- PASSWORD MODAL -->

<div
  class="modal"
  id="passwordModal">

  <div class="modal-box">

    <div class="modal-title">
      Change Password
    </div>

    <input
      id="newPassword"
      class="modal-input"
      type="password"
      placeholder="New password"
      minlength="6"
    >

    <button
      class="modal-button"
      onclick="savePassword()">
      Change Password
    </button>

    <button
      class="modal-button close-button"
      onclick="closeModal('passwordModal')">
      Cancel
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


/* LOAD PROFILE */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href =
      "login.html";

    return;
  }

  currentUser =
    data.user;


  const {
    data: profile,
    error: profileError
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "username,user_id,avatar_url"
    )
    .eq("id", currentUser.id)
    .maybeSingle();


  if(profileError){

    console.error(profileError);

    return;
  }


  if(!profile){
    return;
  }


  const username =
    profile.username ||
    currentUser.email?.split("@")[0] ||
    "User";


  document.getElementById(
    "profileName"
  ).textContent =
    username;


  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;


  document.getElementById(
    "userId"
  ).textContent =
    "User ID: " +
    (profile.user_id || "--");


  if(profile.avatar_url){

    document.getElementById(
      "profilePhoto"
    ).src =
      profile.avatar_url;

  }

}


/* ACCOUNT */

function openAccount(){

  window.location.href =
    "profile.html";

}


/* USERNAME */

function changeUsername(){

  document.getElementById(
    "newUsername"
  ).value =
    document.getElementById(
      "profileName"
    ).textContent;

  document.getElementById(
    "usernameModal"
  ).style.display =
    "flex";

}


async function saveUsername(){

  if(!currentUser){
    return;
  }


  const input =
    document.getElementById(
      "newUsername"
    );

  const username =
    input.value.trim();


  if(username.length < 3){

    alert(
      "Username must be at least 3 characters."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({
      username: username
    })
    .eq("id", currentUser.id);


  if(error){

    alert(
      "Could not change username: " +
      error.message
    );

    return;
  }


  document.getElementById(
    "profileName"
  ).textContent =
    username;


  document.getElementById(
    "profileHandle"
  ).textContent =
    "@" + username;


  closeModal(
    "usernameModal"
  );


  alert(
    "Username updated successfully."
  );

}


/* PASSWORD */

function changePassword(){

  document.getElementById(
    "passwordModal"
  ).style.display =
    "flex";

}


async function savePassword(){

  const password =
    document.getElementById(
      "newPassword"
    ).value.trim();


  if(password.length < 6){

    alert(
      "Password must be at least 6 characters."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient.auth.updateUser({
    password: password
  });


  if(error){

    alert(
      "Password update failed: " +
      error.message
    );

    return;
  }


  document.getElementById(
    "newPassword"
  ).value = "";


  closeModal(
    "passwordModal"
  );


  alert(
    "Password changed successfully."
  );

}


/* PRIVACY */

function togglePrivacy(){

  const value =
    document.getElementById(
      "privacyValue"
    );


  if(value.textContent === "Public"){

    value.textContent =
      "Private";

  }else{

    value.textContent =
      "Public";

  }

}


/* NOTIFICATIONS */

function toggleNotifications(){

  const value =
    document.getElementById(
      "notificationValue"
    );


  if(value.textContent === "On"){

    value.textContent =
      "Off";

  }else{

    value.textContent =
      "On";

  }

}


/* LANGUAGE */

function changeLanguage(){

  const current =
    document.getElementById(
      "languageValue"
    ).textContent;


  const language =
    prompt(
      "Choose language: English or Amharic",
      current
    );


  if(!language){
    return;
  }


  if(
    language.toLowerCase() ===
    "amharic"
  ){

    document.getElementById(
      "languageValue"
    ).textContent =
      "Amharic";

  }else{

    document.getElementById(
      "languageValue"
    ).textContent =
      "English";

  }

}


/* LOGOUT */

async function logout(){

  const confirmLogout =
    confirm(
      "Do you want to log out?"
    );


  if(!confirmLogout){
    return;
  }


  const {
    error
  } =
  await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;
  }


  window.location.href =
    "login.html";

}


/* BACK */

function goBack(){

  window.location.href =
    "profile.html";

}


/* MODAL */

function closeModal(id){

  document.getElementById(
    id
  ).style.display =
    "none";

}


/* START */

loadProfile();

</script>

</body>
</html>
