<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings • P2P Social</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07090D;
  color:#fff;
  min-height:100vh;
  padding-bottom:30px;
}

header{
  height:64px;
  background:#0D1016;
  border-bottom:1px solid #202632;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  background:none;
  border:none;
  color:white;
  font-size:27px;
  cursor:pointer;
}

header h1{
  font-size:19px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px 18px;
}

.account-card{
  background:#0F1218;
  border:1px solid #202632;
  border-radius:16px;
  padding:18px;
  margin-bottom:22px;
}

.account-title{
  color:#858EA0;
  font-size:12px;
  margin-bottom:10px;
}

.account-email{
  font-size:16px;
  font-weight:bold;
  word-break:break-word;
}

.account-id{
  color:#00C2FF;
  font-size:13px;
  margin-top:7px;
}

.section-title{
  color:#858EA0;
  font-size:13px;
  font-weight:bold;
  margin:20px 5px 8px;
}

.setting{
  background:#0F1218;
  border:1px solid #202632;
  min-height:58px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.setting:first-of-type{
  border-radius:13px 13px 0 0;
}

.setting:last-of-type{
  border-radius:0 0 13px 13px;
}

.setting + .setting{
  border-top:none;
}

.setting-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#17243A;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.setting-name{
  font-size:15px;
  font-weight:bold;
}

.setting-description{
  color:#697386;
  font-size:11px;
  margin-top:3px;
}

.arrow{
  color:#697386;
  font-size:20px;
}

.toggle{
  width:44px;
  height:24px;
  background:#303746;
  border-radius:20px;
  position:relative;
}

.toggle::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.active{
  background:#2F80FF;
}

.toggle.active::after{
  left:23px;
}

.logout{
  width:100%;
  margin-top:25px;
  padding:13px;
  border:none;
  border-radius:11px;
  background:#2A1117;
  border:1px solid #57202C;
  color:#FF5470;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.status{
  text-align:center;
  color:#697386;
  font-size:12px;
  margin-top:20px;
}
</style></head><body><header><button
class="back"
onclick="goBack()">
←
</button>

  <h1>Settings</h1></header><div class="container">  <!-- ACCOUNT -->  <div class="account-card"><div class="account-title">
  ACCOUNT
</div>

<div
  class="account-email"
  id="email">
  Loading...
</div>

<div
  class="account-id"
  id="userId">
  User ID: --
</div>

  </div>  <!-- ACCOUNT SETTINGS -->  <div class="section-title">
    ACCOUNT SETTINGS
  </div>  <div
    class="setting"
    onclick="changeUsername()"><div class="setting-left">

  <div class="icon">
    👤
  </div>

  <div>

    <div class="setting-name">
      Change Username
    </div>

    <div
      class="setting-description"
      id="currentUsername">
      Loading...
    </div>

  </div>

</div>

<div class="arrow">
  ›
</div>

  </div>  <div
    class="setting"
    onclick="changePassword()"><div class="setting-left">

  <div class="icon">
    🔐
  </div>

  <div>

    <div class="setting-name">
      Change Password
    </div>

    <div class="setting-description">
      Update your account password
    </div>

  </div>

</div>

<div class="arrow">
  ›
</div>

  </div>  <!-- PRIVACY -->  <div class="section-title">
    PRIVACY
  </div>  <div
    class="setting"
    onclick="togglePrivacy()"><div class="setting-left">

  <div class="icon">
    🔒
  </div>

  <div>

    <div class="setting-name">
      Profile Privacy
    </div>

    <div
      class="setting-description"
      id="privacyText">
      Public profile
    </div>

  </div>

</div>

<div
  class="toggle"
  id="privacyToggle">
</div>

  </div>  <!-- NOTIFICATIONS -->  <div class="section-title">
    NOTIFICATIONS
  </div>  <div
    class="setting"
    onclick="toggleNotifications()"><div class="setting-left">

  <div class="icon">
    🔔
  </div>

  <div>

    <div class="setting-name">
      Notifications
    </div>

    <div
      class="setting-description"
      id="notificationText">
      Notifications enabled
    </div>

  </div>

</div>

<div
  class="toggle active"
  id="notificationToggle">
</div>

  </div>  <!-- LANGUAGE -->  <div class="section-title">
    LANGUAGE
  </div>  <div
    class="setting"
    onclick="changeLanguage()"><div class="setting-left">

  <div class="icon">
    🌐
  </div>

  <div>

    <div class="setting-name">
      Language
    </div>

    <div
      class="setting-description"
      id="languageText">
      English
    </div>

  </div>

</div>

<div class="arrow">
  ›
</div>

  </div>  <!-- LOGOUT --><button

onclick="logout()">

🚪 Logout

  </button>  <div
    class="status"
    id="status">
  </div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;
let currentProfile = null;


/* =========================
   LOAD ACCOUNT
========================= */

async function loadAccount(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(error){

    alert(
      "Session error: " +
      error.message
    );

    return;
  }


  if(!data.session){

    window.location.href =
      "login.html";

    return;
  }


  currentUser =
    data.session.user;


  document.getElementById(
    "email"
  ).textContent =
    currentUser.email || "No email";


  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "user_id,username"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(profileError){

    console.error(
      profileError
    );

    document.getElementById(
      "status"
    ).textContent =
      "Could not load profile.";

    return;
  }


  if(profile){

    currentProfile =
      profile;


    document.getElementById(
      "userId"
    ).textContent =
      "User ID: " +
      (profile.user_id || "--");


    document.getElementById(
      "currentUsername"
    ).textContent =
      "@" +
      (profile.username || "username");

  }

}


/* =========================
   CHANGE USERNAME
========================= */

async function changeUsername(){

  if(!currentUser) return;


  const newUsername =
    prompt(
      "Enter your new username:",
      currentProfile?.username || ""
    );


  if(newUsername === null)
    return;


  const username =
    newUsername.trim();


  if(!username){

    alert(
      "Username cannot be empty."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({
      username:username
    })
    .eq(
      "id",
      currentUser.id
    );


  if(error){

    alert(
      "Could not change username:\n\n" +
      error.message
    );

    return;
  }


  currentProfile.username =
    username;


  document.getElementById(
    "currentUsername"
  ).textContent =
    "@" + username;


  alert(
    "Username changed successfully."
  );

}


/* =========================
   CHANGE PASSWORD
========================= */

async function changePassword(){

  if(!currentUser) return;


  const newPassword =
    prompt(
      "Enter your new password:\n\nMinimum 6 characters"
    );


  if(newPassword === null)
    return;


  if(newPassword.length < 6){

    alert(
      "Password must be at least 6 characters."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient.auth.updateUser({
    password:newPassword
  });


  if(error){

    alert(
      "Password change failed:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Password changed successfully."
  );

}


/* =========================
   PROFILE PRIVACY
========================= */

let privateProfile =
  localStorage.getItem(
    "privateProfile"
  ) === "true";


function updatePrivacyUI(){

  const toggle =
    document.getElementById(
      "privacyToggle"
    );

  const text =
    document.getElementById(
      "privacyText"
    );


  if(privateProfile){

    toggle.classList.add(
      "active"
    );

    text.textContent =
      "Private profile";

  }
  else{

    toggle.classList.remove(
      "active"
    );

    text.textContent =
      "Public profile";

  }

}


function togglePrivacy(){

  privateProfile =
    !privateProfile;


  localStorage.setItem(
    "privateProfile",
    privateProfile
  );


  updatePrivacyUI();

}


/* =========================
   NOTIFICATIONS
========================= */

let notifications =
  localStorage.getItem(
    "notifications"
  ) !== "false";


function updateNotificationUI(){

  const toggle =
    document.getElementById(
      "notificationToggle"
    );

  const text =
    document.getElementById(
      "notificationText"
    );


  if(notifications){

    toggle.classList.add(
      "active"
    );

    text.textContent =
      "Notifications enabled";

  }
  else{

    toggle.classList.remove(
      "active"
    );

    text.textContent =
      "Notifications disabled";

  }

}


function toggleNotifications(){

  notifications =
    !notifications;


  localStorage.setItem(
    "notifications",
    notifications
  );


  updateNotificationUI();

}


/* =========================
   LANGUAGE
========================= */

function changeLanguage(){

  const language =
    prompt(
      "Choose language:\n\n" +
      "1. English\n" +
      "2. Amharic"
    );


  if(language === "1"){

    localStorage.setItem(
      "language",
      "English"
    );

    document.getElementById(
      "languageText"
    ).textContent =
      "English";

  }

  else if(language === "2"){

    localStorage.setItem(
      "language",
      "Amharic"
    );

    document.getElementById(
      "languageText"
    ).textContent =
      "Amharic";

  }

}


/* =========================
   BACK
========================= */

function goBack(){

  window.location.href =
    "profile.html";

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  if(
    !confirm(
      "Do you want to log out?"
    )
  ){

    return;
  }


  const {
    error
  } =
  await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed:\n\n" +
      error.message
    );

    return;
  }


  window.location.href =
    "login.html";

}


/* =========================
   START
========================= */

loadAccount();

updatePrivacyUI();
updateNotificationUI();


const savedLanguage =
localStorage.getItem(
  "language"
);


if(savedLanguage){

  document.getElementById(
    "languageText"
  ).textContent =
    savedLanguage;

}

</script></body>
</html>
