<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f5f7fb;color:#172033;padding-bottom:82px}.wrap{max-width:620px;margin:auto;padding:12px}.header{background:linear-gradient(135deg,#075e54,#087f73);color:#fff;padding:15px 16px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#064e46,#10a889);display:grid;place-items:center;font-weight:bold;font-size:18px}.brand{font-size:20px;font-weight:bold;flex:1}.brand span{color:#b9fff1}.header button{border:0;background:#ffffff20;color:#fff;border-radius:10px;padding:9px;font-size:13px}.card{background:#fff;border-radius:17px;margin:12px 0;padding:16px;box-shadow:0 3px 13px #0000000a}.profile{text-align:center}.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#e5efed;border:3px solid #087f73}.name{font-size:21px;font-weight:700;margin-top:9px;overflow-wrap:anywhere}.username{font-size:13px;color:#77818d;margin-top:4px}.id{display:inline-block;background:#f2f5f7;color:#64717c;border-radius:8px;padding:6px 9px;font-size:12px;margin-top:9px}.bio{margin:12px auto 0;text-align:left;background:#f7faf9;border-left:3px solid #087f73;border-radius:8px;padding:11px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:#394752}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;text-align:left}.detail{padding:10px;border:1px solid #edf0f2;border-radius:11px;min-width:0}.detail small{display:block;color:#87919a;font-size:11px;margin-bottom:5px}.detail b{font-size:13px;overflow-wrap:anywhere}.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}.badge{border:1px solid #e4e8eb;border-radius:20px;padding:6px 9px;font-size:11px;font-weight:bold;color:#9aa3a8;background:#f5f7f8;cursor:pointer}.badge.achieved{box-shadow:0 2px 8px #00000010}.badge.level1.achieved{background:#e8f5f2;color:#087f73;border-color:#bce5dc}.badge.level2.achieved{background:linear-gradient(110deg,#d9f4ff,#e8ddff,#ffe0f0);color:#653ca5;border-color:#d6baf4}.badge.level3.achieved{background:linear-gradient(110deg,#fff0a8,#ffbe7a,#ff8cb5,#b7a0ff);color:#552a70;border-color:#e8a2c8;box-shadow:0 0 0 2px #f8d8eb,0 0 16px #e7a0d4}.badge.verified.achieved{background:#e8f2ff;color:#205eb6;border-color:#bdd6ff}.badge.merchant.achieved{background:#e7f8e9;color:#21783a;border-color:#b6e4bd}.badge.famous.achieved{background:#ffe7f1;color:#b52c6a;border-color:#ffc1db}.badge.rich.achieved{background:#fff1cf;color:#946000;border-color:#f1d17e}.badge.online.achieved{background:#e0f8e9;color:#17804d;border-color:#b6e7ca}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{border:0;background:#f5f7fb;border-radius:12px;padding:12px 4px;cursor:pointer;color:#172033}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:#6e7984}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:bold;font-size:13px;cursor:pointer}.primary{background:#087f73;color:#fff}.secondary{background:#edf8f5;color:#087f73}.danger{background:#fff0f0;color:#bd3535}.muted{background:#f1f3f5;color:#56616a}.section-title{font-size:16px;font-weight:bold;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.trade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.trade{background:#f6f8fa;border-radius:11px;padding:12px}.trade small{display:block;color:#7a8590;font-size:11px;margin-bottom:6px}.trade b{font-size:17px}.post-card{background:#fff;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 3px 12px #0000000a}.post-pin{display:inline-block;background:#fff4d6;color:#916300;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:bold;margin-bottom:8px}.post-head{display:flex;align-items:center;gap:9px}.post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e1eeea}.post-head-main{min-width:0;flex:1}.post-author{font-size:13px;font-weight:bold}.post-date{font-size:11px;color:#8a94a0;margin-top:3px}.post-content{margin-top:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.post-media{width:100%;max-height:440px;object-fit:cover;border-radius:12px;margin-top:10px}.post-actions{display:flex;gap:17px;border-top:1px solid #edf0f4;margin-top:12px;padding-top:11px;color:#697583;font-size:12px}.feedback-row{display:block;width:100%;text-align:left;border:1px solid #e8edf0;background:#f8fafb;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer}.feedback-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:bold;font-size:13px}.feedback-stars{color:#e0a000}.feedback-comment{font-size:13px;line-height:1.45;color:#5c6873;margin-top:7px;white-space:pre-wrap}.feedback-meta{font-size:11px;color:#89939d;margin-top:6px}.empty{padding:20px;text-align:center;color:#87919a;font-size:13px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:67px;background:#fff;border-top:1px solid #e4e7eb;display:flex;align-items:center;justify-content:space-around;z-index:20}.nav-item{text-align:center;text-decoration:none;color:#7c858f;font-size:10px;min-width:40px}.nav-item span{display:block;font-size:21px;margin-bottom:3px}.nav-item.active{color:#087f73;font-weight:bold}.status{font-size:12px;color:#78838d;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow:auto}.modal-card h3{margin-bottom:10px}.modal-card p{font-size:14px;line-height:1.5;color:#53606b}.modal-close{float:right;border:0;background:none;font-size:23px}@media(max-width:390px){.wrap{padding:9px}.card{padding:13px}.badge{font-size:10px;padding:6px 7px}.actions{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="header"><div class="logo">P2P</div><div class="brand">P2P <span>Social</span><div style="font-size:11px;font-weight:normal;margin-top:3px">User Profile</div></div><button onclick="location.href='./index.html'">🏠 Home</button></header>
<main class="wrap"><div id="loading" class="card empty">Loading user profile…</div><div id="page" style="display:none">
<section class="card profile"><img id="avatar" class="avatar" alt="User avatar"><div id="name" class="name"></div><div id="username" class="username"></div><div id="userId" class="id">ID:000000000000</div><div id="badges" class="badges"></div><div id="bio" class="bio" style="display:none"></div>
<div id="details" class="details"></div><div class="stats"><button class="stat" onclick="showList('posts')"><b id="postCount">0</b><span>Posts</span></button><button class="stat" onclick="showList('followers')"><b id="followerCount">0</b><span>Followers</span></button><button class="stat" onclick="showList('following')"><b id="followingCount">0</b><span>Following</span></button></div>
<div class="actions"><button id="followBtn" class="btn primary">Follow</button><button id="messageBtn" class="btn secondary">Message</button><button id="blockBtn" class="btn danger">Block</button><button id="feedbackBtn" class="btn secondary">Trade feedback</button></div><div id="status" class="status"></div></section>
<section class="card"><div class="section-title">Trading activity</div><div class="trade-grid"><div class="trade"><small>Completed · 30 days</small><b id="complete30">0</b></div><div class="trade"><small>Trades · 30 days</small><b id="trade30">0</b></div><div class="trade"><small>Total trades</small><b id="totalTrade">0</b></div><div class="trade"><small>Feedback average</small><b id="averageRating">—</b></div></div></section>
<section class="card"><div class="section-title">User posts</div><div id="posts"><div class="empty">Loading posts…</div></div></section>
<section class="card"><div class="section-title">Trade feedback <span id="feedbackCount" style="font-size:12px;color:#7b8792"></span></div><div id="feedbackList"><div class="empty">Loading feedback…</div></div></section>
</div></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
<nav class="bottom-nav"><a class="nav-item" href="./index.html"><span>🏠</span>Home</a><a class="nav-item" href="./🟢.html"><span>🟢</span></a><a class="nav-item" href="./🔴.html"><span>🔴</span></a><a class="nav-item" href="./message.html"><span>💬</span>Messages</a><a class="nav-item" href="./profile.html"><span>👤</span>Profile</a></nav>
<script>
const SUPABASE_URL="https://mbsvuwrgigqfporxwpfr.supabase.co",SUPABASE_KEY="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),params=new URLSearchParams(location.search);let me=null,meProfile=null,user=null,userId=null,following=false,blocked=false,trades=[],feedbackRows=[],posts=[],followerRows=[],blockRows=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateText(v){if(!v)return"";const d=new Date(v);return isNaN(d)?"":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function ago(v){if(!v)return"Last seen unknown";const n=Math.max(0,Date.now()-new Date(v).getTime()),m=Math.floor(n/60000);if(m<1)return"Last seen just now";if(m<60)return"Last seen "+m+" minute"+(m===1?"":"s")+" ago";const h=Math.floor(m/60);if(h<24)return"Last seen "+h+" hour"+(h===1?"":"s")+" ago";const d=Math.floor(h/24);return"Last seen "+d+" day"+(d===1?"":"s")+" ago"}
function isOnline(){const t=user?.last_seen_at||user?.last_seen||user?.last_active_at||user?.last_active;return !!t&&Date.now()-new Date(t).getTime()<=6*60*60*1000}
function currentUid(p){return p?.id||p?.user_id}
async function start(){try{const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace("./login.html");return}me=data.session.user;const requested=params.get("username")||params.get("user_id")||params.get("id");if(!requested){location.replace("./profile.html");return}
let q=db.from("profiles").select("*");if(params.get("username"))q=q.eq("username",params.get("username"));else q=q.or("id.eq."+requested+",user_id.eq."+requested);let result=await q.maybeSingle();if(result.error||!result.data){$("loading").textContent="User not found";return}user=result.data;userId=currentUid(user);if(userId===me.id){location.replace("./profile.html");return}const mine=await db.from("profiles").select("*").eq("id",me.id).maybeSingle();meProfile=mine.data||{};await Promise.allSettled([loadFollowAndBlock(),loadPosts(),loadStats(),loadFeedback()]);render();$("loading").style.display="none";$("page").style.display="block";if(blocked)applyBlockView()}catch(e){console.error(e);$("loading").textContent="Could not load this profile."}}
async function loadFollowAndBlock(){const f=await db.from("user_follows").select("*").eq("follower_id",me.id).eq("following_id",userId).maybeSingle();if(!f.error){following=!!f.data}else{const old=await db.from("followers").select("*").eq("follower_id",me.id).eq("following_id",userId).maybeSingle();following=!!old.data}
const b=await db.from("user_blocks").select("*").eq("blocker_id",me.id).eq("blocked_id",userId).maybeSingle();blocked=!!b.data}
async function loadPosts(){const {data,error}=await db.from("posts").select("*").eq("user_id",userId).order("created_at",{ascending:false}).limit(100);if(error){posts=[];console.warn("Posts:",error.message)}else posts=data||[];$("postCount").textContent=posts.length}
async function loadStats(){const {data,error}=await db.from("p2p_trades").select("*").or("buyer_id.eq."+userId+",seller_id.eq."+userId);if(error)console.warn("Trades:",error.message);trades=data||[];const now=Date.now(),cut=now-30*86400000,recent=trades.filter(t=>new Date(t.created_at||t.completed_at||t.updated_at||0).getTime()>=cut),completed=recent.filter(t=>String(t.status||"").toLowerCase()==="completed");$("complete30").textContent=completed.length;$("trade30").textContent=recent.length;$("totalTrade").textContent=trades.length;
const follows=await db.from("user_follows").select("follower_id,following_id").or("following_id.eq."+userId+",follower_id.eq."+userId);if(!follows.error){followerRows=follows.data||[]}else{const old=await db.from("followers").select("follower_id,following_id").or("following_id.eq."+userId+",follower_id.eq."+userId);followerRows=old.data||[]}
$("followerCount").textContent=followerRows.filter(x=>x.following_id===userId).length;$("followingCount").textContent=followerRows.filter(x=>x.follower_id===userId).length}
async function loadFeedback(){const {data,error}=await db.from("profile_feedback").select("*").eq("reviewed_user_id",userId).order("created_at",{ascending:false}).limit(100);if(error){console.warn("Feedback:",error.message);feedbackRows=[]}else feedbackRows=data||[];const ratings=feedbackRows.map(x=>Number(x.rating)).filter(x=>Number.isFinite(x)&&x>0);$("averageRating").textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ★":"—";$("feedbackCount").textContent=feedbackRows.length?"("+feedbackRows.length+")":""}
function feeSpent(){for(const k of ["qualifying_fee_spending","fee_spending","spending_usdt","total_fee_spending","fee_total","total_spending","spending"])if(user[k]!==undefined&&user[k]!==null&&user[k]!=="")return Math.max(0,Number(user[k])||0);return 0}
function showBadgeDetails(label,detail){$("modalTitle").textContent=label;$("modalBody").innerHTML="<p>"+esc(detail)+"</p>";$("modal").classList.add("open")}
function render(){const spending=feeSpent(),level=spending>=4?3:spending>=2?2:1,followers=Number($("followerCount").textContent)||0,verified=String(user.verification_status||"").toLowerCase()==="verified"||user.verified===true,merchant=String(user.role||"").toLowerCase()==="merchant"||user.is_merchant===true||user.merchant===true,famous=user.famous_badge===true||Number(user.referral_count||user.referrals_count||0)>=10||followers>=100,rich=spending>=10,online=isOnline(),last=user.last_seen_at||user.last_seen||user.last_active_at||user.last_active;
$("avatar").src=user.avatar_url||"./p2p-logo.svg";$("name").textContent=user.display_name||user.full_name||user.name||user.username||"User";$("username").textContent="@"+(user.username||"user");$("userId").textContent="ID:"+String(user.user_number??user.id_number??"0").replace(/\D/g,"").padStart(12,"0");$("bio").textContent=user.bio||"No bio yet.";const badgeItems=[["◇ Level "+level,"level"+level,true,"Level "+level+": "+(level===1?"Basic qualifying fee spending starts at $1.":level===2?"At least $2 in qualifying fee spending.":"At least $4 in qualifying fee spending; highest visible level.")],["■ Basic","basic",true,"Basic account badge."],["■ Verified","verified",verified,"Verified account status."],["■ Merchant","merchant",merchant,"Merchant account badge."],["♡ Famous","famous",famous,"Famous badge: 10 qualifying referrals or 100 followers."],["◆ Rich","rich",rich,"Rich badge: at least $10 in qualifying fee spending."], [online?"● Online":"● Last seen","online",online,online?"Active within the last 6 hours.":ago(last)]];$("badges").innerHTML=badgeItems.map(([label,cls,on,detail])=>'<button class="badge '+cls+(on?' achieved':'')+'" data-label="'+esc(label)+'" data-detail="'+esc(detail)+'">'+esc(label.split(" ").slice(0,2).join(" "))+"</button>").join("");$("badges").querySelectorAll("button").forEach(b=>b.onclick=()=>showBadgeDetails(b.dataset.label,b.dataset.detail));
$("bio").style.display="block";const first=user.created_at?dateText(user.created_at):"Not available";$("details").innerHTML=[["Account","P2P Social"],["Member since",first],["Fee spending","$"+spending.toFixed(2)],["Presence",online?"Online":ago(last)],["Verification",verified?"Verified":"Unverified"],["Account type",merchant?"Merchant":(user.role||"User")]].map(([a,b])=>'<div class="detail"><small>'+esc(a)+'</small><b>'+esc(b)+'</b></div>').join("");
$("followBtn").textContent=following?"Following":"Follow";$("blockBtn").textContent=blocked?"Unblock":"Block";renderPosts();renderFeedback();$("feedbackBtn").onclick=()=>{const eligible=trades.filter(t=>(t.buyer_id===me.id||t.seller_id===me.id)&&(t.buyer_id===userId||t.seller_id===userId)&&["completed","canceled","cancelled"].includes(String(t.status||"").toLowerCase()));if(!eligible.length){showBadgeDetails("Trade feedback","Feedback is available only after a completed or canceled trade with this user.");return}location.href="./message.html?feedback_user="+encodeURIComponent(userId)}}
function renderPosts(){const root=$("posts");if(!posts.length){root.innerHTML='<div class="empty">No posts yet.</div>';return}root.innerHTML=posts.map(p=>{const text=p.content||p.body||p.text||"",media=p.media_url||p.image_url||p.video_url||"",pinned=!!(p.is_pinned||p.pinned);return '<article class="post-card">'+(pinned?'<div class="post-pin">📌 PINNED POST</div>':"")+'<div class="post-head"><img class="post-avatar" src="'+esc(user.avatar_url||"./p2p-logo.svg")+'" alt=""><div class="post-head-main"><div class="post-author">'+esc(user.display_name||user.full_name||user.name||user.username||"User")+' · @'+esc(user.username||"user")+'</div><div class="post-date">'+esc(dateText(p.created_at))+'</div></div></div>'+(text?'<div class="post-content">'+esc(text)+'</div>':"")+(media?(/\.(mp4|webm|mov)(\?|$)/i.test(media)||p.media_type==="video"?'<video class="post-media" src="'+esc(media)+'" controls></video>':'<img class="post-media" src="'+esc(media)+'" alt="Post media" loading="lazy">'):"")+'<div class="post-actions"><span>♥ '+(p.like_count||"Like")+'</span><span>Comment</span><span>Share</span></div></article>'}).join("")}
function renderFeedback(){if(!feedbackRows.length){$("feedbackList").innerHTML='<div class="empty">No public trade feedback yet.</div>';return}const ratings=feedbackRows.map(x=>Number(x.rating)).filter(x=>Number.isFinite(x)&&x>0);$("averageRating").textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+" ★":"—";$("feedbackList").innerHTML=feedbackRows.map(f=>'<button class="feedback-row" onclick="showFeedback(this)" data-feedback="'+esc(JSON.stringify({name:f.reviewer_name||f.username||"Trade partner",rating:f.rating,comment:f.comment||f.feedback||"",date:dateText(f.created_at),trade:f.trade_id||""}))+'"><div class="feedback-head"><span>'+esc(f.reviewer_name||f.username||"Trade partner")+'</span><span class="feedback-stars">'+("★".repeat(Math.max(0,Math.min(5,Number(f.rating)||0))))+' '+esc(f.rating??"—")+'/5</span></div><div class="feedback-comment">'+esc(f.comment||f.feedback||"Trade feedback")+'</div><div class="feedback-meta">'+esc(dateText(f.created_at))+' · Tap for details</div></button>').join("")}
function showFeedback(btn){try{const f=JSON.parse(btn.dataset.feedback);$("modalTitle").textContent="Trade feedback";$("modalBody").innerHTML='<p><b>'+esc(f.name)+'</b> · <span style="color:#d59a00">'+("★".repeat(Math.max(0,Math.min(5,Number(f.rating)||0))))+'</span></p><p style="margin-top:9px">'+esc(f.comment||"No written comment.")+'</p><p style="margin-top:9px;font-size:12px">'+esc(f.date)+(f.trade?" · Trade "+esc(f.trade):"")+'</p>';$("modal").classList.add("open")}catch(e){}}
function closeModal(){$("modal").classList.remove("open")}
async function toggleFollow(){if(blocked){$("status").textContent="Unblock this user before following.";return}const table="user_follows";if(following){let r=await db.from(table).delete().eq("follower_id",me.id).eq("following_id",userId);if(r.error){r=await db.from("followers").delete().eq("follower_id",me.id).eq("following_id",userId)}if(r.error){$("status").textContent="Could not unfollow: "+r.error.message;return}following=false}else{let r=await db.from(table).insert({follower_id:me.id,following_id:userId});if(r.error)r=await db.from("followers").insert({follower_id:me.id,following_id:userId});if(r.error){$("status").textContent="Could not follow: "+r.error.message;return}following=true}await Promise.allSettled([loadStats()]);$("followBtn").textContent=following?"Following":"Follow";$("status").textContent=following?"You are now following this user.":"You unfollowed this user."}
async function toggleBlock(){if(blocked){const r=await db.from("user_blocks").delete().eq("blocker_id",me.id).eq("blocked_id",userId);if(r.error){$("status").textContent="Could not unblock: "+r.error.message;return}blocked=false;restoreBlockView();$("blockBtn").textContent="Block";$("status").textContent="User unblocked."}else{const r=await db.from("user_blocks").insert({blocker_id:me.id,blocked_id:userId});if(r.error){$("status").textContent="Could not block: "+r.error.message;return}blocked=true;$("blockBtn").textContent="Unblock";applyBlockView();$("status").textContent="User blocked on this profile."}}
function applyBlockView(){$("followBtn").disabled=true;$("messageBtn").disabled=true;$("feedbackBtn").disabled=true;$("posts").innerHTML='<div class="empty">Posts hidden while this user is blocked.</div>'}
function restoreBlockView(){$("followBtn").disabled=false;$("messageBtn").disabled=false;$("feedbackBtn").disabled=false;renderPosts()}
function showList(type){let title=type==="posts"?"Posts":type==="followers"?"Followers":"Following",rows=type==="posts"?posts:followerRows.filter(x=>type==="followers"?x.following_id===userId:x.follower_id===userId);$("modalTitle").textContent=title;if(type==="posts")$("modalBody").innerHTML="<p>"+rows.length+" posts</p>";else $("modalBody").innerHTML=rows.length?rows.map(x=>'<p style="padding:8px 0;border-bottom:1px solid #eee">'+esc(x.username||x.follower_username||x.following_username||((type==="followers"?x.follower_id:x.following_id)||"User"))+'</p>').join(""):'<p>No '+title.toLowerCase()+' found.</p>';$("modal").classList.add("open")}
$("followBtn").onclick=toggleFollow;$("blockBtn").onclick=toggleBlock;$("messageBtn").onclick=()=>{if(blocked){$("status").textContent="Unblock this user before messaging.";return}location.href="./message.html?username="+encodeURIComponent(user.username||"")};$("feedbackBtn").onclick=()=>{};start();
</script></body></html>
