$("submit").onclick=async()=>{let id=$("tradeSelect").value;if(!id){$("notice").textContent="No eligible trade";return}let b=$("submit");b.disabled=true;try{let r=await sb.rpc("submit_profile_feedback",{p_trade_id:id,p_rating:Number($("rating").value),p_comment:$("comment").value.trim()});if(r.error)throw r.error;$("modal").style.display="none";$("comment").value="";await Promise.all([loadTrades(),loadFeedback()])}catch(e){$("notice").textContent=e.message||"Could not submit feedback"}finally{b.disabled=false}};
start();
</script></body></html>
