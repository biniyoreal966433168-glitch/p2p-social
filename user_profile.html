.profile-post-author{flex:1;min-width:0}.profile-post-name{font-size:14px;font-weight:700;color:#17212b;overflow-wrap:anywhere}.profile-post-meta{font-size:11px;color:#8a93a1;margin-top:4px}.profile-post-meta span{color:#087f73;font-weight:700}

/* Refined profile header */
.wrap{max-width:960px;padding:20px 16px 40px}
.profile.profile-hero{position:relative;text-align:left;padding:26px;border:1px solid #e7eeec;border-radius:22px;background:linear-gradient(145deg,#fff 0%,#f8fcfb 100%);box-shadow:0 10px 32px rgba(14,53,47,.08);overflow:hidden}
.profile.profile-hero:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#075e54,#087f73,#71d7bd)}
.profile-hero .avatar{display:block;width:96px;height:96px;margin:0 auto 4px;border:4px solid #fff;outline:2px solid #087f73;box-shadow:0 5px 18px #087f7324;background:#e7f5f1;object-fit:cover}
.profile-hero .profile-name-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}.profile-hero .name{text-align:center;font-size:clamp(23px,4vw,30px);letter-spacing:-.5px;color:#132e2a;margin-top:2px;overflow-wrap:anywhere}
.profile-hero .username{display:block;text-align:center;color:#087f73;font-size:13px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.profile-hero .info{gap:8px;margin-top:14px}
.profile-hero .info span{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:#f0f6f5;border:1px solid #e2eeeb;color:#52645f;border-radius:999px;padding:7px 11px;font-size:12px}
.profile-hero .badges{gap:7px;margin:18px auto 0;max-width:760px}
.profile-hero .badge{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:7px 11px;border:1px solid #e6eaf0;border-radius:999px;background:#f5f7fa;color:#788391;font-size:11px;line-height:1.25;letter-spacing:.1px;font-weight:700}
.profile-hero .badge.on.basic{background:#fde8e8;color:#b42318;border-color:#f5b8b8}
.profile-hero .badge.on.verified{background:#e7f8f1;color:#087f73;border-color:#bfe9d8}
.profile-hero .badge.on.merchant{background:#edf2ff;color:#3459a6;border-color:#d7e1ff}
.profile-hero .badge.on.famous{background:#fff0f6;color:#b83270;border-color:#f7d1e2}
.profile-hero .badge.on.rich{background:#fff7e4;color:#936000;border-color:#f2dfae}
.profile-hero .badge.on.online{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.profile-hero .badge.level2,.profile-hero .badge.level3{color:#fff;border:0}
.profile-hero .badge.level0{background:#f5f7fa;color:#788391;border:1px solid #e6eaf0}
.profile-hero .badge.level2{background:linear-gradient(100deg,#6b3cff,#d83eae)}
.profile-hero .badge.level3{font-size:11px;padding:7px 11px;box-shadow:0 3px 12px #ff5b7a40;animation:none}
.profile-hero .bio{max-width:620px;margin:18px auto 0;text-align:center;color:#52645f;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.profile-hero .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:24px;padding-top:18px;border-top:1px solid #e8efed}
.profile-hero .stat{padding:8px 4px}
.profile-hero .stat+.stat{border-left:1px solid #e8efed}
.profile-hero .stat b{font-size:22px;color:#163c35;font-weight:800}
.profile-hero .stat span{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:#83918d}
.profile-hero .actions{gap:9px;margin-top:22px}
.profile-hero .actions button{min-width:112px;border-radius:12px;padding:12px 17px;font-size:13px;transition:transform .15s,box-shadow .15s}
.profile-hero .actions button:hover{transform:translateY(-1px);box-shadow:0 5px 14px #087f7318}
.profile-hero .follow,.profile-hero .primary{background:linear-gradient(135deg,#087f73,#06685f);box-shadow:0 4px 10px #087f7325}
.profile-hero .message,.profile-hero .tradebtn,.profile-hero .feedbackbtn,.profile-hero .following{border:1px solid #dce9e6}
#page>.card:not(.profile),.social-columns>.card{border:1px solid #e9eeed;border-radius:18px;box-shadow:0 5px 20px rgba(20,45,40,.045);padding:20px}
#page .section-title{font-size:17px;color:#203a35;margin-bottom:14px}
#page .section-title h2{font-size:17px;margin:0}
#page .trade{background:#f5faf8;border:1px solid #e8f1ee}
#page .trade b{color:#087f73}
@media(max-width:520px){
 .wrap{padding:12px 10px 28px}
 .profile.profile-hero{padding:23px 14px 17px;border-radius:18px}
 .profile-hero .avatar{width:88px;height:88px}
 .profile-hero .badges{gap:6px}
 .profile-hero .badge{font-size:10px;padding:6px 8px;min-height:28px}
 .profile-hero .stats{margin-top:19px;padding-top:13px}
 .profile-hero .stat b{font-size:19px}
 .profile-hero .stat span{font-size:9px;letter-spacing:.25px}
 .profile-hero .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .profile-hero .actions button{min-width:0;width:100%}
 #page>.card:not(.profile),#page .social-columns>.card{padding:15px}
}

/* Compact people search in the profile header */
.header-row{justify-content:space-between}
.profile-header-actions{margin-left:auto;display:flex;align-items:center}
.profile-search-toggle{width:38px;height:38px;border:1px solid #ffffff50;border-radius:12px;background:#ffffff1c;color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profile-search-toggle:hover{background:#ffffff30}
.profile-search-bar{display:none;position:relative;margin:13px auto 0;max-width:540px}
.profile-search-bar.open{display:block}
.profile-search-bar input{width:100%;height:42px;border:1px solid #ffffff55;border-radius:12px;background:#fff;color:#17212b;padding:0 45px 0 13px;font-size:14px;outline:none}
.profile-search-bar>button{position:absolute;right:8px;top:5px;width:32px;height:32px;border:0;border-radius:8px;background:#edf5f4;color:#087f73;font-size:23px;cursor:pointer}
.profile-search-results{display:none;position:absolute;top:48px;left:0;right:0;max-height: min(55vh,360px);overflow:auto;background:#fff;color:#17212b;border:1px solid #e1e8e6;border-radius:13px;box-shadow:0 12px 30px #0003;z-index:1000}
.profile-search-results.show{display:block}
.profile-search-result{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eef1f3;cursor:pointer}
.profile-search-result:last-child{border-bottom:0}
.profile-search-result:hover{background:#f2f9f7}
.profile-search-result img,.profile-search-result-avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;object-fit:cover;background:#e2f1ed;color:#087f73;display:flex;align-items:center;justify-content:center;font-weight:700}
.profile-search-result-copy{min-width:0;flex:1}
.profile-search-result-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.profile-search-result-id{font-size:11px;color:#77847f;margin-top:3px;overflow-wrap:anywhere}
.profile-search-message{padding:14px;text-align:center;font-size:12px;color:#7a8494}
@media(max-width:480px){.profile-search-toggle{width:35px;height:35px}.profile-search-bar{margin-top:10px}}
