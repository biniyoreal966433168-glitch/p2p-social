<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallet • P2P Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f8;
  color:#172033;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e2e8ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#064e46,#10a889);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.p-left{
  position:absolute;
  left:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid white;
  border-right:0;
  border-radius:8px 0 0 8px;
}

.p-right{
  position:absolute;
  right:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid white;
  border-left:0;
  border-radius:0 8px 8px 0;
}

.center-dot{
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  position:absolute;
}

.brand-name{
  font-size:19px;
  font-weight:800;
}

.brand-name span{
  color:#087f73;
}

.security{
  color:#087f73;
  font-size:13px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px;
}

/* BALANCE */

.balance-card{
  background:linear-gradient(135deg,#064e46,#10a889);
  color:white;
  border-radius:20px;
  padding:24px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(8,127,115,.18);
}

.balance-card:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-70px;
  top:-75px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
}

.label{
  font-size:13px;
  opacity:.8;
}

.balance{
  font-size:34px;
  font-weight:bold;
  margin:8px 0;
}

.available{
  font-size:13px;
  opacity:.8;
}

/* QUICK ACTIONS */

.quick-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0;
}

.quick-actions button{
  padding:14px 8px;
  background:white;
  color:#172033;
  border:1px solid #dce5e7;
  border-radius:13px;
  cursor:pointer;
  font-weight:bold;
}

.action-icon{
  display:block;
  font-size:21px;
  color:#087f73;
  margin-bottom:5px;
}

/* TITLES */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0 12px;
}

.section-title h2{
  font-size:20px;
}

.section-title span{
  color:#087f73;
  font-size:13px;
  font-weight:bold;
}

/* CREATE ORDER */

.order-card{
  background:white;
  border:1px solid #dfe7e9;
  border-radius:17px;
  padding:18px;
}

.order-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.order-type{
  border:1px solid #dce5e7;
  background:#f8fafb;
  border-radius:12px;
  padding:14px 10px;
  cursor:pointer;
  font-weight:bold;
  text-align:left;
}

.order-type.active{
  border-color:#087f73;
  background:#e2f5ef;
}

.order-type.buy{
  color:#159447;
}

.order-type.sell{
  color:#d9364f;
}

.more-btn{
  width:100%;
  margin-top:12px;
  border:0;
  background:#edf3f3;
  color:#087f73;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.more-content{
  display:none;
  margin-top:15px;
}

.more-content.show{
  display:block;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  color:#71808a;
  margin-bottom:7px;
}

.input-box{
  display:flex;
  align-items:center;
  background:#f5f8f8;
  border:1px solid #dce5e7;
  border-radius:10px;
  overflow:hidden;
}

.input-box input,
.input-box select{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
  background:transparent;
  font-size:15px;
}

.currency{
  padding:0 13px;
  color:#087f73;
  font-weight:bold;
}

.create-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#064e46,#10a889);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* OFFERS */

.offer-empty{
  background:white;
  border:1px dashed #cbd7da;
  border-radius:15px;
  padding:28px 15px;
  text-align:center;
  color:#7b8790;
}

.offer{
  background:white;
  border:1px solid #dfe7e9;
  border-radius:15px;
  padding:16px;
  margin-bottom:10px;
}

.offer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.seller{
  font-weight:bold;
}

.online{
  color:#159447;
  font-size:12px;
  margin-top:3px;
}

.price{
  font-size:19px;
  font-weight:bold;
  color:#087f73;
}

.offer-info{
  display:flex;
  justify-content:space-between;
  color:#71808a;
  font-size:12px;
  margin-bottom:13px;
}

.buy-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#e2f5ef;
  color:#087f73;
  font-weight:bold;
  cursor:pointer;
}

/* TRANSACTIONS */

.transaction{
  background:white;
  border:1px solid #dfe7e9;
  border-radius:13px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.transaction-left{
  display:flex;
  gap:11px;
  align-items:center;
}

.transaction-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e2f5ef;
  color:#087f73;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.transaction-title{
  font-weight:bold;
  font-size:14px;
}

.transaction-date{
  color:#89949b;
  font-size:11px;
  margin-top:4px;
}

.transaction-amount{
  font-weight:bold;
  font-size:14px;
}

/* STATUS */

.status{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:9px;
  background:#edf3f3;
  color:#087f73;
  font-size:13px;
}

/* NAVIGATION */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:white;
  border-top:1px solid #dfe7e9;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
  box-shadow:0 -4px 15px rgba(0,0,0,.05);
}

.bottom-nav a{
  color:#7b8790;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  min-width:55px;
}

.bottom-nav a.active{
  color:#087f73;
  font-weight:bold;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.live-nav{
  color:#ef3155 !important;
}

@media(max-width:450px){

  .container{
    padding:14px;
  }

  .brand-name{
    font-size:17px;
  }

  .security{
    font-size:11px;
  }

  .balance{
    font-size:30px;
  }

  .order-grid{
    grid-template-columns:1fr;
  }

  .quick-actions button{
    font-size:11px;
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="brand-logo">
      <div class="p-left"></div>
      <div class="p-right"></div>
      <div class="center-dot"></div>
    </div>

    <div class="brand-name">
      P2P <span>Social</span>
    </div>

  </div>

  <div class="security">
    🔒 Secure
  </div>

</header>


<main class="container">

<!-- BALANCE -->

<section class="balance-card">

  <div class="label">
    TOTAL WALLET BALANCE
  </div>

  <div
    class="balance"
    id="balance">
    Loading...
  </div>

  <div class="available">
    Available for P2P trading
  </div>

</section>


<!-- QUICK ACTIONS -->

<div class="quick-actions">

  <button onclick="deposit()">
    <span class="action-icon">＋</span>
    Deposit
  </button>

  <button onclick="withdraw()">
    <span class="action-icon">↗</span>
    Withdraw
  </button>

  <button onclick="showHistory()">
    <span class="action-icon">📜</span>
    History
  </button>

</div>


<!-- CREATE ORDER -->

<div class="section-title">

  <h2>Create Order</h2>

  <span id="selectedType">
    Buy USDT/ETB
  </span>

</div>


<section class="order-card">

  <div class="order-grid">

    <button
      class="order-type buy active"
      id="buyUsdt"
      onclick="selectOrder('buy_usdt')">
      🟢 Buy USDT/ETB
    </button>

    <button
      class="order-type sell"
      id="sellUsdt"
      onclick="selectOrder('sell_usdt')">
      🔴 Sell USDT/ETB
    </button>

    <button
      class="order-type buy"
      id="buyEtb"
      onclick="selectOrder('buy_etb')">
      🟢 Buy ETB/ETB
    </button>

    <button
      class="order-type sell"
      id="sellEtb"
      onclick="selectOrder('sell_etb')">
      🔴 Sell ETB/ETB
    </button>

  </div>


  <button
    class="more-btn"
    id="moreButton"
    onclick="toggleMore()">
    More... ▼
  </button>


  <div
    class="more-content"
    id="moreContent">

    <div class="field">

      <label>
        Amount
      </label>

      <div class="input-box">

        <input
          type="number"
          id="orderAmount"
          placeholder="0.00"
          min="0"
          step="0.01">

        <span
          class="currency"
          id="amountCurrency">
          ETB
        </span>

      </div>

    </div>


    <div class="field">

      <label>
        Price
      </label>

      <div class="input-box">

        <input
          type="number"
          id="orderPrice"
          placeholder="0.00"
          min="0"
          step="0.01">

        <span class="currency">
          ETB
        </span>

      </div>

    </div>


    <div class="field">

      <label>
        Payment method
      </label>

      <div class="input-box">

        <select id="paymentMethod">

          <option value="">
            Select payment method
          </option>

          <option value="Telebirr">
            Telebirr
          </option>

          <option value="Bank">
            Bank Transfer
          </option>

          <option value="CBE">
            CBE
          </option>

          <option value="Awash">
            Awash Bank
          </option>

        </select>

      </div>

    </div>


    <div class="field">

      <label>
        Trade expiration
      </label>

      <div class="input-box">

        <select id="expiration">

          <option value="15">
            15 minutes
          </option>

          <option value="30">
            30 minutes
          </option>

          <option value="60">
            1 hour
          </option>

          <option value="1440">
            24 hours
          </option>

        </select>

      </div>

    </div>


    <button
      class="create-btn"
      onclick="createOrder()">
      Create Order
    </button>


    <div
      class="status"
      id="orderStatus">
    </div>

  </div>

</section>


<!-- AVAILABLE OFFERS -->

<div class="section-title">

  <h2>
    Available Offers
  </h2>

  <span>
    Live
  </span>

</div>


<section id="offers">

  <div class="offer-empty">
    No active traders available.
  </div>

</section>


<!-- TRANSACTIONS -->

<div class="section-title">

  <h2>
    Recent Transactions
  </h2>

  <span>
    View all
  </span>

</div>


<section id="transactions">

  <div class="offer-empty">
    No transactions yet.
  </div>

</section>

</main>


<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    Home
  </a>

  <a
    href="live.html"
    class="live-nav">
    <span class="nav-icon">🔴</span>
    Live
  </a>

  <a
    href="wallet.html"
    class="active">
    <span class="nav-icon">🔄</span>
    P2P
  </a>

  <a href="message.html">
    <span class="nav-icon">💬</span>
    Messages
  </a>

  <a href="profile.html">
    <span class="nav-icon">👤</span>
    Profile
  </a>

</nav>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_PROJECT_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let selectedOrder =
  "buy_usdt";


/* =====================================================
   LOGIN PROTECTION
===================================================== */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getSession();

  if(error){

    console.error(error);

    location.href =
      "login.html";

    return false;

  }

  if(!data.session){

    location.href =
      "login.html";

    return false;

  }

  currentUser =
    data.session.user;

  return true;

}


/* =====================================================
   LOAD PROFILE/WALLET BALANCE
===================================================== */

async function loadBalance(){

  const balanceElement =
    document.getElementById(
      "balance"
    );

  if(!currentUser){

    balanceElement.textContent =
      "0.00 ETB";

    return;

  }


  try{

    /*
      IMPORTANT:

      This reads the balance belonging
      to the currently logged-in user.

      Your wallets table needs:

      user_id
      balance

    */

    const {
      data,
      error
    } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


    if(error){

      console.error(
        "Balance error:",
        error
      );

      balanceElement.textContent =
        "0.00 ETB";

      return;

    }


    const balance =
      data &&
      data.balance !== null
        ? Number(data.balance)
        : 0;


    balanceElement.textContent =
      balance.toLocaleString(
        undefined,
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      ) +
      " ETB";


  }catch(error){

    console.error(error);

    balanceElement.textContent =
      "0.00 ETB";

  }

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  if(!currentUser){

    return;

  }

  const container =
    document.getElementById(
      "transactions"
    );


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(20);


    if(error){

      console.error(error);

      return;

    }


    if(!data ||
       data.length === 0){

      container.innerHTML = `
        <div class="offer-empty">
          No transactions yet.
        </div>
      `;

      return;

    }


    container.innerHTML = "";


    data.forEach(row => {

      const amount =
        Number(
          row.amount || 0
        );

      const title =
        row.type ||
        "Transaction";

      const date =
        row.created_at
        ? new Date(
            row.created_at
          ).toLocaleString()
        : "";


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "transaction";


      div.innerHTML = `

        <div class="transaction-left">

          <div class="transaction-icon">
            ${amount >= 0 ? "↓" : "↑"}
          </div>

          <div>

            <div class="transaction-title">
              ${escapeHtml(title)}
            </div>

            <div class="transaction-date">
              ${escapeHtml(date)}
            </div>

          </div>

        </div>

        <div class="transaction-amount">
          ${amount >= 0 ? "+" : ""}
          ${amount.toFixed(2)}
          ETB
        </div>

      `;


      container.appendChild(
        div
      );

    });


  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   LOAD REAL P2P OFFERS
===================================================== */

async function loadOffers(){

  const container =
    document.getElementById(
      "offers"
    );


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq(
        "status",
        "open"
      )
      .limit(20);


    if(error){

      console.error(error);

      container.innerHTML = `
        <div class="offer-empty">
          No active traders available.
        </div>
      `;

      return;

    }


    /*
      NO FAKE TRADERS.

      If there are no real open orders,
      this remains empty.
    */

    if(!data ||
       data.length === 0){

      container.innerHTML = `
        <div class="offer-empty">
          No active traders available.
        </div>
      `;

      return;

    }


    container.innerHTML = "";


    data.forEach(order => {

      const amount =
        Number(
          order.amount || 0
        );

      const price =
        Number(
          order.price || 0
        );


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "offer";


      div.innerHTML = `

        <div class="offer-top">

          <div>

            <div class="seller">
              Real P2P Trader
            </div>

            <div class="online">
              ● Active
            </div>

          </div>

          <div class="price">
            ${price.toFixed(2)} ETB
          </div>

        </div>

        <div class="offer-info">

          <span>
            ${escapeHtml(
              order.type || ""
            )}
          </span>

          <span>
            Amount:
            ${amount.toFixed(2)}
          </span>

        </div>

        <button
          class="buy-btn"
          onclick="takeOrder('${order.id}')">
          Start Trade
        </button>

      `;


      container.appendChild(
        div
      );

    });


  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="offer-empty">
        No active traders available.
      </div>
    `;

  }

}


/* =====================================================
   SELECT ORDER
===================================================== */

function selectOrder(type){

  selectedOrder =
    type;


  document
    .querySelectorAll(
      ".order-type"
    )
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  if(type === "buy_usdt"){

    document
      .getElementById(
        "buyUsdt"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "selectedType"
      )
      .textContent =
      "Buy USDT/ETB";

    document
      .getElementById(
        "amountCurrency"
      )
      .textContent =
      "ETB";

  }


  if(type === "sell_usdt"){

    document
      .getElementById(
        "sellUsdt"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "selectedType"
      )
      .textContent =
      "Sell USDT/ETB";

    document
      .getElementById(
        "amountCurrency"
      )
      .textContent =
      "USDT";

  }


  if(type === "buy_etb"){

    document
      .getElementById(
        "buyEtb"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "selectedType"
      )
      .textContent =
      "Buy ETB/ETB";

    document
      .getElementById(
        "amountCurrency"
      )
      .textContent =
      "ETB";

  }


  if(type === "sell_etb"){

    document
      .getElementById(
        "sellEtb"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "selectedType"
      )
      .textContent =
      "Sell ETB/ETB";

    document
      .getElementById(
        "amountCurrency"
      )
      .textContent =
      "ETB";

  }

}


/* =====================================================
   MORE
===================================================== */

function toggleMore(){

  const content =
    document.getElementById(
      "moreContent"
    );

  const button =
    document.getElementById(
      "moreButton"
    );


  content.classList.toggle(
    "show"
  );


  if(
    content.classList.contains(
      "show"
    )
  ){

    button.textContent =
      "More... ▲";

  }else{

    button.textContent =
      "More... ▼";

  }

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createOrder(){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }


  const amount =
    Number(
      document.getElementById(
        "orderAmount"
      ).value
    );

  const price =
    Number(
      document.getElementById(
        "orderPrice"
      ).value
    );

  const payment =
    document.getElementById(
      "paymentMethod"
    ).value;

  const expiration =
    Number(
      document.getElementById(
        "expiration"
      ).value
    );


  const status =
    document.getElementById(
      "orderStatus"
    );


  if(amount <= 0){

    alert(
      "Enter a valid amount."
    );

    return;

  }


  if(price <= 0){

    alert(
      "Enter a valid price."
    );

    return;

  }


  if(!payment){

    alert(
      "Select a payment method."
    );

    return;

  }


  status.style.display =
    "block";

  status.textContent =
    "Creating order...";


  try{

    const expiresAt =
      new Date(
        Date.now() +
        expiration * 60000
      ).toISOString();


    const {
      error
    } =
    await supabaseClient
      .from("orders")
      .insert({

        user_id:
          currentUser.id,

        type:
          selectedOrder,

        amount:
          amount,

        price:
          price,

        payment_method:
          payment,

        status:
          "open",

        expires_at:
          expiresAt

      });


    if(error){

      console.error(error);

      status.textContent =
        "Order could not be created.";

      alert(
        "Order could not be created. Check your Supabase orders table and RLS policy."
      );

      return;

    }


    status.textContent =
      "Order created successfully.";

    document.getElementById(
      "orderAmount"
    ).value = "";

    document.getElementById(
      "orderPrice"
    ).value = "";


    await loadOffers();

  }catch(error){

    console.error(error);

    status.textContent =
      "Something went wrong.";

  }

}

/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
