<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#f4f7f8;color:#172033;min-height:100vh;padding-bottom:90px}
button,input,select,textarea{font-family:Arial,sans-serif}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}

header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e2e8ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:100
}

.brand{display:flex;align-items:center;gap:10px}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#064e46,#10a889);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
  flex-shrink:0
}

.p-left{
  position:absolute;
  left:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid #fff;
  border-right:0;
  border-radius:8px 0 0 8px
}

.p-right{
  position:absolute;
  right:8px;
  top:10px;
  width:13px;
  height:23px;
  border:4px solid #fff;
  border-left:0;
  border-radius:0 8px 8px 0
}

.center-dot{
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
  position:absolute
}

.brand-name{font-size:19px;font-weight:800}
.brand-name span{color:#087f73}
.security{color:#ef3155;font-size:13px;font-weight:bold}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 12px
}

.section-title h2{font-size:20px}
.section-title span{color:#087f73;font-size:13px;font-weight:bold}
.section-actions{display:flex;align-items:center;gap:7px}

.view-btn,.refresh-btn{
  border:none;
  background:#edf7f5;
  color:#087f73;
  padding:7px 10px;
  border-radius:8px;
  font-weight:bold
}

.offer-list{display:flex;flex-direction:column;gap:10px}

.offer-card{
  background:#fff;

  border-radius:15px;

}

.offer-main{padding:16px}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.offer-user{font-weight:bold}
.offer-meta{color:#7b8790;font-size:12px;margin-top:5px}

.offer-price{
  font-size:18px;
  font-weight:bold;
  color:#087f73;
  text-align:right
}

.offer-amount{
  margin-top:10px;
  font-size:13px;
  color:#596579
}

.offer-trade{
  width:100%;
  margin-top:12px;
  border:none;
  padding:11px;
  border-radius:9px;
  background:#ef3155;
  color:#fff;
  font-weight:bold
}

.offer-type{
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  background:#fde8ed;
  color:#d72c50
}

.profile-btn{
  margin-top:10px;
  width:100%;
  padding:9px;
  border:1px solid #d7ebe7;
  background:#f7fbfa;
  color:#087f73;
  border-radius:9px;
  font-weight:bold
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
  background:#edf3f3;
  color:#596579;
  text-transform:capitalize
}

.status.active,
.status.open{
  background:#e2f5ef;
  color:#087f73
}

.status.pending{
  background:#fff2d9;
  color:#a56a00
}

.status.expired,
.status.cancelled,
.status.closed{
  background:#fde8ed;
  color:#d72c50
}

.status.disputed{
  background:#fff2d9;
  color:#a56a00
}

.status.completed,
.status.released,
.status.paid,
.status.payment_confirmed{
  background:#e9f7eb;
  color:#159447
}

.empty{
  background:#fff;
  border:1px dashed #ccd8da;
  border-radius:15px;
  padding:30px 18px;
  text-align:center;
  color:#7b8790
}

.empty-icon{font-size:34px;margin-bottom:10px}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.2)
}

.modal-box h3{margin-bottom:15px}

.modal-box input,
.modal-box textarea{
  width:100%;
  border:1px solid #dfe4eb;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
  outline:none;
  font-size:14px
}

.modal-box input:focus,
.modal-box textarea:focus{
  border-color:#087f73;
  box-shadow:0 0 0 3px rgba(8,127,115,.08)
}

.modal-box input[readonly]{
  background:#f5f7f8;
  color:#172033;
  font-weight:bold
}

.modal-box textarea{
  min-height:90px;
  resize:vertical
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:5px
}

.modal-actions button{
  flex:1;
  padding:11px;
  border:none;
  border-radius:10px;
  font-weight:bold
}

.close-btn{background:#edf0f4;color:#172033}
.confirm-btn{background:#ef3155;color:#fff}

.details{
  padding:15px 16px;
  border-top:1px solid #e5ebec;
  background:#fafcfc
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
  font-size:13px
}

.detail-row:last-child{margin-bottom:0}
.detail-row span:first-child{color:#7a8790}
.detail-row strong{text-align:right;overflow-wrap:anywhere}

.trade-value{
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#edf7f5;
  border:1px solid #d7ebe7
}

.trade-value-title{
  font-weight:bold;
  color:#087f73;
  margin-bottom:10px
}

.trade-value .detail-row{margin-bottom:8px}
.trade-value .detail-row:last-child{margin-bottom:0}

.trade-value .receive-row strong{
  color:#087f73;
  font-size:15px
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#fff;
  border-top:1px solid #dfe7e9;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:300;
  box-shadow:0 -4px 15px rgba(0,0,0,.05)
}

.bottom-nav a{
  color:#7b8790;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  min-width:55px
}

.bottom-nav a.active{
  color:#087f73;
  font-weight:bold
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px
}

.live-nav{color:#ef3155!important}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:13px;
  z-index:1000;
  display:none;
  max-width:90%;
  text-align:center
}

.toast.show{display:block}
.toast.success{background:#087f73}
.toast.error{background:#b4233f}
.toast.warning{background:#9a6500}

@media(max-width:450px){
  .container{padding:14px}
  .brand-name{font-size:17px}
  .security{font-size:11px}
  .offer-price{font-size:16px}
  .bottom-nav{height:70px}
  .section-title h2{font-size:17px}
  .view-btn,.refresh-btn{
    padding:6px 7px;
    font-size:11px
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-logo" aria-label="P2P Social logo">
      <div class="p-left"></div>
      <div class="p-right"></div>
      <div class="center-dot"></div>
    </div>

    <div class="brand-name">
      P2P <span>Social</span>
    </div>
  </div>

  <div class="security">🔴 Sell Market</div>
</header>

<main class="container">

  <div class="section-title">
    <h2>
      🔴 Available Buy (<span id="offerCount">0</span>)
    </h2>

    <div class="section-actions">

      <button
        type="button"
        id="offerViewButton"
        class="view-btn"
        onclick="toggleOffers()"
      >
        View All
      </button>

      <button
        type="button"
        class="refresh-btn"
        onclick="loadSellMarket()"
      >
        🔃 Refresh
      </button>

    </div>
  </div>

  <section id="offers" class="offer-list">

    <div class="empty">
      <div class="empty-icon">🔴</div>
      <strong>Loading Available Buy...</strong>

  </section>

</main>

<div id="tradeModal" class="modal" role="dialog" aria-modal="true">

  <div class="modal-box">

    <h3>🤝 Sell USDT</h3>

    <div id="tradeSummary"></div>

    <input
      id="tradeAmount"
      type="number"
      min="0"
      step="0.000001"
      placeholder="USDT amount"
      readonly
    >

    <div class="modal-actions">

      <button
        type="button"
        class="close-btn"
        onclick="closeModal('tradeModal')"
      >
        Cancel
      </button>

        type="button"
        class="confirm-btn"

        Start Trade
      </button>

    </div>

  </div>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="bottom-nav">

  <a href="index.html">
    <span class="nav-icon">🏠</span>
    Home
  </a>

  <a href="live.html">
    <span class="nav-icon">🟢</span>
    Buy
  </a>

  <a href="wallet.html" class="active">
    <span class="nav-icon">🔴</span>
    Sell

  <a href="message.html">
    <span class="nav-icon">💬</span>
    Messages
  </a>

  <a href="profile.html">

    Profile
  </a>

</nav>

<script>

const SUPABASE_URL =
"https://mbsvuwrgigqfporxwpfr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentSession = null;
let currentUser = null;
let currentUsername = null;

let availableOffers = [];
let selectedOffer = null;

let offersExpanded = false;

let realtimeChannel = null;
let tradeRealtimeChannel = null;

let toastTimer = null;
let isLoading = false;
let actionLoading = false;

const usernameCache = new Map();

document.addEventListener(
  "DOMContentLoaded",
  startApp
);

async function startApp(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();

    if(error){
      console.error("SESSION ERROR:",error);
      showLogin();
      return;
    }

    currentSession =
      data.session;

    if(!currentSession){
      showLogin();
      return;
    }

    currentUser =
      currentSession.user;

    await loadCurrentUsername();
    await loadSellMarket();

    setupRealtime();

  }catch(error){

    console.error(
      "START ERROR:",
      error
    );

    toast(
      getErrorMessage(error),
      "error"
    );
  }
}

function showLogin(){

  alert("Please login first.");

  window.location.href =
    "login.html";
}

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    currentSession =
      session;

    currentUser =
      session?.user ||
      null;

    if(!currentUser){
      currentUsername = null;
    }

    if(event === "SIGNED_OUT"){

      if(realtimeChannel){
        supabaseClient.removeChannel(
          realtimeChannel
        );
        realtimeChannel = null;
      }

      if(tradeRealtimeChannel){
        supabaseClient.removeChannel(
          tradeRealtimeChannel
        );
        tradeRealtimeChannel = null;
      }

      window.location.href =
        "login.html";
    }
  }
);

async function loadCurrentUsername(){

  if(!currentUser)return;

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select("username")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(error)throw error;

    currentUsername =
      data?.username ||
      currentUser.user_metadata?.username ||
      null;

    if(currentUsername){

      usernameCache.set(
        String(currentUser.id),
        currentUsername
      );
    }

  }catch(error){

    console.error(
      "USERNAME ERROR:",
      error
    );

    currentUsername =
      currentUser.user_metadata?.username ||
      null;
  }
}

async function loadOfferUsernames(){

  const ids = [
    ...new Set(
      availableOffers
        .map(offer => offer.user_id)
        .filter(Boolean)
        .map(String)
    )
  ];

  const missing =
    ids.filter(
      id => !usernameCache.has(id)
    );

  if(!missing.length)return;

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select("id,username")
      .in("id",missing);

    if(error)throw error;

    (data || []).forEach(
      profile => {

        if(
          profile.id &&
          profile.username
        ){

          usernameCache.set(
            String(profile.id),
            profile.username
          );
        }
      }
    );

  }catch(error){

    console.error(
      "BUY USERNAMES ERROR:",
      error
    );
  }
}

async function loadSellMarket(){

  if(!currentUser){
    showLogin();
    return;
  }

  if(isLoading)return;

  isLoading = true;

  const container =
    document.getElementById("offers");

  if(container){

    container.innerHTML =
      '<div class="empty"><div class="empty-icon">🔴</div><strong>Loading Available Buy...</strong></div>';
  }

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("p2p_orders")
      .select(
        "id,user_id,username,order_type,pair,amount,price,payment_method,status,remaining_amount,created_at,updated_at"
      )
      .eq(
        "order_type",
        "buy"
      )
      .in(
        "status",
        [
          "active",
          "open"
        ]
      )
      .gt(
        "remaining_amount",
        0
      )
      .neq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error){

      console.error(
        "SELL MARKET ERROR:",
        error
      );

      availableOffers = [];

      if(container){

        container.innerHTML =
          emptyHtml(
            "⚠️",
            "Could not load Available Buy.",
            getErrorMessage(error)
          );
      }

      updateOfferButton();

      return;
    }

    availableOffers =
      (data || []).filter(
        offer =>
          String(
            offer.user_id
          ) !==
          String(
            currentUser.id
          ) &&
          [
            "active",
            "open"
          ].includes(
            normalizeStatus(
              offer.status
            )
          ) &&
          getOfferAvailableAmount(
            offer
          ) > 0
      );

    await loadOfferUsernames();

    const count =
      document.getElementById(
        "offerCount"
      );

    if(count){
      count.textContent =
        availableOffers.length;
    }

    renderSellMarket();

  }catch(error){

    console.error(
      "SELL MARKET ERROR:",
      error
    );

    availableOffers = [];

    if(container){

      container.innerHTML =
        emptyHtml(
          "⚠️",
          "Could not load Available Buy.",
          getErrorMessage(error)
        );
    }

    updateOfferButton();

  }finally{

    isLoading = false;
  }
}

function renderSellMarket(){

  const container =
    document.getElementById("offers");

  if(!container)return;

  if(!availableOffers.length){

    container.innerHTML =
      emptyHtml(
        "🔴",
        "No Available Buy.",
        "Active buyers from other traders will appear here."
      );

    updateOfferButton();

    return;
  }

  container.innerHTML = "";

  const items =
    offersExpanded
      ? availableOffers
      : availableOffers.slice(0,3);

  items.forEach(
    offer => {

      const parts =
        getPairParts(
          offer.pair
        );

      const username =
        offer.username ||
        usernameCache.get(
          String(offer.user_id)
        ) ||
        "Buyer";

      const available =
        getOfferAvailableAmount(
          offer
        );

      const price =
        Number(offer.price) || 0;

      const payment =
        offer.payment_method ||
        "Bank Transfer";

      const card =
        document.createElement("div");

      card.className =
        "offer-card";

      card.innerHTML = `

        <div class="offer-main">

          <div class="row">

            <div>

              <div class="offer-user">
                👤 ${escapeHtml(username)}
              </div>

              <div class="offer-meta">
                🔴 · ${escapeHtml(formatPair(offer))}
              </div>

            </div>

            <span class="offer-type">
              🔴 Sell
            </span>

          </div>

          <div
            class="details"
            style="margin-top:12px;border-top:0;"
          >

            ${detail(
              "Buying price",
              money(price) +
              " " +
              (
                parts.quote ||
                "ETB"
              )
            )}

            <div class="detail-row">

              <span>
                Status
              </span>

              <strong>
                <span class="status ${escapeHtml(normalizeStatus(offer.status))}">
                  ${escapeHtml(normalizeStatus(offer.status))}
                </span>
              </strong>

            </div>

            ${detail(
              "Available",
              formatAmount(offer)
            )}

            ${detail(
              "Payment",
              payment
            )}

          </div>

          <button
            type="button"
            class="profile-btn"
            onclick="viewUser('${escapeJs(offer.user_id)}')"
          >
            👤 View Buyer
          </button>

          <button
            type="button"
            class="offer-trade"
            onclick="openTrade('${escapeJs(offer.id)}')"
          >
            🤝 Sell USDT
          </button>

        </div>
      `;

      container.appendChild(card);
    }
  );

  updateOfferButton();
}

function viewUser(userId){

  if(!userId)return;

  window.location.href =
    "profile.html?user_id=" +
    encodeURIComponent(userId);
}

async function openMessagesForTrade(
  tradeId,
  offer
){

  if(!currentUser){
    showLogin();
    return;
  }

  if(!tradeId){
    toast(
      "Trade ID is missing.",
      "error"
    );
    return;
  }

  if(!offer?.user_id){
    toast(
      "Buyer information is missing.",
      "error"
    );
    return;
  }

  try{

    const buyerId =
      String(
        offer.user_id
      );

    let conversation = null;

    let conversationError = null;

    const firstConversation =
      await supabaseClient
        .from("conversations")
        .select(
          "id,user_one,user_two"
        )
        .eq(
          "user_one",
          currentUser.id
        )
        .eq(
          "user_two",
          buyerId
        )
        .maybeSingle();

    conversation =
      firstConversation.data;

    conversationError =
      firstConversation.error;

    if(conversationError){
      throw conversationError;
    }

    if(!conversation){

      const secondConversation =
        await supabaseClient
          .from("conversations")
          .select(
            "id,user_one,user_two"
          )
          .eq(
            "user_one",
            buyerId
          )
          .eq(
            "user_two",
            currentUser.id
          )
          .maybeSingle();

      conversation =
        secondConversation.data;

      conversationError =
        secondConversation.error;

      if(conversationError){
        throw conversationError;
      }
    }

    if(!conversation){

      const createdConversation =
        await supabaseClient
          .from("conversations")
          .insert({
            user_one:
              currentUser.id,
            user_two:
              buyerId
          })
          .select(
            "id,user_one,user_two"
          )
          .single();

      if(
        createdConversation.error
      ){

        const retryConversation =
          await supabaseClient
            .from("conversations")
            .select(
              "id,user_one,user_two"
            )
            .eq(
              "user_one",
              buyerId
            )
            .eq(
              "user_two",
              currentUser.id
            )
            .maybeSingle();

        if(
          retryConversation.error ||
          !retryConversation.data
        ){

          throw createdConversation.error;
        }

        conversation =
          retryConversation.data;

      }else{

        conversation =
          createdConversation.data;
      }
    }

    if(!conversation?.id){

      throw new Error(
        "Could not create the conversation."
      );
    }

    const orderMessage =
      "🔴 P2P Sell started. Please complete the payment for this trade.";

    const existingMessage =
      await supabaseClient
        .from("messages")
        .select(
          "id,conversation_id,order_id"
        )
        .eq(
          "conversation_id",
          conversation.id
        )
        .eq(
          "sender_id",
          currentUser.id
        )
        .eq(
          "message_type",
          "order"
        )
        .eq(
          "order_id",
          tradeId
        )
        .limit(1)
        .maybeSingle();

    if(
      existingMessage.error
    ){
      throw existingMessage.error;
    }

    if(!existingMessage.data){

      const {
        error:messageError
      } =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:
            conversation.id,
          sender_id:
            currentUser.id,
          content:
            orderMessage,
          message_type:
            "order",
          order_id:
            tradeId
        });

      if(messageError){
        throw messageError;
      }
    }

    const username =
      await getUsername(
        buyerId
      );

    const params =
      new URLSearchParams();

    params.set(
      "trade_id",
      String(tradeId)
    );

    params.set(
      "order_id",
      String(tradeId)
    );

    params.set(
      "username",
      username || "User"
    );

    window.location.href =
      "message.html?" +
      params.toString();

  }catch(error){

    console.error(
      "OPEN TRADE MESSAGE ERROR:",
      error
    );

    toast(
      "Trade started, but the P2P message could not be created: " +
      getErrorMessage(error),
      "error"
    );
  }
}

async function getUsername(userId){

  if(!userId){
    return "User";
  }

  const key =
    String(userId);

  if(usernameCache.has(key)){
    return usernameCache.get(key);
  }

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select("username")
      .eq("id",userId)
      .maybeSingle();

    if(
      !error &&
      data?.username
    ){

      usernameCache.set(
        key,
        data.username
      );

      return data.username;
    }

  }catch(error){

    console.error(
      "PROFILE USERNAME ERROR:",
      error
    );
  }

  return "User";
}

function updateOfferButton(){

  const button =
    document.getElementById(
      "offerViewButton"
    );

  if(!button)return;

  button.style.display =
    availableOffers.length > 3
      ? "block"
      : "none";

  button.textContent =
    offersExpanded
      ? "Show 3"
      : "View All";
}

function toggleOffers(){

  offersExpanded =
    !offersExpanded;

  renderSellMarket();
}

function openTrade(
  offerId
){

  selectedOffer =
    availableOffers.find(
      offer =>
        String(offer.id) ===
        String(offerId)
    );

  if(!selectedOffer){

    toast(
      "This Available Buy is no longer available. Refresh.",
      "warning"
    );

    return;
  }

  if(
    String(
      selectedOffer.user_id
    ) ===
    String(
      currentUser?.id
    )
  ){

    toast(
      "You cannot trade with your own entry.",
      "warning"
    );

    return;
  }

  const status =
    normalizeStatus(
      selectedOffer.status
    );

  if(
    ![
      "active",
      "open"
    ].includes(status)
  ){

    toast(
      "This Available Buy is no longer active.",
      "warning"
    );

    return;
  }

  const available =
    getOfferAvailableAmount(
      selectedOffer
    );

  if(available <= 0){

    toast(
      "This Available Buy has no remaining amount.",
      "warning"
    );

    return;
  }

  const input =
    document.getElementById(
      "tradeAmount"
    );

  input.value =
    available;

  input.min =
    available;

  input.max =
    available;

  const parts =
    getPairParts(
      selectedOffer.pair
    );

  const username =
    selectedOffer.username ||
    usernameCache.get(
      String(
        selectedOffer.user_id
      )
    ) ||
    "Buyer";

  const price =
    Number(
      selectedOffer.price
    ) || 0;

  const tradeValue =
    available * price;

  const sellerFee =
    tradeValue * 0.01;

  const buyerFee =
    tradeValue * 0.01;

  const sellerReceives =
    tradeValue - sellerFee;

  document.getElementById(
    "tradeSummary"
  ).innerHTML = `

    <div
      class="details"
      style="margin-bottom:12px;"
    >

      ${detail(
        "Buyer",
        username
      )}

      ${detail(
        "Pair",
        formatPair(selectedOffer)
      )}

      ${detail(
        "Buying price",
        money(price) +
        " " +
        (
          parts.quote ||
          "ETB"
        )
      )}

      ${detail(
        "Amount",
        formatTradeAmount(available)
      )}

      ${detail(
        "Payment",
        selectedOffer.payment_method ||
        "Bank Transfer"
      )}

      <div class="trade-value">

        <div class="trade-value-title">
          💰 Trade Value
        </div>

        ${detail(
          "USDT amount",
          formatTradeAmount(available)
        )}

        ${detail(
          "Trade value",
          money(tradeValue) +
          " " +
          (
            parts.quote ||
            "ETB"
          )
        )}

        ${detail(
          "Buyer fee 1%",
          money(buyerFee) +
          " " +
          (
            parts.quote ||
            "ETB"
          )
        )}

        ${detail(
          "Seller fee 1%",
          money(sellerFee) +
          " " +
          (
            parts.quote ||
            "ETB"
          )
        )}

        <div class="detail-row receive-row">

          <span>
            You receive
          </span>

          <strong>
            ${money(sellerReceives)}
            ${escapeHtml(
              parts.quote ||
              "ETB"
            )}
          </strong>

        </div>

      </div>

    </div>
  `;

  openModal(
    "tradeModal"
  );
}

function getOfferAvailableAmount(
  offer
){

  if(!offer)return 0;

  const remaining =
    Number(
      offer.remaining_amount
    );

  if(
    Number.isFinite(remaining) &&
    remaining >= 0
  ){
    return remaining;
  }

  const amount =
    Number(
      offer.amount
    );

  return Number.isFinite(amount) &&
    amount >= 0
      ? amount
      : 0;
}

async function submitTrade(){

  if(actionLoading)return;

  if(!currentUser){

    showLogin();
    return;
  }

  if(!selectedOffer){

    toast(
      "Select an Available Buy first.",
      "warning"
    );

    return;
  }

  let freshOffer = null;

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("p2p_orders")
      .select(
        "id,user_id,username,order_type,pair,amount,price,payment_method,status,remaining_amount,created_at,updated_at"
      )
      .eq(
        "id",
        selectedOffer.id
      )
      .maybeSingle();

    if(error){

      toast(
        getErrorMessage(error),
        "error"
      );

      return;
    }

    if(!data){

      toast(
        "This Available Buy is no longer available.",
        "warning"
      );

      closeModal("tradeModal");

      await loadSellMarket();

      return;
    }

    freshOffer =
      data;

  }catch(error){

    toast(
      getErrorMessage(error),
      "error"
    );

    return;
  }

  selectedOffer =
    freshOffer;

  if(
    String(
      selectedOffer.order_type
    ).toLowerCase() !==
    "buy"
  ){

    toast(
      "This is not a Buy Market entry.",
      "warning"
    );

    closeModal("tradeModal");

    return;
  }

  const status =
    normalizeStatus(
      selectedOffer.status
    );

  if(
    ![
      "active",
      "open"
    ].includes(status)
  ){

    toast(
      "This Available Buy is no longer active.",
      "warning"
    );

    closeModal("tradeModal");

    await loadSellMarket();

    return;
  }

  const max =
    getOfferAvailableAmount(
      selectedOffer
    );

  if(max <= 0){

    toast(
      "This Available Buy has no remaining amount.",
      "warning"
    );

    closeModal("tradeModal");

    await loadSellMarket();

    return;
  }

  if(
    String(
      selectedOffer.user_id
    ) ===
    String(
      currentUser.id
    )
  ){

    toast(
      "You cannot trade with your own entry.",
      "warning"
    );

    closeModal("tradeModal");

    return;
  }

  if(max < 50){

    toast(
      "Trade amount must be at least 50 USDT.",
      "warning"
    );

    closeModal("tradeModal");

    return;
  }

  const amount =
    Number(
      document.getElementById(
        "tradeAmount"
      ).value
    );

  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    toast(
      "Invalid USDT amount.",
      "warning"
    );

    return;
  }

  if(
    amount < 50
  ){

    toast(
      "Trade amount must be at least 50 USDT.",
      "warning"
    );

    return;
  }

  if(
    Math.abs(
      amount - max
    ) >
    .000000001
  ){

    toast(
      "The sell amount must match the Available Buy amount.",
      "warning"
    );

    return;
  }

  const normalizedAmount =
    Number(
      amount.toFixed(6)
    );

  if(
    !Number.isFinite(
      normalizedAmount
    ) ||
    normalizedAmount <= 0
  ){

    toast(
      "Invalid USDT amount.",
      "warning"
    );

    return;
  }

  if(
    !confirm(
      "Sell this amount of USDT to the buyer?"
    )
  ){
    return;
  }

  const button =
    document.getElementById(
      "tradeSubmitButton"
    );

  actionLoading = true;

  button.disabled = true;
  button.textContent = "Starting...";

  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "create_p2p_trade",
      {
        p_order_id:
          selectedOffer.id,
        p_amount:
          normalizedAmount
      }
    );

    if(error){

      toast(
        getErrorMessage(error),
        "error"
      );

      return;
    }

    const tradeId =
      extractId(data);

    if(!tradeId){

      toast(
        "Trade was created but no trade ID was returned.",
        "error"
      );

      return;
    }

    const tradeOffer =
      selectedOffer;

    closeModal(
      "tradeModal"
    );

    selectedOffer = null;

    await loadSellMarket();

    await openMessagesForTrade(
      tradeId,
      tradeOffer
    );

  }catch(error){

    toast(
      getErrorMessage(error),
      "error"
    );

  }finally{

    actionLoading = false;

    button.disabled = false;
    button.textContent = "Start Trade";
  }
}

function extractId(data){

  if(!data)return null;

  if(typeof data === "string"){
    return data;
  }

  if(typeof data === "number"){
    return data;
  }

  if(typeof data === "object"){

    return (
      data.id ||
      data.trade_id ||
      data.order_id ||
      data[0]?.id ||
      data[0]?.trade_id ||
      data[0]?.order_id ||
      null
    );
  }

  return null;
}

function setupRealtime(){

  if(!currentUser)return;

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "sell-market-live-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"p2p_orders"
        },
        () => {
          loadSellMarket();
        }
      )
      .subscribe(
        status => {
          console.log(
            "Sell market realtime:",
            status
          );
        }
      );

  if(tradeRealtimeChannel){

    supabaseClient.removeChannel(
      tradeRealtimeChannel
    );
  }

  tradeRealtimeChannel =
    supabaseClient
      .channel(
        "sell-trades-live-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"p2p_trades"
        },
        () => {
          loadSellMarket();
        }
      )
      .subscribe(
        status => {
          console.log(
            "Sell trades realtime:",
            status
          );
        }
      );
}

function openModal(id){

  const e =
    document.getElementById(id);

  if(!e)return;

  e.classList.add("show");
}

function closeModal(id){

  const e =
    document.getElementById(id);

  if(e){
    e.classList.remove("show");
  }
}

function formatPair(offer){

  const pair =
    String(
      offer?.pair ||
      ""
    );

  if(pair.includes("_")){

    return pair.replace(
      "_",
      " / "
    );
  }

  return pair || "P2P";
}

function formatAmount(offer){

  const amount =
    getOfferAvailableAmount(
      offer
    );

  return (
    formatTradeAmount(
      amount
    )
  );
}

function formatTradeAmount(
  amount
){

  const number =
    Number(amount);

  if(
    !Number.isFinite(number)
  ){
    return "0.000000 USDT";
  }

  return number.toLocaleString(
    undefined,
    {
      minimumFractionDigits:6,
      maximumFractionDigits:6
    }
  ) +
  " USDT";
}

function getPairParts(pair){

  const parts =
    String(
      pair || ""
    ).split("_");

  return {
    base:
      parts[0] || "",
    quote:
      parts[1] || ""
  };
}

function money(value){

  const number =
    Number(value);

  if(
    !Number.isFinite(number)
  ){
    return "0.00";
  }

  return number.toLocaleString(
    undefined,
    {
      minimumFractionDigits:2,
      maximumFractionDigits:6
    }
  );
}

function normalizeStatus(status){

  return String(
    status ||
    "pending"
  )
  .trim()
  .toLowerCase() ||
  "pending";
}

function detail(
  label,
  value
){

  const rendered =
    String(
      value ?? ""
    );

  return `
    <div class="detail-row">

      <span>
        ${escapeHtml(label)}
      </span>

      <strong>
        ${escapeHtml(rendered)}
      </strong>

    </div>
  `;
}

function emptyHtml(
  icon,
  title,
  message
){

  return `
    <div class="empty">

      <div class="empty-icon">
        ${escapeHtml(
          icon || "ℹ️"
        )}
      </div>

      <strong>
        ${escapeHtml(
          title || ""
        )}
      </strong>

      ${
        message
        ?
        `
          <div style="margin-top:7px;">
            ${escapeHtml(message)}
          </div>
        `
        :
        ""
      }

    </div>
  `;
}

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'")
  .replace(/"/g,'\\"')
  .replace(/\r/g,"\\r")
  .replace(/\n/g,"\\n");
}

function getErrorMessage(error){

  if(!error){
    return "Something went wrong.";
  }

  return (
    error.message ||
    error.details ||
    error.hint ||
    "Something went wrong."
  );
}

function toast(
  message,
  type="normal"
){

  const e =
    document.getElementById(
      "toast"
    );

  if(!e)return;

  clearTimeout(
    toastTimer
  );

  e.textContent =
    String(
      message || ""
    );

  e.classList.remove(
    "success",
    "error",
    "warning"
  );

  if(
    [
      "success",
      "error",
      "warning"
    ].includes(type)
  ){

    e.classList.add(type);
  }

  e.classList.add("show");

  toastTimer =
    setTimeout(
      () => {
        e.classList.remove("show");
      },
      3500
    );
}

document.addEventListener(
  "click",
  event => {

    if(
      event.target.classList.contains(
        "modal"
      )
    ){

      event.target.classList.remove(
        "show"
      );
    }
  }
);

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      document
        .querySelectorAll(
          ".modal.show"
        )
        .forEach(
          modal =>
            modal.classList.remove(
              "show"
            )
        );
    }
  }
);

setInterval(
  async () => {

    if(
      currentUser &&
      document.visibilityState ===
      "visible"
    ){

      try{
        await loadSellMarket();
      }catch(error){
        console.error(
          "AUTO REFRESH ERROR:",
          error
        );
      }
    }

  },
  30000
);

window.addEventListener(
  "beforeunload",
  () => {

    if(realtimeChannel){

      supabaseClient.removeChannel(
        realtimeChannel
      );
    }

    if(tradeRealtimeChannel){

      supabaseClient.removeChannel(
        tradeRealtimeChannel
      );
    }
  }
);

</script>
