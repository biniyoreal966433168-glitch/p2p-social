<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live • P2P Social</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f8;
  color:#172033;
  min-height:100vh;
  padding-bottom:85px;
}


/* =========================
   HEADER
========================= */

header{
  height:68px;
  background:#ffffff;
  border-bottom:1px solid #e2e8e7;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  position:sticky;
  top:0;
  z-index:20;
}


/* =========================
   BRAND
========================= */

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:43px;
  height:43px;
  border-radius:14px;

  background:linear-gradient(
    135deg,
    #064e46,
    #10a889
  );

  position:relative;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}


/* LEFT P */

.brand-logo .p-left{
  position:absolute;

  left:8px;
  top:10px;

  width:13px;
  height:23px;

  border:4px solid white;
  border-right:0;

  border-radius:
    8px 0 0 8px;
}


/* RIGHT P */

.brand-logo .p-right{
  position:absolute;

  right:8px;
  top:10px;

  width:13px;
  height:23px;

  border:4px solid white;
  border-left:0;

  border-radius:
    0 8px 8px 0;
}


/* CENTER */

.brand-logo .center{
  width:12px;
  height:12px;

  background:white;

  border-radius:50%;

  position:absolute;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:5;
}

.brand-logo .dot{
  width:4px;
  height:4px;

  background:#087f73;

  border-radius:50%;
}


/* BRAND TEXT */

.brand-text{
  font-size:19px;
  font-weight:800;
  color:#172033;
}

.brand-text span{
  color:#087f73;
}

.live-status{
  color:#e11d48;
  font-weight:bold;
  font-size:13px;
}


/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:18px;
}


/* =========================
   LIVE VIDEO
========================= */

.video-box{
  width:100%;
  aspect-ratio:16 / 9;

  background:
    radial-gradient(
      circle at center,
      #26433f,
      #071412
    );

  border-radius:18px;

  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.camera-icon{
  font-size:60px;
  opacity:.7;
}

.live-badge{
  position:absolute;

  top:15px;
  left:15px;

  background:#e11d48;

  color:white;

  padding:7px 12px;

  border-radius:8px;

  font-weight:bold;

  font-size:13px;
}

.viewers{
  position:absolute;

  top:15px;
  right:15px;

  background:rgba(0,0,0,.65);

  color:white;

  padding:7px 12px;

  border-radius:8px;

  font-size:13px;
}


/* =========================
   STREAM INFO
========================= */

.stream-info{
  padding:18px 3px 5px;
}

.stream-info h1{
  font-size:23px;
  margin-bottom:8px;
  color:#172033;
}

.host{
  color:#687384;
  font-size:14px;
}

.host span{
  color:#087f73;
  font-weight:bold;
}


/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  gap:10px;

  margin:15px 0;

  flex-wrap:wrap;
}

.actions button{
  border:none;

  border-radius:10px;

  padding:11px 16px;

  background:white;

  color:#172033;

  border:1px solid #dce5e3;

  cursor:pointer;

  font-size:14px;

  font-weight:bold;

  box-shadow:
    0 3px 10px rgba(0,0,0,.04);
}

.actions button:hover{
  border-color:#087f73;
  color:#087f73;
}

.gift-btn{
  background:#087f73 !important;
  color:white !important;
  border-color:#087f73 !important;
}


/* =========================
   CHAT
========================= */

.chat{
  background:white;

  border:1px solid #e1e8e6;

  border-radius:17px;

  overflow:hidden;

  margin-top:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.05);
}

.chat-header{
  padding:15px;

  border-bottom:1px solid #e5ebe9;

  font-weight:bold;

  color:#172033;
}

.messages{
  height:280px;

  overflow-y:auto;

  padding:15px;

  background:#fbfcfc;
}

.message{
  margin-bottom:13px;

  line-height:1.4;

  font-size:14px;
}

.username{
  color:#087f73;
  font-weight:bold;
}

.chat-input{
  display:flex;

  padding:12px;

  gap:8px;

  border-top:1px solid #e5ebe9;

  background:white;
}

.chat-input input{
  flex:1;

  padding:12px;

  border-radius:10px;

  border:1px solid #dce5e3;

  outline:none;

  background:#f4f7f8;

  color:#172033;

  font-size:14px;
}

.chat-input input:focus{
  border-color:#087f73;
}

.chat-input button{
  border:none;

  padding:0 18px;

  border-radius:10px;

  background:#087f73;

  color:white;

  font-weight:bold;

  cursor:pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:70px;

  background:white;

  border-top:1px solid #dfe7e5;

  display:flex;

  justify-content:space-around;
  align-items:center;

  z-index:30;

  box-shadow:
    0 -4px 18px rgba(0,0,0,.05);
}

.bottom-nav a{
  color:#7a8491;

  text-decoration:none;

  font-size:11px;

  text-align:center;

  min-width:55px;
}

.bottom-nav a.active{
  color:#087f73;

  font-weight:bold;
}

.nav-icon{
  display:block;

  font-size:21px;

  margin-bottom:4px;
}

.live-nav{
  color:#e11d48 !important;
}

.live-nav.active{
  color:#e11d48 !important;
}


/* =========================
   RESPONSIVE
========================= */

@media(min-width:800px){

  .video-box{
    max-width:900px;
    margin:auto;
  }

  .stream-info,
  .actions{
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
  }

  .chat{
    max-width:700px;
    margin-left:auto;
    margin-right:auto;
  }

}

@media(max-width:450px){

  header{
    padding:0 13px;
  }

  .brand-text{
    font-size:17px;
  }

  .brand-logo{
    width:39px;
    height:39px;
  }

  .live-status{
    font-size:12px;
  }

  .container{
    padding:12px;
  }

  .stream-info h1{
    font-size:20px;
  }

  .actions button{
    padding:10px 12px;
    font-size:13px;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="brand">

    <!-- SAME P2P SOCIAL LOGO DESIGN -->

    <div class="brand-logo">

      <div class="p-left"></div>

      <div class="p-right"></div>

      <div class="center">
        <div class="dot"></div>
      </div>

    </div>

    <div class="brand-text">
      P2P <span>Social</span>
    </div>

  </div>


  <div class="live-status">
    🔴 LIVE
  </div>

</header>



<main class="container">


<!-- =========================
     LIVE VIDEO
========================= -->

<div class="video-box">

  <div class="live-badge">
    🔴 LIVE
  </div>

  <div class="viewers" id="viewerCount">
    👁 128 viewers
  </div>

  <div class="camera-icon">
    📹
  </div>

</div>



<!-- =========================
     STREAM INFO
========================= -->

<section class="stream-info">

  <h1>
    P2P Social Live Stream
  </h1>

  <p class="host">
    Hosted by
    <span>@username</span>
  </p>

</section>



<!-- =========================
     ACTIONS
========================= -->

<div class="actions">

  <button onclick="followHost()">
    👤 Follow
  </button>

  <button onclick="shareLive()">
    ↗️ Share
  </button>

  <button
    class="gift-btn"
    onclick="sendGift()">

    🎁 Send Gift

  </button>

</div>



<!-- =========================
     LIVE CHAT
========================= -->

<section class="chat">

  <div class="chat-header">
    💬 Live Chat
  </div>


  <div
    class="messages"
    id="messages">

    <div class="message">

      <span class="username">
        @alex
      </span>

      : Welcome to the live! 👋

    </div>


    <div class="message">

      <span class="username">
        @user123
      </span>

      : Nice stream 🔥

    </div>


    <div class="message">

      <span class="username">
        @crypto
      </span>

      : Hello everyone!

    </div>

  </div>


  <form
    class="chat-input"
    id="chatForm">

    <input
      type="text"
      id="chatMessage"
      placeholder="Write a message..."
      maxlength="200"
      required
    >

    <button type="submit">
      Send
    </button>

  </form>

</section>


</main>



<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav class="bottom-nav">


  <a href="index.html">

    <span class="nav-icon">
      🏠
    </span>

    Home

  </a>


  <a
    href="live.html"
    class="active live-nav">

    <span class="nav-icon">
      🔴
    </span>

    Live

  </a>


  <a href="wallet.html">

    <span class="nav-icon">
      🔄
    </span>

    P2P

  </a>


  <a href="message.html">

    <span class="nav-icon">
      💬
    </span>

    Messages

  </a>


  <a href="profile.html">

    <span class="nav-icon">
      👤
    </span>

    Profile

  </a>


</nav>



<script>


/* =========================
   CHAT
========================= */

const chatForm =
  document.getElementById("chatForm");

const chatMessage =
  document.getElementById("chatMessage");

const messages =
  document.getElementById("messages");


chatForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const text =
      chatMessage.value.trim();

    if(!text) return;


    const message =
      document.createElement("div");

    message.className =
      "message";


    const username =
      document.createElement("span");

    username.className =
      "username";

    username.textContent =
      "You";


    message.appendChild(username);

    message.appendChild(
      document.createTextNode(
        ": " + text
      )
    );


    messages.appendChild(message);

    messages.scrollTop =
      messages.scrollHeight;

    chatMessage.value = "";

  }
);


/* =========================
   FOLLOW
========================= */

function followHost(){

  alert(
    "You are now following @username!"
  );

}


/* =========================
   SHARE
========================= */

async function shareLive(){

  if(navigator.share){

    try{

      await navigator.share({

        title:
          "P2P Social Live",

        text:
          "Watch this live stream on P2P Social!",

        url:
          window.location.href

      });

    }catch(error){

      console.log(error);

    }

  }else{

    try{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Live link copied."
      );

    }catch(error){

      alert(
        "Copy this page link to share the live stream."
      );

    }

  }

}


/* =========================
   SEND GIFT
========================= */

function sendGift(){

  alert(
    "Gift system will connect to your P2P Social wallet."
  );

}


/* =========================
   SIMPLE VIEWER UPDATE
========================= */

let viewers = 128;

setInterval(function(){

  const change =
    Math.floor(
      Math.random() * 5
    ) - 2;

  viewers =
    Math.max(
      1,
      viewers + change
    );

  document.getElementById(
    "viewerCount"
  ).textContent =
    "👁 " + viewers + " viewers";

},5000);


</script>


</body>
</html>
