async function submitTrade(){if(actionLoading)return;if(!currentUser)return showLogin();if(!selectedOffer)return toast("Select an available buy first.","warning");let pending=pendingTrades.get(String(selectedOffer.id));if(pending)return String(pending.seller_id)==String(currentUser.id)?openExistingTrade(pending.id):toast("This buy offer already has a pending trade.","warning");try{let{data,error}=await supabaseClient.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();if(error)throw error;if(!data){closeModal("tradeModal");await loadSellMarket();return toast("This available buy is no longer available.","warning")}selectedOffer=data;if(String(data.user_id)==String(currentUser.id)||String(data.order_type).toLowerCase()!="buy")return closeModal("tradeModal");if(!["active","open"].includes(normalizeStatus(data.status)))return closeModal("tradeModal"),toast("This available buy is no longer active.","warning");let{data:ts,error:te}=await supabaseClient.from("p2p_trades").select("id,order_id,buyer_id,seller_id,status,payment_confirmed").eq("order_id",data.id);if(te)throw te;let active=(ts||[]).find(t=>!["completed","released","cancelled","canceled","expired","closed"].includes(normalizeStatus(t.status)));if(active){pendingTrades.set(String(data.id),active);renderSellMarket();return String(active.seller_id)==String(currentUser.id)?openExistingTrade(active.id):toast("This buy offer already has a pending trade.","warning")}let available=getOfferAvailableAmount(data),amount=Number(document.getElementById("tradeAmount").value),minimum=getMinimumTradeAmount(data);if(available<=0)return closeModal("tradeModal"),toast("This available buy has no remaining amount.","warning");if(!Number.isFinite(amount)||amount<=0)return toast("Invalid available amount.","warning");if(amount<minimum)return toast("Trade amount must be at least "+minimum+" USDT.","warning");let normalized=Number(available.toFixed(2));if(Math.abs(amount-normalized)>.000001){document.getElementById("tradeAmount").value=normalized.toFixed(2);updateTradeValuePreview();return toast("You must sell the full available amount.","warning")}if(!confirm("Sell the full available amount to the buyer?"))return;let b=document.getElementById("tradeSubmitButton");actionLoading=true;b.disabled=true;b.textContent="Starting...";let{data:trade,error:rpcError}=await supabaseClient.rpc("create_p2p_trade",{p_order_id:data.id,p_amount:amount});if(rpcError)throw rpcError;let tradeId=extractId(trade);if(!tradeId)throw Error("Trade started, but the trade ID was not returned.");let offer=data;closeModal("tradeModal");toast("Sell trade started successfully.","success");selectedOffer=null;await loadSellMarket();await openMessagesForTrade(tradeId,offer)}catch(e){console.error(e);toast(getErrorMessage(e),"error")}finally{actionLoading=false;let b=document.getElementById("tradeSubmitButton");if(b){b.disabled=false;b.textContent="Start Trade"}}}
function extractId(d){if(d==null)return null;if(typeof d=="string"||typeof d=="number")return d;if(typeof d=="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id}
function setupRealtime(){if(!currentUser)return;if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);realtimeChannel=supabaseClient.channel("sell-market-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},()=>loadSellMarket()).subscribe();if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);tradeRealtimeChannel=supabaseClient.channel("sell-trades-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},()=>loadSellMarket()).subscribe()}
function openModal(id){document.getElementById(id)?.classList.add("show")}function closeModal(id){document.getElementById(id)?.classList.remove("show")}function formatPair(o){let p=String(o?.pair||o?.trading_pair||"");return p.includes("_")?p.replace("_"," / "):p.includes("/")?p:p||"P2P"}function formatAmount(o){let a=getOfferAvailableAmount(o),p=getPairParts(o?.pair||o?.trading_pair);return a.toLocaleString(undefined,{maximumFractionDigits:6})+" "+(p.base||"USDT")}function getPairParts(p){let x=String(p||"").trim().toUpperCase().replace("/","_").split("_");return{base:x[0]||"USDT",quote:x[1]||"ETB"}}function money(v){let n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00"}function normalizeStatus(s){return String(s||"").trim().toLowerCase()}function detail(l,v){return`<div class="detail-row"><span>${escapeHtml(l)}</span><strong>${escapeHtml(String(v??""))}</strong></div>`}function emptyHtml(i,t,m){return`<div class="empty"><div class="empty-icon">${escapeHtml(i)}</div><strong>${escapeHtml(t)}</strong>${m?`<div style="margin-top:7px">${escapeHtml(m)}</div>`:""}</div>`}function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}function getErrorMessage(e){return e?.message||e?.details||e?.hint||"Something went wrong."}function toast(m,t="normal"){let e=document.getElementById("toast");clearTimeout(toastTimer);e.textContent=String(m||"");e.className="toast show"+(["success","error","warning"].includes(t)?" "+t:"");toastTimer=setTimeout(()=>e.classList.remove("show"),3500)}document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key=="Escape")document.querySelectorAll(".modal.show").forEach(x=>x.classList.remove("show"))});setInterval(()=>currentUser&&document.visibilityState=="visible"&&loadSellMarket().catch(console.error),30000);window.addEventListener("beforeunload",()=>{if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel)});
</script></body></html>
