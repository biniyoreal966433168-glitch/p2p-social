.modal.show{display:flex}

.nav-icon{display:block;font-size:21px;margin-bottom:4px}

.eligibility-required-badges{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px}.eligibility-required-badges:before{content:'Eligible';display:block;flex:0 0 100%;font-size:10px;font-weight:600;line-height:1.3;color:#9299a4;margin-bottom:1px}
.eligibility-required-badge{display:inline-flex;align-items:center;white-space:nowrap;padding:3px 6px;border-radius:6px;font-size:9px;font-weight:700;line-height:1.2;border:1px solid transparent}
.eligibility-required-badge.basic{background:#fde8e8;color:#b42318;border-color:#f5b8b8}
.eligibility-required-badge.verified{background:#e7f8f1;color:#087f73;border-color:#bfe9d8}
.eligibility-required-badge.merchant{background:#edf2ff;color:#3459a6;border-color:#d7e1ff}
.eligibility-required-badge.famous{background:#fff0f6;color:#b83270;border-color:#f7d1e2}
.eligibility-required-badge.rich{background:#fff7e4;color:#936000;border-color:#f2dfae}
.eligibility-required-badge.pro-trader{background:#f0eaff;color:#6941c6;border-color:#d9ccff}
.eligibility-required-badge.active{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
.eligibility-required-badge.old{background:#e8eefc;color:#344e9a;border-color:#cbd7fb}
.eligibility-required-badge.any{background:#eef1f5;color:#667085;border-color:#e4e7ec}
body.night-mode .eligibility-required-badge{filter:brightness(.88)}

/* Professional market section heading and Buy/Sell switch */
.market-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-width:0}
.market-heading h2{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.35px;white-space:nowrap}
.offer-count{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:#eaf4f2;color:#087f73;font-size:12px;font-weight:800;line-height:1}
.market-switch{display:inline-flex;align-items:center;gap:4px;padding:4px;background:#eef2f3;border:1px solid #e0e7e9;border-radius:12px;flex-shrink:0}
.market-switch .market-action-btn{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:8px 13px;border:0;border-radius:9px;font-size:12px;font-weight:800;line-height:1;text-decoration:none;white-space:nowrap;box-shadow:none;transition:background .16s ease,color .16s ease,transform .16s ease}
.market-switch .buy-action{background:transparent;color:#087f73}
.market-switch .sell-action{background:transparent;color:#bd2948}
.market-switch .buy-action.active{background:#087f73;color:#fff;box-shadow:0 2px 6px rgba(8,127,115,.2)}
.market-switch .sell-action.active{background:#c52d4c;color:#fff;box-shadow:0 2px 6px rgba(197,45,76,.2)}
.market-switch .market-action-btn:active{transform:scale(.97)}
@media(max-width:380px){.market-heading{gap:7px}.market-heading h2{font-size:16px;gap:6px}.market-switch{gap:2px;padding:3px}.market-switch .market-action-btn{min-width:54px;padding:8px 9px}}

/* P2P Social branded trade navigation loader */
#p2pBrandLoader{position:fixed;inset:0;z-index:50000;display:none;align-items:center;justify-content:center;background:rgba(245,247,251,.96);backdrop-filter:blur(7px)}#p2pBrandLoader.show{display:flex}.p2p-loader-card{display:flex;flex-direction:column;align-items:center;gap:15px;padding:28px 34px;border:1px solid #dcebe7;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(7,94,84,.16);min-width:220px}.p2p-loader-logo{width:58px;height:58px;object-fit:contain;border-radius:16px;background:linear-gradient(135deg,#064e46,#10a889);padding:7px;box-shadow:0 7px 18px rgba(8,127,115,.2)}.p2p-loader-brand{font-size:20px;font-weight:800;color:#075e54;letter-spacing:-.4px}.p2p-loader-brand span{color:#10a889}.p2p-loader-message{font-size:13px;color:#667780;font-weight:600}.p2p-loader-spinner{width:25px;height:25px;border:3px solid #d8eee9;border-top-color:#087f73;border-radius:50%;animation:p2pLoaderSpin .75s linear infinite}@keyframes p2pLoaderSpin{to{transform:rotate(360deg)}}body.night-mode #p2pBrandLoader{background:rgba(15,23,42,.96)}body.night-mode .p2p-loader-card{background:#172033;border-color:#344b52}body.night-mode .p2p-loader-brand{color:#d8fff5}body.night-mode .p2p-loader-message{color:#b5c3c8}
