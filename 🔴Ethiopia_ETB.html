<header>

<main class="container">

<button id="usdtTab" class="market-tab active" onclick="setMarketPair('USDT_ETB')">USDT / ETB</button>

<script>
const U="https://mbsvuwrgigqfporxwpfr.supabase.co",K="sb_publishable_iclqtQHDwK5IEve0cNjrgQ_CdUDCuBa",supabaseClient=supabase.createClient(U,K);
let currentSession=null,currentUser=null,currentUsername=null,availableOffers=[],filteredOffers=[],selectedOffer=null,offersExpanded=false,realtimeChannel=null,tradeRealtimeChannel=null,toastTimer=null,isLoading=false,actionLoading=false,marketPair="USDT_ETB";
const usernameCache=new Map,profileCache=new Map,pendingTrades=new Map;

document.addEventListener("DOMContentLoaded",startApp);

async function startApp(){
try{
let{data,error}=await supabaseClient.auth.getSession();
if(error)throw error;
currentSession=data.session;
if(!currentSession)return showLogin();
currentUser=currentSession.user;
updateMarketTabs();
await loadCurrentUsername();
await loadSellMarket();
setupRealtime()
}catch(e){console.error(e);toast(getErrorMessage(e),"error")}
}

function showLogin(){location.href="login.html"}

supabaseClient.auth.onAuthStateChange((e,s)=>{
currentSession=s;currentUser=s?.user||null;
if(!currentUser)currentUsername=null;
if(e==="SIGNED_OUT"){
if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
location.href="login.html"
}
});

function setMarketPair(pair){
if(!["USDT_ETB","TON_ETB"].includes(pair))return;
if(marketPair===pair)return;
marketPair=pair;
offersExpanded=false;
selectedOffer=null;
document.getElementById("usdtSearch").value="";
updateMarketTabs();
loadSellMarket()
}

function updateMarketTabs(){
document.getElementById("usdtTab").classList.toggle("active",marketPair==="USDT_ETB");
document.getElementById("tonTab").classList.toggle("active",marketPair==="TON_ETB");
let asset=marketPair.split("_")[0];
document.getElementById("usdtSearch").placeholder="Search "+asset+" Amount";
document.getElementById("tradeAmount").placeholder="Available "+asset
}

async function loadCurrentUsername(){
if(!currentUser)return;
try{
let{data}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
currentUsername=data?.username||currentUser.user_metadata?.username||null;
if(data)profileCache.set(String(currentUser.id),data);
if(currentUsername)usernameCache.set(String(currentUser.id),currentUsername)
}catch(e){currentUsername=currentUser.user_metadata?.username||null}
}

async function getUsername(id){
if(!id)return"User";let k=String(id);
if(profileCache.has(k))return profileCache.get(k).username||"User";
try{let{data}=await supabaseClient.from("profiles").select("*").eq("id",id).maybeSingle();if(data){profileCache.set(k,data);if(data.username)usernameCache.set(k,data.username);return data.username||"User"}}catch(e){}
return usernameCache.get(k)||"User"
}

async function loadOfferUsernames(){
let ids=[...new Set(availableOffers.map(x=>x.user_id).filter(Boolean).map(String))],m=ids.filter(x=>!profileCache.has(x));
if(!m.length)return;
try{let{data,error}=await supabaseClient.from("profiles").select("*").in("id",m);if(error)throw error;(data||[]).forEach(x=>{if(!x.id)return;profileCache.set(String(x.id),x);if(x.username)usernameCache.set(String(x.id),x.username)})}catch(e){}
}

async function loadPendingTrades(ids){
pendingTrades.clear();
if(!ids.length)return;
try{
let{data,error}=await supabaseClient.from("p2p_trades").select("id,order_id,buyer_id,seller_id,amount,status,payment_confirmed,expires_at").in("order_id",ids);
if(error)throw error;
(data||[]).forEach(t=>{
if(!["completed","released","cancelled","canceled","expired","closed"].includes(normalizeStatus(t.status))&&t.order_id!=null)pendingTrades.set(String(t.order_id),t)
})
}catch(e){console.error(e)}
}

async function loadSellMarket(){
if(!currentUser)return showLogin();
if(isLoading)return;
isLoading=true;
let box=document.getElementById("offers");
box.innerHTML='<div class="empty">Loading available sell...</div>';
try{
let{data,error}=await supabaseClient.from("p2p_orders").select("*")
.eq("order_type","buy")
.eq("pair",marketPair)
.in("status",["active","open"])
.neq("user_id",currentUser.id)
.order("created_at",{ascending:false});
if(error)throw error;
let orders=(data||[]).filter(o=>
String(o.user_id)!==String(currentUser.id)&&
["active","open"].includes(normalizeStatus(o.status))&&
String(o.pair||o.trading_pair||"").toUpperCase().replace("/","_")===marketPair
);
await loadPendingTrades(orders.map(o=>o.id));
availableOffers=orders.filter(o=>getOfferAvailableAmount(o)>0||pendingTrades.has(String(o.id)));
availableOffers.sort((a,b)=>{
let x=Number(a.price),y=Number(b.price);
if(Number.isFinite(x)&&Number.isFinite(y)&&x!==y)return x-y;
if(Number.isFinite(x)!==Number.isFinite(y))return Number.isFinite(x)?-1:1;
return(Date.parse(b.created_at||"")||0)-(Date.parse(a.created_at||"")||0)
});
await loadOfferUsernames();
searchUSDTAmount()
}catch(e){
console.error(e);
availableOffers=[];filteredOffers=[];
box.innerHTML=emptyHtml("⚠️","Could not load available sell.",getErrorMessage(e))
}finally{isLoading=false}
}

function searchUSDTAmount(){
let e=document.getElementById("usdtSearch"),v=Number(e?.value);
filteredOffers=e&&e.value.trim()&&Number.isFinite(v)&&v>0?
availableOffers.filter(o=>getOfferAvailableAmount(o)>=v||pendingTrades.has(String(o.id))):
[...availableOffers];
offersExpanded=false;
document.getElementById("offerCount").textContent=filteredOffers.length;
renderSellMarket()
}

function renderSellMarket(){
let box=document.getElementById("offers");
if(!filteredOffers.length){
let q=document.getElementById("usdtSearch")?.value.trim();
box.innerHTML=emptyHtml(q?"🔎":"🔴",q?"No sell available for this amount.":"No available sell.",q?"Try a smaller amount.":"Available offers will appear here.");
updateOfferButton();return
}
box.innerHTML="";
(offersExpanded?filteredOffers:filteredOffers.slice(0,15)).forEach(o=>{
if(String(o.user_id)===String(currentUser.id))return;
let profile=profileCache.get(String(o.user_id))||{},
name=profile.full_name||profile.display_name||profile.name||profile.real_name||"Buyer",
avatar=profile.avatar_url||"images/profile.png",
pending=pendingTrades.get(String(o.id)),
mine=pending&&String(pending.seller_id)===String(currentUser.id),
amount=getOfferAvailableAmount(o),
display=amount>0?amount:Number(pending?.amount||0),
parts=getPairParts(o.pair||o.trading_pair),
base=parts.base||marketPair.split("_")[0],
completed=Number(profile.completed_trades??profile.trades_completed??profile.total_completed_trades??0),
rate=Number(profile.completion_rate??profile.trade_completion_rate??profile.completed_rate??NaN),
active=profile.is_online===true||profile.online===true||profile.active_now===true,
verified=String(profile.verification_status||"").toLowerCase()==="verified"||profile.is_verified===true||profile.verified===true,
merchant=String(profile.role||"").toLowerCase()==="merchant"||profile.is_merchant===true,
card=document.createElement("div"),
status="Pending Payment";
if(pending){let s=normalizeStatus(pending.status);if(s==="paid"||s==="payment_confirmed"||pending.payment_confirmed)status="Payment Confirmed";else if(s==="disputed")status="Trade Disputed"}
card.className="offer-card";
card.innerHTML='<div class="offer-main reference-sell-card">'+
'<div class="reference-sell-left"><div class="market-profile"><img class="market-avatar" src="'+escapeHtml(avatar)+'" onerror="this.src=\'images/profile.png\'" onclick="viewUser(\''+escapeJs(o.user_id)+'\')" alt=""><div class="market-profile-info"><div class="market-name-line"><button class="offer-user" onclick="viewUser(\''+escapeJs(o.user_id)+'\')">'+escapeHtml(name)+'</button><span class="market-presence '+marketStatus(profile).toLowerCase()+'">'+marketStatus(profile)+'</span></div></div></div>'+
'<div class="profile-tags">'+marketTags(profile)+'</div><div class="profile-status">'+marketStatus(profile)+'</div>'+
'<div class="reference-stats">'+(completed>0?'Trade(s) '+completed.toLocaleString():'')+(Number.isFinite(rate)?' · ✓ '+rate.toFixed(2)+'% completion':'')+'</div>'+
'<div class="reference-price">'+escapeHtml(money(o.price))+' <small>'+escapeHtml(parts.quote||"ETB")+' / '+escapeHtml(base)+'</small></div>'+
'<div class="reference-limits"><div><span>Limit</span><strong>'+escapeHtml(limitText(o))+'</strong></div><div><span>Available</span><strong>'+escapeHtml((display||0).toLocaleString(undefined,{maximumFractionDigits:6})+' '+base)+'</strong></div></div></div>'+
'<div class="reference-sell-right"><div class="offer-method">'+escapeHtml(paymentMethods(o.payment_method||"Bank Transfer"))+'</div><div class="reference-time">◴ '+escapeHtml(timeLimit(o))+'</div>'+
(pending?'<div class="pending-badge">⏳ '+escapeHtml(status)+'</div>':'')+
'<button class="offer-trade '+(pending?(mine?"continue":"pending"):"")+'" '+(pending&&!mine?"disabled":"")+' onclick="'+(pending?(mine?'openExistingTrade(\''+escapeJs(pending.id)+'\')':''):'openTrade(\''+escapeJs(o.id)+'\')')+'">'+(pending?(mine?"Continue Trade":"Pending Payment"):"Sell")+'</button></div></div>';
box.appendChild(card)
});
updateOfferButton()
}

function marketFeeSpent(p){return Math.max(0,Number(p?.total_fees_paid??p?.fees_paid??p?.fee_spent??p?.total_fee_spent??p?.spending_fees??p?.fee_total??0)||0)}
function marketTags(p){const role=String(p?.role??p?.account_type??"basic").toLowerCase(),verified=String(p?.verification_status||"").toLowerCase()==="verified"||p?.is_verified===true||p?.verified===true||p?.user_verified===true,merchant=role==="merchant"||p?.is_merchant===true||p?.merchant===true,followers=Number(p?.followers_count??p?.follower_count??p?.followers??0)||0,spent=marketFeeSpent(p),level=spent>=4?2:spent>=2?1:0,t=[];if(level>0)t.push('<span class="tag on level'+level+'">◇ Level: '+level+'</span>');if(role!=="merchant")t.push('<span class="tag on basic">■ Basic</span>');if(verified)t.push('<span class="tag on verified">■ Verified</span>');if(merchant)t.push('<span class="tag on merchant">■ Merchant</span>');if(followers>=10)t.push('<span class="tag on famous">♡ Famous</span>');if(spent>=10)t.push('<span class="tag on rich">◆ Rich</span>');return t.join("")}
function marketStatus(p){const online=Boolean(p?.is_online??p?.online??false),last=p?.last_seen||p?.last_seen_at||p?.last_active_at;return online||last&&Date.now()-new Date(last).getTime()<60000?"Online":"Offline"}
function limitText(o){const min=o.min_amount??o.minimum_amount??o.min_limit??o.minimum_limit;const max=o.max_amount??o.maximum_amount??o.max_limit??o.maximum_limit;const fmt=v=>v===null||v===undefined||v===""?"":Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:2}):String(v);if(min!==undefined&&min!==null&&min!==""&&max!==undefined&&max!==null&&max!=="")return fmt(min)+" - "+fmt(max)+" ETB";if(min!==undefined&&min!==null&&min!=="")return "Min "+fmt(min)+" ETB";if(max!==undefined&&max!==null&&max!=="")return "Max "+fmt(max)+" ETB";return "1,000 - 10,000 ETB"}
function paymentMethods(v){return Array.isArray(v)?v.join(" · "):String(v||"Bank Transfer").split(/[,;|]/).map(x=>x.trim()).filter(Boolean).join(" · ")}
function timeLimit(o){const v=o.payment_time_limit??o.payment_window_minutes??o.time_limit_minutes??o.payment_minutes??o.time_limit;return v!==undefined&&v!==null&&v!==""?(String(v).includes("min")?String(v):String(v)+" min"):"15 min"}
function openExistingTrade(id){location.href="message.html?trade_id="+encodeURIComponent(id)+"&order_id="+encodeURIComponent(id)}
function viewUser(id){if(id)location.href="profile.html?user_id="+encodeURIComponent(id)}
function getOfferBankName(o){return o?.bank_name||o?.bankName||o?.payment_details?.bank_name||o?.payment_details?.bankName||""}
function getOfferAccountName(o){return o?.account_name||o?.accountName||o?.payment_details?.account_name||o?.payment_details?.accountName||""}
function getOfferAccountNumber(o){return o?.account_number||o?.accountNumber||o?.payment_details?.account_number||o?.payment_details?.accountNumber||""}

async function openMessagesForTrade(tradeId,offer){
if(!tradeId||!offer?.user_id)return toast("Trade started, but buyer information is missing.","error");
if(!currentUser)return showLogin();
try{
let buyerId=offer.user_id,{data:conversation,error}=await supabaseClient.from("conversations").select("id").eq("user_one",currentUser.id).eq("user_two",buyerId).maybeSingle();
if(error)throw error;
if(!conversation){
let r=await supabaseClient.from("conversations").select("id").eq("user_one",buyerId).eq("user_two",currentUser.id).maybeSingle();
if(r.error)throw r.error;conversation=r.data
}
if(!conversation){
let r=await supabaseClient.from("conversations").insert({user_one:currentUser.id,user_two:buyerId}).select("id").single();
if(r.error){
let x=await supabaseClient.from("conversations").select("id").eq("user_one",buyerId).eq("user_two",currentUser.id).maybeSingle();
if(x.error)throw r.error;conversation=x.data
}else conversation=r.data
}
if(!conversation?.id)throw Error("Conversation could not be created.");
let b=getOfferBankName(offer),n=getOfferAccountName(offer),a=getOfferAccountNumber(offer),msg="🔴 P2P Sell started. Please complete the payment for this trade.";
if(b||n||a)msg+="\n\n🏦 Bank Transfer\n"+(b?"Bank Name: "+b+"\n":"")+(n?"Account Name: "+n+"\n":"")+(a?"Account Number: "+a:"");
let{data:existingMessage,error:me}=await supabaseClient.from("messages").select("id").eq("conversation_id",conversation.id).eq("sender_id",currentUser.id).eq("message_type","order").eq("order_id",tradeId).maybeSingle();
if(me)throw me;
if(!existingMessage){
let{error:e}=await supabaseClient.from("messages").insert({conversation_id:conversation.id,sender_id:currentUser.id,content:msg,message_type:"order",order_id:tradeId});
if(e)throw e
}
let username=await getUsername(buyerId),p=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});
if(username)p.set("username",username);
location.href="message.html?"+p
}catch(e){
console.error(e);
toast("Trade started, but the P2P trade message could not be created: "+getErrorMessage(e),"error")
}
}

function updateOfferButton(){
let b=document.getElementById("offerViewButton");
if(!b)return;
b.style.display=filteredOffers.length<=15?"none":"block";
b.textContent=offersExpanded?"Show 15":"View All"
}
function toggleOffers(){offersExpanded=!offersExpanded;renderSellMarket()}

async function openTrade(id){
selectedOffer=availableOffers.find(o=>String(o.id)===String(id));
if(!selectedOffer)return toast("This available offer is no longer available. Refresh.","warning");
let p=pendingTrades.get(String(selectedOffer.id));
if(p)return String(p.seller_id)===String(currentUser.id)?openExistingTrade(p.id):toast("This buy offer already has a pending trade.","warning");
if(String(selectedOffer.user_id)===String(currentUser.id))return toast("You cannot sell to your own buy offer.","warning");
if(!["active","open"].includes(normalizeStatus(selectedOffer.status)))return toast("This available offer is no longer available. Refresh.","warning");
let available=getOfferAvailableAmount(selectedOffer);
if(available<=0)return toast("This available offer has no remaining amount.","warning");
let input=document.getElementById("tradeAmount"),
parts=getPairParts(selectedOffer.pair||selectedOffer.trading_pair),
base=parts.base||marketPair.split("_")[0],
username=usernameCache.get(String(selectedOffer.user_id))||"Buyer";
input.value=available.toFixed(2);input.max=available.toFixed(2);
document.getElementById("tradeTitle").textContent="Sell "+base+" to Buyer";
document.getElementById("tradeAmount").placeholder="Available "+base;
document.getElementById("tradeAssetBadge").textContent=base;
document.getElementById("tradeAmountLabel").textContent=base+" amount";
document.getElementById("tradeSummary").innerHTML=`<div class="details" style="margin-bottom:12px">${detail("Buyer",username)}${detail("Pair",formatPair(selectedOffer))}${detail("Buying price",money(selectedOffer.price)+" "+parts.quote)}${detail("Available",formatAmount(selectedOffer))}${detail("Payment",selectedOffer.payment_method||"Bank Transfer")}${getOfferBankName(selectedOffer)?detail("Bank Name",getOfferBankName(selectedOffer)):""}${getOfferAccountName(selectedOffer)?detail("Account Name",getOfferAccountName(selectedOffer)):""}${getOfferAccountNumber(selectedOffer)?detail("Account Number",getOfferAccountNumber(selectedOffer)):""}</div>`;
updateTradeValuePreview();openModal("tradeModal")
}

function getOfferAvailableAmount(o){
if(!o)return 0;
for(let v of[o.remaining_amount,o.available_amount,o.remaining]){
if(v!==null&&v!==undefined&&v!==""){let n=Number(v);if(Number.isFinite(n)&&n>=0)return n}
}
let n=Number(o.amount);return Number.isFinite(n)&&n>=0?n:0
}
function getMinimumTradeAmount(o){
if(!o)return 1;
for(let v of[o.min_trade_amount,o.minimum_amount,o.min_amount]){let n=Number(v);if(Number.isFinite(n)&&n>0)return n}
return 1
}
function getTradeValue(){return selectedOffer?(Number(document.getElementById("tradeAmount")?.value)||0)*(Number(selectedOffer.price)||0):0}
function updateTradeValuePreview(){
let a=Number(document.getElementById("tradeAmount")?.value)||0,v=getTradeValue(),c=getPairParts(selectedOffer?.pair||selectedOffer?.trading_pair).quote||"ETB";
document.getElementById("tradeAmountPreview").textContent=a.toLocaleString(undefined,{minimumFractionDigits:6,maximumFractionDigits:6});
document.getElementById("tradeValuePreview").textContent=money(v)+" "+c;
document.getElementById("tradeTotalPreview").textContent=money(v)+" "+c
}

async function submitTrade(){
if(actionLoading)return;
if(!currentUser)return showLogin();
if(!selectedOffer)return toast("Select an available sell first.","warning");
let pending=pendingTrades.get(String(selectedOffer.id));
if(pending)return String(pending.seller_id)===String(currentUser.id)?openExistingTrade(pending.id):toast("This buy offer already has a pending trade.","warning");
try{
let{data,error}=await supabaseClient.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();
if(error)throw error;
if(!data){closeModal("tradeModal");await loadSellMarket();return toast("This available offer is no longer available.","warning")}
selectedOffer=data;
if(String(data.user_id)===String(currentUser.id)||String(data.order_type).toLowerCase()!=="buy")return closeModal("tradeModal");
if(String(data.pair||data.trading_pair||"").toUpperCase().replace("/","_")!==marketPair)return closeModal("tradeModal"),toast("This offer belongs to another market.","warning");
if(!["active","open"].includes(normalizeStatus(data.status)))return closeModal("tradeModal"),toast("This available offer is no longer active.","warning");
let{data:ts,error:te}=await supabaseClient.from("p2p_trades").select("id,order_id,buyer_id,seller_id,status,payment_confirmed").eq("order_id",data.id);
if(te)throw te;
let active=(ts||[]).find(t=>!["completed","released","cancelled","canceled","expired","closed"].includes(normalizeStatus(t.status)));
if(active){
pendingTrades.set(String(data.id),active);renderSellMarket();
return String(active.seller_id)===String(currentUser.id)?openExistingTrade(active.id):toast("This buy offer already has a pending trade.","warning")
}
let available=getOfferAvailableAmount(data),amount=Number(document.getElementById("tradeAmount").value);
if(available<=0)return closeModal("tradeModal"),toast("This available offer has no remaining amount.","warning");
if(!Number.isFinite(amount)||amount<=0)return toast("Invalid available amount.","warning");
let normalized=Number(available.toFixed(2));
if(Math.abs(amount-normalized)>.000001){
document.getElementById("tradeAmount").value=normalized.toFixed(2);updateTradeValuePreview();
return toast("You must sell the full available amount.","warning")
}
if(!confirm("Sell the full available amount to the buyer?"))return;
let b=document.getElementById("tradeSubmitButton");
actionLoading=true;b.disabled=true;b.textContent="Starting...";
let{data:trade,error:rpcError}=await supabaseClient.rpc("create_p2p_trade",{p_order_id:data.id,p_amount:amount});
if(rpcError)throw rpcError;
let tradeId=extractId(trade);
if(!tradeId)throw Error("Trade started, but the trade ID was not returned.");
let offer=data;
closeModal("tradeModal");toast("Sell trade started successfully.","success");selectedOffer=null;
await loadSellMarket();await openMessagesForTrade(tradeId,offer)
}catch(e){console.error(e);toast(getErrorMessage(e),"error")}
finally{
actionLoading=false;
let b=document.getElementById("tradeSubmitButton");
if(b){b.disabled=false;b.textContent="Start Trade"}
}
}

function extractId(d){
if(d==null)return null;
if(typeof d==="string"||typeof d==="number")return d;
if(typeof d==="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id
}

function setupRealtime(){
if(!currentUser)return;
if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
realtimeChannel=supabaseClient.channel("sell-market-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},()=>loadSellMarket()).subscribe();
if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel);
tradeRealtimeChannel=supabaseClient.channel("sell-trades-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},()=>loadSellMarket()).subscribe()
}

function openModal(id){document.getElementById(id)?.classList.add("show")}
function closeModal(id){document.getElementById(id)?.classList.remove("show")}
function formatPair(o){
let p=String(o?.pair||o?.trading_pair||"");
return p.includes("_")?p.replace("_"," / "):p.includes("/")?p:p||"P2P"
}
function formatAmount(o){
let a=getOfferAvailableAmount(o),p=getPairParts(o?.pair||o?.trading_pair);
return a.toLocaleString(undefined,{maximumFractionDigits:6})+" "+(p.base||marketPair.split("_")[0])
}
function getPairParts(p){
let x=String(p||marketPair).trim().toUpperCase().replace("/","_").split("_");
return{base:x[0]||marketPair.split("_")[0],quote:x[1]||"ETB"}
}
function money(v){
let n=Number(v);
return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00"
}
function normalizeStatus(s){return String(s||"").trim().toLowerCase()}
function detail(l,v){return`<div class="detail-row"><span>${escapeHtml(l)}</span><strong>${escapeHtml(String(v??""))}</strong></div>`}
function emptyHtml(i,t,m){return`<div class="empty"><div class="empty-icon">${escapeHtml(i)}</div><strong>${escapeHtml(t)}</strong>${m?`<div style="margin-top:7px">${escapeHtml(m)}</div>`:""}</div>`}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeJs(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
function getErrorMessage(e){return e?.message||e?.details||e?.hint||"Something went wrong."}
function toast(m,t="normal"){
let e=document.getElementById("toast");clearTimeout(toastTimer);
e.textContent=String(m||"");
e.className="toast show"+(["success","error","warning"].includes(t)?" "+t:"");
toastTimer=setTimeout(()=>e.classList.remove("show"),3500)
}
document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(x=>x.classList.remove("show"))});
setInterval(()=>currentUser&&document.visibilityState==="visible"&&loadSellMarket().catch(console.error),30000);
window.addEventListener("beforeunload",()=>{
if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
if(tradeRealtimeChannel)supabaseClient.removeChannel(tradeRealtimeChannel)
});
</script>
</body>
