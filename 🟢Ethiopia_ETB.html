function eligibilityText(o){const v=o?.eligibility??o?.eligibility_requirements??o?.eligibility_requirement??o?.eligible_for??o?.eligibility_criteria??o?.requirements;if(v===undefined||v===null||v==="")return "Not set";if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean).join(" · ")||"Not set";if(typeof v==="object")return Object.entries(v).filter(([k,x])=>x!==undefined&&x!==null&&x!=="").map(([k,x])=>k+": "+String(x)).join(" · ")||"Not set";return String(v).trim()||"Not set"}

 const raw=o?.eligibility??o?.eligibility_requirements??o?.eligibility_requirement??o?.eligible_for??o?.eligibility_criteria??o?.requirements;

function paymentMethods(v){const items=(Array.isArray(v)?v:typeof v==="string"?v.split(/[,;|]/):[]).map(x=>String(x).trim()).filter(Boolean);return items.length?items.join(" · "):"Not set"}
function offerTimerText(p,o){if(p?.expires_at){const end=Date.parse(p.expires_at);if(Number.isFinite(end)){const left=Math.max(0,Math.floor((end-Date.now())/1000));return String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}return "Not set"}const v=o?.payment_time_limit??o?.payment_window_minutes??o?.time_limit_minutes??o?.payment_minutes??o?.time_limit;if(v!==undefined&&v!==null&&v!==""&&Number.isFinite(Number.parseFloat(v)))return String(v).includes("min")?String(v):String(v)+" min";return "Not set"}
function limitText(o){const min=o.min_amount??o.minimum_amount??o.min_limit??o.minimum_limit??o.min_trade_amount??o.min_order_amount;const max=o.max_amount??o.maximum_amount??o.max_limit??o.maximum_limit??o.max_trade_amount??o.max_order_amount;const fmt=v=>v===null||v===undefined||v===""?"":Number.isFinite(Number(v))?Number(v).toLocaleString(undefined,{maximumFractionDigits:2}):String(v);if(min!==undefined&&min!==null&&min!==""&&max!==undefined&&max!==null&&max!=="")return fmt(min)+" - "+fmt(max)+" ETB";if(min!==undefined&&min!==null&&min!=="")return "Min "+fmt(min)+" ETB";if(max!==undefined&&max!==null&&max!=="")return "Max "+fmt(max)+" ETB";return "Not set"}
function amount(o){if(!o)return 0;for(const v of[o.remaining_amount,o.available_amount,o.remaining])if(v!==null&&v!==undefined&&v!==""){const n=Number(v);if(Number.isFinite(n)&&n>=0)return n}const n=Number(o.amount);return Number.isFinite(n)&&n>=0?n:0}
function searchAmount(){const v=Number($("usdtSearch").value);filteredOffers=$("usdtSearch").value.trim()&&Number.isFinite(v)&&v>0?availableOffers.filter(o=>amount(o)>=v||pendingTrades.has(String(o.id))):[...availableOffers];offersExpanded=false;$("offerCount").textContent=filteredOffers.length;render()}
function levelInfo(p){const raw=Number(p?.level??p?.spending_level??p?.user_level??1),level=Number.isFinite(raw)?Math.max(1,Math.min(3,Math.floor(raw))):1;return{level,cls:level>=3?"level3":level===2?"level2":"level1",label:"Level "+level}}
function feeSpent(p){return Math.max(0,Number(p?.total_fees_paid??p?.fees_paid??p?.fee_spent??p?.total_fee_spent??p?.spending_fees??p?.fee_total??0)||0)}
function profileBadges(p){const role=String(p?.role??p?.account_type??"basic").toLowerCase(),verified=String(p?.verification_status||"").toLowerCase()==="verified"||p?.is_verified===true||p?.verified===true||p?.user_verified===true,merchant=role==="merchant"||p?.is_merchant===true||p?.merchant===true,followers=Number(p?.followers_count??p?.follower_count??p?.followers??0)||0,spent=feeSpent(p),level=spent>=4?2:spent>=2?1:0,tags=[];if(level>0)tags.push('<span class="user-badge on level'+level+'">◇ Level: '+level+'</span>');if(role!=="merchant")tags.push('<span class="user-badge on basic">■ Basic</span>');if(verified)tags.push('<span class="user-badge on verified">■ Verified</span>');if(merchant)tags.push('<span class="user-badge on merchant">■ Merchant</span>');if(followers>=10)tags.push('<span class="user-badge on famous">♡ Famous</span>');if(spent>=10)tags.push('<span class="user-badge on rich">◆ Rich</span>');return tags.join("")}
function lastSeenText(p){if(p?.show_online_status===false)return"Last seen hidden";const raw=p?.last_seen_at||p?.last_seen||p?.last_active_at,ts=raw?Date.parse(raw):NaN;if(!Number.isFinite(ts))return"Offline";let n=Math.max(0,Date.now()-ts);if(n<120000||p?.is_online===true||p?.online===true||p?.active_now===true)return"Online";const units=[["year",365*86400000],["month",30*86400000],["week",7*86400000],["day",86400000],["hour",3600000],["minute",60000]];const parts=[];for(const [name,size] of units){const amount=Math.floor(n/size);if(amount>0){parts.push(amount+" "+name+(amount===1?"":"s"));n-=amount*size;if(parts.length===2)break}}return"Last seen "+(parts.length?parts.join(" "):"just now")+" ago"}function profileStatus(p){return lastSeenText(p)==="Online"?"Online":"Offline"}
function userCard(p,id){const username=p?.username||usernameCache.get(String(id))||"User",name=p?.full_name||p?.display_name||p?.name||p?.real_name||"User",avatar=p?.avatar_url||"images/profile.png",followers=Number(p?.followers_count??p?.follower_count??0),completed=Number(p?.completed_trades??p?.trades_completed??p?.total_completed_trades??0),rate=Number(p?.completion_rate??p?.trade_completion_rate??p?.completed_rate??NaN),last=p?.last_seen||p?.last_seen_at||p?.last_active_at,active=p?.is_online===true||p?.online===true||p?.active_now===true||(last&&Date.now()-new Date(last).getTime()<60000),lv=levelInfo(p);return '<div class="market-profile"><img class="market-avatar" src="'+html(avatar)+'" onerror="this.src=\'images/profile.png\'" onclick="viewUser(\''+js(id)+'\')" alt=""><div class="market-profile-info"><div class="market-name-line"><button type="button" class="offer-user-button" onclick="viewUser(\''+js(id)+'\')">'+html(name)+'</button><span class="market-presence '+profileStatus(p).toLowerCase()+'">'+html(lastSeenText(p))+'</span></div><div class="user-badges">'+profileBadges(p)+''+'</div><div class="user-stats">'+(completed>0?'Trade(s) '+completed.toLocaleString()+' · ':'')+(Number.isFinite(rate)?'✓ '+rate.toFixed(2)+'% completion':'')+(followers>=10?' · ♡ '+followers+' followers':'')+'</div></div></div>'}
function render(){const box=$("offers");if(!filteredOffers.length){box.innerHTML=$("usdtSearch").value.trim()?empty("🔎","No buy available for this amount.","Try a smaller amount."):empty("🟢","No available buy.","Available offers will appear here.");updateView();return}box.innerHTML="";(offersExpanded?filteredOffers:filteredOffers.slice(0,15)).forEach(o=>{if(String(o.user_id)===String(currentUser.id))return;const p=pendingTrades.get(String(o.id)),mine=p&&String(p.buyer_id)===String(currentUser.id),profile=profileCache.get(String(o.user_id))||{},a=amount(o),show=a>0?a:Number(p?.amount)||0,c=document.createElement("div");c.className="offer-card";c.innerHTML=`<div class="offer-main">${userCard(profile,o.user_id)}<div style="margin-top:10px"><div style="color:#7b8790;font-size:10px">${html(currency())}</div><div class="offer-amount">Available ${html(formatAmountValue(show,o))}</div><div class="reference-limit">${html(limitText(o))}</div><div class="eligibility-required-badges">${eligibilityBadges(o)}</div></div><div style="margin-top:8px"><div style="color:#7b8790;font-size:10px">Price</div><div class="offer-price">${money(o.price)} ETB</div></div><div class="offer-method">Payment: ${html(paymentMethods(o.payment_method))}</div><div class="reference-time" data-expiry="${p?.expires_at?html(p.expires_at):""}" data-countdown="${p?.expires_at?"true":"false"}">◴ ${html(offerTimerText(p,o))}</div>${p?`<div class="pending-badge">⏳ ${html(pendingText(p))}</div>`:""}${p?`<button type="button" class="offer-trade pending" onclick="${mine?`openExisting('${js(p.id)}','${js(o.user_id)}')`:"pendingNotice()"}">${mine?"Continue Trade":pendingText(p)}</button>`:`<button type="button" class="offer-trade" onclick="openTrade('${js(o.id)}')">Buy</button>`}</div>`;box.appendChild(c)});updateView()}
function pendingText(t){const s=status(t?.status);return t?.payment_confirmed||s==="paid"||s==="payment_confirmed"?"Payment Confirmed":s==="disputed"?"Trade Disputed":"Pending Payment"}

async function openExisting(tradeId,sellerId){const u=await getUsername(sellerId),p=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});if(u)p.set("username",u);location.href="message.html?"+p}
async function openMessages(tradeId,offer){if(!tradeId||!offer?.user_id){toast("Trade started, but seller information is missing.","error");return}try{const seller=offer.user_id;let{data:c,error}=await sb.from("conversations").select("id").eq("user_one",currentUser.id).eq("user_two",seller).maybeSingle();if(error)throw error;if(!c){const r=await sb.from("conversations").select("id").eq("user_one",seller).eq("user_two",currentUser.id).maybeSingle();if(r.error)throw r.error;c=r.data}if(!c){const r=await sb.from("conversations").insert({user_one:currentUser.id,user_two:seller}).select("id").single();if(r.error){const x=await sb.from("conversations").select("id").eq("user_one",seller).eq("user_two",currentUser.id).maybeSingle();if(x.error)throw r.error;c=x.data}else c=r.data}if(!c?.id)throw Error("Conversation could not be created.");const{data:old,error:me}=await sb.from("messages").select("id").eq("conversation_id",c.id).eq("sender_id",currentUser.id).eq("message_type","order").eq("order_id",tradeId).maybeSingle();if(me)throw me;if(!old){const{error:e}=await sb.from("messages").insert({conversation_id:c.id,sender_id:currentUser.id,content:"🟢 P2P Buy started. Please complete the payment for this trade.",message_type:"order",order_id:tradeId});if(e)throw e}const u=await getUsername(seller),p=new URLSearchParams({trade_id:String(tradeId),order_id:String(tradeId)});if(u)p.set("username",u);location.href="message.html?"+p}catch(e){toast("Trade started, but the P2P trade message could not be created: "+err(e),"error")}}
function openTrade(id){selectedOffer=availableOffers.find(o=>String(o.id)===String(id));if(!selectedOffer)return toast("This available offer is no longer available. Refresh.","warning");if(String(selectedOffer.user_id)===String(currentUser.id))return toast("You cannot buy your own sell offer.","warning");const p=pendingTrades.get(String(selectedOffer.id));if(p){String(p.buyer_id)===String(currentUser.id)?openExisting(p.id,selectedOffer.user_id):pendingNotice();return}const a=amount(selectedOffer);if(!a)return toast("This available offer has no remaining amount.","warning");const cur=pairParts(selectedOffer.pair||selectedOffer.trading_pair);$("tradeTitle").textContent="Buy "+cur.base+" from Seller";$("tradeCurrency").textContent=cur.base;$("tradeAmount").value=a.toFixed(2);$("tradeAmount").min="0.01";$("tradeAmount").max=a.toFixed(2);const profile=profileCache.get(String(selectedOffer.user_id))||{};$("tradeSummary").innerHTML=`<div class="details" style="margin-bottom:12px">${detail("Seller",profile.full_name||profile.display_name||profile.name||profile.username||"Seller")}${detail("Username","@"+(profile.username||"User"))}${detail("Pair",pairName(selectedOffer))}${detail("Selling price",money(selectedOffer.price)+" "+cur.quote)}${detail("Payment",selectedOffer.payment_method||"Bank Transfer")}${detail("Available",formatAmount(selectedOffer))}</div>`;updatePreview();openModal("tradeModal")}
function pairParts(p){p=String(p||pair()).trim().toUpperCase().replace("/","_").split("_");return{base:p[0]||"USDT",quote:p[1]||"ETB"}}
function pairName(o){const p=String(o?.pair||o?.trading_pair||"");return p.includes("_")?p.replace("_"," / "):p||"P2P"}
function tradeValue(){return selectedOffer?(Number($("tradeAmount").value)||0)*(Number(selectedOffer.price)||0):0}

async function submitTrade(){if(actionLoading||!selectedOffer||!currentUser)return;const button=$("tradeSubmitButton"),a=Number($("tradeAmount").value),available=amount(selectedOffer);if(!Number.isFinite(a)||a<=0)return toast("Invalid amount.","warning");if(a>available)return toast("Amount exceeds available amount.","warning");if(Math.abs(a-available)>0.01){toast("You must buy the full available amount.","warning");$("tradeAmount").value=available.toFixed(2);updatePreview();return}if(!confirm("Buy the full available amount of "+currency()+" from the seller?"))return;actionLoading=true;button.disabled=true;button.textContent="Starting...";try{const{data:latest,error:oe}=await sb.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();if(oe)throw oe;if(!latest||String(latest.user_id)===String(currentUser.id)||String(latest.order_type).toLowerCase()!=="sell"||!["active","open"].includes(status(latest.status))||String(latest.pair||latest.trading_pair||"").toUpperCase().replace("/","_")!==pair()||amount(latest)<a)throw Error("This available offer is no longer available.");const{data:trades,error:te}=await sb.from("p2p_trades").select("id,order_id,buyer_id,seller_id,status,payment_confirmed").eq("order_id",latest.id);if(te)throw te;const active=(trades||[]).find(t=>!finished(t.status));if(active){pendingTrades.set(String(latest.id),active);closeModal("tradeModal");render();return String(active.buyer_id)===String(currentUser.id)?openExisting(active.id,latest.user_id):pendingNotice()}const{data,error}=await sb.rpc("create_p2p_trade",{p_order_id:latest.id,p_amount:a});if(error)throw error;const tradeId=extract(data);if(!tradeId)throw Error("Trade started, but the trade ID was not returned.");const offer=latest;closeModal("tradeModal");selectedOffer=null;toast("Buy trade started successfully.","success");await loadBuyMarket();await openMessages(tradeId,offer)}catch(e){toast(err(e),"error")}finally{actionLoading=false;button.disabled=false;button.textContent="St function extract(d){if(d==null)return null;if(typeof d==="string"||typeof d==="number")return d;if(typeof d==="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id}

function detail(l,v){return`<div class="detail-row"><span>${html(l)}</span><strong>${html(v??"")}</strong></div>`}

function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
function err(e){return e?.message||e?.details||e?.hint||"Something went wrong."}
