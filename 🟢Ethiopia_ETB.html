function detail(l,v){return`<div class="detail-row"><span>${html(l)}</span><strong>${html(v??"")}</strong></div>`}
function empty(i,t,m){return`<div class="empty"><div class="empty-icon">${html(i)}</div><strong>${html(t)}</strong>${m?`<div style="margin-top:7px">${html(m)}</div>`:""}</div>`}
function html(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
function err(e){return e?.message||e?.details||e?.hint||"Something went wrong."}
function openModal(id){$(id)?.classList.add("show")}
function closeModal(id){$(id)?.classList.remove("show")}
function toast(m,t="normal"){const e=$("toast");clearTimeout(toastTimer);e.textContent=m;e.className="toast show"+(["success","error","warning"].includes(t)?" "+t:"");toastTimer=setTimeout(()=>e.classList.remove("show"),3500)}
function setupRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("buy-market-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},()=>loadBuyMarket()).subscribe();if(tradeRealtimeChannel)sb.removeChannel(tradeRealtimeChannel);tradeRealtimeChannel=sb.channel("buy-trades-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},()=>loadBuyMarket()).subscribe()}
document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(x=>x.classList.remove("show"))});setInterval(()=>{if(currentUser&&document.visibilityState==="visible")loadBuyMarket()},30000);window.addEventListener("beforeunload",()=>{if(realtimeChannel)sb.removeChannel(realtimeChannel);if(tradeRealtimeChannel)sb.removeChannel(tradeRealtimeChannel)});
</script>
</body>
</html>
