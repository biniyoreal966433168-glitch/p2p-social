function pairName(o){const p=String(o?.pair||o?.trading_pair||"");return p.includes("_")?p.replace("_"," / "):p||"P2P"}
function tradeValue(){return selectedOffer?(Number($("tradeAmount").value)||0)*(Number(selectedOffer.price)||0):0}
function updatePreview(){const a=Number($("tradeAmount").value)||0,v=tradeValue(),q=pairParts(selectedOffer?.pair||selectedOffer?.trading_pair).quote||"USD";$("tradeAmountPreview").textContent=a.toLocaleString(undefined,{minimumFractionDigits:6,maximumFractionDigits:6});$("tradeValuePreview").textContent=money(v)+" "+q;$("tradeTotalPreview").textContent=money(v)+" "+q}
async function submitTrade(){if(actionLoading||!selectedOffer||!currentUser)return;const button=$("tradeSubmitButton"),a=Number($("tradeAmount").value),available=amount(selectedOffer);if(!Number.isFinite(a)||a<=0)return toast("Invalid amount.","warning");if(a>available)return toast("Amount exceeds available amount.","warning");if(Math.abs(a-available)>0.01){toast("You must buy the full available amount.","warning");$("tradeAmount").value=available.toFixed(2);updatePreview();return}if(!confirm("Buy the full available amount of "+currency()+" from the seller?"))return;actionLoading=true;button.disabled=true;button.textContent="Starting...";try{const{data:latest,error:oe}=await sb.from("p2p_orders").select("*").eq("id",selectedOffer.id).maybeSingle();if(oe)throw oe;if(!latest||String(latest.user_id)===String(currentUser.id)||String(latest.order_type).toLowerCase()!=="sell"||!["active","open"].includes(status(latest.status))||String(latest.pair||latest.trading_pair||"").toUpperCase().replace("/","_")!==pair()||amount(latest)<a)throw Error("This available sell is no longer available.");const{data:trades,error:te}=await sb.from("p2p_trades").select("id,order_id,buyer_id,seller_id,status,payment_confirmed").eq("order_id",latest.id);if(te)throw te;const active=(trades||[]).find(t=>!finished(t.status));if(active){pendingTrades.set(String(latest.id),active);closeModal("tradeModal");render();return String(active.buyer_id)===String(currentUser.id)?openExisting(active.id,latest.user_id):pendingNotice()}const{data,error}=await sb.rpc("create_p2p_trade",{p_order_id:latest.id,p_amount:a});if(error)throw error;const tradeId=extract(data);if(!tradeId)throw Error("Trade started, but the trade ID was not returned.");const offer=latest;closeModal("tradeModal");selectedOffer=null;toast("Buy trade started successfully.","success");await loadBuyMarket();await openMessages(tradeId,offer)}catch(e){toast(err(e),"error")}finally{actionLoading=false;button.disabled=false;button.textContent="Start Trade"}}
function extract(d){if(d==null)return null;if(typeof d==="string"||typeof d==="number")return d;if(typeof d==="object")return d.id||d.trade_id||d.order_id||d[0]?.id||d[0]?.trade_id||d[0]?.order_id}
function formatAmountValue(n,o){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:6})+" "+(pairParts(o?.pair||o?.trading_pair).base||"USDT")}
function formatAmount(o){return formatAmountValue(amount(o),o)}
function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:6}):"0.00"}
function detail(l,v){return`<div class="detail-row"><span>${html(l)}</span><strong>${html(v??"")}</strong></div>`}
function empty(i,t,m){return`<div class="empty"><div class="empty-icon">${html(i)}</div><strong>${html(t)}</strong>${m?`<div style="margin-top:7px">${html(m)}</div>`:""}</div>`}
function html(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r/g,"\\r").replace(/\n/g,"\\n")}
function err(e){return e?.message||e?.details||e?.hint||"Something went wrong."}
function openModal(id){$(id)?.classList.add("show")}
function closeModal(id){$(id)?.classList.remove("show")}
function toast(m,t="normal"){const e=$("toast");clearTimeout(toastTimer);e.textContent=m;e.className="toast show"+(["success","error","warning"].includes(t)?" "+t:"");toastTimer=setTimeout(()=>e.classList.remove("show"),3500)}
function setupRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("buy-market-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_orders"},()=>loadBuyMarket()).subscribe();if(tradeRealtimeChannel)sb.removeChannel(tradeRealtimeChannel);tradeRealtimeChannel=sb.channel("buy-trades-live-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"p2p_trades"},()=>loadBuyMarket()).subscribe()}
document.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.show").forEach(x=>x.classList.remove("show"))});setInterval(()=>{if(currentUser&&document.visibilityState==="visible")loadBuyMarket()},30000);window.addEventListener("beforeunload",()=>{if(realtimeChannel)sb.removeChannel(realtimeChannel);if(tradeRealtimeChannel)sb.removeChannel(tradeRealtimeChannel)});
</script></body></html>
